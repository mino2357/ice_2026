<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- CI の計算機の書体を，開発用の計算機と同じにする（文字の幅を測る検査があるため）．
     欧文は Inter，日本語は Noto Sans CJK JP．等幅は DejaVu Sans Mono と Noto Sans Mono CJK JP．
     .github/workflows/ci.yml が ~/.config/fontconfig/fonts.conf に置く． -->
<fontconfig>
  <alias binding="strong"><family>system-ui</family><prefer><family>Inter</family><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="strong"><family>ui-sans-serif</family><prefer><family>Inter</family><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="strong"><family>-apple-system</family><prefer><family>Inter</family><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Inter</family><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>DejaVu Serif</family><family>Noto Serif CJK JP</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>DejaVu Sans Mono</family><family>Noto Sans Mono CJK JP</family></prefer></alias>
  <alias binding="strong"><family>ui-monospace</family><prefer><family>DejaVu Sans Mono</family><family>Noto Sans Mono CJK JP</family></prefer></alias>
</fontconfig>
