<script type="application/json" id="docdata">{"req":{"chunks":["<h1 id=\"reqh1\">単気筒4ストロークSI機関シミュレータ 要件定義書（第25版）<\/h1>\n","<h2 id=\"reqh2\">1. 目的と範囲<\/h2>\n","<h3 id=\"reqh3\">1.1 目的<\/h3>\n<p>単気筒4ストローク火花点火機関を，連立常微分方程式<\/p>\n<p><span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\frac{d\\mathbf{y}}{dt} = \\mathbf{f}(\\mathbf{y}; \\mathbf{u}), \\qquad \\mathbf{y} \\in \\mathbb{R}^{16}\">\\frac{d\\mathbf{y}}{dt} = \\mathbf{f}(\\mathbf{y}; \\mathbf{u}), \\qquad \\mathbf{y} \\in \\mathbb{R}^{16}<\/span><\/span><\/p>\n<p>として数値積分し，ブラウザ上で実時間に可視化・解析する（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\mathbf{y}\">\\mathbf{y}<\/span><\/span>：機関の状態，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\mathbf{u}\">\\mathbf{u}<\/span><\/span>：ECU と動力計が決める入力．成分は用語の定義集 2.2）．利用者は，設定を変えたときの筒内圧・トルク・効率・音の変化を，保存則が閉じた計算の結果として確かめられる．<\/p>\n","<h3 id=\"reqh4\">1.2 対象<\/h3>\n<ul>\n<li>0 次元・単一ゾーンの開いた系の熱力学（未燃ガスと既燃ガスの比熱を分ける）<\/li>\n<li>等エントロピーのオリフィス流れによるガス交換（弁，スロットル，排気の出口）<\/li>\n<li>スロットル，吸気マニホールド，吸気ランナ，排気系の充填と慣性．吸気側へ吹き返した既燃ガスと熱の追跡<\/li>\n<li>火炎伝播の速さに連動する Wiebe 関数の燃焼，壁面熱伝達と壁温<\/li>\n<li>スライダ・クランク機構とフライホイールの回転運動，摩擦，スターター<\/li>\n<li>水ブレーキ式動力計，ECU（始動，スロットル開度の PI 制御，点火時期の自動最適化）<\/li>\n<li>線図・性能曲線・機関断面図・エンジン音による可視化，設定の変更，アプリ内の検証<\/li>\n<\/ul>\n","<h3 id=\"reqh5\">1.3 対象外<\/h3>\n<p>三元触媒，排気の熱管理，ノッキング，燃料の壁面付着と始動増量，1 次元の圧力波，多気筒．次は実装してもよいが，要件とテストに含めない：スマートフォンの横持ち（高さ <span class=\"im\"><span class=\"tx raw\" data-tex=\"500\\ \\text{px}\">500\\ \\text{px}<\/span><\/span> 未満），グラフのピンチズーム・パン，フレーム落ち時の描画の簡略化，Screen Wake Lock，<code>prefers-reduced-motion<\/code>，キーボード操作．<\/p>\n","<h3 id=\"reqh6\">1.4 利用者と利用環境<\/h3>\n<ul>\n<li>利用者：数学・物理・内燃機関の知識を持ち，モデルの式と数値解法の中身を確かめたい人．<\/li>\n<li>主対象の環境：Samsung Galaxy S26+，Android 版 Google Chrome，タッチ操作，幅 <span class=\"im\"><span class=\"tx raw\" data-tex=\"360\\ \\text{px}\">360\\ \\text{px}<\/span><\/span> 以上の縦持ち．タブレットと PC（マウス）にも対応する（REQ-15）．<\/li>\n<\/ul>\n","<h3 id=\"reqh7\">1.5 文書の体系<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>文書<\/th>\n<th>定めること<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>要件定義書<\/strong>（この文書）<\/td>\n<td>何ができることを求めるか（要求）と，その合否を測る受入基準．制約，納品条件，改訂の記録<\/td>\n<\/tr>\n<tr>\n<td><strong>仕様書<\/strong>（<code>docs/specification.md<\/code>）<\/td>\n<td>要件を満たすための具体的な定め：状態変数，支配方程式と導出，定数と既定値，数値解法，制御則，画面，音，テスト項目の手順と判定値<\/td>\n<\/tr>\n<tr>\n<td><strong>用語の定義集<\/strong>（<code>docs/glossary.md<\/code>）<\/td>\n<td>記号（単位と定義式）と用語の定義<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ol type=\"1\">\n<li>要件 REQ-nn，仕様 SPEC-nn，テスト TEST-nn は，同じ番号どうしが対応する（6 節）．<\/li>\n<li>要求は「〜できること」の形で書く．<strong>受入基準<\/strong>は数式か数値で書き，仕様書のテスト項目で判定する．自動で判定できないものは 5 節の実機目視チェックリストに載せる．どちらにも無い事項は要件ではない．<\/li>\n<li>モデルの式の導出，定数，アルゴリズム，画面の寸法，テストの手順は，この文書に書かない（仕様書に書く）．受入基準に現れる記号は用語の定義集で定義する．<\/li>\n<li>受入基準の「（TEST-nn 項目 k）」は，その基準を判定するテスト項目を示す．判定値の根拠（実測値，文献）は仕様書のテスト項目に書く．<\/li>\n<li>仕様の変更は，要件定義書 → 仕様書 → テスト → 実装の順に行う．<\/li>\n<li><strong>表記<\/strong>：句読点は「，」「．」．圧力は Pa 系（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{Pa}\">\\text{Pa}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{kPa}\">\\text{kPa}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{MPa}\">\\text{MPa}<\/span><\/span>）で表し，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{bar}\">\\text{bar}<\/span><\/span> は使わない．角度の数値は <span class=\"im\"><span class=\"tx raw\" data-tex=\"^\\circ\">^\\circ<\/span><\/span>（クランク角は <span class=\"im\"><span class=\"tx raw\" data-tex=\"^\\circ\\text{CA}\">^\\circ\\text{CA}<\/span><\/span>）．定着した日本語訳の無い術語は英語のまま書く．<\/li>\n<\/ol>\n<hr />\n","<h2 id=\"reqh8\">2. 前提と制約<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>制約<\/th>\n<th>確かめ方<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>C-1<\/td>\n<td><strong>配信形態<\/strong>：単一の HTML ファイル（JavaScript，Canvas 2D，CSS）．ネットワークなしで全機能が動く．例外は数式の組版だけで，ネットワークがあれば実行時に MathJax を読み込んで組み，無ければ数式を TeX のソースのまま表示する（どちらでも内容は読める）<\/td>\n<td>開発時検証は成果物のファイルだけを開いて全テストを実行する．MathJax の読み込みは手元の同じ版に振り向け，1 通りは読み込みを遮断する（TEST-15 項目 10，TEST-16 項目 19）<\/td>\n<\/tr>\n<tr>\n<td>C-2<\/td>\n<td><strong>操作<\/strong>：スマートフォンのタッチ操作だけで全機能を使える<\/td>\n<td>REQ-15，REQ-18，REQ-23<\/td>\n<\/tr>\n<tr>\n<td>C-3<\/td>\n<td><strong>単位<\/strong>：計算の内部は SI．画面の圧力は Pa 系（既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{kPa}\">\\text{kPa}<\/span><\/span>）で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{bar}\">\\text{bar}<\/span><\/span> を表示しない<\/td>\n<td>TEST-15 項目 3，TEST-18 項目 1<\/td>\n<\/tr>\n<tr>\n<td>C-4<\/td>\n<td><strong>保存則<\/strong>：質量，既燃ガス，エネルギーの収支が，数値積分の誤差の範囲で閉じる<\/td>\n<td>REQ-05，REQ-06，REQ-09，REQ-13<\/td>\n<\/tr>\n<tr>\n<td>C-5<\/td>\n<td><strong>決定性<\/strong>：同じ設定と同じ操作から，同じ結果が得られる（乱数は種を固定した擬似乱数だけ）<\/td>\n<td>REQ-20<\/td>\n<\/tr>\n<tr>\n<td>C-6<\/td>\n<td><strong>検証できること<\/strong>：全要件に対応するテストを持ち，自動化できる項目はアプリの「検証」タブから実行できる<\/td>\n<td>REQ-20<\/td>\n<\/tr>\n<tr>\n<td>C-7<\/td>\n<td><strong>モデルを合わせ込まない<\/strong>：実機の値に結果を合わせるための係数の調整はしない．物性値や式の誤りは直し，実機とのずれは理由とともに記録する<\/td>\n<td>REQ-24，REQ-28，7.2 節<\/td>\n<\/tr>\n<tr>\n<td>C-8<\/td>\n<td><strong>第三者の著作物を埋め込まない<\/strong>：フォントやライブラリなど第三者の著作物を成果物に含めない．数式の組版に使う MathJax（Apache License 2.0）は実行時に CDN から読み込み，その名前・版・ライセンス・読み込み元を解説タブに示す<\/td>\n<td>REQ-16 受入基準 7（TEST-16 項目 18）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n","<h2 id=\"reqh9\">3. 状態と記号<\/h2>\n<p>状態ベクトルは次の 16 成分である（単位と式は用語の定義集 2.2，仕様書 2 節）．<\/p>\n<p><span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\mathbf{y} = \\left(\\theta,\\ \\omega,\\ p,\\ m,\\ m_u,\\ T_w,\\ p_{\\text{in}},\\ m_{b,\\text{in}},\\ \\dot m_r,\\ p_p,\\ m_{b,p},\\ \\dot m_e,\\ p_{pe},\\ p_m,\\ E_{\\text{in}},\\ E_p\\right)\">\\mathbf{y} = \\left(\\theta,\\ \\omega,\\ p,\\ m,\\ m_u,\\ T_w,\\ p_{\\text{in}},\\ m_{b,\\text{in}},\\ \\dot m_r,\\ p_p,\\ m_{b,p},\\ \\dot m_e,\\ p_{pe},\\ p_m,\\ E_{\\text{in}},\\ E_p\\right)<\/span><\/span><\/p>\n<p><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta\">\\theta<\/span><\/span>：クランク角，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\omega\">\\omega<\/span><\/span>：角速度，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>：筒内圧，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m\">m<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_u\">m_u<\/span><\/span>：筒内ガスの全質量と未燃ガスの質量，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_w\">T_w<\/span><\/span>：壁温，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{in}}\">p_{\\text{in}}<\/span><\/span>：吸気マニホールド圧，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{b,\\text{in}}\">m_{b,\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{b,p}\">m_{b,p}<\/span><\/span>：マニホールドとポートの既燃ガスの質量，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_r\">\\dot m_r<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_p\">p_p<\/span><\/span>：吸気ランナの流量と吸気ポート圧，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_e\">\\dot m_e<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{pe}\">p_{pe}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_m\">p_m<\/span><\/span>：排気管の流量，排気ポート圧，消音器の圧力，<span class=\"im\"><span class=\"tx raw\" data-tex=\"E_{\\text{in}}\">E_{\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"E_p\">E_p<\/span><\/span>：マニホールドとポートの余剰エンタルピー．<\/p>\n<p>受入基準で使う増分 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta\">\\Delta<\/span><\/span> は，指定した区間（サイクル）での補助積分（用語の定義集 2.3）または状態の増分を表す．<\/p>\n<hr />\n","<h2 id=\"reqh10\">4. 要件<\/h2>\n","<h3 id=\"reqh11\">REQ-01：スライダ・クランク運動学<\/h3>\n<p><strong>要求<\/strong>：ボア <span class=\"im\"><span class=\"tx raw\" data-tex=\"B\">B<\/span><\/span>，ストローク <span class=\"im\"><span class=\"tx raw\" data-tex=\"S\">S<\/span><\/span>，クランク半径 <span class=\"im\"><span class=\"tx raw\" data-tex=\"r = S/2\">r = S/2<\/span><\/span>，連桿長 <span class=\"im\"><span class=\"tx raw\" data-tex=\"l\">l<\/span><\/span>，連桿比 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lambda = r/l\">\\lambda = r/l<\/span><\/span>，圧縮比 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon\">\\varepsilon<\/span><\/span> から，行程容積 <span class=\"im\"><span class=\"tx raw\" data-tex=\"V_d\">V_d<\/span><\/span>，隙間容積 <span class=\"im\"><span class=\"tx raw\" data-tex=\"V_c\">V_c<\/span><\/span>，上死点からのピストン変位 <span class=\"im\"><span class=\"tx raw\" data-tex=\"x(\\theta)\">x(\\theta)<\/span><\/span>，筒内容積 <span class=\"im\"><span class=\"tx raw\" data-tex=\"V(\\theta)\">V(\\theta)<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{dV}{d\\theta}\">\\frac{dV}{d\\theta}<\/span><\/span>，伝熱面積 <span class=\"im\"><span class=\"tx raw\" data-tex=\"A_w(\\theta)\">A_w(\\theta)<\/span><\/span> を求めること．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li><span class=\"im\"><span class=\"tx raw\" data-tex=\"V(0) = V_c\">V(0) = V_c<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"V(\\pi) = V_c + V_d\">V(\\pi) = V_c + V_d<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dfrac{V(\\pi)}{V(0)} = \\varepsilon\">\\dfrac{V(\\pi)}{V(0)} = \\varepsilon<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>．TEST-01 項目 1）．<\/li>\n<li>解析式の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dfrac{dV}{d\\theta}\">\\dfrac{dV}{d\\theta}<\/span><\/span> が，<span class=\"im\"><span class=\"tx raw\" data-tex=\"V(\\theta)\">V(\\theta)<\/span><\/span> の中心差分と相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span> 未満で一致する（項目 2）．<\/li>\n<li>設定できる諸元の全範囲（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lambda \\le 0.5\">\\lambda \\le 0.5<\/span><\/span>）で <span class=\"im\"><span class=\"tx raw\" data-tex=\"V(\\theta) &gt; 0\">V(\\theta) &gt; 0<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0 \\le x(\\theta) \\le S\">0 \\le x(\\theta) \\le S<\/span><\/span>（項目 3）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-01　<strong>検証<\/strong>：TEST-01<\/p>\n<hr />\n","<h3 id=\"reqh12\">REQ-02：作動流体の熱物性（未燃・既燃の比熱）<\/h3>\n<p><strong>要求<\/strong>：筒内ガスを理想気体（<span class=\"im\"><span class=\"tx raw\" data-tex=\"pV = mRT\">pV = mRT<\/span><\/span>）とし，比熱を<strong>未燃ガス（新気の混合気）と既燃ガスで分け<\/strong>，未燃分率で補間すること．内部エネルギーとエンタルピーは比熱の積分で与え，REQ-09 のエネルギーの式と整合させること．比較用に定比熱比のモデルへ切り替えられること．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li>全ての温度（<span class=\"im\"><span class=\"tx raw\" data-tex=\"300 \\le T \\le 3000\\ \\text{K}\">300 \\le T \\le 3000\\ \\text{K}<\/span><\/span>）と未燃分率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"Y\">Y<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"c_p - c_v = R\">c_p - c_v = R<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma = c_p/c_v\">\\gamma = c_p/c_v<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>．TEST-02 項目 2）．<\/li>\n<li>内部エネルギーが比熱の積分である：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dfrac{de_k}{dT} = c_{v,k}(T)\">\\dfrac{de_k}{dT} = c_{v,k}(T)<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"k = u, b\">k = u, b<\/span><\/span>．数値微分との相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-6}\">10^{-6}<\/span><\/span>），<span class=\"im\"><span class=\"tx raw\" data-tex=\"e_k(T_0) = 0\">e_k(T_0) = 0<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"e_k\">e_k<\/span><\/span> は連続（項目 3）．<\/li>\n<li>比熱比が文献の当てはめを再現する：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_u(300\\ \\text{K}) = 1.3488\">\\gamma_u(300\\ \\text{K}) = 1.3488<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_u(700\\ \\text{K}) = 1.2968\">\\gamma_u(700\\ \\text{K}) = 1.2968<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_b(2000\\ \\text{K}) = 1.2080\">\\gamma_b(2000\\ \\text{K}) = 1.2080<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_b(2700\\ \\text{K}) = 1.1422\">\\gamma_b(2700\\ \\text{K}) = 1.1422<\/span><\/span>（絶対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>．項目 1）．<\/li>\n<li>定比熱比モデル（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma = 1.35\">\\gamma = 1.35<\/span><\/span>）に切り替えられる（項目 5）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-02　<strong>検証<\/strong>：TEST-02<\/p>\n<hr />\n","<h3 id=\"reqh13\">REQ-03：カムプロファイルと弁の有効開口面積<\/h3>\n<p><strong>要求<\/strong>：吸気弁と排気弁の開閉時期，最大リフト，弁径から，クランク角ごとのリフトと有効開口面積を求めること．カムプロファイルを 3 種類から選べること．カムの位相を運転中に変えられること（VVT）．弁とピストンの干渉を警告すること．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li>3 種のカムとも，開閉点でリフトが <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>，作用角の中央で <span class=\"im\"><span class=\"tx raw\" data-tex=\"L_{\\max}\">L_{\\max}<\/span><\/span>（TEST-03 項目 1〜3）．<\/li>\n<li>位相 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varphi\">\\varphi<\/span><\/span> はリフト曲線を平行移動するだけである：<span class=\"im\"><span class=\"tx raw\" data-tex=\"L_v(\\theta; \\varphi) = L_v(\\theta - \\varphi; 0)\">L_v(\\theta; \\varphi) = L_v(\\theta - \\varphi; 0)<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>．項目 5）．<\/li>\n<li><span class=\"im\"><span class=\"tx raw\" data-tex=\"L_v(\\theta) \\ge h_c + x(\\theta)\">L_v(\\theta) \\ge h_c + x(\\theta)<\/span><\/span> となるクランク角があるとき，かつそのときに限り <code>VALVE HIT<\/code> を表示する（項目 6）．<\/li>\n<li>運転中に位相を変えても状態量が有限のままで，体積効率が <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\%\">1\\%<\/span><\/span> 以上変わる（項目 7）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-03　<strong>検証<\/strong>：TEST-03<\/p>\n<hr />\n","<h3 id=\"reqh14\">REQ-04：オリフィスの圧縮性流れ（順流・逆流・チョーク）<\/h3>\n<p><strong>要求<\/strong>：弁，スロットル，テールパイプ出口を通る質量流量を，等エントロピー流れのオリフィスの式で求めること．チョークと逆流を扱うこと．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li><span class=\"im\"><span class=\"tx raw\" data-tex=\"p_1 = p_2\">p_1 = p_2<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m = 0\">\\dot m = 0<\/span><\/span>（厳密）．上流の温度と比熱比が同じなら <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m(p_1, p_2) = -\\dot m(p_2, p_1)\">\\dot m(p_1, p_2) = -\\dot m(p_2, p_1)<\/span><\/span>（TEST-04 項目 1）．<\/li>\n<li>圧力比 <span class=\"im\"><span class=\"tx raw\" data-tex=\"r_p\">r_p<\/span><\/span> が臨界圧力比 <span class=\"im\"><span class=\"tx raw\" data-tex=\"r_{\\text{crit}} = \\left(\\dfrac{2}{\\gamma_0 + 1}\\right)^{\\gamma_0/(\\gamma_0 - 1)}\">r_{\\text{crit}} = \\left(\\dfrac{2}{\\gamma_0 + 1}\\right)^{\\gamma_0/(\\gamma_0 - 1)}<\/span><\/span> 以下では流量が <span class=\"im\"><span class=\"tx raw\" data-tex=\"r_p\">r_p<\/span><\/span> によらない．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_0 = 1.4\">\\gamma_0 = 1.4<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"r_{\\text{crit}} = 0.5282817877\">r_{\\text{crit}} = 0.5282817877<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Psi = 0.68473145\">\\Psi = 0.68473145<\/span><\/span>（項目 2）．<\/li>\n<li>流量関数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Psi(r_p)\">\\Psi(r_p)<\/span><\/span> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"r_{\\text{crit}} &lt; r_p \\le 1\">r_{\\text{crit}} &lt; r_p \\le 1<\/span><\/span> で連続かつ単調減少で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Psi(1) = 0\">\\Psi(1) = 0<\/span><\/span>（項目 3）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-04　<strong>検証<\/strong>：TEST-04<\/p>\n<hr />\n","<h3 id=\"reqh15\">REQ-05：スロットルと吸気マニホールド<\/h3>\n<p><strong>要求<\/strong>：スロットル開度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha\">\\alpha<\/span><\/span> から，スロットルの質量流量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{th}}\">\\dot m_{\\text{th}}<\/span><\/span> と吸気マニホールド圧 <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{in}}\">p_{\\text{in}}<\/span><\/span> の変化を求めること．大気圧を設定で変えられること．吸気側へ吹き返した筒内ガスの<strong>既燃分<\/strong>と<strong>熱<\/strong>を追跡し，次の吸気で筒内へ戻すこと．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li><strong>質量<\/strong>：吸気弁を閉じたとき <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\displaystyle\\int\\dot m_{\\text{th}}\\,dt = \\frac{V_{\\text{in}}}{RT_{\\text{in}}}\\,\\Delta p_{\\text{in}}\">\\displaystyle\\int\\dot m_{\\text{th}}\\,dt = \\frac{V_{\\text{in}}}{RT_{\\text{in}}}\\,\\Delta p_{\\text{in}}<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-6}\">10^{-6}<\/span><\/span>）．周期定常で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta M_{\\text{th}} = \\Delta M_{\\text{in}}\">\\Delta M_{\\text{th}} = \\Delta M_{\\text{in}}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.2\\%\">0.2\\%<\/span><\/span>．TEST-05 項目 2，4）．<\/li>\n<li><strong>既燃ガス<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta\\left(m_{b,\\text{in}} + m_{b,p}\\right) = \\Delta B_o - \\Delta B_i\">\\Delta\\left(m_{b,\\text{in}} + m_{b,p}\\right) = \\Delta B_o - \\Delta B_i<\/span><\/span>（差が <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-3}\\,\\Delta B_o\">10^{-3}\\,\\Delta B_o<\/span><\/span> 以下）．周期定常で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta B_o = \\Delta B_i\">\\Delta B_o = \\Delta B_i<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\%\">2\\%<\/span><\/span>．項目 7）．<\/li>\n<li><strong>熱<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta\\left(E_{\\text{in}} + E_p\\right) = \\Delta X_o - \\Delta X_i - \\Delta X_t\">\\Delta\\left(E_{\\text{in}} + E_p\\right) = \\Delta X_o - \\Delta X_i - \\Delta X_t<\/span><\/span>（差が <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-6}\\,\\Delta X_o\">10^{-6}\\,\\Delta X_o<\/span><\/span> 以下）．周期定常で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta X_o = \\Delta X_i\">\\Delta X_o = \\Delta X_i<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\%\">2\\%<\/span><\/span>．項目 8）．<\/li>\n<li>アイドルで，吸気弁の順流の上流温度の流量加重平均が <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{in}} + 15\\ \\text{K}\">T_{\\text{in}} + 15\\ \\text{K}<\/span><\/span> 以上（吹き返しが吸気を温める．項目 9）．<\/li>\n<li>全時刻で <span class=\"im\"><span class=\"tx raw\" data-tex=\"0 \\le Y_{b,\\text{in}} \\le 1\">0 \\le Y_{b,\\text{in}} \\le 1<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0 \\le Y_{b,p} \\le 1\">0 \\le Y_{b,p} \\le 1<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"E_{\\text{in}} \\ge 0\">E_{\\text{in}} \\ge 0<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"E_p \\ge 0\">E_p \\ge 0<\/span><\/span>（項目 6）．<\/li>\n<li>チョークしたスロットルの流量が大気圧 <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{atm}}\">p_{\\text{atm}}<\/span><\/span> に比例する（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>．項目 3）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-05　<strong>検証<\/strong>：TEST-05<\/p>\n<hr />\n","<h3 id=\"reqh16\">REQ-06：筒内の組成（未燃ガスと既燃ガス）<\/h3>\n<p><strong>要求<\/strong>：筒内の全質量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"m\">m<\/span><\/span> と未燃ガスの質量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_u\">m_u<\/span><\/span> の保存則を解き，吹き返し，内部 EGR，吹き抜けを追跡すること．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li>全時刻で <span class=\"im\"><span class=\"tx raw\" data-tex=\"0 \\le m_u \\le m\">0 \\le m_u \\le m<\/span><\/span>（TEST-06 項目 1）．<\/li>\n<li><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta m = \\Delta M_{\\text{in}} - \\Delta M_{\\text{ex}}\">\\Delta m = \\Delta M_{\\text{in}} - \\Delta M_{\\text{ex}}<\/span><\/span>（差が 1 サイクルの吸入質量の <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-6}\">10^{-6}<\/span><\/span> 以下．項目 2）．<\/li>\n<li>排気弁が開く時点で <span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_u &lt; 0.01\">Y_u &lt; 0.01<\/span><\/span>（項目 1）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-06　<strong>検証<\/strong>：TEST-06<\/p>\n<hr />\n","<h3 id=\"reqh17\">REQ-07：燃焼（乱流火炎伝播に連動する単一 Wiebe モデル）<\/h3>\n<p><strong>要求<\/strong>：点火時期，当量比 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi\">\\phi<\/span><\/span>，残留ガス率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r\">x_r<\/span><\/span>，回転数に応じて，着火遅れと燃焼期間が変わること．着火遅れと熱発生の速さを利用者が係数で調整できること．リッチ側の不完全燃焼を扱うこと．燃焼をサイクルごとにばらつかせられること．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\displaystyle\\int_0^1\\frac{dx_b}{d\\zeta}\\,d\\zeta = 1 - e^{-a}\">\\displaystyle\\int_0^1\\frac{dx_b}{d\\zeta}\\,d\\zeta = 1 - e^{-a}<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-5}\">10^{-5}<\/span><\/span>．TEST-07 項目 1）．<\/li>\n<li>層流燃焼速度が文献の値を再現する：<span class=\"im\"><span class=\"tx raw\" data-tex=\"S_{L,0}(\\phi = 1.13) = 0.2758\\ \\text{m/s}\">S_{L,0}(\\phi = 1.13) = 0.2758\\ \\text{m/s}<\/span><\/span>．残留ガス率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r = 0.2\">x_r = 0.2<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r = 0\">x_r = 0<\/span><\/span> の <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.58\">0.58<\/span><\/span> 倍（項目 2）．<\/li>\n<li>残留ガスが増えると <span class=\"im\"><span class=\"tx raw\" data-tex=\"S_L\">S_L<\/span><\/span> が下がり，点火を遅らせると燃焼期間が延びる（項目 3）．調整係数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"c_d = 2\">c_d = 2<\/span><\/span> で着火遅れが 2 倍，<span class=\"im\"><span class=\"tx raw\" data-tex=\"c_b = 2\">c_b = 2<\/span><\/span> で燃焼期間が半分（項目 4）．<\/li>\n<li>開度固定で，IMEP が当量比 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1\">\\phi = 1<\/span><\/span> で最大になる（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 0.8 &lt; 0.9 &lt; 1.0 &gt; 1.1 &gt; 1.2\">\\phi = 0.8 &lt; 0.9 &lt; 1.0 &gt; 1.1 &gt; 1.2<\/span><\/span>．項目 6）．<\/li>\n<li>リッチ側の生成物が元素の保存と水性ガスシフト平衡 <span class=\"im\"><span class=\"tx raw\" data-tex=\"K_w = 3.5\">K_w = 3.5<\/span><\/span> を満たし，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi\\,\\epsilon(\\phi)\">\\phi\\,\\epsilon(\\phi)<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi \\ge 1\">\\phi \\ge 1<\/span><\/span> で単調に減る（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1.1\">\\phi = 1.1<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.969 \\pm 0.002\">0.969 \\pm 0.002<\/span><\/span>．項目 5）．<\/li>\n<li>サイクル変動 ON で，IMEP の変動係数が <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5\">0.5<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"5\\%\">5\\%<\/span><\/span>，平均 IMEP が OFF と <span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\%\">2\\%<\/span><\/span> 以内で，同じ初期状態から同じ結果になる（項目 8，9）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-07　<strong>検証<\/strong>：TEST-07<\/p>\n<hr />\n","<h3 id=\"reqh18\">REQ-08：壁面熱伝達と壁温<\/h3>\n<p><strong>要求<\/strong>：筒内ガスからシリンダ壁への熱流量を Woschni の式で求め，壁温の変化を連立して解くこと．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li><span class=\"im\"><span class=\"tx raw\" data-tex=\"C_w = 0\">C_w = 0<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot Q_{\\text{wall}} = 0\">\\dot Q_{\\text{wall}} = 0<\/span><\/span>（TEST-08 項目 1）．<\/li>\n<li>燃焼による増圧（<span class=\"im\"><span class=\"tx raw\" data-tex=\"p &gt; p_{\\text{mot}}\">p &gt; p_{\\text{mot}}<\/span><\/span>）で熱伝達率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"h_c\">h_c<\/span><\/span> が増える（項目 2）．<\/li>\n<li><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot Q_{\\text{wall}} = 0\">\\dot Q_{\\text{wall}} = 0<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_w = 300\\ \\text{K}\">T_w = 300\\ \\text{K}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dfrac{dT_w}{dt} = \\dfrac{G_{\\text{cool}}\\,(T_{\\text{cool}} - T_w)}{C_{w,\\text{th}}} = 0.6\\ \\text{K/s}\">\\dfrac{dT_w}{dt} = \\dfrac{G_{\\text{cool}}\\,(T_{\\text{cool}} - T_w)}{C_{w,\\text{th}}} = 0.6\\ \\text{K/s}<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>．項目 3）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-08　<strong>検証<\/strong>：TEST-08<\/p>\n<hr />\n","<h3 id=\"reqh19\">REQ-09：筒内圧の式（開いた系の熱力学第一法則）<\/h3>\n<p><strong>要求<\/strong>：質量の出入りと燃焼を伴う筒内ガスのエネルギー保存と状態方程式から，筒内圧の時間微分を導いて解くこと．比熱が温度と組成で変わっても，第一法則が閉じること．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li>定比熱比・断熱・閉じた系で <span class=\"im\"><span class=\"tx raw\" data-tex=\"pV^{\\gamma_0}\">pV^{\\gamma_0}<\/span><\/span> が一定：<span class=\"im\"><span class=\"tx raw\" data-tex=\"p(2\\pi) = p(\\pi)\\,\\varepsilon^{\\gamma_0}\">p(2\\pi) = p(\\pi)\\,\\varepsilon^{\\gamma_0}<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-5}\">10^{-5}<\/span><\/span>），1 往復の図示仕事が <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>（TEST-09 項目 1）．<\/li>\n<li>温度依存比熱・断熱・閉じた系で <span class=\"im\"><span class=\"tx raw\" data-tex=\"m\\left[e_k(T_{\\text{end}}) - e_k(T_{\\text{start}})\\right] = -\\displaystyle\\int p\\,dV\">m\\left[e_k(T_{\\text{end}}) - e_k(T_{\\text{start}})\\right] = -\\displaystyle\\int p\\,dV<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-6}\">10^{-6}<\/span><\/span>．未燃ガスだけ，既燃ガスだけのそれぞれ．項目 2）．<\/li>\n<li>周期定常（アイドル，部分負荷，全開）で，第一法則の残差が発熱の <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-4}\">10^{-4}<\/span><\/span> 以下（項目 3）： <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\left|\\Delta U_s + \\Delta W + \\Delta Q_w - \\Delta Q_c - \\Delta H_i + \\Delta H_o\\right| \\le 10^{-4}\\,\\Delta Q_c\">\\left|\\Delta U_s + \\Delta W + \\Delta Q_w - \\Delta Q_c - \\Delta H_i + \\Delta H_o\\right| \\le 10^{-4}\\,\\Delta Q_c<\/span><\/span><\/li>\n<li>全開で，壁面熱損失の割合 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta Q_w/\\Delta Q_c\">\\Delta Q_w/\\Delta Q_c<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.10\">0.10<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.30\">0.30<\/span><\/span>，最高ガス温度が <span class=\"im\"><span class=\"tx raw\" data-tex=\"2200\">2200<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"2700\\ \\text{K}\">2700\\ \\text{K}<\/span><\/span>（項目 4）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-09　<strong>検証<\/strong>：TEST-09<\/p>\n<hr />\n","<h3 id=\"reqh20\">REQ-10：回転運動，摩擦，スターター<\/h3>\n<p><strong>要求<\/strong>：クランク軸とフライホイールの回転の運動方程式を解き，スターターによる始動から完爆，自力運転，エンストまでの角速度の変化を再現すること．検証と性能曲線の計測のために，回転数を固定するモードを持つこと．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{FMEP}(p_{\\max} = 5000\\ \\text{kPa},\\ 3000\\ \\text{rpm}) = 178.02\\ \\text{kPa}\">\\text{FMEP}(p_{\\max} = 5000\\ \\text{kPa},\\ 3000\\ \\text{rpm}) = 178.02\\ \\text{kPa}<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>．TEST-10 項目 1）．<\/li>\n<li>燃料 OFF のクランキングで，平均角速度がスターターと摩擦のつり合い <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\omega_{\\text{eq}}\">\\omega_{\\text{eq}}<\/span><\/span> の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 15\\%\">\\pm 15\\%<\/span><\/span> 以内で，完爆と判定しない（項目 2）．<\/li>\n<li>コールドリセットから START で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"3\\ \\text{s}\">3\\ \\text{s}<\/span><\/span> 以内に完爆と判定し，その後はスターターのトルクが <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>（項目 3）．<\/li>\n<li>定常サイクルで <span class=\"im\"><span class=\"tx raw\" data-tex=\"W_f = \\text{FMEP}\\cdot V_d\">W_f = \\text{FMEP}\\cdot V_d<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span>．項目 4）．<\/li>\n<li><span class=\"im\"><span class=\"tx raw\" data-tex=\"p = p_{\\text{atm}}\">p = p_{\\text{atm}}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{ind}} = 0\">T_{\\text{ind}} = 0<\/span><\/span>．回転数固定のモードで <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dfrac{d\\omega}{dt} = 0\">\\dfrac{d\\omega}{dt} = 0<\/span><\/span>．逆転しない（項目 5）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-10　<strong>検証<\/strong>：TEST-10<\/p>\n<hr />\n","<h3 id=\"reqh21\">REQ-11：水ブレーキ式動力計と運転モード<\/h3>\n<p><strong>要求<\/strong>：機関に負荷を与え，軸トルク・軸出力・BMEP を評価するための水ブレーキ式動力計を持つこと．動力計は吸収専用とする．回転数を制御する方法を 2 つのモードから選べること．<\/p>\n<ul>\n<li><strong>スロットル制御<\/strong>（モード A）：ECU がスロットル開度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha\">\\alpha<\/span><\/span> を PI 制御して目標回転数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"N_{\\text{target}}\">N_{\\text{target}}<\/span><\/span> に合わせる（REQ-12）．動力計の充水率の指令は設定の一定値 <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{manual}}\">f_{\\text{manual}}<\/span><\/span>（既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>）．<\/li>\n<li><strong>動力計制御<\/strong>（モード B）：スロットル開度は設定の一定値 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha_{\\text{manual}}\">\\alpha_{\\text{manual}}<\/span><\/span>（既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"15^\\circ\">15^\\circ<\/span><\/span>）とし，動力計の充水率を PI 制御して <span class=\"im\"><span class=\"tx raw\" data-tex=\"N_{\\text{target}}\">N_{\\text{target}}<\/span><\/span> に保つ．定常点のトルク・出力・燃費の取得に使う．<\/li>\n<\/ul>\n<p>2 つの制御が同時に回転数を操作しないよう，モードは排他とする．完爆前はどちらのモードも <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{cmd}} = 0\">f_{\\text{cmd}} = 0<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha = \\alpha_{\\text{crank}}\">\\alpha = \\alpha_{\\text{crank}}<\/span><\/span>．画面では「スロットル制御」「動力計制御」と呼び，設定の項目名は「回転数の制御」，選択肢は「スロットル」「動力計」とする．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{dyno}} = f_{\\text{eff}}\\,k_w\\,\\omega^2\">T_{\\text{dyno}} = f_{\\text{eff}}\\,k_w\\,\\omega^2<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{dyno}}(f_{\\text{eff}} = 1,\\ \\omega_{\\text{rated}}) = T_{\\text{rated}}\">T_{\\text{dyno}}(f_{\\text{eff}} = 1,\\ \\omega_{\\text{rated}}) = T_{\\text{rated}}<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>．TEST-11 項目 1）．<\/li>\n<li>充水率の指令を <span class=\"im\"><span class=\"tx raw\" data-tex=\"0 \\to 1\">0 \\to 1<\/span><\/span> にすると，<span class=\"im\"><span class=\"tx raw\" data-tex=\"t = \\tau_d\">t = \\tau_d<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{eff}} = 1 - e^{-1}\">f_{\\text{eff}} = 1 - e^{-1}<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span>．積分の刻みによらない．項目 2）．<\/li>\n<li>スロットル制御の定常で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\overline{T_b} = \\overline{T_{\\text{dyno}}}\">\\overline{T_b} = \\overline{T_{\\text{dyno}}}<\/span><\/span>（相対差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\%\">2\\%<\/span><\/span>．項目 3）．<\/li>\n<li>動力計制御で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N\">\\bar N<\/span><\/span> の平均が目標の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 10\\ \\text{rpm}\">\\pm 10\\ \\text{rpm}<\/span><\/span>，瞬時値が <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 25\\ \\text{rpm}\">\\pm 25\\ \\text{rpm}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"1500\\ \\text{rpm}\">1500\\ \\text{rpm}<\/span><\/span>，開度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"15^\\circ\">15^\\circ<\/span><\/span>．項目 4）．<\/li>\n<li>機関の出力が足りないとき <code>UNDERPOWER<\/code>，動力計の容量が足りないとき <code>OVERLOAD<\/code> を表示し，張り付いている間は積分の状態が増え続けない．目標を届く値にすると制御に戻る（項目 5，7）．<\/li>\n<li>制御方式を切り替えた直後に指令が跳ばない：<span class=\"im\"><span class=\"tx raw\" data-tex=\"|\\Delta f_{\\text{cmd}}| \\le 10^{-3}\">|\\Delta f_{\\text{cmd}}| \\le 10^{-3}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"|\\Delta\\alpha| \\le 0.01^\\circ\">|\\Delta\\alpha| \\le 0.01^\\circ<\/span><\/span>（項目 8）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-11　<strong>検証<\/strong>：TEST-11<\/p>\n<hr />\n","<h3 id=\"reqh22\">REQ-12：ECU（スロットル開度の PI 制御と点火時期の自動最適化）<\/h3>\n<p><strong>要求<\/strong>：完爆後，スロットル開度を操作して回転数を目標に合わせること（スロットル制御）．補機の負荷が大きくても冷間始動できること．点火時期を，図示仕事が最大になる時期（MBT）へ自動で合わせられること．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li>アイドル（目標 <span class=\"im\"><span class=\"tx raw\" data-tex=\"800\\ \\text{rpm}\">800\\ \\text{rpm}<\/span><\/span>）で，最後の <span class=\"im\"><span class=\"tx raw\" data-tex=\"3\\ \\text{s}\">3\\ \\text{s}<\/span><\/span> の <span class=\"im\"><span class=\"tx raw\" data-tex=\"|\\bar N - 800| \\le 25\\ \\text{rpm}\">|\\bar N - 800| \\le 25\\ \\text{rpm}<\/span><\/span>．目標 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1200\\ \\text{rpm}\">1200\\ \\text{rpm}<\/span><\/span>，大気圧 <span class=\"im\"><span class=\"tx raw\" data-tex=\"80\\ \\text{kPa}\">80\\ \\text{kPa}<\/span><\/span> でも <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 25\\ \\text{rpm}\">\\pm 25\\ \\text{rpm}<\/span><\/span>（TEST-12 項目 1〜3）．<\/li>\n<li>開度が上限に張り付いている間，積分の状態 <span class=\"im\"><span class=\"tx raw\" data-tex=\"I_\\alpha\">I_\\alpha<\/span><\/span> が増え続けない（項目 4）．<\/li>\n<li>点火時期の自動最適化で CA50 が上死点後 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10 \\pm 0.5^\\circ\">10 \\pm 0.5^\\circ<\/span><\/span> になり，そのときの IMEP が，点火時期を <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 4^\\circ\">\\pm 4^\\circ<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 8^\\circ\">\\pm 8^\\circ<\/span><\/span> 振ったときの最大の <span class=\"im\"><span class=\"tx raw\" data-tex=\"99\\%\">99\\%<\/span><\/span> 以上（項目 6，7）．<\/li>\n<li>開度の下限が <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha_{\\min} = \\min\\left(\\alpha_{\\max},\\ \\max\\left(0,\\ \\alpha_{\\text{base}} + k_T T_{\\text{aux}} - \\delta_\\alpha\\right)\\right)\">\\alpha_{\\min} = \\min\\left(\\alpha_{\\max},\\ \\max\\left(0,\\ \\alpha_{\\text{base}} + k_T T_{\\text{aux}} - \\delta_\\alpha\\right)\\right)<\/span><\/span> である（<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{aux}} = 0, 2, 20\\ \\text{N·m}\">T_{\\text{aux}} = 0, 2, 20\\ \\text{N·m}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"2^\\circ\">2^\\circ<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"2.52^\\circ\">2.52^\\circ<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"7.2^\\circ\">7.2^\\circ<\/span><\/span>．項目 9）．<\/li>\n<li>補機の負荷 <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{aux}} = 0, 6, 10\\ \\text{N·m}\">T_{\\text{aux}} = 0, 6, 10\\ \\text{N·m}<\/span><\/span> の冷間始動で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"3\\ \\text{s}\">3\\ \\text{s}<\/span><\/span> 以内に完爆して止まらず，完爆後の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N \\ge 450\\ \\text{rpm}\">\\bar N \\ge 450\\ \\text{rpm}<\/span><\/span>，吸気管圧 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ge 6\\ \\text{kPa}\">\\ge 6\\ \\text{kPa}<\/span><\/span>（項目 10）．<\/li>\n<li>下限が制御を妨げない：目標 <span class=\"im\"><span class=\"tx raw\" data-tex=\"600\\ \\text{rpm}\">600\\ \\text{rpm}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N\">\\bar N<\/span><\/span> の平均が <span class=\"im\"><span class=\"tx raw\" data-tex=\"600 \\pm 25\\ \\text{rpm}\">600 \\pm 25\\ \\text{rpm}<\/span><\/span>（項目 11）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-12　<strong>検証<\/strong>：TEST-12<\/p>\n<hr />\n","<h3 id=\"reqh23\">REQ-13：数値積分<\/h3>\n<p><strong>要求<\/strong>：状態 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\mathbf{y}\">\\mathbf{y}<\/span><\/span> と補助積分 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\mathbf{z}\">\\mathbf{z}<\/span><\/span> を，4 次の古典的 Runge–Kutta 法（RK4，固定刻み）または 5(4) 次の Dormand–Prince 法（DOPRI5，刻みの自動調整）で積分すること．既定は DOPRI5．弁の開閉・点火・サイクルの終端でステップを切ること．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li>次数：刻みを半分にすると，RK4 の大域誤差が <span class=\"im\"><span class=\"tx raw\" data-tex=\"1/16\">1/16<\/span><\/span>，DOPRI5 の 1 ステップの誤差が <span class=\"im\"><span class=\"tx raw\" data-tex=\"1/64\">1/64<\/span><\/span> になる（TEST-13 項目 1，2）．<\/li>\n<li>既定の刻みの精度：部分負荷の <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\max}\">p_{\\max}<\/span><\/span> と図示仕事が参照解（刻み <span class=\"im\"><span class=\"tx raw\" data-tex=\"1/5\">1/5<\/span><\/span>）と相対差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.1\\%\">0.1\\%<\/span><\/span> 以内．アイドルの RK4 の IMEP が参照解と <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5\\%\">0.5\\%<\/span><\/span> 以内（項目 3，4）．<\/li>\n<li>イベント（サイクルの終端，弁の開閉，点火）で，ステップの終端の角度とイベントの角度の差が <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-8}\\ \\text{rad}\">10^{-8}\\ \\text{rad}<\/span><\/span> 以下．各イベントは 1 サイクルに 1 回処理され，常に <span class=\"im\"><span class=\"tx raw\" data-tex=\"0 \\le \\theta \\le 4\\pi\">0 \\le \\theta \\le 4\\pi<\/span><\/span>（項目 5）．<\/li>\n<li>回転数固定でサイクルの時間が <span class=\"im\"><span class=\"tx raw\" data-tex=\"t_c = \\dfrac{4\\pi}{\\omega}\">t_c = \\dfrac{4\\pi}{\\omega}<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span>．項目 6）．<\/li>\n<li>非物理的な値を防ぐ射影と，誤差が許容を超えたままの強制受理が，通常の運転で一度も起きない（項目 7）．<\/li>\n<li>周期定常で，各断面を通った質量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta M_{\\text{th}}\">\\Delta M_{\\text{th}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta M_r\">\\Delta M_r<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta M_{\\text{in}}\">\\Delta M_{\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta M_{\\text{ex}}\">\\Delta M_{\\text{ex}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta M_e\">\\Delta M_e<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta M_t\">\\Delta M_t<\/span><\/span> が互いに <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.1\\%\">0.1\\%<\/span><\/span> 以内（全開），<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta M_{\\text{in}}\">\\Delta M_{\\text{in}}<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta M_{\\text{ex}}\">\\Delta M_{\\text{ex}}<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5\\%\">0.5\\%<\/span><\/span> 以内（アイドル）（項目 9）．<\/li>\n<li>RK4 が安定である：ヤコビアンの固有値 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lambda\">\\lambda<\/span><\/span> に対し <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\max|\\lambda|\\cdot\\Delta t_{\\max} \\le 2.79\">\\max|\\lambda|\\cdot\\Delta t_{\\max} \\le 2.79<\/span><\/span>（項目 10）．<\/li>\n<li>高速化した計算の経路が，元の式と浮動小数点数として同じ値を返す（項目 11）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-13　<strong>検証<\/strong>：TEST-13<\/p>\n<hr />\n","<h3 id=\"reqh24\">REQ-14：性能の指標と基準サイクル<\/h3>\n<p><strong>要求<\/strong>：サイクルの終端ごとに，そのサイクルの性能の指標を補助積分（仕様書 2.3 節）の増分から求めること．1 サイクルの波形を基準サイクルとして保存し，重ね描きで比べられること（保存の規則は REQ-18）．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li>定義の恒等式（TEST-14 項目 1，2，7，9）： <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\text{IMEP}\\cdot V_d = W_{i,\\text{net}}, \\qquad \\text{BMEP} = \\text{IMEP} - \\text{FMEP} - \\text{AMEP}, \\qquad P_b = \\frac{\\text{BMEP}\\cdot V_d}{t_c}, \\qquad \\eta_i = \\frac{W_{i,\\text{net}}}{m_f H_u}\">\\text{IMEP}\\cdot V_d = W_{i,\\text{net}}, \\qquad \\text{BMEP} = \\text{IMEP} - \\text{FMEP} - \\text{AMEP}, \\qquad P_b = \\frac{\\text{BMEP}\\cdot V_d}{t_c}, \\qquad \\eta_i = \\frac{W_{i,\\text{net}}}{m_f H_u}<\/span><\/span><\/li>\n<li>理論の上限を超えない：<span class=\"im\"><span class=\"tx raw\" data-tex=\"P_i \\le \\eta_{\\text{Otto}}\\,\\dot m_f H_u\">P_i \\le \\eta_{\\text{Otto}}\\,\\dot m_f H_u<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_{\\text{Otto}} = 1 - \\varepsilon^{1 - 1.40}\">\\eta_{\\text{Otto}} = 1 - \\varepsilon^{1 - 1.40}<\/span><\/span>（項目 3）．<\/li>\n<li>動力の収支：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\left|W_{i,\\text{net}} - \\Delta W_f - \\Delta W_a - \\Delta W_d\\right| \\le 0.02\\,W_{i,\\text{net}}\">\\left|W_{i,\\text{net}} - \\Delta W_f - \\Delta W_a - \\Delta W_d\\right| \\le 0.02\\,W_{i,\\text{net}}<\/span><\/span>（定常の 5 サイクル平均．項目 4）．<\/li>\n<li>完爆前の指標は「–」と表示し，<code>NaN<\/code>・<code>Infinity<\/code> を表示しない．サイクルごとの指標は直近 10 サイクルの算術平均を表示する（項目 6，8）．<\/li>\n<li>基準サイクルは，保存した後に書き換わらない（項目 5）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-14　<strong>検証<\/strong>：TEST-14<\/p>\n<hr />\n","<h3 id=\"reqh25\">REQ-15：画面の構成と操作<\/h3>\n<p><strong>要求<\/strong>：単一 HTML を，画面の最上部に固定した 6 つのタブで切り替える構成とし，スマートフォン（縦持ち）でスクロールせずに全機能を操作できること．画面が大きいときは，同時に表示する情報を増やすこと．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li>「解説」以外の全タブ・全サブページで，画面も内部の容器もスクロールしない（TEST-15 項目 1）．<\/li>\n<li>操作要素が <span class=\"im\"><span class=\"tx raw\" data-tex=\"44 \\times 44\\ \\text{px}\">44 \\times 44\\ \\text{px}<\/span><\/span> 以上で，互いに重ならず，文字幅が利用可能幅の <span class=\"im\"><span class=\"tx raw\" data-tex=\"95\\%\">95\\%<\/span><\/span> 以下（項目 2，7）．<\/li>\n<li>タップと判定するのは，移動 <span class=\"im\"><span class=\"tx raw\" data-tex=\"&lt; 8\\ \\text{px}\">&lt; 8\\ \\text{px}<\/span><\/span> かつ接触 <span class=\"im\"><span class=\"tx raw\" data-tex=\"&lt; 500\\ \\text{ms}\">&lt; 500\\ \\text{ms}<\/span><\/span> の入力だけ．<code>[RESET]<\/code> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.6\\ \\text{s}\">0.6\\ \\text{s}<\/span><\/span> の長押しでだけ働く（項目 4）．<\/li>\n<li>Canvas の内部解像度が CSS 寸法 × <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\min(\\text{dpr}, 2.5)\">\\min(\\text{dpr}, 2.5)<\/span><\/span> に一致する（項目 5）．<\/li>\n<li>シミュレーションの時間の進みがリフレッシュレートによらない（<span class=\"im\"><span class=\"tx raw\" data-tex=\"120\\ \\text{Hz}\">120\\ \\text{Hz}<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"60\\ \\text{Hz}\">60\\ \\text{Hz}<\/span><\/span> の差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\%\">1\\%<\/span><\/span> 未満．項目 6）．<\/li>\n<li>画面の幅 <span class=\"im\"><span class=\"tx raw\" data-tex=\"w\">w<\/span><\/span> に応じて同時に表示する情報が増える（<span class=\"im\"><span class=\"tx raw\" data-tex=\"w &lt; 700\">w &lt; 700<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"700 \\le w &lt; 900\">700 \\le w &lt; 900<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"w \\ge 900\">w \\ge 900<\/span><\/span> の 3 段階．項目 8，9）．<\/li>\n<li><code>bar<\/code> を表示しない．<code>input[type=\"range\"]<\/code> を使わない（項目 3）．<\/li>\n<li>代表の 6 つのビューポートと極端な利用者状態で全テストが PASS する（項目 10）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-15　<strong>検証<\/strong>：TEST-15<\/p>\n<hr />\n","<h3 id=\"reqh26\">REQ-16：解説タブ<\/h3>\n<p><strong>要求<\/strong>：「解説」タブに，このシステムが解いている連立常微分方程式と構成式を，途中の式変形を含めて読める形で表示すること．要件定義書・仕様書・用語の定義集の全文を，このタブから読めること．数式は，MathJax が使えるときは組んだ形で，使えないときは TeX のソースで示す．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li>§0〜§17 がそろい，§1 に 16 個の状態の時間微分の式が一対一で並ぶ（TEST-16 項目 1，9）．<\/li>\n<li>式に現れる全記号が記号表にある（未定義 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> 個）．表示している定数がソルバの定数と一致する（項目 2，3）．<\/li>\n<li>数式は TeX で書かれている．MathJax が使えるときは，画面に入る数式が MathJax で組まれ，全数式が誤りなく組め，縮小されていない．使えないときは各数式の TeX のソースが等幅で読める形で表示される．どちらの状態かを解説タブに示す（項目 1，4，5，7，10，19）．<\/li>\n<li>新しいモデルの式がある：未燃・既燃の比熱比と内部エネルギー，余剰エンタルピー，組成の項を含む筒内圧の式（項目 13）．選択中の比熱モデルとカムの式が強調される（項目 14）．<\/li>\n<li>目次のタップで見出しが上端（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 4\\ \\text{px}\">\\pm 4\\ \\text{px}<\/span><\/span>）に来る．タブを切り替えて戻っても縦スクロール位置が保たれる（項目 8，12）．<\/li>\n<li>要件定義書・仕様書・用語の定義集の全文をこのタブで読め，数式の数がビルド時の数と一致する（MathJax が使えるときは組まれて誤りが無い）．要件定義書に REQ-01〜28，仕様書に SPEC-01〜28 と TEST-01〜28 の見出しが 1 つずつある3 文書は見出し（章）ごとのページに分けて表示し，前後のページと目次から移動できる．画面に置くのは表示中の 1 ページだけで，ページの切り替えが 1 フレームの間隔の基準（<span class=\"im\"><span class=\"tx raw\" data-tex=\"250\\ \\text{ms}\">250\\ \\text{ms}<\/span><\/span>）を超えない（項目 15〜17）．<\/li>\n<li>第三者の著作物を埋め込まない（C-8）：成果物にフォント（<code>@font-face<\/code>）と base64 の埋め込みデータが無い．MathJax の読み込み元が規定の URL で，解説タブに MathJax の名前・版・ライセンス・読み込み元がある（項目 18）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-16　<strong>検証<\/strong>：TEST-16<\/p>\n<hr />\n","<h3 id=\"reqh27\">REQ-17：グラフの軸・目盛・自動レンジ<\/h3>\n<p><strong>要求<\/strong>：線図タブ，性能曲線タブ（REQ-26），設定画面の <span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>-<span class=\"im\"><span class=\"tx raw\" data-tex=\"V\">V<\/span><\/span> 図とカム線図（REQ-18）のすべてのグラフに，軸線・目盛・目盛の数値・軸名（単位付き）を表示すること．表示範囲は原則として固定し，データが収まらないか小さすぎるときだけ，決めた段階へ自動で切り替えること．利用者が範囲を操作する手段は設けない．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li>目盛の間隔が <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\{1, 2, 5\\} \\times 10^k\">\\{1, 2, 5\\} \\times 10^k<\/span><\/span> で，区間の数が 4〜8（TEST-17 項目 1）．<\/li>\n<li>段階型のレンジ：データの最大 <span class=\"im\"><span class=\"tx raw\" data-tex=\"M\">M<\/span><\/span> がフルスケール <span class=\"im\"><span class=\"tx raw\" data-tex=\"F\">F<\/span><\/span> を超えたら直ちに拡大し，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M &lt; 0.4F\">M &lt; 0.4F<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"3\\ \\text{s}\">3\\ \\text{s}<\/span><\/span> 続いたら縮小する．定常の運転中に範囲が変わらない（項目 2，6）．<\/li>\n<li>全グラフに単位付きの軸名，目盛の数値，凡例があり，互いに重ならず Canvas の中にある（項目 4）．<\/li>\n<li>データの座標変換が目盛の位置と <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 1\\ \\text{px}\">\\pm 1\\ \\text{px}<\/span><\/span> で一致する（項目 5）．<\/li>\n<li>クランク角の横軸が，線図ごとに決めた範囲と目盛になっている（項目 7）．<\/li>\n<li>範囲の切替から <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\ \\text{s}\">1\\ \\text{s}<\/span><\/span> の間，新しい目盛の数値を強調する．グラフのタップで読み取り線が出る（項目 8，9）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-17　<strong>検証<\/strong>：TEST-17<\/p>\n<hr />\n","<h3 id=\"reqh28\">REQ-18：設定画面<\/h3>\n<p><strong>要求<\/strong>：全パラメータをボタンだけで変更でき，運転中に変えてよい設定は押した瞬間に反映され，その効果を同じ画面の <span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>-<span class=\"im\"><span class=\"tx raw\" data-tex=\"V\">V<\/span><\/span> 図で確かめられること．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li>項目定義表の全項目で，既定値が範囲内かつ刻みの格子上にあり，表示値 × 単位係数 = 内部値（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>．TEST-18 項目 1）．<\/li>\n<li><code>[+]<\/code> 1 回と <code>[−]<\/code> 1 回で値が元に戻り，範囲の端を超えない（項目 2）．<\/li>\n<li>即時項目は押した同じフレームでソルバに反映される．要リセット項目は「適用」まで保留され，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lambda &gt; 0.5\">\\lambda &gt; 0.5<\/span><\/span> の組合せは適用できない（項目 3，4）．<\/li>\n<li>設定を変えると，変更の直前のサイクルが基準として保存され，その後も書き換わらず，現在との差が表示される（項目 6，15）．<\/li>\n<li>カム線図で，位相を <span class=\"im\"><span class=\"tx raw\" data-tex=\"+10^\\circ\">+10^\\circ<\/span><\/span> 変えるとリフトの最大点が <span class=\"im\"><span class=\"tx raw\" data-tex=\"10 \\pm 0.5^\\circ\">10 \\pm 0.5^\\circ<\/span><\/span> 動く（項目 9）．<\/li>\n<li>点火時期の行が自動の値を表示する．<code>[既定値]<\/code> と <code>[元に戻す]<\/code> が働く．ページの一覧から移動できる（項目 7，10〜14）．<\/li>\n<li>選んだ回転数の制御（REQ-11）で使わない設定は，変更できない．スロットル制御では固定開度と基準充水率，動力計制御では固定充水率である．制御が操作している量（スロットル制御の開度，動力計制御の充水率の指令）は，その行に現在の値を表示する．制御を切り替えると直ちに入れ替わる．固定開度は <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.1^\\circ\">0.1^\\circ<\/span><\/span> 単位で表示・入力し，制御の切替で上書きされた値も同じ桁で表示する（項目 16）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-18　<strong>検証<\/strong>：TEST-18<\/p>\n<hr />\n","<h3 id=\"reqh29\">REQ-19：機関断面図<\/h3>\n<p><strong>要求<\/strong>：運転タブに，現在の諸元と状態を反映した機関の断面図を描くこと．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li>図の位置が実寸の比に従う：ピストン頂面 <span class=\"im\"><span class=\"tx raw\" data-tex=\"= s\\,(h_c + x)\">= s\\,(h_c + x)<\/span><\/span>，ピン間の距離 <span class=\"im\"><span class=\"tx raw\" data-tex=\"= s\\,l\">= s\\,l<\/span><\/span>，クランクピンの半径 <span class=\"im\"><span class=\"tx raw\" data-tex=\"= s\\,r\">= s\\,r<\/span><\/span>，弁の変位 <span class=\"im\"><span class=\"tx raw\" data-tex=\"= s\\,L_v\">= s\\,L_v<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"s\">s<\/span><\/span>：縮尺．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 0.5\\ \\text{px}\">\\pm 0.5\\ \\text{px}<\/span><\/span>．TEST-19 項目 1）．<\/li>\n<li>設定できる諸元の全範囲で，全要素が Canvas の中にある（項目 2）．<\/li>\n<li>吸気ポートが外端から弁まで途切れず青系，排気ポートが橙系で，筒内ガスの色が温度に単調に対応する（項目 4，5）．<\/li>\n<li><code>VALVE HIT<\/code> が出ていないとき，弁の傘がピストン頂面より上にある（項目 6）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-19　<strong>検証<\/strong>：TEST-19<\/p>\n<hr />\n","<h3 id=\"reqh30\">REQ-20：検証の基盤<\/h3>\n<p><strong>要求<\/strong>：「テストがすべて PASS すれば，求める製品になっている」ことを目標に，全要件のテストをアプリの中と開発時に実行でき，その結果が利用者の状態によらず，再現できること．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li>同じシナリオを 2 回実行した終端の全状態が完全に一致する（TEST-20 項目 1）．<\/li>\n<li>全テストの実行の前後で，運転中の機関の状態と全設定値が完全に一致する．利用者が極端な設定にしていても同じ（項目 2，4）．<\/li>\n<li>全テストの所要時間が <span class=\"im\"><span class=\"tx raw\" data-tex=\"180\\ \\text{s}\">180\\ \\text{s}<\/span><\/span> 以下で，実行中の最長のフレーム間隔が <span class=\"im\"><span class=\"tx raw\" data-tex=\"250\\ \\text{ms}\">250\\ \\text{ms}<\/span><\/span> 以下（項目 5）．<\/li>\n<li>TEST-01〜28 がすべて実行され，7 通りのビューポート・利用者状態のすべてで 28/28 PASS する（項目 3，4．仕様書 9 節）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-20　<strong>検証<\/strong>：TEST-20<\/p>\n<hr />\n","<h3 id=\"reqh31\">REQ-21：エンジン音<\/h3>\n<p><strong>要求<\/strong>：機関の回転数の違いが音で分かるよう，シミュレーションの排気流量から作った音を，<strong>現在の平均回転数に対応する実時間の速さで<\/strong>鳴らすこと．再生速度（<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.02\\times\">0.02\\times<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\times\">1\\times<\/span><\/span>）によらず，<span class=\"im\"><span class=\"tx raw\" data-tex=\"800\\ \\text{rpm}\">800\\ \\text{rpm}<\/span><\/span> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"800\\ \\text{rpm}\">800\\ \\text{rpm}<\/span><\/span> の音として聞こえること．聞いて心地よいように作った「演出」の音に切り替えられること．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li>出力の周期が <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dfrac{120}{\\bar N}\\ [\\text{s}]\">\\dfrac{120}{\\bar N}\\ [\\text{s}]<\/span><\/span> で，再生速度によらない（TEST-21 項目 2，3，9）．<\/li>\n<li>排気管の共鳴が <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_n = \\dfrac{(2n - 1)\\,c}{4L}\">f_n = \\dfrac{(2n - 1)\\,c}{4L}<\/span><\/span> に現れる（<span class=\"im\"><span class=\"tx raw\" data-tex=\"n = 1, 2, 3\">n = 1, 2, 3<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\%\">2\\%<\/span><\/span> 以内．項目 4）．<\/li>\n<li>常に <span class=\"im\"><span class=\"tx raw\" data-tex=\"|y| \\le 1\">|y| \\le 1<\/span><\/span> で <code>NaN<\/code> を出さない．回転が止まると出力は厳密に <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>（項目 7，23）．<\/li>\n<li>アイドルの音量が負荷運転より小さい．圧縮と制限が波形の波高率を <span class=\"im\"><span class=\"tx raw\" data-tex=\"5\\%\">5\\%<\/span><\/span> を超えて下げない（項目 8，11）．<\/li>\n<li>サイクル変動 ON で周期と振幅がばらつき，同じ種で同じ出力になる（項目 13，14）．<\/li>\n<li>演出の音：4 気筒の周期性を持ち（<span class=\"im\"><span class=\"tx raw\" data-tex=\"P/4\">P/4<\/span><\/span> ずらしとの正規化相関 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ge 0.8\">\\ge 0.8<\/span><\/span>），負荷で実効値が 2 倍以上になり，アイドルで <span class=\"im\"><span class=\"tx raw\" data-tex=\"160\\ \\text{Hz}\">160\\ \\text{Hz}<\/span><\/span> 未満のエネルギーが <span class=\"im\"><span class=\"tx raw\" data-tex=\"60\\%\">60\\%<\/span><\/span> 以上，破裂音はアクセルオフの高回転でだけ起きる．既定（計算）の出力と機関の計算を変えない（項目 18〜22）．<\/li>\n<li>AudioWorklet の出力が合成器の直接の計算と一致する（最大の差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-5}\">10^{-5}<\/span><\/span>．項目 17）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-21　<strong>検証<\/strong>：TEST-21<\/p>\n<hr />\n","<h3 id=\"reqh32\">REQ-22：制御状態の表示<\/h3>\n<p><strong>要求<\/strong>：いま何が変数で，制御が何を目標に何を動かしているかを，運転タブで一目で分かるようにすること．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li>停止・始動中・スロットル制御・動力計制御の 4 状態で，目標・制御量・操作量・固定の量が名前と値で表示され，値が機関の状態と一致する（TEST-22 項目 1，3，5）．<\/li>\n<li>操作量が上下限に張り付いているとき，そのときに限り <code>全開<\/code>・<code>全閉<\/code>・<code>下限<\/code>・<code>上限<\/code> を表示する（項目 2）．<\/li>\n<li>カードの 4 行が折り返さない（項目 4）．<\/li>\n<li>指標の項目をタップすると，その項目だけが記号と日本語名の間で切り替わる（項目 6，7）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-22　<strong>検証<\/strong>：TEST-22<\/p>\n<hr />\n","<h3 id=\"reqh33\">REQ-23：目標回転数スライダ<\/h3>\n<p><strong>要求<\/strong>：運転タブで，目標回転数をスライダで大きく動かし，<code>[−]<\/code> <code>[＋]<\/code> で微調整できること．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li>つまみのドラッグで，目標回転数がつまみの位置の値（<span class=\"im\"><span class=\"tx raw\" data-tex=\"500\">500<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"8000\\ \\text{rpm}\">8000\\ \\text{rpm}<\/span><\/span> を線形に対応させ <span class=\"im\"><span class=\"tx raw\" data-tex=\"50\\ \\text{rpm}\">50\\ \\text{rpm}<\/span><\/span> に丸めた値）になる（TEST-23 項目 2）．<\/li>\n<li>トラックのタップと，つまみ以外から始めたドラッグでは値が変わらない（項目 3）．<\/li>\n<li><code>[＋]<\/code>・<code>[−]<\/code> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 50\\ \\text{rpm}\">\\pm 50\\ \\text{rpm}<\/span><\/span>．スライダの範囲を超えて上げられる（項目 4）．<\/li>\n<li>ボタンとつまみが <span class=\"im\"><span class=\"tx raw\" data-tex=\"44 \\times 44\\ \\text{px}\">44 \\times 44\\ \\text{px}<\/span><\/span> 以上で，機関断面図と重ならない（項目 1，5）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-23　<strong>検証<\/strong>：TEST-23<\/p>\n<hr />\n","<h3 id=\"reqh34\">REQ-24：内部 EGR と点火時期の妥当性<\/h3>\n<p><strong>要求<\/strong>：バルブオーバーラップによる内部 EGR（残留ガス）と MBT 点火時期が，物理的にもっともらしい大きさと傾向を示すこと．この REQ はモデルを追加せず，REQ-05〜07 の結果を判定する．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li>軽負荷で，オーバーラップ角 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta_{\\text{OL}} = 20, 50, 80^\\circ\">\\theta_{\\text{OL}} = 20, 50, 80^\\circ<\/span><\/span> に対し残留ガス率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r\">x_r<\/span><\/span> が単調に増え，<span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r(80^\\circ) - x_r(20^\\circ) \\ge 0.10\">x_r(80^\\circ) - x_r(20^\\circ) \\ge 0.10<\/span><\/span>（TEST-24 項目 1）．<\/li>\n<li>部分負荷で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta_{\\text{OL}} = 20 \\to 80^\\circ\">\\theta_{\\text{OL}} = 20 \\to 80^\\circ<\/span><\/span> により <span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r\">x_r<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.04\">0.04<\/span><\/span> 以上増え，PMEP が <span class=\"im\"><span class=\"tx raw\" data-tex=\"4\\ \\text{kPa}\">4\\ \\text{kPa}<\/span><\/span> 以上 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> に近づき，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\max}\">T_{\\max}<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"40\\ \\text{K}\">40\\ \\text{K}<\/span><\/span> 以上下がり，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_b\">\\eta_b<\/span><\/span> が下がらない（項目 2）．<\/li>\n<li>全開で <span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r \\le 0.08\">x_r \\le 0.08<\/span><\/span>，アイドルで <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.15 \\le x_r \\le 0.35\">0.15 \\le x_r \\le 0.35<\/span><\/span>（項目 3，4）．<\/li>\n<li>全開の MBT 点火時期が <span class=\"im\"><span class=\"tx raw\" data-tex=\"15\">15<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"35^\\circ\">35^\\circ<\/span><\/span> BTDC で回転数とともに進角し，希釈でも <span class=\"im\"><span class=\"tx raw\" data-tex=\"2^\\circ\">2^\\circ<\/span><\/span> 以上進角する．火炎発達角が <span class=\"im\"><span class=\"tx raw\" data-tex=\"15\">15<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"35^\\circ\\text{CA}\">35^\\circ\\text{CA}<\/span><\/span>（項目 5〜7）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-24　<strong>検証<\/strong>：TEST-24<\/p>\n<hr />\n","<h3 id=\"reqh35\">REQ-25：吸気ランナの慣性（慣性過給）<\/h3>\n<p><strong>要求<\/strong>：吸気マニホールドと吸気弁の間に，長さ <span class=\"im\"><span class=\"tx raw\" data-tex=\"L_r\">L_r<\/span><\/span>，内径 <span class=\"im\"><span class=\"tx raw\" data-tex=\"d_r\">d_r<\/span><\/span> の吸気ランナを 1 本置き，管内のガス柱の慣性を扱うこと．回転数によって吸気弁が閉じる直前のポート圧が上下し，体積効率とトルクに回転数の山ができること．ランナを長くすると山が低回転へ動くこと．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li>弁が閉じているとき，ランナの流量が角振動数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\omega_H = \\sqrt{\\dfrac{A_r}{L_r}\\left(\\dfrac{\\gamma_0 RT_{\\text{in}}}{V_p} + \\dfrac{RT_{\\text{in}}}{V_{\\text{in}}}\\right)}\">\\omega_H = \\sqrt{\\dfrac{A_r}{L_r}\\left(\\dfrac{\\gamma_0 RT_{\\text{in}}}{V_p} + \\dfrac{RT_{\\text{in}}}{V_{\\text{in}}}\\right)}<\/span><\/span> で振動する（周期の相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\%\">1\\%<\/span><\/span>．TEST-25 項目 1）．<\/li>\n<li>周期定常で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta M_{\\text{th}}\">\\Delta M_{\\text{th}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta M_r\">\\Delta M_r<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta M_{\\text{in}}\">\\Delta M_{\\text{in}}<\/span><\/span> が互いに <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\%\">1\\%<\/span><\/span> 以内（項目 4）．<\/li>\n<li>慣性過給：体積効率の増分 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta\\eta_v(N) = \\eta_{v,\\text{ON}}(N) - \\eta_{v,\\text{OFF}}(N)\">\\Delta\\eta_v(N) = \\eta_{v,\\text{ON}}(N) - \\eta_{v,\\text{OFF}}(N)<\/span><\/span> の最大が <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.02\">0.02<\/span><\/span> 以上で，その回転数がランナを長くすると下がる（項目 5）．<\/li>\n<li>ランナ OFF では <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_r\">\\dot m_r<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_p\">p_p<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{b,p}\">m_{b,p}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"E_p\">E_p<\/span><\/span> が変わらず，吸気弁がマニホールドに直接つながる（項目 3）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-25　<strong>検証<\/strong>：TEST-25<\/p>\n<hr />\n","<h3 id=\"reqh36\">REQ-26：性能曲線タブ（回転数に対する特性の計測）<\/h3>\n<p><strong>要求<\/strong>：「性能曲線」タブで，現在の設定のまま，選んだスロットル開度で回転数を振り，軸トルク・出力などの特性を描くこと．運転中の機関は止めずに，裏で計算すること．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li>計測の各点で回転数が目標に一致する（角速度も，サイクルの時間から求めた回転数も，相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span>．TEST-26 項目 2）．<\/li>\n<li><span class=\"im\"><span class=\"tx raw\" data-tex=\"P_b = T_b\\cdot\\dfrac{2\\pi N}{60}\">P_b = T_b\\cdot\\dfrac{2\\pi N}{60}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{BMEP}\\cdot V_d = 4\\pi T_b\">\\text{BMEP}\\cdot V_d = 4\\pi T_b<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span>．項目 3）．<\/li>\n<li>同じ設定の 2 回の計測が完全に一致する．計測は運転中の機関の設定と状態を変えず，1 フレームの計算が <span class=\"im\"><span class=\"tx raw\" data-tex=\"30\\ \\text{ms}\">30\\ \\text{ms}<\/span><\/span> 以下（項目 4，5）．<\/li>\n<li>既定の計測（3 開度 × 25 点）が <span class=\"im\"><span class=\"tx raw\" data-tex=\"20\\ \\text{s}\">20\\ \\text{s}<\/span><\/span> 以下（項目 7）．<\/li>\n<li>全開の曲線で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_b\">T_b<\/span><\/span> の最大が端点以外にあり，<span class=\"im\"><span class=\"tx raw\" data-tex=\"P_b\">P_b<\/span><\/span> が最大になる回転数が <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_b\">T_b<\/span><\/span> が最大になる回転数より高い（項目 8）．<\/li>\n<li>計測の手順（上り，往復，独立）によらず，<span class=\"im\"><span class=\"tx raw\" data-tex=\"|\\Delta T_b| \\le 0.5\\%\\max T_b\">|\\Delta T_b| \\le 0.5\\%\\max T_b<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"|\\Delta\\eta_v| \\le 0.005\">|\\Delta\\eta_v| \\le 0.005<\/span><\/span> で一致する（項目 9）．<\/li>\n<li>整定した点は収束の判定値を満たす（項目 13）．<\/li>\n<li>「前提」の表は，計測に使う設定を示す．計測の実行中は実行中の計測の設定，それ以外は現在の適用済みの設定（次の計測に使う値）であり，設定を変えたとき，計測済みの結果の有無によらず，表示を直ちに更新する．カムの種類，最大リフト，弁の開閉時期（位相を含む）を含む．表示中の曲線が現在と異なる設定で計測したものであるとき，および保留中（未適用）の変更があるときは，その旨を表に示す（項目 14）．<\/li>\n<li>回転数の刻みに <span class=\"im\"><span class=\"tx raw\" data-tex=\"25\\ \\text{rpm}\">25\\ \\text{rpm}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"241\">241<\/span><\/span> 点）を選べる．収束の判定に使うサイクル数の最少と最多を条件の画面で指定でき，各点は，判定を満たしても最少に達するまでは続け，最多に達したら判定を満たさなくても打ち切る（整定した点の使ったサイクル数は最少以上，すべての点で最多以下）．指定は計測の結果と「前提」の表に反映される（項目 10，11，15）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-26　<strong>検証<\/strong>：TEST-26<\/p>\n<hr />\n","<h3 id=\"reqh37\">REQ-27：排気系（排気管の脈動と背圧）<\/h3>\n<p><strong>要求<\/strong>：排気弁の下流に，排気管（長さ <span class=\"im\"><span class=\"tx raw\" data-tex=\"L_e\">L_e<\/span><\/span>，内径 <span class=\"im\"><span class=\"tx raw\" data-tex=\"d_e\">d_e<\/span><\/span>），消音器（容積 <span class=\"im\"><span class=\"tx raw\" data-tex=\"V_m\">V_m<\/span><\/span>），テールパイプの出口（有効面積 <span class=\"im\"><span class=\"tx raw\" data-tex=\"A_t\">A_t<\/span><\/span>）を置き，排気の脈動と，流量に応じて変わる背圧を扱うこと．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li>排気弁が閉じ，出口を閉じたとき，排気管の流量が角振動数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\omega_E = \\sqrt{\\dfrac{A_e}{L_e}\\left(\\dfrac{\\gamma_0 RT_X}{V_{pe}} + \\dfrac{RT_X}{V_m}\\right)}\">\\omega_E = \\sqrt{\\dfrac{A_e}{L_e}\\left(\\dfrac{\\gamma_0 RT_X}{V_{pe}} + \\dfrac{RT_X}{V_m}\\right)}<\/span><\/span> で振動する（周期の相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\%\">1\\%<\/span><\/span>．TEST-27 項目 1）．<\/li>\n<li>周期定常で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta M_{\\text{ex}}\">\\Delta M_{\\text{ex}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta M_e\">\\Delta M_e<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta M_t\">\\Delta M_t<\/span><\/span> が互いに <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\%\">1\\%<\/span><\/span> 以内（項目 4）．<\/li>\n<li>全開・<span class=\"im\"><span class=\"tx raw\" data-tex=\"5000\\ \\text{rpm}\">5000\\ \\text{rpm}<\/span><\/span> の背圧が <span class=\"im\"><span class=\"tx raw\" data-tex=\"10\">10<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"20\\ \\text{kPa}\">20\\ \\text{kPa}<\/span><\/span> で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"1000\">1000<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"5000\\ \\text{rpm}\">5000\\ \\text{rpm}<\/span><\/span> で回転数とともに増える．アイドルの背圧が <span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\ \\text{kPa}\">2\\ \\text{kPa}<\/span><\/span> 以下（項目 5）．<\/li>\n<li>全開・<span class=\"im\"><span class=\"tx raw\" data-tex=\"3000\\ \\text{rpm}\">3000\\ \\text{rpm}<\/span><\/span> で排気ポート圧の脈動の幅が <span class=\"im\"><span class=\"tx raw\" data-tex=\"20\\ \\text{kPa}\">20\\ \\text{kPa}<\/span><\/span> 以上（項目 6）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-27　<strong>検証<\/strong>：TEST-27<\/p>\n<hr />\n","<h3 id=\"reqh38\">REQ-28：アイドルの妥当性<\/h3>\n<p><strong>要求<\/strong>：既定設定の無負荷アイドルが，実機と比べて妥当な範囲にあることを，判定できる指標で確かめること．モデルの係数を実機の値に合わせ込むことはしない（物性値や式の誤りは直すが，結果を合わせるための調整はしない．ずれは理由とともに記録する）．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li>燃料流量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.030 \\le \\dot m_f \\le 0.050\\ \\text{g/s}\">0.030 \\le \\dot m_f \\le 0.050\\ \\text{g/s}<\/span><\/span>（TEST-28 項目 1）．<\/li>\n<li><span class=\"im\"><span class=\"tx raw\" data-tex=\"90 \\le \\text{FMEP} + \\text{AMEP} \\le 130\\ \\text{kPa}\">90 \\le \\text{FMEP} + \\text{AMEP} \\le 130\\ \\text{kPa}<\/span><\/span>（項目 2）．<\/li>\n<li>部分負荷の膨張のポリトロープ指数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"n = \\dfrac{\\ln(p_1/p_2)}{\\ln(V_2/V_1)}\">n = \\dfrac{\\ln(p_1/p_2)}{\\ln(V_2/V_1)}<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"1.20\">1.20<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"1.35\">1.35<\/span><\/span>（項目 3）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-28　<strong>検証<\/strong>：TEST-28<\/p>\n<hr />\n","<h3 id=\"reqh39\">REQ-29：化学種の熱物性と化学平衡（第26版．仕様のみ，未実装）<\/h3>\n<p><strong>要求<\/strong>：筒内の作動流体を，空気・燃料蒸気・既燃ガスの 3 成分で表し，各成分の内部エネルギーを，生成エンタルピーを含む絶対値で与えること．既燃ガスは，当量比・温度・圧力で決まる 10 種の化学平衡組成とし，解離と，当量比による比熱・気体定数の変化を扱うこと．燃焼の発熱は，外から加える項ではなく，未燃ガスが既燃ガスに変わるときの内部エネルギーの差として現れること．これにより，リッチ（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi &gt; 1\">\\phi &gt; 1<\/span><\/span>）での出力の増加を，係数の調整なしに表すこと．第25版の熱物性（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma(T)\">\\gamma(T)<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma\">\\gamma<\/span><\/span> 一定）も設定で選べること．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li>空気の気体定数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"R_a = 288.19\\ \\text{J/(kg·K)}\">R_a = 288.19\\ \\text{J/(kg·K)}<\/span><\/span>，燃料蒸気の気体定数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"R_f = 75.586\\ \\text{J/(kg·K)}\">R_f = 75.586\\ \\text{J/(kg·K)}<\/span><\/span>，量論空燃比 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{AF}_{st} = 14.503\">\\text{AF}_{st} = 14.503<\/span><\/span>，燃料蒸気の低位発熱量（<span class=\"im\"><span class=\"tx raw\" data-tex=\"298.15\\ \\text{K}\">298.15\\ \\text{K}<\/span><\/span>）<span class=\"im\"><span class=\"tx raw\" data-tex=\"H_u + h_{fg} = 44.35\\ \\text{MJ/kg}\">H_u + h_{fg} = 44.35\\ \\text{MJ/kg}<\/span><\/span>（いずれも相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-4}\">10^{-4}<\/span><\/span>．TEST-29 項目 1）．<\/li>\n<li>CO<span class=\"im\"><span class=\"tx raw\" data-tex=\"_2\">_2<\/span><\/span> ⇌ CO + ½O<span class=\"im\"><span class=\"tx raw\" data-tex=\"_2\">_2<\/span><\/span> の平衡定数が，<span class=\"im\"><span class=\"tx raw\" data-tex=\"2000\">2000<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"2500\">2500<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"3000\\ \\text{K}\">3000\\ \\text{K}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\log_{10}K_p = -2.879\">\\log_{10}K_p = -2.879<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"-1.433\">-1.433<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"-0.479\">-0.479<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 0.005\">\\pm 0.005<\/span><\/span>．項目 2）．<\/li>\n<li>化学平衡の解が元素の保存を満たす（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span>）．燃料と空気（<span class=\"im\"><span class=\"tx raw\" data-tex=\"298.15\\ \\text{K}\">298.15\\ \\text{K}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"101.325\\ \\text{kPa}\">101.325\\ \\text{kPa}<\/span><\/span>）の定圧断熱火炎温度が，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1.0\">\\phi = 1.0<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"2313.7\\ \\text{K}\">2313.7\\ \\text{K}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1.1\">\\phi = 1.1<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"2325.2\\ \\text{K}\">2325.2\\ \\text{K}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 2\\ \\text{K}\">\\pm 2\\ \\text{K}<\/span><\/span>．燃焼効率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\">1<\/span><\/span> として．項目 3）．<\/li>\n<li>定容・断熱の燃焼の終わりの状態が，試算（<code>tools/richburn<\/code>）の値に一致する：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1.0\">\\phi = 1.0<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"T = 2952\\ \\text{K}\">T = 2952\\ \\text{K}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p = 9.565\\ \\text{MPa}\">p = 9.565\\ \\text{MPa}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1.1\">\\phi = 1.1<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"T = 2983\\ \\text{K}\">T = 2983\\ \\text{K}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p = 9.817\\ \\text{MPa}\">p = 9.817\\ \\text{MPa}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 5\\ \\text{K}\">\\pm 5\\ \\text{K}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 0.3\\%\">\\pm 0.3\\%<\/span><\/span>．条件は項目 4）．<\/li>\n<li>既燃ガスの物性の表の補間が，平衡を直接解いた値に対して，内部エネルギーで <span class=\"im\"><span class=\"tx raw\" data-tex=\"3\\ \\text{kJ/kg}\">3\\ \\text{kJ/kg}<\/span><\/span> 以下，気体定数で相対 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-3}\">10^{-3}<\/span><\/span> 以下（項目 5）．<\/li>\n<li>弁を閉じ，熱損失を無くした系で，全内部エネルギーと図示仕事の和が保存する（相対 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-8}\">10^{-8}<\/span><\/span>）．周期定常の運転で，第一法則の残差が，1 サイクルに供給した燃料の発熱量の <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-4}\">10^{-4}<\/span><\/span> 以下（項目 6，7）．<\/li>\n<li>熱物性に <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma(T)\">\\gamma(T)<\/span><\/span> を選ぶと，第25版と同じ結果になる（同じシナリオの IMEP の相対差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span> 以下．項目 8）．<\/li>\n<li>直噴（REQ-30），全開，点火時期は自動最適化，<span class=\"im\"><span class=\"tx raw\" data-tex=\"2000\">2000<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"4000\\ \\text{rpm}\">4000\\ \\text{rpm}<\/span><\/span> で，軸トルクが <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_b(\\phi = 1.1) &gt; T_b(\\phi = 1.0) &gt; T_b(\\phi = 0.9)\">T_b(\\phi = 1.1) &gt; T_b(\\phi = 1.0) &gt; T_b(\\phi = 0.9)<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi \\in \\{0.9, 1.0, 1.1, 1.2, 1.3\\}\">\\phi \\in \\{0.9, 1.0, 1.1, 1.2, 1.3\\}<\/span><\/span> のうち軸トルクが最大になるのは <span class=\"im\"><span class=\"tx raw\" data-tex=\"1.1\">1.1<\/span><\/span> か <span class=\"im\"><span class=\"tx raw\" data-tex=\"1.2\">1.2<\/span><\/span>（項目 9）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-29　<strong>検証<\/strong>：TEST-29<\/p>\n<hr />\n","<h3 id=\"reqh40\">REQ-30：燃料の噴射と気化（第26版．仕様のみ，未実装）<\/h3>\n<p><strong>要求<\/strong>：燃料の入れ方を，ポート噴射（吸気管で気化済みの予混合気）と，筒内への直接噴射（1 サイクルに 1 回）から選べること．直噴では，吸気系を流れるのは空気だけとし，ECU が噴射量を決め，設定した開始角から液体の燃料を噴き，液体が気化するときに気化潜熱を筒内のガスから奪うこと．<\/p>\n<p><strong>受入基準<\/strong>：<\/p>\n<ol type=\"1\">\n<li>1 サイクルに噴いた燃料の質量が指令の値に一致する．液体と蒸気の燃料の質量の収支が閉じる（いずれも相対 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span>．TEST-30 項目 1）．<\/li>\n<li>噴射の開始と終了の角度で，積分のステップがちょうど終わる（<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-8}\\ \\text{rad}\">10^{-8}\\ \\text{rad}<\/span><\/span>．項目 2）．<\/li>\n<li>弁を閉じ，熱損失を無くした系に液体の燃料を噴いて全量を気化させたとき，温度の低下が，エネルギーの保存から求めた値に一致する（<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-6}\\ \\text{K}\">10^{-6}\\ \\text{K}<\/span><\/span>．項目 3）．<\/li>\n<li>気化の時定数を <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> にすると，筒内の液体の質量が常に <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>（項目 4）．<\/li>\n<li>直噴，全開，<span class=\"im\"><span class=\"tx raw\" data-tex=\"3000\\ \\text{rpm}\">3000\\ \\text{rpm}<\/span><\/span> の周期定常で，点火の時点の筒内の当量比が設定値の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 1\\%\">\\pm 1\\%<\/span><\/span> 以内（項目 5）．<\/li>\n<li>全開，<span class=\"im\"><span class=\"tx raw\" data-tex=\"3000\\ \\text{rpm}\">3000\\ \\text{rpm}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1\">\\phi = 1<\/span><\/span> で，直噴はポート噴射に比べて，吸気弁が閉じる時点の筒内の温度が <span class=\"im\"><span class=\"tx raw\" data-tex=\"10\\ \\text{K}\">10\\ \\text{K}<\/span><\/span> 以上低く，1 サイクルに閉じ込める空気の質量が <span class=\"im\"><span class=\"tx raw\" data-tex=\"3\\%\">3\\%<\/span><\/span> 以上多い（項目 6）．<\/li>\n<li>熱物性が「化学種」でないときは，噴射方式がポート噴射に固定され，設定画面で変更できない（項目 7）．<\/li>\n<\/ol>\n<p><strong>仕様<\/strong>：仕様書 SPEC-30　<strong>検証<\/strong>：TEST-30<\/p>\n<hr />\n","<h2 id=\"reqh41\">5. 受入<\/h2>\n","<h3 id=\"reqh42\">5.1 納品条件<\/h3>\n<ol type=\"1\">\n<li>アプリ内テスト [A][S][U]（TEST-01〜28）が全 PASS．<\/li>\n<li>開発時検証 [D]（<code>npm test<\/code>．7 通りのビューポート・利用者状態）が全 PASS．1 件でも FAIL があれば成果物を公開しない．<\/li>\n<li>下の実機目視チェックリスト [M] に不合格が無い．[M] で見つかった不具合は，再発を防ぐ自動テストを加えてから直す．<\/li>\n<\/ol>\n","<h3 id=\"reqh43\">5.2 実機目視チェックリスト [M]（Galaxy S26+／Chrome）<\/h3>\n<ol type=\"1\">\n<li>運転タブ：機関断面図が 1 つだけ，歪まずに表示される．吸気ポートが外端から弁まで途切れず青い．START で回り始め，火花・火炎・弁の動き・流れの矢印が見える．運転の状態，回転数，行程名，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta\">\\theta<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T\">T<\/span><\/span> の文字が図に重ならずに読める．<\/li>\n<li>運転タブ：全ボタンが指で押せ，押した結果が直ちに画面に現れる．<\/li>\n<li>線図タブ：7 画面とも軸名と目盛の数値が読める大きさで，曲線が枠の中に収まる．定常の運転中に範囲がばたつかない．<\/li>\n<li>設定タブ：<code>[+]<\/code> <code>[−]<\/code> で値が 1 刻み変わり，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>-<span class=\"im\"><span class=\"tx raw\" data-tex=\"V\">V<\/span><\/span> 図に基準（灰）と現在（橙）が重なって違いが見える．大気圧が <code>101.3 kPa<\/code> 付近で表示される．<\/li>\n<li>設定タブ：「機関」で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon\">\\varepsilon<\/span><\/span> を変えて適用すると，機関断面図の比率が変わる．<\/li>\n<li>検証タブ：<code>[全テスト実行]<\/code> で進捗が進み，28 個のチップがすべて PASS になる．チップを押すと詳細が切り替わる．<\/li>\n<li>解説タブ：数式が横書きで正しく組まれ，縦にスクロールできる．<code>[要件定義書]<\/code> <code>[仕様書]<\/code> <code>[用語集]<\/code> で各文書が開き，数式と表が読め，目次から移動できる．<\/li>\n<li>どのタブでも（解説を除き）画面がスクロールしない．<\/li>\n<li>運転タブで START すると音が鳴り（ヘッドホンを推奨），回転数の上昇とともに「トトト」から音の高さのある音へ変わる．<code>[音OFF]<\/code> で止まる．<\/li>\n<li>性能曲線タブで計測を始めてから運転タブへ切り替えても，機関が滑らかに回り続け，戻ると計測が進んでいる．<\/li>\n<li>運転タブの指標の項目をタップすると，その項目だけが日本語名と記号の間で切り替わる．タブ名とボタンの文字が欠けない．<\/li>\n<li>設定「音響」の「音の種類」を「演出」にすると，4 気筒風の音に変わる．目標回転数を上げると甲高くなり，高回転から目標を下げた減速中に破裂音が混じる．「計算」に戻すと元の音になる．音切れや雑音（プチプチ）が無い．<\/li>\n<li>タブレットと PC（実機があれば）：幅 <span class=\"im\"><span class=\"tx raw\" data-tex=\"900\\ \\text{px}\">900\\ \\text{px}<\/span><\/span> 以上で 2 列の配置になり，表示が崩れない．<\/li>\n<\/ol>\n<hr />\n","<h2 id=\"reqh44\">6. 要件・仕様・テストの対応<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>要件<\/th>\n<th>内容<\/th>\n<th>仕様<\/th>\n<th>テスト<\/th>\n<th>主な受入基準<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>REQ-01<\/td>\n<td>クランク運動学<\/td>\n<td>SPEC-01<\/td>\n<td>TEST-01<\/td>\n<td>容積の端点（<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>），<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{dV}{d\\theta}\">\\frac{dV}{d\\theta}<\/span><\/span> と差分の一致（<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span>）<\/td>\n<\/tr>\n<tr>\n<td>REQ-02<\/td>\n<td>熱物性（未燃・既燃の比熱）<\/td>\n<td>SPEC-02<\/td>\n<td>TEST-02<\/td>\n<td>当てはめの値，<span class=\"im\"><span class=\"tx raw\" data-tex=\"c_p - c_v = R\">c_p - c_v = R<\/span><\/span>，内部エネルギーの微分が比熱に一致<\/td>\n<\/tr>\n<tr>\n<td>REQ-03<\/td>\n<td>カムと弁の有効面積，VVT，干渉<\/td>\n<td>SPEC-03<\/td>\n<td>TEST-03<\/td>\n<td>端点と中央のリフト，滑らかさの分類，弁径，位相の平行移動，干渉の判定<\/td>\n<\/tr>\n<tr>\n<td>REQ-04<\/td>\n<td>オリフィスの流れ<\/td>\n<td>SPEC-04<\/td>\n<td>TEST-04<\/td>\n<td>臨界圧力比と飽和の値，符号の反転，正則化の連続と単調<\/td>\n<\/tr>\n<tr>\n<td>REQ-05<\/td>\n<td>スロットル，マニホールド，既燃ガスと熱の追跡<\/td>\n<td>SPEC-05<\/td>\n<td>TEST-05<\/td>\n<td>質量・既燃ガス・余剰エンタルピーの収支，吹き返しによる加熱<\/td>\n<\/tr>\n<tr>\n<td>REQ-06<\/td>\n<td>筒内の組成<\/td>\n<td>SPEC-06<\/td>\n<td>TEST-06<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"0 \\le m_u \\le m\">0 \\le m_u \\le m<\/span><\/span>，質量の収支<\/td>\n<\/tr>\n<tr>\n<td>REQ-07<\/td>\n<td>燃焼<\/td>\n<td>SPEC-07<\/td>\n<td>TEST-07<\/td>\n<td>Wiebe の積分，層流燃焼速度の値，リッチ側の平衡，当量比の効果，サイクル変動，決定性<\/td>\n<\/tr>\n<tr>\n<td>REQ-08<\/td>\n<td>壁面熱伝達と壁温<\/td>\n<td>SPEC-08<\/td>\n<td>TEST-08<\/td>\n<td>係数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> で熱流 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>，燃焼で <span class=\"im\"><span class=\"tx raw\" data-tex=\"h_c\">h_c<\/span><\/span> が増える，壁温の式<\/td>\n<\/tr>\n<tr>\n<td>REQ-09<\/td>\n<td>筒内圧の式<\/td>\n<td>SPEC-09<\/td>\n<td>TEST-09<\/td>\n<td>断熱圧縮の解析解，温度依存比熱の閉じた系のエネルギー，周期定常の第一法則の残差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\le 10^{-4}\">\\le 10^{-4}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>REQ-10<\/td>\n<td>回転運動，摩擦，スターター<\/td>\n<td>SPEC-10<\/td>\n<td>TEST-10<\/td>\n<td>FMEP の値，クランキングのつり合い，完爆の判定<\/td>\n<\/tr>\n<tr>\n<td>REQ-11<\/td>\n<td>動力計と運転モード<\/td>\n<td>SPEC-11<\/td>\n<td>TEST-11<\/td>\n<td>吸収トルクの式，一次遅れ，軸トルクとのつり合い，<span class=\"im\"><span class=\"tx raw\" data-tex=\"1500 \\pm 10\\ \\text{rpm}\">1500 \\pm 10\\ \\text{rpm}<\/span><\/span> の保持，容量の判定<\/td>\n<\/tr>\n<tr>\n<td>REQ-12<\/td>\n<td>ECU<\/td>\n<td>SPEC-12<\/td>\n<td>TEST-12<\/td>\n<td>目標への整定（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 25\\ \\text{rpm}\">\\pm 25\\ \\text{rpm}<\/span><\/span>），アンチワインドアップ，MBT（CA50 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10 \\pm 0.5^\\circ\">10 \\pm 0.5^\\circ<\/span><\/span>），開度の下限，冷間始動<\/td>\n<\/tr>\n<tr>\n<td>REQ-13<\/td>\n<td>数値積分<\/td>\n<td>SPEC-13<\/td>\n<td>TEST-13<\/td>\n<td>次数，参照解との一致，イベントの角度（<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-8}\\ \\text{rad}\">10^{-8}\\ \\text{rad}<\/span><\/span>），射影と強制受理が <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> 回，集計の整合，硬さと刻みの上限<\/td>\n<\/tr>\n<tr>\n<td>REQ-14<\/td>\n<td>性能の指標<\/td>\n<td>SPEC-14<\/td>\n<td>TEST-14<\/td>\n<td>定義の恒等式，動力の収支，表示の規則，10 サイクル平均<\/td>\n<\/tr>\n<tr>\n<td>REQ-15<\/td>\n<td>画面の構成と操作<\/td>\n<td>SPEC-15<\/td>\n<td>TEST-15<\/td>\n<td>スクロール無し，ボタンの寸法と文字幅，タップの判定，Canvas の解像度，画面の段階<\/td>\n<\/tr>\n<tr>\n<td>REQ-16<\/td>\n<td>解説タブ<\/td>\n<td>SPEC-16<\/td>\n<td>TEST-16<\/td>\n<td>全章，未定義の記号 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>，定数の一致，組版，目次，16 式，3 文書の閲覧，フォントを埋め込まない・MathJax／TeX の表示<\/td>\n<\/tr>\n<tr>\n<td>REQ-17<\/td>\n<td>グラフの軸とレンジ<\/td>\n<td>SPEC-17<\/td>\n<td>TEST-17<\/td>\n<td>目盛，段階型・帯域型の状態機械，レイアウトの重なり無し，クランク角の軸<\/td>\n<\/tr>\n<tr>\n<td>REQ-18<\/td>\n<td>設定画面<\/td>\n<td>SPEC-18<\/td>\n<td>TEST-18<\/td>\n<td>項目定義表の整合，即時と要リセット，基準サイクル，カム線図，点火時期の行，制御で使わない設定の無効化<\/td>\n<\/tr>\n<tr>\n<td>REQ-19<\/td>\n<td>機関断面図<\/td>\n<td>SPEC-19<\/td>\n<td>TEST-19<\/td>\n<td>幾何の位置（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 0.5\\ \\text{px}\">\\pm 0.5\\ \\text{px}<\/span><\/span>），Canvas 内，ポートの色<\/td>\n<\/tr>\n<tr>\n<td>REQ-20<\/td>\n<td>検証の基盤<\/td>\n<td>SPEC-20<\/td>\n<td>TEST-20<\/td>\n<td>決定性，実行前後の状態の一致，全テストの実行，フレーム間隔と所要時間<\/td>\n<\/tr>\n<tr>\n<td>REQ-21<\/td>\n<td>エンジン音<\/td>\n<td>SPEC-21<\/td>\n<td>TEST-21<\/td>\n<td>周期，共鳴，圧縮器，ばらつき，雑音，音声の経路，演出の性質<\/td>\n<\/tr>\n<tr>\n<td>REQ-22<\/td>\n<td>制御状態の表示<\/td>\n<td>SPEC-22<\/td>\n<td>TEST-22<\/td>\n<td>4 状態の表示，張り付きの語，指標の名称の切替<\/td>\n<\/tr>\n<tr>\n<td>REQ-23<\/td>\n<td>目標回転数スライダ<\/td>\n<td>SPEC-23<\/td>\n<td>TEST-23<\/td>\n<td>つまみのドラッグだけが効く，範囲と刻み<\/td>\n<\/tr>\n<tr>\n<td>REQ-24<\/td>\n<td>内部 EGR と点火時期の妥当性<\/td>\n<td>SPEC-24<\/td>\n<td>TEST-24<\/td>\n<td>オーバーラップと <span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r\">x_r<\/span><\/span>，MBT の範囲と進角<\/td>\n<\/tr>\n<tr>\n<td>REQ-25<\/td>\n<td>吸気ランナ<\/td>\n<td>SPEC-25<\/td>\n<td>TEST-25<\/td>\n<td>共鳴の周期，質量の収支，慣性過給の山<\/td>\n<\/tr>\n<tr>\n<td>REQ-26<\/td>\n<td>性能曲線タブ<\/td>\n<td>SPEC-26<\/td>\n<td>TEST-26<\/td>\n<td>回転数の保持，決定性，干渉しない，手順の一致，収束の判定，前提の表の即時の反映，刻み 25 rpm，サイクル数の最少・最多<\/td>\n<\/tr>\n<tr>\n<td>REQ-27<\/td>\n<td>排気系<\/td>\n<td>SPEC-27<\/td>\n<td>TEST-27<\/td>\n<td>共鳴の周期，質量の収支，背圧，脈動<\/td>\n<\/tr>\n<tr>\n<td>REQ-28<\/td>\n<td>アイドルの妥当性<\/td>\n<td>SPEC-28<\/td>\n<td>TEST-28<\/td>\n<td>燃料流量，摩擦と補機，膨張の指数<\/td>\n<\/tr>\n<tr>\n<td>REQ-29<\/td>\n<td>化学種の熱物性と化学平衡（未実装）<\/td>\n<td>SPEC-29<\/td>\n<td>TEST-29<\/td>\n<td>物性の値，平衡定数，断熱火炎温度，表の補間，第一法則，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma(T)\">\\gamma(T)<\/span><\/span> で第25版と一致，リッチでの出力増<\/td>\n<\/tr>\n<tr>\n<td>REQ-30<\/td>\n<td>燃料の噴射と気化（未実装）<\/td>\n<td>SPEC-30<\/td>\n<td>TEST-30<\/td>\n<td>噴射量と質量の収支，イベントの角度，潜熱による温度の低下，点火時の当量比，直噴の冷却と空気量<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n","<h2 id=\"reqh45\">7. 改訂の記録<\/h2>\n","<h3 id=\"reqh46\">7.1 版の一覧<\/h3>\n<p>第24版までは，要件・仕様・テスト・改訂記録を 1 つの文書に書いていた．その全文は <code>docs/history/requirements_v24.md<\/code> にある．<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>版<\/th>\n<th>主な内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>第5版<\/td>\n<td>摩擦を Chen–Flynn 型に．検証の基盤（アプリ内テスト）を定めた<\/td>\n<\/tr>\n<tr>\n<td>第6〜8版<\/td>\n<td>DOPRI5 を既定に，点火時期の自動最適化，カム線図，サイクル変動，燃焼速度の調整係数，リッチ側の不完全燃焼<\/td>\n<\/tr>\n<tr>\n<td>第9〜10版<\/td>\n<td>目標回転数スライダ，線図の横軸の範囲<\/td>\n<\/tr>\n<tr>\n<td>第11版<\/td>\n<td>吸気管の既燃ガスの追跡（内部 EGR），着火遅れの校正<\/td>\n<\/tr>\n<tr>\n<td>第12版<\/td>\n<td>吸気ランナ（慣性過給），性能曲線タブ，弁諸元の見直し<\/td>\n<\/tr>\n<tr>\n<td>第13〜15版<\/td>\n<td>画面の言葉，解説タブの目次と方程式のまとめ，文字幅の余裕，指標の日本語名<\/td>\n<\/tr>\n<tr>\n<td>第16版<\/td>\n<td>理想スロットル（漏れ面積の廃止），補機の負荷，10 サイクル平均<\/td>\n<\/tr>\n<tr>\n<td>第17〜19版<\/td>\n<td>性能曲線の計測条件（点数，収束の判定，手順）を選べるようにした<\/td>\n<\/tr>\n<tr>\n<td>第20版<\/td>\n<td>排気系（脈動と背圧），アイドルの妥当性の判定<\/td>\n<\/tr>\n<tr>\n<td>第21版<\/td>\n<td>計算の高速化（結果は不変）<\
