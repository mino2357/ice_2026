_j\">\\ln n_j \\leftarrow \\ln n_j + \\lambda\\,\\Delta\\ln n_j<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ln N \\leftarrow \\ln N + \\lambda\\,\\Delta\\ln N\">\\ln N \\leftarrow \\ln N + \\lambda\\,\\Delta\\ln N<\/span><\/span>，緩和係数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lambda = \\min\\left(1, \\frac{2}{\\max\\left(5\\lvert\\Delta\\ln N\\rvert,\\ \\max_j\\lvert\\Delta\\ln n_j\\rvert\\right)}\\right)\">\\lambda = \\min\\left(1, \\frac{2}{\\max\\left(5\\lvert\\Delta\\ln N\\rvert,\\ \\max_j\\lvert\\Delta\\ln n_j\\rvert\\right)}\\right)<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\max_j\">\\max_j<\/span><\/span> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"n_j/N &gt; 10^{-8}\">n_j/N &gt; 10^{-8}<\/span><\/span> か <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta\\ln n_j &gt; 0\">\\Delta\\ln n_j &gt; 0<\/span><\/span> の化学種について取る）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"n_j\">n_j<\/span><\/span> の下限は <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-40}\">10^{-40}<\/span><\/span>．初期値は全化学種に <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.1\\sum_i b_i/10\">0.1\\sum_i b_i/10<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lambda = 1\">\\lambda = 1<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\max_j\\frac{n_j\\lvert\\Delta\\ln n_j\\rvert}{N} &lt; 10^{-11}\">\\max_j\\frac{n_j\\lvert\\Delta\\ln n_j\\rvert}{N} &lt; 10^{-11}<\/span><\/span> かつ <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lvert\\Delta\\ln N\\rvert &lt; 10^{-11}\">\\lvert\\Delta\\ln N\\rvert &lt; 10^{-11}<\/span><\/span> になったら終える（上限 400 回）．<\/li>\n<li><strong>物性<\/strong>： <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"e_b(T, p, \\zeta) = \\sum_j n_j\\,\\bar u_j(T) + (1 - \\eta_c)\\,\\zeta\\,e_f(T), \\qquad R_b(T, p, \\zeta) = \\bar R\\sum_j n_j + (1 - \\eta_c)\\,\\zeta\\,R_f, \\qquad h_b = e_b + R_b T\">e_b(T, p, \\zeta) = \\sum_j n_j\\,\\bar u_j(T) + (1 - \\eta_c)\\,\\zeta\\,e_f(T), \\qquad R_b(T, p, \\zeta) = \\bar R\\sum_j n_j + (1 - \\eta_c)\\,\\zeta\\,R_f, \\qquad h_b = e_b + R_b T<\/span><\/span><\/li>\n<\/ul><\/li>\n<li><strong>凍結<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"T &lt; T_{fr} = 1700\\ \\text{K}\">T &lt; T_{fr} = 1700\\ \\text{K}<\/span><\/span> では，組成を「同じ圧力 <span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span> で温度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{fr}\">T_{fr}<\/span><\/span> のときの平衡組成」に固定して 4 の物性の式を使う．膨張の途中で CO の酸化が止まることを表す．どの圧力で凍結したかという経路は追わない（状態量としての近似）．<\/li>\n<li><strong>表と補間<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"e_b\">e_b<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"R_b\">R_b<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"c_{v,b} \\equiv \\left(\\frac{\\partial e_b}{\\partial T}\\right)_{p,\\zeta}\">c_{v,b} \\equiv \\left(\\frac{\\partial e_b}{\\partial T}\\right)_{p,\\zeta}<\/span><\/span> を，次の格子の節点で求めて保持する．\n<ul>\n<li><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi_b\">\\phi_b<\/span><\/span>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.50\">0.50<\/span><\/span> から <span class=\"im\"><span class=\"tx raw\" data-tex=\"1.50\">1.50<\/span><\/span> まで <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.05\">0.05<\/span><\/span> 刻み（21 点）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"T\">T<\/span><\/span>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"250\">250<\/span><\/span> から <span class=\"im\"><span class=\"tx raw\" data-tex=\"3500\\ \\text{K}\">3500\\ \\text{K}<\/span><\/span> まで <span class=\"im\"><span class=\"tx raw\" data-tex=\"50\\ \\text{K}\">50\\ \\text{K}<\/span><\/span> 刻み（66 点）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"20\\ \\text{kPa}\">20\\ \\text{kPa}<\/span><\/span> から <span class=\"im\"><span class=\"tx raw\" data-tex=\"20\\ \\text{MPa}\">20\\ \\text{MPa}<\/span><\/span> まで公比 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{1/3}\">10^{1/3}<\/span><\/span> の 10 点．範囲の外は端の値に丸める．<\/li>\n<li>節点の <span class=\"im\"><span class=\"tx raw\" data-tex=\"c_{v,b}\">c_{v,b}<\/span><\/span> は，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T \\ge T_{fr}\">T \\ge T_{fr}<\/span><\/span> では平衡を解いた <span class=\"im\"><span class=\"tx raw\" data-tex=\"e_b\">e_b<\/span><\/span> の中心差分（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 1\\ \\text{K}\">\\pm 1\\ \\text{K}<\/span><\/span>），<span class=\"im\"><span class=\"tx raw\" data-tex=\"T &lt; T_{fr}\">T &lt; T_{fr}<\/span><\/span> では固定した組成での <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\sum_j n_j(\\bar c_{p,j} - \\bar R) + (1 - \\eta_c)\\zeta c_{v,f}\">\\sum_j n_j(\\bar c_{p,j} - \\bar R) + (1 - \\eta_c)\\zeta c_{v,f}<\/span><\/span>．<\/li>\n<li>補間：<span class=\"im\"><span class=\"tx raw\" data-tex=\"T\">T<\/span><\/span> の方向は，節点の値 <span class=\"im\"><span class=\"tx raw\" data-tex=\"e_b\">e_b<\/span><\/span> と傾き <span class=\"im\"><span class=\"tx raw\" data-tex=\"c_{v,b}\">c_{v,b}<\/span><\/span> による 3 次 Hermite 補間（<span class=\"im\"><span class=\"tx raw\" data-tex=\"R_b\">R_b<\/span><\/span> は線形）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ln p\">\\ln p<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi_b\">\\phi_b<\/span><\/span> の方向は線形．偏微分 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{\\partial e_b}{\\partial T}\">\\frac{\\partial e_b}{\\partial T}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{\\partial e_b}{\\partial p}\">\\frac{\\partial e_b}{\\partial p}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{\\partial e_b}{\\partial\\zeta}\">\\frac{\\partial e_b}{\\partial\\zeta}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{\\partial R_b}{\\partial T}\">\\frac{\\partial R_b}{\\partial T}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{\\partial R_b}{\\partial p}\">\\frac{\\partial R_b}{\\partial p}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{\\partial R_b}{\\partial\\zeta}\">\\frac{\\partial R_b}{\\partial\\zeta}<\/span><\/span> は，補間した関数を微分して求める（エネルギーの式と整合させるため）．<\/li>\n<li>表は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi_b\">\\phi_b<\/span><\/span> の節点ごとに，初めて必要になったときに作って保持する（起動時にはまとめて作らない）．計算は決定的で，同じ節点は同じ値になる．<\/li>\n<\/ul><\/li>\n<\/ol>\n<h4 id=\"spech49\">B. 筒内の式<\/h4>\n<ol type=\"1\">\n<li><p><strong>状態<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"m\">m<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_u\">m_u<\/span><\/span>（§2.2）に，次の 2 つを加える． | 記号 | 意味 | 単位 | | :--- | :--- | :--- | | <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_f\">m_f<\/span><\/span> | 筒内の未燃の燃料蒸気の質量 | kg | | <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{bf}\">m_{bf}<\/span><\/span> | 筒内の既燃ガスのうち，燃料に由来する質量 | kg |<\/p>\n<p>従属変数：未燃の空気 <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_a = m_u - m_f\">m_a = m_u - m_f<\/span><\/span>，既燃ガス <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_b = m - m_u\">m_b = m - m_u<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\zeta = \\frac{m_{bf}}{m_b}\">\\zeta = \\frac{m_{bf}}{m_b}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_b \\le 10^{-12}\\ \\text{kg}\">m_b \\le 10^{-12}\\ \\text{kg}<\/span><\/span> では <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\zeta = \\zeta^*\">\\zeta = \\zeta^*<\/span><\/span>），未燃ガスの燃料の割合 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\psi = \\frac{m_f}{m_u}\">\\psi = \\frac{m_f}{m_u}<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\zeta^*\">\\zeta^*<\/span><\/span> は筒外の既燃ガスに使う値で，排気弁が開く時点（EVO）の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\zeta\">\\zeta<\/span><\/span> で更新する（初期値は設定の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi\">\\phi<\/span><\/span> から <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{\\phi}{\\text{AF}_{st} + \\phi}\">\\frac{\\phi}{\\text{AF}_{st} + \\phi}<\/span><\/span>）．<\/p><\/li>\n<li><p><strong>温度<\/strong>：状態方程式 <span class=\"im\"><span class=\"tx raw\" data-tex=\"pV = \\mathcal{R}\\,T\">pV = \\mathcal{R}\\,T<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\mathcal{R} \\equiv m_a R_a + m_f R_f + m_b R_b(T, p, \\zeta)\">\\mathcal{R} \\equiv m_a R_a + m_f R_f + m_b R_b(T, p, \\zeta)<\/span><\/span> [J/K] を <span class=\"im\"><span class=\"tx raw\" data-tex=\"T\">T<\/span><\/span> について解く．<span class=\"im\"><span class=\"tx raw\" data-tex=\"R_b\">R_b<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"T\">T<\/span><\/span> に依存するので，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T^{(0)} = \\frac{pV}{m_a R_a + m_f R_f + m_b R_b(T_{fr}, p, \\zeta)}\">T^{(0)} = \\frac{pV}{m_a R_a + m_f R_f + m_b R_b(T_{fr}, p, \\zeta)}<\/span><\/span> から <span class=\"im\"><span class=\"tx raw\" data-tex=\"T^{(k+1)} = \\frac{pV}{m_a R_a + m_f R_f + m_b R_b(T^{(k)}, p, \\zeta)}\">T^{(k+1)} = \\frac{pV}{m_a R_a + m_f R_f + m_b R_b(T^{(k)}, p, \\zeta)}<\/span><\/span> を 6 回繰り返す（回数は固定．右辺を状態の関数にするため）．<\/p><\/li>\n<li><p><strong>成分の質量<\/strong>：流れ <span class=\"im\"><span class=\"tx raw\" data-tex=\"j\">j<\/span><\/span>（質量流量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_j\">\\dot m_j<\/span><\/span>，流入が正）の成分の質量分率を <span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_{a,j}\">Y_{a,j}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_{f,j}\">Y_{f,j}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_{b,j}\">Y_{b,j}<\/span><\/span>（和は 1），既燃分の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\zeta\">\\zeta<\/span><\/span> を <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\zeta_j\">\\zeta_j<\/span><\/span> とする．燃焼の速さ <span class=\"im\"><span class=\"tx raw\" data-tex=\"r\">r<\/span><\/span> は SPEC-06（<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{u,\\text{trapped}}\">m_{u,\\text{trapped}}<\/span><\/span> は点火の時点の <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_u\">m_u<\/span><\/span> とする．SPEC-30 の 7），液体の燃料の気化の速さ <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{ev}}\">\\dot m_{\\text{ev}}<\/span><\/span> は SPEC-30． <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\frac{dm}{dt} = \\sum_j\\dot m_j + \\dot m_{\\text{ev}}, \\qquad \\frac{dm_u}{dt} = \\sum_j\\dot m_j\\left(Y_{a,j} + Y_{f,j}\\right) + \\dot m_{\\text{ev}} - r\">\\frac{dm}{dt} = \\sum_j\\dot m_j + \\dot m_{\\text{ev}}, \\qquad \\frac{dm_u}{dt} = \\sum_j\\dot m_j\\left(Y_{a,j} + Y_{f,j}\\right) + \\dot m_{\\text{ev}} - r<\/span><\/span> <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\frac{dm_f}{dt} = \\sum_j\\dot m_j Y_{f,j} + \\dot m_{\\text{ev}} - r\\,\\psi, \\qquad \\frac{dm_{bf}}{dt} = \\sum_j\\dot m_j Y_{b,j}\\zeta_j + r\\,\\psi\">\\frac{dm_f}{dt} = \\sum_j\\dot m_j Y_{f,j} + \\dot m_{\\text{ev}} - r\\,\\psi, \\qquad \\frac{dm_{bf}}{dt} = \\sum_j\\dot m_j Y_{b,j}\\zeta_j + r\\,\\psi<\/span><\/span> | 流れ | 成分 | 温度 | <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\zeta_j\">\\zeta_j<\/span><\/span> | | :--- | :--- | :--- | :--- | | 筒内から出る流れ（吸気弁の逆流，排気弁の流出） | 筒内の値（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{m_a}{m}\">\\frac{m_a}{m}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{m_f}{m}\">\\frac{m_f}{m}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{m_b}{m}\">\\frac{m_b}{m}<\/span><\/span>） | <span class=\"im\"><span class=\"tx raw\" data-tex=\"T\">T<\/span><\/span> | <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\zeta\">\\zeta<\/span><\/span> | | 吸気弁の順流 | 上流の容積の値（<span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_{b,\\text{src}}\">Y_{b,\\text{src}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_{f,\\text{src}}\">Y_{f,\\text{src}}<\/span><\/span>．SPEC-05，SPEC-30） | <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{up}}\">T_{\\text{up}}<\/span><\/span>（SPEC-05 の 7） | <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\zeta^*\">\\zeta^*<\/span><\/span> | | 排気弁の逆流 | 既燃ガスだけ | <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_X\">T_X<\/span><\/span>（SPEC-27） | <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\zeta^*\">\\zeta^*<\/span><\/span> |<\/p>\n<p>流れのエンタルピーは <span class=\"im\"><span class=\"tx raw\" data-tex=\"h_j = Y_{a,j}h_a(T_j) + Y_{f,j}h_f(T_j) + Y_{b,j}h_b(T_j, p_j, \\zeta_j)\">h_j = Y_{a,j}h_a(T_j) + Y_{f,j}h_f(T_j) + Y_{b,j}h_b(T_j, p_j, \\zeta_j)<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_j\">p_j<\/span><\/span> は上流の圧力）．吸気弁の順流は，SPEC-05 の 7 と同じく，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{in}}\">T_{\\text{in}}<\/span><\/span> での値に余剰 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon_{\\text{src}}\">\\varepsilon_{\\text{src}}<\/span><\/span> を加える．<\/p><\/li>\n<li><p><strong>エネルギーの式<\/strong>：筒内の全内部エネルギーは <span class=\"im\"><span class=\"tx raw\" data-tex=\"U = m_a e_a(T) + m_f e_f(T) + m_b e_b(T, p, \\zeta)\">U = m_a e_a(T) + m_f e_f(T) + m_b e_b(T, p, \\zeta)<\/span><\/span>（絶対値）．第一法則は <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\frac{dU}{dt} = -p\\frac{dV}{dt} - \\dot Q_{\\text{wall}} + \\sum_j\\dot m_j h_j + \\dot m_{\\text{ev}}\\left[h_f(T_l) - h_{fg}\\right]\">\\frac{dU}{dt} = -p\\frac{dV}{dt} - \\dot Q_{\\text{wall}} + \\sum_j\\dot m_j h_j + \\dot m_{\\text{ev}}\\left[h_f(T_l) - h_{fg}\\right]<\/span><\/span> 発熱の項 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot Q_{\\text{comb}}\">\\dot Q_{\\text{comb}}<\/span><\/span> は無い．未燃ガスが既燃ガスに変わると，同じ温度での内部エネルギーが <span class=\"im\"><span class=\"tx raw\" data-tex=\"e_u - e_b\">e_u - e_b<\/span><\/span>（生成エンタルピーの差を含む）だけ下がり，その分が温度と圧力の上昇になる．最後の項は気化した燃料が持ち込むエネルギーで，液体のエンタルピーを <span class=\"im\"><span class=\"tx raw\" data-tex=\"h_f(T_l) - h_{fg}\">h_f(T_l) - h_{fg}<\/span><\/span> とする（SPEC-30）．<\/p><\/li>\n<li><p><strong><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot T\">\\dot T<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot p\">\\dot p<\/span><\/span> の連立<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot\\zeta = \\frac{\\dot m_{bf}\\,m_b - m_{bf}\\,\\dot m_b}{m_b^2}\">\\dot\\zeta = \\frac{\\dot m_{bf}\\,m_b - m_{bf}\\,\\dot m_b}{m_b^2}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_b \\le 10^{-12}\\ \\text{kg}\">m_b \\le 10^{-12}\\ \\text{kg}<\/span><\/span> では <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>），<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_b = \\dot m - \\dot m_u\">\\dot m_b = \\dot m - \\dot m_u<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_a = \\dot m_u - \\dot m_f\">\\dot m_a = \\dot m_u - \\dot m_f<\/span><\/span> とし， <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"C \\equiv m_a c_{v,a} + m_f c_{v,f} + m_b\\frac{\\partial e_b}{\\partial T}\">C \\equiv m_a c_{v,a} + m_f c_{v,f} + m_b\\frac{\\partial e_b}{\\partial T}<\/span><\/span> と書く．エネルギーの式の左辺を展開したものと，状態方程式を時間で微分したものは <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"C\\,\\dot T + m_b\\frac{\\partial e_b}{\\partial p}\\,\\dot p = S_E, \\qquad S_E \\equiv -p\\dot V - \\dot Q_{\\text{wall}} + \\sum_j\\dot m_j h_j + \\dot m_{\\text{ev}}\\left[h_f(T_l) - h_{fg}\\right] - \\dot m_a e_a - \\dot m_f e_f - \\dot m_b e_b - m_b\\frac{\\partial e_b}{\\partial\\zeta}\\dot\\zeta\">C\\,\\dot T + m_b\\frac{\\partial e_b}{\\partial p}\\,\\dot p = S_E, \\qquad S_E \\equiv -p\\dot V - \\dot Q_{\\text{wall}} + \\sum_j\\dot m_j h_j + \\dot m_{\\text{ev}}\\left[h_f(T_l) - h_{fg}\\right] - \\dot m_a e_a - \\dot m_f e_f - \\dot m_b e_b - m_b\\frac{\\partial e_b}{\\partial\\zeta}\\dot\\zeta<\/span><\/span> <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"-\\left(\\mathcal{R} + T m_b\\frac{\\partial R_b}{\\partial T}\\right)\\dot T + \\left(V - T m_b\\frac{\\partial R_b}{\\partial p}\\right)\\dot p = S_R, \\qquad S_R \\equiv -p\\dot V + T\\left(\\dot m_a R_a + \\dot m_f R_f + \\dot m_b R_b + m_b\\frac{\\partial R_b}{\\partial\\zeta}\\dot\\zeta\\right)\">-\\left(\\mathcal{R} + T m_b\\frac{\\partial R_b}{\\partial T}\\right)\\dot T + \\left(V - T m_b\\frac{\\partial R_b}{\\partial p}\\right)\\dot p = S_R, \\qquad S_R \\equiv -p\\dot V + T\\left(\\dot m_a R_a + \\dot m_f R_f + \\dot m_b R_b + m_b\\frac{\\partial R_b}{\\partial\\zeta}\\dot\\zeta\\right)<\/span><\/span> これを <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot p\">\\dot p<\/span><\/span> について解いて <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\frac{dp}{dt} = \\frac{C\\,S_R + \\left(\\mathcal{R} + T m_b\\frac{\\partial R_b}{\\partial T}\\right)S_E}{C\\left(V - T m_b\\frac{\\partial R_b}{\\partial p}\\right) + m_b\\frac{\\partial e_b}{\\partial p}\\left(\\mathcal{R} + T m_b\\frac{\\partial R_b}{\\partial T}\\right)}\">\\frac{dp}{dt} = \\frac{C\\,S_R + \\left(\\mathcal{R} + T m_b\\frac{\\partial R_b}{\\partial T}\\right)S_E}{C\\left(V - T m_b\\frac{\\partial R_b}{\\partial p}\\right) + m_b\\frac{\\partial e_b}{\\partial p}\\left(\\mathcal{R} + T m_b\\frac{\\partial R_b}{\\partial T}\\right)}<\/span><\/span> 組成が固定で <span class=\"im\"><span class=\"tx raw\" data-tex=\"R\">R<\/span><\/span> が共通（<span class=\"im\"><span class=\"tx raw\" data-tex=\"R_a = R_f = R_b = R\">R_a = R_f = R_b = R<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{\\partial e_b}{\\partial p} = \\frac{\\partial R_b}{\\partial p} = \\frac{\\partial R_b}{\\partial T} = 0\">\\frac{\\partial e_b}{\\partial p} = \\frac{\\partial R_b}{\\partial p} = \\frac{\\partial R_b}{\\partial T} = 0<\/span><\/span>）のとき，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\mathcal{R} = mR\">\\mathcal{R} = mR<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"C = mc_v\">C = mc_v<\/span><\/span> となり，SPEC-09 の式の形（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot Q_{\\text{comb}}\">\\dot Q_{\\text{comb}}<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"r(e_u - e_b)\">r(e_u - e_b)<\/span><\/span> に含まれる）に帰着する．<\/p><\/li>\n<li><p><strong>オリフィスの流れ<\/strong>（SPEC-04）と壁面熱伝達（SPEC-08）に使う比熱比と気体定数は，その場所の成分の質量分率で混合した値とする：<span class=\"im\"><span class=\"tx raw\" data-tex=\"R_{\\text{mix}} = \\sum_k Y_k R_k\">R_{\\text{mix}} = \\sum_k Y_k R_k<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"c_{v,\\text{mix}} = \\sum_k Y_k c_{v,k}\">c_{v,\\text{mix}} = \\sum_k Y_k c_{v,k}<\/span><\/span>（既燃ガスは <span class=\"im\"><span class=\"tx raw\" data-tex=\"c_{v,b} = \\frac{\\partial e_b}{\\partial T}\">c_{v,b} = \\frac{\\partial e_b}{\\partial T}<\/span><\/span>），<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma = 1 + \\frac{R_{\\text{mix}}}{c_{v,\\text{mix}}}\">\\gamma = 1 + \\frac{R_{\\text{mix}}}{c_{v,\\text{mix}}}<\/span><\/span>．<\/p><\/li>\n<li><p><strong>表示と集計に使う発熱率<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot Q_{\\text{comb}} \\equiv r\\left[(1 - \\psi)e_a(T) + \\psi e_f(T) - e_b(T, p, \\zeta)\\right]\">\\dot Q_{\\text{comb}} \\equiv r\\left[(1 - \\psi)e_a(T) + \\psi e_f(T) - e_b(T, p, \\zeta)\\right]<\/span><\/span>（その時点の温度と圧力で，未燃ガスが既燃ガスに変わるときに出る熱）．補助積分 <span class=\"im\"><span class=\"tx raw\" data-tex=\"Q_c\">Q_c<\/span><\/span> と熱発生率の線図に使う．エネルギーの式には使わない．<\/p><\/li>\n<li><p><strong>第一法則の検査<\/strong>：補助積分に <span class=\"im\"><span class=\"tx raw\" data-tex=\"H_e\">H_e<\/span><\/span>（被積分関数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{ev}}\\left[h_f(T_l) - h_{fg}\\right]\">\\dot m_{\\text{ev}}\\left[h_f(T_l) - h_{fg}\\right]<\/span><\/span>）を加え，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta U = -\\Delta W - \\Delta Q_w + \\Delta H_i - \\Delta H_o + \\Delta H_e\">\\Delta U = -\\Delta W - \\Delta Q_w + \\Delta H_i - \\Delta H_o + \\Delta H_e<\/span><\/span> の残差を，1 サイクルに供給した燃料の発熱量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_f H_u\">m_f H_u<\/span><\/span> で割って検査する．<\/p><\/li>\n<li><p><strong>初期値<\/strong>（コールドリセット）：筒内は温度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"320\\ \\text{K}\">320\\ \\text{K}<\/span><\/span> の空気（<span class=\"im\"><span class=\"tx raw\" data-tex=\"m = m_u = \\frac{p_{\\text{atm}}V(\\pi)}{R_a \\cdot 320}\">m = m_u = \\frac{p_{\\text{atm}}V(\\pi)}{R_a \\cdot 320}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_f = m_{bf} = 0\">m_f = m_{bf} = 0<\/span><\/span>）．<\/p><\/li>\n<\/ol>\n<h4 id=\"spech50\">C. 筒外の容積<\/h4>\n<ol type=\"1\">\n<li>吸気マニホールドとポートの圧力の式（SPEC-05，SPEC-25）は，成分ごとの気体定数を使う：容積 <span class=\"im\"><span class=\"tx raw\" data-tex=\"k\">k<\/span><\/span> について <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_k V_k = T_{\\text{in}}\\sum_c m_{c,k}R_c\">p_k V_k = T_{\\text{in}}\\sum_c m_{c,k}R_c<\/span><\/span> から <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{dp_k}{dt} = \\frac{T_{\\text{in}}}{V_k}\\sum_c R_c\\,\\dot m_{c,k}\">\\frac{dp_k}{dt} = \\frac{T_{\\text{in}}}{V_k}\\sum_c R_c\\,\\dot m_{c,k}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"c = a, f, b\">c = a, f, b<\/span><\/span>）．既燃ガスの気体定数は <span class=\"im\"><span class=\"tx raw\" data-tex=\"R_b^* \\equiv R_b(T_{\\text{in}}, 100\\ \\text{kPa}, \\zeta^*)\">R_b^* \\equiv R_b(T_{\\text{in}}, 100\\ \\text{kPa}, \\zeta^*)<\/span><\/span>．各容積の燃料蒸気の質量は SPEC-30 の状態で追う．<\/li>\n<li>排気系（SPEC-27）の気体定数は <span class=\"im\"><span class=\"tx raw\" data-tex=\"R_b(T_X, 100\\ \\text{kPa}, \\zeta^*)\">R_b(T_X, 100\\ \\text{kPa}, \\zeta^*)<\/span><\/span> とする．<\/li>\n<li>余剰エンタルピー（SPEC-05 の 7）は，筒内の成分で <span class=\"im\"><span class=\"tx raw\" data-tex=\"T\">T<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{in}}\">T_{\\text{in}}<\/span><\/span> のエンタルピーの差を取る（既燃ガスは <span class=\"im\"><span class=\"tx raw\" data-tex=\"h_b(T, p, \\zeta) - h_b(T_{\\text{in}}, p, \\zeta)\">h_b(T, p, \\zeta) - h_b(T_{\\text{in}}, p, \\zeta)<\/span><\/span>）．<\/li>\n<\/ol>\n<h4 id=\"spech51\">仮定と限界<\/h4>\n<ul>\n<li><p><strong>単一ゾーン<\/strong>：既燃ガスの平衡組成を筒内の平均温度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"T\">T<\/span><\/span> で評価する．実際の既燃部は平均より高温で，解離はもっと進む．このモデルは解離を小さく見積もる．<\/p><\/li>\n<li><p>平衡は 10 種．N，炭化水素の中間生成物，すすは扱わない．NO は平衡値で，実際より多い．<\/p><\/li>\n<li><p>凍結は，温度だけで決まる状態量の近似である（A の 5）．<\/p><\/li>\n<li><p>筒外の既燃ガスの組成は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\zeta^*\">\\zeta^*<\/span><\/span>（直近の EVO の値）とする．当量比を変えた直後の数サイクルは，筒外の既燃ガスの元素の量が正確には保存しない（質量は保存する）．<\/p><\/li>\n<li><p>燃料は 1 つの擬似種で，比熱はイソオクタン，発熱量と H/C はガソリンの値である．<\/p><\/li>\n<li><p>空気は O<span class=\"im\"><span class=\"tx raw\" data-tex=\"_2\">_2<\/span><\/span> と N<span class=\"im\"><span class=\"tx raw\" data-tex=\"_2\">_2<\/span><\/span> だけで，湿度と Ar は扱わない．<\/p><\/li>\n<li><p><strong>出典<\/strong>：<a target=\"_blank\" rel=\"noopener\" href=\"https://ntrs.nasa.gov/citations/19940013151\">B. J. McBride, S. Gordon, M. A. Reno, NASA TM-4513 (1993)<\/a>（係数．Cantera の `data/nasa_gas.yaml` から取った．<code>tools/richburn/thermo.json<\/code>）；S. Gordon and B. J. McBride, NASA RP-1311 (1994)（平衡の反復法）；Heywood (1988) Ch. 3，4（平衡と燃料空気サイクル．章の番号は記憶による）；試算と考察は <code>docs/report_richburn.md<\/code>．<\/p><\/li>\n<\/ul>\n<h4 id=\"spech52\">付表：NASA 7 係数多項式の係数<\/h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>化学種<\/th>\n<th>範囲 [K]<\/th>\n<th style=\"text-align: right;\"><span class=\"im\"><span class=\"tx raw\" data-tex=\"a_1\">a_1<\/span><\/span><\/th>\n<th style=\"text-align: right;\"><span class=\"im\"><span class=\"tx raw\" data-tex=\"a_2\">a_2<\/span><\/span><\/th>\n<th style=\"text-align: right;\"><span class=\"im\"><span class=\"tx raw\" data-tex=\"a_3\">a_3<\/span><\/ \/code><\/td>\n<td style=\"text-align: right;\"><code>3.11779172e-09<\/code><\/td>\n<td style=\"text-align: right;\"><code>-1.85312577e-13<\/code><\/td>\n<td style=\"text-align: right;\"><code>-3.58757973e+04<\/code><\/td>\n<td style=\"text-align: right;\"><code>-6.01161414e+01<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>燃料蒸気の係数は，イソオクタンの行に A の 3 の変換をしたもの．<\/p>\n<hr />\n","<h3 id=\"spech53\">SPEC-30：燃料の噴射と気化（REQ-30．第26版，未実装）<\/h3>\n<p>設定「燃焼」の <code>[噴射方式　ポート噴射／直噴]<\/code>（既定「直噴」）で選ぶ．熱物性（SPEC-29）が「化学種」でないときは，ポート噴射に固定する（第25版の予混合気のまま．設定画面では変更できない）．以下は「化学種」のときの定めである．<\/p>\n<h4 id=\"spech54\">定義と式<\/h4>\n<ol type=\"1\">\n<li><p><strong>吸気側の燃料蒸気の追跡<\/strong>：吸気マニホールドとポートの燃料蒸気の質量を状態に加える． | 記号 | 意味 | 単位 | | :--- | :--- | :--- | | <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{f,\\text{in}}\">m_{f,\\text{in}}<\/span><\/span> | 吸気マニホールド内の燃料蒸気の質量 | kg | | <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{f,p}\">m_{f,p}<\/span><\/span> | 吸気ポート内の燃料蒸気の質量 | kg |<\/p>\n<p>式は既燃ガスの追跡（SPEC-05 の 6，SPEC-25）と同じ形で，既燃分率を燃料蒸気の分率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_{f,k} = \\text{clamp}\\left(\\frac{m_{f,k}}{m_k}, 0, 1\\right)\">Y_{f,k} = \\text{clamp}\\left(\\frac{m_{f,k}}{m_k}, 0, 1\\right)<\/span><\/span> に，筒内から出る流れの分率を <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{m_f}{m}\">\\frac{m_f}{m}<\/span><\/span> に置き換える．スロットルの順流が運ぶ燃料は 2 と 3 で定める．<\/p><\/li>\n<li><p><strong>ポート噴射<\/strong>：スロットルの順流は，当量比 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi\">\\phi<\/span><\/span>（設定）の予混合気とする．燃料蒸気の質量分率は <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_\\phi = \\frac{\\phi}{\\text{AF}_{st} + \\phi}\">f_\\phi = \\frac{\\phi}{\\text{AF}_{st} + \\phi}<\/span><\/span> で，マニホールドには <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_\\phi\\,\\dot m_{\\text{th}}^+\">f_\\phi\\,\\dot m_{\\text{th}}^+<\/span><\/span> の燃料蒸気が入る．オリフィスの式の上流のガスは，この混合気（<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{amb}}\">T_{\\text{amb}}<\/span><\/span>）である．気化に要る熱は上流でまかなわれるとし，筒内では潜熱を引かない（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{inj}} = 0\">\\dot m_{\\text{inj}} = 0<\/span><\/span>）．<\/p><\/li>\n<li><p><strong>直噴<\/strong>：スロットルの順流は空気だけ（<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_\\phi = 0\">f_\\phi = 0<\/span><\/span>）．燃料は 4〜6 のとおり筒内へ噴く．<\/p><\/li>\n<li><p><strong>噴射量<\/strong>（ECU）：吸気弁が閉じる時点（IVC）ごとに，筒内の未燃の空気の質量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_a\">m_a<\/span><\/span> を <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\hat m_a\">\\hat m_a<\/span><\/span> として記録する．次の噴射の指令は <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"m_{f,\\text{cmd}} = \\frac{\\phi\\,\\hat m_a}{\\text{AF}_{st}}\">m_{f,\\text{cmd}} = \\frac{\\phi\\,\\hat m_a}{\\text{AF}_{st}}<\/span><\/span> 過渡では 1 サイクル遅れる．リセットの後，最初の IVC までは <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\hat m_a = \\frac{p_{\\text{in}}V_d}{R_a T_{\\text{in}}}\">\\hat m_a = \\frac{p_{\\text{in}}V_d}{R_a T_{\\text{in}}}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"V_d\">V_d<\/span><\/span>：行程容積）．燃料 OFF（点火しない条件．SPEC-12）では噴かない．<\/p><\/li>\n<li><p><strong>噴射の時期と噴射率<\/strong>：噴射の開始角を <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta_{\\text{SOI}}\">\\theta_{\\text{SOI}}<\/span><\/span>（設定）とする．開始の時点の角速度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\omega_{\\text{SOI}}\">\\omega_{\\text{SOI}}<\/span><\/span> と，インジェクタの流量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"q_{\\text{inj}}\">q_{\\text{inj}}<\/span><\/span>（設定）から，噴射の角度の幅を <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\Delta\\theta_{\\text{inj}} = \\text{clamp}\\left(\\frac{\\omega_{\\text{SOI}}\\,m_{f,\\text{cmd}}}{q_{\\text{inj}}},\\ 1^\\circ,\\ 300^\\circ\\right)\">\\Delta\\theta_{\\text{inj}} = \\text{clamp}\\left(\\frac{\\omega_{\\text{SOI}}\\,m_{f,\\text{cmd}}}{q_{\\text{inj}}},\\ 1^\\circ,\\ 300^\\circ\\right)<\/span><\/span> と決め，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0 \\le \\text{md}(\\theta - \\theta_{\\text{SOI}}) &lt; \\Delta\\theta_{\\text{inj}}\">0 \\le \\text{md}(\\theta - \\theta_{\\text{SOI}}) &lt; \\Delta\\theta_{\\text{inj}}<\/span><\/span> の間，クランク角について一定の率で噴く： <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\dot m_{\\text{inj}} = \\frac{m_{f,\\text{cmd}}}{\\Delta\\theta_{\\text{inj}}}\\,\\omega\">\\dot m_{\\text{inj}} = \\frac{m_{f,\\text{cmd}}}{\\Delta\\theta_{\\text{inj}}}\\,\\omega<\/span><\/span> それ以外では <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{inj}} = 0\">\\dot m_{\\text{inj}} = 0<\/span><\/span>．1 サイクルに噴く質量は，回転数が途中で変わっても <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{f,\\text{cmd}}\">m_{f,\\text{cmd}}<\/span><\/span> に一致する．噴射の開始と終了は積分のイベントとし，その角度でステップをちょうど終える（SPEC-13）．幅が上限の <span class=\"im\"><span class=\"tx raw\" data-tex=\"300^\\circ\">300^\\circ<\/span><\/span> に達したときは，インジェクタの流量を超える率で噴くことになる（画面に注記する）．<\/p><\/li>\n<li><p><strong>気化<\/strong>：筒内の液体の燃料の質量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_l\">m_l<\/span><\/span> を状態に加える．気化の時定数を <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\tau_{\\text{ev}}\">\\tau_{\\text{ev}}<\/span><\/span>（設定）として <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\frac{dm_l}{dt} = \\dot m_{\\text{inj}} - \\dot m_{\\text{ev}}, \\qquad \\dot m_{\\text{ev}} = \\frac{m_l}{\\tau_{\\text{ev}}}\">\\frac{dm_l}{dt} = \\dot m_{\\text{inj}} - \\dot m_{\\text{ev}}, \\qquad \\dot m_{\\text{ev}} = \\frac{m_l}{\\tau_{\\text{ev}}}<\/span><\/span> <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\tau_{\\text{ev}} = 0\">\\tau_{\\text{ev}} = 0<\/span><\/span> のときは <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{ev}} = \\dot m_{\\text{inj}}\">\\dot m_{\\text{ev}} = \\dot m_{\\text{inj}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_l = 0\">m_l = 0<\/span><\/span> とする．気化した燃料は未燃の燃料蒸気になり（SPEC-29 B の 3 の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{ev}}\">\\dot m_{\\text{ev}}<\/span><\/span>），筒内のガスにエネルギー <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{ev}}\\left[h_f(T_l) - h_{fg}\\right]\">\\dot m_{\\text{ev}}\\left[h_f(T_l) - h_{fg}\\right]<\/span><\/span> を持ち込む（SPEC-29 B の 4）．液体は温度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_l = 300\\ \\text{K}\">T_l = 300\\ \\text{K}<\/span><\/span> のままで，体積を占めず，弁からは出ないとする．<span class=\"im\"><span class=\"tx raw\" data-tex=\"h_{fg} = 350\\ \\text{kJ/kg}\">h_{fg} = 350\\ \\text{kJ/kg}<\/span><\/span>．<\/p>\n<ul>\n<li>断熱・定容で，筒内のガス（熱容量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"C\">C<\/span><\/span>．SPEC-29 B の 5）に質量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta m\">\\Delta m<\/span><\/span> の燃料が気化すると，温度の変化は <span class=\"im\"><span class=\"tx raw\" data-tex=\"C\\,\\Delta T \\approx -\\Delta m\\left[h_{fg} + e_f(T) - h_f(T_l)\\right]\">C\\,\\Delta T \\approx -\\Delta m\\left[h_{fg} + e_f(T) - h_f(T_l)\\right]<\/span><\/span> である．<\/li>\n<li>燃え終わった後に気化した燃料は，未燃の燃料蒸気として残り，排気弁から出る．<\/li>\n<\/ul><\/li>\n<li><p><strong>点火の時点の当量比<\/strong>：点火の時点の筒内の未燃ガスから <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi_c = \\text{AF}_{st}\\,\\frac{m_f}{m_a}\">\\phi_c = \\text{AF}_{st}\\,\\frac{m_f}{m_a}<\/span><\/span> を求め，そのサイクルの層流燃焼速度（SPEC-07）に使う．燃焼の速さ <span class=\"im\"><span class=\"tx raw\" data-tex=\"r\">r<\/span><\/span> の <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{u,\\text{trapped}}\">m_{u,\\text{trapped}}<\/span><\/span> は，点火の時点の <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_u\">m_u<\/span><\/span> とする（ポート噴射では IVC の値と同じ）．<\/p><\/li>\n<li><p><strong>供給した燃料<\/strong>（効率と燃料消費率の分母．SPEC-14）：直噴では <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{f,\\text{cmd}}\">m_{f,\\text{cmd}}<\/span><\/span>，ポート噴射では IVC の時点の筒内の燃料蒸気 <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_f\">m_f<\/span><\/span>．<\/p><\/li>\n<li><p><strong>設定<\/strong>（ページ「燃焼」）： | 項目 | 範囲，刻み，既定 | 区分 | | :--- | :--- | :--- | | 熱物性 | 化学種／γ(T)／γ一定，既定 化学種 | 即時 | | 噴射方式 | ポート噴射／直噴，既定 直噴 | 即時 | | 噴射開始 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta_{\\text{SOI}}\">\\theta_{\\text{SOI}}<\/span><\/span>（°．吸気上死点後） | <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"330\">330<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"5\">5<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"80\">80<\/span><\/span> | 即時 | | インジェクタ流量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"q_{\\text{inj}}\">q_{\\text{inj}}<\/span><\/span>（g/s） | <span class=\"im\"><span class=\"tx raw\" data-tex=\"5\">5<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"40\">40<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"1\">1<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"15\">15<\/span><\/span> | 即時 | | 気化の時定数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\tau_{\\text{ev}}\">\\tau_{\\text{ev}}<\/span><\/span>（ms） | <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"10\">10<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.1\">0.1<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"1.5\">1.5<\/span><\/span> | 即時 |<\/p>\n<p>噴射開始，インジェクタ流量，気化の時定数は，ポート噴射のときは使わない（SPEC-18 B.7 と同じく無効にする）．<\/p><\/li>\n<\/ol>\n<h4 id=\"spech55\">仮定と限界<\/h4>\n<ul>\n<li><p>冷却は<strong>上限寄り<\/strong>である：壁やピストンに付いた燃料が壁から熱をもらうこと，液滴が温まる分は扱わない．<\/p><\/li>\n<li><p>筒内は一様で，成層と，噴霧による乱れの増加は扱わない．<\/p><\/li>\n<li><p><span class=\"im\"><span class=\"tx raw\" data-tex=\"q_{\\text{inj}}\">q_{\\text{inj}}<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\tau_{\\text{ev}}\">\\tau_{\\text{ev}}<\/span><\/span> の既定値は推定で，実機の値で確かめていない．既定の行程容積（<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.50\\ \\text{L}\">0.50\\ \\text{L}<\/span><\/span>）の全開では，1 サイクルの燃料は約 <span class=\"im\"><span class=\"tx raw\" data-tex=\"35\\ \\text{mg}\">35\\ \\text{mg}<\/span><\/span> で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"15\\ \\text{g/s}\">15\\ \\text{g/s}<\/span><\/span> なら噴射は約 <span class=\"im\"><span class=\"tx raw\" data-tex=\"2.3\\ \\text{ms}\">2.3\\ \\text{ms}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"7000\\ \\text{rpm}\">7000\\ \\text{rpm}<\/span><\/span> で約 <span class=\"im\"><span class=\"tx raw\" data-tex=\"100^\\circ\">100^\\circ<\/span><\/span>）になる．<\/p><\/li>\n<li><p>噴射時期は固定の設定で，回転数や負荷で自動には動かさない．噴射の時間と気化の時定数は時間で決まるので，高回転ほどクランク角では長くなり，気化の一部が吸気弁の閉じた後にずれ込む（<span class=\"im\"><span class=\"tx raw\" data-tex=\"7000\\ \\text{rpm}\">7000\\ \\text{rpm}<\/span><\/span> で噴射が約 <span class=\"im\"><span class=\"tx raw\" data-tex=\"100^\\circ\">100^\\circ<\/span><\/span>，時定数が約 <span class=\"im\"><span class=\"tx raw\" data-tex=\"63^\\circ\">63^\\circ<\/span><\/span>）．壁への付着と混合を扱わないので，早く噴くことの不利益は現れない．<\/p><\/li>\n<li><p>既定の噴射開始（吸気上死点後 <span class=\"im\"><span class=\"tx raw\" data-tex=\"80^\\circ\">80^\\circ<\/span><\/span>）では，気化の大半が吸気弁の閉じる前に起こり，冷却が空気量の増加に効く．吸気弁が閉じた後に噴くと，圧縮の温度が下がるだけになる．<\/p><\/li>\n<li><p>ポート噴射の「上流で気化」は第25版の仮定の引き継ぎで，吸気管の壁の燃料の膜は扱わない．<\/p><\/li>\n<li><p><strong>出典<\/strong>：直噴の体積効率の実測は <a target=\"_blank\" rel=\"noopener\" href=\"https://saemobilus.sae.org/papers/volumetric-efficiency-direct-port-injection-gasoline-engines-different-fuels-2002-01-0839\">SAE Technical Paper 2002-01-0839<\/a>；気化潜熱の値は Heywood (1988) の燃料の物性の表（表の番号は未確認）；考察は <code>docs/report_richburn.md<\/code>．<\/p><\/li>\n<\/ul>\n<hr />\n","<h2 id=\"spech56\">4. 数値積分と性能の指標<\/h2>\n","<h3 id=\"spech57\">SPEC-13：数値積分（REQ-13）<\/h3>\n<h4 id=\"spech58\">定義と式<\/h4>\n<ol type=\"1\">\n<li><strong>RK4<\/strong>：クランク角の刻み <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta\\theta_{\\text{step}}\">\\Delta\\theta_{\\text{step}}<\/span><\/span>（設定，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.25\">0.25<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"2^\\circ\">2^\\circ<\/span><\/span>，既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.25^\\circ\">0.25^\\circ<\/span><\/span>）から <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\Delta t = \\min\\left(\\frac{\\Delta\\theta_{\\text{step}}}{\\max(\\omega, \\omega_{\\min})},\\ \\Delta t_{\\max}\\right), \\qquad \\omega_{\\min} = 20\\ \\text{rad/s},\\ \\Delta t_{\\max} = 3 \\times 10^{-5}\\ \\text{s}\">\\Delta t = \\min\\left(\\frac{\\Delta\\theta_{\\text{step}}}{\\max(\\omega, \\omega_{\\min})},\\ \\Delta t_{\\max}\\right), \\qquad \\omega_{\\min} = 20\\ \\text{rad/s},\\ \\Delta t_{\\max} = 3 \\times 10^{-5}\\ \\text{s}<\/span><\/span> <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\mathbf{k}_1 = \\mathbf{f}(\\mathbf{y}_n),\\ \\mathbf{k}_2 = \\mathbf{f}\\left(\\mathbf{y}_n + \\tfrac{\\Delta t}{2}\\mathbf{k}_1\\right),\\ \\mathbf{k}_3 = \\mathbf{f}\\left(\\mathbf{y}_n + \\tfrac{\\Delta t}{2}\\mathbf{k}_2\\right),\\ \\mathbf{k}_4 = \\mathbf{f}(\\mathbf{y}_n + \\Delta t\\,\\mathbf{k}_3), \\qquad \\mathbf{y}_{n+1} = \\mathbf{y}_n + \\tfrac{\\Delta t}{6}(\\mathbf{k}_1 + 2\\mathbf{k}_2 + 2\\mathbf{k}_3 + \\mathbf{k}_4)\">\\mathbf{k}_1 = \\mathbf{f}(\\mathbf{y}_n),\\ \\mathbf{k}_2 = \\mathbf{f}\\left(\\mathbf{y}_n + \\tfrac{\\Delta t}{2}\\mathbf{k}_1\\right),\\ \\mathbf{k}_3 = \\mathbf{f}\\left(\\mathbf{y}_n + \\tfrac{\\Delta t}{2}\\mathbf{k}_2\\right),\\ \\mathbf{k}_4 = \\mathbf{f}(\\mathbf{y}_n + \\Delta t\\,\\mathbf{k}_3), \\qquad \\mathbf{y}_{n+1} = \\mathbf{y}_n + \\tfrac{\\Delta t}{6}(\\mathbf{k}_1 + 2\\mathbf{k}_2 + 2\\mathbf{k}_3 + \\mathbf{k}_4)<\/span><\/span><\/li>\n<li><strong>DOPRI5<\/strong>：節点 <span class=\"im\"><span class=\"tx raw\" data-tex=\"c = \\left(0, \\frac15, \\frac{3}{10}, \\frac45, \\frac89, 1, 1\\right)\">c = \\left(0, \\frac15, \\frac{3}{10}, \\frac45, \\frac89, 1, 1\\right)<\/span><\/span>，5 次の重み <span class=\"im\"><span class=\"tx raw\" data-tex=\"b = \\left(\\frac{35}{384}, 0, \\frac{500}{1113}, \\frac{125}{192}, -\\frac{2187}{6784}, \\frac{11}{84}, 0\\right)\">b = \\left(\\frac{35}{384}, 0, \\frac{500}{1113}, \\frac{125}{192}, -\\frac{2187}{6784}, \\frac{11}{84}, 0\\right)<\/span><\/span>，4 次の重み <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\hat b = \\left(\\frac{5179}{57600}, 0, \\frac{7571}{16695}, \\frac{393}{640}, -\\frac{92097}{339200}, \\frac{187}{2100}, \\frac{1}{40}\\right)\">\\hat b = \\left(\\frac{5179}{57600}, 0, \\frac{7571}{16695}, \\frac{393}{640}, -\\frac{92097}{339200}, \\frac{187}{2100}, \\frac{1}{40}\\right)<\/span><\/span>．5 次の解 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\mathbf{y}_5\">\\mathbf{y}_5<\/span><\/span> で進め，4 次の解 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\mathbf{y}_4\">\\mathbf{y}_4<\/span><\/span> との差で誤差を見積もる： <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"E = \\max_i\\frac{|y_{5,i} - y_{4,i}|}{\\text{atol}_i + \\text{rtol}\\cdot\\max(|y_{n,i}|, |y_{5,i}|)}\">E = \\max_i\\frac{|y_{5,i} - y_{4,i}|}{\\text{atol}_i + \\text{rtol}\\cdot\\max(|y_{n,i}|, |y_{5,i}|)}<\/span><\/span> <span class=\"im\"><span class=\"tx raw\" data-tex=\"E \\le 1\">E \\le 1<\/span><\/span> なら受理し，次の刻みを <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta t\\cdot\\min\\left(2.5, \\max\\left(0.2,\\ 0.9E^{-1/5}\\right)\\right)\">\\Delta t\\cdot\\min\\left(2.5, \\max\\left(0.2,\\ 0.9E^{-1/5}\\right)\\right)<\/span><\/span> とする．<span class=\"im\"><span class=\"tx raw\" data-tex=\"E &gt; 1\">E &gt; 1<\/span><\/span> なら同じ係数で縮めてやり直す．刻みの上限は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\min\\left(\\frac{0.5^\\circ}{\\max(\\omega, \\omega_{\\min})},\\ 10^{-3}\\ \\text{s}\\right)\">\\min\\left(\\frac{0.5^\\circ}{\\max(\\omega, \\omega_{\\min})},\\ 10^{-3}\\ \\text{s}\\right)<\/span><\/span>．rtol は設定（<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-4}\">10^{-4}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-5}\">10^{-5}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-6}\">10^{-6}<\/span><\/span>，既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-5}\">10^{-5}<\/span><\/span>）．やり直しが 13 回続くか，刻みが <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-8}\\ \\text{s}\">10^{-8}\\ \\text{s}<\/span><\/span> を下回ったときは，誤差が許容を超えていても受理し，その回数を数える（<strong>強制受理<\/strong>）．\n<ul>\n<li>絶対許容誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{atol}_i\">\\text{atol}_i<\/span><\/span>（SI）：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta\">\\theta<\/span><\/span>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-6}\">10^{-6}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\omega\">\\omega<\/span><\/span>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-3}\">10^{-3}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{in}}\">p_{\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_p\">p_p<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{pe}\">p_{pe}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_m\">p_m<\/span><\/span>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"1\">1<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m\">m<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_u\">m_u<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{b,\\text{in}}\">m_{b,\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{b,p}\">m_{b,p}<\/span><\/span>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_w\">T_w<\/span><\/span>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-4}\">10^{-4}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_r\">\\dot m_r<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_e\">\\dot m_e<\/span><\/span>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-6}\">10^{-6}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"E_{\\text{in}}\">E_{\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"E_p\">E_p<\/span><\/span>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-6}\">10^{-6}<\/span><\/span>．<\/li>\n<\/ul><\/li>\n<li><strong>補助積分<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\mathbf{z}\">\\mathbf{z}<\/span><\/span>（§2.3）は，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\mathbf{y}\">\\mathbf{y}<\/span><\/span> と同じ段の値と重みで積分する（RK4 は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac16(1, 2, 2, 1)\">\\frac16(1, 2, 2, 1)<\/span><\/span>，DOPRI5 は <span class=\"im\"><span class=\"tx raw\" data-tex=\"b\">b<\/span><\/span>）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\mathbf{z}\">\\mathbf{z}<\/span><\/span> は誤差の見積もりに含めない．これにより，サイクルの集計は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\mathbf{y}\">\\mathbf{y}<\/span><\/span> と同じ次数になり，保存則（質量，既燃ガス，余剰エンタルピー，エネルギー）の検査式は Runge–Kutta の各ステップで丸め誤差の範囲で成り立つ．<\/li>\n<li><strong>イベント<\/strong>：次の角度では右辺が折れるか，状態の記録や切替が起きる．ステップは，これらの角度を<strong>またがず，ちょうどその角度で終わる<\/strong>ようにする．\n<ul>\n<li>サイクルの終端 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta = 4\\pi\">\\theta = 4\\pi<\/span><\/span>，吸気弁の開閉（IVO，IVC），排気弁の開閉（EVO，EVC），点火（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta = 2\\pi - s\">\\theta = 2\\pi - s<\/span><\/span>）<\/li>\n<li>手順：次のイベントまでの角度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"d\">d<\/span><\/span> が，予定の刻みで進む角度以下なら，刻みを <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta t = d/\\omega\">\\Delta t = d/\\omega<\/span><\/span> とする．ステップ後の角度の残差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\delta = \\theta_e - \\theta_{n+1}\">\\delta = \\theta_e - \\theta_{n+1}<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"|\\delta| &gt; 10^{-9}\\ \\text{rad}\">|\\delta| &gt; 10^{-9}\\ \\text{rad}<\/span><\/span> なら <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta t \\leftarrow \\Delta t + \\delta/\\omega_{n+1}\">\\Delta t \\leftarrow \\Delta t + \\delta/\\omega_{n+1}<\/span><\/span> として同じ始点からやり直す（最大 4 回）．<\/li>\n<li>イベントでの処理は，<strong>そのステップの終端の状態<\/strong>（同じ時刻の <span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"V\">V<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T\">T<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_u\">m_u<\/span><\/span>）で行う：IVC では基準状態 <span class=\"im\"><span class=\"tx raw\" data-tex=\"(p_r, V_r, T_r)\">(p_r, V_r, T_r)<\/span><\/span>（SPEC-08）と <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{u,\\text{trapped}}\">m_{u,\\text{trapped}}<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r\">x_r<\/span><\/span> を記録，点火では SPEC-07 の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta_0\">\\theta_0<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta\\theta_b\">\\Delta\\theta_b<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"Q_{\\text{in}}\">Q_{\\text{in}}<\/span><\/span> を計算，サイクルの終端では集計（SPEC-14）・点火時期の更新（SPEC-12）・<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\max}\">p_{\\max}<\/span><\/span> の更新（SPEC-10）を行い，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta \\leftarrow \\theta - 4\\pi\">\\theta \\leftarrow \\theta - 4\\pi<\/span><\/span> とする．<\/li>\n<li><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\omega = 0\">\\omega = 0<\/span><\/span> ではイベントの処理をしない．設定の変更で角度が動いたイベントは，次にその角度に達したときに処理する．<\/li>\n<\/ul><\/li>\n<li><strong>筒内最高圧<\/strong>：ステップ点の圧力が極大になった点と前後の点（角度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta_{-}, \\theta_0, \\theta_{+}\">\\theta_{-}, \\theta_0, \\theta_{+}<\/span><\/span>，圧力 <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{-}, p_0, p_{+}\">p_{-}, p_0, p_{+}<\/span><\/span>）を通る放物線の頂点の値を，そのサイクルの <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\max}\">p_{\\max}<\/span><\/span> の候補とし，候補の最大を取る．<\/li>\n<li><strong>制御入力の保持<\/strong>：ECU と動力計の状態（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N\">\\bar N<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"I_\\alpha\">I_\\alpha<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"I_f\">I_f<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{eff}}\">f_{\\text{eff}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha\">\\alpha<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{cmd}}\">f_{\\text{cmd}}<\/span><\/span>）は，ステップの終わりにそのステップの刻み <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta t\">\\Delta t<\/span><\/span> で更新し，ステップの間は一定とする（積分は陽的 Euler，一次遅れは指数形）．制御の離散化の周期はソルバの刻みである．<\/li>\n<li><strong>射影<\/strong>：ステップの後で，丸めによる非物理的な値を防ぐために次の下限・上限を適用し，適用した回数を数える：<span class=\"im\"><span class=\"tx raw\" data-tex=\"m \\ge 10^{-7}\\ \\text{kg}\">m \\ge 10^{-7}\\ \\text{kg}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0 \\le m_u \\le m\">0 \\le m_u \\le m<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p, p_p, p_{pe}, p_m \\ge 1\\ \\text{kPa}\">p, p_p, p_{pe}, p_m \\ge 1\\ \\text{kPa}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{b,\\text{in}}, m_{b,p}, E_{\\text{in}}, E_p \\ge 0\">m_{b,\\text{in}}, m_{b,p}, E_{\\text{in}}, E_p \\ge 0<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\omega \\ge 0\">\\omega \\ge 0<\/span><\/span>．<strong>通常の運転では一度も適用されないこと<\/strong>を要件とする．<\/li>\n<\/ol>\n<h4 id=\"spech59\">系の硬さと刻みの上限<\/h4>\n<p>最も硬いのは，弁が開いていて弁の前後の圧力がほぼ等しいときの，筒内とポートの間のやりとりである（SPEC-04 の直線部の傾きによる）．周期定常のサイクルに沿ったヤコビアン <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{\\partial\\mathbf f}{\\partial\\mathbf y}\">\\frac{\\partial\\mathbf f}{\\partial\\mathbf y}<\/span><\/span> の固有値の絶対値の最大は，試作で次のとおりだった．<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>条件<\/th>\n<th style=\"text-align: right;\"><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\max\\lvert\\lambda\\rvert\">\\max\\lvert\\lambda\\rvert<\/span><\/span> [1/s]<\/th>\n<th>場所<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>アイドル<\/td>\n<td style=\"text-align: right;\"><span class=\"im\"><span class=\"tx raw\" data-tex=\"6.5 \\times 10^4\">6.5 \\times 10^4<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"599^\\circ\">599^\\circ<\/span><\/span>（排気行程）．TEST-13 項目 10（<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^\\circ\">10^\\circ<\/span><\/span> ごと）の実測は <span class=\"im\"><span class=\"tx raw\" data-tex=\"6.0 \\times 10^4\">6.0 \\times 10^4<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"590^\\circ\">590^\\circ<\/span><\/span>）<\/td>\n<\/tr>\n<tr>\n<td>全開 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1000\\ \\text{rpm}\">1000\\ \\text{rpm}<\/span><\/span><\/td>\n<td style=\"text-align: right;\"><span class=\"im\"><span class=\"tx raw\" data-tex=\"7.5 \\times 10^4\">7.5 \\times 10^4<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"638^\\circ\">638^\\circ<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>全開 <span class=\"im\"><span class=\"tx raw\" data-tex=\"3000\\ \\text{rpm}\">3000\\ \\text{rpm}<\/span><\/span><\/td>\n<td style=\"text-align: right;\"><span class=\"im\"><span class=\"tx raw\" data-tex=\"3.8 \\times 10^4\">3.8 \\times 10^4<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"185^\\circ\">185^\\circ<\/span><\/span>（吸気下死点付近）<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"2000\\ \\text{rpm}\">2000\\ \\text{rpm}<\/span><\/span> 部分負荷<\/td>\n<td style=\"text-align: right;\"><span class=\"im\"><span class=\"tx raw\" data-tex=\"2.8 \\times 10^4\">2.8 \\times 10^4<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"633^\\circ\">633^\\circ<\/span><\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>RK4 の実軸上の安定限界は <span class=\"im\"><span class=\"tx raw\" data-tex=\"|\\lambda|\\Delta t \\le 2.79\">|\\lambda|\\Delta t \\le 2.79<\/span><\/span> なので，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta t_{\\max} = 3 \\times 10^{-5}\\ \\text{s}\">\\Delta t_{\\max} = 3 \\times 10^{-5}\\ \\text{s}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"|\\lambda|\\Delta t \\le 2.3\">|\\lambda|\\Delta t \\le 2.3<\/span><\/span>）とした．DOPRI5 は誤差制御が刻みを安定限界の内側に保つ．<\/p>\n<h4 id=\"spech60\">仮定と限界<\/h4>\n<ul>\n<li><p>DOPRI5 の刻みは，ほとんどのステップで上限 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5^\\circ\">0.5^\\circ<\/span><\/span> に張り付く．rtol を変えても刻みの数と結果はほとんど変わらない（精度を決めているのは上限とイベントの扱いである）．<\/p><\/li>\n<li><p>燃焼の開始と終了（Wiebe 関数の端）はイベントにしていない．<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_w = 0\">m_w = 0<\/span><\/span> では熱発生率がそこで不連続になる．<\/p><\/li>\n<li><p><strong>出典<\/strong>：<a target=\"_blank\" rel=\"noopener\" href=\"https://doi.org/10.1016/0771-050X(80)90013-3\">J. R. Dormand and P. J. Prince, <em>J. Comput. Appl. Math.<\/em> 6, 19–26 (1980)<\/a><\/p><\/li>\n<\/ul>\n<hr />\n","<h3 id=\"spech61\">SPEC-14：性能の指標と基準サイクル（REQ-14）<\/h3>\n<h4 id=\"spech62\">定義と式<\/h4>\n<p>1 サイクルの間の補助積分の増分を <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta\">\\Delta<\/span><\/span> で表し，サイクルの所要時間を <span class=\"im\"><span class=\"tx raw\" data-tex=\"t_c\">t_c<\/span><\/span> とする．<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>指標<\/th>\n<th>定義<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>正味の図示仕事，圧縮膨張の図示仕事<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"W_{i,\\text{net}} = \\Delta W = \\oint p\\,dV\">W_{i,\\text{net}} = \\Delta W = \\oint p\\,dV<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"W_{i,\\text{gross}} = \\Delta W_g\">W_{i,\\text{gross}} = \\Delta W_g<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pi \\le \\theta &lt; 3\\pi\">\\pi \\le \\theta &lt; 3\\pi<\/span><\/span>）<\/td>\n<\/tr>\n<tr>\n<td>図示平均有効圧，ポンプ損失平均有効圧<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{IMEP} = \\frac{W_{i,\\text{net}}}{V_d}\">\\text{IMEP} = \\frac{W_{i,\\text{net}}}{V_d}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{PMEP} = \\frac{W_{i,\\text{net}} - W_{i,\\text{gross}}}{V_d}\">\\text{PMEP} = \\frac{W_{i,\\text{net}} - W_{i,\\text{gross}}}{V_d}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>摩擦・補機の平均有効圧<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{FMEP} = \\frac{\\Delta W_f}{V_d}\">\\text{FMEP} = \\frac{\\Delta W_f}{V_d}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{AMEP} = \\frac{\\Delta W_a}{V_d}\">\\text{AMEP} = \\frac{\\Delta W_a}{V_d}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>正味平均有効圧，軸トルク，軸出力<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{BMEP} = \\text{IMEP} - \\text{FMEP} - \\text{AMEP}\">\\text{BMEP} = \\text{IMEP} - \\text{FMEP} - \\text{AMEP}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_b = \\frac{\\text{BMEP}\\cdot V_d}{4\\pi}\">T_b = \\frac{\\text{BMEP}\\cdot V_d}{4\\pi}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"P_b = \\frac{\\text{BMEP}\\cdot V_d}{t_c}\">P_b = \\frac{\\text{BMEP}\\cdot V_d}{t_c}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>図示出力，機械効率<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"P_i = \\frac{W_{i,\\text{net}}}{t_c}\">P_i = \\frac{W_{i,\\text{net}}}{t_c}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_m = \\frac{\\text{BMEP}}{\\text{IMEP}}\">\\eta_m = \\frac{\\text{BMEP}}{\\text{IMEP}}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>動力計の平均トルク<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\overline{T_{\\text{dyno}}} = \\frac{\\Delta W_d}{4\\pi}\">\\overline{T_{\\text{dyno}}} = \\frac{\\Delta W_d}{4\\pi}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>空気量，燃料量<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{\\text{air}} = \\frac{m_{u,\\text{trapped}}}{1 + \\phi/\\text{AF}_{st}}\">m_{\\text{air}} = \\frac{m_{u,\\text{trapped}}}{1 + \\phi/\\text{AF}_{st}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_f = \\frac{\\phi\\,m_{\\text{air}}}{\\text{AF}_{st}}\">m_f = \\frac{\\phi\\,m_{\\text{air}}}{\\text{AF}_{st}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_f = \\frac{m_f}{t_c}\">\\dot m_f = \\frac{m_f}{t_c}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>体積効率<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_v = \\frac{m_{\\text{air}}}{\\rho_{\\text{atm}}V_d}\">\\eta_v = \\frac{m_{\\text{air}}}{\\rho_{\\text{atm}}V_d}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\rho_{\\text{atm}} = \\frac{p_{\\text{atm}}}{RT_{\\text{amb}}}\">\\rho_{\\text{atm}} = \\frac{p_{\\text{atm}}}{RT_{\\text{amb}}}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>図示熱効率，正味熱効率，正味燃料消費率<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_i = \\frac{W_{i,\\text{net}}}{m_f H_u}\">\\eta_i = \\frac{W_{i,\\text{net}}}{m_f H_u}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_b = \\frac{P_b}{\\dot m_f H_u}\">\\eta_b = \\frac{P_b}{\\dot m_f H_u}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{bsfc} = \\frac{\\dot m_f}{P_b}\">\\text{bsfc} = \\frac{\\dot m_f}{P_b}<\/span><\/span> [g/kWh]<\/td>\n<\/tr>\n<tr>\n<td>残留ガス率<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r = 1 - Y_u\">x_r = 1 - Y_u<\/span><\/span>（IVC の時点）<\/td>\n<\/tr>\n<tr>\n<td>最高圧，最高温度<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\max}\">p_{\\max}<\/span><\/span>（SPEC-13 の補間），<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\max}\">T_{\\max}<\/span><\/span>（ステップ点の最大）<\/td>\n<\/tr>\n<tr>\n<td>各断面の平均流量<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{\\Delta M_k}{t_c}\">\\frac{\\Delta M_k}{t_c}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"k\">k<\/span><\/span>：th，r，in，ex，e，t）<\/td>\n<\/tr>\n<tr>\n<td>排気背圧，排気ポート圧の脈動幅<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta\\bar p_{\\text{ex}} = \\frac{\\Delta P_m}{t_c} - p_{\\text{atm}}\">\\Delta\\bar p_{\\text{ex}} = \\frac{\\Delta P_m}{t_c} - p_{\\text{atm}}<\/span><\/span>，1 サイクルの排気弁の下流圧の最大と最小の差<\/td>\n<\/tr>\n<tr>\n<td>吸気管の既燃率<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar Y_{b,\\text{in}} = \\frac{\\Delta\\Upsilon}{t_c}\">\\bar Y_{b,\\text{in}} = \\frac{\\Delta\\Upsilon}{t_c}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>CA50，点火時期<\/td>\n<td>SPEC-12<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><p>発熱の分母は供給した燃料の発熱量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_f H_u\">m_f H_u<\/span><\/span> とする（燃え残りと燃焼効率の損失が効率に現れる）．<\/p><\/li>\n<li><p>ポンプ損失は IMEP に含まれ，FMEP には含めない．<\/p><\/li>\n<li><p><strong>表示の規則<\/strong>：指標は，完爆後に完了したサイクルの値だけを表示する．始動中・停止中・最初のサイクルの完了前と，定義の分母が <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> 以下のときは「–」を表示する．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_v\">\\eta_v<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_i\">\\eta_i<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_m\">\\eta_m<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_b\">\\eta_b<\/span><\/span> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"[0, 1.5]\">[0, 1.5]<\/span><\/span> の外の値を表示しない．<span class=\"im\"><span class=\"tx raw\" data-tex=\"P_b \\le 0\">P_b \\le 0<\/span><\/span> では bsfc と <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_b\">\\eta_b<\/span><\/span> を「–」とする．<\/p><\/li>\n<li><p><strong>10 サイクル平均<\/strong>：サイクルごとの指標は，完爆後の直近 10 サイクル（満たないときは完爆後の全サイクル）の算術平均を表示する．瞬時値である <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N\">\\bar N<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_w\">T_w<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha\">\\alpha<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{in}}\">p_{\\text{in}}<\/span><\/span>，瞬時の <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{dyno}}\">T_{\\text{dyno}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{eff}}\">f_{\\text{eff}}<\/span><\/span>，点火時期は現在の値を表示する．コールドリセット，停止，エンストで平均をやり直す．<\/p><\/li>\n<li><p><strong>表示する項目と名称<\/strong>（運転タブ．配置は SPEC-15）：<\/p>\n<ul>\n<li>1 ページ目：平均回転数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N\">\\bar N<\/span><\/span>，図示平均有効圧 IMEP，ポンプ損失平均有効圧 PMEP，図示熱効率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_i\">\\eta_i<\/span><\/span>，図示出力 <span class=\"im\"><span class=\"tx raw\" data-tex=\"P_i\">P_i<\/span><\/span>，体積効率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_v\">\\eta_v<\/span><\/span>，残留ガス率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r\">x_r<\/span><\/span>，最高筒内圧 <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\max}\">p_{\\max}<\/span><\/span>，最高ガス温度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\max}\">T_{\\max}<\/span><\/span>，壁温 <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_w\">T_w<\/span><\/span>，スロットル開度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha\">\\alpha<\/span><\/span>，吸気管圧 <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{in}}\">p_{\\text{in}}<\/span><\/span><\/li>\n<li>2 ページ目：燃料流量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_f\">\\dot m_f<\/span><\/span>，軸トルク <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_b\">T_b<\/span><\/span>，軸出力 <span class=\"im\"><span class=\"tx raw\" data-tex=\"P_b\">P_b<\/span><\/span>，正味平均有効圧 BMEP，摩擦平均有効圧 FMEP，機械効率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_m\">\\eta_m<\/span><\/span>，正味燃料消費率 bsfc，正味熱効率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_b\">\\eta_b<\/span><\/span>，動力計トルク <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{dyno}}\">T_{\\text{dyno}}<\/span><\/span>，実効充水率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{eff}}\">f_{\\text{eff}}<\/span><\/span>，吸気管既燃率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_{b,\\text{in}}\">Y_{b,\\text{in}}<\/span><\/span>，点火時期（°BTDC）<\/li>\n<li>各項目は既定で記号を示し，その項目をタップすると日本語名に切り替わり，もう一度タップすると記号に戻る（項目ごと．何度でも）．値は描画フレームごとに更新するが，項目の要素は作り直さず文字だけを書き換える（押している間に要素が DOM から外れるとタップが届かないため）．<\/li>\n<\/ul><\/li>\n<li><p><strong>出典<\/strong>：Heywood (1988) Ch. 2．<\/p><\/li>\n<\/ul>\n<hr />\n","<h2 id=\"spech63\">5. 画面<\/h2>\n","<h3 id=\"spech64\">SPEC-15：画面の構成と操作（REQ-15）<\/h3>\n<h4 id=\"spech65\">A. 対象環境<\/h4>\n<ol type=\"1\">\n<li>主対象：Samsung Galaxy S26+，Android 版 Google Chrome．<\/li>\n<li>代表のビューポート（CSS px）：スマートフォン縦 <span class=\"im\"><span class=\"tx raw\" data-tex=\"360 \\times 640\">360 \\times 640<\/span><\/span>（最小），<span class=\"im\"><span class=\"tx raw\" data-tex=\"384 \\times 780\">384 \\times 780<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"412 \\times 915\">412 \\times 915<\/span><\/span>．タブレット縦 <span class=\"im\"><span class=\"tx raw\" data-tex=\"820 \\times 1180\">820 \\times 1180<\/span><\/span>，タブレット横 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1180 \\times 820\">1180 \\times 820<\/span><\/span>，PC <span class=\"im\"><span class=\"tx raw\" data-tex=\"1440 \\times 900\">1440 \\times 900<\/span><\/span>（マウス）．<\/li>\n<\/ol>\n<h4 id=\"spech66\">B. 画面の原則<\/h4>\n<ol type=\"1\">\n<li><strong>上部のタブ<\/strong>：高さ <span class=\"im\"><span class=\"tx raw\" data-tex=\"48\\ \\text{px}\">48\\ \\text{px}<\/span><\/span> のタブバーを最上部に固定し，「運転」「線図」「性能曲線」「設定」「検証」「解説」を等幅で常に表示する．切り替えはタップだけ．切り替えてもシミュレーションは止めず，各タブのサブページの選択と，解説の縦スクロール位置を保つ．タブの文字は <span class=\"im\"><span class=\"tx raw\" data-tex=\"13\\ \\text{px}\">13\\ \\text{px}<\/span><\/span>，左右の余白は <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>．<\/li>\n<li><strong>1 画面に固定<\/strong>：「解説」以外のタブとサブページは，ページ全体も内部の容器も縦横にスクロールしない．収まらない項目はサブページかページ送りに分ける．高さは <code>100dvh<\/code> を基準とし，<code>overscroll-behavior: none<\/code> を指定する．<\/li>\n<li><code>&lt;meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"&gt;<\/code>，<code>color-scheme: light dark<\/code>，<code>text-size-adjust: 100%<\/code> を指定する．<\/li>\n<\/ol>\n<h4 id=\"spech67\">C. 各タブの内容<\/h4>\n<ol type=\"1\">\n<li><strong>運転<\/strong>（上から）：機関断面図（SPEC-19．高さは残りの領域に従い，最小 <span class=\"im\"><span class=\"tx raw\" data-tex=\"140\\ \\text{px}\">140\\ \\text{px}<\/span><\/span>）とその下端に重ねた目標回転数スライダ（SPEC-23），回転数の制御方式と <code>OVERLOAD<\/code>／<code>UNDERPOWER<\/code>／<code>VALVE HIT<\/code> の表示，制御状態カード（SPEC-22，4 行），操作ボタン <code>[START]<\/code> <code>[FUEL CUT]<\/code> <code>[RESET 長押し]<\/code>（コールドリセット），再生速度のボタン（<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.02\\times\">0.02\\times<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.1\\times\">0.1\\times<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5\\times\">0.5\\times<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\times\">1\\times<\/span><\/span>）と指標のページ切替 <code>[指標1/2]<\/code> と <code>[音ON/音OFF]<\/code>，指標（2 列 × 6 行，2 ページ．項目は SPEC-14）．<\/li>\n<li><strong>線図<\/strong>：上部のボタン（1 行）で 7 画面を切り替える．① <span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>-<span class=\"im\"><span class=\"tx raw\" data-tex=\"V\">V<\/span><\/span> 線図（線形／両対数の切替，基準サイクルの重ね描き），② <span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>-<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta\">\\theta<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T\">T<\/span><\/span>，熱発生率），③ 弁リフトと弁の質量流量，④ 筒内質量の内訳，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{in}}\">p_{\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{th}}\">\\dot m_{\\text{th}}<\/span><\/span>，⑤ トルクの内訳，<span class=\"im\"><span class=\"tx raw\" data-tex=\"N\">N<\/span><\/span>，ピストン速度，⑥ ECU のトレンド（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N\">\\bar N<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"N_{\\text{target}}\">N_{\\text{target}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha\">\\alpha<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{in}}\">p_{\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_w\">T_w<\/span><\/span>），⑦ 動力計のトレンド（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N\">\\bar N<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"N_{\\text{target}}\">N_{\\text{target}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_b\">T_b<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{dyno}}\">T_{\\text{dyno}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{cmd}}\">f_{\\text{cmd}}<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{eff}}\">f_{\\text{eff}}<\/span><\/span>）．軸と目盛は SPEC-17．<\/li>\n<li><strong>性能曲線<\/strong>：SPEC-26．<\/li>\n<li><strong>設定<\/strong>：SPEC-18．<\/li>\n<li><strong>検証<\/strong>：<code>[全テスト実行]<\/code>，進捗，総合結果（PASS <span class=\"im\"><span class=\"tx raw\" data-tex=\"n\">n<\/span><\/span>/28），28 個の結果チップ（7 列），選んだテストの詳細カード（項目，基準，実測，誤差，PASS/FAIL），項目送り ◀ ▶．選んだチップは枠で示す（SPEC-20）．<\/li>\n<li><strong>解説<\/strong>：SPEC-16（唯一，縦スクロールできるタブ）．<\/li>\n<\/ol>\n<h4 id=\"spech68\">D. 誤操作の防止<\/h4>\n<ol type=\"1\">\n<li><code>&lt;input type=\"range\"&gt;<\/code> は使わない．値の変更はボタンで行う．例外は，独自実装の目標回転数スライダ（SPEC-23）だけ．<\/li>\n<li>編集のロックは設けない．設定の「元に戻す」と変更の通知（SPEC-18）で保護する．<\/li>\n<li><strong>タップの判定<\/strong>：押してから離すまでの移動が <span class=\"im\"><span class=\"tx raw\" data-tex=\"8\\ \\text{px}\">8\\ \\text{px}<\/span><\/span> 未満，かつ接触が <span class=\"im\"><span class=\"tx raw\" data-tex=\"500\\ \\text{ms}\">500\\ \\text{ms}<\/span><\/span> 未満の <code>pointerup<\/code> だけをタップとする．接触の幅（<code>PointerEvent.width<\/code>）では棄却しない．<\/li>\n<li><code>[RESET]<\/code> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.6\\ \\text{s}\">0.6\\ \\text{s}<\/span><\/span> の長押しでだけ実行する．コールドリセットを伴う設定は「適用」で確定する（SPEC-18）．<\/li>\n<li>操作要素は <span class=\"im\"><span class=\"tx raw\" data-tex=\"44 \\times 44\\ \\text{px}\">44 \\times 44\\ \\text{px}<\/span><\/span> 以上，隣との間隔は <span class=\"im\"><span class=\"tx raw\" data-tex=\"4\\ \\text{px}\">4\\ \\text{px}<\/span><\/span> 以上，<code>touch-action: manipulation<\/code> を指定する．<\/li>\n<\/ol>\n<h4 id=\"spech69\">E. グラフのタップ<\/h4>\n<p>グラフをタップすると，その横位置の値を読む十字線と数値を表示する（もう一度タップで消す）．1 画面に複数のグラフが横に並ぶときは，タップした位置を含むグラフの横軸で読む．<\/p>\n<h4 id=\"spech70\">F. 描画と時間の進め方<\/h4>\n<ol type=\"1\">\n<li>Canvas の内部解像度は常に CSS の寸法 × <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\min(\\text{devicePixelRatio}, 2.5)\">\\min(\\text{devicePixelRatio}, 2.5)<\/span><\/span> と一致させる．描画のたびに一致を確かめ，違えば設定し直す．毎フレーム全面を消してから描く．<\/li>\n<li>描画は <span class=\"im\"><span class=\"tx raw\" data-tex=\"60\\ \\text{fps}\">60\\ \\text{fps}<\/span><\/span> に間引く．シミュレーションの時間は <code>performance.now()<\/code> の実経過時間から進め，リフレッシュレートによらない．1 フレームの積分に使う時間は <span class=\"im\"><span class=\"tx raw\" data-tex=\"9\\ \\text{ms}\">9\\ \\text{ms}<\/span><\/span> を上限とする．<\/li>\n<li>ページが非表示になったら積分と描画を止め，戻ったときに大きな時間の飛びを作らない（戻った直後の 1 フレームで進む時間は <span class=\"im\"><span class=\"tx raw\" data-tex=\"50\\ \\text{ms}\">50\\ \\text{ms}<\/span><\/span> × 再生速度 以下）．<\/li>\n<\/ol>\n<h4 id=\"spech71\">G. 読みやすさ<\/h4>\n<ol type=\"1\">\n<li>圧力は Pa 系（既定 kPa）で表示し，<code>bar<\/code> は表示しない．本文の最小の文字は <span class=\"im\"><span class=\"tx raw\" data-tex=\"12\\ \\text{px}\">12\\ \\text{px}<\/span><\/span>（指標の日本語名は <span class=\"im\"><span class=\"tx raw\" data-tex=\"11\\ \\text{px}\">11\\ \\text{px}<\/span><\/span>），数値は等幅数字，配色は <code>prefers-color-scheme<\/code> に従う．<\/li>\n<li>ボタンの文字は折り返さない．端末のフォントの差を見込み，ボタンの文字幅は，ボタンの利用可能幅（内寸から左右の余白を除いた幅）の <span class=\"im\"><span class=\"tx raw\" data-tex=\"95\\%\">95\\%<\/span><\/span> 以下とする．<\/li>\n<\/ol>\n<h4 id=\"spech72\">H. 画面の大きさに応じた表示<\/h4>\n<p>スマートフォンの表示を基本とし，ビューポートの幅 <span class=\"im\"><span class=\"tx raw\" data-tex=\"w\">w<\/span><\/span> が大きいほど同時に表示する情報を増やす．タブの構成と操作は変えない．<\/p>\n<ol type=\"1\">\n<li><strong>小<\/strong>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"w &lt; 700\">w &lt; 700<\/span><\/span>）：C のとおり．<\/li>\n<li><strong>中<\/strong>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"700 \\le w &lt; 900\">700 \\le w &lt; 900<\/span><\/span>）：運転タブの指標を 2 ページ分（24 項目）同時に 4 列で表示し，<code>[指標1/2]<\/code> を隠す．本文の領域は最大幅 <span class=\"im\"><span class=\"tx raw\" data-tex=\"900\\ \\text{px}\">900\\ \\text{px}<\/span><\/span> で中央に置く．<\/li>\n<li><strong>大<\/strong>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"w \\ge 900\">w \\ge 900<\/span><\/span>）：2 列にする．運転タブは，左に機関断面図（スライダを含む），右に制御状態カード・操作ボタン・再生速度・指標 24 項目（2 列）．高さが <span class=\"im\"><span class=\"tx raw\" data-tex=\"800\\ \\text{px}\">800\\ \\text{px}<\/span><\/span> 以上なら，右の列の残りに運転中の <span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>-<span class=\"im\"><span class=\"tx raw\" data-tex=\"V\">V<\/span><\/span> 線図（基準サイクルの重ね描きつき）を表示する．設定タブは，左に項目の一覧と操作ボタン，右に <span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>-<span class=\"im\"><span class=\"tx raw\" data-tex=\"V\">V<\/span><\/span> 図（またはカム線図・機関の説明）を列の高さいっぱいに表示する．本文の領域は最大 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1400\\ \\text{px}\">1400\\ \\text{px}<\/span><\/span>（検証と解説は <span class=\"im\"><span class=\"tx raw\" data-tex=\"900\\ \\text{px}\">900\\ \\text{px}<\/span><\/span>）で中央に置く．<\/li>\n<li><strong>グラフの横並び<\/strong>（全段階）：1 画面に <span class=\"im\"><span class=\"tx raw\" data-tex=\"n\">n<\/span><\/span> 個のグラフがあり，Canvas（CSS 寸法 <span class=\"im\"><span class=\"tx raw\" data-tex=\"W \\times H\">W \\times H<\/span><\/span>）が <span class=\"im\"><span class=\"tx raw\" data-tex=\"W &gt; 1.25H\">W &gt; 1.25H<\/span><\/span> なら，列数を <span class=\"im\"><span class=\"tx raw\" data-tex=\"n_c = \\max\\left(1, \\min\\left(n, \\lfloor W/320\\rfloor\\right)\\right)\">n_c = \\max\\left(1, \\min\\left(n, \\lfloor W/320\\rfloor\\right)\\right)<\/span><\/span>，行数を <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lceil n/n_c\\rceil\">\\lceil n/n_c\\rceil<\/span><\/span> とする．そうでなければ 1 列．<\/li>\n<li><strong>マウス<\/strong>：Pointer Events により，マウスでも同じ操作ができる（クリック，長押し，スライダのドラッグ）．ホバーできる環境ではボタンにカーソルとホバー表示を出す．<\/li>\n<li>B〜G の規則は，どの段階でも満たす．<\/li>\n<\/ol>\n<hr />\n","<h3 id=\"spech73\">SPEC-16：解説タブ（REQ-16）<\/h3>\n<ol type=\"1\">\n<li><strong>章立て<\/strong>：§0 記号表と設定項目／§1 状態方程式系（16 個の状態の時間微分の式を，詳細を述べる章の番号とともに並べる）／§2 クランク運動学（SPEC-01）／§3 熱物性（SPEC-02）／§4 弁の有効開口面積（SPEC-03）／§5 オリフィス流量（SPEC-04）／§6 スロットルと吸気マニホールド（SPEC-05）／§7 筒内の組成（SPEC-06）／§8 燃焼（SPEC-07）／§9 壁面熱伝達と壁温（SPEC-08）／§10 筒内圧の式の導出（SPEC-09）／§11 回転運動とスターター（SPEC-10）／§12 動力計と運転モード（SPEC-11）／§13 ECU（SPEC-12）／§14 数値積分（SPEC-13）／§15 性能の指標（SPEC-14）／§16 エンジン音（SPEC-21）／§17 排気系（SPEC-27）．吸気ランナ（SPEC-25）は §6 に含める．<\/li>\n<li><strong>各章<\/strong>：目的の一文，支配式（途中の式変形を含む），仮定と適用範囲，出典へのリンク．式に現れる記号はすべて §0 の記号表で定義する．<\/li>\n<li><strong>数式<\/strong>：数式は TeX（LaTeX の数式記法）で持つ．解説（§0〜§17）の式は生成器 <code>mp<\/code> が独自の簡略記法から TeX を作り，3 文書の式は Markdown に書いた TeX をそのまま使う．数式 1 つを要素 1 つ（<code>.tx<\/code>．別行立ては <code>data-d=\"1\"<\/code>）に入れ，要素の <code>data-tex<\/code> に TeX のソースを保持する．\n<ul>\n<li><strong>組版（MathJax）<\/strong>：解説タブを初めて開いたときに，MathJax 3.2.2 の <code>tex-svg<\/code> を <code>https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js<\/code> から読み込む（<code>&lt;script&gt;<\/code> を 1 つ加える）．SVG 出力を使う：字形の形は MathJax のスクリプトに含まれ，フォントのファイルを別に読まない（アーティファクトの CSP は cdnjs のスクリプトを許すが，そこからのフォントのファイルは許さないため）．準備が整ったら，数式を <code>MathJax.tex2svg(TeX, {display})<\/code> で SVG に組み，要素の中身を置き換える．組むのは画面に入る数式だけ（解説タブの表示範囲と，その上下 1 画面分．<code>IntersectionObserver<\/code>）で，スクロールして入ってきた式を順に組む．組んだ式は戻さない．組版は 1 フレームあたり <span class=\"im\"><span class=\"tx raw\" data-tex=\"8\\ \\text{ms}\">8\\ \\text{ms}<\/span><\/span> を目安に区切る．字形の定義は 1 か所（MathJax の global font cache）に置き，各式は参照だけを持つ．全数式を一度に組むと，3 文書の約 <span class=\"im\"><span class=\"tx raw\" data-tex=\"4100\">4100<\/span><\/span> 式で解説タブの要素が約 <span class=\"im\"><span class=\"tx raw\" data-tex=\"13.5\">13.5<\/span><\/span> 万個になり，タブの切り替えに <span class=\"im\"><span class=\"tx raw\" data-tex=\"158\\ \\text{ms}\">158\\ \\text{ms}<\/span><\/span> かかった（実測）ため，この方式にした．<\/li>\n<li><strong>TeX の表示<\/strong>：MathJax の読み込みが失敗したとき（<code>error<\/code>），または読み込みを始めて <span class=\"im\"><span class=\"tx raw\" data-tex=\"15\\ \\text{s}\">15\\ \\text{s}<\/span><\/span> 以内に準備が整わないときは，以後 MathJax を使わず，各数式の TeX のソースを等幅の字で表示する（本文中の式は行内に，別行立ての式は独立の行にして横スクロールできるようにする）．読み込み中も TeX のソースを表示しておき，準備が整ったら置き換える．<\/li>\n<li><strong>状態の表示<\/strong>：解説タブの切替のボタンの下に 1 行で，「数式：MathJax 3.2.2 で表示」「数式：MathJax を読み込み中（TeX のソースを表示）」「数式：MathJax を読み込めないため TeX のソースを表示」のいずれかを示す．<\/li>\n<li><strong>生成器の規則<\/strong>：ギリシャ文字は TeX の命令（<code>\\theta<\/code> など）にする．2 文字以上の添字は立体（<code>\\mathrm{in}<\/code>）．<code>sin<\/code>，<code>cos<\/code>，<code>exp<\/code>，<code>tanh<\/code>，<code>ln<\/code>，<code>max<\/code>，<code>min<\/code> は <code>\\sin<\/code> などの命令，<code>clamp<\/code>，<code>sgn<\/code> は <code>\\operatorname{}<\/code>．微分の d は <code>\\mathrm{d}<\/code>．上線と上点は <code>\\bar{}<\/code>，<code>\\dot{}<\/code>．括弧の組は，中身に分数・根号・上線・上点があるときだけ <code>\\left(<\/code> <code>\\right)<\/code> で伸ばす．<code>{a|b}<\/code> は <code>\\frac{a}{b}<\/code>，<code>[x]<\/code> は <code>\\sqrt{x}<\/code>．べきの底が括弧の組のときは組全体に掛ける．生成した式に現れる記号（記号表のキー）を要素の <code>data-ids<\/code> に空白区切りで記録する．<\/li>\n<li><strong>フォントを埋め込まない<\/strong>（C-8）：成果物に <code>@font-face<\/code> も base64 のデータも置かない．式の解説の末尾に「数式の組版：MathJax 3.2.2（Apache License 2.0，<a target=\"_blank\" rel=\"noopener\" href=\"https://www.mathjax.org/）を実行時に\">https://www.mathjax.org/）を実行時に<\/a> cdnjs から読み込む．読み込めないときは TeX のソースを表示する．」の旨を書く．<\/li>\n<\/ul><\/li>\n<li><strong>幅<\/strong>：数式は縮小しない．画面の幅を超える数式は式ごとに，記号表と設定項目の表は表ごとに，横スクロールできる（<code>overflow-x: auto<\/code>）．解説タブ全体は横にスクロールしない．<\/li>\n<li><strong>ナビゲーション<\/strong>：冒頭に目次（全章）を置き，タップでその章の見出しが上端に来る．「先頭へ戻る」ボタンを右下に常に表示する．ほかのタブへ移って戻っても縦スクロール位置を保つ．<\/li>\n<li><strong>単一の情報源<\/strong>：本文中の定数と現在の設定値は，ソルバの定数・項目定義表・合成器の定数から生成する．記号表は 1 つの記号を 1 回だけ定義する（ビルド時に重複を検査する）．選択中の比熱モデルとカムプロファイルに対応する式は強調し（左の線をアクセント色），選択していない方は薄く表示する．<\/li>\n<li><strong>エンジン音<\/strong>：§16 に，計算の音の式と，演出音の処理（式，10 段の表，定数の表）を書く（SPEC-21）．<\/li>\n<li><strong>読みやすさ<\/strong>：本文 <span class=\"im\"><span class=\"tx raw\" data-tex=\"14\\ \\text{px}\">14\\ \\text{px}<\/span><\/span> 以上，行間 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1.6\">1.6<\/span><\/span> 以上，配色に追従．ネットワークなしで読める（数式は TeX のソース）．<\/li>\n<li><strong>文書の閲覧<\/strong>：解説タブの先頭に切替のボタン <code>[式の解説]<\/code> <code>[要件定義書]<\/code> <code>[仕様書]<\/code> <code>[用語集]<\/code>（1 行，<span class=\"im\"><span class=\"tx raw\" data-tex=\"44\\ \\text{px}\">44\\ \\text{px}<\/span><\/span> 以上）を置き，要件定義書・仕様書・用語の定義集の全文を，このタブの中で読めるようにする．\n<ul>\n<li><strong>変換<\/strong>：3 文書は，ビルド時に <code>docs/<\/code> の Markdown を pandoc で HTML に変換して成果物に埋め込む（ビルド時だけ）．数式は TeX のまま残し（pandoc の <code>--mathjax<\/code> の出力から区切り <code>\\(<\/code> <code>\\)<\/code> <code>\\[<\/code> <code>\\]<\/code> を外し，3 の <code>.tx<\/code> 要素にする），3 の規則で組む．TeX の誤りを見つけるため，ビルド時に pandoc で全数式を MathML にも変換してみて，変換できない式があればビルドを止める（この MathML は埋め込まない）．<\/li>\n<li><strong>ページ<\/strong>：3 文書は，見出し（<code>##<\/code> と <code>###<\/code>）ごとの断片を 1 ページとして，1 ページずつ表示する（要件定義書なら REQ ごと，仕様書なら SPEC・TEST ごと）．画面（DOM）に置くのは表示中のページだけで，ページを替えるときに前のページを取り除く．目次の下と，ページの末尾に，<code>[◀ 前]<\/code>，位置（<code>12 / 74<\/code> の形），<code>[次 ▶]<\/code> を置く（ボタンは <span class=\"im\"><span class=\"tx raw\" data-tex=\"44\\ \\text{px}\">44\\ \\text{px}<\/span><\/span> 以上．端のページでは対応するボタンを無効にする）．ページを替えたら縦スクロール位置を先頭に戻す．式の解説（§0〜§17）は分けない．<\/li>\n<li><strong>目次<\/strong>：各文書の先頭に <code>[目次（n 項目）を開く]<\/code> を置き，押すとその文書の見出し（2 階層）の目次が開く（もう一度押すと閉じる）．目次の項目のタップで，その見出しのページに替わり，見出しが上端に来る．<\/li>\n<li><strong>幅<\/strong>：別行立ての数式と表は，幅を超えたら式・表ごとに横スクロールする．本文中の数式が行に収まらないときは，その式を独立の行にして横スクロールできるようにする（画面の幅が変わったら判定し直す）．解説タブ全体は横にスクロールしない．<\/li>\n<li><strong>組み立て<\/strong>：ページは，表示するときにその断片だけを組み立てる（全文をまとめて組み立てない．第25版では全文を数フレームに分けて組み立てていたが，文書が大きくなるとフレームの間隔と要素の数が増えるため改めた）．式の解説は，初めて開いたときに章を数フレームに分けて表示する．表示していない文書は，表示中のページを保ったまま隠す．文書ごとに，表示中のページと縦スクロール位置を保つ．<\/li>\n<li>「先頭へ戻る」と縦スクロール位置の保持（5）は，どの文書の表示中にも働く．<\/li>\n<\/ul><\/li>\n<\/ol>\n<hr />\n","<h3 id=\"spech74\">SPEC-17：グラフの軸・目盛・自動レンジ（REQ-17）<\/h3>\n<h4 id=\"spech75\">A. 軸の表示<\/h4>\n<ol type=\"1\">\n<li><p>各グラフは，プロット領域の左に縦軸，下に横軸を持ち，目盛線，目盛の数値，軸名を表示する．軸名は「量 [単位]」の形（例：<code>p [kPa]<\/code>，<code>V [cm³]<\/code>，<code>θ [°CA]<\/code>，<code>t [s]<\/code>）．縦軸の名前はプロット領域の左上に横書きで，横軸の名前は目盛の数値の下に置く．<\/p><\/li>\n<li><p>目盛の間隔は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Lambda = \\{1, 2, 5\\} \\times 10^k\">\\Lambda = \\{1, 2, 5\\} \\times 10^k<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"k\">k<\/span><\/span> は整数）から選び，区間の数が 4〜8 になるようにする．目盛の数値は互いに重ならず，Canvas の外へ出ない．重なるときは数値を間引く（目盛線は残す）．<\/p><\/li>\n<li><p>複数の系列を描くグラフには凡例（系列名と色）をプロット領域の中に置く．凡例が 1 行に収まらないときは折り返す．<\/p><\/li>\n<li><p>体積は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{cm}^3\">\\text{cm}^3<\/span><\/span>，クランク角は <span class=\"im\"><span class=\"tx raw\" data-tex=\"^\\circ\\text{CA}\">^\\circ\\text{CA}<\/span><\/span> で表示する．クランク角の横軸は次のとおり．<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>グラフ<\/th>\n<th>範囲<\/th>\n<th>目盛<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>線図④⑤（基本）<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"720^\\circ\">720^\\circ<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>：吸気上死点，<span class=\"im\"><span class=\"tx raw\" data-tex=\"360\">360<\/span><\/span>：圧縮上死点）<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"180^\\circ\">180^\\circ<\/span><\/span> ごと<\/td>\n<\/tr>\n<tr>\n<td>線図③「弁」とカム線図（オーバーラップを中央に見る）<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"360\">360<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"1080^\\circ\">1080^\\circ<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"720\">720<\/span><\/span>：吸気上死点）<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"180^\\circ\">180^\\circ<\/span><\/span> ごと<\/td>\n<\/tr>\n<tr>\n<td>線図②「<span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>-<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta\">\\theta<\/span><\/span>」の 3 グラフ（圧縮・膨張を拡大）<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"180\">180<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"540^\\circ\">540^\\circ<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"90^\\circ\">90^\\circ<\/span><\/span> ごと<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><span class=\"im\"><span class=\"tx raw\" data-tex=\"360\">360<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"1080^\\circ\">1080^\\circ<\/span><\/span> の表示では，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta &lt; 360^\\circ\">\\theta &lt; 360^\\circ<\/span><\/span> のデータを <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta + 720^\\circ\">\\theta + 720^\\circ<\/span><\/span> として並べ替え，折り返しで線をつながない．範囲外の点は描画領域で切り取る．<\/p><\/li>\n<\/ol>\n<h4 id=\"spech76\">B. レンジの方式<\/h4>\n<p>フルスケールを <span class=\"im\"><span class=\"tx raw\" data-tex=\"F\">F<\/span><\/span>，評価の窓（クランク角のグラフは直近に完了した 1 サイクル，トレンドは表示中の時間窓）でのデータの最大を <span class=\"im\"><span class=\"tx raw\" data-tex=\"M\">M<\/span><
