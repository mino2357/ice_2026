 未満．<\/li>\n<li>[A] 設定範囲の端点の組合せ（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lambda \\le 0.5\">\\lambda \\le 0.5<\/span><\/span>）すべてで，項目 1 が成り立ち，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{dV}{d\\theta}\">\\frac{dV}{d\\theta}<\/span><\/span> と中心差分の相対誤差が <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-7}\">10^{-7}<\/span><\/span> 未満（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon\">\\varepsilon<\/span><\/span> が小さいと <span class=\"im\"><span class=\"tx raw\" data-tex=\"V_c\">V_c<\/span><\/span> が大きく，差分の丸め誤差が増えるので，項目 2 より緩い．実測 <span class=\"im\"><span class=\"tx raw\" data-tex=\"3 \\times 10^{-10}\">3 \\times 10^{-10}<\/span><\/span>），<span class=\"im\"><span class=\"tx raw\" data-tex=\"V(\\theta) &gt; 0\">V(\\theta) &gt; 0<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"x(\\theta) \\in [0, S]\">x(\\theta) \\in [0, S]<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lambda &gt; 0.5\">\\lambda &gt; 0.5<\/span><\/span> の組合せが適用できないことは TEST-18 項目 4 で確かめる．<\/li>\n<\/ol>\n","<h3 id=\"spech105\">TEST-02：作動流体の熱物性（未燃・既燃の比熱）（REQ-02，SPEC-02）<\/h3>\n<ol type=\"1\">\n<li>[A]（当てはめの値）<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_u(300) = 1.3488\">\\gamma_u(300) = 1.3488<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_u(700) = 1.2968\">\\gamma_u(700) = 1.2968<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_u(1000) = \\gamma_u(1500) = 1.2578\">\\gamma_u(1000) = \\gamma_u(1500) = 1.2578<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_b(300) = 1.3678\">\\gamma_b(300) = 1.3678<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_b(2000) = 1.2080\">\\gamma_b(2000) = 1.2080<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_b(2700) = \\gamma_b(3200) = 1.1422\">\\gamma_b(2700) = \\gamma_b(3200) = 1.1422<\/span><\/span>（絶対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>）．<\/li>\n<li>[A] <span class=\"im\"><span class=\"tx raw\" data-tex=\"T \\in [300, 3000]\\ \\text{K}\">T \\in [300, 3000]\\ \\text{K}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"Y \\in \\{0, 0.3, 1\\}\">Y \\in \\{0, 0.3, 1\\}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"c_p - c_v = R\">c_p - c_v = R<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"c_p/c_v = \\gamma(T, Y)\">c_p/c_v = \\gamma(T, Y)<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma(T, Y)\">\\gamma(T, Y)<\/span><\/span> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_u(T)\">\\gamma_u(T)<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_b(T)\">\\gamma_b(T)<\/span><\/span> の間にあり，<span class=\"im\"><span class=\"tx raw\" data-tex=\"c_v\">c_v<\/span><\/span> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"Y\">Y<\/span><\/span> について線形（<span class=\"im\"><span class=\"tx raw\" data-tex=\"Y = 0.3\">Y = 0.3<\/span><\/span> の値が両端の内分に一致）．<\/li>\n<li>[A]（積分の整合）<span class=\"im\"><span class=\"tx raw\" data-tex=\"T \\in \\{350, 900, 1500, 2600, 2900\\}\\ \\text{K}\">T \\in \\{350, 900, 1500, 2600, 2900\\}\\ \\text{K}<\/span><\/span>（頭打ちの上下を含む）で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"e_k\">e_k<\/span><\/span> の中心差分（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 0.01\\ \\text{K}\">\\pm 0.01\\ \\text{K}<\/span><\/span>）が <span class=\"im\"><span class=\"tx raw\" data-tex=\"c_{v,k}(T)\">c_{v,k}(T)<\/span><\/span> と相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-6}\">10^{-6}<\/span><\/span> で一致する．<span class=\"im\"><span class=\"tx raw\" data-tex=\"e_k(T_0) = 0\">e_k(T_0) = 0<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"e_k\">e_k<\/span><\/span> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{c,k}\">T_{c,k}<\/span><\/span> で連続（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 10^{-6}\\ \\text{K}\">\\pm 10^{-6}\\ \\text{K}<\/span><\/span> の差が <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-2}\\ \\text{J/kg}\">10^{-2}\\ \\text{J/kg}<\/span><\/span> 以下）．<\/li>\n<li>[A] <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_u\">\\gamma_u<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_b\">\\gamma_b<\/span><\/span> は頭打ちより下で <span class=\"im\"><span class=\"tx raw\" data-tex=\"T\">T<\/span><\/span> について単調減少，<span class=\"im\"><span class=\"tx raw\" data-tex=\"c_{v,k}\">c_{v,k}<\/span><\/span> は単調増加．<\/li>\n<li>[A]（定比熱比）定比熱比モデルで <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma(T, Y) = 1.35\">\\gamma(T, Y) = 1.35<\/span><\/span>（すべての <span class=\"im\"><span class=\"tx raw\" data-tex=\"T\">T<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"Y\">Y<\/span><\/span>），<span class=\"im\"><span class=\"tx raw\" data-tex=\"e_k(T) = \\frac{R}{0.35}(T - T_0)\">e_k(T) = \\frac{R}{0.35}(T - T_0)<\/span><\/span>．<\/li>\n<\/ol>\n","<h3 id=\"spech106\">TEST-03：カムプロファイルと弁の有効開口面積（REQ-03，SPEC-03）<\/h3>\n<ol type=\"1\">\n<li>[A] 3 種とも <span class=\"im\"><span class=\"tx raw\" data-tex=\"L_v(0) = L_v(1) = 0\">L_v(0) = L_v(1) = 0<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"L_v(0.5) = L_{\\max}\">L_v(0.5) = L_{\\max}<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>），閉弁域で <span class=\"im\"><span class=\"tx raw\" data-tex=\"A_{\\text{eff}} = 0\">A_{\\text{eff}} = 0<\/span><\/span>．<\/li>\n<li>[A] <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\xi = 0.25\">\\xi = 0.25<\/span><\/span> のリフト比が Aggressive <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.8123\">0.8123<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"= \\sin^{0.6}(\\pi/4)\">= \\sin^{0.6}(\\pi/4)<\/span><\/span>），Polynomial <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5625\">0.5625<\/span><\/span>，Standard <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5\">0.5<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-4}\">10^{-4}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>）．<\/li>\n<li>[A]（滑らかさ）Standard と Polynomial は <span class=\"im\"><span class=\"tx raw\" data-tex=\"L_v(10^{-4})/L_{\\max} \\le 10^{-6}\">L_v(10^{-4})/L_{\\max} \\le 10^{-6}<\/span><\/span>（端の傾きが <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>），Aggressive は <span class=\"im\"><span class=\"tx raw\" data-tex=\"L_v(10^{-4})/L_{\\max} \\ge 10^{-3}\">L_v(10^{-4})/L_{\\max} \\ge 10^{-3}<\/span><\/span>．<\/li>\n<li>[A]（弁径）<span class=\"im\"><span class=\"tx raw\" data-tex=\"d_v = 38\\ \\text{mm}\">d_v = 38\\ \\text{mm}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"B = 86\\ \\text{mm}\">B = 86\\ \\text{mm}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"d_{v,\\text{in}} = 38\\ \\text{mm}\">d_{v,\\text{in}} = 38\\ \\text{mm}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"d_{v,\\text{ex}} = 35.625\\ \\text{mm}\">d_{v,\\text{ex}} = 35.625\\ \\text{mm}<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"d_v = 50\\ \\text{mm}\">d_v = 50\\ \\text{mm}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"d_{v,\\text{in}} = 38.7\\ \\text{mm}\">d_{v,\\text{in}} = 38.7\\ \\text{mm}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.45B\">0.45B<\/span><\/span>）．<\/li>\n<li>[A]（VVT）<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varphi \\in \\{-40, -15, 0, 15, 40\\}^\\circ\">\\varphi \\in \\{-40, -15, 0, 15, 40\\}^\\circ<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"L_v(\\theta; \\varphi) = L_v(\\theta - \\varphi; 0)\">L_v(\\theta; \\varphi) = L_v(\\theta - \\varphi; 0)<\/span><\/span> が全周 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1^\\circ\">1^\\circ<\/span><\/span> 刻みで成り立ち（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>），作用角と <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\int L_v\\,d\\theta\">\\int L_v\\,d\\theta<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varphi\">\\varphi<\/span><\/span> によらない．<\/li>\n<li>[A]（干渉）既定設定では <code>VALVE HIT<\/code> が出ない．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon = 40\">\\varepsilon = 40<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"L_{\\max} = 14\\ \\text{mm}\">L_{\\max} = 14\\ \\text{mm}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varphi_{\\text{in}} = -40^\\circ\">\\varphi_{\\text{in}} = -40^\\circ<\/span><\/span> では出る．判定が定義式の直接の評価と一致する．<\/li>\n<li>[S] S8（S4 の定常から <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varphi_{\\text{in}} = 30^\\circ\">\\varphi_{\\text{in}} = 30^\\circ<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"5\\ \\text{s}\">5\\ \\text{s}<\/span><\/span>）：状態量が有限で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_v\">\\eta_v<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\%\">1\\%<\/span><\/span> 以上変わる．<\/li>\n<\/ol>\n","<h3 id=\"spech107\">TEST-04：オリフィスの圧縮性流れ（順流・逆流・チョーク）（REQ-04，SPEC-04）<\/h3>\n<ol type=\"1\">\n<li>[A] <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_1 = p_2\">p_1 = p_2<\/span><\/span> で厳密に <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m = 0\">\\dot m = 0<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"(p_1, p_2)\">(p_1, p_2)<\/span><\/span> を入れ替えると，同じ上流温度・比熱比のもとで絶対値が等しく符号が反転する．<\/li>\n<li>[A] <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_0 = 1.4\">\\gamma_0 = 1.4<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"r_{\\text{crit}} = 0.5282817877\">r_{\\text{crit}} = 0.5282817877<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span>），<span class=\"im\"><span class=\"tx raw\" data-tex=\"r_p = 0.50\">r_p = 0.50<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.25\">0.25<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Psi = 0.68473145\">\\Psi = 0.68473145<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-7}\">10^{-7}<\/span><\/span>，両者は完全に一致）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_0 = 1.3\">\\gamma_0 = 1.3<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"r_{\\text{crit}} = \\left(\\frac{2}{2.3}\\right)^{1.3/0.3}\">r_{\\text{crit}} = \\left(\\frac{2}{2.3}\\right)^{1.3/0.3}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Psi_{\\max} = \\sqrt{1.3\\left(\\frac{2}{2.3}\\right)^{2.3/0.3}}\">\\Psi_{\\max} = \\sqrt{1.3\\left(\\frac{2}{2.3}\\right)^{2.3/0.3}}<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>）．<\/li>\n<li>[A]（正則化）<span class=\"im\"><span class=\"tx raw\" data-tex=\"r_p = 1 - \\delta_r\">r_p = 1 - \\delta_r<\/span><\/span> の両側（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 10^{-12}\">\\pm 10^{-12}<\/span><\/span>）で値が一致（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-7}\">10^{-7}<\/span><\/span>），<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Psi(1) = 0\">\\Psi(1) = 0<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"r_p = 1 - \\delta_r/2\">r_p = 1 - \\delta_r/2<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Psi = \\frac{1}{2}\\Psi_{\\text{sub}}(1 - \\delta_r)\">\\Psi = \\frac{1}{2}\\Psi_{\\text{sub}}(1 - \\delta_r)<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"(r_{\\text{crit}}, 1]\">(r_{\\text{crit}}, 1]<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Psi\">\\Psi<\/span><\/span> が単調減少．<\/li>\n<\/ol>\n","<h3 id=\"spech108\">TEST-05：スロットルと吸気マニホールド（REQ-05，SPEC-05）<\/h3>\n<ol type=\"1\">\n<li>[A] <span class=\"im\"><span class=\"tx raw\" data-tex=\"A_{\\text{th}}(0) = 0\">A_{\\text{th}}(0) = 0<\/span><\/span>（厳密），<span class=\"im\"><span class=\"tx raw\" data-tex=\"A_{\\text{th}}(\\pi/2) = C_{d,\\text{th}}\\frac{\\pi}{4}D_{\\text{th}}^2\">A_{\\text{th}}(\\pi/2) = C_{d,\\text{th}}\\frac{\\pi}{4}D_{\\text{th}}^2<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>），<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha\">\\alpha<\/span><\/span> について単調増加．<\/li>\n<li>[A] 吸気弁を閉じ <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{in}}(0) = 0.3\\,p_{\\text{atm}}\">p_{\\text{in}}(0) = 0.3\\,p_{\\text{atm}}<\/span><\/span> から積分すると，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{in}}\">p_{\\text{in}}<\/span><\/span> が単調に増えて <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{atm}}\">p_{\\text{atm}}<\/span><\/span> に収束し，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\int\\dot m_{\\text{th}}\\,dt = \\frac{V_{\\text{in}}}{RT_{\\text{in}}}\\left(p_{\\text{in}}(t) - p_{\\text{in}}(0)\\right)\">\\int\\dot m_{\\text{th}}\\,dt = \\frac{V_{\\text{in}}}{RT_{\\text{in}}}\\left(p_{\\text{in}}(t) - p_{\\text{in}}(0)\\right)<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-6}\">10^{-6}<\/span><\/span>）．<\/li>\n<li>[A] チョーク域で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{th}}\">\\dot m_{\\text{th}}<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{in}}\">p_{\\text{in}}<\/span><\/span> によらず <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{A_{\\text{th}}p_{\\text{atm}}}{\\sqrt{RT_{\\text{amb}}}}\\Psi_{\\max}\">\\frac{A_{\\text{th}}p_{\\text{atm}}}{\\sqrt{RT_{\\text{amb}}}}\\Psi_{\\max}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_0 = \\gamma_u(T_{\\text{amb}})\">\\gamma_0 = \\gamma_u(T_{\\text{amb}})<\/span><\/span>）に一致し，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{atm}}\">p_{\\text{atm}}<\/span><\/span> を <span class=\"im\"><span class=\"tx raw\" data-tex=\"101.325 \\to 80\\ \\text{kPa}\">101.325 \\to 80\\ \\text{kPa}<\/span><\/span> にすると <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{80000}{101325}\">\\frac{80000}{101325}<\/span><\/span> 倍になる（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>）．<\/li>\n<li>[S]（質量の収支）S4 の定常の直近 5 サイクルで，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M_{\\text{th}}\">M_{\\text{th}}<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"M_{\\text{in}}\">M_{\\text{in}}<\/span><\/span> の増分が相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.2\\%\">0.2\\%<\/span><\/span> 以内．<\/li>\n<li>[A] <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{atm}}\">p_{\\text{atm}}<\/span><\/span> を変えてコールドリセットすると <span class=\"im\"><span class=\"tx raw\" data-tex=\"p = p_{\\text{in}} = p_{\\text{atm}}\">p = p_{\\text{in}} = p_{\\text{atm}}<\/span><\/span>，図示トルク <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{ind}} = 0\">T_{\\text{ind}} = 0<\/span><\/span>．<\/li>\n<li>[S] S2 から 6 サイクルの全時刻で <span class=\"im\"><span class=\"tx raw\" data-tex=\"0 \\le Y_{b,\\text{in}} \\le 1\">0 \\le Y_{b,\\text{in}} \\le 1<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0 \\le Y_{b,p} \\le 1\">0 \\le Y_{b,p} \\le 1<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"E_{\\text{in}} \\ge 0\">E_{\\text{in}} \\ge 0<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"E_p \\ge 0\">E_p \\ge 0<\/span><\/span>．コールドリセット直後は <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{b,\\text{in}} = m_{b,p} = E_{\\text{in}} = E_p = 0\">m_{b,\\text{in}} = m_{b,p} = E_{\\text{in}} = E_p = 0<\/span><\/span>．<\/li>\n<li>[S]（既燃ガスの収支）S2 の直近 5 サイクルで，<span class=\"im\"><span class=\"tx raw\" data-tex=\"B_o\">B_o<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"B_i\">B_i<\/span><\/span> の増分の差が両者の平均の <span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\%\">2\\%<\/span><\/span> 以内（定常では既燃ガスがたまり続けない）．かつ <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{b,\\text{in}} + m_{b,p}\">m_{b,\\text{in}} + m_{b,p}<\/span><\/span> の増分と <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta B_o - \\Delta B_i\">\\Delta B_o - \\Delta B_i<\/span><\/span> の差が <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-3}\\,\\Delta B_o\">10^{-3}\\,\\Delta B_o<\/span><\/span> 以内．<\/li>\n<li>[S]（余剰エンタルピーの収支）同じ 5 サイクルで，<span class=\"im\"><span class=\"tx raw\" data-tex=\"E_{\\text{in}} + E_p\">E_{\\text{in}} + E_p<\/span><\/span> の増分と <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta X_o - \\Delta X_i - \\Delta X_t\">\\Delta X_o - \\Delta X_i - \\Delta X_t<\/span><\/span> の差が <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-6}\\,\\Delta X_o\">10^{-6}\\,\\Delta X_o<\/span><\/span> 以内（<span class=\"im\"><span class=\"tx raw\" data-tex=\"X_i\">X_i<\/span><\/span>：順流で筒内へ戻った分 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\int\\dot m_{\\text{in}}^+\\varepsilon_{\\text{src}}\\,dt\">\\int\\dot m_{\\text{in}}^+\\varepsilon_{\\text{src}}\\,dt<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"X_t\">X_t<\/span><\/span>：スロットルの逆流で出た分）．かつ <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta X_o\">\\Delta X_o<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta X_i\">\\Delta X_i<\/span><\/span> の差が両者の平均の <span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\%\">2\\%<\/span><\/span> 以内（定常では全量が戻る）．<\/li>\n<li>[S]（吹き返しによる加熱）S2 の 1 サイクルで，吸気弁の順流の上流温度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{up}}\">T_{\\text{up}}<\/span><\/span> の流量加重平均が <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{in}}\">T_{\\text{in}}<\/span><\/span> より <span class=\"im\"><span class=\"tx raw\" data-tex=\"15\\ \\text{K}\">15\\ \\text{K}<\/span><\/span> 以上高い（実測 <span class=\"im\"><span class=\"tx raw\" data-tex=\"+47\\ \\text{K}\">+47\\ \\text{K}<\/span><\/span>）．全時刻で <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{up}} \\ge T_{\\text{in}}\">T_{\\text{up}} \\ge T_{\\text{in}}<\/span><\/span>．<\/li>\n<li>[A] 余剰が <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> のとき <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{up}} = T_{\\text{in}}\">T_{\\text{up}} = T_{\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"h_j = h(T_{\\text{in}}, Y_j)\">h_j = h(T_{\\text{in}}, Y_j)<\/span><\/span>（厳密）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon_{\\text{src}} = c_p(T_{\\text{in}}, Y_j) \\cdot 30\\ \\text{K}\">\\varepsilon_{\\text{src}} = c_p(T_{\\text{in}}, Y_j) \\cdot 30\\ \\text{K}<\/span><\/span> のとき <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{up}} = T_{\\text{in}} + 30\\ \\text{K}\">T_{\\text{up}} = T_{\\text{in}} + 30\\ \\text{K}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"h_j = h(T_{\\text{in}}, Y_j) + \\varepsilon_{\\text{src}}\">h_j = h(T_{\\text{in}}, Y_j) + \\varepsilon_{\\text{src}}<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>）．<\/li>\n<\/ol>\n","<h3 id=\"spech109\">TEST-06：筒内の組成（未燃ガスと既燃ガス）（REQ-06，SPEC-06）<\/h3>\n<ol type=\"1\">\n<li>[S] S2，S3，S4 の全サイクルの全記録点で <span class=\"im\"><span class=\"tx raw\" data-tex=\"0 \\le m_u \\le m\">0 \\le m_u \\le m<\/span><\/span>．直近 5 サイクルで，排気弁が開く時点の <span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_u &lt; 0.01\">Y_u &lt; 0.01<\/span><\/span>（Wiebe の燃焼割合 <span class=\"im\"><span class=\"tx raw\" data-tex=\"99.3\\%\">99.3\\%<\/span><\/span> に対応），<span class=\"im\"><span class=\"tx raw\" data-tex=\"0 \\le x_r \\le 1\">0 \\le x_r \\le 1<\/span><\/span>．<\/li>\n<li>[S]（質量の収支）S4 の定常の 5 サイクルで，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M_{\\text{in}} - M_{\\text{ex}}\">M_{\\text{in}} - M_{\\text{ex}}<\/span><\/span> の増分と筒内質量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"m\">m<\/span><\/span> の増分の差が，1 サイクルに吸気弁を通る質量の <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-6}\">10^{-6}<\/span><\/span> 以下．<\/li>\n<\/ol>\n","<h3 id=\"spech110\">TEST-07：燃焼（乱流火炎伝播に連動する単一 Wiebe モデル）（REQ-07，SPEC-07）<\/h3>\n<ol type=\"1\">\n<li>[A] <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\int_0^1\\frac{dx_b}{d\\zeta}\\,d\\zeta = 1 - e^{-a}\">\\int_0^1\\frac{dx_b}{d\\zeta}\\,d\\zeta = 1 - e^{-a}<\/span><\/span>（台形則 2000 分割，相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-5}\">10^{-5}<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_w = 0.5, 2, 4\">m_w = 0.5, 2, 4<\/span><\/span>）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"x_b(\\zeta_{50}) = 0.5\">x_b(\\zeta_{50}) = 0.5<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\zeta_{50} = (\\ln 2/a)^{1/(m_w + 1)}\">\\zeta_{50} = (\\ln 2/a)^{1/(m_w + 1)}<\/span><\/span>）．<\/li>\n<li>[A]（層流燃焼速度）<span class=\"im\"><span class=\"tx raw\" data-tex=\"S_{L,0}(1.13) = 0.2758\">S_{L,0}(1.13) = 0.2758<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"S_{L,0}(1.0) = 0.2758 - 0.7834 \\times 0.13^2 = 0.26256\">S_{L,0}(1.0) = 0.2758 - 0.7834 \\times 0.13^2 = 0.26256<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>），<span class=\"im\"><span class=\"tx raw\" data-tex=\"S_{L,0}\">S_{L,0}<\/span><\/span> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1.13\">\\phi = 1.13<\/span><\/span> で最大．基準状態で <span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r = 0.2\">x_r = 0.2<\/span><\/span> の <span class=\"im\"><span class=\"tx raw\" data-tex=\"S_L\">S_L<\/span><\/span> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r = 0\">x_r = 0<\/span><\/span> の <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.58\">0.58<\/span><\/span> 倍，<span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r = 0.5\">x_r = 0.5<\/span><\/span> では下限の <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.15\">0.15<\/span><\/span> 倍．<\/li>\n<li>[A] <span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r = 0.05 \\to 0.25\">x_r = 0.05 \\to 0.25<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"S_L\">S_L<\/span><\/span> が減る．点火を <span class=\"im\"><span class=\"tx raw\" data-tex=\"20^\\circ\">20^\\circ<\/span><\/span> BTDC から <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^\\circ\">10^\\circ<\/span><\/span> ATDC にすると燃焼期間が延びる．<\/li>\n<li>[A]（調整係数）<span class=\"im\"><span class=\"tx raw\" data-tex=\"c_d = 2\">c_d = 2<\/span><\/span> で着火遅れが 2 倍，<span class=\"im\"><span class=\"tx raw\" data-tex=\"c_b = 2\">c_b = 2<\/span><\/span> で燃焼期間が半分．<\/li>\n<li>[A]（リッチ）<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\epsilon(1) = 1\">\\epsilon(1) = 1<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1.1, 1.2, 1.4\">\\phi = 1.1, 1.2, 1.4<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"a&#x27;, b&#x27;, c&#x27;, d&#x27;\">a&#x27;, b&#x27;, c&#x27;, d&#x27;<\/span><\/span> が元素保存の 3 式と <span class=\"im\"><span class=\"tx raw\" data-tex=\"K_w = 3.5\">K_w = 3.5<\/span><\/span> を満たし（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>），すべて <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ge 0\">\\ge 0<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi\\,\\epsilon(\\phi)\">\\phi\\,\\epsilon(\\phi)<\/span><\/span> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi \\ge 1\">\\phi \\ge 1<\/span><\/span> で単調減少し，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1.1\">\\phi = 1.1<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.969 \\pm 0.002\">0.969 \\pm 0.002<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"1.2\">1.2<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.938 \\pm 0.002\">0.938 \\pm 0.002<\/span><\/span>．<\/li>\n<li>[S]（当量比）S4 の定常から当量比だけを変えて各 <span class=\"im\"><span class=\"tx raw\" data-tex=\"3\\ \\text{s}\">3\\ \\text{s}<\/span><\/span>：IMEP が <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 0.8 &lt; 0.9 &lt; 1.0\">\\phi = 0.8 &lt; 0.9 &lt; 1.0<\/span><\/span> で増え，<span class=\"im\"><span class=\"tx raw\" data-tex=\"1.0 &gt; 1.1 &gt; 1.2\">1.0 &gt; 1.1 &gt; 1.2<\/span><\/span> で減る．スロットル制御（S2 から）では <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1.2\">\\phi = 1.2<\/span><\/span> の燃料流量が <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1.0\">\\phi = 1.0<\/span><\/span> より <span class=\"im\"><span class=\"tx raw\" data-tex=\"15\\%\">15\\%<\/span><\/span> 以上多く，回転数は目標 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 25\\ \\text{rpm}\">\\pm 25\\ \\text{rpm}<\/span><\/span>．<\/li>\n<li>[S]（調整係数の効果）S4 の定常から点火を固定して <span class=\"im\"><span class=\"tx raw\" data-tex=\"c_b = 2\">c_b = 2<\/span><\/span> にすると <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\max}\">p_{\\max}<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"5\\%\">5\\%<\/span><\/span> 以上上がる．自動最適化 ON では CA50 が上死点後 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10 \\pm 0.5^\\circ\">10 \\pm 0.5^\\circ<\/span><\/span> に戻る．<\/li>\n<li>[S]（サイクル変動）S4V（S4 の定常からサイクル変動 ON で <span class=\"im\"><span class=\"tx raw\" data-tex=\"10\\ \\text{s}\">10\\ \\text{s}<\/span><\/span>）：直近 60 サイクルの IMEP の変動係数が <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5\">0.5<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"5\\%\">5\\%<\/span><\/span>，平均 IMEP が OFF と <span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\%\">2\\%<\/span><\/span> 以内，<span class=\"im\"><span class=\"tx raw\" data-tex=\"z_1, z_2\">z_1, z_2<\/span><\/span> の標本平均の絶対値が <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.3\">0.3<\/span><\/span> 未満・標準偏差が <span class=\"im\"><span class=\"tx raw\" data-tex=\"1 \\pm 0.25\">1 \\pm 0.25<\/span><\/span>・<span class=\"im\"><span class=\"tx raw\" data-tex=\"|z| \\le \\sqrt 3\">|z| \\le \\sqrt 3<\/span><\/span>，平均 CA50 が上死点後 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10 \\pm 1^\\circ\">10 \\pm 1^\\circ<\/span><\/span>．<\/li>\n<li>[S]（決定性）S4 の終端を複製してサイクル変動 ON で <span class=\"im\"><span class=\"tx raw\" data-tex=\"10\\ \\text{s}\">10\\ \\text{s}<\/span><\/span> 積分した状態が S4V の終端と完全に一致する．OFF では <span class=\"im\"><span class=\"tx raw\" data-tex=\"z_1 = z_2 = 0\">z_1 = z_2 = 0<\/span><\/span>．<\/li>\n<\/ol>\n","<h3 id=\"spech111\">TEST-08：壁面熱伝達と壁温（REQ-08，SPEC-08）<\/h3>\n<ol type=\"1\">\n<li>[A] <span class=\"im\"><span class=\"tx raw\" data-tex=\"C_w = 0\">C_w = 0<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"h_c = 0\">h_c = 0<\/span><\/span>．ソルバの右辺でも <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot Q_{\\text{wall}} = 0\">\\dot Q_{\\text{wall}} = 0<\/span><\/span>．<\/li>\n<li>[A] <span class=\"im\"><span class=\"tx raw\" data-tex=\"p &gt; p_{\\text{mot}}\">p &gt; p_{\\text{mot}}<\/span><\/span> のとき，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p = p_{\\text{mot}}\">p = p_{\\text{mot}}<\/span><\/span> のときより <span class=\"im\"><span class=\"tx raw\" data-tex=\"w\">w<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"h_c\">h_c<\/span><\/span> が大きい．<\/li>\n<li>[A] 壁温の式：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot Q_{\\text{wall}} = 0\">\\dot Q_{\\text{wall}} = 0<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_w = 300\\ \\text{K}\">T_w = 300\\ \\text{K}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{dT_w}{dt} = \\frac{15 \\times 60}{1500} = 0.6\\ \\text{K/s}\">\\frac{dT_w}{dt} = \\frac{15 \\times 60}{1500} = 0.6\\ \\text{K/s}<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>）．<\/li>\n<\/ol>\n","<h3 id=\"spech112\">TEST-09：筒内圧の式（開いた系の熱力学第一法則）（REQ-09，SPEC-09）<\/h3>\n<ol type=\"1\">\n<li>[A]（断熱圧縮）弁を閉じ，燃焼と熱損失を無くし，定比熱比 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_0 = 1.35\">\\gamma_0 = 1.35<\/span><\/span> で下死点（<span class=\"im\"><span class=\"tx raw\" data-tex=\"100\\ \\text{kPa}\">100\\ \\text{kPa}<\/span><\/span>）から上死点まで積分すると，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p(2\\pi) = p(\\pi)\\,\\varepsilon^{\\gamma_0}\">p(2\\pi) = p(\\pi)\\,\\varepsilon^{\\gamma_0}<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-5}\">10^{-5}<\/span><\/span>）．さらに膨張下死点まで積分すると <span class=\"im\"><span class=\"tx raw\" data-tex=\"p(3\\pi) = p(\\pi)\">p(3\\pi) = p(\\pi)<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-5}\">10^{-5}<\/span><\/span>）で，1 往復の図示仕事が <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>．<\/li>\n<li>[A]（温度依存比熱の閉じた系）<code>EngineCore<\/code> の右辺で，弁を閉じ，燃焼と熱損失を無くし，回転数を固定し，比熱を <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma(T)\">\\gamma(T)<\/span><\/span> として，未燃ガスだけ（<span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_u = 1\">Y_u = 1<\/span><\/span>）と既燃ガスだけ（<span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_u = 0\">Y_u = 0<\/span><\/span>）のそれぞれを，両方の弁が閉じている <span class=\"im\"><span class=\"tx raw\" data-tex=\"270^\\circ\">270^\\circ<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"100\\ \\text{kPa}\">100\\ \\text{kPa}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"450\\ \\text{K}\">450\\ \\text{K}<\/span><\/span>）から上死点（<span class=\"im\"><span class=\"tx raw\" data-tex=\"360^\\circ\">360^\\circ<\/span><\/span>）まで積分すると，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m\\left[e_k(T_{\\text{end}}) - e_k(T_{\\text{start}})\\right] = -\\Delta W\">m\\left[e_k(T_{\\text{end}}) - e_k(T_{\\text{start}})\\right] = -\\Delta W<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-6}\">10^{-6}<\/span><\/span>）．終端の温度が <span class=\"im\"><span class=\"tx raw\" data-tex=\"700\\ \\text{K}\">700\\ \\text{K}<\/span><\/span> 以上（比熱の温度依存が効く範囲）．<\/li>\n<li>[S]（第一法則の収支）S2（アイドル），S3（部分負荷），W3000（全開）のそれぞれで，直近 5 サイクルの <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\left|\\Delta U_s + \\Delta W + \\Delta Q_w - \\Delta Q_c - \\Delta H_i + \\Delta H_o\\right| \\le 10^{-4}\\,\\Delta Q_c\">\\left|\\Delta U_s + \\Delta W + \\Delta Q_w - \\Delta Q_c - \\Delta H_i + \\Delta H_o\\right| \\le 10^{-4}\\,\\Delta Q_c<\/span><\/span>（実測：<span class=\"im\"><span class=\"tx raw\" data-tex=\"1.9 \\times 10^{-6}\">1.9 \\times 10^{-6}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"5.4 \\times 10^{-7}\">5.4 \\times 10^{-7}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"2.3 \\times 10^{-7}\">2.3 \\times 10^{-7}<\/span><\/span>）．<\/li>\n<li>[S]（熱の行き先が妥当）W3000 の直近 5 サイクルで，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta Q_w/\\Delta Q_c\">\\Delta Q_w/\\Delta Q_c<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.10\">0.10<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.30\">0.30<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\max}\">T_{\\max}<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"2200\">2200<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"2700\\ \\text{K}\">2700\\ \\text{K}<\/span><\/span>（実測：<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.179\">0.179<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"2484\\ \\text{K}\">2484\\ \\text{K}<\/span><\/span>）．<\/li>\n<\/ol>\n","<h3 id=\"spech113\">TEST-10：回転運動，摩擦，スターター（REQ-10，SPEC-10）<\/h3>\n<ol type=\"1\">\n<li>[A] <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{FMEP}(p_{\\max} = 5000\\ \\text{kPa},\\ 3000\\ \\text{rpm}) = 13.7 + 25 + 16.2 \\times 8.6 = 178.02\\ \\text{kPa}\">\\text{FMEP}(p_{\\max} = 5000\\ \\text{kPa},\\ 3000\\ \\text{rpm}) = 13.7 + 25 + 16.2 \\times 8.6 = 178.02\\ \\text{kPa}<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>）．<\/li>\n<li>[S] CRANK（燃料 OFF でスターターだけ，<span class=\"im\"><span class=\"tx raw\" data-tex=\"5\\ \\text{s}\">5\\ \\text{s}<\/span><\/span>）：サイクル平均の角速度が，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_f = a + b\\,\\omega\">T_f = a + b\\,\\omega<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"a = (F_0 + F_1 p_{\\max})\\frac{V_d}{4\\pi} + T_{\\text{aux}}\">a = (F_0 + F_1 p_{\\max})\\frac{V_d}{4\\pi} + T_{\\text{aux}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"b = F_2\\frac{S}{\\pi}\\frac{V_d}{4\\pi}\">b = F_2\\frac{S}{\\pi}\\frac{V_d}{4\\pi}<\/span><\/span>）としたつり合いの値 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\omega_{\\text{eq}} = \\frac{T_{\\text{stall}} - a}{T_{\\text{stall}}/\\omega_{nl} + b}\">\\omega_{\\text{eq}} = \\frac{T_{\\text{stall}} - a}{T_{\\text{stall}}/\\omega_{nl} + b}<\/span><\/span> の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 15\\%\">\\pm 15\\%<\/span><\/span> 以内（差はポンプ損失）．完爆と判定されない．<\/li>\n<li>[S] S1（コールドリセットから START，<span class=\"im\"><span class=\"tx raw\" data-tex=\"5\\ \\text{s}\">5\\ \\text{s}<\/span><\/span>）：<span class=\"im\"><span class=\"tx raw\" data-tex=\"3\\ \\text{s}\">3\\ \\text{s}<\/span><\/span> 以内に完爆と判定し，その後は <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{st}} = 0\">T_{\\text{st}} = 0<\/span><\/span>，全状態量が有限．<\/li>\n<li>[S] S3 の定常サイクルで <span class=\"im\"><span class=\"tx raw\" data-tex=\"W_f = \\text{FMEP}\\cdot V_d\">W_f = \\text{FMEP}\\cdot V_d<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span>）．<\/li>\n<li>[A] 図示トルク：<span class=\"im\"><span class=\"tx raw\" data-tex=\"p = p_{\\text{atm}}\">p = p_{\\text{atm}}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{ind}} = 0\">T_{\\text{ind}} = 0<\/span><\/span>．回転数固定のモードで <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{d\\omega}{dt} = 0\">\\frac{d\\omega}{dt} = 0<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\omega = 0\">\\omega = 0<\/span><\/span> で右辺が負なら <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{d\\theta}{dt} = \\frac{d\\omega}{dt} = 0\">\\frac{d\\theta}{dt} = \\frac{d\\omega}{dt} = 0<\/span><\/span>．<\/li>\n<\/ol>\n","<h3 id=\"spech114\">TEST-11：水ブレーキ式動力計と運転モード（REQ-11，SPEC-11）<\/h3>\n<ol type=\"1\">\n<li>[A] <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{dyno}}(1, \\omega_{\\text{rated}}) = T_{\\text{rated}}\">T_{\\text{dyno}}(1, \\omega_{\\text{rated}}) = T_{\\text{rated}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T(2\\omega)/T(\\omega) = 4\">T(2\\omega)/T(\\omega) = 4<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{dyno}}(1,\\ 800\\ \\text{rpm}) = 9.9\\ \\text{N·m}\">T_{\\text{dyno}}(1,\\ 800\\ \\text{rpm}) = 9.9\\ \\text{N·m}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\%\">1\\%<\/span><\/span>）．ソルバの右辺で <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{dyno}} = f_{\\text{eff}}k_w\\omega^2\">T_{\\text{dyno}} = f_{\\text{eff}}k_w\\omega^2<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{eff}} = 0.5\">f_{\\text{eff}} = 0.5<\/span><\/span>，相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>）．<\/li>\n<li>[A] <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{cmd}}\">f_{\\text{cmd}}<\/span><\/span> を <span class=\"im\"><span class=\"tx raw\" data-tex=\"0 \\to 1\">0 \\to 1<\/span><\/span> にすると <span class=\"im\"><span class=\"tx raw\" data-tex=\"t = \\tau_d\">t = \\tau_d<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{eff}} = 1 - e^{-1}\">f_{\\text{eff}} = 1 - e^{-1}<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span>．刻み <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-4}\\ \\text{s}\">10^{-4}\\ \\text{s}<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"3 \\times 10^{-3}\\ \\text{s}\">3 \\times 10^{-3}\\ \\text{s}<\/span><\/span> の両方）．<\/li>\n<li>[S] S3（スロットル制御，<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{manual}} = 0.3\">f_{\\text{manual}} = 0.3<\/span><\/span>）：直近 10 サイクル平均で <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_b\">T_b<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{dyno}}\">T_{\\text{dyno}}<\/span><\/span> の相対差が <span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\%\">2\\%<\/span><\/span> 以内．<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{cmd}} = f_{\\text{manual}}\">f_{\\text{cmd}} = f_{\\text{manual}}<\/span><\/span> で一定．<\/li>\n<li>[S] S4（動力計制御，<span class=\"im\"><span class=\"tx raw\" data-tex=\"1500\\ \\text{rpm}\">1500\\ \\text{rpm}<\/span><\/span>，開度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"15^\\circ\">15^\\circ<\/span><\/span>）：最後の <span class=\"im\"><span class=\"tx raw\" data-tex=\"5\\ \\text{s}\">5\\ \\text{s}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N\">\\bar N<\/span><\/span> の平均が <span class=\"im\"><span class=\"tx raw\" data-tex=\"1500 \\pm 10\\ \\text{rpm}\">1500 \\pm 10\\ \\text{rpm}<\/span><\/span>，瞬時値が <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 25\\ \\text{rpm}\">\\pm 25\\ \\text{rpm}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0 &lt; f_{\\text{cmd}} &lt; 1\">0 &lt; f_{\\text{cmd}} &lt; 1<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha = \\alpha_{\\text{manual}}\">\\alpha = \\alpha_{\\text{manual}}<\/span><\/span> で一定．<\/li>\n<li>[S] S6（動力計制御，<span class=\"im\"><span class=\"tx raw\" data-tex=\"3000\\ \\text{rpm}\">3000\\ \\text{rpm}<\/span><\/span>，開度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"7^\\circ\">7^\\circ<\/span><\/span>）：<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{cmd}} = 0\">f_{\\text{cmd}} = 0<\/span><\/span> に張り付いて <code>UNDERPOWER<\/code> になり，その間 <span class=\"im\"><span class=\"tx raw\" data-tex=\"|I_f|\">|I_f|<\/span><\/span> が増えない．目標を <span class=\"im\"><span class=\"tx raw\" data-tex=\"1400\\ \\text{rpm}\">1400\\ \\text{rpm}<\/span><\/span> に下げると <span class=\"im\"><span class=\"tx raw\" data-tex=\"5\\ \\text{s}\">5\\ \\text{s}<\/span><\/span> 以内に <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{cmd}} &gt; 0\">f_{\\text{cmd}} &gt; 0<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"8\\ \\text{s}\">8\\ \\text{s}<\/span><\/span> 後に <span class=\"im\"><span class=\"tx raw\" data-tex=\"1400 \\pm 50\\ \\text{rpm}\">1400 \\pm 50\\ \\text{rpm}<\/span><\/span>．<\/li>\n<li>[S] S4b（S4 から <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{atm}} = 80\\ \\text{kPa}\">p_{\\text{atm}} = 80\\ \\text{kPa}<\/span><\/span>）：定常の軸トルクが S4 より小さい．<\/li>\n<li>[S] S5（動力計制御，<span class=\"im\"><span class=\"tx raw\" data-tex=\"800\\ \\text{rpm}\">800\\ \\text{rpm}<\/span><\/span>，全開）：<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{cmd}} = 1\">f_{\\text{cmd}} = 1<\/span><\/span> に張り付いて <code>OVERLOAD<\/code> になる．<\/li>\n<li>[S]（モードの切替）S2 の終端からスロットル制御 → 動力計制御に切り替えた直後の 1 ステップで，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha_{\\text{manual}}\">\\alpha_{\\text{manual}}<\/span><\/span> が切替前の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha\">\\alpha<\/span><\/span> に等しく，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha\">\\alpha<\/span><\/span> が変わらず，<span class=\"im\"><span class=\"tx raw\" data-tex=\"|\\Delta f_{\\text{cmd}}| \\le 10^{-3}\">|\\Delta f_{\\text{cmd}}| \\le 10^{-3}<\/span><\/span>．続けてスロットル制御に戻した直後の 1 ステップで，<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{manual}}\">f_{\\text{manual}}<\/span><\/span> が切替前の <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{cmd}}\">f_{\\text{cmd}}<\/span><\/span> に等しく，<span class=\"im\"><span class=\"tx raw\" data-tex=\"|\\Delta\\alpha| \\le 0.01^\\circ\">|\\Delta\\alpha| \\le 0.01^\\circ<\/span><\/span>．<\/li>\n<\/ol>\n","<h3 id=\"spech115\">TEST-12：ECU（スロットル開度の PI 制御と点火時期の自動最適化）（REQ-12，SPEC-12）<\/h3>\n<ol type=\"1\">\n<li>[S] S2（S1 に続けて <span class=\"im\"><span class=\"tx raw\" data-tex=\"15\\ \\text{s}\">15\\ \\text{s}<\/span><\/span>）：最後の <span class=\"im\"><span class=\"tx raw\" data-tex=\"3\\ \\text{s}\">3\\ \\text{s}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"|\\bar N - 800| \\le 25\\ \\text{rpm}\">|\\bar N - 800| \\le 25\\ \\text{rpm}<\/span><\/span>，かつ <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha &gt; \\alpha_{\\min}\">\\alpha &gt; \\alpha_{\\min}<\/span><\/span>．<\/li>\n<li>[S] N1200（S2 から目標 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1200\\ \\text{rpm}\">1200\\ \\text{rpm}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"8\\ \\text{s}\">8\\ \\text{s}<\/span><\/span>）：最後の <span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\ \\text{s}\">2\\ \\text{s}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 25\\ \\text{rpm}\">\\pm 25\\ \\text{rpm}<\/span><\/span>．<\/li>\n<li>[S] S7（S2 から <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{atm}} = 80\\ \\text{kPa}\">p_{\\text{atm}} = 80\\ \\text{kPa}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"10\\ \\text{s}\">10\\ \\text{s}<\/span><\/span>）：<span class=\"im\"><span class=\"tx raw\" data-tex=\"800 \\pm 25\\ \\text{rpm}\">800 \\pm 25\\ \\text{rpm}<\/span><\/span> を保ち，定常の開度が S2 より大きい．<\/li>\n<li>[S] AMAX（S2 から目標 <span class=\"im\"><span class=\"tx raw\" data-tex=\"2000\\ \\text{rpm}\">2000\\ \\text{rpm}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha_{\\max} = 5^\\circ\">\\alpha_{\\max} = 5^\\circ<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"8\\ \\text{s}\">8\\ \\text{s}<\/span><\/span>）：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha = \\alpha_{\\max}\">\\alpha = \\alpha_{\\max}<\/span><\/span> に張り付き，<span class=\"im\"><span class=\"tx raw\" data-tex=\"4\\ \\text{s} \\to 8\\ \\text{s}\">4\\ \\text{s} \\to 8\\ \\text{s}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"I_\\alpha\">I_\\alpha<\/span><\/span> が増えない．<\/li>\n<li>[S] S4（動力計制御）：最後の <span class=\"im\"><span class=\"tx raw\" data-tex=\"10\\ \\text{s}\">10\\ \\text{s}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"I_\\alpha\">I_\\alpha<\/span><\/span> が変わらない．<\/li>\n<li>[S]（MBT）S4 の定常で，最後の 25 サイクルの CA50 が上死点後 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10 \\pm 0.5^\\circ\">10 \\pm 0.5^\\circ<\/span><\/span>．<\/li>\n<li>[S]（MBT）S4 の定常から，自動最適化を OFF にして点火時期を自動の値の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 4^\\circ\">\\pm 4^\\circ<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 8^\\circ\">\\pm 8^\\circ<\/span><\/span> に固定した各 <span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\ \\text{s}\">2\\ \\text{s}<\/span><\/span> の IMEP の最大に対し，自動の値での IMEP が <span class=\"im\"><span class=\"tx raw\" data-tex=\"99\\%\">99\\%<\/span><\/span> 以上．<\/li>\n<li>[A]（MBT）<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta_{50}\">\\theta_{50}<\/span><\/span> の式が <span class=\"im\"><span class=\"tx raw\" data-tex=\"x_b(\\theta_{50}) = 0.5\">x_b(\\theta_{50}) = 0.5<\/span><\/span> を満たす（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>）．自動最適化 OFF では点火時期が設定値に一致する．<\/li>\n<li>[A]（下限）<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{aux}} = 0, 2, 20\\ \\text{N·m}\">T_{\\text{aux}} = 0, 2, 20\\ \\text{N·m}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha_{\\min} = 2^\\circ, 2.52^\\circ, 7.2^\\circ\">\\alpha_{\\min} = 2^\\circ, 2.52^\\circ, 7.2^\\circ<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha_{\\text{base}} = 0\">\\alpha_{\\text{base}} = 0<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{aux}} = 0\">T_{\\text{aux}} = 0<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha_{\\max} = 5^\\circ\">\\alpha_{\\max} = 5^\\circ<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{aux}} = 20\\ \\text{N·m}\">T_{\\text{aux}} = 20\\ \\text{N·m}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"5^\\circ\">5^\\circ<\/span><\/span>．<\/li>\n<li>[S]（冷間始動）CS0，CS6，CS10（コールドリセットから START，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{aux}} = 0, 6, 10\\ \\text{N·m}\">T_{\\text{aux}} = 0, 6, 10\\ \\text{N·m}<\/span><\/span>，各 <span class=\"im\"><span class=\"tx raw\" data-tex=\"12\\ \\text{s}\">12\\ \\text{s}<\/span><\/span>）：<span class=\"im\"><span class=\"tx raw\" data-tex=\"3\\ \\text{s}\">3\\ \\text{s}<\/span><\/span> 以内に完爆して終了まで止まらない．完爆後の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N\">\\bar N<\/span><\/span> の最小が <span class=\"im\"><span class=\"tx raw\" data-tex=\"450\\ \\text{rpm}\">450\\ \\text{rpm}<\/span><\/span> 以上．完爆後は常に <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha \\ge \\alpha_{\\min}\">\\alpha \\ge \\alpha_{\\min}<\/span><\/span>．完爆後の吸気管圧の最小が <span class=\"im\"><span class=\"tx raw\" data-tex=\"6\\ \\text{kPa}\">6\\ \\text{kPa}<\/span><\/span> 以上．<\/li>\n<li>[S]（下限が制御を妨げない）N600（S2 から <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{aux}} = 0\">T_{\\text{aux}} = 0<\/span><\/span>，目標 <span class=\"im\"><span class=\"tx raw\" data-tex=\"600\\ \\text{rpm}\">600\\ \\text{rpm}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"15\\ \\text{s}\">15\\ \\text{s}<\/span><\/span>）：最後の <span class=\"im\"><span class=\"tx raw\" data-tex=\"3\\ \\text{s}\">3\\ \\text{s}<\/span><\/span> の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N\">\\bar N<\/span><\/span> の平均が <span class=\"im\"><span class=\"tx raw\" data-tex=\"600 \\pm 25\\ \\text{rpm}\">600 \\pm 25\\ \\text{rpm}<\/span><\/span> で，常に <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha &gt; \\alpha_{\\min}\">\\alpha &gt; \\alpha_{\\min}<\/span><\/span>．<\/li>\n<\/ol>\n","<h3 id=\"spech116\">TEST-13：数値積分（REQ-13，SPEC-13）<\/h3>\n<ol type=\"1\">\n<li>[A] 調和振動子を <span class=\"im\"><span class=\"tx raw\" data-tex=\"t = 1\">t = 1<\/span><\/span> まで RK4 で積分すると，刻みを半分にしたとき大域誤差が <span class=\"im\"><span class=\"tx raw\" data-tex=\"1/16\">1/16<\/span><\/span>（比 <span class=\"im\"><span class=\"tx raw\" data-tex=\"14\">14<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"18\">18<\/span><\/span>）になる．<\/li>\n<li>[A] DOPRI5 の 1 ステップの誤差が刻み半分で <span class=\"im\"><span class=\"tx raw\" data-tex=\"1/64\">1/64<\/span><\/span>（比 <span class=\"im\"><span class=\"tx raw\" data-tex=\"50\">50<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"80\">80<\/span><\/span>），誤差の見積もり <span class=\"im\"><span class=\"tx raw\" data-tex=\"|\\mathbf{y}_5 - \\mathbf{y}_4|\">|\\mathbf{y}_5 - \\mathbf{y}_4|<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"1/32\">1/32<\/span><\/span>（比 <span class=\"im\"><span class=\"tx raw\" data-tex=\"26\">26<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"38\">38<\/span><\/span>）になる．<\/li>\n<li>[S]（参照解との一致）S3 の定常から 1 サイクルを，RK4（既定），DOPRI5（既定），参照解（RK4，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta\\theta = 0.05^\\circ\">\\Delta\\theta = 0.05^\\circ<\/span><\/span>）で積分し，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\max}\">p_{\\max}<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"W\">W<\/span><\/span> が参照解と相対差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.1\\%\">0.1\\%<\/span><\/span> 以内．<\/li>\n<li>[S]（アイドルでの RK4）S2 の定常から 3 サイクルを RK4（既定）と参照解（RK4，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta\\theta = 0.02^\\circ\">\\Delta\\theta = 0.02^\\circ<\/span><\/span>）で積分し，3 サイクル目の IMEP が参照解と相対差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5\\%\">0.5\\%<\/span><\/span> 以内（実測 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1.3 \\times 10^{-5}\">1.3 \\times 10^{-5}<\/span><\/span>）．RK4（既定）の 3 サイクルで，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M_{\\text{in}}\">M_{\\text{in}}<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"M_{\\text{ex}}\">M_{\\text{ex}}<\/span><\/span> の増分が互いに相対差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.2\\%\">0.2\\%<\/span><\/span> 以内（実測 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.017\\%\">0.017\\%<\/span><\/span>）．<\/li>\n<li>[S]（イベント）S4 の定常の 3 サイクルで，サイクルの終端・IVO・IVC・EVO・EVC・点火のそれぞれについて，ステップの終端の角度とイベントの角度の差の最大が <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-8}\\ \\text{rad}\">10^{-8}\\ \\text{rad}<\/span><\/span> 以下．各イベントが 1 サイクルに 1 回ずつ処理される．全時刻で <span class=\"im\"><span class=\"tx raw\" data-tex=\"-10^{-8} \\le \\theta \\le 4\\pi + 10^{-8}\">-10^{-8} \\le \\theta \\le 4\\pi + 10^{-8}<\/span><\/span>．<\/li>\n<li>[S]（サイクルの時間）回転数を <span class=\"im\"><span class=\"tx raw\" data-tex=\"3000\\ \\text{rpm}\">3000\\ \\text{rpm}<\/span><\/span> に固定した全開の定常で，サイクルの所要時間が <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{4\\pi}{\\omega}\">\\frac{4\\pi}{\\omega}<\/span><\/span> と相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span> で一致する．<\/li>\n<li>[S]（射影と強制受理）S1，S2，S3，S4，S5，S6，W3000，CS0，CS6，CS10 の全ステップで，射影の適用回数と強制受理の回数がともに <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>．<\/li>\n<li>[A]（最高圧の補間）<span class=\"im\"><span class=\"tx raw\" data-tex=\"p = 5 - 2(\\theta - 1.3)^2\">p = 5 - 2(\\theta - 1.3)^2<\/span><\/span> の 3 点（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta = 1.0, 1.2, 1.5\">\\theta = 1.0, 1.2, 1.5<\/span><\/span>）から頂点の値 <span class=\"im\"><span class=\"tx raw\" data-tex=\"5\">5<\/span><\/span> を返す（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>）．[S] S4 の定常の <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\max}\">p_{\\max}<\/span><\/span> が，ステップ点の最大以上で，その <span class=\"im\"><span class=\"tx raw\" data-tex=\"1.001\">1.001<\/span><\/span> 倍以下．<\/li>\n<li>[S]（集計の整合）回転数を <span class=\"im\"><span class=\"tx raw\" data-tex=\"3000\\ \\text{rpm}\">3000\\ \\text{rpm}<\/span><\/span> に固定した全開の定常の 5 サイクルで，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M_{\\text{th}}\">M_{\\text{th}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M_r\">M_r<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M_{\\text{in}}\">M_{\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M_{\\text{ex}}\">M_{\\text{ex}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M_e\">M_e<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M_t\">M_t<\/span><\/span> の増分が相互に相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.1\\%\">0.1\\%<\/span><\/span> 以内．S2（アイドル）の 5 サイクルで <span class=\"im\"><span class=\"tx raw\" data-tex=\"M_{\\text{in}}\">M_{\\text{in}}<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"M_{\\text{ex}}\">M_{\\text{ex}}<\/span><\/span> の増分が <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5\\%\">0.5\\%<\/span><\/span> 以内．<\/li>\n<li>[S]（硬さ）S2 の 1 サイクルに沿って <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^\\circ\">10^\\circ<\/span><\/span> ごとにヤコビアンを差分で作り，べき乗法で求めた <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\max|\\lambda|\">\\max|\\lambda|<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"2.79/\\Delta t_{\\max}\">2.79/\\Delta t_{\\max}<\/span><\/span> 以下．<\/li>\n<li>[S]（高速化の等価性）速い計算経路が元の式の経路と浮動小数点数として同じ値を返す：右辺の出力先を指定した呼び出しとしない呼び出し，<code>EngineCore<\/code> 専用の DOPRI5 と汎用の DOPRI5，作用角を前計算した弁リフトとしない弁リフト，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Psi\">\\Psi<\/span><\/span> の実装と SPEC-04 の定義式，比熱比が一定の流れ（大気，排気系）のために <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_0\">\\gamma_0<\/span><\/span> だけで決まる量を前計算した <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Psi\">\\Psi<\/span><\/span>・流量と，前計算しないもの．<\/li>\n<\/ol>\n","<h3 id=\"spech117\">TEST-14：性能の指標と基準サイクル（REQ-14，SPEC-14）<\/h3>\n<p>S3（スロットル制御，<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{manual}} = 0.3\">f_{\\text{manual}} = 0.3<\/span><\/span>）と S4（動力計制御）の定常について，<\/p>\n<ol type=\"1\">\n<li>[S] <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{IMEP}\\cdot V_d = W_{i,\\text{net}}\">\\text{IMEP}\\cdot V_d = W_{i,\\text{net}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{PMEP}\\cdot V_d = W_{i,\\text{net}} - W_{i,\\text{gross}}\">\\text{PMEP}\\cdot V_d = W_{i,\\text{net}} - W_{i,\\text{gross}}<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"W_{i,\\text{net}}\">W_{i,\\text{net}}<\/span><\/span> が，ステップ点の <span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>-<span class=\"im\"><span class=\"tx raw\" data-tex=\"V\">V<\/span><\/span> の台形則による値と相対差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.1\\%\">0.1\\%<\/span><\/span> 以内．<\/li>\n<li>[S] <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{BMEP} = \\text{IMEP} - \\text{FMEP} - \\text{AMEP}\">\\text{BMEP} = \\text{IMEP} - \\text{FMEP} - \\text{AMEP}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"P_b = \\text{BMEP}\\cdot V_d/t_c\">P_b = \\text{BMEP}\\cdot V_d/t_c<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span>）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"0 &lt; \\eta_m &lt; 1\">0 &lt; \\eta_m &lt; 1<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{bsfc} &gt; 0\">\\text{bsfc} &gt; 0<\/span><\/span> で有限．<\/li>\n<li>[S]（理論の上限）直近 5 サイクルで <span class=\"im\"><span class=\"tx raw\" data-tex=\"P_i \\le \\eta_{\\text{Otto}}\\,\\dot m_f H_u\">P_i \\le \\eta_{\\text{Otto}}\\,\\dot m_f H_u<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_{\\text{Otto}} = 1 - \\varepsilon^{1 - 1.40}\">\\eta_{\\text{Otto}} = 1 - \\varepsilon^{1 - 1.40}<\/span><\/span>．<\/li>\n<li>[S]（動力の収支）直近 5 サイクル平均で <span class=\"im\"><span class=\"tx raw\" data-tex=\"|W_{i,\\text{net}} - \\Delta W_f - \\Delta W_a - \\Delta W_d|/W_{i,\\text{net}} \\le 2\\%\">|W_{i,\\text{net}} - \\Delta W_f - \\Delta W_a - \\Delta W_d|/W_{i,\\text{net}} \\le 2\\%<\/span><\/span>．<\/li>\n<li>[S] 基準サイクルを保存した後，点火時期と開度を変えて <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\ \\text{s}\">1\\ \\text{s}<\/span><\/span> 積分しても，保存した配列が書き換わらない．<\/li>\n<li>[S]（表示の規則）S1 の全期間（<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.05\\ \\text{s}\">0.05\\ \\text{s}<\/span><\/span> ごと）で，完爆前の IMEP・効率の表示が「–」，効率の表示が <span class=\"im\"><span class=\"tx raw\" data-tex=\"[0, 1.5]\">[0, 1.5]<\/span><\/span> の外に出ず，<code>NaN<\/code>・<code>Infinity<\/code> を表示しない．<\/li>\n<li>[S] <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_i = W_{i,\\text{net}}/(m_f H_u)\">\\eta_i = W_{i,\\text{net}}/(m_f H_u)<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>）．動力計制御・開度固定で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1.2\">\\phi = 1.2<\/span><\/span> の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_i\">\\eta_i<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1.0\">\\phi = 1.0<\/span><\/span> より <span class=\"im\"><span class=\"tx raw\" data-tex=\"10\\%\">10\\%<\/span><\/span> 以上低い．<\/li>\n<li>[S]（10 サイクル平均）S3 の定常で，表示用の各指標が直近 10 サイクルの値の算術平均と一致する（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>）．コールドリセットの直後は「–」に戻り，完爆後 3 サイクルの時点では 3 サイクルの平均である．<\/li>\n<li>[S]（体積効率）<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_v = \\frac{m_{u,\\text{trapped}}}{(1 + \\phi/\\text{AF}_{st})\\,\\rho_{\\text{atm}}V_d}\">\\eta_v = \\frac{m_{u,\\text{trapped}}}{(1 + \\phi/\\text{AF}_{st})\\,\\rho_{\\text{atm}}V_d}<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>）．<\/li>\n<\/ol>\n","<h3 id=\"spech118\">TEST-15：画面の構成と操作（REQ-15，SPEC-15）<\/h3>\n<ol type=\"1\">\n<li>[U] 「解説」以外の 5 タブの全サブページ（線図 7，性能曲線 6，設定の全ページ，検証，運転の指標 2 ページ）で，ルート要素と全容器が <code>scrollHeight ≤ clientHeight<\/code> かつ <code>scrollWidth ≤ clientWidth<\/code>．<\/li>\n<li>[U] 表示中の全ボタンが <span class=\"im\"><span class=\"tx raw\" data-tex=\"44 \\times 44\\ \\text{px}\">44 \\times 44\\ \\text{px}<\/span><\/span> 以上で，互いに重ならず，ビューポート内にある．ボタンの文字が折り返していない．<\/li>\n<li>[U] DOM に <code>input[type=\"range\"]<\/code> が無い．表示している全テキストに <code>bar<\/code> を含まない．ただし数式の TeX のソース（<code>.tx<\/code> の中）は除く（<code>\\bar<\/code> は上線の命令で，圧力の単位ではないため．TeX の表示のときに画面に出る）．<\/li>\n<li>[U] 合成した Pointer Events で，(a) 移動 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ge 8\\ \\text{px}\">\\ge 8\\ \\text{px}<\/span><\/span> または接触 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ge 500\\ \\text{ms}\">\\ge 500\\ \\text{ms}<\/span><\/span> はタップにならない，(b) 接触の幅 <span class=\"im\"><span class=\"tx raw\" data-tex=\"100\\ \\text{px}\">100\\ \\text{px}<\/span><\/span> のタップも受理される，(c) <code>[RESET]<\/code> は単押しで無効・<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.6\\ \\text{s}\">0.6\\ \\text{s}<\/span><\/span> の長押しで有効，(d) 検証タブの 28 チップすべてがタップで選べ，詳細カードの見出しが選んだテストの番号になる．<\/li>\n<li>[U] Canvas のビットマップ寸法が CSS 寸法 × <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\min(\\text{dpr}, 2.5)\">\\min(\\text{dpr}, 2.5)<\/span><\/span>（四捨五入）と一致し，高さが下限以上．タブの切替を 10 回繰り返した後も一致する．<\/li>\n<li>[A] フレーム間隔を <span class=\"im\"><span class=\"tx raw\" data-tex=\"8.3\\ \\text{ms}\">8.3\\ \\text{ms}<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"16.7\\ \\text{ms}\">16.7\\ \\text{ms}<\/span><\/span> に模擬したとき，同じ実経過時間 <span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\ \\text{s}\">2\\ \\text{s}<\/span><\/span> に対するシミュレーション時間の進みの差が <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\%\">1\\%<\/span><\/span> 未満．非表示から戻った直後の 1 フレームで進む時間が <span class=\"im\"><span class=\"tx raw\" data-tex=\"50\\ \\text{ms}\">50\\ \\text{ms}<\/span><\/span> × 再生速度 ＋ 最大刻み 以下．<\/li>\n<li>[U] 表示中の全ボタンの文字幅（<code>Range.getBoundingClientRect<\/code>）が利用可能幅の <span class=\"im\"><span class=\"tx raw\" data-tex=\"95\\%\">95\\%<\/span><\/span> 以下．<\/li>\n<li>[U]（画面の段階）現在の幅 <span class=\"im\"><span class=\"tx raw\" data-tex=\"w\">w<\/span><\/span> に応じて：<span class=\"im\"><span class=\"tx raw\" data-tex=\"w \\ge 900\">w \\ge 900<\/span><\/span> なら運転タブで機関断面図と制御状態カードが横に並び，設定タブ（<span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>-<span class=\"im\"><span class=\"tx raw\" data-tex=\"V\">V<\/span><\/span> 図のあるページ）で項目の一覧と <span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>-<span class=\"im\"><span class=\"tx raw\" data-tex=\"V\">V<\/span><\/span> 図が横に並んで <span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>-<span class=\"im\"><span class=\"tx raw\" data-tex=\"V\">V<\/span><\/span> 図の高さが列の高さの <span class=\"im\"><span class=\"tx raw\" data-tex=\"80\\%\">80\\%<\/span><\/span> 以上，高さ <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ge 800\">\\ge 800<\/span><\/span> なら運転タブに <span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>-<span class=\"im\"><span class=\"tx raw\" data-tex=\"V\">V<\/span><\/span> 線図が表示される．<span class=\"im\"><span class=\"tx raw\" data-tex=\"w &lt; 900\">w &lt; 900<\/span><\/span> ならどちらも縦に並び，運転タブの <span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>-<span class=\"im\"><span class=\"tx raw\" data-tex=\"V\">V<\/span><\/span> 線図は表示されない．<span class=\"im\"><span class=\"tx raw\" data-tex=\"w \\ge 700\">w \\ge 700<\/span><\/span> なら指標 24 項目が同時に表示されて <code>[指標1/2]<\/code> が隠れ，<span class=\"im\"><span class=\"tx raw\" data-tex=\"w &lt; 700\">w &lt; 700<\/span><\/span> なら 12 項目と <code>[指標1/2]<\/code> が表示される．<\/li>\n<li>[A]（グラフの列数）<span class=\"im\"><span class=\"tx raw\" data-tex=\"(n, W, H) = (3, 344, 500) \\to 1\">(n, W, H) = (3, 344, 500) \\to 1<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"(3, 1380, 700) \\to 3\">(3, 1380, 700) \\to 3<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"(4, 1164, 650) \\to 3\">(4, 1164, 650) \\to 3<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"(2, 1380, 700) \\to 2\">(2, 1380, 700) \\to 2<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"(1, 1380, 700) \\to 1\">(1, 1380, 700) \\to 1<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"(3, 800, 900) \\to 1\">(3, 800, 900) \\to 1<\/span><\/span>．横に並べたとき，各グラフのプロット領域が互いに重ならず Canvas 内にある．<\/li>\n<li>[D] ヘッドレス Chromium で，A.2 の 6 つのビューポート（PC はタッチ無し）と，極端な利用者状態（<span class=\"im\"><span class=\"tx raw\" data-tex=\"384 \\times 780\">384 \\times 780<\/span><\/span>．SPEC-20）で全テストを実行する．MathJax の読み込み（C-1）は，6 つのビューポートでは手元に置いた同じ版（MathJax 3.2.2 の <code>es5/tex-svg.js<\/code>）に振り向け，極端な利用者状態では遮断する（オフラインに相当）．<\/li>\n<\/ol>\n","<h3 id=\"spech119\">TEST-16：解説タブ（REQ-16，SPEC-16）<\/h3>\n<ol type=\"1\">\n<li>[U] §0〜§17 がすべてあり，章に付けた <code>data-req<\/code> が SPEC-01〜14 と 21 を網羅する．MathJax で組んだときは組版の誤り（<code>data-mjx-error<\/code>，<code>mjx-merror<\/code>）が無い．<\/li>\n<li>[U] 式に現れる全識別子（<code>.tx<\/code> の <code>data-ids<\/code>）が §0 の記号表にある（未定義 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> 個）．<\/li>\n<li>[U] 解説に表示した係数の値がソルバの定数と一致する．§0 の現在値が設定値と一致する．<\/li>\n<li>[U] 全数式の要素に空でない TeX のソース（<code>data-tex<\/code>）がある．MathJax が使えるときは，(a) 解説（§0〜§17）と 3 文書の全数式を <code>MathJax.tex2svg<\/code> で組んで（画面には入れない）組版の誤りが無い，(b) 表示範囲に入っている数式が SVG（<code>mjx-container<\/code>）に組まれている，(c) 解説の別行立ての全数式を組んだとき，分数・根号・上付きを含まない式の高さが <span class=\"im\"><span class=\"tx raw\" data-tex=\"3\\ \\text{em}\">3\\ \\text{em}<\/span><\/span> 以下，全数式の幅が <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5\\ \\text{em}\">0.5\\ \\text{em}<\/span><\/span> 以上，分数を含む式も <span class=\"im\"><span class=\"tx raw\" data-tex=\"8\\ \\text{em}\">8\\ \\text{em}<\/span><\/span> 以下．TeX の表示のときは各要素の文字列が TeX のソースと一致し，等幅の字で表示される．<\/li>\n<li>[U] 数式の状態の表示（SPEC-16 3）が，MathJax の状態（組版／読み込み中／TeX 表示）と一致する．<\/li>\n<li>[U] 本文（段落・表）に生の下付き表記（<code>X_y<\/code>）が残っていない．<\/li>\n<li>[U] 数式が縮小されていない（MathJax の SVG の字の大きさが本文の <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\">1<\/span><\/span> 倍以上．TeX の表示は本文の <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.85\">0.85<\/span><\/span> 倍以上）．幅を超える数式と表の容器は <code>overflow-x: auto<\/code> で，解説タブ全体は横にスクロールしない．<\/li>\n<li>[U] 目次に §0〜§17 があり，各項目のタップで見出しの上端が解説タブの上端から <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 4\\ \\text{px}\">\\pm 4\\ \\text{px}<\/span><\/span> に来る．「先頭へ戻る」で縦スクロール位置が <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> になる．<\/li>\n<li>[U] §1 に 16 個の時間微分の式があり，左辺の記号が状態ベクトルの 16 成分に一対一で対応する．<\/li>\n<li>[U] 生成した TeX で，べき指数の底が閉じ括弧 1 文字だけになっている式が無い（<code>)^<\/code> は <code>\\right)^<\/code> の形だけ）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Psi\">\\Psi<\/span><\/span> の式は根号が右辺全体に掛かる（右辺が <code>\\sqrt{<\/code> で始まり対応する <code>}<\/code> で終わる）．<\/li>\n<li>[U] §16 に演出音の処理（10 段の表）と定数の表があり，表示している定数が合成器の定数と一致する．<\/li>\n<li>[U] 解説だけが縦にスクロールでき，ほかのタブへ移って戻った後のスクロール位置が <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 1\\ \\text{px}\">\\pm 1\\ \\text{px}<\/span><\/span> で保たれる．<\/li>\n<li>[U] §3 に未燃・既燃の比熱比の式と内部エネルギーの式（左辺が <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_u\">\\gamma_u<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_b\">\\gamma_b<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"e_u\">e_u<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"e_b\">e_b<\/span><\/span>），§6 に余剰エンタルピーの式（左辺が <span class=\"im\"><span class=\"tx raw\" data-tex=\"E_{\\text{in}}\">E_{\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"E_p\">E_p<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot X_o\">\\dot X_o<\/span><\/span>），§10 に組成の項（燃焼割合の時間微分と <span class=\"im\"><span class=\"tx raw\" data-tex=\"e_u - e_b\">e_u - e_b<\/span><\/span> の積）を含む筒内圧の式がある（式の TeX のソースで判定する）．<\/li>\n<li>[U] 設定の比熱（γ(T)／γ一定）とカム（Std／Poly／Aggr）を順に変えると，それぞれに対応する式だけが強調される．<\/li>\n<li>[U]（文書の閲覧）切替のボタンが 4 つあり，<span class=\"im\"><span class=\"tx raw\" data-tex=\"44\\ \\text{px}\">44\\ \\text{px}<\/span><\/span> 以上で文字幅の余裕（SPEC-15 G.2）を満たす．<code>[要件定義書]<\/code> <code>[仕様書]<\/code> <code>[用語集]<\/code> のそれぞれをタップすると，最初のページに文書の題（<code>h1<\/code>）が表示される．全ページを順に表示して数えた数式（<code>.tx<\/code>）の数が，ビルド時に数えた数と一致する．MathJax が使えるときは全数式が誤りなく組め，表示範囲の数式が組まれている．目次の最初と最後の項目のタップで，その見出しのページに替わって見出しが上端（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 4\\ \\text{px}\">\\pm 4\\ \\text{px}<\/span><\/span>）に来る．解説タブが横にスクロールしない．<\/li>\n<li>[U]（文書の閲覧）全ページを通して，要件定義書に REQ-01〜28 の見出しが，仕様書に SPEC-01〜28 と TEST-01〜28 の見出しが，それぞれ 1 つずつある．<code>[式の解説]<\/code> で元の表示（§0〜§17）に戻る．文書を切り替えて戻ると，表示中のページが同じで，縦スクロール位置が <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 1\\ \\text{px}\">\\pm 1\\ \\text{px}<\/span><\/span> で保たれる．<\/li>\n<li>[U]（ページ）画面にある文書の断片は，表示中の 1 ページだけである（その文書の中の <code>h2<\/code>，<code>h3<\/code> で始まる断片が 1 つ）．<code>[次 ▶]<\/code> <code>[◀ 前]<\/code> で位置の表示が 1 ずつ変わり，最初のページで <code>[◀ 前]<\/code>，最後のページで <code>[次 ▶]<\/code> が無効．ボタンは <span class=\"im\"><span class=\"tx raw\" data-tex=\"44\\ \\text{px}\">44\\ \\text{px}<\/span><\/span> 以上．3 文書の全ページを順に表示する間，1 ページの切り替え（断片の組み立てと組版）にかかる時間が <span class=\"im\"><span class=\"tx raw\" data-tex=\"100\\ \\text{ms}\">100\\ \\text{ms}<\/span><\/span> 以下．<\/li>\n<li>[U]（第三者の著作物を埋め込まない，C-8）成果物の CSS に <code>@font-face<\/code> が無く，HTML に base64 の data URL（<code>data:<\/code> で始まり <code>;base64,<\/code> を含む URL）が無く，<code>document.fonts<\/code> に成果物が定義したフォントが無い．MathJax を読み込む <code>&lt;script&gt;<\/code> の <code>src<\/code> が <code>https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js<\/code> で，式の解説の末尾に <code>MathJax 3.2.2<\/code>，<code>Apache License 2.0<\/code>，<code>cdnjs<\/code> がある．<\/li>\n<li>[U]（TeX の表示）MathJax の有無によらず，TeX の表示の関数で数式の要素を描くと，中身が TeX のソースと一致する等幅の文字列になり，別行立ての式は独立の行で <code>overflow-x: auto<\/code> になる．MathJax が使えるときは，同じ要素を組み直すと SVG に置き換わる．開発時検証では，7 通りのうち極端な利用者状態の 1 通りで MathJax の読み込みを遮断し，全テストを TeX の表示で通す（ほかの 6 通りは手元の MathJax 3.2.2 に振り向ける）．<\/li>\n<\/ol>\n","<h3 id=\"spech120\">TEST-17：グラフの軸・目盛・自動レンジ（REQ-17，SPEC-17）<\/h3>\n<ol type=\"1\">\n<li>[A] 目盛：<span class=\"im\"><span class=\"tx raw\" data-tex=\"F \\in \\{1, 2, 5, \\dots, 5000\\}\">F \\in \\{1, 2, 5, \\dots, 5000\\}<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"600\">600<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"120\">120<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"3000\">3000<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"720\">720<\/span><\/span> で，間隔が <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Lambda\">\\Lambda<\/span><\/span> の元で区間の数が 4〜8．諸元連動の上限が <span class=\"im\"><span class=\"tx raw\" data-tex=\"555 \\to 600\">555 \\to 600<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"9 \\to 10\">9 \\to 10<\/span><\/span>．<\/li>\n<li>[A] 段階型：(a) <span class=\"im\"><span class=\"tx raw\" data-tex=\"F_0 = 5000\">F_0 = 5000<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"M = 4500 \\to 6500\">M = 4500 \\to 6500<\/span><\/span> にすると直ちに <span class=\"im\"><span class=\"tx raw\" data-tex=\"10000\">10000<\/span><\/span>，(b) <span class=\"im\"><span class=\"tx raw\" data-tex=\"M = 1500\">M = 1500<\/span><\/span> を <span class=\"im\"><span class=\"tx raw\" data-tex=\"2.9\\ \\text{s}\">2.9\\ \\text{s}<\/span><\/span> 与えても変わらず <span class=\"im\"><span class=\"tx raw\" data-tex=\"3.0\\ \\text{s}\">3.0\\ \\text{s}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"2000\">2000<\/span><\/span>，(c) <span class=\"im\"><span class=\"tx raw\" data-tex=\"M\">M<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"F\">F<\/span><\/span> の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 5\\%\">\\pm 5\\%<\/span><\/span> で振れる入力 <span class=\"im\"><span class=\"tx raw\" data-tex=\"60\\ \\text{s}\">60\\ \\text{s}<\/span><\/span> で変更 1 回以下，(d) <span class=\"im\"><span class=\"tx raw\" data-tex=\"F_{\\min}\">F_{\\min}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"F_{\\max}\">F_{\\max}<\/span><\/span> を超えない，(e) リセットで <span class=\"im\"><span class=\"tx raw\" data-tex=\"F_0\">F_0<\/span><\/span>，(f) <span class=\"im\"><span class=\"tx raw\" data-tex=\"M = 1200\">M = 1200<\/span><\/span> 一定を <span class=\"im\"><span class=\"tx raw\" data-tex=\"20\\ \\text{s}\">20\\ \\text{s}<\/span><\/span> 与えると変更はちょうど 1 回，(g) <span class=\"im\"><span class=\"tx raw\" data-tex=\"M = 6500\">M = 6500<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"10000\">10000<\/span><\/span> に切り替わった <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5\\ \\text{s}\">0.5\\ \\text{s}<\/span><\/span> 後に <span class=\"im\"><span class=\"tx raw\" data-tex=\"M = 12000\">M = 12000<\/span><\/span> を与えても変わらず，<span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\ \\text{s}\">1\\ \\text{s}<\/span><\/span> 後に <span class=\"im\"><span class=\"tx raw\" data-tex=\"20000\">20000<\/span><\/span>．<\/li>\n<li>[A] 帯域型：データ <span class=\"im\"><span class=\"tx raw\" data-tex=\"[795, 805]\">[795, 805]<\/span><\/span> に対し，範囲がデータを含み，刻み <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ge s_{\\min}\">\\ge s_{\\min}<\/span><\/span>，区間の数 4〜8．データが範囲を出たら直ちに計算し直す．<\/li>\n<li>[U] 線図の 7 画面（①は線形と両対数）の全グラフについて，S3 のデータで計算したレイアウト（軸名・目盛の数値・凡例の矩形）を検査する：縦軸名と横軸名があり単位 <code>[...]<\/code> を含む，目盛の数値が各軸 3 個以上，複数系列のグラフに凡例がある，全矩形が Canvas 内にあり互いに重ならない．<\/li>\n<li>[U] <span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>-<span class=\"im\"><span class=\"tx raw\" data-tex=\"V\">V<\/span><\/span> 図に既知の長方形のサイクル（<span class=\"im\"><span class=\"tx raw\" data-tex=\"V \\in [100, 500]\\ \\text{cm}^3\">V \\in [100, 500]\\ \\text{cm}^3<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p \\in [1000, 4000]\\ \\text{kPa}\">p \\in [1000, 4000]\\ \\text{kPa}<\/span><\/span>）を与えると，4 頂点の座標変換が目盛の位置と <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 1\\ \\text{px}\">\\pm 1\\ \\text{px}<\/span><\/span> で一致し，描いた 4 辺の中点に曲線の画素があり，長方形の中心には無い．<\/li>\n<li>[S] S2 の終端で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span> 軸の <span class=\"im\"><span class=\"tx raw\" data-tex=\"F\">F<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"M\">M<\/span><\/span> の <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\">1<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"3.2\">3.2<\/span><\/span> 倍にあり，直近 <span class=\"im\"><span class=\"tx raw\" data-tex=\"5\\ \\text{s}\">5\\ \\text{s}<\/span><\/span> で範囲の変更が 0 回．<\/li>\n<li>[U]（クランク角の軸）線図③とカム線図の横軸が <span class=\"im\"><span class=\"tx raw\" data-tex=\"[360, 1080]\">[360, 1080]<\/span><\/span>（目盛 <span class=\"im\"><span class=\"tx raw\" data-tex=\"360, 540, 720, 900, 1080\">360, 540, 720, 900, 1080<\/span><\/span>），線図②の 3 グラフが <span class=\"im\"><span class=\"tx raw\" data-tex=\"[180, 540]\">[180, 540]<\/span><\/span>（目盛 <span class=\"im\"><span class=\"tx raw\" data-tex=\"180, 270, 360, 450, 540\">180, 270, 360, 450, 540<\/span><\/span>），線図④⑤が <span class=\"im\"><span class=\"tx raw\" data-tex=\"[0, 720]\">[0, 720]<\/span><\/span>（目盛 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0, 180, 360, 540, 720\">0, 180, 360, 540, 720<\/span><\/span>）．各系列の横座標が単調増加で，並べ替えた系列の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta = 720^\\circ\">\\theta = 720^\\circ<\/span><\/span> の値が元の配列の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta = 0\">\\theta = 0<\/span><\/span> の値と一致する．<\/li>\n<li>[A]（強調）範囲の切替から <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5\\ \\text{s}\">0.5\\ \\text{s}<\/span><\/span> 後のレイアウトでは目盛の数値が強調の対象で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"1.5\\ \\text{s}\">1.5\\ \\text{s}<\/span><\/span> 後は対象でない．<\/li>\n<li>[U]（グラフのタップ，SPEC-15 E）線図②のグラフの横 <span class=\"im\"><span class=\"tx raw\" data-tex=\"25\\%\">25\\%<\/span><\/span> の位置をタップすると，その位置（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 1\\%\">\\pm 1\\%<\/span><\/span>）に読み取り線が出る．もう一度タップすると消える．<\/li>\n<\/ol>\n","<h3 id=\"spech121\">TEST-18：設定画面（REQ-18，SPEC-18）<\/h3>\n<ol type=\"1\">\n<li>[A] 項目定義表の全項目：既定の表示値が範囲内で刻みの格子上にある．表示値 × 単位係数が内部の既定値と一致（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{atm}}\">p_{\\text{atm}}<\/span><\/span> の既定の表示が <code>101.3<\/code>．1 ページの項目が 6 以内．<\/li>\n<li>[A] 全数値項目で，<code>[+]<\/code> 1 回と <code>[−]<\/code> 1 回で内部値が元に戻る（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>）．上限で <code>[+]<\/code>，下限で <code>[−]<\/code> を押しても範囲を出ない．×10 でも同じ．<\/li>\n<li>[U] 即時項目（点火時期）の <code>[+]<\/code> を押した同じフレームでソルバの入力が変わる．要リセット項目（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon\">\\varepsilon<\/span><\/span>）の <code>[+]<\/code> ではソルバの値は変わらず保留の表示になり，「適用」で変わってコールドリセットされ，「破棄」で保留が消える．<\/li>\n<li>[A] <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon = 1.1, 2, 10, 40, 100\">\\varepsilon = 1.1, 2, 10, 40, 100<\/span><\/span> を設定し，初期角速度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"200\\ \\text{rad/s}\">200\\ \\text{rad/s}<\/span><\/span> からスターターを掛けて最大 2 サイクル（または <span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\ \\text{s}\">2\\ \\text{s}<\/span><\/span>）積分すると，クランクが回り，<span class=\"im\"><span class=\"tx raw\" data-tex=\"V(\\pi)/V(0) = \\varepsilon\">V(\\pi)/V(0) = \\varepsilon<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>）で状態量が有限．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lambda &gt; 0.5\">\\lambda &gt; 0.5<\/span><\/span> の組合せでは「適用」が無効．<\/li>\n<li>[U] 選択項目が名前付きのボタンで表示され，画面に <code>0:<\/code>・<code>1:<\/code> のような表記が無い．<\/li>\n<li>[S] S2 の定常から点火時期を <span class=\"im\"><span class=\"tx raw\" data-tex=\"+10^\\circ\">+10^\\circ<\/span><\/span> 変える：基準サイクルが保存され，その内容は <span class=\"im\"><span class=\"tx raw\" data-tex=\"5\\ \\text{s}\">5\\ \\text{s}<\/span><\/span> 積分しても変わらず，現在のサイクルの <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\max}\">p_{\\max}<\/span><\/span> が基準と <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\%\">1\\%<\/span><\/span> 以上違い，パネルの <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta\">\\Delta<\/span><\/span> が（現在値 − 基準値）と一致する．<span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\ \\text{s}\">1\\ \\text{s}<\/span><\/span> 間隔で 3 回続けて変えても基準は最初の 1 回分のままで，<span class=\"im\"><span class=\"tx raw\" data-tex=\"3\\ \\text{s}\">3\\ \\text{s}<\/span><\/span> 以上あけた変更では更新される．<\/li>\n<li>[U] 「機関」以外の全ページでパネルが表示され，高さ <span class=\"im\"><span class=\"tx raw\" data-tex=\"120\\ \\text{px}\">120\\ \\text{px}<\/span><\/span> 以上で，軸名と目盛の数値を持つ．<code>[元に戻す]<\/code> が直前の 1 変更を取り消す．<\/li>\n<li>[U] 目標回転数の <code>[+]<\/code> は常に有効で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"20000\\ \\text{rpm}\">20000\\ \\text{rpm}<\/span><\/span> まで上げられ，表示値と内部値が一致する．<\/li>\n<li>[U]（カム線図）「VVT・カム」「弁タイミング」ではカム線図が表示され，吸気位相を <span class=\"im\"><span class=\"tx raw\" data-tex=\"+10^\\circ\">+10^\\circ<\/span><\/span> 変えるとリフト曲線の最大点の横位置が <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^\\circ\">10^\\circ<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 0.5^\\circ\">\\pm 0.5^\\circ<\/span><\/span>）動き，基準（灰色）は元の位置に残る．オーバーラップ角の表示が定義と一致する．<\/li>\n<li>[U] 自動最適化 ON で，点火時期の行が「（自動）」と自動の値（小数 1 桁）を表示し，<code>[−]<\/code> <code>[+]<\/code> が無効．<\/li>\n<li>[U] 完爆後に自動最適化を OFF にすると，自動の値 <span class=\"im\"><span class=\"tx raw\" data-tex=\"27.34^\\circ\">27.34^\\circ<\/span><\/span> が手動の値 <span class=\"im\"><span class=\"tx raw\" data-tex=\"27^\\circ\">27^\\circ<\/span><\/span> に引き継がれる．<\/li>\n<li>[U] 点火時期に上下限が無い：×10 の刻みで <span class=\"im\"><span class=\"tx raw\" data-tex=\"-120^\\circ\">-120^\\circ<\/span><\/span>，続けて <span class=\"im\"><span class=\"tx raw\" data-tex=\"+300^\\circ\">+300^\\circ<\/span><\/span> 押しても <code>[−]<\/code> <code>[+]<\/code> が有効で，値が <span class=\"im\"><span class=\"tx raw\" data-tex=\"-93^\\circ\">-93^\\circ<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"207^\\circ\">207^\\circ<\/span><\/span> になる．<\/li>\n<li>[U]（既定値）ページ「吸気」の全数値項目を 1 刻み変えてから <code>[既定値]<\/code> を押すと，全項目が既定値に戻る．「機関」で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon\">\\varepsilon<\/span><\/span> を変えて保留にしてから <code>[既定値]<\/code> を押すと，保留値が既定値になり，ソルバの値は変わらない．<\/li>\n<li>[U]（ページ）どのページも項目が 1〜6 個．ページ名のタップで全ページの一覧が開き，選んだページへ移る．「機関」のページに導出値 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lambda\">\\lambda<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"V_d\">V_d<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"V_c\">V_c<\/span><\/span> が設定値から計算した値で表示される．<\/li>\n<li>[U]（基準の更新）サイクルが無いときパネルに「運転タブで START してください」と表示する．サイクルがあるとき，<code>[基準更新]<\/code> と線図 ① の <code>[基準を現在に]<\/code> で，現在のサイクルが基準になり，パネルに基準比が表示される．<\/li>\n<li>[U]（制御で使わない項目）ページ「運転」で，スロットル制御のとき，固定開度の行が「（自動）」と現在の開度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha\">\\alpha<\/span><\/span>（小数 1 桁）を表示し，<code>[−]<\/code> <code>[+]<\/code> が無効で，押しても <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha_{\\text{manual}}\">\\alpha_{\\text{manual}}<\/span><\/span> が変わらない．基準充水率の行が「（不使用）」で <code>[−]<\/code> <code>[+]<\/code> が無効．固定充水率の行は有効．運転中の機関の開度を変えると，毎フレームの表示の更新（テストの実行中は画面の描画が止まるため，テストはその更新の関数を直接呼ぶ）で表示が追従する．設定で動力計制御に切り替えると，同じフレームで，固定開度と基準充水率の行が有効になり，固定充水率の行が「（自動）」と現在の <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{cmd}}\">f_{\\text{cmd}}<\/span><\/span>（小数 2 桁）を表示して無効になる．<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{cmd}}\">f_{\\text{cmd}}<\/span><\/span> を変えると，同じ更新で表示が追従する．動力計制御で固定開度が格子に無い値（<span class=\"im\"><span class=\"tx raw\" data-tex=\"12.34^\\circ\">12.34^\\circ<\/span><\/span>，切替で上書きされた値に相当）のとき，表示が「12.3」で，<code>[+]<\/code> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"12.4^\\circ\">12.4^\\circ<\/span><\/span> になる．どちらの制御でも，行の文字が欠けない（項目名と値の幅が行に収まる）．<\/li>\n<\/ol>\n","<h3 id=\"spech122\">TEST-19：機関断面図（REQ-19，SPEC-19）<\/h3>\n<ol type=\"1\">\n<li>[A] 場面記述：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta \\in \\{0, 90, \\dots, 630\\}^\\circ\">\\theta \\in \\{0, 90, \\dots, 630\\}^\\circ<\/span><\/span>，3 組の諸元（既定，<span class=\"im\"><span class=\"tx raw\" data-tex=\"B = 60/S = 120/l = 200\">B = 60/S = 120/l = 200<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"B = 120/S = 60/l = 100\">B = 120/S = 60/l = 100<\/span><\/span>）で，頂面の位置 <span class=\"im\"><span class=\"tx raw\" data-tex=\"= s\\,(h_c + x)\">= s\\,(h_c + x)<\/span><\/span>，ピン間の距離 <span class=\"im\"><span class=\"tx raw\" data-tex=\"= s\\,l\">= s\\,l<\/span><\/span>，クランクピンの半径 <span class=\"im\"><span class=\"tx raw\" data-tex=\"= s\\,r\">= s\\,r<\/span><\/span>，弁の傘の変位 <span class=\"im\"><span class=\"
