りとりは無い（断熱）とする．周期定常では，吹き返した余剰エンタルピーは，混ざる容積の大きさによらず全量が筒内へ戻る．<\/li>\n<\/ul><\/li>\n<\/ol>\n<h4 id=\"spech20\">仮定と限界<\/h4>\n<ul>\n<li><p>吸気側の容積は圧力の式では等温で，温度上昇による密度の低下（<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_k\">m_k<\/span><\/span> の減少）は扱わない．余剰エンタルピーは吸気弁の流れの上流温度と筒内へのエンタルピーにだけ効く．<\/p><\/li>\n<li><p>断熱なので，吹き返しによる吸気の加熱は<strong>上限<\/strong>の見積もりである．実機ではポート壁への放熱で一部が失われ，逆に高温の壁が吸気を温める効果もあるが，どちらも扱わない．<\/p><\/li>\n<li><p>既定の IVC（<span class=\"im\"><span class=\"tx raw\" data-tex=\"264^\\circ\">264^\\circ<\/span><\/span>）は遅く，低回転では吸った新気の押し戻しが多い．アイドルでは吸気弁の逆流が順流の約 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1/4\">1/4<\/span><\/span> ある（実測 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.24\">0.24<\/span><\/span>）．<\/p><\/li>\n<li><p><strong>出典<\/strong>：<a target=\"_blank\" rel=\"noopener\" href=\"https://doi.org/10.1007/978-3-642-10775-7\">L. Guzzella and C. H. Onder, <em>Introduction to Modeling and Control of Internal Combustion Engine Systems<\/em>, 2nd ed., Springer (2010), Ch. 2<\/a>；<a target=\"_blank\" rel=\"noopener\" href=\"https://doi.org/10.4271/900616\">E. Hendricks and S. C. Sorenson, SAE Technical Paper 900616 (1990)<\/a><\/p><\/li>\n<\/ul>\n<hr />\n","<h3 id=\"spech21\">SPEC-06：筒内の組成（未燃ガスと既燃ガス）（REQ-06）<\/h3>\n<h4 id=\"spech22\">定義と式<\/h4>\n<p><span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\frac{dm}{dt} = \\dot m_{\\text{in}} - \\dot m_{\\text{ex}}, \\qquad \\frac{dm_u}{dt} = \\dot m_{u,\\text{in}} - \\dot m_{u,\\text{ex}} - r\">\\frac{dm}{dt} = \\dot m_{\\text{in}} - \\dot m_{\\text{ex}}, \\qquad \\frac{dm_u}{dt} = \\dot m_{u,\\text{in}} - \\dot m_{u,\\text{ex}} - r<\/span><\/span><\/p>\n<ul>\n<li><p>吸気弁：順流は上流の容積の組成（既燃分率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_{b,\\text{src}}\">Y_{b,\\text{src}}<\/span><\/span>，SPEC-05），逆流は筒内の組成で出る． <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\dot m_{u,\\text{in}} = \\begin{cases} (1 - Y_{b,\\text{src}})\\,\\dot m_{\\text{in}} &amp; (\\dot m_{\\text{in}} \\ge 0) \\\\ Y_u\\,\\dot m_{\\text{in}} &amp; (\\dot m_{\\text{in}} &lt; 0) \\end{cases}\">\\dot m_{u,\\text{in}} = \\begin{cases} (1 - Y_{b,\\text{src}})\\,\\dot m_{\\text{in}} &amp; (\\dot m_{\\text{in}} \\ge 0) \\\\ Y_u\\,\\dot m_{\\text{in}} &amp; (\\dot m_{\\text{in}} &lt; 0) \\end{cases}<\/span><\/span><\/p><\/li>\n<li><p>排気弁：流出は筒内の組成，逆流は既燃ガスだけとする（排気側へ吹き抜けた新気は既燃ガスとして扱う）． <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\dot m_{u,\\text{ex}} = \\begin{cases} Y_u\\,\\dot m_{\\text{ex}} &amp; (\\dot m_{\\text{ex}} \\ge 0) \\\\ 0 &amp; (\\dot m_{\\text{ex}} &lt; 0) \\end{cases}\">\\dot m_{u,\\text{ex}} = \\begin{cases} Y_u\\,\\dot m_{\\text{ex}} &amp; (\\dot m_{\\text{ex}} \\ge 0) \\\\ 0 &amp; (\\dot m_{\\text{ex}} &lt; 0) \\end{cases}<\/span><\/span><\/p><\/li>\n<li><p>燃焼：吸気弁が閉じた時点（IVC）の未燃ガスの質量を <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{u,\\text{trapped}}\">m_{u,\\text{trapped}}<\/span><\/span> とし，Wiebe 関数の燃焼割合 <span class=\"im\"><span class=\"tx raw\" data-tex=\"x_b\">x_b<\/span><\/span>（SPEC-07）に従って既燃ガスに変わる． <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"r = m_{u,\\text{trapped}}\\,\\frac{dx_b}{d\\theta}\\,\\omega\">r = m_{u,\\text{trapped}}\\,\\frac{dx_b}{d\\theta}\\,\\omega<\/span><\/span><\/p><\/li>\n<li><p><strong>出典<\/strong>：<a target=\"_blank\" rel=\"noopener\" href=\"https://www.wiley.com/en-us/Internal+Combustion+Engines%3A+Applied+Thermosciences%2C+3rd+Edition-p-9781118533314\">C. R. Ferguson and A. T. Kirkpatrick, <em>Internal Combustion Engines: Applied Thermosciences<\/em>, 3rd ed., Wiley (2015)<\/a><\/p><\/li>\n<\/ul>\n<hr />\n","<h3 id=\"spech23\">SPEC-07：燃焼（乱流火炎伝播に連動する単一 Wiebe モデル）（REQ-07）<\/h3>\n<h4 id=\"spech24\">定義と式<\/h4>\n<ol type=\"1\">\n<li><strong>層流燃焼速度<\/strong>（Metghalchi と Keck の相関．定数は Turns の教科書の gasoline の組）：基準 <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{ref}} = 298\\ \\text{K}\">T_{\\text{ref}} = 298\\ \\text{K}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{ref}} = 101.325\\ \\text{kPa}\">p_{\\text{ref}} = 101.325\\ \\text{kPa}<\/span><\/span> で <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"S_{L,0}(\\phi) = \\max\\left(0.05,\\ B_m + B_2(\\phi - \\phi_m)^2\\right), \\qquad B_m = 0.2758\\ \\text{m/s},\\ B_2 = -0.7834\\ \\text{m/s},\\ \\phi_m = 1.13\">S_{L,0}(\\phi) = \\max\\left(0.05,\\ B_m + B_2(\\phi - \\phi_m)^2\\right), \\qquad B_m = 0.2758\\ \\text{m/s},\\ B_2 = -0.7834\\ \\text{m/s},\\ \\phi_m = 1.13<\/span><\/span> 点火時の筒内の状態 <span class=\"im\"><span class=\"tx raw\" data-tex=\"(T_s, p_s)\">(T_s, p_s)<\/span><\/span> と残留ガス率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r\">x_r<\/span><\/span>（質量分率）に対し <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"S_L = S_{L,0}(\\phi)\\left(\\frac{T_s}{T_{\\text{ref}}}\\right)^{2.18 - 0.8(\\phi - 1)}\\left(\\frac{p_s}{p_{\\text{ref}}}\\right)^{-0.16 + 0.22(\\phi - 1)}\\max\\left(0.15,\\ 1 - 2.1\\,x_r\\right)\">S_L = S_{L,0}(\\phi)\\left(\\frac{T_s}{T_{\\text{ref}}}\\right)^{2.18 - 0.8(\\phi - 1)}\\left(\\frac{p_s}{p_{\\text{ref}}}\\right)^{-0.16 + 0.22(\\phi - 1)}\\max\\left(0.15,\\ 1 - 2.1\\,x_r\\right)<\/span><\/span> <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_s\">T_s<\/span><\/span> には筒内の平均温度を使う（単一ゾーン）．<\/li>\n<li><strong>着火遅れと燃焼期間<\/strong>：平均ピストン速度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"c_m = \\frac{S\\omega}{\\pi}\">c_m = \\frac{S\\omega}{\\pi}<\/span><\/span>，乱れの強さ <span class=\"im\"><span class=\"tx raw\" data-tex=\"u&#x27; = 0.5\\,c_m\">u&#x27; = 0.5\\,c_m<\/span><\/span>，乱流燃焼速度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"S_T = S_L + C_{\\text{turb}}\\,u&#x27;\">S_T = S_L + C_{\\text{turb}}\\,u&#x27;<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"C_{\\text{turb}} = 6\">C_{\\text{turb}} = 6<\/span><\/span>）とする．点火進角を <span class=\"im\"><span class=\"tx raw\" data-tex=\"s\">s<\/span><\/span> [°BTDC] とし，上死点後の点火（<span class=\"im\"><span class=\"tx raw\" data-tex=\"s &lt; 0\">s &lt; 0<\/span><\/span>）では膨張による乱れの減衰と温度低下を係数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{ret}} = 1 + 0.025\\max(0, -s)\">f_{\\text{ret}} = 1 + 0.025\\max(0, -s)<\/span><\/span> で表す． <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\Delta\\theta_d = c_d\\,\\frac{\\ell_k\\,\\omega}{S_L + C_k u&#x27;}, \\qquad \\Delta\\theta_b = \\frac{f_{\\text{ret}}}{c_b}\\,\\frac{\\ell_c\\,\\omega}{S_T}\">\\Delta\\theta_d = c_d\\,\\frac{\\ell_k\\,\\omega}{S_L + C_k u&#x27;}, \\qquad \\Delta\\theta_b = \\frac{f_{\\text{ret}}}{c_b}\\,\\frac{\\ell_c\\,\\omega}{S_T}<\/span><\/span> <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ell_k = 0.025B\">\\ell_k = 0.025B<\/span><\/span>（火炎核の形成距離），<span class=\"im\"><span class=\"tx raw\" data-tex=\"C_k = 0.4\">C_k = 0.4<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ell_c = 0.65B\">\\ell_c = 0.65B<\/span><\/span>（燃焼室の代表距離）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"c_d\">c_d<\/span><\/span>（着火遅れ係数）と <span class=\"im\"><span class=\"tx raw\" data-tex=\"c_b\">c_b<\/span><\/span>（燃焼速度係数）は設定「燃焼速度」の調整係数（<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.1\">0.1<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"10\">10<\/span><\/span>，既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\">1<\/span><\/span>）．<\/li>\n<li><strong>Wiebe 関数<\/strong>：燃焼の開始角 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta_0 = 2\\pi - s + \\Delta\\theta_d\">\\theta_0 = 2\\pi - s + \\Delta\\theta_d<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\zeta = \\frac{\\theta - \\theta_0}{\\Delta\\theta_b}\">\\zeta = \\frac{\\theta - \\theta_0}{\\Delta\\theta_b}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"a = 5\">a = 5<\/span><\/span>，形状係数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_w\">m_w<\/span><\/span>（設定，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"6\">6<\/span><\/span>，既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"2\">2<\/span><\/span>．点火時の値をそのサイクルに固定）に対し <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"x_b = 1 - \\exp\\left(-a\\,\\zeta^{m_w + 1}\\right), \\qquad \\frac{dx_b}{d\\theta} = \\frac{a\\,(m_w + 1)}{\\Delta\\theta_b}\\,\\zeta^{m_w}\\exp\\left(-a\\,\\zeta^{m_w + 1}\\right) \\qquad (0 &lt; \\zeta \\le 1)\">x_b = 1 - \\exp\\left(-a\\,\\zeta^{m_w + 1}\\right), \\qquad \\frac{dx_b}{d\\theta} = \\frac{a\\,(m_w + 1)}{\\Delta\\theta_b}\\,\\zeta^{m_w}\\exp\\left(-a\\,\\zeta^{m_w + 1}\\right) \\qquad (0 &lt; \\zeta \\le 1)<\/span><\/span> <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\zeta \\le 0\">\\zeta \\le 0<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\zeta &gt; 1\">\\zeta &gt; 1<\/span><\/span> では <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{dx_b}{d\\theta} = 0\">\\frac{dx_b}{d\\theta} = 0<\/span><\/span>．燃焼割合は <span class=\"im\"><span class=\"tx raw\" data-tex=\"1 - e^{-a} = 99.3\\%\">1 - e^{-a} = 99.3\\%<\/span><\/span> で打ち切る．<\/li>\n<li><strong>発熱量<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{u,\\text{trapped}}\">m_{u,\\text{trapped}}<\/span><\/span> のうち空気は <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{\\text{air}} = \\frac{m_{u,\\text{trapped}}}{1 + \\phi/\\text{AF}_{st}}\">m_{\\text{air}} = \\frac{m_{u,\\text{trapped}}}{1 + \\phi/\\text{AF}_{st}}<\/span><\/span>，燃料は <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_f = \\frac{\\phi}{\\text{AF}_{st}}m_{\\text{air}}\">m_f = \\frac{\\phi}{\\text{AF}_{st}}m_{\\text{air}}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{AF}_{st} = 14.7\">\\text{AF}_{st} = 14.7<\/span><\/span>）．低位発熱量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"H_u = 44.0\\ \\text{MJ/kg}\">H_u = 44.0\\ \\text{MJ/kg}<\/span><\/span>，燃焼効率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_c = 0.97\">\\eta_c = 0.97<\/span><\/span> として <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"Q_{\\text{in}} = m_f\\,H_u\\,\\eta_c\\,\\epsilon(\\phi), \\qquad \\dot Q_{\\text{comb}} = Q_{\\text{in}}\\,\\frac{dx_b}{d\\theta}\\,\\omega\">Q_{\\text{in}} = m_f\\,H_u\\,\\eta_c\\,\\epsilon(\\phi), \\qquad \\dot Q_{\\text{comb}} = Q_{\\text{in}}\\,\\frac{dx_b}{d\\theta}\\,\\omega<\/span><\/span> <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_c\">\\eta_c<\/span><\/span> と Wiebe の打ち切りが重なるので，供給した燃料の発熱量のうち実際に発熱するのは，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi \\le 1\">\\phi \\le 1<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.97 \\times 0.993 = 96.3\\%\">0.97 \\times 0.993 = 96.3\\%<\/span><\/span> である．<\/li>\n<li><strong>リッチ側の不完全燃焼<\/strong> <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\epsilon(\\phi)\">\\epsilon(\\phi)<\/span><\/span>：燃料を <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{CH}_y\">\\text{CH}_y<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"y = 1.87\">y = 1.87<\/span><\/span>）とし，酸素が足りないときの生成物 <span class=\"im\"><span class=\"tx raw\" data-tex=\"a&#x27;\\,\\text{CO}_2 + b&#x27;\\,\\text{CO} + c&#x27;\\,\\text{H}_2\\text{O} + d&#x27;\\,\\text{H}_2\">a&#x27;\\,\\text{CO}_2 + b&#x27;\\,\\text{CO} + c&#x27;\\,\\text{H}_2\\text{O} + d&#x27;\\,\\text{H}_2<\/span><\/span> を，元素の保存と水性ガスシフト平衡で決める． <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"a&#x27; + b&#x27; = 1, \\quad 2c&#x27; + 2d&#x27; = y, \\quad 2a&#x27; + b&#x27; + c&#x27; = \\frac{2(1 + y/4)}{\\phi}, \\quad \\frac{b&#x27;c&#x27;}{a&#x27;d&#x27;} = K_w = 3.5\">a&#x27; + b&#x27; = 1, \\quad 2c&#x27; + 2d&#x27; = y, \\quad 2a&#x27; + b&#x27; + c&#x27; = \\frac{2(1 + y/4)}{\\phi}, \\quad \\frac{b&#x27;c&#x27;}{a&#x27;d&#x27;} = K_w = 3.5<\/span><\/span> はじめの 3 式から <span class=\"im\"><span class=\"tx raw\" data-tex=\"b&#x27; + d&#x27; = S_r \\equiv \\left(2 + \\frac{y}{2}\\right)\\left(1 - \\frac{1}{\\phi}\\right)\">b&#x27; + d&#x27; = S_r \\equiv \\left(2 + \\frac{y}{2}\\right)\\left(1 - \\frac{1}{\\phi}\\right)<\/span><\/span>．これと第 4 式から <span class=\"im\"><span class=\"tx raw\" data-tex=\"b&#x27;\">b&#x27;<\/span><\/span> の 2 次方程式 <span class=\"im\"><span class=\"tx raw\" data-tex=\"(K_w - 1)b&#x27;^2 - \\left[\\frac{y}{2} - S_r + K_w(1 + S_r)\\right]b&#x27; + K_w S_r = 0\">(K_w - 1)b&#x27;^2 - \\left[\\frac{y}{2} - S_r + K_w(1 + S_r)\\right]b&#x27; + K_w S_r = 0<\/span><\/span> を得て，<span class=\"im\"><span class=\"tx raw\" data-tex=\"[0, \\min(1, S_r)]\">[0, \\min(1, S_r)]<\/span><\/span> の根を取る．燃え残る CO と H₂ が持ち去る発熱量を差し引く： <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\epsilon(\\phi) = 1 - \\frac{b&#x27;\\,\\Delta h_{\\text{CO}} + d&#x27;\\,\\Delta h_{\\text{H}_2}}{M_f\\,H_u} \\quad (\\phi &gt; 1), \\qquad \\epsilon = 1 \\quad (\\phi \\le 1)\">\\epsilon(\\phi) = 1 - \\frac{b&#x27;\\,\\Delta h_{\\text{CO}} + d&#x27;\\,\\Delta h_{\\text{H}_2}}{M_f\\,H_u} \\quad (\\phi &gt; 1), \\qquad \\epsilon = 1 \\quad (\\phi \\le 1)<\/span><\/span> <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta h_{\\text{CO}} = 283.0\\ \\text{kJ/mol}\">\\Delta h_{\\text{CO}} = 283.0\\ \\text{kJ/mol}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta h_{\\text{H}_2} = 241.8\\ \\text{kJ/mol}\">\\Delta h_{\\text{H}_2} = 241.8\\ \\text{kJ/mol}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M_f = 13.896\\ \\text{g/mol}\">M_f = 13.896\\ \\text{g/mol}<\/span><\/span>．空気量あたりの発熱 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi\\,\\epsilon(\\phi)\">\\phi\\,\\epsilon(\\phi)<\/span><\/span> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1\">\\phi = 1<\/span><\/span> で最大．<\/li>\n<li><strong>サイクル変動<\/strong>（設定「燃焼」の <code>[サイクル変動 OFF／ON]<\/code>，既定 ON）：点火のたびに，平均 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>・分散 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\">1<\/span><\/span> の一様乱数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"z_1, z_2 \\in [-\\sqrt 3, \\sqrt 3]\">z_1, z_2 \\in [-\\sqrt 3, \\sqrt 3]<\/span><\/span> を引き， <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\theta_0 \\leftarrow \\theta_0 + \\sigma_\\theta z_1, \\qquad \\Delta\\theta_b \\leftarrow \\Delta\\theta_b\\max(0.5,\\ 1 + \\sigma_b z_2), \\qquad \\sigma_\\theta = 3^\\circ,\\ \\sigma_b = 0.12\">\\theta_0 \\leftarrow \\theta_0 + \\sigma_\\theta z_1, \\qquad \\Delta\\theta_b \\leftarrow \\Delta\\theta_b\\max(0.5,\\ 1 + \\sigma_b z_2), \\qquad \\sigma_\\theta = 3^\\circ,\\ \\sigma_b = 0.12<\/span><\/span> 乱数は <code>EngineCore<\/code> ごとに種を固定した擬似乱数（mulberry32）で，状態の複製で乱数の状態も複製される（結果は決定的）．<\/li>\n<\/ol>\n<h4 id=\"spech25\">仮定と限界<\/h4>\n<ul>\n<li><p>着火遅れの定数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ell_k\">\\ell_k<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"C_k\">C_k<\/span><\/span> は，全開の MBT 点火時期が回転とともに <span class=\"im\"><span class=\"tx raw\" data-tex=\"20^\\circ\">20^\\circ<\/span><\/span> 台で進角するよう校正した値である（文献値ではない）．<\/p><\/li>\n<li><p>希釈の項 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1 - 2.1\\,x_r\">1 - 2.1\\,x_r<\/span><\/span> の <span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r\">x_r<\/span><\/span> は，原式の希釈ガスの質量分率に対応させている．<\/p><\/li>\n<li><p>生成物のモル数の増加（実機で出力最大が <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi \\approx 1.1\">\\phi \\approx 1.1<\/span><\/span> になる要因）は扱わないので，出力最大は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1\">\\phi = 1<\/span><\/span> にある．<\/p><\/li>\n<li><p><span class=\"im\"><span class=\"tx raw\" data-tex=\"S_L\">S_L<\/span><\/span> の圧力指数が負なので，部分負荷で MBT が全開より大きく進む実機の傾向は十分には出ない．<\/p><\/li>\n<li><p><strong>出典<\/strong>：<a target=\"_blank\" rel=\"noopener\" href=\"https://doi.org/10.1016/0010-2180(82)90127-4\">M. Metghalchi and J. C. Keck, <em>Combustion and Flame<\/em> 48, 191–210 (1982)<\/a>；定数の組と希釈の項は S. R. Turns, <em>An Introduction to Combustion<\/em> の式 8.33（<a target=\"_blank\" rel=\"noopener\" href=\"https://ignite.byu.edu/cbe522/lectures/SL_correlation\">BYU の講義ノートで確認<\/a>）；I. I. Wiebe, <em>Brennverlauf und Kreisprozess von Verbrennungsmotoren<\/em> (1970)；リッチ側は Heywood (1988) Sec. 4.9．<\/p><\/li>\n<\/ul>\n<hr />\n","<h3 id=\"spech26\">SPEC-08：壁面熱伝達と壁温（REQ-08）<\/h3>\n<h4 id=\"spech27\">定義と式<\/h4>\n<p>IVC の時点の筒内の状態を <span class=\"im\"><span class=\"tx raw\" data-tex=\"(p_r, V_r, T_r)\">(p_r, V_r, T_r)<\/span><\/span> とし，燃焼が無いとしたときの圧力を<strong>ポリトロープ指数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1.33\">1.33<\/span><\/span><\/strong> の圧縮膨張 <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{mot}}(\\theta) = p_r\\left(\\frac{V_r}{V(\\theta)}\\right)^{1.33}\">p_{\\text{mot}}(\\theta) = p_r\\left(\\frac{V_r}{V(\\theta)}\\right)^{1.33}<\/span><\/span> で見積もる．代表ガス速度は <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"w = C_1 c_m + C_2\\,\\frac{V_d T_r}{p_r V_r}\\max\\left(0,\\ p - p_{\\text{mot}}\\right)\">w = C_1 c_m + C_2\\,\\frac{V_d T_r}{p_r V_r}\\max\\left(0,\\ p - p_{\\text{mot}}\\right)<\/span><\/span><\/p>\n<ul>\n<li>圧縮・燃焼・膨張（IVC〜EVO）：<span class=\"im\"><span class=\"tx raw\" data-tex=\"C_1 = 2.28\">C_1 = 2.28<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"C_2 = 3.24 \\times 10^{-3}\\ \\text{m/(s·K)}\">C_2 = 3.24 \\times 10^{-3}\\ \\text{m/(s·K)}<\/span><\/span><\/li>\n<li>ガス交換（EVO〜IVC）：<span class=\"im\"><span class=\"tx raw\" data-tex=\"C_1 = 6.18\">C_1 = 6.18<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"C_2 = 0\">C_2 = 0<\/span><\/span><\/li>\n<\/ul>\n<p>熱伝達率（圧力を kPa で入れる形）と熱流量は，係数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"C_w\">C_w<\/span><\/span>（設定「燃焼」の Woschni 係数，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"2\">2<\/span><\/span>，既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\">1<\/span><\/span>）を掛けて <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"h_c = C_w \\cdot 3.26\\,B^{-0.2}\\left(\\frac{p}{1000}\\right)^{0.8}T^{-0.55}\\max(w, 0.5)^{0.8}, \\qquad \\dot Q_{\\text{wall}} = h_c\\,A_w(\\theta)\\,(T - T_w)\">h_c = C_w \\cdot 3.26\\,B^{-0.2}\\left(\\frac{p}{1000}\\right)^{0.8}T^{-0.55}\\max(w, 0.5)^{0.8}, \\qquad \\dot Q_{\\text{wall}} = h_c\\,A_w(\\theta)\\,(T - T_w)<\/span><\/span> 壁は 1 つの熱容量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"C_{w,\\text{th}} = 1500\\ \\text{J/K}\">C_{w,\\text{th}} = 1500\\ \\text{J/K}<\/span><\/span> とし，冷却水（<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{cool}} = 360\\ \\text{K}\">T_{\\text{cool}} = 360\\ \\text{K}<\/span><\/span> 一定）へ熱コンダクタンス <span class=\"im\"><span class=\"tx raw\" data-tex=\"G_{\\text{cool}} = 15\\ \\text{W/K}\">G_{\\text{cool}} = 15\\ \\text{W/K}<\/span><\/span> で放熱する． <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"C_{w,\\text{th}}\\frac{dT_w}{dt} = \\dot Q_{\\text{wall}} - G_{\\text{cool}}\\,(T_w - T_{\\text{cool}})\">C_{w,\\text{th}}\\frac{dT_w}{dt} = \\dot Q_{\\text{wall}} - G_{\\text{cool}}\\,(T_w - T_{\\text{cool}})<\/span><\/span><\/p>\n<h4 id=\"spech28\">仮定と限界<\/h4>\n<ul>\n<li><p>冷却水温は一定なので，コールドリセット後（壁温 <span class=\"im\"><span class=\"tx raw\" data-tex=\"298.15\\ \\text{K}\">298.15\\ \\text{K}<\/span><\/span>）は，燃焼が無くても壁が冷却水で温められる（時定数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"C_{w,\\text{th}}/G_{\\text{cool}} = 100\\ \\text{s}\">C_{w,\\text{th}}/G_{\\text{cool}} = 100\\ \\text{s}<\/span><\/span>）．この文書の「冷間」は壁温の初期値だけを指す．<\/p><\/li>\n<li><p>吸気ポートと排気ポートの壁への熱伝達は扱わない．<\/p><\/li>\n<li><p><strong>出典<\/strong>：<a target=\"_blank\" rel=\"noopener\" href=\"https://doi.org/10.4271/670931\">G. Woschni, SAE Technical Paper 670931 (1967)<\/a><\/p><\/li>\n<\/ul>\n<hr />\n","<h3 id=\"spech29\">SPEC-09：筒内圧の式（開いた系の熱力学第一法則）（REQ-09）<\/h3>\n<h4 id=\"spech30\">導出<\/h4>\n<p>顕熱の内部エネルギー（SPEC-02）を使う．未燃ガスは，燃えて既燃ガスになるときに単位質量あたり <span class=\"im\"><span class=\"tx raw\" data-tex=\"q_u = \\frac{Q_{\\text{in}}}{m_{u,\\text{trapped}}}\">q_u = \\frac{Q_{\\text{in}}}{m_{u,\\text{trapped}}}<\/span><\/span> の熱を出すとする．筒内の全エネルギーは <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"E = m_u\\left(e_u(T) + q_u\\right) + m_b\\,e_b(T)\">E = m_u\\left(e_u(T) + q_u\\right) + m_b\\,e_b(T)<\/span><\/span> 流れ <span class=\"im\"><span class=\"tx raw\" data-tex=\"j\">j<\/span><\/span>（質量流量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_j\">\\dot m_j<\/span><\/span>，流入が正，未燃分率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_j\">Y_j<\/span><\/span>，顕熱エンタルピー <span class=\"im\"><span class=\"tx raw\" data-tex=\"h_j\">h_j<\/span><\/span>）が運ぶエネルギーは <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_j\\left(h_j + Y_j q_u\\right)\">\\dot m_j\\left(h_j + Y_j q_u\\right)<\/span><\/span> なので，第一法則は <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\frac{dE}{dt} = -p\\frac{dV}{dt} - \\dot Q_{\\text{wall}} + \\sum_j\\dot m_j\\left(h_j + Y_j q_u\\right)\">\\frac{dE}{dt} = -p\\frac{dV}{dt} - \\dot Q_{\\text{wall}} + \\sum_j\\dot m_j\\left(h_j + Y_j q_u\\right)<\/span><\/span> 左辺は，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{dm_u}{dt} = \\sum_j\\dot m_j Y_j - r\">\\frac{dm_u}{dt} = \\sum_j\\dot m_j Y_j - r<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{dm_b}{dt} = \\sum_j\\dot m_j(1 - Y_j) + r\">\\frac{dm_b}{dt} = \\sum_j\\dot m_j(1 - Y_j) + r<\/span><\/span>（SPEC-06）と <span class=\"im\"><span class=\"tx raw\" data-tex=\"m c_v = m_u c_{v,u} + m_b c_{v,b}\">m c_v = m_u c_{v,u} + m_b c_{v,b}<\/span><\/span> を使って <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\frac{dE}{dt} = \\sum_j\\dot m_j\\left[Y_j\\left(e_u + q_u\\right) + (1 - Y_j)e_b\\right] - r\\left(q_u + e_u - e_b\\right) + m c_v\\frac{dT}{dt}\">\\frac{dE}{dt} = \\sum_j\\dot m_j\\left[Y_j\\left(e_u + q_u\\right) + (1 - Y_j)e_b\\right] - r\\left(q_u + e_u - e_b\\right) + m c_v\\frac{dT}{dt}<\/span><\/span> と書ける（<span class=\"im\"><span class=\"tx raw\" data-tex=\"e_u\">e_u<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"e_b\">e_b<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"c_v\">c_v<\/span><\/span> は筒内の温度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"T\">T<\/span><\/span> での値）．両者から <span class=\"im\"><span class=\"tx raw\" data-tex=\"q_u\">q_u<\/span><\/span> を含む流れの項が消えて <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"m c_v\\frac{dT}{dt} = -p\\frac{dV}{dt} - \\dot Q_{\\text{wall}} + r\\,q_u + r\\left(e_u - e_b\\right) + \\sum_j\\dot m_j\\left[h_j - Y_j e_u - (1 - Y_j)e_b\\right]\">m c_v\\frac{dT}{dt} = -p\\frac{dV}{dt} - \\dot Q_{\\text{wall}} + r\\,q_u + r\\left(e_u - e_b\\right) + \\sum_j\\dot m_j\\left[h_j - Y_j e_u - (1 - Y_j)e_b\\right]<\/span><\/span> <span class=\"im\"><span class=\"tx raw\" data-tex=\"r\\,q_u = \\dot Q_{\\text{comb}}\">r\\,q_u = \\dot Q_{\\text{comb}}<\/span><\/span> である．<span class=\"im\"><span class=\"tx raw\" data-tex=\"r(e_u - e_b)\">r(e_u - e_b)<\/span><\/span> は，未燃ガスと既燃ガスが同じ温度で持つ顕熱の差で，組成が変わることによる項である．<\/p>\n<p>状態方程式 <span class=\"im\"><span class=\"tx raw\" data-tex=\"pV = mRT\">pV = mRT<\/span><\/span> を時間で微分すると <span class=\"im\"><span class=\"tx raw\" data-tex=\"V\\frac{dp}{dt} = RT\\frac{dm}{dt} + mR\\frac{dT}{dt} - p\\frac{dV}{dt}\">V\\frac{dp}{dt} = RT\\frac{dm}{dt} + mR\\frac{dT}{dt} - p\\frac{dV}{dt}<\/span><\/span>．これに上の式を代入し，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{R}{c_v} = \\gamma - 1\">\\frac{R}{c_v} = \\gamma - 1<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"RT = (\\gamma - 1)c_v T\">RT = (\\gamma - 1)c_v T<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{dm}{dt} = \\sum_j\\dot m_j\">\\frac{dm}{dt} = \\sum_j\\dot m_j<\/span><\/span> を使うと<\/p>\n<p><span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\frac{dp}{dt} = -\\gamma\\,\\frac{p}{V}\\frac{dV}{d\\theta}\\,\\omega + \\frac{\\gamma - 1}{V}\\left[\\dot Q_{\\text{comb}} + r\\left(e_u - e_b\\right) - \\dot Q_{\\text{wall}} + \\sum_j\\dot m_j\\left(h_j - Y_j e_u - (1 - Y_j)e_b + c_v T\\right)\\right]\">\\frac{dp}{dt} = -\\gamma\\,\\frac{p}{V}\\frac{dV}{d\\theta}\\,\\omega + \\frac{\\gamma - 1}{V}\\left[\\dot Q_{\\text{comb}} + r\\left(e_u - e_b\\right) - \\dot Q_{\\text{wall}} + \\sum_j\\dot m_j\\left(h_j - Y_j e_u - (1 - Y_j)e_b + c_v T\\right)\\right]<\/span><\/span><\/p>\n<p>ここで <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma = \\gamma(T, Y_u)\">\\gamma = \\gamma(T, Y_u)<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"c_v = c_v(T, Y_u)\">c_v = c_v(T, Y_u)<\/span><\/span>．流れごとの括弧の中は次のとおり．<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>流れ<\/th>\n<th><span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_j\">Y_j<\/span><\/span><\/th>\n<th><span class=\"im\"><span class=\"tx raw\" data-tex=\"h_j\">h_j<\/span><\/span><\/th>\n<th>括弧の中<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>筒内から出る流れ（吸気弁の逆流，排気弁の流出）<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_u\">Y_u<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"h(T, Y_u)\">h(T, Y_u)<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"c_p(T, Y_u)\\,T\">c_p(T, Y_u)\\,T<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>吸気弁の順流<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"1 - Y_{b,\\text{src}}\">1 - Y_{b,\\text{src}}<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"h(T_{\\text{in}}, Y_j) + \\varepsilon_{\\text{src}}\">h(T_{\\text{in}}, Y_j) + \\varepsilon_{\\text{src}}<\/span><\/span>（SPEC-05）<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"h_j - Y_j e_u(T) - (1 - Y_j)e_b(T) + c_v T\">h_j - Y_j e_u(T) - (1 - Y_j)e_b(T) + c_v T<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>排気弁の逆流<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"h_b(T_X)\">h_b(T_X)<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"h_b(T_X) - e_b(T) + c_v T\">h_b(T_X) - e_b(T) + c_v T<\/span><\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>筒内から出る流れでは <span class=\"im\"><span class=\"tx raw\" data-tex=\"h(T, Y_u) - e(T, Y_u) = RT\">h(T, Y_u) - e(T, Y_u) = RT<\/span><\/span> なので括弧の中は <span class=\"im\"><span class=\"tx raw\" data-tex=\"(R + c_v)T = c_p T\">(R + c_v)T = c_p T<\/span><\/span> となる．定比熱比モデルでは <span class=\"im\"><span class=\"tx raw\" data-tex=\"h_j = c_p T_j + \\text{const}\">h_j = c_p T_j + \\text{const}<\/span><\/span> なので，流入の括弧の中も <span class=\"im\"><span class=\"tx raw\" data-tex=\"c_p T_j\">c_p T_j<\/span><\/span> に帰着する．<\/p>\n<h4 id=\"spech31\">第一法則の検査<\/h4>\n<p>顕熱エネルギー <span class=\"im\"><span class=\"tx raw\" data-tex=\"U_s = m_u e_u(T) + m_b e_b(T)\">U_s = m_u e_u(T) + m_b e_b(T)<\/span><\/span> について，上の式から <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\frac{dU_s}{dt} = -p\\frac{dV}{dt} - \\dot Q_{\\text{wall}} + \\dot Q_{\\text{comb}} + \\dot H_{\\text{in}}^s - \\dot H_{\\text{out}}^s\">\\frac{dU_s}{dt} = -p\\frac{dV}{dt} - \\dot Q_{\\text{wall}} + \\dot Q_{\\text{comb}} + \\dot H_{\\text{in}}^s - \\dot H_{\\text{out}}^s<\/span><\/span> が成り立つ（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot H_{\\text{in}}^s = \\sum_{\\text{流入}}\\dot m_j h_j\">\\dot H_{\\text{in}}^s = \\sum_{\\text{流入}}\\dot m_j h_j<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot H_{\\text{out}}^s = \\sum_{\\text{流出}}|\\dot m_j|\\,h(T, Y_u)\">\\dot H_{\\text{out}}^s = \\sum_{\\text{流出}}|\\dot m_j|\\,h(T, Y_u)<\/span><\/span>）．両辺を補助積分（§2.3）で積分し， <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\Delta U_s = -\\Delta W - \\Delta Q_w + \\Delta Q_c + \\Delta H_i - \\Delta H_o\">\\Delta U_s = -\\Delta W - \\Delta Q_w + \\Delta Q_c + \\Delta H_i - \\Delta H_o<\/span><\/span> の残差で検査する．<\/p>\n<ul>\n<li><strong>出典<\/strong>：Heywood (1988) Ch. 14；比熱の扱いは Klein and Eriksson (2004)．<\/li>\n<\/ul>\n<hr />\n","<h3 id=\"spech32\">SPEC-10：回転運動，摩擦，スターター（REQ-10）<\/h3>\n<h4 id=\"spech33\">定義と式<\/h4>\n<p><span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\frac{d\\theta}{dt} = \\omega, \\qquad I_{\\text{tot}}\\frac{d\\omega}{dt} = T_{\\text{ind}} + T_{\\text{st}} - T_f - T_{\\text{aux}} - T_{\\text{dyno}}\">\\frac{d\\theta}{dt} = \\omega, \\qquad I_{\\text{tot}}\\frac{d\\omega}{dt} = T_{\\text{ind}} + T_{\\text{st}} - T_f - T_{\\text{aux}} - T_{\\text{dyno}}<\/span><\/span><\/p>\n<ol type=\"1\">\n<li><strong>慣性<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"I_{\\text{tot}} = I + I_{\\text{dyno}}\">I_{\\text{tot}} = I + I_{\\text{dyno}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"I = 0.12\\ \\text{kg·m}^2\">I = 0.12\\ \\text{kg·m}^2<\/span><\/span>（クランク軸とフライホイール），<span class=\"im\"><span class=\"tx raw\" data-tex=\"I_{\\text{dyno}}\">I_{\\text{dyno}}<\/span><\/span> は動力計（SPEC-11，既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.05\\ \\text{kg·m}^2\">0.05\\ \\text{kg·m}^2<\/span><\/span>）．<\/li>\n<li><strong>図示トルク<\/strong>：クランクケースの圧力を <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{atm}}\">p_{\\text{atm}}<\/span><\/span> とし，仮想仕事 <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{ind}}\\,d\\theta = (p - p_{\\text{atm}})\\,dV\">T_{\\text{ind}}\\,d\\theta = (p - p_{\\text{atm}})\\,dV<\/span><\/span> から <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"T_{\\text{ind}}(\\theta) = (p - p_{\\text{atm}})\\frac{dV}{d\\theta}\">T_{\\text{ind}}(\\theta) = (p - p_{\\text{atm}})\\frac{dV}{d\\theta}<\/span><\/span><\/li>\n<li><strong>摩擦<\/strong>（Chen–Flynn 型の摩擦平均有効圧）：直前に完了したサイクルの筒内最高圧を <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\max}\">p_{\\max}<\/span><\/span>（初期値 <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{atm}}\">p_{\\text{atm}}<\/span><\/span>．サイクルの終端で更新），平均ピストン速度を <span class=\"im\"><span class=\"tx raw\" data-tex=\"c_m = \\frac{S\\omega}{\\pi}\">c_m = \\frac{S\\omega}{\\pi}<\/span><\/span> として <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\text{FMEP} = F_0 + F_1\\,p_{\\max} + F_2\\,c_m, \\qquad T_f = \\frac{\\text{FMEP}\\cdot V_d}{4\\pi} \\quad (\\omega &gt; 0)\">\\text{FMEP} = F_0 + F_1\\,p_{\\max} + F_2\\,c_m, \\qquad T_f = \\frac{\\text{FMEP}\\cdot V_d}{4\\pi} \\quad (\\omega &gt; 0)<\/span><\/span> <span class=\"im\"><span class=\"tx raw\" data-tex=\"F_0 = 13.7\\ \\text{kPa}\">F_0 = 13.7\\ \\text{kPa}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"F_1 = 0.005\">F_1 = 0.005<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"F_2 = 16.2\\ \\text{kPa·s/m}\">F_2 = 16.2\\ \\text{kPa·s/m}<\/span><\/span>．<\/li>\n<li><strong>補機の負荷<\/strong>：オルタネータ，ウォーターポンプ，オイルポンプなどが吸収するトルクを，回転数によらない一定値 <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{aux}}\">T_{\\text{aux}}<\/span><\/span>（設定「運転」の補機負荷トルク，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"20\\ \\text{N·m}\">20\\ \\text{N·m}<\/span><\/span>，既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"2.0\">2.0<\/span><\/span>）で与える（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\omega &gt; 0\">\\omega &gt; 0<\/span><\/span> のとき）．平均有効圧に直すと <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{AMEP} = \\frac{4\\pi T_{\\text{aux}}}{V_d}\">\\text{AMEP} = \\frac{4\\pi T_{\\text{aux}}}{V_d}<\/span><\/span>（既定で約 <span class=\"im\"><span class=\"tx raw\" data-tex=\"50\\ \\text{kPa}\">50\\ \\text{kPa}<\/span><\/span>）．<\/li>\n<li><strong>スターター<\/strong>：ワンウェイクラッチを介して駆動する直流モータとし，スターターが ON かつ完爆前のとき <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"T_{\\text{st}} = T_{\\text{stall}}\\max\\left(0,\\ 1 - \\frac{\\omega}{\\omega_{nl}}\\right), \\qquad T_{\\text{stall}} = 60\\ \\text{N·m},\\ \\omega_{nl} = 209\\ \\text{rad/s}\">T_{\\text{st}} = T_{\\text{stall}}\\max\\left(0,\\ 1 - \\frac{\\omega}{\\omega_{nl}}\\right), \\qquad T_{\\text{stall}} = 60\\ \\text{N·m},\\ \\omega_{nl} = 209\\ \\text{rad/s}<\/span><\/span> それ以外は <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{st}} = 0\">T_{\\text{st}} = 0<\/span><\/span>．<\/li>\n<li><strong>完爆とエンスト<\/strong>：燃料が ON で，平均回転数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N\">\\bar N<\/span><\/span>（SPEC-12）が <span class=\"im\"><span class=\"tx raw\" data-tex=\"N_{\\text{fire}} = 550\\ \\text{rpm}\">N_{\\text{fire}} = 550\\ \\text{rpm}<\/span><\/span> を超え，直前に完了したサイクルの圧縮膨張の図示仕事 <span class=\"im\"><span class=\"tx raw\" data-tex=\"W_g\">W_g<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"20\\ \\text{J}\">20\\ \\text{J}<\/span><\/span> を超えているとき，完爆と判定してスターターを切る．完爆後に <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N &lt; 150\\ \\text{rpm}\">\\bar N &lt; 150\\ \\text{rpm}<\/span><\/span> になると，エンストとして完爆の状態と燃料を OFF にする．<\/li>\n<li><strong>逆転の防止<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\omega \\le 0\">\\omega \\le 0<\/span><\/span> かつ右辺が負のとき，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{d\\theta}{dt} = \\frac{d\\omega}{dt} = 0\">\\frac{d\\theta}{dt} = \\frac{d\\omega}{dt} = 0<\/span><\/span> とする．<\/li>\n<li><strong>回転数の固定<\/strong>：<code>EngineCore<\/code> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{d\\omega}{dt} = 0\">\\frac{d\\omega}{dt} = 0<\/span><\/span> とするモードを持つ（性能曲線の計測と一部のテストで使う．画面の設定には出さない）．<\/li>\n<\/ol>\n<h4 id=\"spech34\">仮定と限界<\/h4>\n<ul>\n<li><p>ピストンと連桿の往復質量による慣性トルクは扱わない．サイクル平均には影響しないが，サイクル内の回転変動は実機と異なる．<\/p><\/li>\n<li><p>補機の負荷は実機では回転数とともに増える．<\/p><\/li>\n<li><p>スターターの無負荷回転数は実機より高く，燃料 OFF のクランキングは約 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1700\\ \\text{rpm}\">1700\\ \\text{rpm}<\/span><\/span> に達する．始動直後の吹け上がり（約 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1400\\ \\text{rpm}\">1400\\ \\text{rpm}<\/span><\/span>．実測 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1428\\ \\text{rpm}\">1428\\ \\text{rpm}<\/span><\/span>）とアイドルへの整定の遅さ（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 25\\ \\text{rpm}\">\\pm 25\\ \\text{rpm}<\/span><\/span> に収まるまで約 <span class=\"im\"><span class=\"tx raw\" data-tex=\"12\\ \\text{s}\">12\\ \\text{s}<\/span><\/span>．実測 <span class=\"im\"><span class=\"tx raw\" data-tex=\"12.5\\ \\text{s}\">12.5\\ \\text{s}<\/span><\/span>）の一因である．<\/p><\/li>\n<li><p><strong>出典<\/strong>：<a target=\"_blank\" rel=\"noopener\" href=\"https://doi.org/10.1007/b137654\">U. Kiencke and L. Nielsen, <em>Automotive Control Systems<\/em>, 2nd ed., Springer (2005), Ch. 6<\/a>；<a target=\"_blank\" rel=\"noopener\" href=\"https://doi.org/10.4271/650733\">S. K. Chen and P. F. Flynn, SAE Technical Paper 650733 (1965)<\/a><\/p><\/li>\n<\/ul>\n<hr />\n","<h3 id=\"spech35\">SPEC-11：水ブレーキ式動力計と運転モード（REQ-11）<\/h3>\n<h4 id=\"spech36\">定義と式<\/h4>\n<ol type=\"1\">\n<li><strong>吸収トルク<\/strong>：回転数の 2 乗と実効充水率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{eff}} \\in [0, 1]\">f_{\\text{eff}} \\in [0, 1]<\/span><\/span> に比例する． <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"T_{\\text{dyno}} = f_{\\text{eff}}\\,k_w\\,\\omega^2, \\qquad k_w = \\frac{T_{\\text{rated}}}{\\omega_{\\text{rated}}^2},\\ \\omega_{\\text{rated}} = \\frac{\\pi N_{\\text{rated}}}{30}\">T_{\\text{dyno}} = f_{\\text{eff}}\\,k_w\\,\\omega^2, \\qquad k_w = \\frac{T_{\\text{rated}}}{\\omega_{\\text{rated}}^2},\\ \\omega_{\\text{rated}} = \\frac{\\pi N_{\\text{rated}}}{30}<\/span><\/span> 定格 <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{rated}} = 35\\ \\text{N·m}\">T_{\\text{rated}} = 35\\ \\text{N·m}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"N_{\\text{rated}} = 1500\\ \\text{rpm}\">N_{\\text{rated}} = 1500\\ \\text{rpm}<\/span><\/span>（設定で変更可）．最大吸収トルク <span class=\"im\"><span class=\"tx raw\" data-tex=\"k_w\\omega^2\">k_w\\omega^2<\/span><\/span> は低回転ほど小さい（既定で <span class=\"im\"><span class=\"tx raw\" data-tex=\"800\\ \\text{rpm}\">800\\ \\text{rpm}<\/span><\/span>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"9.96\\ \\text{N·m}\">9.96\\ \\text{N·m}<\/span><\/span>）．<\/li>\n<li><strong>充水の応答<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\tau_d\\frac{df_{\\text{eff}}}{dt} = f_{\\text{cmd}} - f_{\\text{eff}}\">\\tau_d\\frac{df_{\\text{eff}}}{dt} = f_{\\text{cmd}} - f_{\\text{eff}}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\tau_d\">\\tau_d<\/span><\/span> 既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.3\\ \\text{s}\">0.3\\ \\text{s}<\/span><\/span>）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{eff}}\">f_{\\text{eff}}<\/span><\/span> は状態ベクトルに入れず，積分のステップの終わりに <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{eff}} \\leftarrow f_{\\text{cmd}} + (f_{\\text{eff}} - f_{\\text{cmd}})\\,e^{-\\Delta t/\\tau_d}\">f_{\\text{eff}} \\leftarrow f_{\\text{cmd}} + (f_{\\text{eff}} - f_{\\text{cmd}})\\,e^{-\\Delta t/\\tau_d}<\/span><\/span> で更新する（ステップの間は一定）．<\/li>\n<li><strong>動力計制御の PI<\/strong>：偏差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"e_d = \\bar N - N_{\\text{target}}\">e_d = \\bar N - N_{\\text{target}}<\/span><\/span>（回転が目標を超えると正）に対し <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"f_{\\text{cmd}} = \\text{clamp}\\left(f_{\\text{base}} + K_{p,d}\\,e_d + I_f,\\ 0,\\ 1\\right), \\qquad \\frac{dI_f}{dt} = \\begin{cases} 0 &amp; (\\text{上下限に張り付き，} e_d \\text{ がそれを深める向き}) \\\\ K_{i,d}\\,e_d &amp; (\\text{それ以外}) \\end{cases}\">f_{\\text{cmd}} = \\text{clamp}\\left(f_{\\text{base}} + K_{p,d}\\,e_d + I_f,\\ 0,\\ 1\\right), \\qquad \\frac{dI_f}{dt} = \\begin{cases} 0 &amp; (\\text{上下限に張り付き，} e_d \\text{ がそれを深める向き}) \\\\ K_{i,d}\\,e_d &amp; (\\text{それ以外}) \\end{cases}<\/span><\/span> 既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"K_{p,d} = 0.001\\ /\\text{rpm}\">K_{p,d} = 0.001\\ /\\text{rpm}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"K_{i,d} = 0.002\\ /(\\text{rpm·s})\">K_{i,d} = 0.002\\ /(\\text{rpm·s})<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{base}} = 0\">f_{\\text{base}} = 0<\/span><\/span>．完爆の時点で <span class=\"im\"><span class=\"tx raw\" data-tex=\"I_f = 0\">I_f = 0<\/span><\/span>．<\/li>\n<li><strong>モードの切替<\/strong>（完爆後）：指令が連続になるよう初期化する．A → B：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha_{\\text{manual}} \\leftarrow \\alpha\">\\alpha_{\\text{manual}} \\leftarrow \\alpha<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"I_f = f_{\\text{cmd}} - f_{\\text{base}} - K_{p,d}\\,e_d\">I_f = f_{\\text{cmd}} - f_{\\text{base}} - K_{p,d}\\,e_d<\/span><\/span>．B → A：<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{manual}} \\leftarrow f_{\\text{cmd}}\">f_{\\text{manual}} \\leftarrow f_{\\text{cmd}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"I_\\alpha = \\alpha - \\alpha_{\\text{ff}} - K_p\\,e_N\">I_\\alpha = \\alpha - \\alpha_{\\text{ff}} - K_p\\,e_N<\/span><\/span>（SPEC-12）．<\/li>\n<li><strong>容量の判定<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{cmd}} = 1\">f_{\\text{cmd}} = 1<\/span><\/span> のまま <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N &gt; N_{\\text{target}} + 100\\ \\text{rpm}\">\\bar N &gt; N_{\\text{target}} + 100\\ \\text{rpm}<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\ \\text{s}\">2\\ \\text{s}<\/span><\/span> 続くと <code>OVERLOAD<\/code>（動力計の容量不足），<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{cmd}} = 0\">f_{\\text{cmd}} = 0<\/span><\/span> のまま <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N &lt; N_{\\text{target}} - 100\\ \\text{rpm}\">\\bar N &lt; N_{\\text{target}} - 100\\ \\text{rpm}<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\ \\text{s}\">2\\ \\text{s}<\/span><\/span> 続くと <code>UNDERPOWER<\/code>（機関の出力不足）を表示する．<\/li>\n<li><strong>軸トルクとのつり合い<\/strong>：瞬時の軸トルクを <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_b^{\\text{inst}} = T_{\\text{ind}} - T_f - T_{\\text{aux}}\">T_b^{\\text{inst}} = T_{\\text{ind}} - T_f - T_{\\text{aux}}<\/span><\/span> とすると，完爆後の運動方程式は <span class=\"im\"><span class=\"tx raw\" data-tex=\"I_{\\text{tot}}\\frac{d\\omega}{dt} = T_b^{\\text{inst}} - T_{\\text{dyno}}\">I_{\\text{tot}}\\frac{d\\omega}{dt} = T_b^{\\text{inst}} - T_{\\text{dyno}}<\/span><\/span>．定常ではサイクル平均で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\overline{T_b} = \\overline{T_{\\text{dyno}}}\">\\overline{T_b} = \\overline{T_{\\text{dyno}}}<\/span><\/span>．<\/li>\n<\/ol>\n<h4 id=\"spech37\">仮定と限界<\/h4>\n<ul>\n<li><p>軸のねじり剛性は無視する（剛体）．<\/p><\/li>\n<li><p><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{dyno}} \\propto \\omega^2\">T_{\\text{dyno}} \\propto \\omega^2<\/span><\/span> による低回転での感度の低下に対するゲインの切替は行わない．全開では整定が遅い．<\/p><\/li>\n<li><p>全開の軸トルク <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_b\">T_b<\/span><\/span> を保てる最低の回転数は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{30}{\\pi}\\sqrt{T_b/k_w}\">\\frac{30}{\\pi}\\sqrt{T_b/k_w}<\/span><\/span> で，既定の定格では全開（約 <span class=\"im\"><span class=\"tx raw\" data-tex=\"35\\ \\text{N·m}\">35\\ \\text{N·m}<\/span><\/span>）で約 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1500\\ \\text{rpm}\">1500\\ \\text{rpm}<\/span><\/span> である．<\/p><\/li>\n<li><p><strong>出典<\/strong>：Heywood (1988) Ch. 2（軸トルク，BMEP）；水ブレーキの特性は A. J. Martyr and M. A. Plint, <em>Engine Testing<\/em>（版とページは未確認）．<\/p><\/li>\n<\/ul>\n<hr />\n","<h3 id=\"spech38\">SPEC-12：ECU（スロットル開度の PI 制御と点火時期の自動最適化）（REQ-12）<\/h3>\n<h4 id=\"spech39\">定義と式<\/h4>\n<ol type=\"1\">\n<li><strong>平均回転数<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{d\\bar N}{dt} = \\frac{N - \\bar N}{\\tau_N}\">\\frac{d\\bar N}{dt} = \\frac{N - \\bar N}{\\tau_N}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"N = \\frac{30}{\\pi}\\omega\">N = \\frac{30}{\\pi}\\omega<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\tau_N\">\\tau_N<\/span><\/span> 既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.15\\ \\text{s}\">0.15\\ \\text{s}<\/span><\/span>）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N\">\\bar N<\/span><\/span> と積分の状態 <span class=\"im\"><span class=\"tx raw\" data-tex=\"I_\\alpha\">I_\\alpha<\/span><\/span> は ECU の内部状態で，積分のステップ（刻み <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta t\">\\Delta t<\/span><\/span>）の終わりに，終端の <span class=\"im\"><span class=\"tx raw\" data-tex=\"N\">N<\/span><\/span> を使って <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N \\leftarrow N + (\\bar N - N)\\,e^{-\\Delta t/\\tau_N}\">\\bar N \\leftarrow N + (\\bar N - N)\\,e^{-\\Delta t/\\tau_N}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"I_\\alpha \\leftarrow I_\\alpha + K_i\\,e_N\\,\\Delta t\">I_\\alpha \\leftarrow I_\\alpha + K_i\\,e_N\\,\\Delta t<\/span><\/span> と更新する（SPEC-13 の 6）．<\/li>\n<li><strong>補機負荷の feedforward と開度の下限<\/strong>： <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\alpha_{\\text{ff}} = \\alpha_{\\text{base}} + k_T\\,T_{\\text{aux}}, \\qquad \\alpha_{\\min} = \\min\\left(\\alpha_{\\max},\\ \\max\\left(0,\\ \\alpha_{\\text{ff}} - \\delta_\\alpha\\right)\\right)\">\\alpha_{\\text{ff}} = \\alpha_{\\text{base}} + k_T\\,T_{\\text{aux}}, \\qquad \\alpha_{\\min} = \\min\\left(\\alpha_{\\max},\\ \\max\\left(0,\\ \\alpha_{\\text{ff}} - \\delta_\\alpha\\right)\\right)<\/span><\/span> <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha_{\\text{base}}\">\\alpha_{\\text{base}}<\/span><\/span>：基準開度（既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"3^\\circ\">3^\\circ<\/span><\/span>），<span class=\"im\"><span class=\"tx raw\" data-tex=\"k_T = 0.26\\ ^\\circ/(\\text{N·m})\">k_T = 0.26\\ ^\\circ/(\\text{N·m})<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\delta_\\alpha = 1^\\circ\">\\delta_\\alpha = 1^\\circ<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"k_T\">k_T<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\delta_\\alpha\">\\delta_\\alpha<\/span><\/span> は定数）．既定（<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{aux}} = 2\\ \\text{N·m}\">T_{\\text{aux}} = 2\\ \\text{N·m}<\/span><\/span>）で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha_{\\text{ff}} = 3.52^\\circ\">\\alpha_{\\text{ff}} = 3.52^\\circ<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha_{\\min} = 2.52^\\circ\">\\alpha_{\\min} = 2.52^\\circ<\/span><\/span>．ECU は <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{aux}}\">T_{\\text{aux}}<\/span><\/span> を正確に知っているとする（理想化）．<\/li>\n<li><strong>PI 制御<\/strong>（アンチワインドアップ付き）：偏差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"e_N = N_{\\text{target}} - \\bar N\">e_N = N_{\\text{target}} - \\bar N<\/span><\/span> に対し <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\alpha = \\text{clamp}\\left(\\alpha_{\\text{ff}} + K_p\\,e_N + I_\\alpha,\\ \\alpha_{\\min},\\ \\alpha_{\\max}\\right), \\qquad \\frac{dI_\\alpha}{dt} = \\begin{cases} 0 &amp; (\\text{上下限に張り付き，} e_N \\text{ がそれを深める向き}) \\\\ K_i\\,e_N &amp; (\\text{それ以外}) \\end{cases}\">\\alpha = \\text{clamp}\\left(\\alpha_{\\text{ff}} + K_p\\,e_N + I_\\alpha,\\ \\alpha_{\\min},\\ \\alpha_{\\max}\\right), \\qquad \\frac{dI_\\alpha}{dt} = \\begin{cases} 0 &amp; (\\text{上下限に張り付き，} e_N \\text{ がそれを深める向き}) \\\\ K_i\\,e_N &amp; (\\text{それ以外}) \\end{cases}<\/span><\/span> 既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"K_p = 0.008\\ ^\\circ/\\text{rpm}\">K_p = 0.008\\ ^\\circ/\\text{rpm}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"K_i = 0.004\\ ^\\circ/(\\text{rpm·s})\">K_i = 0.004\\ ^\\circ/(\\text{rpm·s})<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha_{\\max} = 90^\\circ\">\\alpha_{\\max} = 90^\\circ<\/span><\/span>．スロットルは指令に即時に追従するとする．<\/li>\n<li><strong>状態ごとの開度<\/strong>：完爆前は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha = \\alpha_{\\text{crank}}\">\\alpha = \\alpha_{\\text{crank}}<\/span><\/span>（始動開度，既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"6^\\circ\">6^\\circ<\/span><\/span>）．完爆の時点で <span class=\"im\"><span class=\"tx raw\" data-tex=\"I_\\alpha = 0\">I_\\alpha = 0<\/span><\/span> とし，スロットル制御では 3 の式，動力計制御では <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha = \\alpha_{\\text{manual}}\">\\alpha = \\alpha_{\\text{manual}}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"I_\\alpha\">I_\\alpha<\/span><\/span> は更新しない）．<\/li>\n<li><strong>下限の役割<\/strong>：完爆直後は回転が約 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1400\\ \\text{rpm}\">1400\\ \\text{rpm}<\/span><\/span> まで吹け上がり，比例項が開度を大きく閉じる．理想スロットル（全閉で流量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>）では，開度が <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> になると吸気管圧が枯渇して図示仕事が負になり，回転が落ちてからの回復が間に合わずに止まる（<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{aux}} \\ge 5\\ \\text{N·m}\">T_{\\text{aux}} \\ge 5\\ \\text{N·m}<\/span><\/span>）．下限 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha_{\\min}\">\\alpha_{\\min}<\/span><\/span> はこれを防ぎ，feedforward は下限を負荷に連動させる．<span class=\"im\"><span class=\"tx raw\" data-tex=\"k_T\">k_T<\/span><\/span> は，<span class=\"im\"><span class=\"tx raw\" data-tex=\"800\\ \\text{rpm}\">800\\ \\text{rpm}<\/span><\/span> の定常開度の実測（<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{aux}} = 0, 2, 6\\ \\text{N·m}\">T_{\\text{aux}} = 0, 2, 6\\ \\text{N·m}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"3.59^\\circ, 4.18^\\circ, 5.16^\\circ\">3.59^\\circ, 4.18^\\circ, 5.16^\\circ<\/span><\/span>．始動から <span class=\"im\"><span class=\"tx raw\" data-tex=\"42\">42<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"45\\ \\text{s}\">45\\ \\text{s}<\/span><\/span> の平均）の傾き <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.26\">0.26<\/span><\/span> による．<\/li>\n<li><strong>点火時期の自動最適化<\/strong>（設定「燃焼」の <code>[点火の自動最適化 OFF／ON]<\/code>，既定 ON）：サイクルごとに，燃焼割合 <span class=\"im\"><span class=\"tx raw\" data-tex=\"50\\%\">50\\%<\/span><\/span> の時期 <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\theta_{50} = \\theta_0 + \\Delta\\theta_b\\left(\\frac{\\ln 2}{a}\\right)^{1/(m_w + 1)}\">\\theta_{50} = \\theta_0 + \\Delta\\theta_b\\left(\\frac{\\ln 2}{a}\\right)^{1/(m_w + 1)}<\/span><\/span> （Wiebe 関数で <span class=\"im\"><span class=\"tx raw\" data-tex=\"x_b = 0.5\">x_b = 0.5<\/span><\/span> となる角度．SPEC-07）から <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{CA50} = \\theta_{50} - 360^\\circ\">\\text{CA50} = \\theta_{50} - 360^\\circ<\/span><\/span> を求め，サイクルの終端で点火進角 <span class=\"im\"><span class=\"tx raw\" data-tex=\"s\">s<\/span><\/span> [°BTDC] を <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"s \\leftarrow s + k_s\\left(\\text{CA50} - \\text{CA50}^*\\right), \\qquad k_s = 0.6,\\ \\text{CA50}^* = 10^\\circ\">s \\leftarrow s + k_s\\left(\\text{CA50} - \\text{CA50}^*\\right), \\qquad k_s = 0.6,\\ \\text{CA50}^* = 10^\\circ<\/span><\/span> と更新する（完爆後のみ）．OFF または完爆前は <span class=\"im\"><span class=\"tx raw\" data-tex=\"s =\">s =<\/span><\/span> 設定値（既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"18^\\circ\">18^\\circ<\/span><\/span> BTDC）．点火時期には上下限を設けない．ノッキングは扱わない．<\/li>\n<\/ol>\n<h4 id=\"spech40\">仮定と限界<\/h4>\n<ul>\n<li><p>目標回転数を下げたときも開度は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha_{\\min}\">\\alpha_{\\min}<\/span><\/span> までしか閉じない．<\/p><\/li>\n<li><p><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{aux}} \\ge 10\\ \\text{N·m}\">T_{\\text{aux}} \\ge 10\\ \\text{N·m}<\/span><\/span> ではアイドルへの整定が遅い（PI のゲインは軽負荷に合わせてある）．低い目標回転数（<span class=\"im\"><span class=\"tx raw\" data-tex=\"600\\ \\text{rpm}\">600\\ \\text{rpm}<\/span><\/span>）では回転が数十 rpm の幅で振れ続ける．<\/p><\/li>\n<li><p>CA50 の目標 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^\\circ\">10^\\circ<\/span><\/span> は，本モデルで点火時期を振ったときの図示仕事の最大付近にある（TEST-12 項目 7 で判定）．<\/p><\/li>\n<li><p><strong>出典<\/strong>：Guzzella and Onder (2010) Ch. 4；MBT と CA50 の関係は Heywood (1988) Sec. 9.2．<\/p><\/li>\n<\/ul>\n<hr />\n","<h3 id=\"spech41\">SPEC-25：吸気ランナの慣性（慣性過給）（REQ-25）<\/h3>\n<h4 id=\"spech42\">定義と式<\/h4>\n<ol type=\"1\">\n<li><strong>寸法<\/strong>：断面積 <span class=\"im\"><span class=\"tx raw\" data-tex=\"A_r = \\frac{\\pi}{4}d_r^2\">A_r = \\frac{\\pi}{4}d_r^2<\/span><\/span>．ランナの弁側の半分の容積をポート容積 <span class=\"im\"><span class=\"tx raw\" data-tex=\"V_p = \\frac12 A_r L_r\">V_p = \\frac12 A_r L_r<\/span><\/span> とし，ポートの圧力を <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_p\">p_p<\/span><\/span> とする（集中定数の近似．マニホールド側の半分は <span class=\"im\"><span class=\"tx raw\" data-tex=\"V_{\\text{in}}\">V_{\\text{in}}<\/span><\/span> に含める）．<\/li>\n<li><strong>運動量の式<\/strong>：ランナのガスを密度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\rho_r = \\frac{p_{\\text{in}}}{RT_{\\text{in}}}\">\\rho_r = \\frac{p_{\\text{in}}}{RT_{\\text{in}}}<\/span><\/span>，速度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"u\">u<\/span><\/span> が一様な柱とみなす．Newton の第 2 法則 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\rho_r A_r L_r\\frac{du}{dt} = A_r(p_{\\text{in}} - p_p) - A_r\\,\\zeta\\frac{\\rho_r u|u|}{2}\">\\rho_r A_r L_r\\frac{du}{dt} = A_r(p_{\\text{in}} - p_p) - A_r\\,\\zeta\\frac{\\rho_r u|u|}{2}<\/span><\/span> に <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_r = \\rho_r A_r u\">\\dot m_r = \\rho_r A_r u<\/span><\/span> を代入して（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\rho_r\">\\rho_r<\/span><\/span> の時間変化は無視） <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\frac{d\\dot m_r}{dt} = \\frac{A_r}{L_r}(p_{\\text{in}} - p_p) - \\frac{\\zeta\\,\\dot m_r|\\dot m_r|}{2\\rho_r A_r L_r}, \\qquad \\zeta = f_r\\frac{L_r}{d_r} + \\zeta_e\">\\frac{d\\dot m_r}{dt} = \\frac{A_r}{L_r}(p_{\\text{in}} - p_p) - \\frac{\\zeta\\,\\dot m_r|\\dot m_r|}{2\\rho_r A_r L_r}, \\qquad \\zeta = f_r\\frac{L_r}{d_r} + \\zeta_e<\/span><\/span> <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_r = 0.02\">f_r = 0.02<\/span><\/span>（管摩擦係数），<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\zeta_e = 0.2\">\\zeta_e = 0.2<\/span><\/span>（入口損失係数）．<\/li>\n<li><strong>ポートの圧力<\/strong>：ポートのガスは断熱的に圧縮・膨張するとする（音響的な剛性）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{dp_p}{dt} = \\gamma_0\\frac{p_p}{\\rho_p}\\frac{d\\rho_p}{dt}\">\\frac{dp_p}{dt} = \\gamma_0\\frac{p_p}{\\rho_p}\\frac{d\\rho_p}{dt}<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{dm_p}{dt} = \\dot m_r - \\dot m_{\\text{in}}\">\\frac{dm_p}{dt} = \\dot m_r - \\dot m_{\\text{in}}<\/span><\/span> から <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\frac{dp_p}{dt} = \\frac{\\gamma_0 RT_{\\text{in}}}{V_p}\\left(\\dot m_r - \\dot m_{\\text{in}}\\right), \\qquad \\gamma_0 = 1.4\">\\frac{dp_p}{dt} = \\frac{\\gamma_0 RT_{\\text{in}}}{V_p}\\left(\\dot m_r - \\dot m_{\\text{in}}\\right), \\qquad \\gamma_0 = 1.4<\/span><\/span> 吸気弁の流量（SPEC-04）は上流圧を <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_p\">p_p<\/span><\/span> として求める．マニホールドの式（SPEC-05）の下流の流量は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_r\">\\dot m_r<\/span><\/span>．<\/li>\n<li><strong>既燃ガスと余剰エンタルピーの輸送<\/strong>：ポートのガス質量を <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_p = \\frac{p_p V_p}{RT_{\\text{in}}}\">m_p = \\frac{p_p V_p}{RT_{\\text{in}}}<\/span><\/span>，既燃分率を <span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_{b,p} = \\text{clamp}\\left(\\frac{m_{b,p}}{m_p}, 0, 1\\right)\">Y_{b,p} = \\text{clamp}\\left(\\frac{m_{b,p}}{m_p}, 0, 1\\right)<\/span><\/span>，単位質量あたりの余剰を <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon_p = \\frac{E_p}{m_p}\">\\varepsilon_p = \\frac{E_p}{m_p}<\/span><\/span> とする．ランナの流れは上流側の値を運ぶ： <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"Y_r = \\begin{cases} Y_{b,\\text{in}} &amp; (\\dot m_r \\ge 0) \\\\ Y_{b,p} &amp; (\\dot m_r &lt; 0) \\end{cases}, \\qquad \\varepsilon_r = \\begin{cases} \\varepsilon_{\\text{in}} &amp; (\\dot m_r \\ge 0) \\\\ \\varepsilon_p &amp; (\\dot m_r &lt; 0) \\end{cases}\">Y_r = \\begin{cases} Y_{b,\\text{in}} &amp; (\\dot m_r \\ge 0) \\\\ Y_{b,p} &amp; (\\dot m_r &lt; 0) \\end{cases}, \\qquad \\varepsilon_r = \\begin{cases} \\varepsilon_{\\text{in}} &amp; (\\dot m_r \\ge 0) \\\\ \\varepsilon_p &amp; (\\dot m_r &lt; 0) \\end{cases}<\/span><\/span> <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\frac{dm_{b,\\text{in}}}{dt} = -\\dot m_r Y_r + \\min(0, \\dot m_{\\text{th}})\\,Y_{b,\\text{in}}, \\qquad \\frac{dm_{b,p}}{dt} = \\dot m_r Y_r - \\dot m_{\\text{in}}Y_v, \\qquad Y_v = \\begin{cases} Y_{b,p} &amp; (\\dot m_{\\text{in}} \\ge 0) \\\\ 1 - Y_u &amp; (\\dot m_{\\text{in}} &lt; 0) \\end{cases}\">\\frac{dm_{b,\\text{in}}}{dt} = -\\dot m_r Y_r + \\min(0, \\dot m_{\\text{th}})\\,Y_{b,\\text{in}}, \\qquad \\frac{dm_{b,p}}{dt} = \\dot m_r Y_r - \\dot m_{\\text{in}}Y_v, \\qquad Y_v = \\begin{cases} Y_{b,p} &amp; (\\dot m_{\\text{in}} \\ge 0) \\\\ 1 - Y_u &amp; (\\dot m_{\\text{in}} &lt; 0) \\end{cases}<\/span><\/span> <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\frac{dE_{\\text{in}}}{dt} = -\\dot m_r\\varepsilon_r + \\min(0, \\dot m_{\\text{th}})\\,\\varepsilon_{\\text{in}}, \\qquad \\frac{dE_p}{dt} = \\dot m_r\\varepsilon_r - \\dot m_{\\text{in}}^+\\varepsilon_p + \\dot X_o\">\\frac{dE_{\\text{in}}}{dt} = -\\dot m_r\\varepsilon_r + \\min(0, \\dot m_{\\text{th}})\\,\\varepsilon_{\\text{in}}, \\qquad \\frac{dE_p}{dt} = \\dot m_r\\varepsilon_r - \\dot m_{\\text{in}}^+\\varepsilon_p + \\dot X_o<\/span><\/span> <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot X_o\">\\dot X_o<\/span><\/span> は吸気弁の逆流が持ち込む余剰（SPEC-05）．吸気弁の順流の上流は <span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_{b,\\text{src}} = Y_{b,p}\">Y_{b,\\text{src}} = Y_{b,p}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon_{\\text{src}} = \\varepsilon_p\">\\varepsilon_{\\text{src}} = \\varepsilon_p<\/span><\/span>．<\/li>\n<li><strong>共鳴の目安<\/strong>：弁が閉じているとき，摩擦を無視して線形化すると <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{d^2\\dot m_r}{dt^2} = \\frac{A_r}{L_r}\\left(\\frac{dp_{\\text{in}}}{dt} - \\frac{dp_p}{dt}\\right) = -\\frac{A_r}{L_r}\\left(\\frac{RT_{\\text{in}}}{V_{\\text{in}}} + \\frac{\\gamma_0 RT_{\\text{in}}}{V_p}\\right)\\dot m_r\">\\frac{d^2\\dot m_r}{dt^2} = \\frac{A_r}{L_r}\\left(\\frac{dp_{\\text{in}}}{dt} - \\frac{dp_p}{dt}\\right) = -\\frac{A_r}{L_r}\\left(\\frac{RT_{\\text{in}}}{V_{\\text{in}}} + \\frac{\\gamma_0 RT_{\\text{in}}}{V_p}\\right)\\dot m_r<\/span><\/span> なので，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_r\">\\dot m_r<\/span><\/span> は角振動数 <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\omega_H = \\sqrt{\\frac{A_r}{L_r}\\left(\\frac{\\gamma_0 RT_{\\text{in}}}{V_p} + \\frac{RT_{\\text{in}}}{V_{\\text{in}}}\\right)}\">\\omega_H = \\sqrt{\\frac{A_r}{L_r}\\left(\\frac{\\gamma_0 RT_{\\text{in}}}{V_p} + \\frac{RT_{\\text{in}}}{V_{\\text{in}}}\\right)}<\/span><\/span> で振動する．弁が開くと筒内の容積が加わって振動数が下がり，その周期が吸気行程と合う回転数で充填が増える．<\/li>\n<li><strong>設定<\/strong>（ページ「吸気ランナ」）：ランナ ON／OFF（既定 ON），<span class=\"im\"><span class=\"tx raw\" data-tex=\"L_r\">L_r<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"100\">100<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"1000\\ \\text{mm}\">1000\\ \\text{mm}<\/span><\/span>，既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"450\">450<\/span><\/span>），<span class=\"im\"><span class=\"tx raw\" data-tex=\"d_r\">d_r<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"20\">20<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"60\\ \\text{mm}\">60\\ \\text{mm}<\/span><\/span>，既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"40\">40<\/span><\/span>）．運転中に OFF から ON にしたときは <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_r = 0\">\\dot m_r = 0<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_p = p_{\\text{in}}\">p_p = p_{\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{b,p} = Y_{b,\\text{in}}m_p\">m_{b,p} = Y_{b,\\text{in}}m_p<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"E_p = \\varepsilon_{\\text{in}}m_p\">E_p = \\varepsilon_{\\text{in}}m_p<\/span><\/span> から始める．OFF では <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_r\">\\dot m_r<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_p\">p_p<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{b,p}\">m_{b,p}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"E_p\">E_p<\/span><\/span> の時間微分を <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> とし，吸気弁はマニホールドに直接つながる．<\/li>\n<\/ol>\n<h4 id=\"spech43\">仮定と限界<\/h4>\n<ul>\n<li><p>管内の圧力波の往復は解かず，質量とばねで近似する．2 次以上の同調と，排気側の脈動との干渉は表せない．<\/p><\/li>\n<li><p>ポートの質量は <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{in}}\">T_{\\text{in}}<\/span><\/span> で評価し，断熱の剛性 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_0\">\\gamma_0<\/span><\/span> とは厳密には整合しない．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_0 = 1.4\">\\gamma_0 = 1.4<\/span><\/span> は集中定数の剛性の定数で，SPEC-02 の物性とは独立である．<\/p><\/li>\n<li><p><strong>出典<\/strong>：Heywood, <em>Internal Combustion Engine Fundamentals<\/em>, 2nd ed. (2018) Ch. 7；<a target=\"_blank\" rel=\"noopener\" href=\"https://www.wiley.com/en-us/Design+Techniques+for+Engine+Manifolds%3A+Wave+Action+Methods+for+IC+Engines-p-9781860581793\">D. E. Winterbone and R. J. Pearson, <em>Design Techniques for Engine Manifolds<\/em> (1999)<\/a><\/p><\/li>\n<\/ul>\n<hr />\n","<h3 id=\"spech44\">SPEC-27：排気系（排気管の脈動と背圧）（REQ-27）<\/h3>\n<h4 id=\"spech45\">定義と式<\/h4>\n<ol type=\"1\">\n<li><strong>寸法<\/strong>：排気管の寸法は音響の設定（SPEC-21）の排気管長 <span class=\"im\"><span class=\"tx raw\" data-tex=\"L_e\">L_e<\/span><\/span>（既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1.0\\ \\text{m}\">1.0\\ \\text{m}<\/span><\/span>）と内径 <span class=\"im\"><span class=\"tx raw\" data-tex=\"d_e\">d_e<\/span><\/span>（既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"40\\ \\text{mm}\">40\\ \\text{mm}<\/span><\/span>）を共用する．断面積 <span class=\"im\"><span class=\"tx raw\" data-tex=\"A_e = \\frac{\\pi}{4}d_e^2\">A_e = \\frac{\\pi}{4}d_e^2<\/span><\/span>．弁側の半分を排気ポート容積 <span class=\"im\"><span class=\"tx raw\" data-tex=\"V_{pe} = \\frac12 A_e L_e\">V_{pe} = \\frac12 A_e L_e<\/span><\/span> とし，下流側の半分は <span class=\"im\"><span class=\"tx raw\" data-tex=\"V_m\">V_m<\/span><\/span> に含める．排気系のガスは温度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_X = 800\\ \\text{K}\">T_X = 800\\ \\text{K}<\/span><\/span> 一定の既燃ガスとする．<\/li>\n<li><strong>排気管の運動量の式<\/strong>（SPEC-25 の 2 と同じ導出）： <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\frac{d\\dot m_e}{dt} = \\frac{A_e}{L_e}(p_{pe} - p_m) - \\frac{\\zeta_x\\,\\dot m_e|\\dot m_e|}{2\\rho_e A_e L_e}, \\qquad \\zeta_x = f_r\\frac{L_e}{d_e} + \\zeta_e, \\qquad \\rho_e = \\frac{p_{pe}}{RT_X}\">\\frac{d\\dot m_e}{dt} = \\frac{A_e}{L_e}(p_{pe} - p_m) - \\frac{\\zeta_x\\,\\dot m_e|\\dot m_e|}{2\\rho_e A_e L_e}, \\qquad \\zeta_x = f_r\\frac{L_e}{d_e} + \\zeta_e, \\qquad \\rho_e = \\frac{p_{pe}}{RT_X}<\/span><\/span><\/li>\n<li><strong>排気ポートの圧力<\/strong>（断熱の剛性）：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{dp_{pe}}{dt} = \\frac{\\gamma_0 RT_X}{V_{pe}}\\left(\\dot m_{\\text{ex}} - \\dot m_e\\right)\">\\frac{dp_{pe}}{dt} = \\frac{\\gamma_0 RT_X}{V_{pe}}\\left(\\dot m_{\\text{ex}} - \\dot m_e\\right)<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_0 = 1.4\">\\gamma_0 = 1.4<\/span><\/span>．排気弁の流量（SPEC-04）は下流圧を <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{pe}\">p_{pe}<\/span><\/span> として求める．<\/li>\n<li><strong>消音器の圧力<\/strong>（等温）：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{dp_m}{dt} = \\frac{RT_X}{V_m}\\left(\\dot m_e - \\dot m_t\\right)\">\\frac{dp_m}{dt} = \\frac{RT_X}{V_m}\\left(\\dot m_e - \\dot m_t\\right)<\/span><\/span>．テールパイプの出口の流量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_t\">\\dot m_t<\/span><\/span> は SPEC-04 の式で <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_1 = p_m\">p_1 = p_m<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_2 = p_{\\text{atm}}\">p_2 = p_{\\text{atm}}<\/span><\/span>，有効面積 <span class=\"im\"><span class=\"tx raw\" data-tex=\"C_{d,t}A_t\">C_{d,t}A_t<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"C_{d,t} = 0.8\">C_{d,t} = 0.8<\/span><\/span>）．<\/li>\n<li><strong>背圧<\/strong>：1 サイクル平均の消音器圧と大気圧の差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta\\bar p_{\\text{ex}}\">\\Delta\\bar p_{\\text{ex}}<\/span><\/span>（SPEC-14）．出口の流量はおおむね <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_t \\approx C_{d,t}A_t\\sqrt{2\\rho\\,\\Delta p}\">\\dot m_t \\approx C_{d,t}A_t\\sqrt{2\\rho\\,\\Delta p}<\/span><\/span> なので，背圧は流量のほぼ 2 乗に比例する．<span class=\"im\"><span class=\"tx raw\" data-tex=\"A_t\">A_t<\/span><\/span> の既定値 <span class=\"im\"><span class=\"tx raw\" data-tex=\"300\\ \\text{mm}^2\">300\\ \\text{mm}^2<\/span><\/span> は，全開・<span class=\"im\"><span class=\"tx raw\" data-tex=\"5000\\ \\text{rpm}\">5000\\ \\text{rpm}<\/span><\/span> の背圧が <span class=\"im\"><span class=\"tx raw\" data-tex=\"10\">10<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"20\\ \\text{kPa}\">20\\ \\text{kPa}<\/span><\/span>（量産の排気系の典型として推定）になるよう選んだ（試作の段階の値：<span class=\"im\"><span class=\"tx raw\" data-tex=\"A_t = 200, 250, 300, 400\\ \\text{mm}^2\">A_t = 200, 250, 300, 400\\ \\text{mm}^2<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"23.3, 16.9, 13.8, 10.5\\ \\text{kPa}\">23.3, 16.9, 13.8, 10.5\\ \\text{kPa}<\/span><\/span>．既定の <span class=\"im\"><span class=\"tx raw\" data-tex=\"300\\ \\text{mm}^2\">300\\ \\text{mm}^2<\/span><\/span> の実測は <span class=\"im\"><span class=\"tx raw\" data-tex=\"13.8\\ \\text{kPa}\">13.8\\ \\text{kPa}<\/span><\/span>）．<\/li>\n<li><strong>共鳴の目安<\/strong>：排気弁が閉じ，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_t\">\\dot m_t<\/span><\/span> を一定とみなすと，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_e\">\\dot m_e<\/span><\/span> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\omega_E = \\sqrt{\\frac{A_e}{L_e}\\left(\\frac{\\gamma_0 RT_X}{V_{pe}} + \\frac{RT_X}{V_m}\\right)}\">\\omega_E = \\sqrt{\\frac{A_e}{L_e}\\left(\\frac{\\gamma_0 RT_X}{V_{pe}} + \\frac{RT_X}{V_m}\\right)}<\/span><\/span> で振動する．<\/li>\n<li><strong>設定<\/strong>（ページ「排気系」）：排気系モデル ON／OFF（既定 ON），<span class=\"im\"><span class=\"tx raw\" data-tex=\"V_m\">V_m<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5\">0.5<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"10\\ \\text{L}\">10\\ \\text{L}<\/span><\/span>，既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"3\">3<\/span><\/span>），<span class=\"im\"><span class=\"tx raw\" data-tex=\"A_t\">A_t<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"20\">20<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"3000\\ \\text{mm}^2\">3000\\ \\text{mm}^2<\/span><\/span>，既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"300\">300<\/span><\/span>），OFF のときの排気圧損 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta p_{\\text{ex}}\">\\Delta p_{\\text{ex}}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"30\\ \\text{kPa}\">30\\ \\text{kPa}<\/span><\/span>，既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"4\">4<\/span><\/span>）．OFF では <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_e\">\\dot m_e<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{pe}\">p_{pe}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_m\">p_m<\/span><\/span> の時間微分を <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> とし，排気弁の下流圧を <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{atm}} + \\Delta p_{\\text{ex}}\">p_{\\text{atm}} + \\Delta p_{\\text{ex}}<\/span><\/span> とする．運転中に ON にしたときは <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_e = 0\">\\dot m_e = 0<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{pe} = p_m = p_{\\text{atm}} + \\Delta p_{\\text{ex}}\">p_{pe} = p_m = p_{\\text{atm}} + \\Delta p_{\\text{ex}}<\/span><\/span> から始める．<\/li>\n<\/ol>\n<h4 id=\"spech46\">仮定と限界<\/h4>\n<ul>\n<li><p>圧力波の往復は解かない（集中定数）．<\/p><\/li>\n<li><p>排気の温度は <span class=\"im\"><span class=\"tx raw\" data-tex=\"800\\ \\text{K}\">800\\ \\text{K}<\/span><\/span> 一定とする．排気弁が開く時点の筒内の温度は，全開（W3000）で約 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1650\\ \\text{K}\">1650\\ \\text{K}<\/span><\/span>，アイドルで約 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1180\\ \\text{K}\">1180\\ \\text{K}<\/span><\/span>（実測）で，これより高い．排気の密度（背圧）と，排気弁の逆流の温度に影響する．<\/p><\/li>\n<li><p>排気側へ吹き抜けた新気は既燃ガスとして扱う．<\/p><\/li>\n<li><p><span class=\"im\"><span class=\"tx raw\" data-tex=\"5000\\ \\text{rpm}\">5000\\ \\text{rpm}<\/span><\/span> を超えると体積効率の低下で排気流量が頭打ちになり，背圧は下がる．背圧は脈動する流量の 2 乗の平均で決まるので，平均流量だけの関数ではない．<\/p><\/li>\n<li><p>エンジン音（SPEC-21）は排気弁の流量から作り，排気管の流れの計算結果は音に使わない．<\/p><\/li>\n<li><p><strong>出典<\/strong>：Heywood (2018) Ch. 6，7；Winterbone and Pearson (1999)．<\/p><\/li>\n<\/ul>\n<hr />\n","<h3 id=\"spech47\">SPEC-29：化学種の熱物性と化学平衡（REQ-29．第26版，未実装）<\/h3>\n<p>設定「燃焼」の <code>[熱物性　化学種／γ(T)／γ一定]<\/code>（既定「化学種」）で選ぶ．「γ(T)」「γ一定」は SPEC-02 のモデルで，筒内圧の式は SPEC-09 のままである．「化学種」では，この SPEC の式が SPEC-02，SPEC-06，SPEC-07 の 4（発熱量），SPEC-09 に代わる．<\/p>\n<h4 id=\"spech48\">A. 成分と物性<\/h4>\n<ol type=\"1\">\n<li><strong>化学種のデータ<\/strong>：モル比熱，モルエンタルピー，標準エントロピーを NASA の 7 係数多項式で与える（係数は付表．<span class=\"im\"><span class=\"tx raw\" data-tex=\"1000\\ \\text{K}\">1000\\ \\text{K}<\/span><\/span> で低温側と高温側を切り替える）． <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\frac{\\bar c_{p,i}}{\\bar R} = a_1 + a_2 T + a_3 T^2 + a_4 T^3 + a_5 T^4, \\qquad \\frac{\\bar h_i}{\\bar R T} = a_1 + \\frac{a_2}{2}T + \\frac{a_3}{3}T^2 + \\frac{a_4}{4}T^3 + \\frac{a_5}{5}T^4 + \\frac{a_6}{T}\">\\frac{\\bar c_{p,i}}{\\bar R} = a_1 + a_2 T + a_3 T^2 + a_4 T^3 + a_5 T^4, \\qquad \\frac{\\bar h_i}{\\bar R T} = a_1 + \\frac{a_2}{2}T + \\frac{a_3}{3}T^2 + \\frac{a_4}{4}T^3 + \\frac{a_5}{5}T^4 + \\frac{a_6}{T}<\/span><\/span> <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\frac{\\bar s_i^\\circ}{\\bar R} = a_1\\ln T + a_2 T + \\frac{a_3}{2}T^2 + \\frac{a_4}{3}T^3 + \\frac{a_5}{4}T^4 + a_7\">\\frac{\\bar s_i^\\circ}{\\bar R} = a_1\\ln T + a_2 T + \\frac{a_3}{2}T^2 + \\frac{a_4}{3}T^3 + \\frac{a_5}{4}T^4 + a_7<\/span><\/span> <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar R = 8.314462618\\ \\text{J/(mol·K)}\">\\bar R = 8.314462618\\ \\text{J/(mol·K)}<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar h_i\">\\bar h_i<\/span><\/span> は生成エンタルピーを含む絶対値（基準は <span class=\"im\"><span class=\"tx raw\" data-tex=\"298.15\\ \\text{K}\">298.15\\ \\text{K}<\/span><\/span> の元素の標準状態）．標準圧は <span class=\"im\"><span class=\"tx raw\" data-tex=\"p^\\circ = 100\\ \\text{kPa}\">p^\\circ = 100\\ \\text{kPa}<\/span><\/span>．モル内部エネルギーは <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar u_i = \\bar h_i - \\bar R T\">\\bar u_i = \\bar h_i - \\bar R T<\/span><\/span>．原子量は C <span class=\"im\"><span class=\"tx raw\" data-tex=\"12.011\">12.011<\/span><\/span>，H <span class=\"im\"><span class=\"tx raw\" data-tex=\"1.008\">1.008<\/span><\/span>，O <span class=\"im\"><span class=\"tx raw\" data-tex=\"15.999\">15.999<\/span><\/span>，N <span class=\"im\"><span class=\"tx raw\" data-tex=\"14.007\">14.007<\/span><\/span> [g/mol]．<\/li>\n<li><strong>空気<\/strong>（成分 <span class=\"im\"><span class=\"tx raw\" data-tex=\"a\">a<\/span><\/span>）：O<span class=\"im\"><span class=\"tx raw\" data-tex=\"_2\">_2<\/span><\/span> + <span class=\"im\"><span class=\"tx raw\" data-tex=\"3.76\">3.76<\/span><\/span> N<span class=\"im\"><span class=\"tx raw\" data-tex=\"_2\">_2<\/span><\/span> の混合物（Ar は扱わない）．モル質量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"M_a = \\frac{M_{\\text{O}_2} + 3.76\\,M_{\\text{N}_2}}{4.76} = 28.851\\ \\text{g/mol}\">M_a = \\frac{M_{\\text{O}_2} + 3.76\\,M_{\\text{N}_2}}{4.76} = 28.851\\ \\text{g/mol}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"R_a = \\bar R/M_a = 288.19\\ \\text{J/(kg·K)}\">R_a = \\bar R/M_a = 288.19\\ \\text{J/(kg·K)}<\/span><\/span>．<\/li>\n<li><strong>燃料蒸気<\/strong>（成分 <span class=\"im\"><span class=\"tx raw\" data-tex=\"f\">f<\/span><\/span>）：擬似種 C<span class=\"im\"><span class=\"tx raw\" data-tex=\"_{n}\">_{n}<\/span><\/span>H<span class=\"im\"><span class=\"tx raw\" data-tex=\"_{yn}\">_{yn}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"y = 1.87\">y = 1.87<\/span><\/span>（SPEC-07 と同じ），モル質量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"M_f = 110\\ \\text{g/mol}\">M_f = 110\\ \\text{g/mol}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"n = M_f/(12.011 + 1.008y) = 7.916\">n = M_f/(12.011 + 1.008y) = 7.916<\/span><\/span>）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"R_f = \\bar R/M_f = 75.586\\ \\text{J/(kg·K)}\">R_f = \\bar R/M_f = 75.586\\ \\text{J/(kg·K)}<\/span><\/span>．\n<ul>\n<li>比熱：イソオクタンの係数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"a_1\">a_1<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"a_5\">a_5<\/span><\/span> に <span class=\"im\"><span class=\"tx raw\" data-tex=\"M_f/M_{\\text{iso}}\">M_f/M_{\\text{iso}}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"M_{\\text{iso}} = 114.229\\ \\text{g/mol}\">M_{\\text{iso}} = 114.229\\ \\text{g/mol}<\/span><\/span>）を掛ける（質量あたりの比熱がイソオクタンと同じ）．<\/li>\n<li>生成エンタルピー：蒸気の低位発熱量（<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_0 = 298.15\\ \\text{K}\">T_0 = 298.15\\ \\text{K}<\/span><\/span>）が <span class=\"im\"><span class=\"tx raw\" data-tex=\"H_u + h_{fg}\">H_u + h_{fg}<\/span><\/span> になるように <span class=\"im\"><span class=\"tx raw\" data-tex=\"a_6\">a_6<\/span><\/span> を決める．<span class=\"im\"><span class=\"tx raw\" data-tex=\"H_u = 44.0\\ \\text{MJ/kg}\">H_u = 44.0\\ \\text{MJ/kg}<\/span><\/span> は液体の燃料の低位発熱量，<span class=\"im\"><span class=\"tx raw\" data-tex=\"h_{fg} = 350\\ \\text{kJ/kg}\">h_{fg} = 350\\ \\text{kJ/kg}<\/span><\/span> は気化潜熱（SPEC-30）． <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\bar h_f(T_0) = (H_u + h_{fg})\\,M_f + n\\,\\bar h_{\\text{CO}_2}(T_0) + \\frac{yn}{2}\\,\\bar h_{\\text{H}_2\\text{O}}(T_0) = -26.34\\ \\text{kJ/mol}\">\\bar h_f(T_0) = (H_u + h_{fg})\\,M_f + n\\,\\bar h_{\\text{CO}_2}(T_0) + \\frac{yn}{2}\\,\\bar h_{\\text{H}_2\\text{O}}(T_0) = -26.34\\ \\text{kJ/mol}<\/span><\/span><\/li>\n<li>量論空燃比：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{AF}_{st} = \\frac{\\left(1 + \\frac{y}{4}\\right)\\left(M_{\\text{O}_2} + 3.76\\,M_{\\text{N}_2}\\right)}{12.011 + 1.008\\,y} = 14.503\">\\text{AF}_{st} = \\frac{\\left(1 + \\frac{y}{4}\\right)\\left(M_{\\text{O}_2} + 3.76\\,M_{\\text{N}_2}\\right)}{12.011 + 1.008\\,y} = 14.503<\/span><\/span>．「化学種」ではこの値を使う（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma\">\\gamma<\/span><\/span> のモデルは <span class=\"im\"><span class=\"tx raw\" data-tex=\"14.7\">14.7<\/span><\/span> のまま）．<\/li>\n<li>質量あたりの量：<span class=\"im\"><span class=\"tx raw\" data-tex=\"e_k(T) = \\bar u_k(T)/M_k\">e_k(T) = \\bar u_k(T)/M_k<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"h_k(T) = \\bar h_k(T)/M_k\">h_k(T) = \\bar h_k(T)/M_k<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"c_{v,k}(T) = (\\bar c_{p,k}(T) - \\bar R)/M_k\">c_{v,k}(T) = (\\bar c_{p,k}(T) - \\bar R)/M_k<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"k = a, f\">k = a, f<\/span><\/span>．空気は O<span class=\"im\"><span class=\"tx raw\" data-tex=\"_2\">_2<\/span><\/span> と N<span class=\"im\"><span class=\"tx raw\" data-tex=\"_2\">_2<\/span><\/span> のモル分率での和）．<\/li>\n<\/ul><\/li>\n<li><strong>既燃ガス<\/strong>（成分 <span class=\"im\"><span class=\"tx raw\" data-tex=\"b\">b<\/span><\/span>）：既燃ガスのうち燃料に由来する質量の割合を <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\zeta\">\\zeta<\/span><\/span> とする．当量比は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi_b = \\text{AF}_{st}\\,\\frac{\\zeta}{1 - \\zeta}\">\\phi_b = \\text{AF}_{st}\\,\\frac{\\zeta}{1 - \\zeta}<\/span><\/span>．既燃ガス <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\ \\text{kg}\">1\\ \\text{kg}<\/span><\/span> は，空気 <span class=\"im\"><span class=\"tx raw\" data-tex=\"(1 - \\zeta)\\ \\text{kg}\">(1 - \\zeta)\\ \\text{kg}<\/span><\/span> と燃料 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\zeta\\ \\text{kg}\">\\zeta\\ \\text{kg}<\/span><\/span> からできている．燃料のうち <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_c = 0.97\">\\eta_c = 0.97<\/span><\/span>（SPEC-07）が反応に加わり，残り <span class=\"im\"><span class=\"tx raw\" data-tex=\"(1 - \\eta_c)\\zeta\">(1 - \\eta_c)\\zeta<\/span><\/span> は燃料蒸気のまま既燃ガスに含まれる（反応しない）．\n<ul>\n<li>反応に加わる元素の量 [mol/kg]：<span class=\"im\"><span class=\"tx raw\" data-tex=\"b_{\\text{C}} = \\frac{\\eta_c\\zeta n}{M_f}\">b_{\\text{C}} = \\frac{\\eta_c\\zeta n}{M_f}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"b_{\\text{H}} = \\frac{\\eta_c\\zeta yn}{M_f}\">b_{\\text{H}} = \\frac{\\eta_c\\zeta yn}{M_f}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"b_{\\text{O}} = \\frac{2(1 - \\zeta)}{4.76\\,M_a}\">b_{\\text{O}} = \\frac{2(1 - \\zeta)}{4.76\\,M_a}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"b_{\\text{N}} = \\frac{2 \\times 3.76\\,(1 - \\zeta)}{4.76\\,M_a}\">b_{\\text{N}} = \\frac{2 \\times 3.76\\,(1 - \\zeta)}{4.76\\,M_a}<\/span><\/span>．<\/li>\n<li><strong>化学平衡<\/strong>：10 種（CO<span class=\"im\"><span class=\"tx raw\" data-tex=\"_2\">_2<\/span><\/span>，CO，H<span class=\"im\"><span class=\"tx raw\" data-tex=\"_2\">_2<\/span><\/span>O，H<span class=\"im\"><span class=\"tx raw\" data-tex=\"_2\">_2<\/span><\/span>，O<span class=\"im\"><span class=\"tx raw\" data-tex=\"_2\">_2<\/span><\/span>，N<span class=\"im\"><span class=\"tx raw\" data-tex=\"_2\">_2<\/span><\/span>，OH，O，H，NO）の物質量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"n_j\">n_j<\/span><\/span> [mol/kg]（<span class=\"im\"><span class=\"tx raw\" data-tex=\"N = \\sum_j n_j\">N = \\sum_j n_j<\/span><\/span>）を，温度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"T\">T<\/span><\/span> と圧力 <span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span> で Gibbs エネルギー <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"G = \\sum_j n_j\\mu_j, \\qquad \\frac{\\mu_j}{\\bar R T} = \\frac{\\bar h_j - T\\bar s_j^\\circ}{\\bar R T} + \\ln\\frac{n_j}{N} + \\ln\\frac{p}{p^\\circ}\">G = \\sum_j n_j\\mu_j, \\qquad \\frac{\\mu_j}{\\bar R T} = \\frac{\\bar h_j - T\\bar s_j^\\circ}{\\bar R T} + \\ln\\frac{n_j}{N} + \\ln\\frac{p}{p^\\circ}<\/span><\/span> が最小になるように決める．条件は元素の保存 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\sum_j a_{ij}n_j = b_i\">\\sum_j a_{ij}n_j = b_i<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"a_{ij}\">a_{ij}<\/span><\/span>：化学種 <span class=\"im\"><span class=\"tx raw\" data-tex=\"j\">j<\/span><\/span> の 1 分子に含まれる元素 <span class=\"im\"><span class=\"tx raw\" data-tex=\"i\">i<\/span><\/span> の数）．停留の条件は，元素ごとの未定乗数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lambda_i\">\\lambda_i<\/span><\/span> を使って <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{\\mu_j}{\\bar R T} = \\sum_i\\lambda_i a_{ij}\">\\frac{\\mu_j}{\\bar R T} = \\sum_i\\lambda_i a_{ij}<\/span><\/span>．<\/li>\n<li><strong>解法<\/strong>（Gordon と McBride の反復）：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ln n_j\">\\ln n_j<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ln N\">\\ln N<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pi_i\">\\pi_i<\/span><\/span> を未知数とする Newton 法．各回，次の <span class=\"im\"><span class=\"tx raw\" data-tex=\"(n_e + 1)\">(n_e + 1)<\/span><\/span> 元の連立 1 次方程式を解く（<span class=\"im\"><span class=\"tx raw\" data-tex=\"n_e\">n_e<\/span><\/span>：元素の数）． <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\sum_i\\left(\\sum_j a_{kj}a_{ij}n_j\\right)\\pi_i + \\left(\\sum_j a_{kj}n_j\\right)\\Delta\\ln N = b_k - \\sum_j a_{kj}n_j + \\sum_j a_{kj}n_j\\frac{\\mu_j}{\\bar R T} \\quad (k = 1, \\dots, n_e)\">\\sum_i\\left(\\sum_j a_{kj}a_{ij}n_j\\right)\\pi_i + \\left(\\sum_j a_{kj}n_j\\right)\\Delta\\ln N = b_k - \\sum_j a_{kj}n_j + \\sum_j a_{kj}n_j\\frac{\\mu_j}{\\bar R T} \\quad (k = 1, \\dots, n_e)<\/span><\/span> <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\sum_i\\left(\\sum_j a_{ij}n_j\\right)\\pi_i + \\left(\\sum_j n_j - N\\right)\\Delta\\ln N = N - \\sum_j n_j + \\sum_j n_j\\frac{\\mu_j}{\\bar R T}\">\\sum_i\\left(\\sum_j a_{ij}n_j\\right)\\pi_i + \\left(\\sum_j n_j - N\\right)\\Delta\\ln N = N - \\sum_j n_j + \\sum_j n_j\\frac{\\mu_j}{\\bar R T}<\/span><\/span> <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\Delta\\ln n_j = \\Delta\\ln N + \\sum_i a_{ij}\\pi_i - \\frac{\\mu_j}{\\bar R T}\">\\Delta\\ln n_j = \\Delta\\ln N + \\sum_i a_{ij}\\pi_i - \\frac{\\mu_j}{\\bar R T}<\/span><\/span> 更新は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ln n_j \\leftarrow \\ln n_j + \\lambda\\,\\Delta\\ln n
