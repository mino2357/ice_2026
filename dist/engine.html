tx raw\" data-tex=\"= s\\,L_v\">= s\\,L_v<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 0.5\\ \\text{px}\">\\pm 0.5\\ \\text{px}<\/span><\/span> で成り立つ．<\/li>\n<li>[A] 諸元の範囲の端点の組合せ（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lambda \\le 0.5\">\\lambda \\le 0.5<\/span><\/span>）すべてで，全要素の座標が Canvas 内にある．<\/li>\n<li>[A] 吸気ポートと排気ポートの多角形が自己交差しない．<\/li>\n<li>[U] 既定の状態で描くと，吸気ポートの中心線上の 10 点（外端から弁座の直上まで等間隔）の画素がすべて青系（色相 <span class=\"im\"><span class=\"tx raw\" data-tex=\"190\">190<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"250^\\circ\">250^\\circ<\/span><\/span>），排気ポートの 10 点がすべて橙系（色相 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10\">10<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"45^\\circ\">45^\\circ<\/span><\/span>）．<\/li>\n<li>[U] 筒内ガスの色相が <span class=\"im\"><span class=\"tx raw\" data-tex=\"T = 300, 800, 1500, 2500\\ \\text{K}\">T = 300, 800, 1500, 2500\\ \\text{K}<\/span><\/span> に対して単調に変わる．<\/li>\n<li>[A] <code>VALVE HIT<\/code> が出ていない全クランク角で，弁の傘の下面がピストン頂面より上にある．<\/li>\n<\/ol>\n","<h3 id=\"spech123\">TEST-20：検証の基盤（REQ-20，SPEC-20）<\/h3>\n<ol type=\"1\">\n<li>[S] 決定性：S1 と S2 をもう一度実行し，終端の全状態（内部状態を含む）が 1 回目と完全に一致する．<\/li>\n<li>[A] 全テストの実行の前後で，運転中の機関の状態と全設定値が完全に一致する．<\/li>\n<li>[U] TEST-01〜19，21〜28 がすべて実行され，結果を持つ．<\/li>\n<li>[D]（利用者の状態によらない）全即時項目を上限値（選択項目は最後の選択肢），動力計制御，刻み ×10，要リセット項目の保留あり，運転中，の状態で全テストを実行し，28/28 PASS で，実行の直前と直後で機関の状態と全設定値が完全に一致する．<\/li>\n<li>[U] テストの実行中の最長のフレーム間隔が <span class=\"im\"><span class=\"tx raw\" data-tex=\"250\\ \\text{ms}\">250\\ \\text{ms}<\/span><\/span> 以下，総所要時間が <span class=\"im\"><span class=\"tx raw\" data-tex=\"180\\ \\text{s}\">180\\ \\text{s}<\/span><\/span> 以下（第25版までは <span class=\"im\"><span class=\"tx raw\" data-tex=\"120\\ \\text{s}\">120\\ \\text{s}<\/span><\/span>．開発用の計算機の速さが変わると [D] で <span class=\"im\"><span class=\"tx raw\" data-tex=\"120\\ \\text{s}\">120\\ \\text{s}<\/span><\/span> を超えたため，利用者の指示で緩めた．要件定義書 7.3）．<\/li>\n<\/ol>\n","<h3 id=\"spech124\">TEST-21：エンジン音（REQ-21，SPEC-21）<\/h3>\n<ol type=\"1\">\n<li>[A] <span class=\"im\"><span class=\"tx raw\" data-tex=\"c = \\sqrt{\\gamma_b(800)\\,R \\cdot 800}\">c = \\sqrt{\\gamma_b(800)\\,R \\cdot 800}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_1(L = 1) = c/4\">f_1(L = 1) = c/4<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>）．<\/li>\n<li>[A] 位相：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N_a = 800, 1500, 3000\\ \\text{rpm}\">\\bar N_a = 800, 1500, 3000\\ \\text{rpm}<\/span><\/span> 一定で <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\ \\text{s}\">1\\ \\text{s}<\/span><\/span> 合成すると，位相の総進みが <span class=\"im\"><span class=\"tx raw\" data-tex=\"1440\\bar N/120\">1440\\bar N/120<\/span><\/span> と一致（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span>）．<\/li>\n<li>[S] 周期性（サイクル変動 OFF）：S4 の表で，周期が整数サンプルになる <span class=\"im\"><span class=\"tx raw\" data-tex=\"800\">800<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"1500\">1500<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"3000\\ \\text{rpm}\">3000\\ \\text{rpm}<\/span><\/span> について，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\rho_m = 0\">\\rho_m = 0<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.6\">0.6<\/span><\/span> の両方で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"2\">2<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"3\\ \\text{s}\">3\\ \\text{s}<\/span><\/span> の区間の <span class=\"im\"><span class=\"tx raw\" data-tex=\"y_{k + P}\">y_{k + P}<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"y_k\">y_k<\/span><\/span> の差の RMS が出力の RMS の <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-3}\">10^{-3}<\/span><\/span> 未満，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lfloor 1.02P\\rfloor\">\\lfloor 1.02P\\rfloor<\/span><\/span> ずらすと <span class=\"im\"><span class=\"tx raw\" data-tex=\"5\\%\">5\\%<\/span><\/span> 以上違う．<\/li>\n<li>[A] 共鳴：単一パルスの応答で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"L = 1.0\">L = 1.0<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5\\ \\text{m}\">0.5\\ \\text{m}<\/span><\/span> について，<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_1, f_2, f_3\">f_1, f_2, f_3<\/span><\/span> の近く <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 10\\%\">\\pm 10\\%<\/span><\/span> の振幅の最大点が理論値と <span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\%\">2\\%<\/span><\/span> 以内，<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_n\">f_n<\/span><\/span> と隣の極小の振幅の比が理論値の <span class=\"im\"><span class=\"tx raw\" data-tex=\"75\\%\">75\\%<\/span><\/span> 以上．<\/li>\n<li>[S] 表：S3 の最終サイクルから作った表が 1440 点すべて有限，平均の絶対値が最大の <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-6}\">10^{-6}<\/span><\/span> 以下，排気行程の点 <span class=\"im\"><span class=\"tx raw\" data-tex=\"i = 1200\">i = 1200<\/span><\/span> が中心差分の定義と一致．<\/li>\n<li>[A] 表の切替：サイクルの途中で新しい表を送ると，位相が 1 周した瞬間に切り替わり，それまでの出力は切替なしと完全に一致する．<\/li>\n<li>[A] 無音と制限：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N = 0\">\\bar N = 0<\/span><\/span> から始めると出力は厳密に <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"800\\ \\text{rpm}\">800\\ \\text{rpm}<\/span><\/span> から <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> にすると <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5\\ \\text{s}\">0.5\\ \\text{s}<\/span><\/span> 後に <span class=\"im\"><span class=\"tx raw\" data-tex=\"|y| &lt; 10^{-6}\">|y| &lt; 10^{-6}<\/span><\/span>．S5 の表・<span class=\"im\"><span class=\"tx raw\" data-tex=\"6000\\ \\text{rpm}\">6000\\ \\text{rpm}<\/span><\/span>・音量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"100\\%\">100\\%<\/span><\/span> でも <span class=\"im\"><span class=\"tx raw\" data-tex=\"|y| \\le 1\">|y| \\le 1<\/span><\/span> で NaN が無い．音量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> で出力は厳密に <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>．小振幅では出力が音量に比例する（<span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\%\">1\\%<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\%\">2\\%<\/span><\/span> で RMS 比 <span class=\"im\"><span class=\"tx raw\" data-tex=\"2\">2<\/span><\/span>，誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\%\">1\\%<\/span><\/span>）．<\/li>\n<li>[S] 音量の順序：S2（アイドル）の RMS が S4 と S5 のどちらよりも小さく，S5 は S4 の <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.9\">0.9<\/span><\/span> 倍以上．<\/li>\n<li>[U] 送る値：運転中の機関の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N\">\\bar N<\/span><\/span> が送られ，再生速度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.1\\times\">0.1\\times<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\times\">1\\times<\/span><\/span> で同じ値．音 OFF とテストの実行中は <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>．<code>[音]<\/code> のタップで ON／OFF とラベルが切り替わる．<\/li>\n<li>[A]（圧縮器）振幅 <span class=\"im\"><span class=\"tx raw\" data-tex=\"2\">2<\/span><\/span> の正弦の定常のピークが <span class=\"im\"><span class=\"tx raw\" data-tex=\"l_t^{3/4}\\cdot 2^{1/4}\">l_t^{3/4}\\cdot 2^{1/4}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\%\">1\\%<\/span><\/span>），振幅 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.2\">0.2<\/span><\/span> では利得が厳密に <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\">1<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.1 \\to 2\">0.1 \\to 2<\/span><\/span> の段差で出力が上限を超えない，包絡が <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.2\\ \\text{s}\">0.2\\ \\text{s}<\/span><\/span> 保持された後 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.3\\ \\text{s}\">0.3\\ \\text{s}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"1/e\">1/e<\/span><\/span> に減衰する．<\/li>\n<li>[S]（歪まない）W3000 の表・音量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"60\\%\">60\\%<\/span><\/span> で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"|y| &gt; 0.8\">|y| &gt; 0.8<\/span><\/span> のサンプルが <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.1\\%\">0.1\\%<\/span><\/span> 未満．圧縮と制限が定常で波高率を <span class=\"im\"><span class=\"tx raw\" data-tex=\"5\\%\">5\\%<\/span><\/span> を超えて下げない．<\/li>\n<li>[A]（管内の損失）一次の低域フィルタの <span class=\"im\"><span class=\"tx raw\" data-tex=\"|H(1\\ \\text{kHz})|\">|H(1\\ \\text{kHz})|<\/span><\/span> が定義式と一致（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span>），<span class=\"im\"><span class=\"tx raw\" data-tex=\"|H(f)|\">|H(f)|<\/span><\/span> が単調減少で <span class=\"im\"><span class=\"tx raw\" data-tex=\"|H(0)| = 1\">|H(0)| = 1<\/span><\/span>．単一パルスの残響が <span class=\"im\"><span class=\"tx raw\" data-tex=\"40\\ \\text{ms}\">40\\ \\text{ms}<\/span><\/span> 後にピークの <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\%\">1\\%<\/span><\/span> 未満．<\/li>\n<li>[A]（サイクルのばらつき）ON で <span class=\"im\"><span class=\"tx raw\" data-tex=\"10\\ \\text{s}\">10\\ \\text{s}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"1500\\ \\text{rpm}\">1500\\ \\text{rpm}<\/span><\/span>）合成すると，周期の変動係数が <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5\\%\">0.5\\%<\/span><\/span>，振幅係数の変動係数が <span class=\"im\"><span class=\"tx raw\" data-tex=\"3\\%\">3\\%<\/span><\/span>（いずれも <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 25\\%\">\\pm 25\\%<\/span><\/span>），平均の周期が <span class=\"im\"><span class=\"tx raw\" data-tex=\"120/\\bar N\">120/\\bar N<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.2\\%\">0.2\\%<\/span><\/span>）．OFF では周期が一定（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 1\">\\pm 1<\/span><\/span> サンプル）．同じ種で出力が完全に一致し，種が違えば異なる．<\/li>\n<li>[A]（純音らしさの解消）Hann 窓・ちょうど 24 周期で，倍音とその中間のエネルギーの比が，OFF で <span class=\"im\"><span class=\"tx raw\" data-tex=\"100\\ \\text{dB}\">100\\ \\text{dB}<\/span><\/span> 以上，ON で <span class=\"im\"><span class=\"tx raw\" data-tex=\"40\\ \\text{dB}\">40\\ \\text{dB}<\/span><\/span> 以下．<\/li>\n<li>[A]（流れの雑音）<span class=\"im\"><span class=\"tx raw\" data-tex=\"F = 0\">F = 0<\/span><\/span> で出力が雑音なしと完全に一致．包絡 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> では雑音が出ない．雑音の振幅が <span class=\"im\"><span class=\"tx raw\" data-tex=\"F\">F<\/span><\/span> に比例（<span class=\"im\"><span class=\"tx raw\" data-tex=\"20\\%\">20\\%<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"40\\%\">40\\%<\/span><\/span> で RMS 比 <span class=\"im\"><span class=\"tx raw\" data-tex=\"2\">2<\/span><\/span>，誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\%\">2\\%<\/span><\/span>）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"1\">1<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"6\\ \\text{kHz}\">6\\ \\text{kHz}<\/span><\/span> にエネルギーの <span class=\"im\"><span class=\"tx raw\" data-tex=\"70\\%\">70\\%<\/span><\/span> 以上，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5\\ \\text{kHz}\">0.5\\ \\text{kHz}<\/span><\/span> 以下と <span class=\"im\"><span class=\"tx raw\" data-tex=\"12\\ \\text{kHz}\">12\\ \\text{kHz}<\/span><\/span> 以上は各 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10\\%\">10\\%<\/span><\/span> 以下．同じ種で完全に一致．<\/li>\n<li>[S]（流れの雑音）W3000 の表・既定の <span class=\"im\"><span class=\"tx raw\" data-tex=\"F\">F<\/span><\/span> で，雑音の RMS／排気の脈動の RMS が <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.1\">0.1<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.6\">0.6<\/span><\/span>．<\/li>\n<li>[U] 音声の経路：OfflineAudioContext の AudioWorklet で <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5\\ \\text{s}\">0.5\\ \\text{s}<\/span><\/span> 描いた出力が，同じ条件の <code>Synth<\/code> の直接の計算と最大の差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-5}\">10^{-5}<\/span><\/span> 以内（計算と演出の両方）．AudioWorklet が使えない環境では ScriptProcessorNode の代替の経路が作れる．<\/li>\n<li>[S]（演出）既定（計算）の出力は，音の種類と負荷を与えない場合と完全に一致する．演出 → 計算 → 演出と切り替えても NaN を出さない．<\/li>\n<li>[S]（演出：4 気筒化）S4 の表・<span class=\"im\"><span class=\"tx raw\" data-tex=\"1500\\ \\text{rpm}\">1500\\ \\text{rpm}<\/span><\/span>・サイクル変動 OFF・<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ell = 0.5\">\\ell = 0.5<\/span><\/span> で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"2\">2<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"3\\ \\text{s}\">3\\ \\text{s}<\/span><\/span> の出力の <span class=\"im\"><span class=\"tx raw\" data-tex=\"P/4\">P/4<\/span><\/span> ずらしとの正規化相関が <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.8\">0.8<\/span><\/span> 以上，計算では <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5\">0.5<\/span><\/span> 未満．<\/li>\n<li>[S]（演出：負荷）S4 の表・<span class=\"im\"><span class=\"tx raw\" data-tex=\"2000\\ \\text{rpm}\">2000\\ \\text{rpm}<\/span><\/span> で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ell = 1\">\\ell = 1<\/span><\/span> の RMS が <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ell = 0\">\\ell = 0<\/span><\/span> の 2 倍以上で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\ \\text{kHz}\">1\\ \\text{kHz}<\/span><\/span> 以上のエネルギーの割合も大きい（破裂音の起きない回転数で比べる）．<\/li>\n<li>[S]（演出：低音）S2 の表・その回転数・<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ell = 0\">\\ell = 0<\/span><\/span> で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"160\\ \\text{Hz}\">160\\ \\text{Hz}<\/span><\/span> 未満のエネルギーの割合が <span class=\"im\"><span class=\"tx raw\" data-tex=\"60\\%\">60\\%<\/span><\/span> 以上．<\/li>\n<li>[A]（演出：破裂音）<span class=\"im\"><span class=\"tx raw\" data-tex=\"4000\\ \\text{rpm}\">4000\\ \\text{rpm}<\/span><\/span>・<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ell = 0\">\\ell = 0<\/span><\/span> の <span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\ \\text{s}\">2\\ \\text{s}<\/span><\/span> で 1 回以上起き，<span class=\"im\"><span class=\"tx raw\" data-tex=\"4000\\ \\text{rpm}\">4000\\ \\text{rpm}<\/span><\/span>・<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ell = 1\">\\ell = 1<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"1500\\ \\text{rpm}\">1500\\ \\text{rpm}<\/span><\/span>・<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ell = 0\">\\ell = 0<\/span><\/span> では <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> 回．<\/li>\n<li>[A]（演出：無音と制限）<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N = 0\">\\bar N = 0<\/span><\/span> から始めると出力は厳密に <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"800\\ \\text{rpm}\">800\\ \\text{rpm}<\/span><\/span> から <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> にすると <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\ \\text{s}\">1\\ \\text{s}<\/span><\/span> 後に <span class=\"im\"><span class=\"tx raw\" data-tex=\"|y| &lt; 10^{-6}\">|y| &lt; 10^{-6}<\/span><\/span>．S5 の表・<span class=\"im\"><span class=\"tx raw\" data-tex=\"6000\\ \\text{rpm}\">6000\\ \\text{rpm}<\/span><\/span>・音量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"100\\%\">100\\%<\/span><\/span>・<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ell = 1\">\\ell = 1<\/span><\/span> でも <span class=\"im\"><span class=\"tx raw\" data-tex=\"|y| \\le 1\">|y| \\le 1<\/span><\/span>．音量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> で厳密に <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>．同じ種で完全に一致．<\/li>\n<li>[A]（演出：処理時間）<span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\ \\text{s}\">1\\ \\text{s}<\/span><\/span> 分の合成が <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5\\ \\text{s}\">0.5\\ \\text{s}<\/span><\/span> 未満．<\/li>\n<li>[U]（演出：送る値）設定「音響」に「音の種類」があり，送る値に音の種類と <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ell\">\\ell<\/span><\/span> が含まれ，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ell\">\\ell<\/span><\/span> が定義式と一致する（<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{in}}/p_{\\text{atm}} = 0.3, 0.6, 0.9, 1\">p_{\\text{in}}/p_{\\text{atm}} = 0.3, 0.6, 0.9, 1<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"0, 0.5, 1, 1\">0, 0.5, 1, 1<\/span><\/span>）．<\/li>\n<li>[S]（演出：音量の基準）<span class=\"im\"><span class=\"tx raw\" data-tex=\"q_{\\text{ref}}\">q_{\\text{ref}}<\/span><\/span> が，既定の諸元の全開・回転数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"3500\\ \\text{rpm}\">3500\\ \\text{rpm}<\/span><\/span> 固定の定常（45 サイクル目）の単気筒の音源の実効値と <span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\%\">2\\%<\/span><\/span> 以内で一致する．<\/li>\n<\/ol>\n","<h3 id=\"spech125\">TEST-22：制御状態の表示（REQ-22，SPEC-22）<\/h3>\n<ol type=\"1\">\n<li>[U] 停止・始動中・スロットル制御・動力計制御の 4 状態で，カードの文字列に上の表の見出しと量の名前が含まれ，数値が機関の状態と一致する．<\/li>\n<li>[U] スロットル制御で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha = \\alpha_{\\max}\">\\alpha = \\alpha_{\\max}<\/span><\/span> のとき <code>全開<\/code>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha = 0\">\\alpha = 0<\/span><\/span> のとき <code>全閉<\/code>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha = \\alpha_{\\min} &gt; 0\">\\alpha = \\alpha_{\\min} &gt; 0<\/span><\/span> のとき <code>下限<\/code>，動力計制御で <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{cmd}} = 1\">f_{\\text{cmd}} = 1<\/span><\/span> のとき <code>上限<\/code>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> のとき <code>下限<\/code> が表示され，張り付いていないときはどれも表示されない．<code>飽和<\/code> の語を使わない．<\/li>\n<li>[U] 自動最適化 ON では点火の見出しが「自動」，OFF では「固定」．<\/li>\n<li>[U] 最長の表示でもカードの 4 行が折り返さず，運転タブがスクロールしない．<\/li>\n<li>[U] カードに <code>スロットル開度 α<\/code>，<code>動力計の充水率 f<\/code>，<code>点火時期<\/code>，<code>BTDC<\/code> の語が含まれる．<\/li>\n<li>[U]（指標の名称，SPEC-14）全 24 項目のそれぞれについて：既定は記号．その項目のタップでその項目だけが日本語名になり，ほかは記号のまま．もう一度のタップで記号に戻り，さらに 2 回タップしても記号に戻る．どの状態でも名称と値が切れない．<\/li>\n<li>[U]（実機のタップの再現）項目の上で <code>pointerdown<\/code> を送り，表示の更新を挟んでから同じ要素に <code>pointerup<\/code> を送ると，その項目が切り替わる．更新の前後で項目の要素が同一である．<\/li>\n<\/ol>\n","<h3 id=\"spech126\">TEST-23：目標回転数スライダ（REQ-23，SPEC-23）<\/h3>\n<ol type=\"1\">\n<li>[U] 運転タブに帯・つまみ・<code>[−]<\/code>・<code>[＋]<\/code> があり，ボタンとつまみが <span class=\"im\"><span class=\"tx raw\" data-tex=\"44 \\times 44\\ \\text{px}\">44 \\times 44\\ \\text{px}<\/span><\/span> 以上，帯が Canvas の下端に収まり，運転タブがスクロールしない．<\/li>\n<li>[U] つまみを押して動かすと，目標回転数が「つまみの位置の値」（線形に変換して <span class=\"im\"><span class=\"tx raw\" data-tex=\"50\\ \\text{rpm}\">50\\ \\text{rpm}<\/span><\/span> に丸めた値）になり，ソルバの入力とラベルが同じ値になる．左端・右端までドラッグすると <span class=\"im\"><span class=\"tx raw\" data-tex=\"500\">500<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"8000\\ \\text{rpm}\">8000\\ \\text{rpm}<\/span><\/span>．<\/li>\n<li>[U] トラックのつまみ以外の位置のタップと，そこから始めたドラッグでは，目標回転数が変わらない．<\/li>\n<li>[U] <code>[＋]<\/code>・<code>[−]<\/code> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 50\\ \\text{rpm}\">\\pm 50\\ \\text{rpm}<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"8000\\ \\text{rpm}\">8000\\ \\text{rpm}<\/span><\/span> から <code>[＋]<\/code> を 2 回押すと <span class=\"im\"><span class=\"tx raw\" data-tex=\"8100\\ \\text{rpm}\">8100\\ \\text{rpm}<\/span><\/span> で，つまみは右端，ラベルは <code>8100<\/code>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"500\\ \\text{rpm}\">500\\ \\text{rpm}<\/span><\/span> で <code>[−]<\/code> は無効．<\/li>\n<li>[A] 機関断面図の全要素が帯の上端より上にある（既定の諸元と範囲の端点，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta = 0, 180^\\circ\">\\theta = 0, 180^\\circ<\/span><\/span>）．<\/li>\n<\/ol>\n","<h3 id=\"spech127\">TEST-24：内部 EGR と点火時期の妥当性（REQ-24，SPEC-24）<\/h3>\n<p>サイクル変動 OFF，点火の自動最適化 ON，既定の諸元から各条件で <span class=\"im\"><span class=\"tx raw\" data-tex=\"12\\ \\text{s}\">12\\ \\text{s}<\/span><\/span> 積分し，直近のサイクルで判定する．<\/p>\n<ol type=\"1\">\n<li>[S]（軽負荷）スロットル制御，目標 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1500\\ \\text{rpm}\">1500\\ \\text{rpm}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{manual}} = 0.1\">f_{\\text{manual}} = 0.1<\/span><\/span>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta_{\\text{OL}} = 20, 50, 80^\\circ\">\\theta_{\\text{OL}} = 20, 50, 80^\\circ<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r\">x_r<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar Y_{b,\\text{in}}\">\\bar Y_{b,\\text{in}}<\/span><\/span> がともに単調に増え，<span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r(80^\\circ) - x_r(20^\\circ) \\ge 0.10\">x_r(80^\\circ) - x_r(20^\\circ) \\ge 0.10<\/span><\/span>．（実測：<span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r = 0.121, 0.173, 0.310\">x_r = 0.121, 0.173, 0.310<\/span><\/span>）<\/li>\n<li>[S]（部分負荷）スロットル制御，目標 <span class=\"im\"><span class=\"tx raw\" data-tex=\"2000\\ \\text{rpm}\">2000\\ \\text{rpm}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{manual}} = 0.3\">f_{\\text{manual}} = 0.3<\/span><\/span>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta_{\\text{OL}} = 20 \\to 80^\\circ\">\\theta_{\\text{OL}} = 20 \\to 80^\\circ<\/span><\/span> で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r\">x_r<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.04\">0.04<\/span><\/span> 以上増え，PMEP が <span class=\"im\"><span class=\"tx raw\" data-tex=\"4\\ \\text{kPa}\">4\\ \\text{kPa}<\/span><\/span> 以上 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> に近づき，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\max}\">T_{\\max}<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"40\\ \\text{K}\">40\\ \\text{K}<\/span><\/span> 以上下がり，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_b\">\\eta_b<\/span><\/span> が下がらない．（実測：<span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r\">x_r<\/span><\/span> <span class=\"im\"><span class=\"tx raw\" data-tex=\"+0.056\">+0.056<\/span><\/span>，PMEP <span class=\"im\"><span class=\"tx raw\" data-tex=\"-47.7 \\to -36.6\\ \\text{kPa}\">-47.7 \\to -36.6\\ \\text{kPa}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\max}\">T_{\\max}<\/span><\/span> <span class=\"im\"><span class=\"tx raw\" data-tex=\"-59\\ \\text{K}\">-59\\ \\text{K}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_b\">\\eta_b<\/span><\/span> <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.258 \\to 0.265\">0.258 \\to 0.265<\/span><\/span>）<\/li>\n<li>[S]（全開）W3000（動力計制御，全開，目標 <span class=\"im\"><span class=\"tx raw\" data-tex=\"3000\\ \\text{rpm}\">3000\\ \\text{rpm}<\/span><\/span>，定格トルク <span class=\"im\"><span class=\"tx raw\" data-tex=\"200\\ \\text{N·m}\">200\\ \\text{N·m}<\/span><\/span>）：<span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r \\le 0.08\">x_r \\le 0.08<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar Y_{b,\\text{in}} \\le 0.02\">\\bar Y_{b,\\text{in}} \\le 0.02<\/span><\/span>．（実測：<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.054\">0.054<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.003\">0.003<\/span><\/span>）<\/li>\n<li>[S]（アイドル）S2：<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.15 \\le x_r \\le 0.35\">0.15 \\le x_r \\le 0.35<\/span><\/span>．（実測：<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.21\">0.21<\/span><\/span>）<\/li>\n<li>[S]（MBT 点火時期）動力計制御，全開，定格トルク <span class=\"im\"><span class=\"tx raw\" data-tex=\"200\\ \\text{N·m}\">200\\ \\text{N·m}<\/span><\/span>，目標 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1500, 3000, 5000\\ \\text{rpm}\">1500, 3000, 5000\\ \\text{rpm}<\/span><\/span>：MBT 点火時期がいずれも <span class=\"im\"><span class=\"tx raw\" data-tex=\"15\">15<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"35^\\circ\">35^\\circ<\/span><\/span> BTDC で，実際の回転数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N\">\\bar N<\/span><\/span> とともに単調に進角する．全開では動力計の整定が遅く <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N\">\\bar N<\/span><\/span> は目標に届かないので，目標との一致は判定しない．（実測：<span class=\"im\"><span class=\"tx raw\" data-tex=\"1454, 2516, 4298\\ \\text{rpm}\">1454, 2516, 4298\\ \\text{rpm}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"20.7, 24.0, 26.4^\\circ\">20.7, 24.0, 26.4^\\circ<\/span><\/span>）<\/li>\n<li>[S]（火炎発達角）W3000 で，点火から <span class=\"im\"><span class=\"tx raw\" data-tex=\"x_b = 0.1\">x_b = 0.1<\/span><\/span> までが <span class=\"im\"><span class=\"tx raw\" data-tex=\"15\">15<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"35^\\circ\\text{CA}\">35^\\circ\\text{CA}<\/span><\/span>．（実測：<span class=\"im\"><span class=\"tx raw\" data-tex=\"24.8^\\circ\">24.8^\\circ<\/span><\/span>）<\/li>\n<li>[S]（希釈による進角）1 の条件で，MBT 点火時期が <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta_{\\text{OL}} = 80^\\circ\">\\theta_{\\text{OL}} = 80^\\circ<\/span><\/span> のほうが <span class=\"im\"><span class=\"tx raw\" data-tex=\"20^\\circ\">20^\\circ<\/span><\/span> より <span class=\"im\"><span class=\"tx raw\" data-tex=\"2^\\circ\">2^\\circ<\/span><\/span> 以上進む．（実測：<span class=\"im\"><span class=\"tx raw\" data-tex=\"20.7 \\to 23.6^\\circ\">20.7 \\to 23.6^\\circ<\/span><\/span>）<\/li>\n<li>[S] TEST-24 全体の所要時間が <span class=\"im\"><span class=\"tx raw\" data-tex=\"25\\ \\text{s}\">25\\ \\text{s}<\/span><\/span> 以下（TEST-20 の総所要の上限を守るため）．<\/li>\n<\/ol>\n","<h3 id=\"spech128\">TEST-25：吸気ランナの慣性（慣性過給）（REQ-25，SPEC-25）<\/h3>\n<ol type=\"1\">\n<li>[A]（共鳴）吸気弁が閉じた角度で回転を止め，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\zeta = 0\">\\zeta = 0<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{th}} = 0\">\\dot m_{\\text{th}} = 0<\/span><\/span> として <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_r(0) = 10^{-4}\\ \\text{kg/s}\">\\dot m_r(0) = 10^{-4}\\ \\text{kg/s}<\/span><\/span> から積分すると，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_r\">\\dot m_r<\/span><\/span> の振動の周期が <span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\pi/\\omega_H\">2\\pi/\\omega_H<\/span><\/span> と相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\%\">1\\%<\/span><\/span> 以内．<\/li>\n<li>[A]（摩擦）<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{in}} - p_p = \\frac{\\zeta\\dot m_r^2}{2\\rho_r A_r^2}\">p_{\\text{in}} - p_p = \\frac{\\zeta\\dot m_r^2}{2\\rho_r A_r^2}<\/span><\/span> のとき <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{d\\dot m_r}{dt} = 0\">\\frac{d\\dot m_r}{dt} = 0<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{in}} - p_p\">p_{\\text{in}} - p_p<\/span><\/span> を基準に相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span>）．<\/li>\n<li>[S]（OFF）ランナ OFF で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_r\">\\dot m_r<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_p\">p_p<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{b,p}\">m_{b,p}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"E_p\">E_p<\/span><\/span> の時間微分が <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> で，吸気弁の流量が上流圧 <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{in}}\">p_{\\text{in}}<\/span><\/span> で計算される（S2 の定常から 1 サイクルの全ステップ）．<\/li>\n<li>[S]（質量の収支）S3 の定常の直近 5 サイクルで，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M_{\\text{th}}\">M_{\\text{th}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M_r\">M_r<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M_{\\text{in}}\">M_{\\text{in}}<\/span><\/span> の増分が相互に相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\%\">1\\%<\/span><\/span> 以内．全時刻で <span class=\"im\"><span class=\"tx raw\" data-tex=\"0 \\le Y_{b,p} \\le 1\">0 \\le Y_{b,p} \\le 1<\/span><\/span>．<\/li>\n<li>[S]（慣性過給）全開・回転数固定の計測（SPEC-26）で，既定のランナ（<span class=\"im\"><span class=\"tx raw\" data-tex=\"L_r = 450\\ \\text{mm}\">L_r = 450\\ \\text{mm}<\/span><\/span>）の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta\\eta_v(N) = \\eta_{v,\\text{ON}}(N) - \\eta_{v,\\text{OFF}}(N)\">\\Delta\\eta_v(N) = \\eta_{v,\\text{ON}}(N) - \\eta_{v,\\text{OFF}}(N)<\/span><\/span> の最大が <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.02\">0.02<\/span><\/span> 以上．その最大を与える回転数が，<span class=\"im\"><span class=\"tx raw\" data-tex=\"L_r = 900\\ \\text{mm}\">L_r = 900\\ \\text{mm}<\/span><\/span> では <span class=\"im\"><span class=\"tx raw\" data-tex=\"450\\ \\text{mm}\">450\\ \\text{mm}<\/span><\/span> より低い．（実測：<span class=\"im\"><span class=\"tx raw\" data-tex=\"4000 \\to 2500\\ \\text{rpm}\">4000 \\to 2500\\ \\text{rpm}<\/span><\/span>，最大 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.107\">0.107<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.147\">0.147<\/span><\/span>）<\/li>\n<li>[U] 設定ページ「吸気ランナ」に 3 項目があり，全項目の操作で値が変わり，画面がスクロールしない．<\/li>\n<li>[A]（運転中に ON）ランナ OFF で運転中の状態から ON にすると，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_r = 0\">\\dot m_r = 0<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_p = p_{\\text{in}}\">p_p = p_{\\text{in}}<\/span><\/span>（厳密），<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{b,p} = Y_{b,\\text{in}}m_p\">m_{b,p} = Y_{b,\\text{in}}m_p<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"E_p = \\varepsilon_{\\text{in}}m_p\">E_p = \\varepsilon_{\\text{in}}m_p<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>）になる．<\/li>\n<\/ol>\n","<h3 id=\"spech129\">TEST-26：性能曲線タブ（回転数に対する特性の計測）（REQ-26，SPEC-26）<\/h3>\n<ol type=\"1\">\n<li>[U] 6 タブが表示され，タブの文字が切れず，画面の文言に「掃引」が無い．性能曲線タブがスクロールしない．表示のボタン 6 つが <span class=\"im\"><span class=\"tx raw\" data-tex=\"44\\ \\text{px}\">44\\ \\text{px}<\/span><\/span> 以上で文字幅の余裕を満たす．4 つのグラフ表示の全グラフに単位付きの軸名と目盛がある．完了後の状態の表示の 3 行が切れない．<\/li>\n<li>[S]（回転数の保持）各点で角速度が目標と相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span> 以内，サイクルの時間から求めた回転数も目標と相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span> 以内．<\/li>\n<li>[S]（恒等式）各点で <span class=\"im\"><span class=\"tx raw\" data-tex=\"P_b = T_b\\cdot\\frac{2\\pi N}{60}\">P_b = T_b\\cdot\\frac{2\\pi N}{60}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{BMEP}\\cdot V_d = 4\\pi T_b\">\\text{BMEP}\\cdot V_d = 4\\pi T_b<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span>）．<\/li>\n<li>[S]（決定性）同じ設定で 2 回計測した結果が完全に一致する．<\/li>\n<li>[U]（干渉しない）<code>[計測開始]<\/code> から完了までの前後で，運転中の機関の設定と状態が一致し，1 フレームあたりの計算時間の最大が <span class=\"im\"><span class=\"tx raw\" data-tex=\"30\\ \\text{ms}\">30\\ \\text{ms}<\/span><\/span> 以下．（項目 5・6 の画面操作による計測は，刻み <span class=\"im\"><span class=\"tx raw\" data-tex=\"500\\ \\text{rpm}\">500\\ \\text{rpm}<\/span><\/span>・開度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"90^\\circ\">90^\\circ<\/span><\/span>・標準・流量判定 OFF で行う．）<\/li>\n<li>[U]（基準と古さ）2 回目の計測の完了後に基準が描かれ，<code>[基準を消す]<\/code> で消える．計測後に設定を 1 つ変えると古さの表示が出て，再計測で消える．<code>[中止]<\/code> した結果は基準を置き換えない．<\/li>\n<li>[S]（所要時間）既定の計測が <span class=\"im\"><span class=\"tx raw\" data-tex=\"20\\ \\text{s}\">20\\ \\text{s}<\/span><\/span> 以下．<\/li>\n<li>[S]（形）既定設定の全開の曲線で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_b\">T_b<\/span><\/span> の最大が端点以外にあり，<span class=\"im\"><span class=\"tx raw\" data-tex=\"P_b\">P_b<\/span><\/span> の最大を与える回転数が <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_b\">T_b<\/span><\/span> の最大を与える回転数より高く，全点が整定する．<\/li>\n<li>[S]（手順の一致）刻み <span class=\"im\"><span class=\"tx raw\" data-tex=\"1000\\ \\text{rpm}\">1000\\ \\text{rpm}<\/span><\/span>（7 点），開度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"90^\\circ\">90^\\circ<\/span><\/span>，厳格・流量判定 ON で，「上り」「往復」「独立」の結果が，既定設定，ランナ長 <span class=\"im\"><span class=\"tx raw\" data-tex=\"900\\ \\text{mm}\">900\\ \\text{mm}<\/span><\/span>，ランナ OFF のそれぞれで，全点で <span class=\"im\"><span class=\"tx raw\" data-tex=\"|\\Delta T_b| \\le 0.5\\%\\max T_b\">|\\Delta T_b| \\le 0.5\\%\\max T_b<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"|\\Delta\\eta_v| \\le 0.005\">|\\Delta\\eta_v| \\le 0.005<\/span><\/span> で一致する．<\/li>\n<li>[U]（条件）開度のボタンで選んだ集合が計測に使われる開度と一致し（大きい順），最後の 1 つは外せない．刻みのボタンで点数が 241，61，25，13．厳しさ・流量判定・手順のボタンが状態を切り替える．サイクル数の <code>[−]<\/code> <code>[+]<\/code> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"n_{\\min}\">n_{\\min}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"n_{\\max}\">n_{\\max}<\/span><\/span> が 1 刻み変わり，範囲の端と <span class=\"im\"><span class=\"tx raw\" data-tex=\"n_{\\min} \\le n_{\\max}\">n_{\\min} \\le n_{\\max}<\/span><\/span> を超えない．厳しさを選ぶと <span class=\"im\"><span class=\"tx raw\" data-tex=\"n_{\\min}\">n_{\\min}<\/span><\/span> がその初期値（標準 4，厳格 6）になる．どれを変えても計測済みなら古さの表示が出る．全ボタンが <span class=\"im\"><span class=\"tx raw\" data-tex=\"44\\ \\text{px}\">44\\ \\text{px}<\/span><\/span> 以上で，画面がスクロールしない．<\/li>\n<li>[U]（前提）表の数値が定数表と選択・設定値に一致し，表の高さが表示領域の <span class=\"im\"><span class=\"tx raw\" data-tex=\"95\\%\">95\\%<\/span><\/span> 以下．<\/li>\n<li>[S]（開度の重ね描き）既定（<span class=\"im\"><span class=\"tx raw\" data-tex=\"90, 50, 10^\\circ\">90, 50, 10^\\circ<\/span><\/span>）で 3 曲線がそろい（各 25 点），全点で <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_b(10^\\circ) &lt; T_b(50^\\circ)\">T_b(10^\\circ) &lt; T_b(50^\\circ)<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_v(10^\\circ) &lt; \\eta_v(50^\\circ)\">\\eta_v(10^\\circ) &lt; \\eta_v(50^\\circ)<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^\\circ\">10^\\circ<\/span><\/span> の <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_b\">T_b<\/span><\/span> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"1000 &gt; 4000 &gt; 7000\\ \\text{rpm}\">1000 &gt; 4000 &gt; 7000\\ \\text{rpm}<\/span><\/span> の順に小さい．凡例に 3 つの開度があり，プロット領域の中に収まる．9 つの開度すべてを選んでも凡例が収まる．（<span class=\"im\"><span class=\"tx raw\" data-tex=\"50^\\circ\">50^\\circ<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"90^\\circ\">90^\\circ<\/span><\/span> の大小は判定しない．）<\/li>\n<li>[S]（収束の判定）厳格・流量判定 ON の全開の計測で，整定した全点について，記録した幅が判定値以下で，使ったサイクル数が 6 以上．「往復」では完了の表示に往復差が出る．<\/li>\n<li>[U]（前提の即時の反映）計測済みの結果がある状態で「前提」を表示し，カムの種類，最大リフト，IVC，吸気位相を順に変えると，そのたびに（表示を切り替え直さなくても）表の値が変わり，古さの注記が出る．圧縮比を保留にすると保留の注記が出て，表の圧縮比は適用済みの値のまま．2 つの注記が出た状態で表の高さが表示領域の <span class=\"im\"><span class=\"tx raw\" data-tex=\"95\\%\">95\\%<\/span><\/span> 以下．すべて戻すと注記が消える．計測済みの結果が無い状態でも，カムの変更が表に現れる．計測の実行中は見出しが「計測中の設定」になり，実行中に変えたカムは表に現れず，中止すると現れる．<\/li>\n<li>[S]（サイクル数の最少・最多）開度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"90^\\circ\">90^\\circ<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"1000\">1000<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"4000\\ \\text{rpm}\">4000\\ \\text{rpm}<\/span><\/span> の 2 点，厳格・流量判定 ON で，(a) <span class=\"im\"><span class=\"tx raw\" data-tex=\"n_{\\min} = 12\">n_{\\min} = 12<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"n_{\\max} = 60\">n_{\\max} = 60<\/span><\/span> のとき，整定した点の使ったサイクル数が <span class=\"im\"><span class=\"tx raw\" data-tex=\"12\">12<\/span><\/span> 以上，(b) <span class=\"im\"><span class=\"tx raw\" data-tex=\"n_{\\min} = 3\">n_{\\min} = 3<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"n_{\\max} = 4\">n_{\\max} = 4<\/span><\/span> のとき，全点の使ったサイクル数が <span class=\"im\"><span class=\"tx raw\" data-tex=\"4\">4<\/span><\/span> 以下で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"4\">4<\/span><\/span> サイクルで打ち切った「未整定」の点がある（既定の条件では各点が約 7 サイクルで整定するため，打ち切りの規則を確かめるには画面の範囲（<span class=\"im\"><span class=\"tx raw\" data-tex=\"n_{\\max} \\ge 10\">n_{\\max} \\ge 10<\/span><\/span>）より小さい値をコアに直接渡す）．(c) 画面の条件で選んだ <span class=\"im\"><span class=\"tx raw\" data-tex=\"n_{\\min}\">n_{\\min}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"n_{\\max}\">n_{\\max}<\/span><\/span> が計測に渡り，「前提」の表の最少・最多がその値を示す．<\/li>\n<\/ol>\n","<h3 id=\"spech130\">TEST-27：排気系（排気管の脈動と背圧）（REQ-27，SPEC-27）<\/h3>\n<ol type=\"1\">\n<li>[A]（共鳴）排気弁が閉じた角度で回転を止め，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\zeta_x = 0\">\\zeta_x = 0<\/span><\/span>，出口を閉じて <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_e(0) = 10^{-4}\\ \\text{kg/s}\">\\dot m_e(0) = 10^{-4}\\ \\text{kg/s}<\/span><\/span> から積分すると，振動の周期が <span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\pi/\\omega_E\">2\\pi/\\omega_E<\/span><\/span> と相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\%\">1\\%<\/span><\/span> 以内．<\/li>\n<li>[A]（摩擦）<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{pe} - p_m = \\frac{\\zeta_x\\dot m_e^2}{2\\rho_e A_e^2}\">p_{pe} - p_m = \\frac{\\zeta_x\\dot m_e^2}{2\\rho_e A_e^2}<\/span><\/span> のとき <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{d\\dot m_e}{dt} = 0\">\\frac{d\\dot m_e}{dt} = 0<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span>）．<\/li>\n<li>[S]（OFF）排気系 OFF で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_e\">\\dot m_e<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{pe}\">p_{pe}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_m\">p_m<\/span><\/span> の時間微分が <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> で，排気弁の下流圧が <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{atm}} + \\Delta p_{\\text{ex}}\">p_{\\text{atm}} + \\Delta p_{\\text{ex}}<\/span><\/span>．<\/li>\n<li>[S]（質量の収支）S3 の定常の直近 5 サイクルで，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M_{\\text{ex}}\">M_{\\text{ex}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M_e\">M_e<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M_t\">M_t<\/span><\/span> の増分が相互に相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\%\">1\\%<\/span><\/span> 以内．<\/li>\n<li>[S]（背圧）全開・回転数固定の計測で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"5000\\ \\text{rpm}\">5000\\ \\text{rpm}<\/span><\/span> の背圧が <span class=\"im\"><span class=\"tx raw\" data-tex=\"10\">10<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"20\\ \\text{kPa}\">20\\ \\text{kPa}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"1000\">1000<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"5000\\ \\text{rpm}\">5000\\ \\text{rpm}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"500\\ \\text{rpm}\">500\\ \\text{rpm}<\/span><\/span> 刻み）で回転数とともに単調に増える．S2（アイドル）の背圧が <span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\ \\text{kPa}\">2\\ \\text{kPa}<\/span><\/span> 以下．（実測：<span class=\"im\"><span class=\"tx raw\" data-tex=\"13.8\\ \\text{kPa}\">13.8\\ \\text{kPa}<\/span><\/span>，アイドル <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.11\\ \\text{kPa}\">0.11\\ \\text{kPa}<\/span><\/span>）<\/li>\n<li>[S]（脈動）全開・<span class=\"im\"><span class=\"tx raw\" data-tex=\"3000\\ \\text{rpm}\">3000\\ \\text{rpm}<\/span><\/span> で，1 サイクルの排気ポート圧の最大と最小の差が <span class=\"im\"><span class=\"tx raw\" data-tex=\"20\\ \\text{kPa}\">20\\ \\text{kPa}<\/span><\/span> 以上（実測 <span class=\"im\"><span class=\"tx raw\" data-tex=\"93\\ \\text{kPa}\">93\\ \\text{kPa}<\/span><\/span>）．<\/li>\n<li>[U] 設定ページ「排気系」に 4 項目があり，項目の操作で値が変わり，画面がスクロールしない．<\/li>\n<li>[A]（運転中に ON）排気系 OFF で運転中の状態から ON にすると，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_e = 0\">\\dot m_e = 0<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{pe} = p_m = p_{\\text{atm}} + \\Delta p_{\\text{ex}}\">p_{pe} = p_m = p_{\\text{atm}} + \\Delta p_{\\text{ex}}<\/span><\/span>（厳密）になる．<\/li>\n<\/ol>\n","<h3 id=\"spech131\">TEST-28：アイドルの妥当性（REQ-28，SPEC-28）<\/h3>\n<ol type=\"1\">\n<li>[S] S2 の直近 10 サイクル平均で <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.030 \\le \\dot m_f \\le 0.050\\ \\text{g/s}\">0.030 \\le \\dot m_f \\le 0.050\\ \\text{g/s}<\/span><\/span>．（実測：<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.039\">0.039<\/span><\/span>）<\/li>\n<li>[S] 同じく <span class=\"im\"><span class=\"tx raw\" data-tex=\"90 \\le \\text{FMEP} + \\text{AMEP} \\le 130\\ \\text{kPa}\">90 \\le \\text{FMEP} + \\text{AMEP} \\le 130\\ \\text{kPa}<\/span><\/span>．（実測：<span class=\"im\"><span class=\"tx raw\" data-tex=\"56 + 50 = 106\">56 + 50 = 106<\/span><\/span>）<\/li>\n<li>[S] スロットル制御，目標 <span class=\"im\"><span class=\"tx raw\" data-tex=\"2000\\ \\text{rpm}\">2000\\ \\text{rpm}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{manual}} = 0.3\">f_{\\text{manual}} = 0.3<\/span><\/span> の定常で，膨張の指数が <span class=\"im\"><span class=\"tx raw\" data-tex=\"1.20\">1.20<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"1.35\">1.35<\/span><\/span>．（実測：<span class=\"im\"><span class=\"tx raw\" data-tex=\"1.26\">1.26<\/span><\/span>）<\/li>\n<li>[S] 4 の「記録する量」が有限の値として実測欄に出る．（実測：吸気管圧 <span class=\"im\"><span class=\"tx raw\" data-tex=\"26.6\\ \\text{kPa}\">26.6\\ \\text{kPa}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r = 0.21\">x_r = 0.21<\/span><\/span>，排気弁が開く時点の筒内圧 <span class=\"im\"><span class=\"tx raw\" data-tex=\"83\\ \\text{kPa}\">83\\ \\text{kPa}<\/span><\/span>，アイドルの膨張の指数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1.34\">1.34<\/span><\/span>，排気の逆流量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"79\\ \\text{mg}\">79\\ \\text{mg}<\/span><\/span>／サイクル）<\/li>\n<\/ol>\n<hr />\n","<h3 id=\"spech132\">TEST-29：化学種の熱物性と化学平衡（REQ-29，SPEC-29．未実装）<\/h3>\n<ol type=\"1\">\n<li>[A]（物性の値）<span class=\"im\"><span class=\"tx raw\" data-tex=\"R_a = 288.19\">R_a = 288.19<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"R_f = 75.586\\ \\text{J/(kg·K)}\">R_f = 75.586\\ \\text{J/(kg·K)}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{AF}_{st} = 14.503\">\\text{AF}_{st} = 14.503<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{\\bar h_f(T_0) - n\\bar h_{\\text{CO}_2}(T_0) - \\frac{yn}{2}\\bar h_{\\text{H}_2\\text{O}}(T_0)}{M_f} = 44.35\\ \\text{MJ/kg}\">\\frac{\\bar h_f(T_0) - n\\bar h_{\\text{CO}_2}(T_0) - \\frac{yn}{2}\\bar h_{\\text{H}_2\\text{O}}(T_0)}{M_f} = 44.35\\ \\text{MJ/kg}<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-4}\">10^{-4}<\/span><\/span>）．各化学種で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar h_i\">\\bar h_i<\/span><\/span> の中心差分（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 0.01\\ \\text{K}\">\\pm 0.01\\ \\text{K}<\/span><\/span>）が <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar c_{p,i}\">\\bar c_{p,i}<\/span><\/span> に一致し（相対 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-6}\">10^{-6}<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"T = 400, 900, 1500, 2600\\ \\text{K}\">T = 400, 900, 1500, 2600\\ \\text{K}<\/span><\/span>），<span class=\"im\"><span class=\"tx raw\" data-tex=\"1000\\ \\text{K}\">1000\\ \\text{K}<\/span><\/span> の両側で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar h_i\">\\bar h_i<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar s_i^\\circ\">\\bar s_i^\\circ<\/span><\/span> が連続（相対 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-5}\">10^{-5}<\/span><\/span>）．<\/li>\n<li>[A]（平衡定数）<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\log_{10}K_p = -\\frac{\\Delta\\bar g^\\circ}{\\bar R T\\ln 10}\">\\log_{10}K_p = -\\frac{\\Delta\\bar g^\\circ}{\\bar R T\\ln 10}<\/span><\/span>（CO<span class=\"im\"><span class=\"tx raw\" data-tex=\"_2\">_2<\/span><\/span> ⇌ CO + ½O<span class=\"im\"><span class=\"tx raw\" data-tex=\"_2\">_2<\/span><\/span>）が，<span class=\"im\"><span class=\"tx raw\" data-tex=\"2000\">2000<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"2500\">2500<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"3000\\ \\text{K}\">3000\\ \\text{K}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"-2.879\">-2.879<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"-1.433\">-1.433<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"-0.479\">-0.479<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 0.005\">\\pm 0.005<\/span><\/span>）．<\/li>\n<li>[A]（平衡の解）<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_c = 1\">\\eta_c = 1<\/span><\/span> として，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi_b \\in \\{0.7, 1.0, 1.3\\}\">\\phi_b \\in \\{0.7, 1.0, 1.3\\}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T \\in \\{1700, 2500, 3200\\}\\ \\text{K}\">T \\in \\{1700, 2500, 3200\\}\\ \\text{K}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p \\in \\{0.1, 5\\}\\ \\text{MPa}\">p \\in \\{0.1, 5\\}\\ \\text{MPa}<\/span><\/span> で，元素の保存の残差が相対 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span> 以下，停留の条件 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{\\mu_j}{\\bar R T} = \\sum_i\\lambda_i a_{ij}\">\\frac{\\mu_j}{\\bar R T} = \\sum_i\\lambda_i a_{ij}<\/span><\/span> の残差が <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-8}\">10^{-8}<\/span><\/span> 以下．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi_b = 1\">\\phi_b = 1<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"2500\\ \\text{K}\">2500\\ \\text{K}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"5\\ \\text{MPa}\">5\\ \\text{MPa}<\/span><\/span> で CO のモル分率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.01029\">0.01029<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 10^{-5}\">\\pm 10^{-5}<\/span><\/span>），<span class=\"im\"><span class=\"tx raw\" data-tex=\"R_b = 289.58\\ \\text{J/(kg·K)}\">R_b = 289.58\\ \\text{J/(kg·K)}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 0.01\">\\pm 0.01<\/span><\/span>）．定圧断熱火炎温度（反応物 <span class=\"im\"><span class=\"tx raw\" data-tex=\"298.15\\ \\text{K}\">298.15\\ \\text{K}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"101.325\\ \\text{kPa}\">101.325\\ \\text{kPa}<\/span><\/span>，平衡を直接解く）が <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1.0\">\\phi = 1.0<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"2313.7\\ \\text{K}\">2313.7\\ \\text{K}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1.1\">\\phi = 1.1<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"2325.2\\ \\text{K}\">2325.2\\ \\text{K}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 2\\ \\text{K}\">\\pm 2\\ \\text{K}<\/span><\/span>）．<\/li>\n<li>[A]（定容・断熱の燃焼）<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_c = 1\">\\eta_c = 1<\/span><\/span>，凍結なし，表の補間を使って，未燃の混合気（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1.0\">\\phi = 1.0<\/span><\/span>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"T = 690.30\\ \\text{K}\">T = 690.30\\ \\text{K}<\/span><\/span>，比体積 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.09058\\ \\text{m}^3/\\text{kg}\">0.09058\\ \\text{m}^3/\\text{kg}<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1.1\">\\phi = 1.1<\/span><\/span>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"682.90\\ \\text{K}\">682.90\\ \\text{K}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.09016\\ \\text{m}^3/\\text{kg}\">0.09016\\ \\text{m}^3/\\text{kg}<\/span><\/span>）と内部エネルギー・比体積が同じ既燃ガスの状態が，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1.0\">\\phi = 1.0<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"2952\\ \\text{K}\">2952\\ \\text{K}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"9.565\\ \\text{MPa}\">9.565\\ \\text{MPa}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1.1\">\\phi = 1.1<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"2983\\ \\text{K}\">2983\\ \\text{K}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"9.817\\ \\text{MPa}\">9.817\\ \\text{MPa}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 5\\ \\text{K}\">\\pm 5\\ \\text{K}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 0.3\\%\">\\pm 0.3\\%<\/span><\/span>．値は <code>tools/richburn<\/code> の M3／PFI）．<\/li>\n<li>[A]（表の補間）格子の中点（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi_b\">\\phi_b<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T\">T<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ln p\">\\ln p<\/span><\/span> のすべての方向の中点）のうち，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi_b \\in \\{0.725, 1.025, 1.275\\}\">\\phi_b \\in \\{0.725, 1.025, 1.275\\}<\/span><\/span> の全点で，補間の値と平衡を直接解いた値の差が，<span class=\"im\"><span class=\"tx raw\" data-tex=\"e_b\">e_b<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"3\\ \\text{kJ/kg}\">3\\ \\text{kJ/kg}<\/span><\/span> 以下，<span class=\"im\"><span class=\"tx raw\" data-tex=\"R_b\">R_b<\/span><\/span> で相対 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-3}\">10^{-3}<\/span><\/span> 以下．補間した <span class=\"im\"><span class=\"tx raw\" data-tex=\"e_b\">e_b<\/span><\/span> の <span class=\"im\"><span class=\"tx raw\" data-tex=\"T\">T<\/span><\/span> についての中心差分が，補間の式から求めた <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{\\partial e_b}{\\partial T}\">\\frac{\\partial e_b}{\\partial T}<\/span><\/span> に一致（相対 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-6}\">10^{-6}<\/span><\/span>）．この基準は暫定で，実装して実測し，緩めるときは理由をここに書く．<\/li>\n<li>[A]（閉じた断熱の系）<code>EngineCore<\/code> の右辺で，弁を閉じ，熱損失と噴射を無くし，回転数を固定して，圧縮・燃焼・膨張を積分する．<span class=\"im\"><span class=\"tx raw\" data-tex=\"U + \\int p\\,dV\">U + \\int p\\,dV<\/span><\/span> の変化が相対 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-8}\">10^{-8}<\/span><\/span> 以下（許容誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-10}\">10^{-10}<\/span><\/span> の DOPRI5）．<\/li>\n<li>[S]（周期定常の第一法則）S2（アイドル）と，全開・<span class=\"im\"><span class=\"tx raw\" data-tex=\"3000\\ \\text{rpm}\">3000\\ \\text{rpm}<\/span><\/span> で，SPEC-29 B の 8 の残差が <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_f H_u\">m_f H_u<\/span><\/span> の <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-4}\">10^{-4}<\/span><\/span> 以下．<\/li>\n<li>[S]（第25版との一致）熱物性を <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma(T)\">\\gamma(T)<\/span><\/span>，噴射方式をポート噴射にして，S2 の IMEP が第25版の実装の値と相対 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span> 以下で一致（値は実装の直前に第25版で測って定数にする）．<\/li>\n<li>[S]（リッチでの出力増）直噴，全開，点火時期は自動最適化，動力計で回転数を固定（SPEC-26 の計測と同じ手順，厳格）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"2000\">2000<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"4000\\ \\text{rpm}\">4000\\ \\text{rpm}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_b(1.1) &gt; T_b(1.0) &gt; T_b(0.9)\">T_b(1.1) &gt; T_b(1.0) &gt; T_b(0.9)<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi \\in \\{0.9, 1.0, 1.1, 1.2, 1.3\\}\">\\phi \\in \\{0.9, 1.0, 1.1, 1.2, 1.3\\}<\/span><\/span> のうち <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_b\">T_b<\/span><\/span> が最大になるのは <span class=\"im\"><span class=\"tx raw\" data-tex=\"1.1\">1.1<\/span><\/span> か <span class=\"im\"><span class=\"tx raw\" data-tex=\"1.2\">1.2<\/span><\/span>．実測の <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_b\">T_b<\/span><\/span> を記録する．満たさない場合は，係数を調整せず，要件定義書 7.4 節に結果と理由を書く．<\/li>\n<\/ol>\n<hr />\n","<h3 id=\"spech133\">TEST-30：燃料の噴射と気化（REQ-30，SPEC-30．未実装）<\/h3>\n<ol type=\"1\">\n<li>[S]（噴射量と収支）直噴，全開，<span class=\"im\"><span class=\"tx raw\" data-tex=\"3000\\ \\text{rpm}\">3000\\ \\text{rpm}<\/span><\/span> の定常の 1 サイクルで，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\int\\dot m_{\\text{inj}}\\,dt = m_{f,\\text{cmd}}\">\\int\\dot m_{\\text{inj}}\\,dt = m_{f,\\text{cmd}}<\/span><\/span>（相対 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span>），<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\int\\dot m_{\\text{inj}}\\,dt - \\int\\dot m_{\\text{ev}}\\,dt = \\Delta m_l\">\\int\\dot m_{\\text{inj}}\\,dt - \\int\\dot m_{\\text{ev}}\\,dt = \\Delta m_l<\/span><\/span>（同）．筒内の燃料蒸気の収支（気化 ＋ 吸気弁の順流 − 流出 − 燃焼 ＝ <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta m_f\">\\Delta m_f<\/span><\/span>）が相対 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span> で閉じる．<\/li>\n<li>[S]（イベントの角度）噴射の開始と終了で，ステップの終端の角度が <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta_{\\text{SOI}}\">\\theta_{\\text{SOI}}<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta_{\\text{SOI}} + \\Delta\\theta_{\\text{inj}}\">\\theta_{\\text{SOI}} + \\Delta\\theta_{\\text{inj}}<\/span><\/span> に一致（<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-8}\\ \\text{rad}\">10^{-8}\\ \\text{rad}<\/span><\/span>）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"1000\">1000<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"7000\\ \\text{rpm}\">7000\\ \\text{rpm}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta\\theta_{\\text{inj}} = \\frac{\\omega_{\\text{SOI}}m_{f,\\text{cmd}}}{q_{\\text{inj}}}\">\\Delta\\theta_{\\text{inj}} = \\frac{\\omega_{\\text{SOI}}m_{f,\\text{cmd}}}{q_{\\text{inj}}}<\/span><\/span>（相対 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span>．上限と下限に掛からない条件で）．<\/li>\n<li>[A]（潜熱）<code>EngineCore<\/code> の右辺で，弁を閉じ，熱損失を無くし，容積を固定して，<span class=\"im\"><span class=\"tx raw\" data-tex=\"320\\ \\text{K}\">320\\ \\text{K}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"100\\ \\text{kPa}\">100\\ \\text{kPa}<\/span><\/span> の空気に，その質量の <span class=\"im\"><span class=\"tx raw\" data-tex=\"6.45\\%\">6.45\\%<\/span><\/span> の液体の燃料を噴いて全量を気化させる．最後の温度が，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_a e_a(T) + m_f e_f(T) = m_a e_a(320) + m_f\\left[h_f(T_l) - h_{fg}\\right]\">m_a e_a(T) + m_f e_f(T) = m_a e_a(320) + m_f\\left[h_f(T_l) - h_{fg}\\right]<\/span><\/span> の解に一致（<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-6}\\ \\text{K}\">10^{-6}\\ \\text{K}<\/span><\/span>）．<\/li>\n<li>[A]（時定数 0）<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\tau_{\\text{ev}} = 0\">\\tau_{\\text{ev}} = 0<\/span><\/span> で，噴射の間も <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_l = 0\">m_l = 0<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{ev}} = \\dot m_{\\text{inj}}\">\\dot m_{\\text{ev}} = \\dot m_{\\text{inj}}<\/span><\/span>．<\/li>\n<li>[S]（点火の時点の当量比）直噴，全開，<span class=\"im\"><span class=\"tx raw\" data-tex=\"3000\\ \\text{rpm}\">3000\\ \\text{rpm}<\/span><\/span> の定常，設定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi \\in \\{0.9, 1.0, 1.2\\}\">\\phi \\in \\{0.9, 1.0, 1.2\\}<\/span><\/span> で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi_c\">\\phi_c<\/span><\/span> が設定値の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 1\\%\">\\pm 1\\%<\/span><\/span> 以内．<\/li>\n<li>[S]（直噴の冷却）全開，<span class=\"im\"><span class=\"tx raw\" data-tex=\"3000\\ \\text{rpm}\">3000\\ \\text{rpm}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1\">\\phi = 1<\/span><\/span> の定常で，直噴はポート噴射に比べて，IVC の時点の筒内の温度が <span class=\"im\"><span class=\"tx raw\" data-tex=\"10\\ \\text{K}\">10\\ \\text{K}<\/span><\/span> 以上低く，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\hat m_a\">\\hat m_a<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"3\\%\">3\\%<\/span><\/span> 以上多い．実測を記録する（試算の上限は <span class=\"im\"><span class=\"tx raw\" data-tex=\"24.5\\ \\text{K}\">24.5\\ \\text{K}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"+8.0\\%\">+8.0\\%<\/span><\/span>）．<\/li>\n<li>[U] 熱物性を <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma(T)\">\\gamma(T)<\/span><\/span> にすると，噴射方式がポート噴射になり，噴射方式・噴射開始・インジェクタ流量・気化の時定数の行の <code>[−]<\/code> <code>[+]<\/code> と選択が無効．「化学種」に戻すと有効になる．ポート噴射では噴射開始・インジェクタ流量・気化の時定数の行が無効．<\/li>\n<\/ol>\n<hr />\n","<h2 id=\"spech134\">9. 開発時検証 [D]<\/h2>\n<p><code>npm test<\/code> は，成果物をビルドし，ヘッドレス Chromium で次の 7 通りについて全テストを実行する（SPEC-15 A.2，SPEC-20）：<span class=\"im\"><span class=\"tx raw\" data-tex=\"360 \\times 640\">360 \\times 640<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"384 \\times 780\">384 \\times 780<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"412 \\times 915\">412 \\times 915<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"384 \\times 780\">384 \\times 780<\/span><\/span>（極端な利用者状態．TEST-20 項目 4），<span class=\"im\"><span class=\"tx raw\" data-tex=\"820 \\times 1180\">820 \\times 1180<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"1180 \\times 820\">1180 \\times 820<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"1440 \\times 900\">1440 \\times 900<\/span><\/span>（マウス）．7 通りすべてが 28/28 PASS で，極端な利用者状態では実行の前後で状態が一致することを納品条件とする．MathJax は，6 通りでは手元の MathJax 3.2.2（<code>vendor/mathjax-3.2.2/es5/tex-svg.js<\/code>．環境変数 <code>MATHJAX<\/code> で場所を変えられる）を CDN の URL に振り向けて読み込み，極端な利用者状態では読み込みを遮断して TeX の表示で全テストを通す．<\/p>\n"],"toc":[[2,"spech2","0. この文書について"],[2,"spech3","1. 構成"],[2,"spech4","2. 座標系・状態変数・補助積分"],[3,"spech5","2.1 独立変数とクランク角"],[3,"spech6","2.2 状態ベクトル"],[3,"spech7","2.3 補助積分"],[2,"spech8","3. 機関モデル"],[3,"spech9","SPEC-01：スライダ・クランク運動学（REQ-01）"],[3,"spe
