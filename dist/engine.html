/span>，表示と本文の数値は <span class=\"im\"><span class=\"tx raw\" data-tex=\"^\\circ\">^\\circ<\/span><\/span>．クランク角は <span class=\"im\"><span class=\"tx raw\" data-tex=\"^\\circ\\text{CA}\">^\\circ\\text{CA}<\/span><\/span>．点火時期は圧縮上死点より前を正とする <span class=\"im\"><span class=\"tx raw\" data-tex=\"^\\circ\\text{BTDC}\">^\\circ\\text{BTDC}<\/span><\/span>．<\/li>\n<li>回転数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"N\\ [\\text{rpm}]\">N\\ [\\text{rpm}]<\/span><\/span> と角速度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\omega\\ [\\text{rad/s}]\">\\omega\\ [\\text{rad/s}]<\/span><\/span> の関係は <span class=\"im\"><span class=\"tx raw\" data-tex=\"N = \\dfrac{30}{\\pi}\\,\\omega\">N = \\dfrac{30}{\\pi}\\,\\omega<\/span><\/span>．<\/li>\n<li>添字：<span class=\"im\"><span class=\"tx raw\" data-tex=\"u\">u<\/span><\/span> 未燃，<span class=\"im\"><span class=\"tx raw\" data-tex=\"b\">b<\/span><\/span> 既燃，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{in}\">\\text{in}<\/span><\/span> 吸気（マニホールド，吸気弁），<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{ex}\">\\text{ex}<\/span><\/span> 排気弁，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span> 吸気ポート，<span class=\"im\"><span class=\"tx raw\" data-tex=\"pe\">pe<\/span><\/span> 排気ポート，<span class=\"im\"><span class=\"tx raw\" data-tex=\"r\">r<\/span><\/span> 吸気ランナ，<span class=\"im\"><span class=\"tx raw\" data-tex=\"e\">e<\/span><\/span> 排気管，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m\">m<\/span><\/span> 消音器，<span class=\"im\"><span class=\"tx raw\" data-tex=\"t\">t<\/span><\/span> テールパイプ，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{th}\">\\text{th}<\/span><\/span> スロットル，<span class=\"im\"><span class=\"tx raw\" data-tex=\"w\">w<\/span><\/span> 壁，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{atm}\">\\text{atm}<\/span><\/span> 大気，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> 上流のよどみ状態．<\/li>\n<li><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m^+ = \\max(0, \\dot m)\">\\dot m^+ = \\max(0, \\dot m)<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m^- = \\max(0, -\\dot m)\">\\dot m^- = \\max(0, -\\dot m)<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{clamp}(x, a, b) = \\min(b, \\max(a, x))\">\\text{clamp}(x, a, b) = \\min(b, \\max(a, x))<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{md}(a) = a - 4\\pi\\lfloor a/4\\pi\\rfloor \\in [0, 4\\pi)\">\\text{md}(a) = a - 4\\pi\\lfloor a/4\\pi\\rfloor \\in [0, 4\\pi)<\/span><\/span>．<\/li>\n<li><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta\">\\Delta<\/span><\/span> を量の前に付けたときは，指定した区間（多くは 1 サイクル）での増分を表す．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\overline{\\ \\cdot\\ }\">\\overline{\\ \\cdot\\ }<\/span><\/span> はサイクル平均または一次遅れの平均．<\/li>\n<\/ol>\n<hr />\n","<h2 id=\"gloh3\">2. 記号<\/h2>\n","<h3 id=\"gloh4\">2.1 独立変数とクランク角<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>記号<\/th>\n<th>名称<\/th>\n<th>単位<\/th>\n<th>定義<\/th>\n<th>仕様<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"t\">t<\/span><\/span><\/td>\n<td>時間<\/td>\n<td>s<\/td>\n<td>独立変数<\/td>\n<td>2.1<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta\">\\theta<\/span><\/span><\/td>\n<td>クランク角<\/td>\n<td>rad<\/td>\n<td>1 サイクル内の角度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta \\in [0, 4\\pi)\">\\theta \\in [0, 4\\pi)<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta = 0\">\\theta = 0<\/span><\/span>：吸気上死点，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pi\">\\pi<\/span><\/span>：吸気下死点，<span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\pi\">2\\pi<\/span><\/span>：圧縮上死点，<span class=\"im\"><span class=\"tx raw\" data-tex=\"3\\pi\">3\\pi<\/span><\/span>：膨張下死点．サイクルの終端で <span class=\"im\"><span class=\"tx raw\" data-tex=\"4\\pi\">4\\pi<\/span><\/span> を引く<\/td>\n<td>2.1<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","<h3 id=\"gloh5\">2.2 状態ベクトル <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\mathbf{y} \\in \\mathbb{R}^{16}\">\\mathbf{y} \\in \\mathbb{R}^{16}<\/span><\/span><\/h3>\n<p><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dfrac{d\\mathbf{y}}{dt} = \\mathbf{f}(\\mathbf{y}; \\mathbf{u})\">\\dfrac{d\\mathbf{y}}{dt} = \\mathbf{f}(\\mathbf{y}; \\mathbf{u})<\/span><\/span> を時間積分する．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\mathbf{u}\">\\mathbf{u}<\/span><\/span> は入力（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha\">\\alpha<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{eff}}\">f_{\\text{eff}}<\/span><\/span>，点火時期 <span class=\"im\"><span class=\"tx raw\" data-tex=\"s\">s<\/span><\/span> など）で，積分の 1 ステップの間は一定．<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: right;\">#<\/th>\n<th>記号<\/th>\n<th>名称<\/th>\n<th>単位<\/th>\n<th>支配する式<\/th>\n<th>仕様<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: right;\">1<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta\">\\theta<\/span><\/span><\/td>\n<td>クランク角<\/td>\n<td>rad<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dfrac{d\\theta}{dt} = \\omega\">\\dfrac{d\\theta}{dt} = \\omega<\/span><\/span><\/td>\n<td>SPEC-10<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">2<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\omega\">\\omega<\/span><\/span><\/td>\n<td>クランク軸の角速度<\/td>\n<td>rad/s<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"I_{\\text{tot}}\\dfrac{d\\omega}{dt} = T_{\\text{ind}} + T_{\\text{st}} - T_f - T_{\\text{aux}} - T_{\\text{dyno}}\">I_{\\text{tot}}\\dfrac{d\\omega}{dt} = T_{\\text{ind}} + T_{\\text{st}} - T_f - T_{\\text{aux}} - T_{\\text{dyno}}<\/span><\/span><\/td>\n<td>SPEC-10<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">3<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span><\/td>\n<td>筒内圧<\/td>\n<td>Pa<\/td>\n<td>開いた系の第一法則と状態方程式から導く筒内圧の式<\/td>\n<td>SPEC-09<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">4<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"m\">m<\/span><\/span><\/td>\n<td>筒内ガスの全質量<\/td>\n<td>kg<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dfrac{dm}{dt} = \\dot m_{\\text{in}} - \\dot m_{\\text{ex}}\">\\dfrac{dm}{dt} = \\dot m_{\\text{in}} - \\dot m_{\\text{ex}}<\/span><\/span><\/td>\n<td>SPEC-06<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">5<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"m_u\">m_u<\/span><\/span><\/td>\n<td>筒内の未燃ガス（新気）の質量<\/td>\n<td>kg<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dfrac{dm_u}{dt} = \\dot m_{u,\\text{in}} - \\dot m_{u,\\text{ex}} - r\">\\dfrac{dm_u}{dt} = \\dot m_{u,\\text{in}} - \\dot m_{u,\\text{ex}} - r<\/span><\/span><\/td>\n<td>SPEC-06<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">6<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_w\">T_w<\/span><\/span><\/td>\n<td>シリンダ壁の平均温度<\/td>\n<td>K<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"C_{w,\\text{th}}\\dfrac{dT_w}{dt} = \\dot Q_{\\text{wall}} - G_{\\text{cool}}(T_w - T_{\\text{cool}})\">C_{w,\\text{th}}\\dfrac{dT_w}{dt} = \\dot Q_{\\text{wall}} - G_{\\text{cool}}(T_w - T_{\\text{cool}})<\/span><\/span><\/td>\n<td>SPEC-08<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">7<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{in}}\">p_{\\text{in}}<\/span><\/span><\/td>\n<td>吸気マニホールド圧<\/td>\n<td>Pa<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dfrac{dp_{\\text{in}}}{dt} = \\dfrac{RT_{\\text{in}}}{V_{\\text{in}}}(\\dot m_{\\text{th}} - \\dot m_{\\text{dn}})\">\\dfrac{dp_{\\text{in}}}{dt} = \\dfrac{RT_{\\text{in}}}{V_{\\text{in}}}(\\dot m_{\\text{th}} - \\dot m_{\\text{dn}})<\/span><\/span><\/td>\n<td>SPEC-05<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">8<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{b,\\text{in}}\">m_{b,\\text{in}}<\/span><\/span><\/td>\n<td>マニホールド内の既燃ガスの質量<\/td>\n<td>kg<\/td>\n<td>流れが上流側の組成で運ぶ<\/td>\n<td>SPEC-05，25<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">9<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_r\">\\dot m_r<\/span><\/span><\/td>\n<td>吸気ランナの質量流量（マニホールド → ポートが正）<\/td>\n<td>kg/s<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dfrac{d\\dot m_r}{dt} = \\dfrac{A_r}{L_r}(p_{\\text{in}} - p_p) - \\dfrac{\\zeta\\,\\dot m_r\\lvert\\dot m_r\\rvert}{2\\rho_r A_r L_r}\">\\dfrac{d\\dot m_r}{dt} = \\dfrac{A_r}{L_r}(p_{\\text{in}} - p_p) - \\dfrac{\\zeta\\,\\dot m_r\\lvert\\dot m_r\\rvert}{2\\rho_r A_r L_r}<\/span><\/span><\/td>\n<td>SPEC-25<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">10<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p_p\">p_p<\/span><\/span><\/td>\n<td>吸気ポート圧<\/td>\n<td>Pa<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dfrac{dp_p}{dt} = \\dfrac{\\gamma_0 RT_{\\text{in}}}{V_p}(\\dot m_r - \\dot m_{\\text{in}})\">\\dfrac{dp_p}{dt} = \\dfrac{\\gamma_0 RT_{\\text{in}}}{V_p}(\\dot m_r - \\dot m_{\\text{in}})<\/span><\/span><\/td>\n<td>SPEC-25<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">11<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{b,p}\">m_{b,p}<\/span><\/span><\/td>\n<td>吸気ポート内の既燃ガスの質量<\/td>\n<td>kg<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dfrac{dm_{b,p}}{dt} = \\dot m_r Y_r - \\dot m_{\\text{in}}Y_v\">\\dfrac{dm_{b,p}}{dt} = \\dot m_r Y_r - \\dot m_{\\text{in}}Y_v<\/span><\/span><\/td>\n<td>SPEC-25<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">12<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_e\">\\dot m_e<\/span><\/span><\/td>\n<td>排気管の質量流量（ポート → 消音器が正）<\/td>\n<td>kg/s<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dfrac{d\\dot m_e}{dt} = \\dfrac{A_e}{L_e}(p_{pe} - p_m) - \\dfrac{\\zeta_x\\,\\dot m_e\\lvert\\dot m_e\\rvert}{2\\rho_e A_e L_e}\">\\dfrac{d\\dot m_e}{dt} = \\dfrac{A_e}{L_e}(p_{pe} - p_m) - \\dfrac{\\zeta_x\\,\\dot m_e\\lvert\\dot m_e\\rvert}{2\\rho_e A_e L_e}<\/span><\/span><\/td>\n<td>SPEC-27<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">13<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{pe}\">p_{pe}<\/span><\/span><\/td>\n<td>排気ポート圧<\/td>\n<td>Pa<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dfrac{dp_{pe}}{dt} = \\dfrac{\\gamma_0 RT_X}{V_{pe}}(\\dot m_{\\text{ex}} - \\dot m_e)\">\\dfrac{dp_{pe}}{dt} = \\dfrac{\\gamma_0 RT_X}{V_{pe}}(\\dot m_{\\text{ex}} - \\dot m_e)<\/span><\/span><\/td>\n<td>SPEC-27<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">14<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p_m\">p_m<\/span><\/span><\/td>\n<td>消音器の圧力<\/td>\n<td>Pa<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dfrac{dp_m}{dt} = \\dfrac{RT_X}{V_m}(\\dot m_e - \\dot m_t)\">\\dfrac{dp_m}{dt} = \\dfrac{RT_X}{V_m}(\\dot m_e - \\dot m_t)<\/span><\/span><\/td>\n<td>SPEC-27<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">15<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"E_{\\text{in}}\">E_{\\text{in}}<\/span><\/span><\/td>\n<td>マニホールドの余剰エンタルピー<\/td>\n<td>J<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dfrac{dE_{\\text{in}}}{dt} = -\\dot m_r\\varepsilon_r + \\min(0, \\dot m_{\\text{th}})\\,\\varepsilon_{\\text{in}}\">\\dfrac{dE_{\\text{in}}}{dt} = -\\dot m_r\\varepsilon_r + \\min(0, \\dot m_{\\text{th}})\\,\\varepsilon_{\\text{in}}<\/span><\/span>（ランナ ON）<\/td>\n<td>SPEC-05，25<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">16<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"E_p\">E_p<\/span><\/span><\/td>\n<td>吸気ポートの余剰エンタルピー<\/td>\n<td>J<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dfrac{dE_p}{dt} = \\dot m_r\\varepsilon_r - \\dot m_{\\text{in}}^+\\varepsilon_p + \\dot X_o\">\\dfrac{dE_p}{dt} = \\dot m_r\\varepsilon_r - \\dot m_{\\text{in}}^+\\varepsilon_p + \\dot X_o<\/span><\/span><\/td>\n<td>SPEC-25<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","<h3 id=\"gloh6\">2.3 補助積分 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\mathbf{z} \\in \\mathbb{R}^{22}\">\\mathbf{z} \\in \\mathbb{R}^{22}<\/span><\/span><\/h3>\n<p>状態と同じ Runge–Kutta の重みで同時に積分する量．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\mathbf{f}\">\\mathbf{f}<\/span><\/span> には現れない．サイクルの集計と保存則の検査に使う．<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>記号<\/th>\n<th>名称<\/th>\n<th>単位<\/th>\n<th>定義<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"W\">W<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"W_g\">W_g<\/span><\/span><\/td>\n<td>図示仕事（正味），圧縮・膨張行程の図示仕事<\/td>\n<td>J<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"W = \\displaystyle\\int p\\,\\frac{dV}{d\\theta}\\,\\omega\\,dt\">W = \\displaystyle\\int p\\,\\frac{dV}{d\\theta}\\,\\omega\\,dt<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"W_g\">W_g<\/span><\/span> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pi \\le \\theta &lt; 3\\pi\">\\pi \\le \\theta &lt; 3\\pi<\/span><\/span> の間だけ積分<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"W_f\">W_f<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"W_a\">W_a<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"W_d\">W_d<\/span><\/span><\/td>\n<td>摩擦・補機・動力計の仕事<\/td>\n<td>J<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\displaystyle\\int T_f\\,\\omega\\,dt\">\\displaystyle\\int T_f\\,\\omega\\,dt<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\displaystyle\\int T_{\\text{aux}}\\,\\omega\\,dt\">\\displaystyle\\int T_{\\text{aux}}\\,\\omega\\,dt<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\displaystyle\\int T_{\\text{dyno}}\\,\\omega\\,dt\">\\displaystyle\\int T_{\\text{dyno}}\\,\\omega\\,dt<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"M_{\\text{th}}\">M_{\\text{th}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M_r\">M_r<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M_{\\text{in}}\">M_{\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M_{\\text{ex}}\">M_{\\text{ex}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M_e\">M_e<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M_t\">M_t<\/span><\/span><\/td>\n<td>各断面を通った質量<\/td>\n<td>kg<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"M_k = \\displaystyle\\int\\dot m_k\\,dt\">M_k = \\displaystyle\\int\\dot m_k\\,dt<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"B_o\">B_o<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"B_i\">B_i<\/span><\/span><\/td>\n<td>吸気弁から吹き返した既燃ガス，戻った既燃ガス<\/td>\n<td>kg<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\displaystyle\\int\\dot m_{\\text{in}}^-(1 - Y_u)\\,dt\">\\displaystyle\\int\\dot m_{\\text{in}}^-(1 - Y_u)\\,dt<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\displaystyle\\int\\dot m_{\\text{in}}^+ Y_{b,\\text{src}}\\,dt\">\\displaystyle\\int\\dot m_{\\text{in}}^+ Y_{b,\\text{src}}\\,dt<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"X_o\">X_o<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"X_i\">X_i<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"X_t\">X_t<\/span><\/span><\/td>\n<td>吹き返しが運んだ余剰エンタルピー，順流で筒内へ戻った分，スロットルの逆流で出た分<\/td>\n<td>J<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\displaystyle\\int\\dot X_o\\,dt\">\\displaystyle\\int\\dot X_o\\,dt<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\displaystyle\\int\\dot m_{\\text{in}}^+\\varepsilon_{\\text{src}}\\,dt\">\\displaystyle\\int\\dot m_{\\text{in}}^+\\varepsilon_{\\text{src}}\\,dt<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\displaystyle\\int\\dot m_{\\text{th}}^-\\varepsilon_{\\text{in}}\\,dt\">\\displaystyle\\int\\dot m_{\\text{th}}^-\\varepsilon_{\\text{in}}\\,dt<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"Q_c\">Q_c<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"Q_w\">Q_w<\/span><\/span><\/td>\n<td>発熱，壁への熱<\/td>\n<td>J<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\displaystyle\\int\\dot Q_{\\text{comb}}\\,dt\">\\displaystyle\\int\\dot Q_{\\text{comb}}\\,dt<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\displaystyle\\int\\dot Q_{\\text{wall}}\\,dt\">\\displaystyle\\int\\dot Q_{\\text{wall}}\\,dt<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"H_i\">H_i<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"H_o\">H_o<\/span><\/span><\/td>\n<td>筒内へ入った／筒内から出た顕熱エンタルピー<\/td>\n<td>J<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\displaystyle\\int\\dot H^s_{\\text{in}}\\,dt\">\\displaystyle\\int\\dot H^s_{\\text{in}}\\,dt<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\displaystyle\\int\\dot H^s_{\\text{out}}\\,dt\">\\displaystyle\\int\\dot H^s_{\\text{out}}\\,dt<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"P_m\">P_m<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Upsilon\">\\Upsilon<\/span><\/span><\/td>\n<td>背圧と吸気管既燃率の時間積分<\/td>\n<td>Pa·s，s<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\displaystyle\\int p_m\\,dt\">\\displaystyle\\int p_m\\,dt<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\displaystyle\\int Y_{b,\\text{in}}\\,dt\">\\displaystyle\\int Y_{b,\\text{in}}\\,dt<\/span><\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","<h3 id=\"gloh7\">2.4 幾何（スライダ・クランク機構と弁）<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>記号<\/th>\n<th>名称<\/th>\n<th>単位<\/th>\n<th>定義<\/th>\n<th>仕様<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"B\">B<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"S\">S<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"l\">l<\/span><\/span><\/td>\n<td>ボア，ストローク，連桿長<\/td>\n<td>m<\/td>\n<td>設定<\/td>\n<td>SPEC-01<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"r\">r<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lambda\">\\lambda<\/span><\/span><\/td>\n<td>クランク半径，連桿比<\/td>\n<td>m，–<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"r = S/2\">r = S/2<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lambda = r/l\">\\lambda = r/l<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lambda \\le 0.5\">\\lambda \\le 0.5<\/span><\/span>）<\/td>\n<td>SPEC-01<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon\">\\varepsilon<\/span><\/span><\/td>\n<td>圧縮比<\/td>\n<td>–<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon = \\dfrac{V_c + V_d}{V_c}\">\\varepsilon = \\dfrac{V_c + V_d}{V_c}<\/span><\/span><\/td>\n<td>SPEC-01<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"A_p\">A_p<\/span><\/span><\/td>\n<td>ピストン頂面の面積<\/td>\n<td>m²<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"A_p = \\dfrac{\\pi B^2}{4}\">A_p = \\dfrac{\\pi B^2}{4}<\/span><\/span><\/td>\n<td>SPEC-01<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"V_d\">V_d<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"V_c\">V_c<\/span><\/span><\/td>\n<td>行程容積，隙間容積<\/td>\n<td>m³<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"V_d = A_p S\">V_d = A_p S<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"V_c = \\dfrac{V_d}{\\varepsilon - 1}\">V_c = \\dfrac{V_d}{\\varepsilon - 1}<\/span><\/span><\/td>\n<td>SPEC-01<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"x(\\theta)\">x(\\theta)<\/span><\/span><\/td>\n<td>上死点からのピストン変位<\/td>\n<td>m<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"x = r\\left[(1 - \\cos\\theta) + \\dfrac{1}{\\lambda}\\left(1 - \\sqrt{1 - \\lambda^2\\sin^2\\theta}\\right)\\right]\">x = r\\left[(1 - \\cos\\theta) + \\dfrac{1}{\\lambda}\\left(1 - \\sqrt{1 - \\lambda^2\\sin^2\\theta}\\right)\\right]<\/span><\/span><\/td>\n<td>SPEC-01<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"V(\\theta)\">V(\\theta)<\/span><\/span><\/td>\n<td>筒内容積<\/td>\n<td>m³<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"V = V_c + A_p\\,x(\\theta)\">V = V_c + A_p\\,x(\\theta)<\/span><\/span><\/td>\n<td>SPEC-01<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"h_c\">h_c<\/span><\/span><\/td>\n<td>等価な隙間の高さ<\/td>\n<td>m<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"h_c = V_c/A_p\">h_c = V_c/A_p<\/span><\/span><\/td>\n<td>SPEC-01<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"A_w(\\theta)\">A_w(\\theta)<\/span><\/span><\/td>\n<td>伝熱面積<\/td>\n<td>m²<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"A_w = \\dfrac{\\pi B^2}{2} + \\pi B\\,(x + h_c)\">A_w = \\dfrac{\\pi B^2}{2} + \\pi B\\,(x + h_c)<\/span><\/span><\/td>\n<td>SPEC-01<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"c_m\">c_m<\/span><\/span><\/td>\n<td>平均ピストン速度<\/td>\n<td>m/s<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"c_m = \\dfrac{S\\omega}{\\pi}\">c_m = \\dfrac{S\\omega}{\\pi}<\/span><\/span><\/td>\n<td>SPEC-07，10<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"L_v\">L_v<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"L_{\\max}\">L_{\\max}<\/span><\/span><\/td>\n<td>弁リフト，最大リフト<\/td>\n<td>m<\/td>\n<td>カムの種類ごとの関数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"L_v = L_{\\max}\\,g(\\xi)\">L_v = L_{\\max}\\,g(\\xi)<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\xi = \\delta/\\Delta\\theta_{\\text{cam}}\">\\xi = \\delta/\\Delta\\theta_{\\text{cam}}<\/span><\/span><\/td>\n<td>SPEC-03<\/td>\n<\/tr>\n<tr>\n<td>IVO，IVC，EVO，EVC<\/td>\n<td>吸気弁の開・閉，排気弁の開・閉の時期<\/td>\n<td>rad<\/td>\n<td>設定（位相 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varphi\">\\varphi<\/span><\/span> を加える前の基本の時期）<\/td>\n<td>SPEC-03<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varphi_{\\text{in}}\">\\varphi_{\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varphi_{\\text{ex}}\">\\varphi_{\\text{ex}}<\/span><\/span><\/td>\n<td>カムの位相（正が遅角）<\/td>\n<td>rad<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"L_v(\\theta; \\varphi) = L_v(\\theta - \\varphi; 0)\">L_v(\\theta; \\varphi) = L_v(\\theta - \\varphi; 0)<\/span><\/span><\/td>\n<td>SPEC-03<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"A_{\\text{eff}}\">A_{\\text{eff}}<\/span><\/span><\/td>\n<td>弁の有効開口面積<\/td>\n<td>m²<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"A_{\\text{eff}} = C_d\\min\\left(\\pi d_v L_v,\\ \\dfrac{\\pi}{4}d_v^2\\right)\">A_{\\text{eff}} = C_d\\min\\left(\\pi d_v L_v,\\ \\dfrac{\\pi}{4}d_v^2\\right)<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"C_d = 0.6\">C_d = 0.6<\/span><\/span><\/td>\n<td>SPEC-03<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta_{\\text{OL}}\">\\theta_{\\text{OL}}<\/span><\/span><\/td>\n<td>オーバーラップ角<\/td>\n<td>rad<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta_{\\text{OL}} = \\text{EVC} - (\\text{IVO} + 4\\pi)\">\\theta_{\\text{OL}} = \\text{EVC} - (\\text{IVO} + 4\\pi)<\/span><\/span><\/td>\n<td>SPEC-24<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","<h3 id=\"gloh8\">2.5 熱力学と物性<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>記号<\/th>\n<th>名称<\/th>\n<th>単位<\/th>\n<th>定義<\/th>\n<th>仕様<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"R\">R<\/span><\/span><\/td>\n<td>気体定数（未燃・既燃で共通）<\/td>\n<td>J/(kg·K)<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"R = 287.0\">R = 287.0<\/span><\/span><\/td>\n<td>SPEC-02<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T\">T<\/span><\/span><\/td>\n<td>筒内ガスの平均温度<\/td>\n<td>K<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T = \\dfrac{pV}{mR}\">T = \\dfrac{pV}{mR}<\/span><\/span><\/td>\n<td>2.2<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_u\">Y_u<\/span><\/span><\/td>\n<td>未燃分率<\/td>\n<td>–<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_u = \\text{clamp}\\left(\\dfrac{m_u}{m}, 0, 1\\right)\">Y_u = \\text{clamp}\\left(\\dfrac{m_u}{m}, 0, 1\\right)<\/span><\/span><\/td>\n<td>2.2<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r\">x_r<\/span><\/span><\/td>\n<td>残留ガス率（既燃分率）<\/td>\n<td>–<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r = 1 - Y_u\">x_r = 1 - Y_u<\/span><\/span>（性能の指標としては吸気弁が閉じた時点の値）<\/td>\n<td>2.2，SPEC-14<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_u\">\\gamma_u<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_b\">\\gamma_b<\/span><\/span><\/td>\n<td>未燃ガス・既燃ガスの比熱比<\/td>\n<td>–<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_u = 1.3488 - 13.0 \\times 10^{-5}(\\min(T, 1000) - 300)\">\\gamma_u = 1.3488 - 13.0 \\times 10^{-5}(\\min(T, 1000) - 300)<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_b = 1.3678 - 9.4 \\times 10^{-5}(\\min(T, 2700) - 300)\">\\gamma_b = 1.3678 - 9.4 \\times 10^{-5}(\\min(T, 2700) - 300)<\/span><\/span><\/td>\n<td>SPEC-02<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"c_{v,k}\">c_{v,k}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"c_{p,k}\">c_{p,k}<\/span><\/span><\/td>\n<td>定積比熱，定圧比熱（<span class=\"im\"><span class=\"tx raw\" data-tex=\"k = u, b\">k = u, b<\/span><\/span>）<\/td>\n<td>J/(kg·K)<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"c_{v,k} = \\dfrac{R}{\\gamma_k - 1}\">c_{v,k} = \\dfrac{R}{\\gamma_k - 1}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"c_{p,k} = c_{v,k} + R\">c_{p,k} = c_{v,k} + R<\/span><\/span><\/td>\n<td>SPEC-02<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"c_v\">c_v<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma\">\\gamma<\/span><\/span><\/td>\n<td>混合気の定積比熱と比熱比<\/td>\n<td>J/(kg·K)，–<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"c_v = Y c_{v,u} + (1 - Y)c_{v,b}\">c_v = Y c_{v,u} + (1 - Y)c_{v,b}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma = 1 + \\dfrac{R}{c_v}\">\\gamma = 1 + \\dfrac{R}{c_v}<\/span><\/span><\/td>\n<td>SPEC-02<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_0\">T_0<\/span><\/span><\/td>\n<td>内部エネルギーの基準温度<\/td>\n<td>K<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_0 = 298.15\">T_0 = 298.15<\/span><\/span>（SPEC-04 では上流のよどみ温度も <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_0\">T_0<\/span><\/span> と書く）<\/td>\n<td>SPEC-02<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"e_k\">e_k<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"h_k\">h_k<\/span><\/span><\/td>\n<td>顕熱の内部エネルギー，顕熱エンタルピー<\/td>\n<td>J/kg<\/t
