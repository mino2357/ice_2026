\/span>（対称型では絶対値の最大）とする．<\/p>\n<ol type=\"1\">\n<li><strong>固定型<\/strong>：範囲は定数．<\/li>\n<li><strong>諸元連動型<\/strong>：範囲は設定値から決まる（例：<span class=\"im\"><span class=\"tx raw\" data-tex=\"V\">V<\/span><\/span> 軸の上限は <span class=\"im\"><span class=\"tx raw\" data-tex=\"V_c + V_d\">V_c + V_d<\/span><\/span> 以上で最小の目盛の倍数）．<\/li>\n<li><strong>段階型<\/strong>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"[0, F]\">[0, F]<\/span><\/span> または対称の <span class=\"im\"><span class=\"tx raw\" data-tex=\"[-F, F]\">[-F, F]<\/span><\/span>）：<span class=\"im\"><span class=\"tx raw\" data-tex=\"F \\in \\Lambda\">F \\in \\Lambda<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"F_{\\min} \\le F \\le F_{\\max}\">F_{\\min} \\le F \\le F_{\\max}<\/span><\/span>．\n<ul>\n<li>拡大：<span class=\"im\"><span class=\"tx raw\" data-tex=\"M &gt; F\">M &gt; F<\/span><\/span> になったら直ちに <span class=\"im\"><span class=\"tx raw\" data-tex=\"F \\leftarrow \\min\\{F&#x27; \\in \\Lambda : F&#x27; \\ge 1.1M\\}\">F \\leftarrow \\min\\{F&#x27; \\in \\Lambda : F&#x27; \\ge 1.1M\\}<\/span><\/span>．<\/li>\n<li>縮小：<span class=\"im\"><span class=\"tx raw\" data-tex=\"M &lt; 0.4F\">M &lt; 0.4F<\/span><\/span> が実時間で <span class=\"im\"><span class=\"tx raw\" data-tex=\"3\\ \\text{s}\">3\\ \\text{s}<\/span><\/span> 続いたら <span class=\"im\"><span class=\"tx raw\" data-tex=\"F \\leftarrow \\max\\left(F_{\\min},\\ \\min\\{F&#x27; \\in \\Lambda : F&#x27; \\ge 1.25M\\}\\right)\">F \\leftarrow \\max\\left(F_{\\min},\\ \\min\\{F&#x27; \\in \\Lambda : F&#x27; \\ge 1.25M\\}\\right)<\/span><\/span>．<\/li>\n<li>縮小の後は <span class=\"im\"><span class=\"tx raw\" data-tex=\"M \\le 0.8F\">M \\le 0.8F<\/span><\/span> なので直後に拡大せず，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M\">M<\/span><\/span> が一定なら範囲は高々 1 回の変更で動かなくなる．<\/li>\n<li>コールドリセットと要リセット項目の適用で既定値 <span class=\"im\"><span class=\"tx raw\" data-tex=\"F_0\">F_0<\/span><\/span> に戻す．<\/li>\n<\/ul><\/li>\n<li><strong>帯域型<\/strong> <span class=\"im\"><span class=\"tx raw\" data-tex=\"[a, b]\">[a, b]<\/span><\/span>（平均のまわりの小さな変動を見る量）：刻み <span class=\"im\"><span class=\"tx raw\" data-tex=\"s \\in \\Lambda\">s \\in \\Lambda<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"s \\ge s_{\\min}\">s \\ge s_{\\min}<\/span><\/span>）に対し <span class=\"im\"><span class=\"tx raw\" data-tex=\"a = s\\lfloor m_-/s\\rfloor\">a = s\\lfloor m_-/s\\rfloor<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"b = s\\lceil m_+/s\\rceil\">b = s\\lceil m_+/s\\rceil<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_\\pm\">m_\\pm<\/span><\/span>：データの最小・最大に幅の <span class=\"im\"><span class=\"tx raw\" data-tex=\"10\\%\">10\\%<\/span><\/span> の余裕を付けた値）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"s\">s<\/span><\/span> は区間の数が 8 以下になる最小の値とし，4 未満なら下・上の順に <span class=\"im\"><span class=\"tx raw\" data-tex=\"s\">s<\/span><\/span> ずつ広げて 4 にする．データが <span class=\"im\"><span class=\"tx raw\" data-tex=\"[a, b]\">[a, b]<\/span><\/span> を出たら直ちに，占有率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"(M - m)/(b - a) &lt; 0.25\">(M - m)/(b - a) &lt; 0.25<\/span><\/span> が <span class=\"im\"><span class=\"tx raw\" data-tex=\"3\\ \\text{s}\">3\\ \\text{s}<\/span><\/span> 続いたときにも，計算し直す．<\/li>\n<li>範囲が切り替わったら，新しい目盛の数値を <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\ \\text{s}\">1\\ \\text{s}<\/span><\/span> 強調して表示する．段階型の切替は軸ごとに <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\ \\text{s}\">1\\ \\text{s}<\/span><\/span> あたり高々 1 回とする（その間に必要になった切替は <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\ \\text{s}\">1\\ \\text{s}<\/span><\/span> たってから行う）．<\/li>\n<\/ol>\n<h4 id=\"spech77\">C. 各軸の割当<\/h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>グラフ<\/th>\n<th>軸<\/th>\n<th>方式<\/th>\n<th>既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"F_0\">F_0<\/span><\/span>／範囲<\/th>\n<th><span class=\"im\"><span class=\"tx raw\" data-tex=\"F_{\\min}\">F_{\\min}<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"F_{\\max}\">F_{\\max}<\/span><\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① <span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>-<span class=\"im\"><span class=\"tx raw\" data-tex=\"V\">V<\/span><\/span>（線形）<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"V\\ [\\text{cm}^3]\">V\\ [\\text{cm}^3]<\/span><\/span><\/td>\n<td>諸元連動<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"(V_c + V_d)\">(V_c + V_d)<\/span><\/span> 以上の目盛の倍数（既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"600\">600<\/span><\/span>）<\/td>\n<td>–<\/td>\n<\/tr>\n<tr>\n<td>①② と設定画面<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p\\ [\\text{kPa}]\">p\\ [\\text{kPa}]<\/span><\/span>（共有）<\/td>\n<td>段階・0 起点<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"5000\">5000<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"500\">500<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"50000\">50000<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>① <span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>-<span class=\"im\"><span class=\"tx raw\" data-tex=\"V\">V<\/span><\/span>（両対数）<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"V\">V<\/span><\/span><\/td>\n<td>10 の整数乗の区間<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"10\">10<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^4\">10^4<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"V\">V<\/span><\/span>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"V_c\">V_c<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"V_c + V_d\">V_c + V_d<\/span><\/span> を含む最小の区間<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span> の上限 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^5\">10^5<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>②<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T\\ [\\text{K}]\">T\\ [\\text{K}]<\/span><\/span><\/td>\n<td>段階・0 起点<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"3000\">3000<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"3000\">3000<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"5000\">5000<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>②<\/td>\n<td>熱発生率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"[\\text{J}/^\\circ\\text{CA}]\">[\\text{J}/^\\circ\\text{CA}]<\/span><\/span><\/td>\n<td>段階・0 起点<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"100\">100<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"10\">10<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"1000\">1000<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>③<\/td>\n<td>リフト <span class=\"im\"><span class=\"tx raw\" data-tex=\"[\\text{mm}]\">[\\text{mm}]<\/span><\/span><\/td>\n<td>諸元連動<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"L_{\\max}\">L_{\\max}<\/span><\/span> 以上の目盛の倍数（既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10\">10<\/span><\/span>）<\/td>\n<td>–<\/td>\n<\/tr>\n<tr>\n<td>③<\/td>\n<td>弁の質量流量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"[\\text{g/s}]\">[\\text{g/s}]<\/span><\/span><\/td>\n<td>段階・対称<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"200\">200<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"20\">20<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"2000\">2000<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>④<\/td>\n<td>筒内質量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"[\\text{mg}]\">[\\text{mg}]<\/span><\/span><\/td>\n<td>段階・0 起点<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"1000\">1000<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"100\">100<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"5000\">5000<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>④⑥<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{in}}\\ [\\text{kPa}]\">p_{\\text{in}}\\ [\\text{kPa}]<\/span><\/span><\/td>\n<td>固定<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"120\">120<\/span><\/span><\/td>\n<td>–<\/td>\n<\/tr>\n<tr>\n<td>④<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{th}}\\ [\\text{g/s}]\">\\dot m_{\\text{th}}\\ [\\text{g/s}]<\/span><\/span><\/td>\n<td>段階・0 起点<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"20\">20<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"1\">1<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"100\">100<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>⑤<\/td>\n<td>トルク <span class=\"im\"><span class=\"tx raw\" data-tex=\"[\\text{N·m}]\">[\\text{N·m}]<\/span><\/span><\/td>\n<td>段階・対称<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"500\">500<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"50\">50<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"5000\">5000<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>⑤<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"N(\\theta)\\ [\\text{rpm}]\">N(\\theta)\\ [\\text{rpm}]<\/span><\/span><\/td>\n<td>帯域<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"s_{\\min} = 10\">s_{\\min} = 10<\/span><\/span><\/td>\n<td>–<\/td>\n<\/tr>\n<tr>\n<td>⑤<\/td>\n<td>ピストン速度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"[\\text{m/s}]\">[\\text{m/s}]<\/span><\/span><\/td>\n<td>段階・対称<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"10\">10<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"5\">5<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"50\">50<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>⑥⑦<\/td>\n<td>横軸 <span class=\"im\"><span class=\"tx raw\" data-tex=\"t\\ [\\text{s}]\">t\\ [\\text{s}]<\/span><\/span><\/td>\n<td>固定<\/td>\n<td>直近 <span class=\"im\"><span class=\"tx raw\" data-tex=\"30\\ \\text{s}\">30\\ \\text{s}<\/span><\/span>（右端が現在，目盛 <span class=\"im\"><span class=\"tx raw\" data-tex=\"5\\ \\text{s}\">5\\ \\text{s}<\/span><\/span>）<\/td>\n<td>–<\/td>\n<\/tr>\n<tr>\n<td>⑥⑦<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N\\ [\\text{rpm}]\">\\bar N\\ [\\text{rpm}]<\/span><\/span><\/td>\n<td>段階・0 起点<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"2000\">2000<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"1000\">1000<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"10000\">10000<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>⑥<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha\\ [^\\circ]\">\\alpha\\ [^\\circ]<\/span><\/span><\/td>\n<td>固定<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"90\">90<\/span><\/span><\/td>\n<td>–<\/td>\n<\/tr>\n<tr>\n<td>⑥<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_w\\ [\\text{K}]\">T_w\\ [\\text{K}]<\/span><\/span><\/td>\n<td>帯域<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"s_{\\min} = 10\">s_{\\min} = 10<\/span><\/span><\/td>\n<td>–<\/td>\n<\/tr>\n<tr>\n<td>⑦<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_b\">T_b<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{dyno}}\\ [\\text{N·m}]\">T_{\\text{dyno}}\\ [\\text{N·m}]<\/span><\/span><\/td>\n<td>段階（負の値があれば対称）<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"50\">50<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"10\">10<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"500\">500<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>⑦<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{cmd}}\">f_{\\text{cmd}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{eff}}\">f_{\\text{eff}}<\/span><\/span><\/td>\n<td>固定<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"1\">1<\/span><\/span><\/td>\n<td>–<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n","<h3 id=\"spech78\">SPEC-18：設定画面（REQ-18）<\/h3>\n<h4 id=\"spech79\">A. 項目の分類<\/h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>分類<\/th>\n<th>対象<\/th>\n<th>反映<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>即時項目<\/strong><\/td>\n<td>要リセット項目以外のすべて<\/td>\n<td>押した時点の積分ステップの境界で反映する．状態 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\mathbf{y}\">\\mathbf{y}<\/span><\/span> は連続のまま．<\/td>\n<\/tr>\n<tr>\n<td><strong>要リセット項目<\/strong><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"B\">B<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"S\">S<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"l\">l<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon\">\\varepsilon<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"V(\\theta)\">V(\\theta)<\/span><\/span> が不連続に変わるため）<\/td>\n<td>保留値として強調して表示し，「適用」で確定してコールドリセットする．「破棄」で保留を捨てる．<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4 id=\"spech80\">B. 表示と入力<\/h4>\n<ol type=\"1\">\n<li><p>1 項目は 1 行（高さ <span class=\"im\"><span class=\"tx raw\" data-tex=\"46\\ \\text{px}\">46\\ \\text{px}<\/span><\/span>，ボタン <span class=\"im\"><span class=\"tx raw\" data-tex=\"44\\ \\text{px}\">44\\ \\text{px}<\/span><\/span>）：項目名（単位付き），現在値，<code>[−]<\/code> <code>[+]<\/code>．選択項目は名前付きの選択ボタンで表示する（<code>0/1<\/code> のような符号を画面に出さない）．<\/p><\/li>\n<li><p>表示値 <span class=\"im\"><span class=\"tx raw\" data-tex=\"=\">=<\/span><\/span> 内部値（SI）<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\div\">\\div<\/span><\/span> 単位係数．単位係数は項目定義表の 1 か所だけに持ち，表示と入力の両方が使う．<\/p><\/li>\n<li><p>1 タップで 1 刻み．<code>[刻み ×1／×10]<\/code> で刻みを 10 倍にできる．長押しの連続入力は設けない．範囲の端ではボタンを無効にする．<\/p><\/li>\n<li><p><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lambda = r/l &gt; 0.5\">\\lambda = r/l &gt; 0.5<\/span><\/span> になる組合せは「適用」を無効にして理由を表示する．目標回転数と点火時期には上限（点火時期は下限も）を設けない．<\/p><\/li>\n<li><p>変更のたびに「項目名：旧値 → 新値」を 1 行表示する．<code>[元に戻す]<\/code> で直前の 1 変更を取り消す．<code>[既定値]<\/code> で表示中のページの全項目を既定値に戻す（要リセット項目は保留値として）．<\/p><\/li>\n<li><p>点火の自動最適化が ON のとき，点火時期の行は現在の自動の値を毎フレーム表示し（小数 1 桁，項目名に「（自動）」），<code>[−]<\/code> <code>[+]<\/code> を無効にする．完爆後に ON から OFF にしたときは，その時点の自動の値を <span class=\"im\"><span class=\"tx raw\" data-tex=\"1^\\circ\">1^\\circ<\/span><\/span> に丸めて手動の値に引き継ぐ．<\/p><\/li>\n<li><p><strong>回転数の制御で使わない項目<\/strong>（ページ「運転」）：選んだ制御（SPEC-11）で使わない項目は <code>[−]<\/code> <code>[+]<\/code> を無効にする．値は保持する（<code>[既定値]<\/code> では既定値に戻る）．<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>スロットル制御（<code>mode<\/code> <span class=\"im\"><span class=\"tx raw\" data-tex=\"= 0\">= 0<\/span><\/span>）<\/th>\n<th>動力計制御（<code>mode<\/code> <span class=\"im\"><span class=\"tx raw\" data-tex=\"= 1\">= 1<\/span><\/span>）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>固定開度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha_{\\text{manual}}\">\\alpha_{\\text{manual}}<\/span><\/span><\/td>\n<td>無効．項目名に「（自動）」，値は現在の開度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha\">\\alpha<\/span><\/span>（ECU の操作量．小数 1 桁，毎フレーム更新）<\/td>\n<td>有効<\/td>\n<\/tr>\n<tr>\n<td>固定充水率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{manual}}\">f_{\\text{manual}}<\/span><\/span><\/td>\n<td>有効<\/td>\n<td>無効．項目名に「（自動）」，値は現在の充水率の指令 <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{cmd}}\">f_{\\text{cmd}}<\/span><\/span>（動力計の PI の操作量．小数 2 桁，毎フレーム更新）<\/td>\n<\/tr>\n<tr>\n<td>基準充水率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{base}}\">f_{\\text{base}}<\/span><\/span><\/td>\n<td>無効．項目名に「（不使用）」，値は保持している設定値<\/td>\n<td>有効<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>完爆前は，どちらの制御でも <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha = \\alpha_{\\text{crank}}\">\\alpha = \\alpha_{\\text{crank}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{cmd}} = 0\">f_{\\text{cmd}} = 0<\/span><\/span> を表示する（SPEC-11 の完爆前の規定どおり）．制御を切り替えると，同じフレームで行の表示と無効化を入れ替える．動力計制御に切り替えたときは，SPEC-11 4 のとおり <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha_{\\text{manual}}\">\\alpha_{\\text{manual}}<\/span><\/span> を切替の直前の開度で上書きし，スロットル制御に切り替えたときは <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{manual}}\">f_{\\text{manual}}<\/span><\/span> を直前の <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{cmd}}\">f_{\\text{cmd}}<\/span><\/span> で上書きする（画面の値はそれを示す）．上書きした値は刻みの格子に丸めない．表示は刻みの桁（固定開度は小数 1 桁，充水率は小数 2 桁）に丸める．<\/p><\/li>\n<\/ol>\n<h4 id=\"spech81\">C. ページと項目<\/h4>\n<p>ページの選択は <code>◀ ［ページ名 k/n］ ▶<\/code> で行い，ページ名をタップすると全ページの一覧が開いて直接移動できる．1 ページは 6 項目以内．「機関」のページには導出値（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lambda\">\\lambda<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"V_d\">V_d<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"V_c\">V_c<\/span><\/span>）も表示する．下の表は内容ごとに並べてある（画面のページの順は項目定義表による）．<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>ページ<\/th>\n<th>項目（単位）：下限〜上限，刻み，既定<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>機関<\/td>\n<td>ボア <span class=\"im\"><span class=\"tx raw\" data-tex=\"B\">B<\/span><\/span>（mm）：40〜150，1，86 ／ ストローク <span class=\"im\"><span class=\"tx raw\" data-tex=\"S\">S<\/span><\/span>（mm）：40〜150，1，86 ／ 連桿長 <span class=\"im\"><span class=\"tx raw\" data-tex=\"l\">l<\/span><\/span>（mm）：60〜300，1，145 ／ 圧縮比 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon\">\\varepsilon<\/span><\/span>：1.1〜100，0.1，10<\/td>\n<\/tr>\n<tr>\n<td>VVT・カム<\/td>\n<td>吸気位相 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varphi_{\\text{in}}\">\\varphi_{\\text{in}}<\/span><\/span>，排気位相 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varphi_{\\text{ex}}\">\\varphi_{\\text{ex}}<\/span><\/span>（°CA）：−40〜40，1，0 ／ カム：Std・Poly・Aggr，既定 Std ／ 最大リフト（mm）：3〜14，0.5，9 ／ 吸気弁径（mm）：20〜50，1，38<\/td>\n<\/tr>\n<tr>\n<td>弁タイミング<\/td>\n<td>IVO（°CA）：−40〜40，1，−10 ／ IVC：190〜290，1，264 ／ EVO：430〜530，1，490 ／ EVC：690〜760，1，730<\/td>\n<\/tr>\n<tr>\n<td>吸気<\/td>\n<td>大気圧 <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{atm}}\">p_{\\text{atm}}<\/span><\/span>（kPa）：60〜110，0.1，101.3 ／ スロットル径（mm）：20〜80，1，40 ／ マニホールド容積 <span class=\"im\"><span class=\"tx raw\" data-tex=\"V_{\\text{in}}\">V_{\\text{in}}<\/span><\/span>（L）：0.3〜5，0.1，1.5<\/td>\n<\/tr>\n<tr>\n<td>吸気ランナ<\/td>\n<td>吸気ランナ：OFF・ON，既定 ON ／ ランナ長 <span class=\"im\"><span class=\"tx raw\" data-tex=\"L_r\">L_r<\/span><\/span>（mm）：100〜1000，10，450 ／ ランナ内径 <span class=\"im\"><span class=\"tx raw\" data-tex=\"d_r\">d_r<\/span><\/span>（mm）：20〜60，1，40<\/td>\n<\/tr>\n<tr>\n<td>排気系<\/td>\n<td>排気系モデル：OFF・ON，既定 ON ／ 消音器容積 <span class=\"im\"><span class=\"tx raw\" data-tex=\"V_m\">V_m<\/span><\/span>（L）：0.5〜10，0.5，3 ／ 出口有効面積 <span class=\"im\"><span class=\"tx raw\" data-tex=\"A_t\">A_t<\/span><\/span>（mm²）：20〜3000，10，300 ／ 排気圧損（OFF 時）（kPa）：0〜30，0.5，4<\/td>\n<\/tr>\n<tr>\n<td>燃焼<\/td>\n<td>点火時期（°BTDC）：上下限なし，1，18 ／ 点火の自動最適化：OFF・ON，既定 ON ／ サイクル変動：OFF・ON，既定 ON ／ 当量比 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi\">\\phi<\/span><\/span>：0.6〜1.4，0.01，1 ／ Woschni 係数：0〜2，0.05，1 ／ 比熱：γ(T)・γ一定，既定 γ(T)<\/td>\n<\/tr>\n<tr>\n<td>燃焼速度<\/td>\n<td>着火遅れ係数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"c_d\">c_d<\/span><\/span>，燃焼速度係数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"c_b\">c_b<\/span><\/span>：0.1〜10，0.1，1 ／ Wiebe 形状係数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_w\">m_w<\/span><\/span>：0〜6，0.5，2<\/td>\n<\/tr>\n<tr>\n<td>運転<\/td>\n<td>回転数の制御：スロットル・動力計，既定 スロットル ／ 目標回転数（rpm）：500〜（上限なし），50，800 ／ 固定開度（°）：0〜90，0.1，15 ／ 固定充水率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"f\">f<\/span><\/span>：0〜1，0.05，0 ／ 基準充水率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"f\">f<\/span><\/span>：0〜1，0.05，0 ／ 補機負荷トルク（N·m）：0〜20，0.1，2<\/td>\n<\/tr>\n<tr>\n<td>ECU<\/td>\n<td>平均時定数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\tau_N\">\\tau_N<\/span><\/span>（s）：0.05〜1，0.05，0.15 ／ 始動開度（°）：0〜90，1，6 ／ 基準開度（°）：0〜90，1，3 ／ <span class=\"im\"><span class=\"tx raw\" data-tex=\"K_p\">K_p<\/span><\/span>（°/rpm）：0.001〜0.2，0.001，0.008 ／ <span class=\"im\"><span class=\"tx raw\" data-tex=\"K_i\">K_i<\/span><\/span>（°/(rpm·s)）：0.002〜0.5，0.002，0.004 ／ 最大開度（°）：1〜90，1，90<\/td>\n<\/tr>\n<tr>\n<td>動力計<\/td>\n<td>定格トルク（N·m）：5〜200，1，35 ／ 定格回転数（rpm）：500〜8000，100，1500 ／ 充水時定数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\tau_d\">\\tau_d<\/span><\/span>（s）：0.05〜2，0.05，0.3 ／ <span class=\"im\"><span class=\"tx raw\" data-tex=\"I_{\\text{dyno}}\">I_{\\text{dyno}}<\/span><\/span>（kg·m²）：0.01〜0.5，0.01，0.05 ／ <span class=\"im\"><span class=\"tx raw\" data-tex=\"K_{pd}\">K_{pd}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-3}\">10^{-3}<\/span><\/span>/rpm）：0.2〜10，0.2，1 ／ <span class=\"im\"><span class=\"tx raw\" data-tex=\"K_{id}\">K_{id}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-3}\">10^{-3}<\/span><\/span>/(rpm·s)）：0.2〜10，0.2，2<\/td>\n<\/tr>\n<tr>\n<td>解法<\/td>\n<td>ソルバ：RK4・DOPRI5(4)，既定 DOPRI5(4) ／ RK4 刻み <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta\\theta\">\\Delta\\theta<\/span><\/span>（°CA）：0.25〜2，0.25，0.25 ／ rtol：1e-4・1e-5・1e-6，既定 1e-5<\/td>\n<\/tr>\n<tr>\n<td>音響<\/td>\n<td>音量（%）：0〜100，5，60 ／ 排気管長 <span class=\"im\"><span class=\"tx raw\" data-tex=\"L\">L<\/span><\/span>（m）：0.3〜3，0.1，1 ／ 排気管内径 <span class=\"im\"><span class=\"tx raw\" data-tex=\"d\">d<\/span><\/span>（mm）：20〜80，2，40 ／ 消音器の反射率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\rho_m\">\\rho_m<\/span><\/span>：0〜0.95，0.05，0.6 ／ 流れ雑音（%）：0〜100，10，40 ／ 音の種類：計算・演出，既定 計算<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4 id=\"spech82\">D. 効果を確かめるパネル<\/h4>\n<ol type=\"1\">\n<li>「機関」「VVT・カム」「弁タイミング」以外のページの下部に <span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>-<span class=\"im\"><span class=\"tx raw\" data-tex=\"V\">V<\/span><\/span> 線図（線形．軸は SPEC-17，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span> 軸は線図タブと共有）を表示する．高さは残りの領域に従い，<span class=\"im\"><span class=\"tx raw\" data-tex=\"360 \\times 640\">360 \\times 640<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"120\\ \\text{px}\">120\\ \\text{px}<\/span><\/span> 以上．<\/li>\n<li>「VVT・カム」と「弁タイミング」のページでは，代わりに<strong>カム線図<\/strong>を表示する．横軸 <span class=\"im\"><span class=\"tx raw\" data-tex=\"360\">360<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"1080^\\circ\">1080^\\circ<\/span><\/span>，縦軸リフト [mm]．吸気・排気の現在のリフト曲線（位相を含む），変更前の基準（灰色），ピストン頂面までの余裕 <span class=\"im\"><span class=\"tx raw\" data-tex=\"h_c + x(\\theta)\">h_c + x(\\theta)<\/span><\/span> を描く．パネルの上に，有効な IVO・IVC・EVO・EVC とオーバーラップ角 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{EVC} - (\\text{IVO} + 720^\\circ)\">\\text{EVC} - (\\text{IVO} + 720^\\circ)<\/span><\/span> を表示する．<\/li>\n<li><strong>基準サイクル<\/strong>：現在のサイクル（直近に完了した 1 サイクル，アクセント色）と基準サイクル（灰色）を重ねる．\n<ul>\n<li>即時項目を変更したとき，直前の変更から <span class=\"im\"><span class=\"tx raw\" data-tex=\"3\\ \\text{s}\">3\\ \\text{s}<\/span><\/span> 以上たっていれば，変更の直前に完了していた 1 サイクルを基準として保存する（複製）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"3\\ \\text{s}\">3\\ \\text{s}<\/span><\/span> 未満の連続操作では基準を更新しない．<\/li>\n<li>設定画面の <code>[基準更新]<\/code>（線図タブの ① では <code>[基準を現在に]<\/code>）で，現在のサイクルを基準にできる．コールドリセットと要リセット項目の適用で基準は消える．<\/li>\n<li>線図タブの ① <span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>-<span class=\"im\"><span class=\"tx raw\" data-tex=\"V\">V<\/span><\/span> も同じ基準サイクルを重ねる．<\/li>\n<\/ul><\/li>\n<li>パネルに「IMEP：現在値（基準比 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm\\Delta\">\\pm\\Delta<\/span><\/span>）」「<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\max}\">p_{\\max}<\/span><\/span>：現在値（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm\\Delta\">\\pm\\Delta<\/span><\/span>）」「<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N\">\\bar N<\/span><\/span>」を表示する．基準が無いときは現在値だけ．<\/li>\n<li>機関が止まっていてサイクルが無いときは「運転タブで START してください」と表示する．<\/li>\n<\/ol>\n<hr />\n","<h3 id=\"spech83\">SPEC-19：機関断面図（REQ-19）<\/h3>\n<ol type=\"1\">\n<li><strong>実寸の比<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"B\">B<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"S\">S<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"l\">l<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"r\">r<\/span><\/span>，隙間の高さ <span class=\"im\"><span class=\"tx raw\" data-tex=\"h_c\">h_c<\/span><\/span>，弁径，リフトを同じ縮尺 <span class=\"im\"><span class=\"tx raw\" data-tex=\"s\">s<\/span><\/span> [px/m] で描く．設定を変えると図の比率が変わる．縮尺は，設定できる全範囲で図全体が Canvas に収まるように毎回決める．<\/li>\n<li><strong>要素<\/strong>：シリンダブロックとヘッド，ピストン（リング，ピン），連桿，クランク（ウェブ，カウンタウェイト，主軸），クランクケース，吸気ポートと排気ポート，吸気弁と排気弁（傘，ステム，ばね），点火プラグと火花，筒内ガス，火炎．<\/li>\n<li><strong>位置<\/strong>：ピストン頂面は <span class=\"im\"><span class=\"tx raw\" data-tex=\"y = h_c + x(\\theta)\">y = h_c + x(\\theta)<\/span><\/span>，ピストンピンとクランクピンの距離は常に <span class=\"im\"><span class=\"tx raw\" data-tex=\"l\">l<\/span><\/span>，クランクピンは主軸から半径 <span class=\"im\"><span class=\"tx raw\" data-tex=\"r\">r<\/span><\/span>，弁の傘は弁座から <span class=\"im\"><span class=\"tx raw\" data-tex=\"L_v(\\theta)\">L_v(\\theta)<\/span><\/span> だけ筒内側へ動く（位相を反映）．<\/li>\n<li><strong>色<\/strong>：吸気ポートは，外端から弁座までの流路全体を連続した 1 つの領域として青系で塗り，濃さで <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{in}}/p_{\\text{atm}}\">p_{\\text{in}}/p_{\\text{atm}}<\/span><\/span> を表す．排気ポートは同様に橙系．筒内ガスの色は温度に単調に対応させる（低温は青，高温は赤〜橙）．燃焼中は燃焼割合に応じた火炎を点火プラグから描く．<\/li>\n<li><strong>流れ<\/strong>：吸気・排気ポートに，弁の質量流量の向きと大きさを示す矢印を描く．<\/li>\n<li><strong>文字<\/strong>：運転の状態（STOP／CRANK／RUN），回転数，制御方式，行程名，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta\">\\theta<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span> [kPa]，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T\">T<\/span><\/span>，両弁のリフト，<span class=\"im\"><span class=\"tx raw\" data-tex=\"B \\times S\">B \\times S<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"l/r\">l/r<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon\">\\varepsilon<\/span><\/span> を，図に重ならない位置に表示する．<\/li>\n<li>幾何の計算（場面記述：要素ごとの多角形・円の座標）と描画を分ける．<\/li>\n<\/ol>\n<hr />\n","<h3 id=\"spech84\">SPEC-22：制御状態の表示（REQ-22）<\/h3>\n<ol type=\"1\">\n<li><p>運転タブの機関断面図と操作ボタンの間に，<strong>制御状態カード<\/strong>（4 行．各行は折り返さない）を置く．量は日本語名で示す：「スロットル開度 α」「動力計の充水率 f」「点火時期 ○° BTDC」．<\/p><\/li>\n<li><p>各量に役割の色付きの見出しを付ける：<strong>目標<\/strong>（緑），<strong>制御量<\/strong>（橙），<strong>操作量<\/strong>（青），<strong>固定<\/strong>（灰：利用者が与えた一定値），<strong>自動<\/strong>（紫：自動最適化）．<\/p><\/li>\n<li><p>表示の内容：<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>状態<\/th>\n<th>1 行目<\/th>\n<th>2 行目<\/th>\n<th>3 行目<\/th>\n<th>4 行目<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>停止<\/td>\n<td><code>停止中<\/code><\/td>\n<td><code>START で始動<\/code><\/td>\n<td>（空）<\/td>\n<td>（空）<\/td>\n<\/tr>\n<tr>\n<td>始動中<\/td>\n<td><code>始動中<\/code> 目標 完爆 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N &gt; 550\">\\bar N &gt; 550<\/span><\/span>／制御量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N\">\\bar N<\/span><\/span><\/td>\n<td>固定 スロットル開度（始動開度）<\/td>\n<td>（空）<\/td>\n<td>固定 点火時期<\/td>\n<\/tr>\n<tr>\n<td>スロットル制御<\/td>\n<td><code>スロットル制御<\/code> 目標 <span class=\"im\"><span class=\"tx raw\" data-tex=\"N_{\\text{target}}\">N_{\\text{target}}<\/span><\/span>／制御量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N\">\\bar N<\/span><\/span><\/td>\n<td>操作量 スロットル開度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha\">\\alpha<\/span><\/span><\/td>\n<td>固定 動力計の充水率<\/td>\n<td>自動または固定 点火時期<\/td>\n<\/tr>\n<tr>\n<td>動力計制御<\/td>\n<td><code>動力計制御<\/code> 目標 <span class=\"im\"><span class=\"tx raw\" data-tex=\"N_{\\text{target}}\">N_{\\text{target}}<\/span><\/span>／制御量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N\">\\bar N<\/span><\/span><\/td>\n<td>操作量 動力計の充水率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{cmd}}\">f_{\\text{cmd}}<\/span><\/span><\/td>\n<td>固定 スロットル開度<\/td>\n<td>自動または固定 点火時期<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/li>\n<li><p>操作量が上下限に張り付いているときは，値の後に，スロットルなら <code>全開<\/code>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha = \\alpha_{\\max}\">\\alpha = \\alpha_{\\max}<\/span><\/span>），<code>全閉<\/code>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha = 0\">\\alpha = 0<\/span><\/span>），<code>下限<\/code>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"0 &lt; \\alpha \\le \\alpha_{\\min}\">0 &lt; \\alpha \\le \\alpha_{\\min}<\/span><\/span>），充水率なら <code>上限<\/code>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{cmd}} = 1\">f_{\\text{cmd}} = 1<\/span><\/span>），<code>下限<\/code>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{cmd}} = 0\">f_{\\text{cmd}} = 0<\/span><\/span>）を付ける．<\/p><\/li>\n<li><p>表示は描画フレームごとに更新する．数値は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N\">\\bar N<\/span><\/span> が整数，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha\">\\alpha<\/span><\/span> が小数 1 桁，<span class=\"im\"><span class=\"tx raw\" data-tex=\"f\">f<\/span><\/span> が小数 2 桁，点火時期が小数 1 桁．<\/p><\/li>\n<\/ol>\n<hr />\n","<h3 id=\"spech85\">SPEC-23：目標回転数スライダ（REQ-23）<\/h3>\n<ol type=\"1\">\n<li><strong>配置<\/strong>：機関断面図の下端に高さ <span class=\"im\"><span class=\"tx raw\" data-tex=\"48\\ \\text{px}\">48\\ \\text{px}<\/span><\/span> の帯を重ね，左から <code>[−]<\/code>，スライダ（現在値のラベル付き），<code>[＋]<\/code> を置く．機関断面図は帯の上の領域に収まるよう縮尺を決める．<\/li>\n<li><strong>範囲と刻み<\/strong>：スライダは <span class=\"im\"><span class=\"tx raw\" data-tex=\"500\">500<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"8000\\ \\text{rpm}\">8000\\ \\text{rpm}<\/span><\/span>，刻み <span class=\"im\"><span class=\"tx raw\" data-tex=\"50\\ \\text{rpm}\">50\\ \\text{rpm}<\/span><\/span>（位置と値は線形）．ボタンは <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 50\\ \\text{rpm}\">\\pm 50\\ \\text{rpm}<\/span><\/span>．目標回転数には上限が無いので，ボタンではスライダの範囲を超えて上げられ，そのときつまみは右端にとどまり，ラベルは実際の値を表示する．下限は <span class=\"im\"><span class=\"tx raw\" data-tex=\"500\\ \\text{rpm}\">500\\ \\text{rpm}<\/span><\/span>．<\/li>\n<li><strong>誤操作の防止<\/strong>：値を変えるのは，つまみ（当たり判定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"44 \\times 44\\ \\text{px}\">44 \\times 44\\ \\text{px}<\/span><\/span> 以上）から始めたドラッグだけとする．トラックのタップと，つまみ以外から始めたドラッグでは値が変わらない．ドラッグ中は指の横位置に合わせて値を直ちに反映する．<\/li>\n<li>設定画面の目標回転数と同じ値で，即時項目として扱う．どちらの制御方式でも目標回転数として働く．<\/li>\n<li>独自実装（<code>div<\/code> と Pointer Events）とし，<code>input[type=\"range\"]<\/code> は使わない．<\/li>\n<\/ol>\n<hr />\n","<h3 id=\"spech86\">SPEC-26：性能曲線タブ（回転数に対する特性の計測）（REQ-26）<\/h3>\n<h4 id=\"spech87\">A. 計測の条件<\/h4>\n<ol type=\"1\">\n<li><strong>設定の複製<\/strong>：計測を始めた時点の設定（適用済みの値）を複製した独立の <code>EngineCore<\/code> で計算する．運転中の機関の状態と設定は変えない．<\/li>\n<li><strong>スロットル開度<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"10, 20, \\dots, 90^\\circ\">10, 20, \\dots, 90^\\circ<\/span><\/span> から，計測の前に複数を選ぶ（既定は <span class=\"im\"><span class=\"tx raw\" data-tex=\"90^\\circ\">90^\\circ<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"50^\\circ\">50^\\circ<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^\\circ\">10^\\circ<\/span><\/span>）．大きい開度から順に計測する．少なくとも 1 つは選ばれている．<\/li>\n<li><strong>固定する条件<\/strong>：点火は自動最適化 ON，サイクル変動 OFF，壁温 <span class=\"im\"><span class=\"tx raw\" data-tex=\"360\\ \\text{K}\">360\\ \\text{K}<\/span><\/span> 固定（暖機後を想定．壁の熱容量の時定数は約 <span class=\"im\"><span class=\"tx raw\" data-tex=\"100\\ \\text{s}\">100\\ \\text{s}<\/span><\/span> で，点ごとに整定を待てないため）．<\/li>\n<li><strong>回転数の保持<\/strong>：理想的な速度一定の動力計とみなし，回転数を固定する（SPEC-10）．軸トルクは SPEC-14 の <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_b\">T_b<\/span><\/span>．<\/li>\n<li><strong>回転数の点<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"1000\">1000<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"7000\\ \\text{rpm}\">7000\\ \\text{rpm}<\/span><\/span> を刻み <span class=\"im\"><span class=\"tx raw\" data-tex=\"25\">25<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"100\">100<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"250\">250<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"500\\ \\text{rpm}\">500\\ \\text{rpm}<\/span><\/span>（241，61，25，13 点）で区切る．既定は <span class=\"im\"><span class=\"tx raw\" data-tex=\"250\\ \\text{rpm}\">250\\ \\text{rpm}<\/span><\/span>．<\/li>\n<li><strong>収束の判定<\/strong>（数値はコードの定数表を唯一の情報源とし，「前提」の画面にもそこから書き出す）：完爆後の直近 3 サイクルの各量の幅（最大 − 最小）で判定する．\n<ul>\n<li>厳しさ：「標準」は <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_b\">T_b<\/span><\/span> の幅 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\le 0.3\\%\\,|T_b| + 0.02\\ \\text{N·m}\">\\le 0.3\\%\\,|T_b| + 0.02\\ \\text{N·m}<\/span><\/span>，MBT 点火時期の幅 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\le 0.3^\\circ\">\\le 0.3^\\circ<\/span><\/span>，最少サイクル数の初期値 4．「厳格」（既定）は <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.1\\%\\,|T_b| + 0.01\\ \\text{N·m}\">0.1\\%\\,|T_b| + 0.01\\ \\text{N·m}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.1^\\circ\">0.1^\\circ<\/span><\/span>，最少サイクル数の初期値 6．<\/li>\n<li>流量・状態量の判定（ON／OFF，既定 ON）：同じ 3 サイクルで，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_v\">\\eta_v<\/span><\/span>，サイクル平均のスロットル流量，サイクルの終端の吸気管圧の幅が，それぞれの平均の <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.3\\%\">0.3\\%<\/span><\/span>（標準）または <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.1\\%\">0.1\\%<\/span><\/span>（厳格）以下．<\/li>\n<li><strong>サイクル数の最少 <span class=\"im\"><span class=\"tx raw\" data-tex=\"n_{\\min}\">n_{\\min}<\/span><\/span> と最多 <span class=\"im\"><span class=\"tx raw\" data-tex=\"n_{\\max}\">n_{\\max}<\/span><\/span><\/strong>（数えるのは完爆後に完了したサイクル）：判定は <span class=\"im\"><span class=\"tx raw\" data-tex=\"n \\ge n_{\\min}\">n \\ge n_{\\min}<\/span><\/span> になってから行う（<span class=\"im\"><span class=\"tx raw\" data-tex=\"n_{\\min} \\ge 3\">n_{\\min} \\ge 3<\/span><\/span> は幅を取る 3 サイクルを確保するため）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"n_{\\max}\">n_{\\max}<\/span><\/span> サイクルで判定を満たさない点は「未整定」として白抜きの印で描き，最後のサイクルの値を採る．失火などで完爆後のサイクルが数えられない場合に備え，回転数の点ごとのサイクルの総数（完爆前を含む）が <span class=\"im\"><span class=\"tx raw\" data-tex=\"2n_{\\max}\">2n_{\\max}<\/span><\/span> に達したときも打ち切る．<\/li>\n<li><span class=\"im\"><span class=\"tx raw\" data-tex=\"n_{\\min}\">n_{\\min}<\/span><\/span>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"3\">3<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"30\">30<\/span><\/span>，刻み <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\">1<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"n_{\\max}\">n_{\\max}<\/span><\/span>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"10\">10<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"200\">200<\/span><\/span>，刻み <span class=\"im\"><span class=\"tx raw\" data-tex=\"10\">10<\/span><\/span>，既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"60\">60<\/span><\/span>．常に <span class=\"im\"><span class=\"tx raw\" data-tex=\"n_{\\min} \\le n_{\\max}\">n_{\\min} \\le n_{\\max}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"n_{\\min}\">n_{\\min}<\/span><\/span> の <code>[+]<\/code> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"n_{\\min} = n_{\\max}\">n_{\\min} = n_{\\max}<\/span><\/span> で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"n_{\\max}\">n_{\\max}<\/span><\/span> の <code>[−]<\/code> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"n_{\\max} - 10 &lt; n_{\\min}\">n_{\\max} - 10 &lt; n_{\\min}<\/span><\/span> で無効）．厳しさを選ぶと <span class=\"im\"><span class=\"tx raw\" data-tex=\"n_{\\min}\">n_{\\min}<\/span><\/span> をその厳しさの初期値にする．<\/li>\n<\/ul><\/li>\n<li><strong>手順<\/strong>：「上り」（既定．低回転から順に，各点は前の点の状態から続ける），「往復」（上りに続けて下りも計測し，各点で平均を採る．両者の差の最大を完了の表示に出す），「独立」（各点を，その回転数で単独に始める）．<\/li>\n<li><strong>記録する量<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"N\">N<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_b\">T_b<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"P_b\">P_b<\/span><\/span>，BMEP，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_v\">\\eta_v<\/span><\/span>，bsfc，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_b\">\\eta_b<\/span><\/span>，MBT 点火時期，<span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r\">x_r<\/span><\/span>，排気背圧，整定の可否，使ったサイクル数，判定に使った各量の幅．<\/li>\n<\/ol>\n<h4 id=\"spech88\">B. 画面<\/h4>\n<ol type=\"1\">\n<li>画面の文言では「計測」と言う（「掃引」は使わない）．<\/li>\n<li>上段に <code>[計測開始]<\/code>（実行中は <code>[中止]<\/code>）と <code>[基準を消す]<\/code>，その下に表示の切替 <code>[出力]<\/code> <code>[η_v]<\/code> <code>[燃費]<\/code> <code>[点火]<\/code> <code>[条件]<\/code> <code>[前提]<\/code>，残りの高さにグラフまたは表を置く．<code>[条件]<\/code> と <code>[前提]<\/code> の表示中は状態の表示（3 行）を隠す．<\/li>\n<li><strong>条件<\/strong>：開度のチェック式のボタン 9 つ，刻み（ボタン 4 つ），厳しさ，流量・状態量の判定，サイクル数（1 行に <code>[−]<\/code> 最少の値 <code>[+]<\/code> <code>[−]<\/code> 最多の値 <code>[+]<\/code>），手順．どれかを変えると，計測済みの結果に「設定が変わりました」と表示する．<\/li>\n<li><strong>前提<\/strong>：計測の仮定を数値で書き出す表．固定する条件（開度の一覧，回転数の保持，点火，サイクル変動，壁温），回転数の点（範囲，刻み，点数，手順），収束の判定（選んだ厳しさの数値，流量・状態量の判定の有無，最少・最多のサイクル数），計測に使う設定（大気圧，当量比，圧縮比，ボア × ストローク，カムの種類，最大リフト，吸気弁径，IVO・IVC・EVO・EVC（位相を含む），吸気ランナ，排気系（ON なら消音器容積と出口有効面積，OFF なら排気圧損），補機負荷トルク）．\n<ul>\n<li>「計測に使う設定」は，計測の実行中は実行中の計測が複製した設定（見出しは「計測中の設定」），それ以外は現在の適用済みの設定（見出しは「現在の設定（次の計測に使う）」）を示す．計測済みの結果があっても，結果を計測した時点の設定は示さない．<\/li>\n<li>表は，設定の変更（設定画面の値の変更，<code>[適用]<\/code>，<code>[元に戻す]<\/code>，<code>[既定値]<\/code>），計測の開始・中止・完了，「前提」の表示への切替，性能曲線タブへの切替のたびに作り直す．<\/li>\n<li>表示中の曲線が現在と異なる設定・条件で計測したものであるとき（B.7 の古さの注記と同じ判定）は「表示中の曲線は変更前の設定で計測（再計測で更新）」，保留中（未適用）の変更があるときは「保留中の変更は [適用] の後に使う」と，見出しに続けて書く．保留中の値は表に出さない（計測に使わないため）．<\/li>\n<\/ul><\/li>\n<li><strong>グラフ<\/strong>：<code>[出力]<\/code> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_b\">T_b<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"P_b\">P_b<\/span><\/span>，<code>[η_v]<\/code> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_v\">\\eta_v<\/span><\/span>，<code>[燃費]<\/code> は bsfc と <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_b\">\\eta_b<\/span><\/span>，<code>[点火]<\/code> は MBT 点火時期と <span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r\">x_r<\/span><\/span>．横軸は <span class=\"im\"><span class=\"tx raw\" data-tex=\"N\">N<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"1000\">1000<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"7000\\ \\text{rpm}\">7000\\ \\text{rpm}<\/span><\/span>，目盛 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1000\\ \\text{rpm}\">1000\\ \\text{rpm}<\/span><\/span> ごと）．縦軸は 0 起点の段階的な自動レンジで，負の値があれば負の側にも広げる．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_v\">\\eta_v<\/span><\/span> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"1.2\">1.2<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_b\">\\eta_b<\/span><\/span> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5\">0.5<\/span><\/span> に固定．<span class=\"im\"><span class=\"tx raw\" data-tex=\"P_b \\le 0\">P_b \\le 0<\/span><\/span> の点では bsfc と <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_b\">\\eta_b<\/span><\/span> を描かない．<\/li>\n<li><strong>重ね描き<\/strong>：選んだ開度の曲線を，開度に応じた色（<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^\\circ\">10^\\circ<\/span><\/span> を青，<span class=\"im\"><span class=\"tx raw\" data-tex=\"90^\\circ\">90^\\circ<\/span><\/span> を赤とする色相の変化）で重ね，凡例に開度を示す．点は印と線でつなぎ，求まるたびに描き足す．凡例はプロット領域の中に収まる．<\/li>\n<li><strong>状態の表示（3 行）<\/strong>：計測中は開度と回転数の進捗．完了後は所要時間，最大の開度の曲線の最大トルクと最大出力（とその回転数），往復なら往復差の最大．3 行目に基準または古さの注記．<\/li>\n<li><strong>基準<\/strong>：新しい計測が完了したとき，それまでの結果を「基準」として灰色の細い線で重ねる．<code>[基準を消す]<\/code> で消す．中止した計測は基準を置き換えない．<\/li>\n<li>実行中はタブを切り替えても計測を続ける．検証タブの全テストの実行中は計測を始められない．<\/li>\n<\/ol>\n<h4 id=\"spech89\">C. 実行<\/h4>\n<ol type=\"1\">\n<li>計測は時間を分けて実行し（1 フレームあたり <span class=\"im\"><span class=\"tx raw\" data-tex=\"8\\ \\text{ms}\">8\\ \\text{ms}<\/span><\/span> 以内），運転中の機関の実時間の進行を妨げない．<\/li>\n<li>既定（3 開度 × 25 点，厳格，流量・状態量の判定 ON，上り）の計測の所要時間は，ヘッドレス Chromium の <span class=\"im\"><span class=\"tx raw\" data-tex=\"360 \\times 640\">360 \\times 640<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"20\\ \\text{s}\">20\\ \\text{s}<\/span><\/span> 以下．<\/li>\n<\/ol>\n<hr />\n","<h2 id=\"spech90\">6. エンジン音<\/h2>\n","<h3 id=\"spech91\">SPEC-21：エンジン音（REQ-21）<\/h3>\n<h4 id=\"spech92\">A. 音源（ウェーブテーブル）<\/h4>\n<ol type=\"1\">\n<li>排気口を点音源とみなすと，遠方の音圧は体積流量の時間微分に比例する．これにならい，音源を排気弁の質量流量の時間微分とする：<span class=\"im\"><span class=\"tx raw\" data-tex=\"q = \\frac{d\\dot m_{\\text{ex}}}{dt} = \\omega\\frac{d\\dot m_{\\text{ex}}}{d\\theta}\">q = \\frac{d\\dot m_{\\text{ex}}}{dt} = \\omega\\frac{d\\dot m_{\\text{ex}}}{d\\theta}<\/span><\/span>．<\/li>\n<li>直前に完了したサイクルの <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{ex}}(\\theta)\">\\dot m_{\\text{ex}}(\\theta)<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5^\\circ\">0.5^\\circ<\/span><\/span> 刻み，1440 点）から，中心差分で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{d\\dot m_{\\text{ex}}}{d\\theta}\">\\frac{d\\dot m_{\\text{ex}}}{d\\theta}<\/span><\/span> の表 <span class=\"im\"><span class=\"tx raw\" data-tex=\"s_i\">s_i<\/span><\/span>（周期境界）を作り，平均を引く．記録の無い点は <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> とする．表はサイクルの完了ごとに更新する．<\/li>\n<li>再生の位相 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\psi \\in [0, 1440)\">\\psi \\in [0, 1440)<\/span><\/span> を，サンプリング周波数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_s\">f_s<\/span><\/span> に対し 1 サンプルごとに <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta\\psi = \\frac{1440\\,\\bar N_a}{120\\,f_s}\">\\Delta\\psi = \\frac{1440\\,\\bar N_a}{120\\,f_s}<\/span><\/span> だけ進め，表を線形補間して読む．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N_a\">\\bar N_a<\/span><\/span> は機関の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N\">\\bar N<\/span><\/span> を時定数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"50\\ \\text{ms}\">50\\ \\text{ms}<\/span><\/span> の一次遅れで平滑した値．出力の周期は <span class=\"im\"><span class=\"tx raw\" data-tex=\"120/\\bar N_a\\ [\\text{s}]\">120/\\bar N_a\\ [\\text{s}]<\/span><\/span> になる．<\/li>\n<li>音源の振幅は <span class=\"im\"><span class=\"tx raw\" data-tex=\"q = \\frac{\\pi\\bar N_a}{30}\\,s(\\psi)\">q = \\frac{\\pi\\bar N_a}{30}\\,s(\\psi)<\/span><\/span>．<\/li>\n<li>新しい表は，位相が 1 周して <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> に戻る瞬間に切り替える．<\/li>\n<li><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N_a \\le 30\\ \\text{rpm}\">\\bar N_a \\le 30\\ \\text{rpm}<\/span><\/span> では音源の包絡を時定数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"30\\ \\text{ms}\">30\\ \\text{ms}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> に下げ，残響が減衰した後は出力を厳密に <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> にする．<\/li>\n<\/ol>\n<h4 id=\"spech93\">B. 排気管の共鳴，音量，ばらつき，雑音（計算の音）<\/h4>\n<ol type=\"1\">\n<li><strong>共鳴<\/strong>：長さ <span class=\"im\"><span class=\"tx raw\" data-tex=\"L\">L<\/span><\/span>，内径 <span class=\"im\"><span class=\"tx raw\" data-tex=\"d_e\">d_e<\/span><\/span> の排気管を，弁側が閉端・出口が開放端の管とみなし，往復時間 <span class=\"im\"><span class=\"tx raw\" data-tex=\"2L/c\">2L/c<\/span><\/span> の遅延と出口での反転反射を持つ帰還型のくし形フィルタで表す：<span class=\"im\"><span class=\"tx raw\" data-tex=\"v_k = q_k - \\rho_m\\,(h * v)_{k - D}\">v_k = q_k - \\rho_m\\,(h * v)_{k - D}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"D = \\frac{2Lf_s}{c}\">D = \\frac{2Lf_s}{c}<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\rho_m\">\\rho_m<\/span><\/span> は消音器の吸収を表す反射率（設定，既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.6\">0.6<\/span><\/span>），<span class=\"im\"><span class=\"tx raw\" data-tex=\"h\">h<\/span><\/span> は管内の損失を表す一次の低域フィルタ．音速は <span class=\"im\"><span class=\"tx raw\" data-tex=\"c = \\sqrt{\\gamma_b(T_X)\\,R\\,T_X}\">c = \\sqrt{\\gamma_b(T_X)\\,R\\,T_X}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_X = 800\\ \\text{K}\">T_X = 800\\ \\text{K}<\/span><\/span>．SPEC-02 の既燃ガス）<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\approx 550.7\\ \\text{m/s}\">\\approx 550.7\\ \\text{m/s}<\/span><\/span>．共鳴は <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_n = \\frac{(2n - 1)c}{4L}\">f_n = \\frac{(2n - 1)c}{4L}<\/span><\/span>（既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"L = 1\\ \\text{m}\">L = 1\\ \\text{m}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_1 \\approx 138\\ \\text{Hz}\">f_1 \\approx 138\\ \\text{Hz}<\/span><\/span>），極小は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{nc}{2L}\">\\frac{nc}{2L}<\/span><\/span>，極大と極小の比は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{1 + g}{1 - g}\">\\frac{1 + g}{1 - g}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"g = \\rho_m|H(f)|\">g = \\rho_m|H(f)|<\/span><\/span>）．<\/li>\n<li><strong>管内の損失<\/strong>：往復の振幅の減衰を，管壁の粘性・熱伝導（Kirchhoff）と開口端の放射の積とする： <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"|H(f)| = \\exp\\left(-2\\alpha_w L - \\frac{(ka)^2}{2}\\right), \\quad \\alpha_w = \\frac{\\sqrt{\\pi f\\nu}}{a\\,c}\\left(1 + \\frac{\\gamma_a - 1}{\\sqrt{Pr}}\\right), \\quad k = \\frac{2\\pi f}{c},\\ a = \\frac{d_e}{2}\">|H(f)| = \\exp\\left(-2\\alpha_w L - \\frac{(ka)^2}{2}\\right), \\quad \\alpha_w = \\frac{\\sqrt{\\pi f\\nu}}{a\\,c}\\left(1 + \\frac{\\gamma_a - 1}{\\sqrt{Pr}}\\right), \\quad k = \\frac{2\\pi f}{c},\\ a = \\frac{d_e}{2}<\/span><\/span> <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\nu = 8.4 \\times 10^{-5}\\ \\text{m}^2/\\text{s}\">\\nu = 8.4 \\times 10^{-5}\\ \\text{m}^2/\\text{s}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"Pr = 0.7\">Pr = 0.7<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_a = 1.35\">\\gamma_a = 1.35<\/span><\/span>（音響の損失の定数）．これを，<span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\ \\text{kHz}\">1\\ \\text{kHz}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"|H|\">|H|<\/span><\/span> が一致する一次の低域フィルタ <span class=\"im\"><span class=\"tx raw\" data-tex=\"y_k = (1 - b)x_k + b\\,y_{k - 1}\">y_k = (1 - b)x_k + b\\,y_{k - 1}<\/span><\/span> で近似する（<span class=\"im\"><span class=\"tx raw\" data-tex=\"b\">b<\/span><\/span> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"m^2|1 - be^{-i\\omega}|^2 = (1 - b)^2\">m^2|1 - be^{-i\\omega}|^2 = (1 - b)^2<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m = |H(1\\ \\text{kHz})|\">m = |H(1\\ \\text{kHz})|<\/span><\/span> の <span class=\"im\"><span class=\"tx raw\" data-tex=\"[0, 1)\">[0, 1)<\/span><\/span> の根）．フィルタの低域の群遅延 <span class=\"im\"><span class=\"tx raw\" data-tex=\"b/(1 - b)\">b/(1 - b)<\/span><\/span> サンプルを <span class=\"im\"><span class=\"tx raw\" data-tex=\"D\">D<\/span><\/span> から引き，<span class=\"im\"><span class=\"tx raw\" data-tex=\"D\">D<\/span><\/span> の小数部は線形補間する．単一のパルスに対する残響は，<span class=\"im\"><span class=\"tx raw\" data-tex=\"40\\ \\text{ms}\">40\\ \\text{ms}<\/span><\/span> 後にピークの <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\%\">1\\%<\/span><\/span> 未満であること．<\/li>\n<li><strong>音量の制御（圧縮器）<\/strong>：入力 <span class=\"im\"><span class=\"tx raw\" data-tex=\"x_c = 0.16(1 - \\rho_m)v\">x_c = 0.16(1 - \\rho_m)v<\/span><\/span> のピークの包絡 <span class=\"im\"><span class=\"tx raw\" data-tex=\"e_p\">e_p<\/span><\/span> を即応で立ち上げ，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.2\\ \\text{s}\">0.2\\ \\text{s}<\/span><\/span> 保持した後，時定数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.3\\ \\text{s}\">0.3\\ \\text{s}<\/span><\/span> で戻す（入力が包絡の <span class=\"im\"><span class=\"tx raw\" data-tex=\"99.9\\%\">99.9\\%<\/span><\/span> 以上なら保持を更新）．利得 <span class=\"im\"><span class=\"tx raw\" data-tex=\"G = \\min\\left(1, (l_t/e_p)^{1 - 1/R_c}\\right)\">G = \\min\\left(1, (l_t/e_p)^{1 - 1/R_c}\\right)<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"l_t = 0.35\">l_t = 0.35<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"R_c = 4\">R_c = 4<\/span><\/span>．出力は <span class=\"im\"><span class=\"tx raw\" data-tex=\"u = 1.6\\,V\\,G\\,x_c\">u = 1.6\\,V\\,G\\,x_c<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"V\">V<\/span><\/span>：音量）に対し，<span class=\"im\"><span class=\"tx raw\" data-tex=\"|u| \\le 0.8\">|u| \\le 0.8<\/span><\/span> では <span class=\"im\"><span class=\"tx raw\" data-tex=\"y = u\">y = u<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"|u| &gt; 0.8\">|u| &gt; 0.8<\/span><\/span> では <span class=\"im\"><span class=\"tx raw\" data-tex=\"y = \\text{sgn}(u)\\left(0.8 + 0.2\\tanh\\frac{|u| - 0.8}{0.2}\\right)\">y = \\text{sgn}(u)\\left(0.8 + 0.2\\tanh\\frac{|u| - 0.8}{0.2}\\right)<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"|y| &lt; 1\">|y| &lt; 1<\/span><\/span>）．保持の <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.2\\ \\text{s}\">0.2\\ \\text{s}<\/span><\/span> はアイドルの爆発間隔より長いので，定常では 1 サイクルの中で利得が一定になる．<\/li>\n<li><strong>サイクルのばらつき<\/strong>（設定「燃焼」のサイクル変動が ON のとき）：位相が 1 周するごとに，一様乱数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"z_1, z_2\">z_1, z_2<\/span><\/span>（平均 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>，分散 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\">1<\/span><\/span>，種を固定）で振幅係数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"A_j = 1 + 0.03z_1\">A_j = 1 + 0.03z_1<\/span><\/span>，周期 <span class=\"im\"><span class=\"tx raw\" data-tex=\"P_j = \\frac{120}{\\bar N}(1 + 0.005z_2)\">P_j = \\frac{120}{\\bar N}(1 + 0.005z_2)<\/span><\/span> とする．振幅係数はサイクルの中で前の値から線形に移す．OFF では厳密に周期的．<\/li>\n<li><strong>流れの雑音<\/strong>：弁の質量流量の絶対値の表 <span class=\"im\"><span class=\"tx raw\" data-tex=\"e(\\psi) = |\\dot m_{\\text{ex}}|\">e(\\psi) = |\\dot m_{\\text{ex}}|<\/span><\/span> を使い，音源に <span class=\"im\"><span class=\"tx raw\" data-tex=\"q_n = F\\,A_n\\left(\\frac{e(\\psi)}{e_{\\text{ref}}}\\right)^2 w_{\\text{bp}}\">q_n = F\\,A_n\\left(\\frac{e(\\psi)}{e_{\\text{ref}}}\\right)^2 w_{\\text{bp}}<\/span><\/span> を加える（<span class=\"im\"><span class=\"tx raw\" data-tex=\"A_n = 40\">A_n = 40<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"e_{\\text{ref}} = 0.05\\ \\text{kg/s}\">e_{\\text{ref}} = 0.05\\ \\text{kg/s}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"F\">F<\/span><\/span>：設定の流れ雑音，既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"40\\%\">40\\%<\/span><\/span>）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"w_{\\text{bp}}\">w_{\\text{bp}}<\/span><\/span> は分散 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\">1<\/span><\/span> の一様白色雑音（種を固定）を <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\ \\text{kHz}\">1\\ \\text{kHz}<\/span><\/span> の 2 次の高域通過と <span class=\"im\"><span class=\"tx raw\" data-tex=\"6\\ \\text{kHz}\">6\\ \\text{kHz}<\/span><\/span> の 2 次の低域通過（<span class=\"im\"><span class=\"tx raw\" data-tex=\"Q = 1/\\sqrt 2\">Q = 1/\\sqrt 2<\/span><\/span>）に通した信号．雑音も共鳴器を通る．<\/li>\n<\/ol>\n<h4 id=\"spech94\">C. 演出の音（数値計算ではない）<\/h4>\n<p>設定「音響」の <code>[音の種類 計算／演出]<\/code>（既定：計算）で切り替える．<strong>計算<\/strong>は A・B の音．<strong>演出<\/strong>は，聞いて心地よいことを目的に作った 4 気筒風の音で，物理モデルではない．定数はすべて利用者の試聴で決めた（9 種の試聴サンプルから選ばれた「4A」）．演出は機関の計算に影響しない．<\/p>\n<p><strong>処理の流れ<\/strong>（1 サンプルごと）：<\/p>\n<pre><code>計算（機関モデル）                     演出（合成器 Synth）\n 排気流量の表 s(ψ)，包絡 e(ψ) ─┐\n 平均回転数 N̄               ─┼→ [2] 4 気筒化（位相 180° ずつ，気筒ごとの利得と遅れ）→ 音量の配分\n 吸気管圧 p_in → [1] 負荷 ℓ  ─┘        │\n                                       ├← [3] 雑音（1.5〜7 kHz，流量の包絡で変調）\n                                       ├← [4] アクセルオフの破裂音（ℓ &lt; 0.08，N̄ &gt; 2200 rpm）\n                                       ↓\n                                    [5] 歪み → [6] 集合管の共鳴 → [7] 共鳴の付加 → [8] 明るさ\n                                       ├← [9] 吸気音\n                                       ↓\n                                    [10] 低域の持ち上げ → 高域通過 28 Hz → 圧縮器 → 制限 → 出力<\/code><\/pre>\n<ol type=\"1\">\n<li><strong>負荷の目安<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ell = \\text{clamp}\\left(\\frac{p_{\\text{in}}/p_{\\text{atm}} - 0.3}{0.6},\\ 0,\\ 1\\right)\">\\ell = \\text{clamp}\\left(\\frac{p_{\\text{in}}/p_{\\text{atm}} - 0.3}{0.6},\\ 0,\\ 1\\right)<\/span><\/span>．合成器の中で一次遅れ（上昇 <span class=\"im\"><span class=\"tx raw\" data-tex=\"40\\ \\text{ms}\">40\\ \\text{ms}<\/span><\/span>，下降 <span class=\"im\"><span class=\"tx raw\" data-tex=\"80\\ \\text{ms}\">80\\ \\text{ms}<\/span><\/span>）で平滑する．<\/li>\n<li><strong>4 気筒化と音量の配分<\/strong>：同じ表を位相 <span class=\"im\"><span class=\"tx raw\" data-tex=\"360k\">360k<\/span><\/span>（クランク角 <span class=\"im\"><span class=\"tx raw\" data-tex=\"180^\\circ k\">180^\\circ k<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"k = 0..3\">k = 0..3<\/span><\/span>）ずつずらして 4 本読み，気筒ごとの利得 <span class=\"im\"><span class=\"tx raw\" data-tex=\"g_k = (1, 0.98, 1.02, 1)\">g_k = (1, 0.98, 1.02, 1)<\/span><\/span> と遅れ <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\tau_k = (0, 0.05, 0.1, 0.05)\\ \\text{ms}\">\\tau_k = (0, 0.05, 0.1, 0.05)\\ \\text{ms}<\/span><\/span> を与えて足す： <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"x = G_x\\,\\lambda_\\ell\\,\\lambda_N\\sum_{k = 0}^{3}g_k\\,a_k\\,\\frac{\\pi\\bar N_a}{30}\\,s\\left(\\psi(t - \\tau_k) + 360k\\right)\">x = G_x\\,\\lambda_\\ell\\,\\lambda_N\\sum_{k = 0}^{3}g_k\\,a_k\\,\\frac{\\pi\\bar N_a}{30}\\,s\\left(\\psi(t - \\tau_k) + 360k\\right)<\/span><\/span> <span class=\"im\"><span class=\"tx raw\" data-tex=\"a_k\">a_k<\/span><\/span>：気筒ごと・サイクルごとの振幅のばらつき（サイクル変動 ON で <span class=\"im\"><span class=\"tx raw\" data-tex=\"1 \\pm 4\\%\">1 \\pm 4\\%<\/span><\/span> の一様乱数）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"G_x = 0.13/q_{\\text{ref}}\">G_x = 0.13/q_{\\text{ref}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"q_{\\text{ref}} = 14.59\\ \\text{kg/s}^2\">q_{\\text{ref}} = 14.59\\ \\text{kg/s}^2<\/span><\/span> は既定の諸元の全開・<span class=\"im\"><span class=\"tx raw\" data-tex=\"3500\\ \\text{rpm}\">3500\\ \\text{rpm}<\/span><\/span> の単気筒の音源 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{\\pi\\bar N}{30}s(\\psi)\">\\frac{\\pi\\bar N}{30}s(\\psi)<\/span><\/span> の実効値（定数として持つ．実測 <span class=\"im\"><span class=\"tx raw\" data-tex=\"14.587\">14.587<\/span><\/span>）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lambda_\\ell = \\lambda_0 + (1 - \\lambda_0)\\,\\text{clamp}\\left(\\frac{1600 - \\bar N_a}{700}, 0, 1\\right)\">\\lambda_\\ell = \\lambda_0 + (1 - \\lambda_0)\\,\\text{clamp}\\left(\\frac{1600 - \\bar N_a}{700}, 0, 1\\right)<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lambda_0 = 0.2 + 0.8\\ell^{0.8}\">\\lambda_0 = 0.2 + 0.8\\ell^{0.8}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lambda_N = \\min\\left(6, (3500/\\bar N_a)^{0.9}\\right)\">\\lambda_N = \\min\\left(6, (3500/\\bar N_a)^{0.9}\\right)<\/span><\/span>．<\/li>\n<li><strong>雑音<\/strong>：一様白色雑音（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 1\">\\pm 1<\/span><\/span>）を <span class=\"im\"><span class=\"tx raw\" data-tex=\"1.5\\ \\text{kHz}\">1.5\\ \\text{kHz}<\/span><\/span> の高域通過と <span class=\"im\"><span class=\"tx raw\" data-tex=\"7\\ \\text{kHz}\">7\\ \\text{kHz}<\/span><\/span> の低域通過に通し，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.045\\min\\left(4, (\\bar e/0.05)^2\\right)(0.3 + 0.7\\ell)\\frac{\\bar N_a}{3000}\">0.045\\min\\left(4, (\\bar e/0.05)^2\\right)(0.3 + 0.7\\ell)\\frac{\\bar N_a}{3000}<\/span><\/span> を掛ける（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar e\">\\bar e<\/span><\/span>：4 気筒の包絡の平均）．<\/li>\n<li><strong>破裂音<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ell &lt; 0.08\">\\ell &lt; 0.08<\/span><\/span> かつ <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N_a &gt; 2200\\ \\text{rpm}\">\\bar N_a &gt; 2200\\ \\text{rpm}<\/span><\/span> のとき，各気筒の周回ごとに確率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5\\min\\left(1, \\frac{\\bar N_a - 2200}{2000}\\right)\">0.5\\min\\left(1, \\frac{\\bar N_a - 2200}{2000}\\right)<\/span><\/span> で起こす．白色雑音を <span class=\"im\"><span class=\"tx raw\" data-tex=\"260\\ \\text{Hz}\">260\\ \\text{Hz}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"Q = 1.2\">Q = 1.2<\/span><\/span>）と <span class=\"im\"><span class=\"tx raw\" data-tex=\"1.1\\ \\text{kHz}\">1.1\\ \\text{kHz}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"Q = 1.5\">Q = 1.5<\/span><\/span>，利得 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.6\">0.6<\/span><\/span>）の帯域通過に通し，時定数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"12\\ \\text{ms}\">12\\ \\text{ms}<\/span><\/span> で減衰する包絡と <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.7\">0.7<\/span><\/span> を掛ける．<\/li>\n<li><strong>歪み<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"u = x + \\text{雑音} + \\text{破裂音}\">u = x + \\text{雑音} + \\text{破裂音}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"d = 2.6(0.25 + 0.75\\ell)\\left(0.4 + 0.6\\min(1, \\bar N_a/6000)\\right)\">d = 2.6(0.25 + 0.75\\ell)\\left(0.4 + 0.6\\min(1, \\bar N_a/6000)\\right)<\/span><\/span> として <span class=\"im\"><span class=\"tx raw\" data-tex=\"u \\leftarrow \\frac{\\tanh\\left(d\\,(u + 0.35u^2)\\right)}{\\max(0.2, \\tanh d)}\">u \\leftarrow \\frac{\\tanh\\left(d\\,(u + 0.35u^2)\\right)}{\\max(0.2, \\tanh d)}<\/span><\/span>．<\/li>\n<li><strong>集合管の共鳴<\/strong>：B.1 と同じ形のくし形フィルタを，管長 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.55\\ \\text{m}\">0.55\\ \\text{m}<\/span><\/span>，反射率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.8\">0.8<\/span><\/span>，帰還の低域フィルタの係数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.06\">0.06<\/span><\/span>，音速 <span class=\"im\"><span class=\"tx raw\" data-tex=\"556.7\\ \\text{m/s}\">556.7\\ \\text{m/s}<\/span><\/span>（演出の定数）で使う．<\/li>\n<li><strong>共鳴の付加<\/strong>：帯域通過（中心 [Hz]，<span class=\"im\"><span class=\"tx raw\" data-tex=\"Q\">Q<\/span><\/span>，利得 [dB]）<span class=\"im\"><span class=\"tx raw\" data-tex=\"= (95, 2.5, 5)\">= (95, 2.5, 5)<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"(190, 3, 3)\">(190, 3, 3)<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"(420, 4, 4)\">(420, 4, 4)<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"(1150, 4, 7)\">(1150, 4, 7)<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"(2600, 3, 6)\">(2600, 3, 6)<\/span><\/span> を通した成分を足す．<\/li>\n<li><strong>明るさ<\/strong>：遮断周波数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_c = 1400 + 7600\\,\\ell^{0.7}\\left(0.5 + 0.5\\min(1, \\bar N_a/5000)\\right)\">f_c = 1400 + 7600\\,\\ell^{0.7}\\left(0.5 + 0.5\\min(1, \\bar N_a/5000)\\right)<\/span><\/span> [Hz] の一次の低域通過を通した信号 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.7\">0.7<\/span><\/span> と元の信号 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.3\">0.3<\/span><\/span> を混ぜる．<\/li>\n<li><strong>吸気音<\/strong>：爆発の基本周波数の鋸歯状波（6 倍音まで）を <span class=\"im\"><span class=\"tx raw\" data-tex=\"420\\ \\text{Hz}\">420\\ \\text{Hz}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"Q = 2.2\">Q = 2.2<\/span><\/span>）と <span class=\"im\"><span class=\"tx raw\" data-tex=\"880\\ \\text{Hz}\">880\\ \\text{Hz}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"Q = 3\">Q = 3<\/span><\/span>，利得 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5\">0.5<\/span><\/span>）の帯域通過に通し，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.2\\,\\ell^2\\min(1, \\bar N_a/5500)\">0.2\\,\\ell^2\\min(1, \\bar N_a/5500)<\/span><\/span> を掛けて足す．<\/li>\n<li><strong>出力<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"150\\ \\text{Hz}\">150\\ \\text{Hz}<\/span><\/span> の low shelf <span class=\"im\"><span class=\"tx raw\" data-tex=\"+4\\ \\text{dB}\">+4\\ \\text{dB}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"28\\ \\text{Hz}\">28\\ \\text{Hz}<\/span><\/span> の高域通過の後，B.3 と同じ圧縮器と制限を通す．音量に対する利得は <span class=\"im\"><span class=\"tx raw\" data-tex=\"2.5V\">2.5V<\/span><\/span>．停止では A.6 と同じ包絡で音源を止め，残響が <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span> 未満になれば出力を厳密に <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> にする．<\/li>\n<li>演出では，排気管長・内径・反射率・流れ雑音の設定は使わない（音量とサイクル変動は使う）．<\/li>\n<\/ol>\n<p><strong>各段の意図<\/strong>：<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>段<\/th>\n<th>聞こえ方<\/th>\n<th>値の決め方<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>以下の段を「踏んでいる／離している」で変える<\/td>\n<td>アイドルと減速で <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>，全開で <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\">1<\/span><\/span> になるよう <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.3\">0.3<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.6\">0.6<\/span><\/span> を選んだ<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>音の高さが 4 倍（<span class=\"im\"><span class=\"tx raw\" data-tex=\"6500\\ \\text{rpm}\">6500\\ \\text{rpm}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"217\\ \\text{Hz}\">217\\ \\text{Hz}<\/span><\/span>）．減速中は静かに，アイドルは聞こえる大きさに<\/td>\n<td>モデルの排気流量は減速中も大きく，そのままでは減速中も全開並みの音量になるため下げる<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>排気の流れの「シャー」<\/td>\n<td>試聴<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>アクセルオフの「パラパラ」<\/td>\n<td>実機の減速時の後燃えを模した演出．モデルでは燃えていない<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>踏むほど，回すほど荒くなる<\/td>\n<td>非対称の項は偶数次の倍音を足すため<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>硬く張った音<\/td>\n<td>計算の音の既定より短く，反射を強くした<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"95\">95<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"190\\ \\text{Hz}\">190\\ \\text{Hz}<\/span><\/span>：低音．<span class=\"im\"><span class=\"tx raw\" data-tex=\"1150\">1150<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"2600\\ \\text{Hz}\">2600\\ \\text{Hz}<\/span><\/span>：高回転の甲高さ<\/td>\n<td>1 回目の試聴で低音の不足を指摘され追加<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>離すとこもり，踏むと開ける<\/td>\n<td>試聴<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>全開の「クォー」<\/td>\n<td>踏んだときだけ出す<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>低音の底上げ<\/td>\n<td>試聴<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>限界<\/strong>：4 気筒の爆発の周波数は <span class=\"im\"><span class=\"tx raw\" data-tex=\"6500\\ \\text{rpm}\">6500\\ \\text{rpm}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"217\\ \\text{Hz}\">217\\ \\text{Hz}<\/span><\/span> なので，高回転ではそれより低い成分はほとんど出ない．スマートフォンの内蔵スピーカでは <span class=\"im\"><span class=\"tx raw\" data-tex=\"95\">95<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"190\\ \\text{Hz}\">190\\ \\text{Hz}<\/span><\/span> は聞こえにくい．聴感の良し悪しは自動では判定できないので，要件定義書の実機目視チェックリストで確かめる．試聴サンプルの生成スクリプトは <code>tools/flavor/<\/code> にある．<\/p>\n<h4 id=\"spech95\">D. 実装<\/h4>\n<ol type=\"1\">\n<li>合成は AudioWorklet（音声専用のスレッド）で行う．合成器は DOM に依存しないクラス <code>Synth<\/code> とし，Worklet のコードはそのソースから作って，Blob URL，data URL の順で読み込む．どちらも失敗する環境では ScriptProcessorNode に同じ <code>Synth<\/code> を載せる．<\/li>\n<li>メインスレッドは毎フレーム <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N\">\\bar N<\/span><\/span>，音量，設定，音の種類，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ell\">\\ell<\/span><\/span> を送り，サイクルの完了時に新しい表を送る．<\/li>\n<li>音声は利用者の操作なしに始められないので，<code>[START]<\/code> または <code>[音]<\/code> のタップで AudioContext を作る．<\/li>\n<li>音が OFF のとき，テストの実行中，ページが非表示のときは，送る回転数を <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> にする．非表示の間は AudioContext を止める．<\/li>\n<li>設定「音響」の項目は SPEC-18．運転タブに <code>[音ON]<\/code>／<code>[音OFF]<\/code> の切替を置く（既定 ON）．<\/li>\n<li>スマートフォンの内蔵スピーカは低音が弱いので，ヘッドホンを勧める旨を解説タブに書く．<\/li>\n<\/ol>\n<ul>\n<li><strong>出典<\/strong>：L. E. Kinsler et al., <em>Fundamentals of Acoustics<\/em>, 4th ed., Wiley (2000), Ch. 7；<a target=\"_blank\" rel=\"noopener\" href=\"https://www.w3.org/TR/webaudio/\">W3C, Web Audio API<\/a>；<a target=\"_blank\" rel=\"noopener\" href=\"https://developer.chrome.com/blog/autoplay\">Chrome の自動再生の方針<\/a><\/li>\n<\/ul>\n<hr />\n","<h2 id=\"spech96\">7. 検証<\/h2>\n","<h3 id=\"spech97\">SPEC-20：検証の基盤（REQ-20）<\/h3>\n<h4 id=\"spech98\">A. 実行区分<\/h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>区分<\/th>\n<th>内容<\/th>\n<th>実行の場所<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>[A] 解析<\/td>\n<td>関数・状態機械・恒等式の検査（すぐ終わる）<\/td>\n<td>アプリ内<\/td>\n<\/tr>\n<tr>\n<td>[S] シナリオ<\/td>\n<td>下の表のシナリオで <code>EngineCore<\/code> を走らせる検査<\/td>\n<td>アプリ内<\/td>\n<\/tr>\n<tr>\n<td>[U] 画面<\/td>\n<td>DOM・Canvas・合成した Pointer Events による検査（現在のビューポートで）<\/td>\n<td>アプリ内<\/td>\n<\/tr>\n<tr>\n<td>[D] 開発時<\/td>\n<td>複数のビューポートでのヘッドレス検証<\/td>\n<td>開発時<\/td>\n<\/tr>\n<tr>\n<td>[M] 実機目視<\/td>\n<td>自動化できない見た目・操作感・聴感（要件定義書 5 節のチェックリスト）<\/td>\n<td>利用者の実機<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4 id=\"spech99\">B. 規則<\/h4>\n<ol type=\"1\">\n<li>TEST-01〜28 の [A][S][U] の項目はすべてアプリ内に実装し，<code>[全テスト実行]<\/code> で実行できる．チップの状態は「未実行／実行中／PASS／FAIL」の 4 つだけ．<\/li>\n<li><strong>利用者の状態によらない<\/strong>：設定画面・解説・画面の構成を操作する [U] の検査は，開始時に全設定を既定値，刻み ×1，保留なし，機関をコールドリセットした状態にしてから行い，終了後に実行前の状態（設定値，保留値，刻み，運転の状態，基準サイクル，表示中のページ）へ完全に戻す．<\/li>\n<li>[S] は運転中の機関とは別の <code>EngineCore<\/code> で実行し，運転中の機関の状態と設定を変えない．<\/li>\n<li>テストの実行中も画面が固まらないよう，1 フレームあたり <span class=\"im\"><span class=\"tx raw\" data-tex=\"12\\ \\text{ms}\">12\\ \\text{ms}<\/span><\/span> 以内に分けて実行し，進捗を表示する．途中で中止できる．実行中は運転中の機関の時間の進行を止めてよい（状態は保つ）．<\/li>\n<li>全テストの所要時間は <span class=\"im\"><span class=\"tx raw\" data-tex=\"180\\ \\text{s}\">180\\ \\text{s}<\/span><\/span> 以内．<\/li>\n<li>決定性：シナリオはサイクル変動 OFF で回し，乱数は種を固定した擬似乱数だけを使う．同じビルドで 2 回実行した結果の数値が完全に一致する．<\/li>\n<li>各検証項目は，項目名・基準・実測値・誤差・合否を持ち，詳細カードに表示する．<\/li>\n<li><strong>納品条件<\/strong>：[A][S][U] が全 PASS，[D] が全 PASS．1 件でも FAIL があれば成果物を公開しない．[M] で見つかった不具合は，再発を防ぐ自動テストを加えてから直す．<\/li>\n<\/ol>\n<h4 id=\"spech100\">C. シナリオ<\/h4>\n<p>既定設定からサイクル変動だけを OFF にし，既定のソルバ（DOPRI5）で積分する．「継続」は元のシナリオの終端の状態を複製して続ける．<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>ID<\/th>\n<th>開始<\/th>\n<th>操作<\/th>\n<th>時間<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>S1<\/td>\n<td>コールドリセット<\/td>\n<td>START<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"5\\ \\text{s}\">5\\ \\text{s}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>S2（アイドル）<\/td>\n<td>S1 を継続<\/td>\n<td>なし<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"+15\\ \\text{s}\">+15\\ \\text{s}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>S3（負荷）<\/td>\n<td>S2 を継続<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{manual}} = 0.3\">f_{\\text{manual}} = 0.3<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"+12\\ \\text{s}\">+12\\ \\text{s}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>N1200<\/td>\n<td>S2 を継続<\/td>\n<td>目標 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1200\\ \\text{rpm}\">1200\\ \\text{rpm}<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"+8\\ \\text{s}\">+8\\ \\text{s}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>S7（低気圧）<\/td>\n<td>S2 を継続<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{atm}} = 80\\ \\text{kPa}\">p_{\\text{atm}} = 80\\ \\text{kPa}<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"+10\\ \\text{s}\">+10\\ \\text{s}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>AMAX<\/td>\n<td>S2 を継続<\/td>\n<td>目標 <span class=\"im\"><span class=\"tx raw\" data-tex=\"2000\\ \\text{rpm}\">2000\\ \\text{rpm}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha_{\\max} = 5^\\circ\">\\alpha_{\\max} = 5^\\circ<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"+8\\ \\text{s}\">+8\\ \\text{s}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>N600<\/td>\n<td>S2 を継続<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{aux}} = 0\">T_{\\text{aux}} = 0<\/span><\/span>，目標 <span class=\"im\"><span class=\"tx raw\" data-tex=\"600\\ \\text{rpm}\">600\\ \\text{rpm}<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"+15\\ \\text{s}\">+15\\ \\text{s}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>CS0，CS6，CS10<\/td>\n<td>コールドリセット<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{aux}} = 0, 6, 10\\ \\text{N·m}\">T_{\\text{aux}} = 0, 6, 10\\ \\text{N·m}<\/span><\/span>，START<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"12\\ \\text{s}\">12\\ \\text{s}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>S4（動力計制御）<\/td>\n<td>コールドリセット<\/td>\n<td>動力計制御，目標 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1500\\ \\text{rpm}\">1500\\ \\text{rpm}<\/span><\/span>，開度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"15^\\circ\">15^\\circ<\/span><\/span>，START<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"20\\ \\text{s}\">20\\ \\text{s}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>S4b<\/td>\n<td>S4 を継続<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{atm}} = 80\\ \\text{kPa}\">p_{\\text{atm}} = 80\\ \\text{kPa}<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"+10\\ \\text{s}\">+10\\ \\text{s}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>S8（VVT）<\/td>\n<td>S4 を継続<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varphi_{\\text{in}} = +30^\\circ\">\\varphi_{\\text{in}} = +30^\\circ<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"+5\\ \\text{s}\">+5\\ \\text{s}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>S4V<\/td>\n<td>S4 を継続<\/td>\n<td>サイクル変動 ON<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"+10\\ \\text{s}\">+10\\ \\text{s}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>S5（容量超過）<\/td>\n<td>コールドリセット<\/td>\n<td>動力計制御，目標 <span class=\"im\"><span class=\"tx raw\" data-tex=\"800\\ \\text{rpm}\">800\\ \\text{rpm}<\/span><\/span>，全開，START<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"10\\ \\text{s}\">10\\ \\text{s}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>S6（出力不足）<\/td>\n<td>コールドリセット<\/td>\n<td>動力計制御，目標 <span class=\"im\"><span class=\"tx raw\" data-tex=\"3000\\ \\text{rpm}\">3000\\ \\text{rpm}<\/span><\/span>，開度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"7^\\circ\">7^\\circ<\/span><\/span>，START．<span class=\"im\"><span class=\"tx raw\" data-tex=\"10\\ \\text{s}\">10\\ \\text{s}<\/span><\/span> 後に目標 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1400\\ \\text{rpm}\">1400\\ \\text{rpm}<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"10 + 8\\ \\text{s}\">10 + 8\\ \\text{s}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>W3000<\/td>\n<td>コールドリセット<\/td>\n<td>動力計制御，目標 <span class=\"im\"><span class=\"tx raw\" data-tex=\"3000\\ \\text{rpm}\">3000\\ \\text{rpm}<\/span><\/span>，全開，定格トルク <span class=\"im\"><span class=\"tx raw\" data-tex=\"200\\ \\text{N·m}\">200\\ \\text{N·m}<\/span><\/span>，START<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"12\\ \\text{s}\">12\\ \\text{s}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>CRANK<\/td>\n<td>コールドリセット<\/td>\n<td>燃料 OFF でスターターだけ<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"5\\ \\text{s}\">5\\ \\text{s}<\/span><\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>回転数を固定した全開の定常（SPEC-26 の計測と同じ条件）は，<code>EngineCore<\/code> の回転数の固定（SPEC-10）と壁温の固定（<span class=\"im\"><span class=\"tx raw\" data-tex=\"360\\ \\text{K}\">360\\ \\text{K}<\/span><\/span>）を使う．<\/p>\n<hr />\n","<h3 id=\"spech101\">SPEC-24：内部 EGR と点火時期の妥当性の確かめ方（REQ-24）<\/h3>\n<ol type=\"1\">\n<li><strong>オーバーラップの変え方<\/strong>：オーバーラップ角 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta_{\\text{OL}} = \\text{EVC} - (\\text{IVO} + 720^\\circ)\">\\theta_{\\text{OL}} = \\text{EVC} - (\\text{IVO} + 720^\\circ)<\/span><\/span> を，IVO と EVC だけで変える（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{IVO} = -10, -25, -40^\\circ\">\\text{IVO} = -10, -25, -40^\\circ<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{EVC} = 730, 745, 760^\\circ\">\\text{EVC} = 730, 745, 760^\\circ<\/span><\/span> の組で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta_{\\text{OL}} = 20, 50, 80^\\circ\">\\theta_{\\text{OL}} = 20, 50, 80^\\circ<\/span><\/span>）．カムの位相で変えると EVO と IVC も動き，効果が混ざるため．<\/li>\n<li><strong>期待する傾向<\/strong>：残留ガスの相関（Fox–Cheng–Heywood）は，オーバーラップによる項が <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{OF}{N}\\sqrt{p_{\\text{em}} - p_{\\text{im}}}\">\\frac{OF}{N}\\sqrt{p_{\\text{em}} - p_{\\text{im}}}<\/span><\/span> に比例する（<span class=\"im\"><span class=\"tx raw\" data-tex=\"OF\">OF<\/span><\/span>：オーバーラップ係数，<span class=\"im\"><span class=\"tx raw\" data-tex=\"N\">N<\/span><\/span>：回転数，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{em}}\">p_{\\text{em}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{im}}\">p_{\\text{im}}<\/span><\/span>：排気・吸気マニホールド圧）．したがって，\n<ul>\n<li>吸気管の負圧が大きい軽負荷ほど，オーバーラップで <span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r\">x_r<\/span><\/span> が大きく増える．<\/li>\n<li>部分負荷では，<span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r\">x_r<\/span><\/span> の増加に伴って吸気管圧が上がってポンプ損失が減り，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\max}\">T_{\\max}<\/span><\/span> が下がり，正味熱効率は下がらない．<\/li>\n<li>全開では吸排気の差圧が小さく，内部 EGR は小さい．<\/li>\n<li>MBT 点火時期は回転とともに進角し，希釈（<span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r\">x_r<\/span><\/span> の増加）でも進角する．<\/li>\n<\/ul><\/li>\n<li><strong>判定値<\/strong>：実測に余裕を持たせて決めた．実機の典型値との比較は推定で，文献値で確かめたものではない．<\/li>\n<\/ol>\n<ul>\n<li><strong>出典<\/strong>：<a target=\"_blank\" rel=\"noopener\" href=\"https://doi.org/10.4271/931025\">J. W. Fox, W. K. Cheng, J. B. Heywood, SAE Technical Paper 931025 (1993)<\/a>；<a target=\"_blank\" rel=\"noopener\" href=\"https://www.fs.isy.liu.se/Publications/Articles/SAE_06_POLE.pdf\">P. Öberg and L. Eriksson, SAE (2006)<\/a><\/li>\n<\/ul>\n<hr />\n","<h3 id=\"spech102\">SPEC-28：アイドルの妥当性の確かめ方（REQ-28）<\/h3>\n<ol type=\"1\">\n<li><strong>対象<\/strong>：既定設定，無負荷，目標 <span class=\"im\"><span class=\"tx raw\" data-tex=\"800\\ \\text{rpm}\">800\\ \\text{rpm}<\/span><\/span> の定常（S2），サイクル変動 OFF，直近 10 サイクル平均．<\/li>\n<li><strong>単気筒であることの注意<\/strong>：本機は <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5\\ \\text{L}\">0.5\\ \\text{L}<\/span><\/span> の単気筒で，比べる実機の値は多気筒機関からの 1 気筒あたりの換算である．単気筒は排気量あたりの摩擦や熱損失が多気筒と同じとは限らず，回転変動も大きい．以下の範囲はこの差を見込んだ目安である．<\/li>\n<li><strong>判定する指標<\/strong>：\n<ul>\n<li>燃料流量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_f\">\\dot m_f<\/span><\/span>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.030\">0.030<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.050\\ \\text{g/s}\">0.050\\ \\text{g/s}<\/span><\/span>．根拠（推定）：排気量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"2.0\\ \\text{L}\">2.0\\ \\text{L}<\/span><\/span>・4 気筒の乗用車の暖機後アイドルの燃料消費を <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.6\">0.6<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.8\\ \\text{L/h}\">0.8\\ \\text{L/h}<\/span><\/span> とすると，1 気筒あたり <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.7 \\times 0.745/4/3600 \\approx 0.036\\ \\text{g/s}\">0.7 \\times 0.745/4/3600 \\approx 0.036\\ \\text{g/s}<\/span><\/span>（ガソリンの密度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.745\\ \\text{kg/L}\">0.745\\ \\text{kg/L}<\/span><\/span>）．<\/li>\n<li><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{FMEP} + \\text{AMEP}\">\\text{FMEP} + \\text{AMEP}<\/span><\/span>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"90\">90<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"130\\ \\text{kPa}\">130\\ \\text{kPa}<\/span><\/span>．根拠：火花点火機関の全摩擦平均有効圧の相関 <span class=\"im\"><span class=\"tx raw\" data-tex=\"97 + 15\\,(N/1000) + 5\\,(N/1000)^2\\ \\text{kPa}\">97 + 15\\,(N/1000) + 5\\,(N/1000)^2\\ \\text{kPa}<\/span><\/span>（Heywood の教科書に載る Barnes–Moss の相関と記憶しているが，<strong>係数は原典で確認できていない<\/strong>）が <span class=\"im\"><span class=\"tx raw\" data-tex=\"800\\ \\text{rpm}\">800\\ \\text{rpm}<\/span><\/span> で約 <span class=\"im\"><span class=\"tx raw\" data-tex=\"112\\ \\text{kPa}\">112\\ \\text{kPa}<\/span><\/span>．<\/li>\n<li>部分負荷（<span class=\"im\"><span class=\"tx raw\" data-tex=\"2000\\ \\text{rpm}\">2000\\ \\text{rpm}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{manual}} = 0.3\">f_{\\text{manual}} = 0.3<\/span><\/span>）の膨張のポリトロープ指数（<span class=\"im\"><span class=\"tx raw\" data-tex=\"400^\\circ\">400^\\circ<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"480^\\circ\">480^\\circ<\/span><\/span> の <span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"V\">V<\/span><\/span> から）：<span class=\"im\"><span class=\"tx raw\" data-tex=\"1.20\">1.20<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"1.35\">1.35<\/span><\/span>．根拠：圧縮・膨張とも <span class=\"im\"><span class=\"tx raw\" data-tex=\"1.3 \\pm 0.05\">1.3 \\pm 0.05<\/span><\/span> が目安（Heywood）．本モデルの既燃ガスの <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma\">\\gamma<\/span><\/span> は平衡組成の値（解離を含む）なので，目安の下側に出る．<\/li>\n<\/ul><\/li>\n<li><strong>記録する量<\/strong>（判定は「有限」だけ．値を検証タブの実測欄に出す）：吸気管圧，<span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r\">x_r<\/span><\/span>，排気弁が開く時点の筒内圧，アイドルの膨張の指数，排気弁が開いた直後の排気の逆流量．<\/li>\n<\/ol>\n<hr />\n","<h2 id=\"spech103\">8. テスト項目<\/h2>\n<p>各項目の先頭の記号は実行区分（SPEC-20 A）：[A] 解析，[S] シナリオ，[U] 画面，[D] 開発時．[A][S][U] はアプリの「検証」タブから実行できる．「（実測 …）」は，第25版の成果物をヘッドレス Chromium（<span class=\"im\"><span class=\"tx raw\" data-tex=\"360 \\times 640\">360 \\times 640<\/span><\/span>）で実行したときの値である．<\/p>\n","<h3 id=\"spech104\">TEST-01：スライダ・クランク運動学（REQ-01，SPEC-01）<\/h3>\n<ol type=\"1\">\n<li>[A] <span class=\"im\"><span class=\"tx raw\" data-tex=\"V(0) = V_c\">V(0) = V_c<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"V(\\pi) = V_c + V_d\">V(\\pi) = V_c + V_d<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"V(\\pi)/V(0) = \\varepsilon\">V(\\pi)/V(0) = \\varepsilon<\/span><\/span>（相対誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-12}\">10^{-12}<\/span><\/span>）．<\/li>\n<li>[A] <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta \\in \\{0.3, 1.1, 2.5, 4.2\\}\\ \\text{rad}\">\\theta \\in \\{0.3, 1.1, 2.5, 4.2\\}\\ \\text{rad}<\/span><\/span> で，解析的な <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{dV}{d\\theta}\">\\frac{dV}{d\\theta}<\/span><\/span> と中心差分（<span class=\"im\"><span class=\"tx raw\" data-tex=\"h = 10^{-5}\\ \\text{rad}\">h = 10^{-5}\\ \\text{rad}<\/span><\/span>）の相対誤差が <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span>
