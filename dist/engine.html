/td>\n<\/tr>\n<tr>\n<td>第22版<\/td>\n<td>タブレットと PC への対応（画面の大きさに応じた表示）<\/td>\n<\/tr>\n<tr>\n<td>第23版<\/td>\n<td>冷間始動への対応（補機負荷の feedforward と開度の下限）<\/td>\n<\/tr>\n<tr>\n<td>第24版<\/td>\n<td>演出の音（4 気筒風）<\/td>\n<\/tr>\n<tr>\n<td>第26版（策定中）<\/td>\n<td>化学種の熱物性と化学平衡（解離），直噴と気化潜熱（7.4 節）．仕様とテスト項目を定めた段階で，実装はまだ無い<\/td>\n<\/tr>\n<tr>\n<td>第25版<\/td>\n<td>熱物性・エネルギーの式・吸気側の熱・燃焼速度の定数・数値積分の見直し．文書を要件定義書・仕様書・用語の定義集に分け，解説タブから読めるようにした（7.3 節）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","<h3 id=\"reqh47\">7.2 未決事項と既知の限界<\/h3>\n<ol type=\"1\">\n<li><strong>スターターが実機より速い<\/strong>：燃料 OFF のクランキングが約 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1700\\ \\text{rpm}\">1700\\ \\text{rpm}<\/span><\/span> に達し，始動直後に回転が吹け上がる．アイドルへの整定に約 <span class=\"im\"><span class=\"tx raw\" data-tex=\"12\\ \\text{s}\">12\\ \\text{s}<\/span><\/span> かかる（SPEC-10）．<\/li>\n<li><strong>高い補機負荷での整定<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{aux}} \\ge 10\\ \\text{N·m}\">T_{\\text{aux}} \\ge 10\\ \\text{N·m}<\/span><\/span> では整定が遅い．低い目標回転数（<span class=\"im\"><span class=\"tx raw\" data-tex=\"600\\ \\text{rpm}\">600\\ \\text{rpm}<\/span><\/span>）では回転が数十 rpm の幅で振れ続ける（SPEC-12）．<\/li>\n<li><strong>アイドルの吸気管圧<\/strong>：サイクルの終端の値で，始動から <span class=\"im\"><span class=\"tx raw\" data-tex=\"20\\ \\text{s}\">20\\ \\text{s}<\/span><\/span>（S2）で <span class=\"im\"><span class=\"tx raw\" data-tex=\"26.6\\ \\text{kPa}\">26.6\\ \\text{kPa}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"30\\ \\text{s}\">30\\ \\text{s}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"29.1\\ \\text{kPa}\">29.1\\ \\text{kPa}<\/span><\/span>（実測．壁温が上がるにつれて上がる）．実機の推定（<span class=\"im\"><span class=\"tx raw\" data-tex=\"30\">30<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"35\\ \\text{kPa}\">35\\ \\text{kPa}<\/span><\/span>）より低めである．吹き返しによる吸気の加熱を入れて，第24版（S2 で <span class=\"im\"><span class=\"tx raw\" data-tex=\"23.5\\ \\text{kPa}\">23.5\\ \\text{kPa}<\/span><\/span>）からは上がった．ポート壁による吸気の加熱を扱っていないことが一因と考えられる（推定）．<\/li>\n<li><strong>既燃ガスの比熱<\/strong>：線形の当てはめで，<span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\%\">1\\%<\/span><\/span> 弱の誤差がある．より正確な Krieger–Borman の多項式は，係数を原典で確認できていないため採用していない（SPEC-02）．<\/li>\n<li><strong>文献で確認できていない値<\/strong>：Barnes–Moss の相関の係数（SPEC-28），Martyr と Plint の版とページ（SPEC-11）．<\/li>\n<li><strong>吸気ポートの壁との熱のやりとり<\/strong>：扱っていない（断熱）．吹き返しによる吸気の加熱は上限の見積もりである（SPEC-05）．<\/li>\n<li><strong>排気の温度<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"800\\ \\text{K}\">800\\ \\text{K}<\/span><\/span> 一定．排気弁が開く時点の筒内の温度はこれより高い（SPEC-27）．<\/li>\n<li><strong>単気筒であること<\/strong>：実機と比べる値は多気筒機関からの 1 気筒あたりの換算で，排気量あたりの摩擦や熱損失が同じとは限らない（SPEC-28）．<\/li>\n<li><strong>画面と音の仕様<\/strong>（REQ-15〜23，26）は，第25版で文書を書き直したが，解説タブの文書の閲覧（REQ-16）を除いて第24版から変えていない．<\/li>\n<li><strong>ノッキング<\/strong>：扱わない．点火は常に MBT が取れるので，実機でリッチにする主な理由（ノックを避けて点火を進められること，排気温の保護）による利得は現れない（7.4 節，<code>docs/report_richburn.md<\/code>）．<\/li>\n<li><strong>単一ゾーンでの解離<\/strong>（第26版）：既燃ガスの平衡組成を筒内の平均温度で評価するので，解離を小さく見積もる（SPEC-29）．<\/li>\n<\/ol>\n","<h3 id=\"reqh48\">7.3 第25版<\/h3>\n<h4 id=\"reqh49\">経緯<\/h4>\n<ol type=\"1\">\n<li>機関の数値計算の観点からのレビュー（<code>docs/review_requirements.md<\/code>）の全項目に利用者が同意し，「矛盾のない要件定義書を作成したうえで，それが漏れなく実現するテストを整えたうえで実装しなさい．分からないときは自分に聞くこと」と指示した．<\/li>\n<li>作業の途中で利用者が「要件定義書に全部書いてしまっている．あらためて要件定義書と仕様書と用語の定義集を数式を用いて書いてまとめて」と指示し，文書を 3 つに分けた（1.5 節）．<\/li>\n<li>続けて「成果物の HTML の説明タブから 3 文書へのリンクを付けて，もしくは全文いい感じに載せて．数式のレンダリングもされるようにして」と指示し，3 文書の全文を解説タブに埋め込んだ（REQ-16）．<\/li>\n<\/ol>\n<h4 id=\"reqh50\">利用者に確認して決めたこと<\/h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>質問<\/th>\n<th>利用者の選択<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>筒内ガスの比熱のモデル<\/td>\n<td>未燃・既燃の線形当てはめ 2 本を燃焼割合で補間（Klein–Eriksson の表）<\/td>\n<\/tr>\n<tr>\n<td>吸気ポートの壁との熱のやりとり<\/td>\n<td>断熱（壁とのやりとり無し）<\/td>\n<\/tr>\n<tr>\n<td>層流燃焼速度の定数<\/td>\n<td>Turns の教科書の gasoline の組に統一<\/td>\n<\/tr>\n<tr>\n<td>文書の再構成の範囲<\/td>\n<td>全 REQ<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4 id=\"reqh51\">レビューの項目と対応<\/h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>対応<\/th>\n<th>仕様<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A1 比熱比が空気に近い<\/td>\n<td>未燃・既燃の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma\">\\gamma<\/span><\/span> の当てはめ，比熱の補間，内部エネルギーの積分<\/td>\n<td>SPEC-02<\/td>\n<\/tr>\n<tr>\n<td>A2 吹き返しの熱が消える<\/td>\n<td>余剰エンタルピーを状態（<span class=\"im\"><span class=\"tx raw\" data-tex=\"E_{\\text{in}}\">E_{\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"E_p\">E_p<\/span><\/span>）として追跡<\/td>\n<td>SPEC-05，25<\/td>\n<\/tr>\n<tr>\n<td>A3 流入エンタルピーの不整合<\/td>\n<td>顕熱の内部エネルギーによる導出に改め，組成の項 <span class=\"im\"><span class=\"tx raw\" data-tex=\"r(e_u - e_b)\">r(e_u - e_b)<\/span><\/span> を加えた．第一法則の残差をテストにした<\/td>\n<td>SPEC-09<\/td>\n<\/tr>\n<tr>\n<td>A4 吸気が空気か混合気か<\/td>\n<td>予混合気と明記<\/td>\n<td>SPEC-05<\/td>\n<\/tr>\n<tr>\n<td>A5 冷却水温が一定<\/td>\n<td>「冷間」は壁温の初期値だけを指すと明記<\/td>\n<td>SPEC-08<\/td>\n<\/tr>\n<tr>\n<td>A6 「断熱」の言葉<\/td>\n<td>「ポリトロープ指数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1.33\">1.33<\/span><\/span>」に<\/td>\n<td>SPEC-08<\/td>\n<\/tr>\n<tr>\n<td>A7 往復質量の慣性<\/td>\n<td>無視していることを明記<\/td>\n<td>SPEC-10<\/td>\n<\/tr>\n<tr>\n<td>A8 層流燃焼速度の定数<\/td>\n<td>Turns の組（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi_m = 1.13\">\\phi_m = 1.13<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"B_m = 0.2758\">B_m = 0.2758<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"B_2 = -0.7834\\ \\text{m/s}\">B_2 = -0.7834\\ \\text{m/s}<\/span><\/span>）<\/td>\n<td>SPEC-07<\/td>\n<\/tr>\n<tr>\n<td>A9 希釈の項<\/td>\n<td>Turns の形 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1 - 2.1\\,x_r\">1 - 2.1\\,x_r<\/span><\/span>（質量分率）に<\/td>\n<td>SPEC-07<\/td>\n<\/tr>\n<tr>\n<td>A10 燃焼割合と燃焼効率の重なり<\/td>\n<td>明記<\/td>\n<td>SPEC-07<\/td>\n<\/tr>\n<tr>\n<td>A11 排気の温度<\/td>\n<td>限界として大きさを明記<\/td>\n<td>SPEC-27<\/td>\n<\/tr>\n<tr>\n<td>B1 硬さと RK4 の刻み<\/td>\n<td>硬さの実測を書き，RK4 の既定を <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.25^\\circ\">0.25^\\circ<\/span><\/span>，刻みの上限を <span class=\"im\"><span class=\"tx raw\" data-tex=\"3 \\times 10^{-5}\\ \\text{s}\">3 \\times 10^{-5}\\ \\text{s}<\/span><\/span> に．硬さのテストを追加<\/td>\n<td>SPEC-13<\/td>\n<\/tr>\n<tr>\n<td>B2 DOPRI5 が実質固定刻み<\/td>\n<td>事実として明記<\/td>\n<td>SPEC-13<\/td>\n<\/tr>\n<tr>\n<td>B3 イベントの量子化<\/td>\n<td>サイクルの終端・弁の開閉・点火でステップを切る．処理は終端の状態で行う．最高圧は放物線で補間<\/td>\n<td>SPEC-13<\/td>\n<\/tr>\n<tr>\n<td>B4 集計が低次<\/td>\n<td>補助積分（状態と同じ重み）に<\/td>\n<td>仕様書 2.3，SPEC-13，14<\/td>\n<\/tr>\n<tr>\n<td>B5 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta\">\\theta<\/span><\/span> が増え続ける<\/td>\n<td>サイクルの終端で <span class=\"im\"><span class=\"tx raw\" data-tex=\"4\\pi\">4\\pi<\/span><\/span> を引く<\/td>\n<td>仕様書 2.1，SPEC-13<\/td>\n<\/tr>\n<tr>\n<td>B6 正則化の記述<\/td>\n<td>「値だけ連続（<span class=\"im\"><span class=\"tx raw\" data-tex=\"C^0\">C^0<\/span><\/span>）」に直した（式は変えない）<\/td>\n<td>SPEC-04<\/td>\n<\/tr>\n<tr>\n<td>B7 カムの滑らかさの呼び名<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"C^1\">C^1<\/span><\/span>／<span class=\"im\"><span class=\"tx raw\" data-tex=\"C^0\">C^0<\/span><\/span> と書き直した<\/td>\n<td>SPEC-03<\/td>\n<\/tr>\n<tr>\n<td>B8 射影<\/td>\n<td>列挙し，適用 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> 回をテストにした<\/td>\n<td>SPEC-13<\/td>\n<\/tr>\n<tr>\n<td>B9 制御の離散化<\/td>\n<td>更新の式を明記し，平均回転数の一次遅れを充水率と同じ指数形にそろえた<\/td>\n<td>SPEC-12，13<\/td>\n<\/tr>\n<tr>\n<td>C 記述の誤り・古い記述・未定義の定数<\/td>\n<td>現行の仕様だけを書き，定数（<span class=\"im\"><span class=\"tx raw\" data-tex=\"C_{\\text{turb}}\">C_{\\text{turb}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\omega_{\\min}\">\\omega_{\\min}<\/span><\/span>，許容誤差，弁径の比，初期温度など）を明記<\/td>\n<td>全体<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4 id=\"reqh52\">公開後の修正（2026-11-15）<\/h4>\n<ol type=\"1\">\n<li><p>利用者が「性能曲線の前提は設定で設定したカムなどの設定を使って」「前提のところに即座に反映されていない」と指摘した．計測そのものは，開始した時点の適用済みの設定を使っていた（カム Aggr，最大リフト，IVC，位相，圧縮比を変えて全開の <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_b\">T_b<\/span><\/span> が変わることを実行して確かめた）．不具合は「前提」の表の側にあった：(a) 計測済みの結果があると，表は計測した時点の設定を示し続け，設定を変えても変わらなかった．(b) カムの種類と最大リフト，排気系が表に無く，変えても表に現れなかった．<\/p><\/li>\n<li><p>REQ-26 の受入基準 8 を加え，表は「次の計測に使う設定」（計測中は実行中の計測の設定）を示して直ちに更新することにした．表にカムの種類・最大リフト・排気系を加え，曲線が古いときと保留中の変更があるときの注記を加えた（SPEC-26 B.4，TEST-26 項目 14）．テストを先に加え，修正前に FAIL することを確かめてから直した．<\/p><\/li>\n<li><p>続けて利用者が「スロットルを制御してるのに固定開度として動かせてしまうのは変なので修正したい」と指摘した．スロットル制御では開度を ECU が PI 制御で決めるため，固定開度は使われていなかったが，設定画面で変更できた（値は記憶されるだけで，動力計制御に切り替えたときも，指令が跳ばないよう切替の直前の開度で上書きされる．SPEC-11 4）．同じ理由で，スロットル制御の基準充水率，動力計制御の固定充水率も使われていなかった．REQ-18 の受入基準 7 を加え，使わない項目は <code>[−]<\/code> <code>[+]<\/code> を無効にし，制御が操作している量はその行に現在の値を表示することにした（SPEC-18 B.7，TEST-18 項目 16）．<\/p><\/li>\n<li><p>修正の報告で，動力計制御に切り替えたとき固定開度が直前の開度（約 <span class=\"im\"><span class=\"tx raw\" data-tex=\"2.5^\\circ\">2.5^\\circ<\/span><\/span>）で上書きされるのに，設定画面が刻み <span class=\"im\"><span class=\"tx raw\" data-tex=\"1^\\circ\">1^\\circ<\/span><\/span> で「3」と表示する食い違いを伝えたところ，利用者が「0.1 単位で良いと思う」と答えた．固定開度の刻みを <span class=\"im\"><span class=\"tx raw\" data-tex=\"1^\\circ\">1^\\circ<\/span><\/span> から <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.1^\\circ\">0.1^\\circ<\/span><\/span> に改めた（SPEC-18 C，TEST-18 項目 16）．切替の直後の値は格子に丸めない（丸めると開度が最大 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.05^\\circ\">0.05^\\circ<\/span><\/span> 跳び，REQ-11 受入基準 6 の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lvert\\Delta\\alpha\\rvert \\le 0.01^\\circ\">\\lvert\\Delta\\alpha\\rvert \\le 0.01^\\circ<\/span><\/span> を満たさないため）．<\/p><\/li>\n<li><p>続けて利用者が「性能曲線：刻みに 25 rpm 毎を追加．収束の最小と最大を指定できるようにして」と指示した．REQ-26 の受入基準 9 を加えた．最少・最多は，これまで厳しさに付いていた最少のサイクル数（標準 4，厳格 6）と固定の最多 60 を，条件の画面で変えられる値にしたもので，厳しさを選ぶと最少はその厳しさの値に戻る（既定の計測の結果は変わらない）．範囲と刻みは SPEC-26 A.6（TEST-26 項目 10，11，15）．<\/p><\/li>\n<li><p>利用者が成果物のソースを読み，フォントを base64 で埋め込んでいることについて「これライセンス的に問題ないの」と尋ねた．GUST Font License（LPPL 1.3c に名前の変更の要請を加えたもの）と LPPL 1.3c 第 6 節を読み，次のように整理して伝えた（法的な助言ではない）：サブセットは LPPL の「改変」に当たる．名前の変更（GFL の要請と 6(a)）と支持を装わないこと（6(c)）は満たしていたが，変更内容の表示（6(b)）と原本の入手先（6(d)）が無かった．6(b)(d) は原本の代わりとして使うことを意図しない改変版には適用されないとの但し書きがあり，現状も違反ではないと読める余地はあるが，表示を足すことにした．利用者が「それでお願い」と同意し，制約 C-8 と REQ-16 の受入基準 7 を加えた（SPEC-16 3，TEST-16 項目 18）．<\/p><\/li>\n<li><p>6 の表示を加えた後，利用者が「やはりバイナリ埋め込みは止めたい」と述べ，利用者自身の Web ページ（MathJax 2.7.1 を cdnjs から読み，TeX を表示時に組む）を例に検討を求めた．フォントを埋め込まずに組む方法として，端末の数式フォントに任せる方法と，外部の数式フォントを読む方法を示し，見比べのページを作った．利用者は「MathJax を使えたら使う．使えなかったら生の TeX 表示で構わない．フォントは埋め込まない」と決めた．オフライン時の表示を，ブラウザの MathML（端末のフォント）にするか TeX のソースにするかを尋ね，利用者は TeX のソースを選んだ．<\/p>\n<ul>\n<li>C-1 を改め，数式の組版だけをネットワークに依存してよいこととした（無ければ TeX のソースを表示）．C-8 を「第三者の著作物を埋め込まない」に改め，REQ-16 の受入基準 3，6，7 を改めた（SPEC-16 3・9，TEST-16 項目 1，2，4，5，7，10，13，15，18，19）．<\/li>\n<li>数式は解説・3 文書とも TeX で持つ．解説の式の生成器は MathML ではなく TeX を出力し，3 文書は pandoc で HTML にするときに数式を TeX のまま残す．MathJax は SVG 出力（字形は MathJax のスクリプトに含まれ，フォントを別に読まない．アーティファクトの CSP はスクリプトを cdnjs から読むことを許すが，フォントのファイルは許さないため）．<\/li>\n<li>Latin Modern Math のサブセットと，6 で加えた配布条件の表示（フォントの名前表，CSS のコメント）を取り除いた．<\/li>\n<li>7 通りの検証で，TEST-15 の「表示テキストに bar を含まない」が TeX のソースの <code>\\bar<\/code>（上線の命令）で FAIL し，TEST-20 の最長フレーム間隔が <span class=\"im\"><span class=\"tx raw\" data-tex=\"312\">312<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"366\\ \\text{ms}\">366\\ \\text{ms}<\/span><\/span> で FAIL した．後者は，3 文書の全数式（約 <span class=\"im\"><span class=\"tx raw\" data-tex=\"4100\">4100<\/span><\/span> 式）を SVG に組むと解説タブの要素が約 <span class=\"im\"><span class=\"tx raw\" data-tex=\"13.5\">13.5<\/span><\/span> 万個になり，タブを切り替えるだけで <span class=\"im\"><span class=\"tx raw\" data-tex=\"158\\ \\text{ms}\">158\\ \\text{ms}<\/span><\/span> かかったためである（実測）．数式は画面に入るものから順に組むことにし（SPEC-16 3），bar の検査から TeX のソースを除いた（TEST-15 項目 3）．<\/li>\n<\/ul><\/li>\n<li><p>PC の Edge 102 で解説タブがスクロールしない報告があった（高さの単位 <code>dvh<\/code> が Chromium 108 以降でしか使えないため）．利用者の判断で Edge 102 は古すぎるので対象外とした（<code>dvh<\/code> の指定を <code>@supports<\/code> で分けた CSS はそのまま残す）．<\/p><\/li>\n<li><p>8 の対応の 7 通りの検証で，TEST-20 の総所要時間（上限 <span class=\"im\"><span class=\"tx raw\" data-tex=\"120\\ \\text{s}\">120\\ \\text{s}<\/span><\/span>）が 6 通りで FAIL した（<span class=\"im\"><span class=\"tx raw\" data-tex=\"120.5\">120.5<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"146.9\\ \\text{s}\">146.9\\ \\text{s}<\/span><\/span>）．作業環境の再起動の後に計算機が遅くなったためで，修正前の版（4da71dc）も同じ環境で <span class=\"im\"><span class=\"tx raw\" data-tex=\"113.8\\ \\text{s}\">113.8\\ \\text{s}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"360 \\times 640\">360 \\times 640<\/span><\/span>）かかり，前回の <span class=\"im\"><span class=\"tx raw\" data-tex=\"87\">87<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"94\\ \\text{s}\">94\\ \\text{s}<\/span><\/span> より長かった．利用者が「180 秒まで緩和」と指示し，REQ-20 の受入基準 3 の上限を <span class=\"im\"><span class=\"tx raw\" data-tex=\"180\\ \\text{s}\">180\\ \\text{s}<\/span><\/span> にした（SPEC-20，TEST-20 項目 5）．実機（Galaxy S26+）の所要は第25版で <span class=\"im\"><span class=\"tx raw\" data-tex=\"52.3\\ \\text{s}\">52.3\\ \\text{s}<\/span><\/span>．<\/p><\/li>\n<li><p>第26版の仕様（REQ-29，30）を文書に加えて仕様書が約 2 割大きくなった版の 7 通りの検証で，TEST-20 のフレーム間隔が 1 通りで <span class=\"im\"><span class=\"tx raw\" data-tex=\"280.6\\ \\text{ms}\">280.6\\ \\text{ms}<\/span><\/span>（上限 <span class=\"im\"><span class=\"tx raw\" data-tex=\"250\">250<\/span><\/span>）になった．利用者が「解説タブ，いい感じに分割表示しても良いよ」と述べ，3 文書を見出しごとのページに分けて表示することにした（REQ-16 受入基準 6，SPEC-16 9，TEST-16 項目 15〜17）．式の解説（§0〜§17）は小さいので 1 つのままにした．<\/p><\/li>\n<\/ol>\n<h4 id=\"reqh53\">自分で決めたこと（理由は仕様書の各 SPEC）<\/h4>\n<p>気体定数は共通の <span class=\"im\"><span class=\"tx raw\" data-tex=\"R\">R<\/span><\/span> のまま <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma\">\\gamma<\/span><\/span> を文献値に合わせる（SPEC-02）．当てはめの有効範囲の外は頭打ち（SPEC-02）．余剰エンタルピーはマニホールドとポートの 2 状態で運ぶ（SPEC-05，25）．ランナと排気ポートの剛性の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_0 = 1.4\">\\gamma_0 = 1.4<\/span><\/span> は集中定数の定数として残す（SPEC-25，27）．エンジン音の音速は既燃ガスの <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_b(800\\ \\text{K})\">\\gamma_b(800\\ \\text{K})<\/span><\/span> で求める（SPEC-21）．演出の音の音量の基準 <span class=\"im\"><span class=\"tx raw\" data-tex=\"q_{\\text{ref}}\">q_{\\text{ref}}<\/span><\/span> は新しいモデルの値（<span class=\"im\"><span class=\"tx raw\" data-tex=\"14.68 \\to 14.59\">14.68 \\to 14.59<\/span><\/span>）に合わせ直す（SPEC-21）．スロットルの逆流の比熱比は上流温度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{up}}\">T_{\\text{up}}<\/span><\/span> での値にする（SPEC-05）．<\/p>\n<h4 id=\"reqh54\">モデルの変更による結果の変化（実測．第24版 → 第25版）<\/h4>\n<p>モデルの係数は結果に合わせて調整していない．変化は，比熱比を混合気・既燃ガスの値に直したこと（A1），吹き返しの熱を保存したこと（A2）による．<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>量<\/th>\n<th style=\"text-align: right;\">第24版<\/th>\n<th style=\"text-align: right;\">第25版<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>全開の軸トルクの最大（回転数固定の計測）<\/td>\n<td style=\"text-align: right;\"><span class=\"im\"><span class=\"tx raw\" data-tex=\"41.4\\ \\text{N·m}\">41.4\\ \\text{N·m}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"4000\\ \\text{rpm}\">4000\\ \\text{rpm}<\/span><\/span>）<\/td>\n<td style=\"text-align: right;\"><span class=\"im\"><span class=\"tx raw\" data-tex=\"35.4\\ \\text{N·m}\">35.4\\ \\text{N·m}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"2000\\ \\text{rpm}\">2000\\ \\text{rpm}<\/span><\/span>）<\/td>\n<\/tr>\n<tr>\n<td>全開の軸出力の最大<\/td>\n<td style=\"text-align: right;\"><span class=\"im\"><span class=\"tx raw\" data-tex=\"18.4\\ \\text{kW}\">18.4\\ \\text{kW}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"5000\\ \\text{rpm}\">5000\\ \\text{rpm}<\/span><\/span>）<\/td>\n<td style=\"text-align: right;\"><span class=\"im\"><span class=\"tx raw\" data-tex=\"15.3\\ \\text{kW}\">15.3\\ \\text{kW}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"5000\\ \\text{rpm}\">5000\\ \\text{rpm}<\/span><\/span>）<\/td>\n<\/tr>\n<tr>\n<td>アイドルの吸気管圧（S2：始動から <span class=\"im\"><span class=\"tx raw\" data-tex=\"20\\ \\text{s}\">20\\ \\text{s}<\/span><\/span>，サイクルの終端）<\/td>\n<td style=\"text-align: right;\"><span class=\"im\"><span class=\"tx raw\" data-tex=\"23.5\\ \\text{kPa}\">23.5\\ \\text{kPa}<\/span><\/span><\/td>\n<td style=\"text-align: right;\"><span class=\"im\"><span class=\"tx raw\" data-tex=\"26.6\\ \\text{kPa}\">26.6\\ \\text{kPa}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>アイドルの燃料流量<\/td>\n<td style=\"text-align: right;\"><span class=\"im\"><span class=\"tx raw\" data-tex=\"0.0383\\ \\text{g/s}\">0.0383\\ \\text{g/s}<\/span><\/span><\/td>\n<td style=\"text-align: right;\"><span class=\"im\"><span class=\"tx raw\" data-tex=\"0.0393\\ \\text{g/s}\">0.0393\\ \\text{g/s}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>アイドルの残留ガス率<\/td>\n<td style=\"text-align: right;\"><span class=\"im\"><span class=\"tx raw\" data-tex=\"0.227\">0.227<\/span><\/span><\/td>\n<td style=\"text-align: right;\"><span class=\"im\"><span class=\"tx raw\" data-tex=\"0.211\">0.211<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>部分負荷（<span class=\"im\"><span class=\"tx raw\" data-tex=\"2000\\ \\text{rpm}\">2000\\ \\text{rpm}<\/span><\/span>）の膨張のポリトロープ指数<\/td>\n<td style=\"text-align: right;\"><span class=\"im\"><span class=\"tx raw\" data-tex=\"1.364\">1.364<\/span><\/span><\/td>\n<td style=\"text-align: right;\"><span class=\"im\"><span class=\"tx raw\" data-tex=\"1.261\">1.261<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>第一法則の残差／発熱（アイドル）<\/td>\n<td style=\"text-align: right;\"><span class=\"im\"><span class=\"tx raw\" data-tex=\"9 \\times 10^{-3}\">9 \\times 10^{-3}<\/span><\/span><\/td>\n<td style=\"text-align: right;\"><span class=\"im\"><span class=\"tx raw\" data-tex=\"1.9 \\times 10^{-6}\">1.9 \\times 10^{-6}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>RK4（既定の刻み）のアイドルの IMEP の誤差<\/td>\n<td style=\"text-align: right;\"><span class=\"im\"><span class=\"tx raw\" data-tex=\"1.6\\%\">1.6\\%<\/span><\/span><\/td>\n<td style=\"text-align: right;\"><span class=\"im\"><span class=\"tx raw\" data-tex=\"0.0013\\%\">0.0013\\%<\/span><\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>第24版の値は，第24版の成果物（コミット <code>166282d<\/code>）を今回あらためて実行して測った．下の 2 行は第24版には対応するテストが無く，レビュー（<code>docs/review_requirements.md<\/code>）での実測である．<\/p>\n<h4 id=\"reqh55\">テストの突き合わせで見つけて直したこと<\/h4>\n<p>要件の文とテスト項目を 1 つずつ照らし，次を直した（テストを先に足し，FAIL を確かめてから直したもの）．<\/p>\n<ul>\n<li><code>[既定値]<\/code> を押しても，要リセット項目の保留値が既定値に戻らなかった（保留値が現在値と違うときに何も起きなかった）．TEST-18 項目 13 を足して直した．<\/li>\n<li>解説タブの記号表で，同じ記号を 2 回定義していた（<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_m\">p_m<\/span><\/span>：消音器の圧力とモータリング圧，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\rho_e\">\\rho_e<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_r\">f_r<\/span><\/span> など．後の定義が前の定義を上書きしていた）．記号を分け，ビルド時に重複を検査するようにした．TEST-16 項目 2 は添字つきの記号を検査していなかったので，全記号を検査するようにした．<\/li>\n<li>仕様にあってテストが無かった項目にテストを足した：制御方式の切替の連続性（TEST-11 項目 8），運転中にランナ・排気系を ON にしたときの初期化（TEST-25 項目 7，TEST-27 項目 8），設定ページ「吸気ランナ」（TEST-25 項目 6），段階型レンジの切替の間隔と強調，グラフのタップ（TEST-17 項目 2(g)，8，9），<code>[既定値]<\/code>・ページの一覧・導出値・基準の更新（TEST-18 項目 13〜15），選択中のモデルの式の強調（TEST-16 項目 14）．<\/li>\n<li>判定を仕様にそろえた：サイクルの時間から求めた回転数（<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-9}\">10^{-9}<\/span><\/span>．TEST-26 項目 2），<span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>-<span class=\"im\"><span class=\"tx raw\" data-tex=\"V\">V<\/span><\/span> の台形則との一致（<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.1\\%\">0.1\\%<\/span><\/span>．TEST-14 項目 1）．<\/li>\n<li>7 通りの検証で，TEST-20 項目 5（最長のフレーム間隔 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\le 250\\ \\text{ms}\">\\le 250\\ \\text{ms}<\/span><\/span>）が <span class=\"im\"><span class=\"tx raw\" data-tex=\"259\\ \\text{ms}\">259\\ \\text{ms}<\/span><\/span> で FAIL した．原因は TEST-25 項目 1 の積分（2 万ステップ）が 1 フレームの中で走っていたことで，新しい右辺が重くなって表に出た．テストの中で区切るようにした（判定値は変えていない）．解説タブを初めて開くときの組版（約 <span class=\"im\"><span class=\"tx raw\" data-tex=\"180\\ \\text{ms}\">180\\ \\text{ms}<\/span><\/span>）も，章を数フレームに分けて表示するようにした．<\/li>\n<li>TEST-16 項目 17（文書の組み立て中のフレームの間隔）は，当初の <span class=\"im\"><span class=\"tx raw\" data-tex=\"100\\ \\text{ms}\">100\\ \\text{ms}<\/span><\/span> を <span class=\"im\"><span class=\"tx raw\" data-tex=\"250\\ \\text{ms}\">250\\ \\text{ms}<\/span><\/span> に緩めた．理由は仕様書のテスト項目に書いた．<\/li>\n<\/ul>\n<h4 id=\"reqh56\">検証の結果<\/h4>\n<ol type=\"1\">\n<li>7 通りの開発時検証（仕様書 9 節）と実機の確認の結果は，<code>docs/verification.md<\/code> に記録する．成果物に埋め込むこの文書を検証の後で書き換えると，検証した成果物と公開する成果物が一致しなくなるので，別の文書にした．<\/li>\n<li><strong>テストが先に FAIL することの確認<\/strong>：第24版の実装は，レビューでの実測（第一法則の残差が発熱の <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.9\\%\">0.9\\%<\/span><\/span>，RK4 のアイドルの IMEP の誤差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1.6\\%\">1.6\\%<\/span><\/span>，アイドルの吸気と排気の通過質量の差 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1.2\\%\">1.2\\%<\/span><\/span>）が，新しい判定（<span class=\"im\"><span class=\"tx raw\" data-tex=\"10^{-4}\">10^{-4}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5\\%\">0.5\\%<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.2\\%\">0.2\\%<\/span><\/span>）を満たさない．<code>[既定値]<\/code> の不具合は，TEST-18 項目 13 が FAIL することを確かめてから直した．<\/li>\n<li><strong>文書の変換<\/strong>：3 文書の数式は，変換できないものが無く，アプリの中で数えた数がビルド時に数えた数と一致する（TEST-16 項目 15）．<\/li>\n<\/ol>\n","<h3 id=\"reqh57\">7.4 第26版（策定中：仕様のみ，未実装）<\/h3>\n<h4 id=\"reqh58\">経緯<\/h4>\n<ol type=\"1\">\n<li>利用者が「直噴を想定した場合，今のモデルではガソリンの気化潜熱分はどう考えているのか」と尋ねた．第25版は，吸気を気化済みの予混合気とし（SPEC-05），潜熱の項を持たないことを答えた．利用者は「入れる．リッチに噴いたときの出力増を表現したい．噴射は 1 回でよい．モデルを考えて」と指示した．<\/li>\n<li>第25版のモデルを実行して，全開の軸トルクが <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1.0\">\\phi = 1.0<\/span><\/span> で最大になり，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi\">\\phi<\/span><\/span> を <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.1\">0.1<\/span><\/span> 増やすごとに約 <span class=\"im\"><span class=\"tx raw\" data-tex=\"4\\%\">4\\%<\/span><\/span> 下がることを確かめた（<span class=\"im\"><span class=\"tx raw\" data-tex=\"4000\\ \\text{rpm}\">4000\\ \\text{rpm}<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1.0\">\\phi = 1.0<\/span><\/span>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"35.04\\ \\text{N·m}\">35.04\\ \\text{N·m}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"1.1\">1.1<\/span><\/span>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"33.65\\ \\text{N·m}\">33.65\\ \\text{N·m}<\/span><\/span>）．理由は，酸素が尽きた後の余分な燃料が空気あたりの発熱を減らすことと，リッチが出力を増やす機構（解離，組成による比熱比の変化，吸気の冷却）がモデルに無いことである．<\/li>\n<li>利用者の指示で試算した（<code>tools/richburn<\/code>．燃料空気サイクル）．解離を入れないモデルでは最大は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1\">\\phi = 1<\/span><\/span> のままで，10 種の化学平衡と直噴を入れると <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1.15\">\\phi = 1.15<\/span><\/span> で最大（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1\">\\phi = 1<\/span><\/span> 比 <span class=\"im\"><span class=\"tx raw\" data-tex=\"+1.7\\%\">+1.7\\%<\/span><\/span>）になった．<\/li>\n<li>利用者は「当量比 1.5 とかで噴けば気化潜熱で筒内温度が下がるから良いと思っていたが，1.1 くらいが極大なのか．副次的に，本来はノックが避けられて MBT を取りやすいとかあるのだろう」と述べた．その理解が合っていること，ノックを扱わないこのモデルではその利得が現れないことを答えた．<\/li>\n<li>利用者が「提案通りに進めて．考察とか仕様定義に使った有益な情報は別途適切なところに残しておいて」と指示した．REQ-29，REQ-30 と SPEC-29，SPEC-30，TEST-29，TEST-30 を書き，考察・試算・選ばなかった案を <code>docs/report_richburn.md<\/code> に残した．<\/li>\n<\/ol>\n<h4 id=\"reqh59\">利用者に確認して決めたこと<\/h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>事項<\/th>\n<th>利用者の選択<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>気化潜熱と直噴<\/td>\n<td>入れる．噴射は 1 サイクルに 1 回<\/td>\n<\/tr>\n<tr>\n<td>リッチでの出力増<\/td>\n<td>表現する．化学種の熱物性と化学平衡（10 種）で表す案に同意<\/td>\n<\/tr>\n<tr>\n<td>ノッキング<\/td>\n<td>今のところ入れない<\/td>\n<\/tr>\n<tr>\n<td>噴射時期<\/td>\n<td>固定の設定のまま（既定は吸気上死点後 <span class=\"im\"><span class=\"tx raw\" data-tex=\"80^\\circ\">80^\\circ<\/span><\/span>）．回転数や負荷による自動の調整はしない<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4 id=\"reqh60\">自分で決めたこと（理由は仕様書の SPEC-29，SPEC-30 と <code>docs/report_richburn.md<\/code> 7 節）<\/h4>\n<p>第25版の熱物性を設定で残す．既定は「化学種」と「直噴」にする．平衡は起動時ではなく，当量比の節点ごとに初めて必要になったときに表にする．既燃ガスの当量比は筒内では状態として連続に追う．噴射率はクランク角で一定にする．噴射量は前のサイクルで閉じ込めた空気量から決める．凍結温度は <span class=\"im\"><span class=\"tx raw\" data-tex=\"1700\\ \\text{K}\">1700\\ \\text{K}<\/span><\/span>．壁への付着，液滴の加熱，成層は扱わない．量論空燃比は，燃料と空気の組成から決まる <span class=\"im\"><span class=\"tx raw\" data-tex=\"14.503\">14.503<\/span><\/span> とする（第25版の <span class=\"im\"><span class=\"tx raw\" data-tex=\"14.7\">14.7<\/span><\/span> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma\">\\gamma<\/span><\/span> のモデルでだけ使う）．<\/p>\n<h4 id=\"reqh61\">実装の前に分かっていること<\/h4>\n<ol type=\"1\">\n<li>既定の機関の数値が動く．試算（理想サイクル）では，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi = 1\">\\phi = 1<\/span><\/span> の IMEP が第25版相当より約 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10\\%\">10\\%<\/span><\/span> 高い（混合気の気体定数を実際の値にしたことによる空気量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"+4.5\\%\">+4.5\\%<\/span><\/span> と，熱効率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"+4.3\\%\">+4.3\\%<\/span><\/span>）．数値で判定しているテスト項目の基準は，実装の後に実測して引き直し，変化を「モデルの変更による結果の変化」として記録する．<\/li>\n<li>REQ-29 の受入基準 8（リッチでの出力増）をシミュレータが満たすかは，実装して測るまで分からない（単一ゾーンでは解離を小さく見積もる）．満たさない場合は，係数を合わせず，結果と理由を報告する．<\/li>\n<li>状態は 16 から 21 成分に増える（仕様書 SPEC-29 B，SPEC-30）．1.1 節と 3 節の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\mathbb{R}^{16}\">\\mathbb{R}^{16}<\/span><\/span> は，実装のときに改める．<\/li>\n<\/ol>\n"],"toc":[[2,"reqh2","1. 目的と範囲"],[3,"reqh3","1.1 目的"],[3,"reqh4","1.2 対象"],[3,"reqh5","1.3 対象外"],[3,"reqh6","1.4 利用者と利用環境"],[3,"reqh7","1.5 文書の体系"],[2,"reqh8","2. 前提と制約"],[2,"reqh9","3. 状態と記号"],[2,"reqh10","4. 要件"],[3,"reqh11","REQ-01：スライダ・クランク運動学"],[3,"reqh12","REQ-02：作動流体の熱物性（未燃・既燃の比熱）"],[3,"reqh13","REQ-03：カムプロファイルと弁の有効開口面積"],[3,"reqh14","REQ-04：オリフィスの圧縮性流れ（順流・逆流・チョーク）"],[3,"reqh15","REQ-05：スロットルと吸気マニホールド"],[3,"reqh16","REQ-06：筒内の組成（未燃ガスと既燃ガス）"],[3,"reqh17","REQ-07：燃焼（乱流火炎伝播に連動する単一 Wiebe モデル）"],[3,"reqh18","REQ-08：壁面熱伝達と壁温"],[3,"reqh19","REQ-09：筒内圧の式（開いた系の熱力学第一法則）"],[3,"reqh20","REQ-10：回転運動，摩擦，スターター"],[3,"reqh21","REQ-11：水ブレーキ式動力計と運転モード"],[3,"reqh22","REQ-12：ECU（スロットル開度の PI 制御と点火時期の自動最適化）"],[3,"reqh23","REQ-13：数値積分"],[3,"reqh24","REQ-14：性能の指標と基準サイクル"],[3,"reqh25","REQ-15：画面の構成と操作"],[3,"reqh26","REQ-16：解説タブ"],[3,"reqh27","REQ-17：グラフの軸・目盛・自動レンジ"],[3,"reqh28","REQ-18：設定画面"],[3,"reqh29","REQ-19：機関断面図"],[3,"reqh30","REQ-20：検証の基盤"],[3,"reqh31","REQ-21：エンジン音"],[3,"reqh32","REQ-22：制御状態の表示"],[3,"reqh33","REQ-23：目標回転数スライダ"],[3,"reqh34","REQ-24：内部 EGR と点火時期の妥当性"],[3,"reqh35","REQ-25：吸気ランナの慣性（慣性過給）"],[3,"reqh36","REQ-26：性能曲線タブ（回転数に対する特性の計測）"],[3,"reqh37","REQ-27：排気系（排気管の脈動と背圧）"],[3,"reqh38","REQ-28：アイドルの妥当性"],[3,"reqh39","REQ-29：化学種の熱物性と化学平衡（第26版．仕様のみ，未実装）"],[3,"reqh40","REQ-30：燃料の噴射と気化（第26版．仕様のみ，未実装）"],[2,"reqh41","5. 受入"],[3,"reqh42","5.1 納品条件"],[3,"reqh43","5.2 実機目視チェックリスト [M]（Galaxy S26+／Chrome）"],[2,"reqh44","6. 要件・仕様・テストの対応"],[2,"reqh45","7. 改訂の記録"],[3,"reqh46","7.1 版の一覧"],[3,"reqh47","7.2 未決事項と既知の限界"],[3,"reqh48","7.3 第25版"],[3,"reqh57","7.4 第26版（策定中：仕様のみ，未実装）"]],"nmath":583,"nchar":96300},"spec":{"chunks":["<h1 id=\"spech1\">単気筒4ストロークSI機関シミュレータ 仕様書（第25版）<\/h1>\n","<h2 id=\"spech2\">0. この文書について<\/h2>\n<ul>\n<li><strong>位置づけ<\/strong>：要件定義書（<code>docs/requirements.md<\/code>）の要件 REQ-01〜28 を満たすために，<strong>何をどの式で計算し，どう表示し，どう確かめるか<\/strong>を定める．要件定義書が「何ができること」と受入基準を定め，この仕様書がその実現の内容を定める．<\/li>\n<li><strong>番号<\/strong>：SPEC-nn は REQ-nn を実現する仕様，TEST-nn はその検証項目で，同じ番号どうしが対応する．<\/li>\n<li><strong>記号と用語<\/strong>：用語の定義集（<code>docs/glossary.md<\/code>）に，単位と定義式とともにまとめてある．<\/li>\n<li><strong>構成<\/strong>：1 節 構成，2 節 座標系と状態変数，3 節 機関モデル（SPEC-01〜12，25，27），4 節 数値積分と性能の指標（SPEC-13，14），5 節 画面（SPEC-15〜19，22，23，26），6 節 エンジン音（SPEC-21），7 節 検証（SPEC-20，24，28），8 節 テスト項目（TEST-01〜28），9 節 開発時検証．<\/li>\n<li><strong>規則<\/strong>：\n<ol type=\"1\">\n<li>現行の仕様だけを書く．変更の経緯は要件定義書の改訂の記録に書く．<\/li>\n<li>式は導出を省かず，記号はすべて定義する．定数は値と出典（または決め方）を書く．<\/li>\n<li>判定値のうち，実測に余裕を持たせて決めたものは「（実測 …）」と添える．文献で確かめていない値は「推定」「未確認」と書く．<\/li>\n<li>句読点は「，」「．」．計算の内部は SI．圧力は Pa 系（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{Pa}\">\\text{Pa}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{kPa}\">\\text{kPa}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{MPa}\">\\text{MPa}<\/span><\/span>）で表し，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{bar}\">\\text{bar}<\/span><\/span> は使わない．角度は内部が <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{rad}\">\\text{rad}<\/span><\/span>，表示と本文の数値は <span class=\"im\"><span class=\"tx raw\" data-tex=\"^\\circ\">^\\circ<\/span><\/span>（クランク角は <span class=\"im\"><span class=\"tx raw\" data-tex=\"^\\circ\\text{CA}\">^\\circ\\text{CA}<\/span><\/span>）．定着した日本語訳の無い術語は英語のまま書く．<\/li>\n<\/ol><\/li>\n<\/ul>\n<hr />\n","<h2 id=\"spech3\">1. 構成<\/h2>\n<ol type=\"1\">\n<li>物理モデル・ECU・動力計・ソルバは，DOM にもグローバル変数にも依存しない <code>EngineCore<\/code>（生成できるオブジェクト）にまとめ，運転用とテスト用に別々のインスタンスを作れる（SPEC-20）．<\/li>\n<li>設定項目は 1 つの<strong>項目定義表<\/strong>（キー，表示名，単位，単位係数，下限，上限，刻み，既定値，分類，選択肢）で定義し，設定画面・解説タブ §0・テストがこの表を参照する（SPEC-18）．<\/li>\n<li>グラフは「レイアウト計算」と「描画」を分け，機関断面図は「場面記述」と「描画」を分ける（SPEC-17，SPEC-19 のテストのため）．<\/li>\n<li>エンジン音の合成器は DOM に依存しない <code>Synth<\/code> とし，AudioWorklet・代替経路・テストが同じクラスを使う（SPEC-21）．<\/li>\n<li>成果物は，単一の HTML ファイル（JavaScript，Canvas 2D，CSS）である．数式の組版だけは，ネットワークがあれば実行時に MathJax を読み込む（C-1，SPEC-16 3）．ソースは <code>src/<\/code> にあり，<code>src/build.py<\/code> が結合する．要件定義書・仕様書・用語の定義集は，ビルド時に HTML に変換し，数式を TeX のまま成果物に埋め込む（SPEC-16）．<\/li>\n<\/ol>\n<hr />\n","<h2 id=\"spech4\">2. 座標系・状態変数・補助積分<\/h2>\n","<h3 id=\"spech5\">2.1 独立変数とクランク角<\/h3>\n<ul>\n<li><span class=\"im\"><span class=\"tx raw\" data-tex=\"t\">t<\/span><\/span>：時間 <span class=\"im\"><span class=\"tx raw\" data-tex=\"[\\text{s}]\">[\\text{s}]<\/span><\/span>．<\/li>\n<li><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta \\in [0, 4\\pi)\">\\theta \\in [0, 4\\pi)<\/span><\/span>：1サイクル（<span class=\"im\"><span class=\"tx raw\" data-tex=\"720^\\circ\\text{CA}\">720^\\circ\\text{CA}<\/span><\/span>）内のクランク角 <span class=\"im\"><span class=\"tx raw\" data-tex=\"[\\text{rad}]\">[\\text{rad}]<\/span><\/span>．サイクルの終端（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta = 4\\pi\">\\theta = 4\\pi<\/span><\/span>）で <span class=\"im\"><span class=\"tx raw\" data-tex=\"4\\pi\">4\\pi<\/span><\/span> を引く（SPEC-13）．\n<ul>\n<li><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta = 0\">\\theta = 0<\/span><\/span>：吸気上死点（ガス交換の上死点）<\/li>\n<li><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta = \\pi\">\\theta = \\pi<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"180^\\circ\">180^\\circ<\/span><\/span>）：吸気下死点<\/li>\n<li><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta = 2\\pi\">\\theta = 2\\pi<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"360^\\circ\">360^\\circ<\/span><\/span>）：圧縮上死点<\/li>\n<li><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta = 3\\pi\">\\theta = 3\\pi<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"540^\\circ\">540^\\circ<\/span><\/span>）：膨張下死点<\/li>\n<\/ul><\/li>\n<li>角度の剰余を <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{md}(a) = a - 4\\pi\\lfloor a/4\\pi \\rfloor \\in [0, 4\\pi)\">\\text{md}(a) = a - 4\\pi\\lfloor a/4\\pi \\rfloor \\in [0, 4\\pi)<\/span><\/span> と書く．<\/li>\n<\/ul>\n","<h3 id=\"spech6\">2.2 状態ベクトル <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\mathbf{y}(t) \\in \\mathbb{R}^{16}\">\\mathbf{y}(t) \\in \\mathbb{R}^{16}<\/span><\/span><\/h3>\n<p><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{d\\mathbf{y}}{dt} = \\mathbf{f}(\\mathbf{y}; \\mathbf{u})\">\\frac{d\\mathbf{y}}{dt} = \\mathbf{f}(\\mathbf{y}; \\mathbf{u})<\/span><\/span> を時間積分する．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\mathbf{u}\">\\mathbf{u}<\/span><\/span> は ECU と動力計が決める入力（スロットル開度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha\">\\alpha<\/span><\/span>，実効充水率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{eff}}\">f_{\\text{eff}}<\/span><\/span>，点火時期 <span class=\"im\"><span class=\"tx raw\" data-tex=\"s\">s<\/span><\/span> など）で，積分の1ステップの間は一定とする（SPEC-13）．<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: right;\">#<\/th>\n<th>記号<\/th>\n<th>意味<\/th>\n<th>単位<\/th>\n<th>式<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: right;\">1<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta\">\\theta<\/span><\/span><\/td>\n<td>クランク角<\/td>\n<td>rad<\/td>\n<td>SPEC-10<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">2<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\omega\">\\omega<\/span><\/span><\/td>\n<td>クランク軸の角速度（回転数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"N = \\frac{30}{\\pi}\\omega\">N = \\frac{30}{\\pi}\\omega<\/span><\/span> [rpm]）<\/td>\n<td>rad/s<\/td>\n<td>SPEC-10<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">3<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span><\/td>\n<td>筒内圧<\/td>\n<td>Pa<\/td>\n<td>SPEC-09<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">4<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"m\">m<\/span><\/span><\/td>\n<td>筒内ガスの全質量<\/td>\n<td>kg<\/td>\n<td>SPEC-06<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">5<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"m_u\">m_u<\/span><\/span><\/td>\n<td>筒内の未燃ガス（新気）の質量<\/td>\n<td>kg<\/td>\n<td>SPEC-06<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">6<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_w\">T_w<\/span><\/span><\/td>\n<td>シリンダ壁の平均温度<\/td>\n<td>K<\/td>\n<td>SPEC-08<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">7<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{in}}\">p_{\\text{in}}<\/span><\/span><\/td>\n<td>吸気マニホールド圧<\/td>\n<td>Pa<\/td>\n<td>SPEC-05<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">8<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{b,\\text{in}}\">m_{b,\\text{in}}<\/span><\/span><\/td>\n<td>吸気マニホールド内の既燃ガスの質量<\/td>\n<td>kg<\/td>\n<td>SPEC-05<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">9<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_r\">\\dot m_r<\/span><\/span><\/td>\n<td>吸気ランナの質量流量（マニホールド → ポートが正）<\/td>\n<td>kg/s<\/td>\n<td>SPEC-25<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">10<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p_p\">p_p<\/span><\/span><\/td>\n<td>吸気ポート圧<\/td>\n<td>Pa<\/td>\n<td>SPEC-25<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">11<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{b,p}\">m_{b,p}<\/span><\/span><\/td>\n<td>吸気ポート内の既燃ガスの質量<\/td>\n<td>kg<\/td>\n<td>SPEC-25<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">12<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_e\">\\dot m_e<\/span><\/span><\/td>\n<td>排気管の質量流量（排気ポート → 消音器が正）<\/td>\n<td>kg/s<\/td>\n<td>SPEC-27<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">13<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{pe}\">p_{pe}<\/span><\/span><\/td>\n<td>排気ポート圧<\/td>\n<td>Pa<\/td>\n<td>SPEC-27<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">14<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p_m\">p_m<\/span><\/span><\/td>\n<td>消音器の圧力<\/td>\n<td>Pa<\/td>\n<td>SPEC-27<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">15<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"E_{\\text{in}}\">E_{\\text{in}}<\/span><\/span><\/td>\n<td>吸気マニホールドの余剰エンタルピー<\/td>\n<td>J<\/td>\n<td>SPEC-05<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">16<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"E_p\">E_p<\/span><\/span><\/td>\n<td>吸気ポートの余剰エンタルピー<\/td>\n<td>J<\/td>\n<td>SPEC-25<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>従属変数：筒内ガスの平均温度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"T = \\frac{pV(\\theta)}{mR}\">T = \\frac{pV(\\theta)}{mR}<\/span><\/span>，既燃ガスの質量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_b = m - m_u\">m_b = m - m_u<\/span><\/span>，未燃分率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_u = \\text{clamp}\\left(\\frac{m_u}{m}, 0, 1\\right)\">Y_u = \\text{clamp}\\left(\\frac{m_u}{m}, 0, 1\\right)<\/span><\/span>，残留ガス率（既燃分率）<span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r = 1 - Y_u\">x_r = 1 - Y_u<\/span><\/span>．<\/li>\n<li>気体定数は未燃・既燃とも <span class=\"im\"><span class=\"tx raw\" data-tex=\"R = 287.0\\ \\text{J/(kg·K)}\">R = 287.0\\ \\text{J/(kg·K)}<\/span><\/span> とする（SPEC-02）．<\/li>\n<li>ランナ OFF（SPEC-25）では 9〜11 と 16，排気系 OFF（SPEC-27）では 12〜14 の時間微分を <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> とする．<\/li>\n<li><strong>第26版（未実装）で加える状態<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_f\">m_f<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{bf}\">m_{bf}<\/span><\/span>（SPEC-29 B），<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_l\">m_l<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{f,\\text{in}}\">m_{f,\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{f,p}\">m_{f,p}<\/span><\/span>（SPEC-30）．実装のときにこの表に 17〜21 として加え，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\mathbf{y} \\in \\mathbb{R}^{21}\">\\mathbf{y} \\in \\mathbb{R}^{21}<\/span><\/span> にする．補助積分に <span class=\"im\"><span class=\"tx raw\" data-tex=\"H_e\">H_e<\/span><\/span> を加える．<\/li>\n<li><strong>初期値（コールドリセット）<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta = \\pi\">\\theta = \\pi<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\omega = 0\">\\omega = 0<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p = p_{\\text{in}} = p_p = p_{pe} = p_m = p_{\\text{atm}}\">p = p_{\\text{in}} = p_p = p_{pe} = p_m = p_{\\text{atm}}<\/span><\/span>，筒内ガスは温度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"320\\ \\text{K}\">320\\ \\text{K}<\/span><\/span> の未燃ガス（<span class=\"im\"><span class=\"tx raw\" data-tex=\"m = m_u = \\frac{p_{\\text{atm}}V(\\pi)}{R \\cdot 320}\">m = m_u = \\frac{p_{\\text{atm}}V(\\pi)}{R \\cdot 320}<\/span><\/span>），<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_w = 298.15\\ \\text{K}\">T_w = 298.15\\ \\text{K}<\/span><\/span>，そのほかは <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>．IVC の基準状態（SPEC-08）の初期値は <span class=\"im\"><span class=\"tx raw\" data-tex=\"(p_{\\text{atm}}, V(\\pi), 320\\ \\text{K})\">(p_{\\text{atm}}, V(\\pi), 320\\ \\text{K})<\/span><\/span>．<\/li>\n<\/ul>\n","<h3 id=\"spech7\">2.3 補助積分 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\mathbf{z}(t) \\in \\mathbb{R}^{22}\">\\mathbf{z}(t) \\in \\mathbb{R}^{22}<\/span><\/span><\/h3>\n<p>サイクルの集計と保存則の検査に使う量を，状態と同じ Runge–Kutta の重みで同時に積分する（SPEC-13）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\mathbf{z}\">\\mathbf{z}<\/span><\/span> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\mathbf{f}\">\\mathbf{f}<\/span><\/span> に現れず，誤差判定にも含めない．<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>記号<\/th>\n<th>被積分関数<\/th>\n<th>用途<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"B_o\">B_o<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"B_i\">B_i<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{in}}^-(1 - Y_u)\">\\dot m_{\\text{in}}^-(1 - Y_u)<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{in}}^+ Y_{b,\\text{src}}\">\\dot m_{\\text{in}}^+ Y_{b,\\text{src}}<\/span><\/span><\/td>\n<td>吸気弁を出入りする既燃ガス（SPEC-05）<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"W\">W<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"W_g\">W_g<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p\\frac{dV}{d\\theta}\\omega\">p\\frac{dV}{d\\theta}\\omega<\/span><\/span>，同（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pi \\le \\theta &lt; 3\\pi\">\\pi \\le \\theta &lt; 3\\pi<\/span><\/span> のみ）<\/td>\n<td>図示仕事（正味，圧縮膨張）<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"W_f\">W_f<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"W_a\">W_a<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"W_d\">W_d<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_f\\omega\">T_f\\omega<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{aux}}\\omega\">T_{\\text{aux}}\\omega<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{dyno}}\\omega\">T_{\\text{dyno}}\\omega<\/span><\/span><\/td>\n<td>摩擦・補機・動力計の仕事<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"M_{\\text{th}}\">M_{\\text{th}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M_r\">M_r<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M_{\\text{in}}\">M_{\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M_{\\text{ex}}\">M_{\\text{ex}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M_e\">M_e<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"M_t\">M_t<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{th}}\">\\dot m_{\\text{th}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_r\">\\dot m_r<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{in}}\">\\dot m_{\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{ex}}\">\\dot m_{\\text{ex}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_e\">\\dot m_e<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_t\">\\dot m_t<\/span><\/span><\/td>\n<td>各断面を通った質量<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"P_m\">P_m<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Upsilon\">\\Upsilon<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p_m\">p_m<\/span><\/span>（排気系 OFF では排気弁の下流圧），<span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_{b,\\text{in}}\">Y_{b,\\text{in}}<\/span><\/span><\/td>\n<td>サイクル平均の背圧と吸気管既燃率<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"Q_c\">Q_c<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"Q_w\">Q_w<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"H_i\">H_i<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"H_o\">H_o<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot Q_{\\text{comb}}\">\\dot Q_{\\text{comb}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot Q_{\\text{wall}}\">\\dot Q_{\\text{wall}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot H_{\\text{in}}^s\">\\dot H_{\\text{in}}^s<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot H_{\\text{out}}^s\">\\dot H_{\\text{out}}^s<\/span><\/span><\/td>\n<td>第一法則の収支（SPEC-09）<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"X_o\">X_o<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"X_i\">X_i<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"X_t\">X_t<\/span><\/span><\/td>\n<td>吸気弁の逆流が運ぶ余剰エンタルピー，順流で戻る分，スロットルの逆流で出る分<\/td>\n<td>余剰エンタルピーの収支（SPEC-05）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>ここで <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m^+ = \\max(0, \\dot m)\">\\dot m^+ = \\max(0, \\dot m)<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m^- = \\max(0, -\\dot m)\">\\dot m^- = \\max(0, -\\dot m)<\/span><\/span>．ランナ OFF では <span class=\"im\"><span class=\"tx raw\" data-tex=\"M_r\">M_r<\/span><\/span> に <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{in}}\">\\dot m_{\\text{in}}<\/span><\/span>，排気系 OFF では <span class=\"im\"><span class=\"tx raw\" data-tex=\"M_e\">M_e<\/span><\/span> に <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{ex}}\">\\dot m_{\\text{ex}}<\/span><\/span> を積分する．<\/p>\n<hr />\n","<h2 id=\"spech8\">3. 機関モデル<\/h2>\n","<h3 id=\"spech9\">SPEC-01：スライダ・クランク運動学（REQ-01）<\/h3>\n<h4 id=\"spech10\">定義と式<\/h4>\n<p>ピストンピンのオフセットは <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> とする．連桿の傾き角を <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\beta\">\\beta<\/span><\/span> とすると <span class=\"im\"><span class=\"tx raw\" data-tex=\"r\\sin\\theta = l\\sin\\beta\">r\\sin\\theta = l\\sin\\beta<\/span><\/span> より <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\cos\\beta = \\sqrt{1 - \\lambda^2\\sin^2\\theta}\">\\cos\\beta = \\sqrt{1 - \\lambda^2\\sin^2\\theta}<\/span><\/span>．上死点でのピストン位置 <span class=\"im\"><span class=\"tx raw\" data-tex=\"r + l\">r + l<\/span><\/span> からの変位は <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"x(\\theta) = (r + l) - (r\\cos\\theta + l\\cos\\beta) = r\\left[(1 - \\cos\\theta) + \\frac{1}{\\lambda}\\left(1 - \\sqrt{1 - \\lambda^2\\sin^2\\theta}\\right)\\right]\">x(\\theta) = (r + l) - (r\\cos\\theta + l\\cos\\beta) = r\\left[(1 - \\cos\\theta) + \\frac{1}{\\lambda}\\left(1 - \\sqrt{1 - \\lambda^2\\sin^2\\theta}\\right)\\right]<\/span><\/span> 最大容積と最小容積の比が <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon\">\\varepsilon<\/span><\/span> なので，ピストン頂面の面積を <span class=\"im\"><span class=\"tx raw\" data-tex=\"A_p = \\frac{\\pi B^2}{4}\">A_p = \\frac{\\pi B^2}{4}<\/span><\/span> として <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"V_d = A_p S, \\qquad V_c = \\frac{V_d}{\\varepsilon - 1}, \\qquad V(\\theta) = V_c + A_p\\,x(\\theta)\">V_d = A_p S, \\qquad V_c = \\frac{V_d}{\\varepsilon - 1}, \\qquad V(\\theta) = V_c + A_p\\,x(\\theta)<\/span><\/span> <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{d}{d\\theta}\\sqrt{1 - \\lambda^2\\sin^2\\theta} = \\frac{-\\lambda^2\\sin\\theta\\cos\\theta}{\\sqrt{1 - \\lambda^2\\sin^2\\theta}}\">\\frac{d}{d\\theta}\\sqrt{1 - \\lambda^2\\sin^2\\theta} = \\frac{-\\lambda^2\\sin\\theta\\cos\\theta}{\\sqrt{1 - \\lambda^2\\sin^2\\theta}}<\/span><\/span> を使うと <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\frac{dV}{d\\theta} = A_p\\,r\\sin\\theta\\left(1 + \\frac{\\lambda\\cos\\theta}{\\sqrt{1 - \\lambda^2\\sin^2\\theta}}\\right)\">\\frac{dV}{d\\theta} = A_p\\,r\\sin\\theta\\left(1 + \\frac{\\lambda\\cos\\theta}{\\sqrt{1 - \\lambda^2\\sin^2\\theta}}\\right)<\/span><\/span> 伝熱面積は，ピストン頂面 <span class=\"im\"><span class=\"tx raw\" data-tex=\"A_p\">A_p<\/span><\/span>，シリンダヘッド <span class=\"im\"><span class=\"tx raw\" data-tex=\"A_p\">A_p<\/span><\/span>，ライナ <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pi B\\,(x + h_c)\">\\pi B\\,(x + h_c)<\/span><\/span> の和とする（<span class=\"im\"><span class=\"tx raw\" data-tex=\"h_c = V_c/A_p\">h_c = V_c/A_p<\/span><\/span>：等価な隙間の高さ）： <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"A_w(\\theta) = \\frac{\\pi B^2}{2} + \\pi B\\left(x(\\theta) + h_c\\right)\">A_w(\\theta) = \\frac{\\pi B^2}{2} + \\pi B\\left(x(\\theta) + h_c\\right)<\/span><\/span><\/p>\n<ul>\n<li><strong>既定値と範囲<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"B = S = 86\\ \\text{mm}\">B = S = 86\\ \\text{mm}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"l = 145\\ \\text{mm}\">l = 145\\ \\text{mm}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon = 10\">\\varepsilon = 10<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"B, S \\in [40, 150]\\ \\text{mm}\">B, S \\in [40, 150]\\ \\text{mm}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"l \\in [60, 300]\\ \\text{mm}\">l \\in [60, 300]\\ \\text{mm}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon \\in [1.1, 100]\">\\varepsilon \\in [1.1, 100]<\/span><\/span>，かつ <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lambda \\le 0.5\">\\lambda \\le 0.5<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon &gt; 1\">\\varepsilon &gt; 1<\/span><\/span> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"V_c &gt; 0\">V_c &gt; 0<\/span><\/span> の必要十分条件（下限 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1.1\">1.1<\/span><\/span> は数値上の余裕），<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lambda &lt; 1\">\\lambda &lt; 1<\/span><\/span> は根号が実数になる条件である．<\/li>\n<li><strong>出典<\/strong>：<a target=\"_blank\" rel=\"noopener\" href=\"https://www.accessengineeringlibrary.com/content/book/9781260116106\">J. B. Heywood, <em>Internal Combustion Engine Fundamentals<\/em>, McGraw-Hill (1988), Ch. 2<\/a><\/li>\n<\/ul>\n<hr />\n","<h3 id=\"spech11\">SPEC-02：作動流体の熱物性（未燃・既燃の比熱）（REQ-02）<\/h3>\n<h4 id=\"spech12\">定義と式<\/h4>\n<ol type=\"1\">\n<li><strong>比熱比の当てはめ<\/strong>（量論比．Klein と Eriksson が化学平衡計算から求めた線形当てはめ）： <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\gamma_u(T) = 1.3488 - 13.0 \\times 10^{-5}\\left(\\min(T, T_{c,u}) - 300\\right), \\qquad T_{c,u} = 1000\\ \\text{K}\">\\gamma_u(T) = 1.3488 - 13.0 \\times 10^{-5}\\left(\\min(T, T_{c,u}) - 300\\right), \\qquad T_{c,u} = 1000\\ \\text{K}<\/span><\/span> <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\gamma_b(T) = 1.3678 - 9.4 \\times 10^{-5}\\left(\\min(T, T_{c,b}) - 300\\right), \\qquad T_{c,b} = 2700\\ \\text{K}\">\\gamma_b(T) = 1.3678 - 9.4 \\times 10^{-5}\\left(\\min(T, T_{c,b}) - 300\\right), \\qquad T_{c,b} = 2700\\ \\text{K}<\/span><\/span> 未燃の当てはめの有効範囲は <span class=\"im\"><span class=\"tx raw\" data-tex=\"300\">300<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"1000\\ \\text{K}\">1000\\ \\text{K}<\/span><\/span>，既燃は <span class=\"im\"><span class=\"tx raw\" data-tex=\"500\">500<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"2700\\ \\text{K}\">2700\\ \\text{K}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"7.5 \\times 10^5\\ \\text{Pa}\">7.5 \\times 10^5\\ \\text{Pa}<\/span><\/span>）である．有効範囲の上限 <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{c,k}\">T_{c,k}<\/span><\/span> より上では <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_k\">\\gamma_k<\/span><\/span> を一定とし，直線を範囲外へ延ばさない．既燃の <span class=\"im\"><span class=\"tx raw\" data-tex=\"500\\ \\text{K}\">500\\ \\text{K}<\/span><\/span> 未満は直線のまま使う．<\/li>\n<li><strong>比熱<\/strong>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"k = u, b\">k = u, b<\/span><\/span>）：<span class=\"im\"><span class=\"tx raw\" data-tex=\"c_{v,k}(T) = \\frac{R}{\\gamma_k(T) - 1}\">c_{v,k}(T) = \\frac{R}{\\gamma_k(T) - 1}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"c_{p,k} = c_{v,k} + R\">c_{p,k} = c_{v,k} + R<\/span><\/span>．気体定数は未燃・既燃とも <span class=\"im\"><span class=\"tx raw\" data-tex=\"R = 287.0\\ \\text{J/(kg·K)}\">R = 287.0\\ \\text{J/(kg·K)}<\/span><\/span> とする．<strong>理由<\/strong>：圧力と容積で見た内部エネルギー <span class=\"im\"><span class=\"tx raw\" data-tex=\"U = m c_v T = \\frac{pV}{\\gamma - 1}\">U = m c_v T = \\frac{pV}{\\gamma - 1}<\/span><\/span> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"R\">R<\/span><\/span> によらず <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma\">\\gamma<\/span><\/span> だけで決まるので，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma\">\\gamma<\/span><\/span> を文献値に合わせれば，圧縮・膨張の仕事と圧力の応答が文献の物性と一致する．質量と温度の絶対値は，実際の気体定数（未燃 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\approx 275\">\\approx 275<\/span><\/span>，既燃 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\approx 288\\ \\text{J/(kg·K)}\">\\approx 288\\ \\text{J/(kg·K)}<\/span><\/span>）との差の分だけずれる．<\/li>\n<li><strong>顕熱の内部エネルギーとエンタルピー<\/strong>：基準温度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_0 = 298.15\\ \\text{K}\">T_0 = 298.15\\ \\text{K}<\/span><\/span> からの積分で定義する． <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"e_k(T) = \\int_{T_0}^{T} c_{v,k}(T&#x27;)\\,dT&#x27;, \\qquad h_k(T) = e_k(T) + RT\">e_k(T) = \\int_{T_0}^{T} c_{v,k}(T&#x27;)\\,dT&#x27;, \\qquad h_k(T) = e_k(T) + RT<\/span><\/span> <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_k - 1 = g_k - b_k(T - 300)\">\\gamma_k - 1 = g_k - b_k(T - 300)<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"g_u = 0.3488\">g_u = 0.3488<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"b_u = 13.0 \\times 10^{-5}\">b_u = 13.0 \\times 10^{-5}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"g_b = 0.3678\">g_b = 0.3678<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"b_b = 9.4 \\times 10^{-5}\">b_b = 9.4 \\times 10^{-5}<\/span><\/span>）と書くと，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T \\le T_{c,k}\">T \\le T_{c,k}<\/span><\/span> では <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"e_k(T) = \\int_{T_0}^{T}\\frac{R\\,dT&#x27;}{g_k - b_k(T&#x27; - 300)} = \\frac{R}{b_k}\\ln\\frac{g_k - b_k(T_0 - 300)}{g_k - b_k(T - 300)}\">e_k(T) = \\int_{T_0}^{T}\\frac{R\\,dT&#x27;}{g_k - b_k(T&#x27; - 300)} = \\frac{R}{b_k}\\ln\\frac{g_k - b_k(T_0 - 300)}{g_k - b_k(T - 300)}<\/span><\/span> <span class=\"im\"><span class=\"tx raw\" data-tex=\"T &gt; T_{c,k}\">T &gt; T_{c,k}<\/span><\/span> では <span class=\"im\"><span class=\"tx raw\" data-tex=\"e_k(T) = e_k(T_{c,k}) + c_{v,k}(T_{c,k})\\,(T - T_{c,k})\">e_k(T) = e_k(T_{c,k}) + c_{v,k}(T_{c,k})\\,(T - T_{c,k})<\/span><\/span>．<\/li>\n<li><strong>混合<\/strong>：未燃分率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"Y\">Y<\/span><\/span> の混合気について <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"c_v(T, Y) = Y c_{v,u}(T) + (1 - Y)c_{v,b}(T), \\quad \\gamma(T, Y) = 1 + \\frac{R}{c_v(T, Y)}, \\quad e(T, Y) = Y e_u(T) + (1 - Y)e_b(T), \\quad h(T, Y) = e(T, Y) + RT\">c_v(T, Y) = Y c_{v,u}(T) + (1 - Y)c_{v,b}(T), \\quad \\gamma(T, Y) = 1 + \\frac{R}{c_v(T, Y)}, \\quad e(T, Y) = Y e_u(T) + (1 - Y)e_b(T), \\quad h(T, Y) = e(T, Y) + RT<\/span><\/span> 筒内には <span class=\"im\"><span class=\"tx raw\" data-tex=\"Y = Y_u\">Y = Y_u<\/span><\/span> を使う．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma\">\\gamma<\/span><\/span> ではなく比熱を補間する（Klein と Eriksson のモデル D1 と同じ考え方）．<\/li>\n<li><strong>定比熱比モデル<\/strong>（設定「燃焼」の <code>[比熱 γ(T)／γ一定]<\/code>，既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma(T)\">\\gamma(T)<\/span><\/span>）：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_u = \\gamma_b = \\gamma_0 = 1.35\">\\gamma_u = \\gamma_b = \\gamma_0 = 1.35<\/span><\/span>．このとき <span class=\"im\"><span class=\"tx raw\" data-tex=\"c_v = \\frac{R}{\\gamma_0 - 1}\">c_v = \\frac{R}{\\gamma_0 - 1}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"e_k(T) = c_v\\,(T - T_0)\">e_k(T) = c_v\\,(T - T_0)<\/span><\/span>．<\/li>\n<li><strong>化学種のモデル<\/strong>（第26版，未実装）：設定に「化学種」を加えて既定にする．そのときの物性と筒内の式は SPEC-29 で定める．この SPEC は「γ(T)」「γ一定」を選んだときのものになる．<\/li>\n<\/ol>\n<h4 id=\"spech13\">仮定と限界<\/h4>\n<ul>\n<li><p>当量比・圧力による <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma\">\\gamma<\/span><\/span> の変化は扱わない（当てはめは量論比．既燃ガスは <span class=\"im\"><span class=\"tx raw\" data-tex=\"1500\\ \\text{K}\">1500\\ \\text{K}<\/span><\/span> 以上で圧力にも依存する）．<\/p><\/li>\n<li><p>既燃ガスの線形当てはめは，平衡組成の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma\">\\gamma<\/span><\/span> を <span class=\"im\"><span class=\"tx raw\" data-tex=\"1\\%\">1\\%<\/span><\/span> 弱の誤差で表す（同論文）．より正確な Krieger–Borman の多項式は，係数を原典で確認できていないため採用していない．<\/p><\/li>\n<li><p>単一ゾーンなので，未燃ガスの比熱も筒内の平均温度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"T\">T<\/span><\/span> で評価する（実際の未燃部は <span class=\"im\"><span class=\"tx raw\" data-tex=\"1000\\ \\text{K}\">1000\\ \\text{K}<\/span><\/span> 程度までにとどまる．<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{c,u}\">T_{c,u}<\/span><\/span> の頭打ちがこれに対応する）．<\/p><\/li>\n<li><p><strong>出典<\/strong>：<a target=\"_blank\" rel=\"noopener\" href=\"https://www.fs.isy.liu.se/Publications/Articles/CCSSE_04_MK.pdf\">M. Klein and L. Eriksson, \"A specific heat ratio model for single-zone heat release models\"（Linköping 大学，2004．表 1，表 2）<\/a><\/p><\/li>\n<\/ul>\n<hr />\n","<h3 id=\"spech14\">SPEC-03：カムプロファイルと弁の有効開口面積（REQ-03）<\/h3>\n<h4 id=\"spech15\">定義と式<\/h4>\n<ol type=\"1\">\n<li><p><strong>リフト<\/strong>：開時期 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta_o\">\\theta_o<\/span><\/span>，閉時期 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta_c\">\\theta_c<\/span><\/span> に対し，作用角 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta\\theta_{\\text{cam}} = \\text{md}(\\theta_c - \\theta_o)\">\\Delta\\theta_{\\text{cam}} = \\text{md}(\\theta_c - \\theta_o)<\/span><\/span>，開弁からの経過角 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\delta = \\text{md}(\\theta - \\theta_o)\">\\delta = \\text{md}(\\theta - \\theta_o)<\/span><\/span> とする．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\delta \\le \\Delta\\theta_{\\text{cam}}\">\\delta \\le \\Delta\\theta_{\\text{cam}}<\/span><\/span> のとき開弁で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\xi = \\delta/\\Delta\\theta_{\\text{cam}} \\in [0, 1]\">\\xi = \\delta/\\Delta\\theta_{\\text{cam}} \\in [0, 1]<\/span><\/span> に対しリフト <span class=\"im\"><span class=\"tx raw\" data-tex=\"L_v\">L_v<\/span><\/span> を次のいずれかで与える（それ以外は <span class=\"im\"><span class=\"tx raw\" data-tex=\"L_v = 0\">L_v = 0<\/span><\/span>）．<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>名称<\/th>\n<th><span class=\"im\"><span class=\"tx raw\" data-tex=\"L_v(\\xi)/L_{\\max}\">L_v(\\xi)/L_{\\max}<\/span><\/span><\/th>\n<th>開閉点での滑らかさ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Standard<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\sin^2(\\pi\\xi)\">\\sin^2(\\pi\\xi)<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"C^1\">C^1<\/span><\/span>（速度が連続，加速度が不連続）<\/td>\n<\/tr>\n<tr>\n<td>Polynomial<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"16\\,\\xi^2(1 - \\xi)^2\">16\\,\\xi^2(1 - \\xi)^2<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"C^1\">C^1<\/span><\/span>（端の 2 階微分は <span class=\"im\"><span class=\"tx raw\" data-tex=\"32 \\ne 0\">32 \\ne 0<\/span><\/span>）<\/td>\n<\/tr>\n<tr>\n<td>Aggressive<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\sin^{0.6}(\\pi\\xi)\">\\sin^{0.6}(\\pi\\xi)<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"C^0\">C^0<\/span><\/span>（端で速度が無限大）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>カムの種類と最大リフト <span class=\"im\"><span class=\"tx raw\" data-tex=\"L_{\\max}\">L_{\\max}<\/span><\/span> は吸気・排気で共通とする．<\/p><\/li>\n<li><p><strong>有効開口面積<\/strong>：弁のカーテン面積 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pi d_v L_v\">\\pi d_v L_v<\/span><\/span> を，弁座の面積 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{\\pi}{4}d_v^2\">\\frac{\\pi}{4}d_v^2<\/span><\/span> で頭打ちにする． <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"A_{\\text{eff}}(\\theta) = C_d\\,\\min\\left(\\pi d_v L_v,\\ \\frac{\\pi}{4}d_v^2\\right), \\qquad C_d = 0.6\">A_{\\text{eff}}(\\theta) = C_d\\,\\min\\left(\\pi d_v L_v,\\ \\frac{\\pi}{4}d_v^2\\right), \\qquad C_d = 0.6<\/span><\/span> 弁径は，吸気が <span class=\"im\"><span class=\"tx raw\" data-tex=\"d_{v,\\text{in}} = \\min(d_v, 0.45B)\">d_{v,\\text{in}} = \\min(d_v, 0.45B)<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"d_v\">d_v<\/span><\/span>：設定値），排気が <span class=\"im\"><span class=\"tx raw\" data-tex=\"d_{v,\\text{ex}} = 0.9375\\,d_{v,\\text{in}}\">d_{v,\\text{ex}} = 0.9375\\,d_{v,\\text{in}}<\/span><\/span>．<\/p><\/li>\n<li><p><strong>基本の開閉時期と VVT<\/strong>：吸気 IVO，IVC，排気 EVO，EVC と，位相 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varphi_{\\text{in}}\">\\varphi_{\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varphi_{\\text{ex}}\">\\varphi_{\\text{ex}}<\/span><\/span>（正が遅角）から，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta_o = \\text{IVO} + \\varphi_{\\text{in}}\">\\theta_o = \\text{IVO} + \\varphi_{\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta_c = \\text{IVC} + \\varphi_{\\text{in}}\">\\theta_c = \\text{IVC} + \\varphi_{\\text{in}}<\/span><\/span>（排気も同様）．位相は作用角とリフト曲線の形を変えない：<span class=\"im\"><span class=\"tx raw\" data-tex=\"L_v(\\theta; \\varphi) = L_v(\\theta - \\varphi; 0)\">L_v(\\theta; \\varphi) = L_v(\\theta - \\varphi; 0)<\/span><\/span>．<\/p><\/li>\n<li><p><strong>弁とピストンの干渉<\/strong>：平らなヘッド面とピストン頂面を仮定し，全クランク角（<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.5^\\circ\">0.5^\\circ<\/span><\/span> 刻み）で <span class=\"im\"><span class=\"tx raw\" data-tex=\"L_v(\\theta) &lt; h_c + x(\\theta)\">L_v(\\theta) &lt; h_c + x(\\theta)<\/span><\/span> を検査する．破る角度があれば <code>VALVE HIT<\/code> を運転タブに表示する（衝突はモデル化せず，計算は続ける）．<\/p><\/li>\n<\/ol>\n<ul>\n<li><strong>既定値と範囲<\/strong>（すべて運転中に変更できる）：IVO <span class=\"im\"><span class=\"tx raw\" data-tex=\"-10^\\circ\">-10^\\circ<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"[-40, 40]\">[-40, 40]<\/span><\/span>），IVC <span class=\"im\"><span class=\"tx raw\" data-tex=\"264^\\circ\">264^\\circ<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"[190, 290]\">[190, 290]<\/span><\/span>），EVO <span class=\"im\"><span class=\"tx raw\" data-tex=\"490^\\circ\">490^\\circ<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"[430, 530]\">[430, 530]<\/span><\/span>），EVC <span class=\"im\"><span class=\"tx raw\" data-tex=\"730^\\circ\">730^\\circ<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"[690, 760]\">[690, 760]<\/span><\/span>），<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varphi_{\\text{in}} = \\varphi_{\\text{ex}} = 0\">\\varphi_{\\text{in}} = \\varphi_{\\text{ex}} = 0<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pm 40^\\circ\">\\pm 40^\\circ<\/span><\/span>），<span class=\"im\"><span class=\"tx raw\" data-tex=\"L_{\\max} = 9\\ \\text{mm}\">L_{\\max} = 9\\ \\text{mm}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"[3, 14]\">[3, 14]<\/span><\/span>），<span class=\"im\"><span class=\"tx raw\" data-tex=\"d_v = 38\\ \\text{mm}\">d_v = 38\\ \\text{mm}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"[20, 50]\">[20, 50]<\/span><\/span>），カムは Standard．<\/li>\n<li><strong>数値上の注意<\/strong>：<span class=\"im\"><span class=\"tx raw\" data-tex=\"A_{\\text{eff}}\">A_{\\text{eff}}<\/span><\/span> は開閉点で折れる（Aggressive では傾きが無限大になる）．開閉点は積分のステップの境界にそろえる（SPEC-13）．<\/li>\n<li><strong>出典<\/strong>：Heywood (1988) Ch. 6．<\/li>\n<\/ul>\n<hr />\n","<h3 id=\"spech16\">SPEC-04：オリフィスの圧縮性流れ（順流・逆流・チョーク）（REQ-04）<\/h3>\n<h4 id=\"spech17\">定義と式<\/h4>\n<p>上流（高圧側）のよどみ圧 <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_0 = \\max(p_1, p_2)\">p_0 = \\max(p_1, p_2)<\/span><\/span>，よどみ温度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_0\">T_0<\/span><\/span>，比熱比 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_0\">\\gamma_0<\/span><\/span>，下流の静圧 <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_d = \\min(p_1, p_2)\">p_d = \\min(p_1, p_2)<\/span><\/span>，圧力比 <span class=\"im\"><span class=\"tx raw\" data-tex=\"r_p = p_d/p_0 \\in (0, 1]\">r_p = p_d/p_0 \\in (0, 1]<\/span><\/span> とする．エネルギーの式 <span class=\"im\"><span class=\"tx raw\" data-tex=\"c_p T_0 = c_p T + \\frac{u^2}{2}\">c_p T_0 = c_p T + \\frac{u^2}{2}<\/span><\/span> と等エントロピーの関係 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{T}{T_0} = r_p^{(\\gamma_0 - 1)/\\gamma_0}\">\\frac{T}{T_0} = r_p^{(\\gamma_0 - 1)/\\gamma_0}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\rho = \\frac{p_0}{RT_0}r_p^{1/\\gamma_0}\">\\rho = \\frac{p_0}{RT_0}r_p^{1/\\gamma_0}<\/span><\/span> から，のど部の質量流束は <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\rho u = \\frac{p_0}{\\sqrt{RT_0}}\\,\\Psi_{\\text{sub}}(r_p), \\qquad \\Psi_{\\text{sub}}(r_p) = r_p^{1/\\gamma_0}\\sqrt{\\frac{2\\gamma_0}{\\gamma_0 - 1}\\left(1 - r_p^{(\\gamma_0 - 1)/\\gamma_0}\\right)}\">\\rho u = \\frac{p_0}{\\sqrt{RT_0}}\\,\\Psi_{\\text{sub}}(r_p), \\qquad \\Psi_{\\text{sub}}(r_p) = r_p^{1/\\gamma_0}\\sqrt{\\frac{2\\gamma_0}{\\gamma_0 - 1}\\left(1 - r_p^{(\\gamma_0 - 1)/\\gamma_0}\\right)}<\/span><\/span> <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{\\partial(\\rho u)}{\\partial r_p} = 0\">\\frac{\\partial(\\rho u)}{\\partial r_p} = 0<\/span><\/span> から，流速が音速に達する臨界圧力比は <span class=\"im\"><span class=\"tx raw\" data-tex=\"r_{\\text{crit}} = \\left(\\frac{2}{\\gamma_0 + 1}\\right)^{\\gamma_0/(\\gamma_0 - 1)}\">r_{\\text{crit}} = \\left(\\frac{2}{\\gamma_0 + 1}\\right)^{\\gamma_0/(\\gamma_0 - 1)}<\/span><\/span>．<span class=\"im\"><span class=\"tx raw\" data-tex=\"r_p \\le r_{\\text{crit}}\">r_p \\le r_{\\text{crit}}<\/span><\/span> では流量が飽和する（チョーク）．<\/p>\n<p><span class=\"im\"><span class=\"tx raw\" data-tex=\"r_p \\to 1\">r_p \\to 1<\/span><\/span> では <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{d\\Psi_{\\text{sub}}}{dr_p} \\to -\\infty\">\\frac{d\\Psi_{\\text{sub}}}{dr_p} \\to -\\infty<\/span><\/span> となり，右辺が Lipschitz 連続でなくなる．これを避けるため，<span class=\"im\"><span class=\"tx raw\" data-tex=\"1 - r_p &lt; \\delta_r = 10^{-3}\">1 - r_p &lt; \\delta_r = 10^{-3}<\/span><\/span> では原点を通る直線に置き換える： <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\Psi(r_p) = \\begin{cases} \\sqrt{\\gamma_0\\left(\\frac{2}{\\gamma_0 + 1}\\right)^{(\\gamma_0 + 1)/(\\gamma_0 - 1)}} &amp; (r_p \\le r_{\\text{crit}}) \\\\[4pt] \\Psi_{\\text{sub}}(r_p) &amp; (r_{\\text{crit}} &lt; r_p \\le 1 - \\delta_r) \\\\[4pt] \\dfrac{1 - r_p}{\\delta_r}\\,\\Psi_{\\text{sub}}(1 - \\delta_r) &amp; (1 - \\delta_r &lt; r_p \\le 1) \\end{cases}\">\\Psi(r_p) = \\begin{cases} \\sqrt{\\gamma_0\\left(\\frac{2}{\\gamma_0 + 1}\\right)^{(\\gamma_0 + 1)/(\\gamma_0 - 1)}} &amp; (r_p \\le r_{\\text{crit}}) \\\\[4pt] \\Psi_{\\text{sub}}(r_p) &amp; (r_{\\text{crit}} &lt; r_p \\le 1 - \\delta_r) \\\\[4pt] \\dfrac{1 - r_p}{\\delta_r}\\,\\Psi_{\\text{sub}}(1 - \\delta_r) &amp; (1 - \\delta_r &lt; r_p \\le 1) \\end{cases}<\/span><\/span> <span class=\"im\"><span class=\"tx raw\" data-tex=\"r_p = 1 - \\delta_r\">r_p = 1 - \\delta_r<\/span><\/span> で値は連続だが，<strong>傾きは連続でない<\/strong>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"C^0\">C^0<\/span><\/span>．直線の傾きは <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Psi_{\\text{sub}}\">\\Psi_{\\text{sub}}<\/span><\/span> の傾きの約 2 倍）．直線部の傾き <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Psi_{\\text{sub}}(1 - \\delta_r)/\\delta_r \\approx \\sqrt{2/\\delta_r} = 44.7\">\\Psi_{\\text{sub}}(1 - \\delta_r)/\\delta_r \\approx \\sqrt{2/\\delta_r} = 44.7<\/span><\/span> が系の硬さを決める（SPEC-13）．<\/p>\n<p>質量流量は，有効面積 <span class=\"im\"><span class=\"tx raw\" data-tex=\"A\">A<\/span><\/span> に対し <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\dot m = \\text{sgn}(p_1 - p_2)\\,\\frac{A\\,p_0}{\\sqrt{RT_0}}\\,\\Psi(r_p)\">\\dot m = \\text{sgn}(p_1 - p_2)\\,\\frac{A\\,p_0}{\\sqrt{RT_0}}\\,\\Psi(r_p)<\/span><\/span> <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_0\">T_0<\/span><\/span> と <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_0\">\\gamma_0<\/span><\/span> は上流側のガスの値を使う（下表）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma_0 = \\gamma(T_0, Y)\">\\gamma_0 = \\gamma(T_0, Y)<\/span><\/span> は SPEC-02 の混合の式による．<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>流れ<\/th>\n<th><span class=\"im\"><span class=\"tx raw\" data-tex=\"p_1\">p_1<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_2\">p_2<\/span><\/span><\/th>\n<th>正の向き<\/th>\n<th>順流の上流（<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_0\">T_0<\/span><\/span>，組成）<\/th>\n<th>逆流の上流（<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_0\">T_0<\/span><\/span>，組成）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>スロットル <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{th}}\">\\dot m_{\\text{th}}<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{atm}}\">p_{\\text{atm}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{in}}\">p_{\\text{in}}<\/span><\/span><\/td>\n<td>マニホールドへ<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{amb}}\">T_{\\text{amb}}<\/span><\/span>，未燃<\/td>\n<td>マニホールドのガス（SPEC-05）<\/td>\n<\/tr>\n<tr>\n<td>吸気弁 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{in}}\">\\dot m_{\\text{in}}<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p_p\">p_p<\/span><\/span>（ランナ OFF では <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{in}}\">p_{\\text{in}}<\/span><\/span>），<span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span><\/td>\n<td>筒内へ<\/td>\n<td>ポートのガス（SPEC-05）<\/td>\n<td>筒内（<span class=\"im\"><span class=\"tx raw\" data-tex=\"T\">T<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_u\">Y_u<\/span><\/span>）<\/td>\n<\/tr>\n<tr>\n<td>排気弁 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{ex}}\">\\dot m_{\\text{ex}}<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p\">p<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{pe}\">p_{pe}<\/span><\/span>（排気系 OFF では <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{atm}} + \\Delta p_{\\text{ex}}\">p_{\\text{atm}} + \\Delta p_{\\text{ex}}<\/span><\/span>）<\/td>\n<td>筒内から外へ<\/td>\n<td>筒内（<span class=\"im\"><span class=\"tx raw\" data-tex=\"T\">T<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_u\">Y_u<\/span><\/span>）<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_X\">T_X<\/span><\/span>，既燃<\/td>\n<\/tr>\n<tr>\n<td>テールパイプ <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_t\">\\dot m_t<\/span><\/span><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p_m\">p_m<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{atm}}\">p_{\\text{atm}}<\/span><\/span><\/td>\n<td>大気へ<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_X\">T_X<\/span><\/span>，既燃<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{amb}}\">T_{\\text{amb}}<\/span><\/span>，未燃<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>出典<\/strong>：Heywood (1988) Appendix C．<\/li>\n<\/ul>\n<hr />\n","<h3 id=\"spech18\">SPEC-05：スロットルと吸気マニホールド（REQ-05）<\/h3>\n<h4 id=\"spech19\">定義と式<\/h4>\n<ol type=\"1\">\n<li><strong>環境<\/strong>：大気圧 <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{atm}}\">p_{\\text{atm}}<\/span><\/span>（既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"101.3\\ \\text{kPa}\">101.3\\ \\text{kPa}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"60\">60<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"110\\ \\text{kPa}\">110\\ \\text{kPa}<\/span><\/span>），大気温 <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{amb}} = 298.15\\ \\text{K}\">T_{\\text{amb}} = 298.15\\ \\text{K}<\/span><\/span>．エアクリーナと吸気ダクトの圧力損失は無視する．<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{atm}}\">p_{\\text{atm}}<\/span><\/span> は，スロットルの上流圧，テールパイプの出口圧（SPEC-27），クランクケースの背圧（SPEC-10），体積効率の基準密度（SPEC-14），初期値（§2.2）に共通に使う．層流燃焼速度の基準圧（SPEC-07）は物性式の定数で，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{atm}}\">p_{\\text{atm}}<\/span><\/span> とは無関係である．<\/li>\n<li><strong>吸気は予混合気とする<\/strong>（第26版，未実装：熱物性が「化学種」のときは，噴射方式に応じて SPEC-30 の 2，3 に代わる）：スロットルを通るガスは，当量比 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi\">\\phi<\/span><\/span> の空気と燃料蒸気の混合気（SPEC-02 の未燃ガス）とみなす．したがって <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{th}}\">\\dot m_{\\text{th}}<\/span><\/span> は混合気の流量で，その <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{1}{1 + \\phi/\\text{AF}_{st}}\">\\frac{1}{1 + \\phi/\\text{AF}_{st}}<\/span><\/span> が空気である（SPEC-07）．<\/li>\n<li><strong>スロットルの有効開口面積<\/strong>（理想スロットル．全閉で流量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>）：開度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha \\in [0, \\pi/2]\">\\alpha \\in [0, \\pi/2]<\/span><\/span> に対し <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"A_{\\text{th}}(\\alpha) = C_{d,\\text{th}}\\,\\frac{\\pi}{4}D_{\\text{th}}^2\\,(1 - \\cos\\alpha), \\qquad C_{d,\\text{th}} = 0.8\">A_{\\text{th}}(\\alpha) = C_{d,\\text{th}}\\,\\frac{\\pi}{4}D_{\\text{th}}^2\\,(1 - \\cos\\alpha), \\qquad C_{d,\\text{th}} = 0.8<\/span><\/span> 円板の流れ方向への投影面積が <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\cos\\alpha\">\\cos\\alpha<\/span><\/span> 倍になることによる近似（板厚と軸は無視）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"D_{\\text{th}}\">D_{\\text{th}}<\/span><\/span>：スロットル径（既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"40\\ \\text{mm}\">40\\ \\text{mm}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"20\">20<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"80\">80<\/span><\/span>）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha = 90^\\circ\">\\alpha = 90^\\circ<\/span><\/span> は板が流れと平行な全開である．<\/li>\n<li><strong>スロットルの流量<\/strong>：SPEC-04 の式で <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_1 = p_{\\text{atm}}\">p_1 = p_{\\text{atm}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"p_2 = p_{\\text{in}}\">p_2 = p_{\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"A = A_{\\text{th}}(\\alpha)\">A = A_{\\text{th}}(\\alpha)<\/span><\/span>．<\/li>\n<li><strong>マニホールド圧<\/strong>：容積 <span class=\"im\"><span class=\"tx raw\" data-tex=\"V_{\\text{in}}\">V_{\\text{in}}<\/span><\/span>（既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"1.5\\ \\text{L}\">1.5\\ \\text{L}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.3\">0.3<\/span><\/span>〜<span class=\"im\"><span class=\"tx raw\" data-tex=\"5\">5<\/span><\/span>）のガスを一様・等温（<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{in}} = 298.15\\ \\text{K}\">T_{\\text{in}} = 298.15\\ \\text{K}<\/span><\/span>）とする．質量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{\\text{in}} = \\frac{p_{\\text{in}}V_{\\text{in}}}{RT_{\\text{in}}}\">m_{\\text{in}} = \\frac{p_{\\text{in}}V_{\\text{in}}}{RT_{\\text{in}}}<\/span><\/span> の保存 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\frac{dm_{\\text{in}}}{dt} = \\dot m_{\\text{th}} - \\dot m_{\\text{dn}}\">\\frac{dm_{\\text{in}}}{dt} = \\dot m_{\\text{th}} - \\dot m_{\\text{dn}}<\/span><\/span> から <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\frac{dp_{\\text{in}}}{dt} = \\frac{RT_{\\text{in}}}{V_{\\text{in}}}\\left(\\dot m_{\\text{th}} - \\dot m_{\\text{dn}}\\right)\">\\frac{dp_{\\text{in}}}{dt} = \\frac{RT_{\\text{in}}}{V_{\\text{in}}}\\left(\\dot m_{\\text{th}} - \\dot m_{\\text{dn}}\\right)<\/span><\/span> <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{dn}}\">\\dot m_{\\text{dn}}<\/span><\/span> は下流へ出る流量で，ランナ ON では <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_r\">\\dot m_r<\/span><\/span>（SPEC-25），OFF では吸気弁の流量 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{in}}\">\\dot m_{\\text{in}}<\/span><\/span>．<\/li>\n<li><strong>既燃ガスの追跡<\/strong>：マニホールドの既燃ガス分率を <span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_{b,\\text{in}} = \\text{clamp}\\left(\\frac{m_{b,\\text{in}}}{m_{\\text{in}}}, 0, 1\\right)\">Y_{b,\\text{in}} = \\text{clamp}\\left(\\frac{m_{b,\\text{in}}}{m_{\\text{in}}}, 0, 1\\right)<\/span><\/span> とする．流れが運ぶ既燃分は上流側の組成で決める．スロットルから入るガスは既燃分 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>．ランナ OFF では <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\frac{dm_{b,\\text{in}}}{dt} = -\\dot m_{\\text{in}}\\,Y_{\\text{src}} + \\min(0, \\dot m_{\\text{th}})\\,Y_{b,\\text{in}}, \\qquad Y_{\\text{src}} = \\begin{cases} Y_{b,\\text{in}} &amp; (\\dot m_{\\text{in}} \\ge 0) \\\\ 1 - Y_u &amp; (\\dot m_{\\text{in}} &lt; 0) \\end{cases}\">\\frac{dm_{b,\\text{in}}}{dt} = -\\dot m_{\\text{in}}\\,Y_{\\text{src}} + \\min(0, \\dot m_{\\text{th}})\\,Y_{b,\\text{in}}, \\qquad Y_{\\text{src}} = \\begin{cases} Y_{b,\\text{in}} &amp; (\\dot m_{\\text{in}} \\ge 0) \\\\ 1 - Y_u &amp; (\\dot m_{\\text{in}} &lt; 0) \\end{cases}<\/span><\/span> 第 2 項はスロットルの逆流で出ていく分．ランナ ON の式は SPEC-25．<\/li>\n<li><strong>余剰エンタルピーの追跡<\/strong>：吸気側の容積の温度は圧力の式では <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{in}}\">T_{\\text{in}}<\/span><\/span> 一定とするが，筒内から吹き返した高温ガスが持ち込む熱は，既燃ガスと同じく「流れに乗って運ばれる量」として追跡する．\n<ul>\n<li>吸気弁の逆流（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{in}} &lt; 0\">\\dot m_{\\text{in}} &lt; 0<\/span><\/span>）が吸気側へ持ち込む<strong>余剰エンタルピー<\/strong>の流束を，筒内ガスの顕熱エンタルピーと，同じ組成のガスが <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{in}}\">T_{\\text{in}}<\/span><\/span> で持つ顕熱エンタルピーの差とする： <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\dot X_o = \\dot m_{\\text{in}}^-\\left[h(T, Y_u) - h(T_{\\text{in}}, Y_u)\\right]\">\\dot X_o = \\dot m_{\\text{in}}^-\\left[h(T, Y_u) - h(T_{\\text{in}}, Y_u)\\right]<\/span><\/span><\/li>\n<li>容積 <span class=\"im\"><span class=\"tx raw\" data-tex=\"k\">k<\/span><\/span>（マニホールド，ポート）にたまった余剰エンタルピーを <span class=\"im\"><span class=\"tx raw\" data-tex=\"E_k\">E_k<\/span><\/span> <span class=\"im\"><span class=\"tx raw\" data-tex=\"[\\text{J}]\">[\\text{J}]<\/span><\/span>，単位質量あたりを <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon_k = E_k/m_k\">\\varepsilon_k = E_k/m_k<\/span><\/span> とする．順流はこれを上流側の <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon\">\\varepsilon<\/span><\/span> で運ぶ．ランナ OFF では <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"\\frac{dE_{\\text{in}}}{dt} = \\dot X_o - \\dot m_{\\text{in}}^+\\,\\varepsilon_{\\text{in}} + \\min(0, \\dot m_{\\text{th}})\\,\\varepsilon_{\\text{in}}\">\\frac{dE_{\\text{in}}}{dt} = \\dot X_o - \\dot m_{\\text{in}}^+\\,\\varepsilon_{\\text{in}} + \\min(0, \\dot m_{\\text{th}})\\,\\varepsilon_{\\text{in}}<\/span><\/span> ランナ ON の式は SPEC-25．<\/li>\n<li><strong>吸気弁の順流の状態<\/strong>：吸気弁のすぐ上流の容積（ランナ ON ではポート，OFF ではマニホールド）の既燃分率を <span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_{b,\\text{src}}\">Y_{b,\\text{src}}<\/span><\/span>，余剰を <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon_{\\text{src}}\">\\varepsilon_{\\text{src}}<\/span><\/span> とすると，筒内へ入るガスの未燃分率は <span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_j = 1 - Y_{b,\\text{src}}\">Y_j = 1 - Y_{b,\\text{src}}<\/span><\/span>，顕熱エンタルピーは <span class=\"dx\"><span class=\"tx raw\" data-d=\"1\" data-tex=\"h_j = h(T_{\\text{in}}, Y_j) + \\varepsilon_{\\text{src}}\">h_j = h(T_{\\text{in}}, Y_j) + \\varepsilon_{\\text{src}}<\/span><\/span> オリフィスの式（SPEC-04）の上流温度は <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{up}} = T_{\\text{in}} + \\frac{\\varepsilon_{\\text{src}}}{c_p(T_{\\text{in}}, Y_j)}\">T_{\\text{up}} = T_{\\text{in}} + \\frac{\\varepsilon_{\\text{src}}}{c_p(T_{\\text{in}}, Y_j)}<\/span><\/span>，比熱比は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\gamma(T_{\\text{up}}, Y_j)\">\\gamma(T_{\\text{up}}, Y_j)<\/span><\/span> とする．スロットルの逆流の上流温度も同様に <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{in}} + \\varepsilon_{\\text{in}}/c_p(T_{\\text{in}}, 1 - Y_{b,\\text{in}})\">T_{\\text{in}} + \\varepsilon_{\\text{in}}/c_p(T_{\\text{in}}, 1 - Y_{b,\\text{in}})<\/span><\/span> で，比熱比はその温度と組成での値とする．<\/li>\n<li>壁との熱のや
