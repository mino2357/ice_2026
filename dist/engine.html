:root{--bg:#f4f5f7;--fg:#14181f;--cd:#fff;--ac:#d9480f;--mu:#5c6470;--ln:#d5d9e0;--ok:#2b8a3e;--ng:#e03131;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181f;--fg:#e8ecf2;--cd:#1e242e;--ac:#ff8a4c;--mu:#9aa3b2;--ln:#3a4250;--ok:#51cf66;--ng:#ff6b6b}}
:root[data-theme="dark"]{--bg:#14181f;--fg:#e8ecf2;--cd:#1e242e;--ac:#ff8a4c;--mu:#9aa3b2;--ln:#3a4250;--ok:#51cf66;--ng:#ff6b6b}
*{box-sizing:border-box}html{height:100%;overscroll-behavior:none}
body{margin:0;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{min-height:44px;min-width:44px;font:inherit;font-size:13px;color:var(--fg);background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:0 2px;white-space:nowrap;overflow:hidden}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.35}
nav{flex:none;height:48px;display:grid;grid-template-columns:repeat(6,1fr);background:var(--cd);border-bottom:1px solid var(--ln)}
nav button{border:0;border-radius:0;background:none;font-size:13px;padding:0;min-height:48px}nav button.on{background:none;color:var(--ac);font-weight:700;box-shadow:inset 0 -3px 0 var(--ac)}
section{display:none;flex:1;min-height:0;flex-direction:column;gap:4px;padding:6px 8px;max-width:900px;width:100%;margin:auto;position:relative;overflow:hidden}section.on{display:flex}
canvas{flex:1 1 0;height:0;min-height:0;width:100%;background:var(--cd);border-radius:8px;display:block}#eng{min-height:140px}.ew{flex:1 1 0;height:0;min-height:140px;position:relative;display:flex;flex-direction:column}.ntb{position:absolute;left:0;right:0;bottom:0;height:48px;display:flex;align-items:center;gap:4px;padding:2px 4px;touch-action:none;user-select:none;-webkit-user-select:none}.ntb button{flex:none;width:44px;height:44px;font-size:20px;line-height:1}.ntb button:disabled{opacity:.35}.ntv{flex:none;width:64px;font-size:11px;line-height:14px;text-align:center;font-variant-numeric:tabular-nums}.ntv b{font-size:14px;display:block}.ntr{flex:1 1 0;min-width:0;height:44px;position:relative}.ntr i{position:absolute;left:22px;right:22px;top:21px;height:3px;border-radius:2px;background:var(--ln)}.ntk{position:absolute;left:0;top:0;width:44px;height:44px;touch-action:none}.ntk b{position:absolute;left:11px;top:11px;width:22px;height:22px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 2px var(--cd)}.ntk.on b{transform:scale(1.2)}#pv{min-height:120px}#tc{min-height:200px}.swa{flex:1 1 0;min-height:0;overflow:hidden;font-size:12px;line-height:1.35}.swa table{width:100%;border-collapse:collapse}.swa th{text-align:left;color:var(--ac);font-weight:600;padding:4px 2px 1px}.swa td{padding:1px 2px;border-bottom:1px solid var(--ln);vertical-align:middle}.swa td:first-child{color:var(--mu);white-space:nowrap;padding-right:6px}.swo{flex:1 1 0;min-height:0;overflow:hidden;font-size:13px}.swo p{margin:6px 0 3px;color:var(--ac);font-weight:600;font-size:12px}.swo .ob{display:grid;gap:4px}.swo .o5{grid-template-columns:repeat(5,1fr)}.swo .o3{grid-template-columns:repeat(3,1fr)}
.gr{display:grid;gap:4px;flex:none}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g4 button{font-size:12px}.g5{grid-template-columns:repeat(5,1fr)}.g6{grid-template-columns:repeat(6,1fr)}.g7{grid-template-columns:repeat(7,1fr)}.g7 button{font-size:12px}
.m{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;flex:none}.m div{height:32px;display:flex;justify-content:space-between;align-items:center;background:var(--cd);border-radius:6px;padding:0 8px;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}.m b{color:var(--mu);font-weight:400;min-width:0}.m b.jp{white-space:normal;font-size:11px;line-height:13px;color:var(--fg);margin-right:4px}
#Pg{display:flex;flex-direction:column;gap:2px;flex:none}
.r{display:grid;grid-template-columns:1fr auto 44px 44px;gap:6px;align-items:center;height:46px;background:var(--cd);border-radius:8px;padding:0 6px;font-size:13px;white-space:nowrap}.r.p{outline:2px solid var(--ac);outline-offset:-2px}.r b{font-variant-numeric:tabular-nums;font-size:15px}.r span{overflow:hidden;text-overflow:ellipsis}
.r.c{grid-template-columns:auto 1fr}.r.c div{display:flex;gap:4px;justify-content:flex-end}.r.c button{flex:0 1 96px}
.ctl{flex:none;background:var(--cd);border-radius:8px;padding:2px 8px;font-size:12px;line-height:18px;font-variant-numeric:tabular-nums}.ctl div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ctl span{font-weight:700;padding:0 2px;border-radius:3px;color:#fff}.rg{background:#2f9e44}.rc{background:#e8590c}.rm{background:#1c7ed6}.rf{background:#868e96}.ra{background:#9c36b5}
.ln{flex:none;height:18px;line-height:18px;font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.card{background:var(--cd);border-radius:8px;padding:8px;font-variant-numeric:tabular-nums;overflow:hidden}.ok{color:var(--ok)}.ng{color:var(--ng)}
button.ok,button.ng{border-color:currentColor;font-weight:700}button.run{border-color:var(--ac)}button.sl{outline:3px solid var(--ac);outline-offset:-1px}
#pl{position:absolute;inset:0;background:var(--bg);display:none;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:8px;padding:8px;z-index:5}#pl.on{display:grid}#pl button{font-size:15px}
#dt{flex:1;min-height:0;font-size:13px;line-height:1.5;word-break:break-all}
#s4.on{display:block;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-bottom:32px;user-select:text;-webkit-user-select:text;font-size:15px;line-height:1.7}
#s4 h3{margin:20px 0 4px;font-size:16px}#s4 .tw{overflow-x:auto}.toc{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;margin:4px 0 8px;font-size:13px;line-height:1.3}.toc b{grid-column:1/-1}.toc a{display:flex;align-items:center;min-height:36px;padding:0 6px;border-radius:6px;background:var(--cd);color:var(--ac);cursor:pointer}.dtop{position:fixed;right:12px;bottom:16px;z-index:4;min-width:72px;opacity:.92;background:var(--cd)}.eqs{display:flex;align-items:center;gap:6px}
#s4 .opt{border-left:3px solid var(--ln);padding-left:8px;margin:4px 0;opacity:.6}
#s4 .opt.cur{border-left-color:var(--ac);opacity:1}
#s4 .opt p{margin:2px 0;font-size:13px}.eqs .mx{flex:1 1 auto;min-width:0}.sref{flex:none;font-size:12px;color:var(--mu)}#s4 .mx{overflow-x:auto;padding:2px 0}#s4 math{font-family:'LM Math',math;font-size:1.15em}#s4 p math,#s4 td math{font-size:1.05em}#s4 table{border-collapse:collapse;font-size:12px;width:100%}#s4 td,#s4 th{border-bottom:1px solid var(--ln);padding:3px 4px;text-align:left;vertical-align:top}#s4 a{color:var(--ac)}#s4 .src{font-size:12px;color:var(--mu)}

#pv0{display:none}

#s0.on{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);grid-template-rows:auto auto auto auto minmax(0,1fr);column-gap:12px;row-gap:6px}

${H3(1,'状態方程式系','13')}<p>16 の状態量を時間積分する．スロットル開度 α などの入力は ECU と動力計が決め，積分の 1 ステップの間は一定とする（§14）．</p>${M('{d y|d t} = f(y; α)')}${M('y = (θ, ω, p, m, m_u, T_w, p_in, m_bi, ṁ_r, p_p, m_bp, ṁ_e, p_pe, p_m, E_in, E_p)')}<p><b>解いている連立常微分方程式（全 16 式）</b>．右の § は各式の導出と記号の詳細を述べる章．ṁ_in，ṁ_ex は弁の流量（§5），ṁ_th はスロットルの流量（§6），H_in，H_ex は弁の流れが運ぶエネルギーの項（§10），Y_r，Y_v，ε_R は流れの上流側の値（§6），X_o は吸気弁の逆流が持ち込む熱（§6）．弁の流れは順流の場合の式を示す．ランナ OFF では ṁ_r = ṁ_in，p_p = p_in，Y_bp = Y_bi，ε_p = ε_in とし，ṁ_r，p_p，m_bp，E_p の式の右辺は 0 になる．排気系 OFF では ṁ_e，p_pe，p_m の式の右辺は 0 になる．</p><div class="eqs" data-st="θ">${M('{d θ|d t} = ω')}<span class="sref">§11</span></div><div class="eqs" data-st="ω">${M('{d ω|d t} = {T_i + T_s − T_f − T_aux − T_d|I_t}')}<span class="sref">§11</span></div><div class="eqs" data-st="p">${M('{d p|d t} = −γ {p|V}{d V|d t} + {γ − 1|V}(Q_c + m_0 {d x_b|d t}(e_u − e_b) − Q_w + H_in − H_ex)')}<span class="sref">§10</span></div><div class="eqs" data-st="m">${M('{d m|d t} = ṁ_in − ṁ_ex')}<span class="sref">§7</span></div><div class="eqs" data-st="m_u">${M('{d m_u|d t} = (1 − Y_v) ṁ_in − Y_u ṁ_ex − m_0 {d x_b|d t}')}<span class="sref">§7</span></div><div class="eqs" data-st="T_w">${M('{d T_w|d t} = {Q_w − G_h (T_w − T_c)|C_h}')}<span class="sref">§9</span></div><div class="eqs" data-st="p_in">${M('{d p_in|d t} = {R T_in|V_in}(ṁ_th − ṁ_r)')}<span class="sref">§6</span></div><div class="eqs" data-st="m_bi">${M('{d m_bi|d t} = −ṁ_r Y_r + min(0, ṁ_th) Y_bi')}<span class="sref">§6</span></div><div class="eqs" data-st="ṁ_r">${M('{d ṁ_r|d t} = {A_r|L_r}(p_in − p_p) − {ζ ṁ_r |ṁ_r||2 ρ_r A_r L_r}')}<span class="sref">§6</span></div><div class="eqs" data-st="p_p">${M('{d p_p|d t} = {γ_p R T_in|V_p}(ṁ_r − ṁ_in)')}<span class="sref">§6</span></div><div class="eqs" data-st="m_bp">${M('{d m_bp|d t} = ṁ_r Y_r − ṁ_in Y_v')}<span class="sref">§6</span></div><div class="eqs" data-st="ṁ_e">${M('{d ṁ_e|d t} = {A_e|L_e}(p_pe − p_m) − {ζ_x ṁ_e |ṁ_e||2 ρ_e A_e L_e}')}<span class="sref">§17</span></div><div class="eqs" data-st="p_pe">${M('{d p_pe|d t} = {γ_p R T_X|V_pe}(ṁ_ex − ṁ_e)')}<span class="sref">§17</span></div><div class="eqs" data-st="p_m">${M('{d p_m|d t} = {R T_X|V_m}(ṁ_e − ṁ_t)')}<span class="sref">§17</span></div><div class="eqs" data-st="E_in">${M('{d E_in|d t} = −ṁ_r ε_R + min(0, ṁ_th) ε_in')}<span class="sref">§6</span></div><div class="eqs" data-st="E_p">${M('{d E_p|d t} = ṁ_r ε_R − max(0, ṁ_in) ε_p + X_o')}<span class="sref">§6</span></div>
${H3(2,'クランク運動学','01')}<p>スライダ・クランク機構の幾何から筒内容積を与える．</p>${M('V = V_c + A_p x')}${M('x = r(1 − cos θ + {1|λ}(1 − [1 − λ^2 sin^2 θ]))')}${M('{d V|d θ} = A_p r sin θ (1 + {λ cos θ|[1 − λ^2 sin^2 θ]})')}${M('V_c = {V_d|ε − 1},  h_c = {V_c|A_p}')}<p>仮定：剛体機構，ピストンピンのオフセットなし．</p>${src('hw')}
${H3(3,'作動流体の熱物性','02')}<p>筒内ガスは一様な理想気体とする．気体定数は未燃ガスと既燃ガスで共通の R とする．</p>${M('p V = m R T')}<p>比熱は，未燃ガス（新気の混合気）と既燃ガスで分ける．比熱比は，量論比の化学平衡計算への線形の当てはめ（Klein と Eriksson）で，有効範囲の上限（未燃 T_cu = ${dc('tu')} K，既燃 T_cb = ${dc('tb')} K）より上では一定とする．設定「燃焼」の比熱が「γ(T)」のとき（既定），</p><div class="opt" data-opt="gam" data-val="0">${M(`γ_u = ${THM.au} − ${(THM.bu*1e5).toFixed(1)} × 10^{−5}(min(T, T_cu) − 300)`)}${M(`γ_b = ${THM.ab} − ${(THM.bb*1e5).toFixed(1)} × 10^{−5}(min(T, T_cb) − 300)`)}</div><p>定積比熱は R/(γ − 1) で，未燃分率 Y_u（§7）で<b>比熱を</b>補間する（γ を補間するのではない）．</p>${M('c_v = Y_u {R|γ_u − 1} + (1 − Y_u){R|γ_b − 1},  γ = 1 + {R|c_v},  c_p = c_v + R')}<p>顕熱の内部エネルギーは，基準温度 T_ref = ${dc('t0')} K からの比熱の積分で定義する．γ_u − 1 は T の一次式（傾き −b_u，b_u = ${dc('bu')}×10⁻⁵ /K）なので，積分は対数になる．既燃ガスも同じ形である（b_b = ${dc('bb')}×10⁻⁵ /K）．</p><div class="opt" data-opt="gam" data-val="0">${M('{d e_u|d T} = {R|γ_u − 1},  {d e_b|d T} = {R|γ_b − 1}')}${M('e_u = {R|b_u} ln {γ_u(T_ref) − 1|γ_u(T) − 1},  T ≤ T_cu')}${M('e_b = {R|b_b} ln {γ_b(T_ref) − 1|γ_b(T) − 1},  T ≤ T_cb')}</div><p>上限より上では比熱が一定なので，e_u，e_b は T の一次式で延ばす．顕熱エンタルピーは次式で，筒内圧の式（§10）と吸気側の熱の式（§6）に使う．</p>${M('h_u = e_u + R T,  h_b = e_b + R T')}<p>比熱を「γ一定」にすると，次の定比熱比モデルになる（比較用）．</p><div class="opt" data-opt="gam" data-val="1">${M(`γ_u = γ_b = ${K.g0},  e_u = e_b = {R|γ − 1}(T − T_ref)`)}</div><p>γ の一定値は ${dc('g0')}．当量比と圧力による γ の変化は扱わない．既燃ガスの当てはめは，平衡組成の γ を 1% 弱の誤差で表す．</p>${src('ke','hw')}
${H3(4,'弁リフト・有効開口面積・VVT','03')}<p>カム位相オフセット φ_c は開閉時期を同量ずらす（作用角は不変）．正規化したカム位相 ξ に対し，リフトを次の 3 種から選ぶ（設定「VVT・カム」）．</p>${M('ξ = {θ − θ_o − φ_c|θ_c − θ_o}')}<div class="opt" data-opt="cam" data-val="0"><p>Std（開閉点で速度が連続）</p>${M('L_v = L_max sin^2(π ξ)')}</div><div class="opt" data-opt="cam" data-val="1"><p>Poly（開閉点で速度が連続）</p>${M('L_v = 16 L_max ξ^2 (1 − ξ)^2')}</div><div class="opt" data-opt="cam" data-val="2"><p>Aggr（開閉点で速度が無限大）</p>${M('L_v = L_max (sin(π ξ))^{0.6}')}</div>${M('A_eff = C_d min(π d_v L_v, {π|4} d_v^2)')}<p>流量係数は ${dc('cdv')}．弁径は，吸気が設定値と 0.45B の小さい方，排気がその 0.9375 倍．弁とピストンが干渉しない条件は次式で，破ると VALVE HIT を表示する．</p>${M('L_v < h_c + x')}${src('hw')}
${H3(5,'オリフィス流量','04')}<p>弁，スロットル，排気の出口の流量を，等エントロピー流れの式で与える．よどみ圧 p_0 は p_1 と p_2 の大きい方で，よどみ温度 T_0 と比熱比 γ は上流側（圧力の高い側）のガスの値を使う．</p>${M('ṁ = sgn(p_1 − p_2) {A p_0|[R T_0]} Ψ')}${M('Ψ = [{2γ|γ − 1}(r^{2|γ} − r^{γ + 1|γ})]')}${M('r_c = ({2|γ + 1})^{γ|γ − 1}')}<p>この節の r は下流圧／上流圧．r が臨界圧力比 r_c 以下ではチョークし，Ψ は r = r_c の値で一定になる．r が 1 に近づくと Ψ の傾きが無限大になるので，1 − r が δ_r = 10⁻³ より小さい範囲では，原点を通る直線に置き換える（値は連続，傾きは不連続）．</p>${M('Ψ(r) = {1 − r|δ_r} Ψ(1 − δ_r),  r > 1 − δ_r')}${src('hw')}
${H3(6,'スロットルと吸気マニホールド','05')}<p>スロットル上流は大気圧．マニホールドは，圧力の式では等温・一様の容積とする．吸気は当量比 φ の予混合気（空気と燃料蒸気の混合気）とする．</p>${M('A_th = C_t {π|4} D_t^2 (1 − cos α)')}${M('{d p_in|d t} = {R T_in|V_in}(ṁ_th − ṁ_in)')}<p>流量係数は ${dc('cdt')}．ṁ_th は p_a から p_in への §5 の流量．漏れの無い理想スロットルとし，開度 α = 0 で流量は 0 になる（α = 90° は板が流れと平行な全開）．</p><p><b>既燃ガスの追跡（内部 EGR）</b>：オーバーラップ中に吸気側へ吹き返した既燃ガスは，マニホールドにたまり，次の吸気行程で筒内へ戻る．マニホールド内の既燃ガス質量 m_bi を追跡する．スロットルからは新気だけが入る．吸気弁の流れに乗る既燃ガス分率 Y_v は，流れの上流側の組成で決まる（ランナ OFF の場合を示す）．</p>${M('{d m_bi|d t} = −ṁ_in Y_v + min(0, ṁ_th) Y_bi')}${M('Y_v = Y_bi  (ṁ_in ≥ 0),  Y_v = 1 − Y_u  (ṁ_in < 0)')}${M('Y_bi = {m_bi|m_in},  m_in = {p_in V_in|R T_in}')}<p><b>熱の追跡（余剰エンタルピー）</b>：筒内から吹き返した高温のガスが吸気側へ持ち込む熱も，既燃ガスと同じく「流れに乗って運ばれる量」として追跡する．吸気弁の逆流が持ち込む流束 X_o は，筒内ガスの顕熱エンタルピーと，同じ組成のガスが T_in で持つ顕熱エンタルピーの差である．</p>${M('X_o = max(0, −ṁ_in)(Y_u (h_u(T) − h_u(T_in)) + (1 − Y_u)(h_b(T) − h_b(T_in)))')}<p>マニホールドとポートにたまった余剰 E_in，E_p を，単位質量あたりの値 ε_in，ε_p として流れが運ぶ（ランナ ON の場合を示す．ランナの流れに乗る ε_R は，ṁ_r ≥ 0 なら ε_in，ṁ_r &lt; 0 なら ε_p）．</p>${M('{d E_in|d t} = −ṁ_r ε_R + min(0, ṁ_th) ε_in')}${M('{d E_p|d t} = ṁ_r ε_R − max(0, ṁ_in) ε_p + X_o')}${M('ε_in = {E_in|m_in},  ε_p = {E_p|m_p}')}<p>吸気弁の順流は，弁のすぐ上流の容積の余剰 ε_s（ランナ ON では ε_p，OFF では ε_in）を乗せて筒内へ入る．その顕熱エンタルピー h_s は筒内圧の式（§10）に，上流温度 T_up は弁の流量の式（§5）に使う．</p>${M('h_s = (1 − Y_v) h_u(T_in) + Y_v h_b(T_in) + ε_s')}${M('T_up = T_in + {ε_s|c_ps}')}<p>吸気側の壁との熱のやりとりは無い（断熱）とする．周期定常では，吹き返した熱は全量が筒内へ戻る．実機ではポート壁への放熱で一部が失われるので，吹き返しによる吸気の加熱の上限の見積もりである．吸気側の容積の密度は T_in で評価したままで，温度上昇による密度の低下は扱わない．</p><p><b>吸気ランナ（慣性過給）</b>：マニホールドと吸気弁の間の長さ L_r，内径 d_r の管の中のガス柱を，質量を持つ柱として扱う．柱の運動方程式（Newton の第2法則）から，</p>${M('{d ṁ_r|d t} = {A_r|L_r}(p_in − p_p) − {ζ ṁ_r |ṁ_r||2 ρ_r A_r L_r}')}<p>ζ = f_r L_r/d_r + ζ_e，f_r = ${dc('fr')}，ζ_e = ${dc('ze')}．弁側半分の容積 V_p = A_r L_r/2 をポートとし，その圧力は断熱の剛性で変わる．</p>${M('{d p_p|d t} = {γ_p R T_in|V_p}(ṁ_r − ṁ_in)')}<p>γ_p = ${dc('gp')}（集中定数の剛性の定数）．吸気弁の流量 ṁ_in は p_p を上流圧として §5 の式で求め，マニホールドの式の ṁ_in は ṁ_r に替える．既燃ガスはポートでも追跡する（m_bp．Y_r は ṁ_r ≥ 0 なら Y_bi，ṁ_r &lt; 0 なら Y_bp）．</p>${M('{d m_bi|d t} = −ṁ_r Y_r + min(0, ṁ_th) Y_bi,  {d m_bp|d t} = ṁ_r Y_r − ṁ_in Y_v')}<p>弁が閉じているとき，ランナは次の角振動数で共鳴する．</p>${M('ω_H = [{A_r|L_r}({γ_p R T_in|V_p} + {R T_in|V_in})]')}<p>弁が開くと筒内容積が加わって振動数が下がり，その周期が吸気行程と合う回転数で充填が増える．ランナを長くすると，この回転数が下がる．1次元の圧力波は解かない集中定数近似である．</p>${src('go')}
${H3(7,'筒内組成（未燃ガスと既燃ガス）','06')}<p>筒内の全質量 m と未燃ガス（新気）の質量 m_u を追跡し，残留ガス率を求める．吸気弁の順流は弁のすぐ上流の組成（既燃ガス分率 Y_v，§6）で入り，逆流は筒内の組成で出る．排気弁の逆流は既燃ガスだけとする．順流の場合を示す．</p>${M('{d m|d t} = ṁ_in − ṁ_ex')}${M('{d m_u|d t} = (1 − Y_v) ṁ_in − Y_u ṁ_ex − m_0 {d x_b|d t}')}${M('Y_u = {m_u|m},  x_r = 1 − Y_u')}<p>m_0 は吸気弁が閉じた時点の未燃ガスの質量で，Wiebe 関数の燃焼割合 x_b（§8）に従って既燃ガスに変わる．</p>${src('hw')}
${H3(8,'燃焼（Wiebe 関数）','07')}<p>質量燃焼割合を Wiebe 関数で与える．</p>${M('x_b = 1 − exp(−a z^{m_w + 1}),  z = {θ − θ_0|Δ θ_b}')}${M('Q_c = m_f H_u η_c ε_r {d x_b|d t}')}<p>a = ${dc('wa')}，H_u = ${dc('hu')} MJ/kg，η_c = ${dc('etac')}．燃焼割合は 99.3% で打ち切るので，η_c と合わせて，供給した燃料の発熱量のうち 96.3% が発熱する（φ ≤ 1 のとき）．</p><p>着火遅れと燃焼期間は，点火の時点の層流燃焼速度 S_L と乱れ強さ u から決める．S_L は Metghalchi と Keck の相関（定数は Turns の教科書の gasoline の組）で，当量比 φ，点火の時点の筒内の温度 T と圧力 p，残留ガス率 x_r の関数である．</p>${M(`S_L0 = max(0.05, ${SLC.Bm} − ${-SLC.B2} (φ − ${SLC.phm})^2)`)}${M(`S_L = S_L0 ({T|298})^{2.18 − 0.8(φ − 1)} ({p|101325})^{−0.16 + 0.22(φ − 1)} max(0.15, 1 − ${SLC.dil} x_r)`)}${M(`Δ θ_d = c_d {l_k ω|S_L + C_k u},  Δ θ_b = {f_ret l_c ω|c_b S_T},  S_T = S_L + ${K.Ct} u`)}<p>S_L0 と S_L の単位は m/s，この式の T は K，p は Pa．定数は ${dc('bm')}，${dc('b2')} m/s，${dc('phm')}，希釈の係数 ${dc('dil')}，乱流の係数 ${dc('ct')}．l_k = ${dc('lk')}B，C_k = ${dc('ck')}，l_c = 0.65B，u は平均ピストン速度の 1/2．c_d，c_b は設定「燃焼速度」の調整係数．形状係数 m_w が大きいほど，熱発生のピークが燃焼期間の後ろへ寄る．</p><p>当量比 φ > 1（リッチ）では酸素が足りず，燃料の一部が CO と H₂ のまま残る．燃料 1 mol（CH₁.₈₇）あたりの生成物を元素保存と水性ガスシフト平衡（K = 3.5）で決め，燃え残りの発熱量を差し引く係数 ε_r を掛ける．</p>${M('ε_r = 1 − {n_CO h_CO + n_H2 h_H2|M_f H_u}')}<p>空気量あたりの熱発生 φ ε_r は φ = 1 で最大になり，1.1 で 0.969，1.2 で 0.938 に下がる．生成物のモル数増加は扱わないので，実機（φ ≈ 1.1 で出力最大）より出力の最大がやや薄い側にある．</p>${src('hw','mk','tn')}
${H3(9,'壁面熱伝達と壁温','08')}<p>Woschni の式で熱伝達率を与え，壁温は集中熱容量で解く．</p>${M('h = C_w 3.26 B^{−0.2} p^{0.8} T^{−0.55} w^{0.8}')}${M('w = C_1 c_m + C_2 {V_d T_1|p_1 V_1} max(0, p − p_mot),  p_mot = p_1 ({V_1|V})^{1.33}')}${M('Q_w = h A_w (T − T_w)')}${M('C_h {d T_w|d t} = Q_w − G_h (T_w − T_c)')}<p>h の式の p は kPa．p_1，V_1，T_1 は吸気弁が閉じた時点の筒内の状態で，p_mot は燃焼が無いとしたときの圧力の見積もり（ポリトロープ指数 1.33）．C_1 はガス交換期間 ${dc('c1s')}，圧縮・膨張期間 ${dc('c1g')}．C_2 = ${dc('c2')}（燃焼項は圧縮・膨張期間のみ）．冷却水温 T_c は一定である．</p>${src('wo','hw')}
${H3(10,'筒内圧力方程式','09')}<p>開いた系の熱力学第一法則と状態方程式から導く．比熱が温度と組成で変わるので，顕熱の内部エネルギー e_u，e_b（§3）を使う．未燃ガスは，燃えて既燃ガスになるときに単位質量あたり q_u の熱を出すとすると，筒内の全エネルギーの収支は次のとおり（順流の場合．右辺は順に，膨張の仕事，壁への熱，吸気弁から入るエネルギー，排気弁から出るエネルギー）．</p>${M('{d|d t}(m_u (e_u + q_u) + (m − m_u) e_b) = −p {d V|d t} − Q_w + ṁ_in (h_s + (1 − Y_v) q_u) − ṁ_ex (Y_u (h_u + q_u) + (1 − Y_u) h_b)')}<p>左辺を m と m_u の式（§7）で展開すると，流れが運ぶ q_u の項は両辺で消え，燃えた分の ${Mi('m_0 {d x_b|d t}(q_u + e_u − e_b)')} が残る．${Mi('m_0 {d x_b|d t} q_u')} は熱発生率 Q_c（§8）である．h_u − e_u = h_b − e_b = RT を使うと</p>${M('m c_v {d T|d t} = Q_c + m_0 {d x_b|d t}(e_u − e_b) − Q_w − p {d V|d t} + ṁ_in (h_s − (1 − Y_v) e_u − Y_v e_b) − ṁ_ex R T')}<p>${Mi('m_0 {d x_b|d t}(e_u − e_b)')} は，未燃ガスと既燃ガスが同じ温度で持つ顕熱の差で，組成が変わることによる項である．T = pV/(mR) を時間微分して代入し，R/c_v = γ − 1 を使って整理すると次式を得る．</p>${M('{d p|d t} = −γ {p|V}{d V|d t} + {γ − 1|V}(Q_c + m_0 {d x_b|d t}(e_u − e_b) − Q_w + H_in − H_ex)')}${M('H_in = ṁ_in (h_s − (1 − Y_v) e_u − Y_v e_b + c_v T),  H_ex = ṁ_ex c_p T')}<p>逆流では，吸気弁は筒内のガスが出るので H_in = ṁ_in c_p T，排気弁は温度 T_X の既燃ガスが入るので H_ex = ṁ_ex (h_X − e_b + c_v T) とする（h_X は h_b の T_X での値）．定比熱比モデルでは，流入の項は c_p に上流温度を掛けた形に帰着する．</p><p><b>第一法則の検査</b>：顕熱エネルギー U_s について，上の式から「U_s の増分 = −（膨張の仕事）−（壁への熱）+（発熱）+（流入の顕熱エンタルピー）−（流出の顕熱エンタルピー）」が成り立つ．各項を補助積分（§14）で積分し，この残差が発熱の 10⁻⁴ 以下であることを検証タブの TEST-09 で確かめている．</p>${M('U_s = m_u e_u + (m − m_u) e_b')}${src('hw','ke')}
${H3(11,'回転運動・スターター・摩擦','10')}<p>クランク軸まわりの運動方程式．摩擦は Chen–Flynn 型で与える．</p>${M('I_t {d ω|d t} = T_i + T_s − T_f − T_aux − T_d')}<p>T_aux は補機（オルタネータ・ポンプ類）の負荷トルクで，回転中は一定値（設定）とする．</p>${M('T_i = (p − p_a){d V|d θ}')}${M('T_s = T_k (1 − {ω|ω_k})')}${M('FMEP = F_0 + F_1 p_max + F_2 c_m,  T_f = {FMEP V_d|4π}')}<p>T_k = ${dc('tst')} N·m，ω_k = ${dc('wnl')} rad/s．F_0 = ${dc('cfa')} kPa，F_1 = ${dc('cfb')}，F_2 = ${dc('cfc')} kPa·s/m．スターターは完爆判定後に切り離す．</p>${src('cf','hw')}
${H3(12,'水ブレーキ動力計と運転モード','11')}<p>吸収専用の負荷装置．充水率に比例し，回転数の2乗に比例するトルクを吸収する．</p>${M('T_d = f_e k_w ω^2,  k_w = {T_r|ω_r^2}')}${M('τ_d {d f_e|d t} = f_c − f_e')}<p>モードA：スロットル PI が回転数を制御し，f_c は手動値で一定．モードB：α は手動値で一定，次の PI が回転数を保持する．</p>${M('f_c = clamp(f_b + K_pd e_d + I_f, 0, 1)')}${M('{d I_f|d t} = K_id e_d,  e_d = N̄ − N_t')}<p>飽和を深める向きの偏差では積分を止める．f_c が 1 に張り付いて回転が下がらなければ OVERLOAD，0 に張り付いて上がらなければ UNDERPOWER を表示する．</p>${src('mp')}
${H3(13,'ECU（スロットル開度 PI 制御）','12')}<p>モードAで，平均回転数を目標に保つ．</p>${M('α = clamp(α_f + K_p e + I_α, α_min, α_max)')}${M('{d I_α|d t} = K_i e,  e = N_t − N̄')}${M('τ_N {d N̄|d t} = N − N̄')}<p>補機負荷 T_aux に応じて基準の開度を上げ（feedforward），開度に下限を設ける．完爆直後に回転が吹け上がっても全閉にならず，吸気管圧が枯渇しないので，負荷が大きくても始動できる．ECU は T_aux を正確に知っているとする．k_T = 0.26 °/(N·m)，δ_α = 1° は定数である．</p>${M('α_f = α_b + k_T T_aux')}${M('α_min = min(α_max, max(0, α_f − δ_α))')}<p>点火時期の自動最適化（ON のとき）：各サイクルの質量燃焼割合 50% の時期 θ_50 を上死点後 10° に合わせるよう，点火進角 s をサイクルごとに補正する．ノッキングは考慮しない．</p>${M('θ_50 = θ_0 + Δ θ_b ({ln 2|a})^{1|3}')}${M('s ← s + k_s (θ_50 − θ_t)')}<p>本モデルで点火時期を掃引すると，IMEP 最大の θ_50 は上死点後 8〜13° にあり，10° を目標にしたときの IMEP の低下は 0.5% 未満だった．</p>${src('go')}
${H3(14,'数値積分','13')}<p>RK4（固定刻み）と Dormand–Prince 5(4)（DOPRI5，刻みの自動調整．既定）を選べる．</p>${M('y_1 = y_0 + {Δ t|6}(k_1 + 2 k_2 + 2 k_3 + k_4)')}${M('Δ t = min({Δ θ_s|max(ω, ω_min)}, Δ t_max)')}<p>RK4 の刻みは，クランク角の刻み Δθ_s（設定，既定 0.25°）から決め，ω_min = ${dc('wmin')} rad/s，Δt_max = ${dc('dtr4')} μs で頭打ちにする．Δt_max は系の硬さで決まる．弁の前後の圧力がほぼ等しいとき，筒内とポートの間のやりとりが最も速く，ヤコビアンの固有値の絶対値は最大で約 7×10⁴ /s になる．RK4 の安定限界（固有値と刻みの積が 2.79 以下）の内側に収まるように選んだ．</p><p>DOPRI5 は，5 次の解と 4 次の解の差を許容誤差で割った値の最大 E が 1 以下なら採用し，次の刻みを次式で決める．刻みの上限は 0.5°CA と 1 ms の小さい方で，ほとんどのステップはこの上限で進む．</p>${M('Δ t_n = Δ t min(2.5, max(0.2, 0.9 E^{−1|5}))')}<p><b>イベント</b>：サイクルの終端（θ = 4π），吸気弁と排気弁の開閉，点火の角度では，右辺が折れるか，状態の記録や切替が起きる．ステップは，これらの角度をまたがず，ちょうどその角度で終わるように刻みを調整する．イベントでの処理（吸気弁が閉じた時点の状態の記録，着火遅れと燃焼期間の計算，サイクルの集計）は，その角度の状態で行う．サイクルの終端で θ から 4π を引く．</p><p><b>補助積分</b>：仕事，各断面を通った質量，熱と流れのエネルギーなど，サイクルの集計と保存則の検査に使う量は，状態と同じ Runge–Kutta の重みで同時に積分する．集計は状態と同じ次数になり，質量とエネルギーの収支はステップごとに丸め誤差の範囲で閉じる．</p><p>ECU と動力計の状態（平均回転数，積分項，充水率）はステップの終わりに更新し，ステップの間は一定とする．筒内の最高圧は，ステップ点の極大とその前後の 3 点を通る放物線の頂点で求める．</p>${src('dp')}
${H3(15,'評価指標','14')}<p>サイクルの終端ごとに，補助積分（§14）の 1 サイクルの増分から求める．圧力の表示は kPa．</p>${M('IMEP = {W_i|V_d},  FMEP = {W_f|V_d},  AMEP = {4π T_aux|V_d}')}${M('BMEP = IMEP − FMEP − AMEP')}${M('T_b = {BMEP V_d|4π},  P_b = {BMEP V_d|t_c}')}${M('η_m = {BMEP|IMEP},  bsfc = {ṁ_f|P_b},  η_b = {P_b|ṁ_f H_u},  η_i = {W_i|m_f H_u}')}${M(`η_v = {m_0|(1 + φ/${K.AFR}) ρ_a V_d},  ρ_a = {p_a|R T_a}`)}<p>W_i は 1 サイクルの p dV の積分（ポンプ損失を含む正味の図示仕事）．AMEP は補機の負荷．η_v の分子は吸気弁が閉じた時点の未燃ガスのうちの空気の質量（量論空燃比 ${dc('afr')}）．発熱の分母は供給した燃料の発熱量なので，燃え残りと燃焼効率の損失は効率に現れる．指標は，完爆後の直近 10 サイクルの平均を表示する．</p>${src('hw')}
${H3(16,'エンジン音','21')}<p>設定「音響」の「音の種類」で，計算（以下の式による音．既定）と演出を切り替える．演出は，聞いて心地よいように作った 4 気筒風の音で，物理モデルではない．計算から受け取るのは 1 気筒分の排気流量の波形，回転数，吸気管圧だけで，気筒数，歪み，共鳴，吸気音，アクセルオフの破裂音は演出である．演出は機関の計算に影響しない．以下は計算の音の説明である．</p><p>直前のサイクルの排気流量から1サイクル分の波形を作り，現在の回転数の実時間の速さで繰り返し鳴らす．再生速度によらず，800 rpm は 800 rpm の音になる．</p>${M('q = {d ṁ_ex|d θ} ω')}${M('Δ ψ = {1440 N̄|120 f_s}')}<p>1サンプルごとに位相 ψ を進めるので，音の周期は 120/N̄ 秒（爆発の周期）．約 20 Hz（2400 rpm）より遅い爆発は個々の「トトト」として，速い爆発は音の高さとして聞こえる．</p><p>排気管は，弁側を閉端・出口を開放端とする管として，往復遅延と反射で表す．反射には消音器の吸収 ρ_m と，周波数が高いほど大きい管内損失（管壁の粘性・熱伝導と開口端からの放射）を掛ける．</p>${M('v(k) = q(k) − ρ_m H(f) v(k − D),  D = {2 L f_s|c}')}${M('|H(f)| = exp(−2 α_w L − {(π f d_e)^2|2 c^2})')}${M('α_w = {[π f ν]|(d_e/2) c}(1 + {γ − 1|[P_r]})')}${M('f_n = {(2n − 1) c|4 L},  c = [γ_b R T_e]')}<p>音速の γ_b は既燃ガスの T_e での値（§3）．管壁の減衰の式の γ は 1.35（音響の損失の定数）．</p><p>|H(f)| は 1 kHz での値が一致する一次低域フィルタで近似する．</p><p>音量は，ピーク包絡に追従する圧縮器でそろえる．包絡は 0.2 s 保持するので，1 サイクルの中では利得が一定で，波形の衝撃性（波高率）を損なわない．</p>${M('e_p = max(|x_c|, e_p exp(−{1|f_s τ_r}))')}${M('G = min(1, ({l_t|e_p})^{3/4})')}${M('p_s = tanh(g G x_c)')}<p>実機の燃焼はサイクルごとにばらつく．サイクル変動を ON にすると，各サイクルの振幅と周期を次のようにずらす（擬似乱数の種は固定）．</p>${M('A_j = 1 + 0.03 z_1,  P_j = {120|N̄}(1 + 0.005 z_2)')}<p>既定の L = 1 m で第1共鳴は約 ${(cEx()/4).toFixed(0)} Hz．スマートフォンの内蔵スピーカーは低音が弱いので，ヘッドホンを推奨する．</p>${src('ki')}<p><b>演出音の処理</b>（音の種類を「演出」にしたとき．物理モデルではなく，定数はすべて試聴で決めた）．計算から受け取るのは，1 気筒分の音源 ${Mi('q')}（上の式），平均回転数 ${Mi('N̄')}，吸気管圧 ${Mi('p_in')} の 3 つだけである．吸気管圧から負荷の目安 ${Mi('l_d')}（アイドルと減速で 0，全開で 1）を作り，以下の段で使う．</p>${M('l_d = clamp({p_in/p_a − 0.3|0.6}, 0, 1)')}<p>1 気筒の波形を，クランク角 180° ずつずらして 4 本足す（4 気筒化）．爆発の周波数は単気筒の 4 倍の ${Mi('N̄')}/30 Hz になる．気筒ごとに利得 ${Mi('g_k')} と排気管の遅れ ${Mi('τ_k')} をわずかに変え，サイクル変動 ON では振幅 ${Mi('a_k')} を ±${FLV.jit*100}% ばらつかせる．</p>${M('x_4 = G_x λ_l λ_N Σ g_k a_k q(ψ(t − τ_k) + 360 k)')}<p>${Mi('λ_l')} はアクセルオフで音を小さくする係数（低回転では小さくしない），${Mi('λ_N')} は回転数による音量差を縮める係数である．</p>${M('λ_l = λ_0 + (1 − λ_0) clamp({1600 − N̄|700}, 0, 1),  λ_0 = 0.2 + 0.8 l_d^{0.8}')}${M('λ_N = min(6, ({3500|N̄})^{0.9})')}<p>これに雑音と破裂音を足し，歪ませる．歪みの深さ ${Mi('κ')} は負荷と回転数で増える（踏むほど，回すほど荒くなる）．2 乗の項は波形を非対称にして偶数次の倍音を足す．</p>${M('κ = 2.6 (0.25 + 0.75 l_d)(0.4 + 0.6 min(1, {N̄|6000}))')}${M('u_d ← {tanh(κ (u_d + 0.35 u_d^2))|max(0.2, tanh κ)}')}<p>破裂音は，負荷がほぼ 0（${Mi('l_d')} &lt; 0.08）で 2200 rpm を超えているとき，各気筒の爆発のたびに確率 ${Mi('P_o')} で起こす．実機の減速時の後燃えを模した演出で，モデルの中では何も燃えていない．</p>${M('P_o = 0.5 min(1, {N̄ − 2200|2000})')}<p>その後，短い集合管の共鳴（上の式と同じくし形フィルタ），帯域ごとの共鳴，負荷で開く低域通過（遮断周波数 ${Mi('f_L')}），吸気音，低域の持ち上げを順に通し，計算の音と同じ圧縮器で音量をそろえる．</p>${M('f_L = 1400 + 7600 l_d^{0.7} (0.5 + 0.5 min(1, {N̄|5000}))')}<div class="tw"><table><tr><th>段</th><th>処理</th><th>聞こえ方</th></tr><tr><td>1</td><td>吸気管圧 → 負荷の目安</td><td>踏んでいるか離しているかで以下を変える</td></tr><tr><td>2</td><td>4 気筒化と音量配分</td><td>音の高さが 4 倍．減速中は静かに，アイドルは聞こえる大きさに</td></tr><tr><td>3</td><td>雑音（1.5〜7 kHz）</td><td>排気の流れの「シャー」</td></tr><tr><td>4</td><td>破裂音</td><td>アクセルオフの「パラパラ」</td></tr><tr><td>5</td><td>歪み</td><td>踏むほど，回すほど荒くなる</td></tr><tr><td>6</td><td>集合管の共鳴</td><td>硬く張った音</td></tr><tr><td>7</td><td>帯域ごとの共鳴</td><td>95・190 Hz が低音，1150・2600 Hz が高回転の甲高さ</td></tr><tr><td>8</td><td>負荷で開く低域通過</td><td>離すとこもり，踏むと開ける</td></tr><tr><td>9</td><td>吸気音</td><td>全開の「クォー」</td></tr><tr><td>10</td><td>低域の持ち上げ，圧縮器</td><td>低音の底上げ，音量をそろえる</td></tr></table></div><div class="tw"><table><tr><th>定数</th><th>値</th></tr><tr><td>気筒数</td><td>4</td></tr><tr><td>気筒ごとの利得</td><td><span data-fl="hg">${FLV.hg.join('，')}</span></td></tr><tr><td>気筒ごとの遅れ [ms]</td><td><span data-fl="hd">${FLV.hd.map(v=>+(v*1e3).toFixed(3)).join('，')}</span></td></tr><tr><td>集合管の長さ [m]，反射率</td><td><span data-fl="L">${FLV.L}</span>，<span data-fl="r">${FLV.r}</span></td></tr><tr><td>歪みの深さの最大，非対称の係数</td><td><span data-fl="drive">${FLV.drive}</span>，<span data-fl="asym">${FLV.asym}</span></td></tr><tr><td>共鳴（中心周波数 Hz／Q／利得 dB）</td><td><span data-fl="form">${FLV.form.map(f=>f.join('／')).join('，')}</span></td></tr><tr><td>低域通過の遮断周波数の範囲 [Hz]</td><td><span data-fl="dark">${FLV.dark}</span>〜<span data-fl="bright">${FLV.bright}</span></td></tr><tr><td>雑音の量，吸気音の量</td><td><span data-fl="noise">${FLV.noise}</span>，<span data-fl="intake">${FLV.intake}</span></td></tr><tr><td>破裂音の確率の最大，大きさ</td><td><span data-fl="pop">${FLV.pop}</span>，<span data-fl="popG">${FLV.popG}</span></td></tr><tr><td>低域の持ち上げ（周波数 Hz／利得 dB）</td><td><span data-fl="shelf">${FLV.shelf.join('／')}</span></td></tr></table></div><p>4 気筒の爆発の周波数は 6500 rpm で 217 Hz なので，高回転ではそれより低い音はほとんど出ない．演出は機関の計算には影響しない．演出のときは，排気管長・内径・反射率・流れ雑音の設定は使わない．</p>${H3(17,'排気系（排気管の脈動と背圧）','27')}<p>排気弁の下流に，排気管（長さ L_e，内径 d_e．音響の設定と共用），消音器（容積 V_m），出口（有効面積 A_t）を置く．排気管のガス柱の運動方程式と，排気ポート（排気管の弁側半分の容積 V_pe）と消音器の圧力の式を解く．排気系のガス温度は T_X 一定．</p>${M('{d ṁ_e|d t} = {A_e|L_e}(p_pe − p_m) − {ζ_x ṁ_e |ṁ_e||2 ρ_e A_e L_e}')}${M('{d p_pe|d t} = {γ_p R T_X|V_pe}(ṁ_ex − ṁ_e),  {d p_m|d t} = {R T_X|V_m}(ṁ_e − ṁ_t)')}<p>ṁ_ex は p_pe を下流圧とする排気弁の流量（§5），ṁ_t は p_m から大気圧への出口の流量（§5 の式，流量係数 ${dc('cdx')}）．背圧はおおむね出口の流量の2乗に比例し，アイドルではほぼ 0，全開・高回転で大きくなる．弁が閉じているとき，排気管は次の角振動数で共鳴する．</p>${M('ω_E = [{A_e|L_e}({γ_p R T_X|V_pe} + {R T_X|V_m})]')}<p>ζ_x = f_r L_e/d_e + ζ_e，ρ_e = p_pe/(R T_X)．OFF のときは排気弁の下流圧を p_a + Δp_x（一定）とする．</p>${src('hw')}<p class="src">数式フォント：Latin Modern Math（GUST e-foundry，GUST Font License）を必要な文字だけに絞って埋め込んでいる．</p>`;inlineMath($('s4'));docVals()}
