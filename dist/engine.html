\\left[h_f(T_l) - h_{fg}\\right]dt\">\\int\\dot m_{\\text{ev}}\\left[h_f(T_l) - h_{fg}\\right]dt<\/span><\/span><\/td>\n<td>SPEC-29<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","<h3 id=\"gloh10\">2.6 流れと吸排気系<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>記号<\/th>\n<th>名称<\/th>\n<th>単位<\/th>\n<th>定義<\/th>\n<th>仕様<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m\">\\dot m<\/span><\/span><\/td>\n<td>オリフィスの質量流量<\/td>\n<td>kg/s<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m = \\text{sgn}(p_1 - p_2)\\,\\dfrac{A\\,p_0}{\\sqrt{RT_0}}\\,\\Psi(r_p)\">\\dot m = \\text{sgn}(p_1 - p_2)\\,\\dfrac{A\\,p_0}{\\sqrt{RT_0}}\\,\\Psi(r_p)<\/span><\/span><\/td>\n<td>SPEC-04<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"r_p\">r_p<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"r_{\\text{crit}}\">r_{\\text{crit}}<\/span><\/span><\/td>\n<td>圧力比，臨界圧力比<\/td>\n<td>–<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"r_p = \\dfrac{\\min(p_1, p_2)}{\\max(p_1, p_2)}\">r_p = \\dfrac{\\min(p_1, p_2)}{\\max(p_1, p_2)}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"r_{\\text{crit}} = \\left(\\dfrac{2}{\\gamma_0 + 1}\\right)^{\\gamma_0/(\\gamma_0 - 1)}\">r_{\\text{crit}} = \\left(\\dfrac{2}{\\gamma_0 + 1}\\right)^{\\gamma_0/(\\gamma_0 - 1)}<\/span><\/span><\/td>\n<td>SPEC-04<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Psi\">\\Psi<\/span><\/span><\/td>\n<td>流量関数<\/td>\n<td>–<\/td>\n<td>亜音速で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Psi_{\\text{sub}} = r_p^{1/\\gamma_0}\\sqrt{\\dfrac{2\\gamma_0}{\\gamma_0 - 1}\\left(1 - r_p^{(\\gamma_0 - 1)/\\gamma_0}\\right)}\">\\Psi_{\\text{sub}} = r_p^{1/\\gamma_0}\\sqrt{\\dfrac{2\\gamma_0}{\\gamma_0 - 1}\\left(1 - r_p^{(\\gamma_0 - 1)/\\gamma_0}\\right)}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"r_p \\le r_{\\text{crit}}\">r_p \\le r_{\\text{crit}}<\/span><\/span> で一定，<span class=\"im\"><span class=\"tx raw\" data-tex=\"1 - r_p &lt; \\delta_r = 10^{-3}\">1 - r_p &lt; \\delta_r = 10^{-3}<\/span><\/span> で直線<\/td>\n<td>SPEC-04<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{th}}\">\\dot m_{\\text{th}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{in}}\">\\dot m_{\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{ex}}\">\\dot m_{\\text{ex}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_t\">\\dot m_t<\/span><\/span><\/td>\n<td>スロットル，吸気弁（筒内へが正），排気弁（筒内からが正），テールパイプの流量<\/td>\n<td>kg/s<\/td>\n<td>SPEC-04 の式に各断面の圧力と面積を入れる<\/td>\n<td>SPEC-04<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha\">\\alpha<\/span><\/span><\/td>\n<td>スロットル開度（<span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>：全閉，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pi/2\">\\pi/2<\/span><\/span>：全開）<\/td>\n<td>rad<\/td>\n<td>入力<\/td>\n<td>SPEC-05，12<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"A_{\\text{th}}\">A_{\\text{th}}<\/span><\/span><\/td>\n<td>スロットルの有効開口面積<\/td>\n<td>m²<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"A_{\\text{th}} = C_{d,\\text{th}}\\dfrac{\\pi}{4}D_{\\text{th}}^2(1 - \\cos\\alpha)\">A_{\\text{th}} = C_{d,\\text{th}}\\dfrac{\\pi}{4}D_{\\text{th}}^2(1 - \\cos\\alpha)<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"C_{d,\\text{th}} = 0.8\">C_{d,\\text{th}} = 0.8<\/span><\/span><\/td>\n<td>SPEC-05<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{atm}}\">p_{\\text{atm}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{amb}}\">T_{\\text{amb}}<\/span><\/span><\/td>\n<td>大気圧，大気温<\/td>\n<td>Pa，K<\/td>\n<td>設定（既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"101.3\\ \\text{kPa}\">101.3\\ \\text{kPa}<\/span><\/span>），<span class=\"im\"><span class=\"tx raw\" data-tex=\"298.15\">298.15<\/span><\/span><\/td>\n<td>SPEC-05<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{in}}\">T_{\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"V_{\\text{in}}\">V_{\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{\\text{in}}\">m_{\\text{in}}<\/span><\/span><\/td>\n<td>マニホールドの温度（一定），容積，ガス質量<\/td>\n<td>K，m³，kg<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{in}} = 298.15\">T_{\\text{in}} = 298.15<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{\\text{in}} = \\dfrac{p_{\\text{in}}V_{\\text{in}}}{RT_{\\text{in}}}\">m_{\\text{in}} = \\dfrac{p_{\\text{in}}V_{\\text{in}}}{RT_{\\text{in}}}<\/span><\/span><\/td>\n<td>SPEC-05<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_{b,\\text{in}}\">Y_{b,\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_{b,p}\">Y_{b,p}<\/span><\/span><\/td>\n<td>マニホールド，ポートの既燃ガス分率<\/td>\n<td>–<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_{b,\\text{in}} = \\text{clamp}\\left(\\dfrac{m_{b,\\text{in}}}{m_{\\text{in}}}, 0, 1\\right)\">Y_{b,\\text{in}} = \\text{clamp}\\left(\\dfrac{m_{b,\\text{in}}}{m_{\\text{in}}}, 0, 1\\right)<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_{b,p} = \\text{clamp}\\left(\\dfrac{m_{b,p}}{m_p}, 0, 1\\right)\">Y_{b,p} = \\text{clamp}\\left(\\dfrac{m_{b,p}}{m_p}, 0, 1\\right)<\/span><\/span><\/td>\n<td>SPEC-05，25<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot X_o\">\\dot X_o<\/span><\/span><\/td>\n<td>吸気弁の逆流が吸気側へ持ち込む余剰エンタルピーの流束<\/td>\n<td>W<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot X_o = \\dot m_{\\text{in}}^-\\left[h(T, Y_u) - h(T_{\\text{in}}, Y_u)\\right]\">\\dot X_o = \\dot m_{\\text{in}}^-\\left[h(T, Y_u) - h(T_{\\text{in}}, Y_u)\\right]<\/span><\/span><\/td>\n<td>SPEC-05<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon_{\\text{in}}\">\\varepsilon_{\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon_p\">\\varepsilon_p<\/span><\/span><\/td>\n<td>単位質量あたりの余剰エンタルピー<\/td>\n<td>J/kg<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon_{\\text{in}} = E_{\\text{in}}/m_{\\text{in}}\">\\varepsilon_{\\text{in}} = E_{\\text{in}}/m_{\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon_p = E_p/m_p\">\\varepsilon_p = E_p/m_p<\/span><\/span><\/td>\n<td>SPEC-05，25<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_{b,\\text{src}}\">Y_{b,\\text{src}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon_{\\text{src}}\">\\varepsilon_{\\text{src}}<\/span><\/span><\/td>\n<td>吸気弁のすぐ上流の容積の既燃分率と余剰<\/td>\n<td>–，J/kg<\/td>\n<td>ランナ ON ではポート，OFF ではマニホールドの値<\/td>\n<td>SPEC-05<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"h_j\">h_j<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{up}}\">T_{\\text{up}}<\/span><\/span><\/td>\n<td>吸気弁の順流の顕熱エンタルピーと上流温度<\/td>\n<td>J/kg，K<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"h_j = h(T_{\\text{in}}, Y_j) + \\varepsilon_{\\text{src}}\">h_j = h(T_{\\text{in}}, Y_j) + \\varepsilon_{\\text{src}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{up}} = T_{\\text{in}} + \\dfrac{\\varepsilon_{\\text{src}}}{c_p(T_{\\text{in}}, Y_j)}\">T_{\\text{up}} = T_{\\text{in}} + \\dfrac{\\varepsilon_{\\text{src}}}{c_p(T_{\\text{in}}, Y_j)}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_j = 1 - Y_{b,\\text{src}}\">Y_j = 1 - Y_{b,\\text{src}}<\/span><\/span><\/td>\n<td>SPEC-05<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"L_r\">L_r<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"d_r\">d_r<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"A_r\">A_r<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"V_p\">V_p<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_p\">m_p<\/span><\/span><\/td>\n<td>吸気ランナの長さ，内径，断面積，ポート容積，ポートのガス質量<\/td>\n<td>m，m，m²，m³，kg<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"A_r = \\dfrac{\\pi}{4}d_r^2\">A_r = \\dfrac{\\pi}{4}d_r^2<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"V_p = \\dfrac12 A_r L_r\">V_p = \\dfrac12 A_r L_r<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_p = \\dfrac{p_p V_p}{RT_{\\text{in}}}\">m_p = \\dfrac{p_p V_p}{RT_{\\text{in}}}<\/span><\/span><\/td>\n<td>SPEC-25<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\zeta\">\\zeta<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\rho_r\">\\rho_r<\/span><\/span><\/td>\n<td>ランナの損失係数，ガス密度<\/td>\n<td>–，kg/m³<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\zeta = f_r\\dfrac{L_r}{d_r} + \\zeta_e\">\\zeta = f_r\\dfrac{L_r}{d_r} + \\zeta_e<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_r = 0.02\">f_r = 0.02<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\zeta_e = 0.2\">\\zeta_e = 0.2<\/span><\/span>），<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\rho_r = \\dfrac{p_{\\text{in}}}{RT_{\\text{in}}}\">\\rho_r = \\dfrac{p_{\\text{in}}}{RT_{\\text{in}}}<\/span><\/span><\/td>\n<td>SPEC-25<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_r\">Y_r<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon_r\">\\varepsilon_r<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_v\">Y_v<\/span><\/span><\/td>\n<td>ランナの流れ，吸気弁の流れに乗る値（上流側の値）<\/td>\n<td>–<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_r \\ge 0\">\\dot m_r \\ge 0<\/span><\/span> でマニホールドの値，<span class=\"im\"><span class=\"tx raw\" data-tex=\"&lt; 0\">&lt; 0<\/span><\/span> でポートの値．<span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_v\">Y_v<\/span><\/span> は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{in}} \\ge 0\">\\dot m_{\\text{in}} \\ge 0<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_{b,p}\">Y_{b,p}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"&lt; 0\">&lt; 0<\/span><\/span> で <span class=\"im\"><span class=\"tx raw\" data-tex=\"1 - Y_u\">1 - Y_u<\/span><\/span><\/td>\n<td>SPEC-25<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\omega_H\">\\omega_H<\/span><\/span><\/td>\n<td>吸気ランナの共鳴の角振動数（弁が閉じているとき）<\/td>\n<td>rad/s<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\omega_H = \\sqrt{\\dfrac{A_r}{L_r}\\left(\\dfrac{\\gamma_0 RT_{\\text{in}}}{V_p} + \\dfrac{RT_{\\text{in}}}{V_{\\text{in}}}\\right)}\">\\omega_H = \\sqrt{\\dfrac{A_r}{L_r}\\left(\\dfrac{\\gamma_0 RT_{\\text{in}}}{V_p} + \\dfrac{RT_{\\text{in}}}{V_{\\text{in}}}\\right)}<\/span><\/span><\/td>\n<td>SPEC-25<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"L_e\">L_e<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"d_e\">d_e<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"A_e\">A_e<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"V_{pe}\">V_{pe}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"V_m\">V_m<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"A_t\">A_t<\/span><\/span><\/td>\n<td>排気管の長さ，内径，断面積，排気ポート容積，消音器容積，出口の有効面積<\/td>\n<td>m，m，m²，m³，m³，m²<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"A_e = \\dfrac{\\pi}{4}d_e^2\">A_e = \\dfrac{\\pi}{4}d_e^2<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"V_{pe} = \\dfrac12 A_e L_e\">V_{pe} = \\dfrac12 A_e L_e<\/span><\/span><\/td>\n<td>SPEC-27<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_X\">T_X<\/span><\/span><\/td>\n<td>排気系のガス温度（一定）<\/td>\n<td>K<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_X = 800\">T_X = 800<\/span><\/span><\/td>\n<td>SPEC-27<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\omega_E\">\\omega_E<\/span><\/span><\/td>\n<td>排気管の共鳴の角振動数<\/td>\n<td>rad/s<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\omega_E = \\sqrt{\\dfrac{A_e}{L_e}\\left(\\dfrac{\\gamma_0 RT_X}{V_{pe}} + \\dfrac{RT_X}{V_m}\\right)}\">\\omega_E = \\sqrt{\\dfrac{A_e}{L_e}\\left(\\dfrac{\\gamma_0 RT_X}{V_{pe}} + \\dfrac{RT_X}{V_m}\\right)}<\/span><\/span><\/td>\n<td>SPEC-27<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta\\bar p_{\\text{ex}}\">\\Delta\\bar p_{\\text{ex}}<\/span><\/span><\/td>\n<td>排気背圧（サイクル平均）<\/td>\n<td>Pa<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta\\bar p_{\\text{ex}} = \\dfrac{\\Delta P_m}{t_c} - p_{\\text{atm}}\">\\Delta\\bar p_{\\text{ex}} = \\dfrac{\\Delta P_m}{t_c} - p_{\\text{atm}}<\/span><\/span><\/td>\n<td>SPEC-14，27<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","<h3 id=\"gloh11\">2.7 燃焼<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>記号<\/th>\n<th>名称<\/th>\n<th>単位<\/th>\n<th>定義<\/th>\n<th>仕様<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi\">\\phi<\/span><\/span><\/td>\n<td>当量比<\/td>\n<td>–<\/td>\n<td>量論空燃比 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{AF}_{st} = 14.7\">\\text{AF}_{st} = 14.7<\/span><\/span> に対する燃料の割合．設定<\/td>\n<td>SPEC-07<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{u,\\text{trapped}}\">m_{u,\\text{trapped}}<\/span><\/span><\/td>\n<td>吸気弁が閉じた時点の未燃ガスの質量<\/td>\n<td>kg<\/td>\n<td>IVC の時点の <span class=\"im\"><span class=\"tx raw\" data-tex=\"m_u\">m_u<\/span><\/span><\/td>\n<td>SPEC-06<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{\\text{air}}\">m_{\\text{air}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_f\">m_f<\/span><\/span><\/td>\n<td>1 サイクルの空気と燃料の質量<\/td>\n<td>kg<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"m_{\\text{air}} = \\dfrac{m_{u,\\text{trapped}}}{1 + \\phi/\\text{AF}_{st}}\">m_{\\text{air}} = \\dfrac{m_{u,\\text{trapped}}}{1 + \\phi/\\text{AF}_{st}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"m_f = \\dfrac{\\phi}{\\text{AF}_{st}}\\,m_{\\text{air}}\">m_f = \\dfrac{\\phi}{\\text{AF}_{st}}\\,m_{\\text{air}}<\/span><\/span><\/td>\n<td>SPEC-07<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"S_{L,0}\">S_{L,0}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"S_L\">S_L<\/span><\/span><\/td>\n<td>基準状態・点火時の層流燃焼速度<\/td>\n<td>m/s<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"S_{L,0} = \\max(0.05,\\ 0.2758 - 0.7834(\\phi - 1.13)^2)\">S_{L,0} = \\max(0.05,\\ 0.2758 - 0.7834(\\phi - 1.13)^2)<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"S_L = S_{L,0}\\left(\\dfrac{T_s}{298}\\right)^{2.18 - 0.8(\\phi - 1)}\\left(\\dfrac{p_s}{101325}\\right)^{-0.16 + 0.22(\\phi - 1)}\\max(0.15,\\ 1 - 2.1x_r)\">S_L = S_{L,0}\\left(\\dfrac{T_s}{298}\\right)^{2.18 - 0.8(\\phi - 1)}\\left(\\dfrac{p_s}{101325}\\right)^{-0.16 + 0.22(\\phi - 1)}\\max(0.15,\\ 1 - 2.1x_r)<\/span><\/span><\/td>\n<td>SPEC-07<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"u&#x27;\">u&#x27;<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"S_T\">S_T<\/span><\/span><\/td>\n<td>乱れの強さ，乱流燃焼速度<\/td>\n<td>m/s<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"u&#x27; = 0.5\\,c_m\">u&#x27; = 0.5\\,c_m<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"S_T = S_L + 6u&#x27;\">S_T = S_L + 6u&#x27;<\/span><\/span><\/td>\n<td>SPEC-07<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"s\">s<\/span><\/span><\/td>\n<td>点火進角<\/td>\n<td>°BTDC<\/td>\n<td>点火の角度は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta = 2\\pi - s\">\\theta = 2\\pi - s<\/span><\/span><\/td>\n<td>SPEC-07，12<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta\\theta_d\">\\Delta\\theta_d<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta\\theta_b\">\\Delta\\theta_b<\/span><\/span><\/td>\n<td>着火遅れ，燃焼期間<\/td>\n<td>rad<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta\\theta_d = c_d\\dfrac{\\ell_k\\,\\omega}{S_L + C_k u&#x27;}\">\\Delta\\theta_d = c_d\\dfrac{\\ell_k\\,\\omega}{S_L + C_k u&#x27;}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta\\theta_b = \\dfrac{f_{\\text{ret}}}{c_b}\\dfrac{\\ell_c\\,\\omega}{S_T}\">\\Delta\\theta_b = \\dfrac{f_{\\text{ret}}}{c_b}\\dfrac{\\ell_c\\,\\omega}{S_T}<\/span><\/span><\/td>\n<td>SPEC-07<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta_0\">\\theta_0<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\zeta\">\\zeta<\/span><\/span><\/td>\n<td>燃焼の開始角，正規化した燃焼の進行<\/td>\n<td>rad，–<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta_0 = 2\\pi - s + \\Delta\\theta_d\">\\theta_0 = 2\\pi - s + \\Delta\\theta_d<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\zeta = \\dfrac{\\theta - \\theta_0}{\\Delta\\theta_b}\">\\zeta = \\dfrac{\\theta - \\theta_0}{\\Delta\\theta_b}<\/span><\/span>（SPEC-25 では <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\zeta\">\\zeta<\/span><\/span> はランナの損失係数）<\/td>\n<td>SPEC-07<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"x_b\">x_b<\/span><\/span><\/td>\n<td>質量燃焼割合（Wiebe 関数）<\/td>\n<td>–<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"x_b = 1 - \\exp\\left(-a\\,\\zeta^{m_w + 1}\\right)\">x_b = 1 - \\exp\\left(-a\\,\\zeta^{m_w + 1}\\right)<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"a = 5\">a = 5<\/span><\/span><\/td>\n<td>SPEC-07<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"r\">r<\/span><\/span><\/td>\n<td>未燃ガスが既燃ガスに変わる速さ（燃焼の節）<\/td>\n<td>kg/s<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"r = m_{u,\\text{trapped}}\\dfrac{dx_b}{d\\theta}\\,\\omega\">r = m_{u,\\text{trapped}}\\dfrac{dx_b}{d\\theta}\\,\\omega<\/span><\/span>（SPEC-01 では <span class=\"im\"><span class=\"tx raw\" data-tex=\"r\">r<\/span><\/span> はクランク半径）<\/td>\n<td>SPEC-06<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"Q_{\\text{in}}\">Q_{\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot Q_{\\text{comb}}\">\\dot Q_{\\text{comb}}<\/span><\/span><\/td>\n<td>1 サイクルの発熱量，熱発生率<\/td>\n<td>J，W<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"Q_{\\text{in}} = m_f H_u\\,\\eta_c\\,\\epsilon(\\phi)\">Q_{\\text{in}} = m_f H_u\\,\\eta_c\\,\\epsilon(\\phi)<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot Q_{\\text{comb}} = Q_{\\text{in}}\\dfrac{dx_b}{d\\theta}\\,\\omega\">\\dot Q_{\\text{comb}} = Q_{\\text{in}}\\dfrac{dx_b}{d\\theta}\\,\\omega<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"H_u = 44.0\\ \\text{MJ/kg}\">H_u = 44.0\\ \\text{MJ/kg}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_c = 0.97\">\\eta_c = 0.97<\/span><\/span>）<\/td>\n<td>SPEC-07<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\epsilon(\\phi)\">\\epsilon(\\phi)<\/span><\/span><\/td>\n<td>リッチ側で実際に発熱する割合<\/td>\n<td>–<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\epsilon = 1 - \\dfrac{b&#x27;\\Delta h_{\\text{CO}} + d&#x27;\\Delta h_{\\text{H}_2}}{M_f H_u}\">\\epsilon = 1 - \\dfrac{b&#x27;\\Delta h_{\\text{CO}} + d&#x27;\\Delta h_{\\text{H}_2}}{M_f H_u}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi &gt; 1\">\\phi &gt; 1<\/span><\/span>），<span class=\"im\"><span class=\"tx raw\" data-tex=\"1\">1<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\phi \\le 1\">\\phi \\le 1<\/span><\/span>）<\/td>\n<td>SPEC-07<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta_{50}\">\\theta_{50}<\/span><\/span>，CA50<\/td>\n<td>質量燃焼割合 <span class=\"im\"><span class=\"tx raw\" data-tex=\"50\\%\">50\\%<\/span><\/span> の時期<\/td>\n<td>rad，°ATDC<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta_{50} = \\theta_0 + \\Delta\\theta_b\\left(\\dfrac{\\ln 2}{a}\\right)^{1/(m_w + 1)}\">\\theta_{50} = \\theta_0 + \\Delta\\theta_b\\left(\\dfrac{\\ln 2}{a}\\right)^{1/(m_w + 1)}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{CA50} = \\theta_{50} - 360^\\circ\">\\text{CA50} = \\theta_{50} - 360^\\circ<\/span><\/span><\/td>\n<td>SPEC-12<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","<h3 id=\"gloh12\">2.8 壁面熱伝達<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>記号<\/th>\n<th>名称<\/th>\n<th>単位<\/th>\n<th>定義<\/th>\n<th>仕様<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"h_c\">h_c<\/span><\/span><\/td>\n<td>熱伝達率（Woschni）<\/td>\n<td>W/(m²·K)<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"h_c = C_w \\cdot 3.26\\,B^{-0.2}\\left(\\dfrac{p}{1000}\\right)^{0.8}T^{-0.55}\\max(w, 0.5)^{0.8}\">h_c = C_w \\cdot 3.26\\,B^{-0.2}\\left(\\dfrac{p}{1000}\\right)^{0.8}T^{-0.55}\\max(w, 0.5)^{0.8}<\/span><\/span>（SPEC-01 では <span class=\"im\"><span class=\"tx raw\" data-tex=\"h_c\">h_c<\/span><\/span> は隙間の高さ）<\/td>\n<td>SPEC-08<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"w\">w<\/span><\/span><\/td>\n<td>代表ガス速度<\/td>\n<td>m/s<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"w = C_1 c_m + C_2\\dfrac{V_d T_r}{p_r V_r}\\max(0,\\ p - p_{\\text{mot}})\">w = C_1 c_m + C_2\\dfrac{V_d T_r}{p_r V_r}\\max(0,\\ p - p_{\\text{mot}})<\/span><\/span><\/td>\n<td>SPEC-08<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{mot}}\">p_{\\text{mot}}<\/span><\/span><\/td>\n<td>燃焼が無いとしたときの圧力<\/td>\n<td>Pa<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{mot}} = p_r\\left(\\dfrac{V_r}{V}\\right)^{1.33}\">p_{\\text{mot}} = p_r\\left(\\dfrac{V_r}{V}\\right)^{1.33}<\/span><\/span>（<span class=\"im\"><span class=\"tx raw\" data-tex=\"(p_r, V_r, T_r)\">(p_r, V_r, T_r)<\/span><\/span>：IVC の時点の状態）<\/td>\n<td>SPEC-08<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot Q_{\\text{wall}}\">\\dot Q_{\\text{wall}}<\/span><\/span><\/td>\n<td>壁への熱流量<\/td>\n<td>W<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot Q_{\\text{wall}} = h_c\\,A_w\\,(T - T_w)\">\\dot Q_{\\text{wall}} = h_c\\,A_w\\,(T - T_w)<\/span><\/span><\/td>\n<td>SPEC-08<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","<h3 id=\"gloh13\">2.9 回転運動，摩擦，動力計<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>記号<\/th>\n<th>名称<\/th>\n<th>単位<\/th>\n<th>定義<\/th>\n<th>仕様<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"I_{\\text{tot}}\">I_{\\text{tot}}<\/span><\/span><\/td>\n<td>全慣性モーメント<\/td>\n<td>kg·m²<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"I_{\\text{tot}} = I + I_{\\text{dyno}}\">I_{\\text{tot}} = I + I_{\\text{dyno}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"I = 0.12\">I = 0.12<\/span><\/span><\/td>\n<td>SPEC-10<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{ind}}\">T_{\\text{ind}}<\/span><\/span><\/td>\n<td>図示トルク<\/td>\n<td>N·m<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{ind}} = (p - p_{\\text{atm}})\\dfrac{dV}{d\\theta}\">T_{\\text{ind}} = (p - p_{\\text{atm}})\\dfrac{dV}{d\\theta}<\/span><\/span><\/td>\n<td>SPEC-10<\/td>\n<\/tr>\n<tr>\n<td>FMEP，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_f\">T_f<\/span><\/span><\/td>\n<td>摩擦平均有効圧，摩擦トルク<\/td>\n<td>Pa，N·m<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{FMEP} = F_0 + F_1 p_{\\max} + F_2 c_m\">\\text{FMEP} = F_0 + F_1 p_{\\max} + F_2 c_m<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_f = \\dfrac{\\text{FMEP}\\cdot V_d}{4\\pi}\">T_f = \\dfrac{\\text{FMEP}\\cdot V_d}{4\\pi}<\/span><\/span><\/td>\n<td>SPEC-10<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{aux}}\">T_{\\text{aux}}<\/span><\/span>，AMEP<\/td>\n<td>補機の負荷トルク，その平均有効圧<\/td>\n<td>N·m，Pa<\/td>\n<td>設定，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{AMEP} = \\dfrac{4\\pi T_{\\text{aux}}}{V_d}\">\\text{AMEP} = \\dfrac{4\\pi T_{\\text{aux}}}{V_d}<\/span><\/span><\/td>\n<td>SPEC-10<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{st}}\">T_{\\text{st}}<\/span><\/span><\/td>\n<td>スターターのトルク<\/td>\n<td>N·m<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{st}} = T_{\\text{stall}}\\max\\left(0,\\ 1 - \\dfrac{\\omega}{\\omega_{nl}}\\right)\">T_{\\text{st}} = T_{\\text{stall}}\\max\\left(0,\\ 1 - \\dfrac{\\omega}{\\omega_{nl}}\\right)<\/span><\/span>（完爆前）<\/td>\n<td>SPEC-10<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{dyno}}\">T_{\\text{dyno}}<\/span><\/span><\/td>\n<td>動力計の吸収トルク<\/td>\n<td>N·m<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{dyno}} = f_{\\text{eff}}\\,k_w\\,\\omega^2\">T_{\\text{dyno}} = f_{\\text{eff}}\\,k_w\\,\\omega^2<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"k_w = \\dfrac{T_{\\text{rated}}}{\\omega_{\\text{rated}}^2}\">k_w = \\dfrac{T_{\\text{rated}}}{\\omega_{\\text{rated}}^2}<\/span><\/span><\/td>\n<td>SPEC-11<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{cmd}}\">f_{\\text{cmd}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{eff}}\">f_{\\text{eff}}<\/span><\/span><\/td>\n<td>充水率の指令，実効充水率<\/td>\n<td>–<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\tau_d\\dfrac{df_{\\text{eff}}}{dt} = f_{\\text{cmd}} - f_{\\text{eff}}\">\\tau_d\\dfrac{df_{\\text{eff}}}{dt} = f_{\\text{cmd}} - f_{\\text{eff}}<\/span><\/span><\/td>\n<td>SPEC-11<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","<h3 id=\"gloh14\">2.10 制御<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>記号<\/th>\n<th>名称<\/th>\n<th>単位<\/th>\n<th>定義<\/th>\n<th>仕様<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"N\">N<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N\">\\bar N<\/span><\/span><\/td>\n<td>瞬時の回転数，平均回転数<\/td>\n<td>rpm<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"N = \\dfrac{30}{\\pi}\\omega\">N = \\dfrac{30}{\\pi}\\omega<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\tau_N\\dfrac{d\\bar N}{dt} = N - \\bar N\">\\tau_N\\dfrac{d\\bar N}{dt} = N - \\bar N<\/span><\/span><\/td>\n<td>SPEC-12<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"N_{\\text{target}}\">N_{\\text{target}}<\/span><\/span><\/td>\n<td>目標回転数<\/td>\n<td>rpm<\/td>\n<td>設定<\/td>\n<td>SPEC-12<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha_{\\text{manual}}\">\\alpha_{\\text{manual}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{manual}}\">f_{\\text{manual}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{base}}\">f_{\\text{base}}<\/span><\/span><\/td>\n<td>固定開度（動力計制御で使う），固定充水率（スロットル制御で使う），基準充水率（動力計制御の PI の基準）<\/td>\n<td>rad，–，–<\/td>\n<td>設定．使わない制御のときは設定画面で変更できない（SPEC-18 B.7）<\/td>\n<td>SPEC-11，18<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"e_N\">e_N<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"e_d\">e_d<\/span><\/span><\/td>\n<td>偏差<\/td>\n<td>rpm<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"e_N = N_{\\text{target}} - \\bar N\">e_N = N_{\\text{target}} - \\bar N<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"e_d = \\bar N - N_{\\text{target}}\">e_d = \\bar N - N_{\\text{target}}<\/span><\/span><\/td>\n<td>SPEC-11，12<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha_{\\text{ff}}\">\\alpha_{\\text{ff}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha_{\\min}\">\\alpha_{\\min}<\/span><\/span><\/td>\n<td>feedforward を加えた基準開度，開度の下限<\/td>\n<td>rad<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha_{\\text{ff}} = \\alpha_{\\text{base}} + k_T T_{\\text{aux}}\">\\alpha_{\\text{ff}} = \\alpha_{\\text{base}} + k_T T_{\\text{aux}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha_{\\min} = \\min(\\alpha_{\\max},\\ \\max(0,\\ \\alpha_{\\text{ff}} - \\delta_\\alpha))\">\\alpha_{\\min} = \\min(\\alpha_{\\max},\\ \\max(0,\\ \\alpha_{\\text{ff}} - \\delta_\\alpha))<\/span><\/span><\/td>\n<td>SPEC-12<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"I_\\alpha\">I_\\alpha<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"I_f\">I_f<\/span><\/span><\/td>\n<td>スロットル制御・動力計制御の積分の状態<\/td>\n<td>rad，–<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dfrac{dI_\\alpha}{dt} = K_i e_N\">\\dfrac{dI_\\alpha}{dt} = K_i e_N<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dfrac{dI_f}{dt} = K_{i,d}\\,e_d\">\\dfrac{dI_f}{dt} = K_{i,d}\\,e_d<\/span><\/span>（張り付きを深める向きでは <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span>）<\/td>\n<td>SPEC-11，12<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","<h3 id=\"gloh15\">2.11 数値積分<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>記号<\/th>\n<th>名称<\/th>\n<th>単位<\/th>\n<th>定義<\/th>\n<th>仕様<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta t\">\\Delta t<\/span><\/span><\/td>\n<td>積分の刻み<\/td>\n<td>s<\/td>\n<td>RK4：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta t = \\min\\left(\\dfrac{\\Delta\\theta_{\\text{step}}}{\\max(\\omega, \\omega_{\\min})},\\ \\Delta t_{\\max}\\right)\">\\Delta t = \\min\\left(\\dfrac{\\Delta\\theta_{\\text{step}}}{\\max(\\omega, \\omega_{\\min})},\\ \\Delta t_{\\max}\\right)<\/span><\/span><\/td>\n<td>SPEC-13<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"E\">E<\/span><\/span><\/td>\n<td>DOPRI5 の誤差の見積もり<\/td>\n<td>–<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"E = \\displaystyle\\max_i\\frac{\\lvert y_{5,i} - y_{4,i}\\rvert}{\\text{atol}_i + \\text{rtol}\\cdot\\max(\\lvert y_{n,i}\\rvert, \\lvert y_{5,i}\\rvert)}\">E = \\displaystyle\\max_i\\frac{\\lvert y_{5,i} - y_{4,i}\\rvert}{\\text{atol}_i + \\text{rtol}\\cdot\\max(\\lvert y_{n,i}\\rvert, \\lvert y_{5,i}\\rvert)}<\/span><\/span><\/td>\n<td>SPEC-13<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lambda\">\\lambda<\/span><\/span><\/td>\n<td>ヤコビアン <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\partial\\mathbf{f}/\\partial\\mathbf{y}\">\\partial\\mathbf{f}/\\partial\\mathbf{y}<\/span><\/span> の固有値（数値積分の節）<\/td>\n<td>1/s<\/td>\n<td>RK4 の安定の条件は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lvert\\lambda\\rvert\\,\\Delta t \\le 2.79\">\\lvert\\lambda\\rvert\\,\\Delta t \\le 2.79<\/span><\/span>（SPEC-01 では <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\lambda\">\\lambda<\/span><\/span> は連桿比）<\/td>\n<td>SPEC-13<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","<h3 id=\"gloh16\">2.12 性能の指標<\/h3>\n<p>1 サイクルの補助積分の増分 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta\">\\Delta<\/span><\/span> と，サイクルの所要時間 <span class=\"im\"><span class=\"tx raw\" data-tex=\"t_c\">t_c<\/span><\/span> から求める．<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>記号<\/th>\n<th>名称<\/th>\n<th>単位<\/th>\n<th>定義<\/th>\n<th>仕様<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"W_{i,\\text{net}}\">W_{i,\\text{net}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"W_{i,\\text{gross}}\">W_{i,\\text{gross}}<\/span><\/span><\/td>\n<td>正味の図示仕事，圧縮・膨張行程の図示仕事<\/td>\n<td>J<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"W_{i,\\text{net}} = \\Delta W = \\displaystyle\\oint p\\,dV\">W_{i,\\text{net}} = \\Delta W = \\displaystyle\\oint p\\,dV<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"W_{i,\\text{gross}} = \\Delta W_g\">W_{i,\\text{gross}} = \\Delta W_g<\/span><\/span><\/td>\n<td>SPEC-14<\/td>\n<\/tr>\n<tr>\n<td>IMEP，PMEP<\/td>\n<td>図示平均有効圧，ポンプ損失平均有効圧<\/td>\n<td>Pa<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{IMEP} = \\dfrac{W_{i,\\text{net}}}{V_d}\">\\text{IMEP} = \\dfrac{W_{i,\\text{net}}}{V_d}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{PMEP} = \\dfrac{W_{i,\\text{net}} - W_{i,\\text{gross}}}{V_d}\">\\text{PMEP} = \\dfrac{W_{i,\\text{net}} - W_{i,\\text{gross}}}{V_d}<\/span><\/span><\/td>\n<td>SPEC-14<\/td>\n<\/tr>\n<tr>\n<td>BMEP<\/td>\n<td>正味平均有効圧<\/td>\n<td>Pa<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{BMEP} = \\text{IMEP} - \\text{FMEP} - \\text{AMEP}\">\\text{BMEP} = \\text{IMEP} - \\text{FMEP} - \\text{AMEP}<\/span><\/span><\/td>\n<td>SPEC-14<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_b\">T_b<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"P_b\">P_b<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"P_i\">P_i<\/span><\/span><\/td>\n<td>軸トルク，軸出力，図示出力<\/td>\n<td>N·m，W，W<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"T_b = \\dfrac{\\text{BMEP}\\cdot V_d}{4\\pi}\">T_b = \\dfrac{\\text{BMEP}\\cdot V_d}{4\\pi}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"P_b = \\dfrac{\\text{BMEP}\\cdot V_d}{t_c}\">P_b = \\dfrac{\\text{BMEP}\\cdot V_d}{t_c}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"P_i = \\dfrac{W_{i,\\text{net}}}{t_c}\">P_i = \\dfrac{W_{i,\\text{net}}}{t_c}<\/span><\/span><\/td>\n<td>SPEC-14<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_m\">\\eta_m<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_i\">\\eta_i<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_b\">\\eta_b<\/span><\/span><\/td>\n<td>機械効率，図示熱効率，正味熱効率<\/td>\n<td>–<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_m = \\dfrac{\\text{BMEP}}{\\text{IMEP}}\">\\eta_m = \\dfrac{\\text{BMEP}}{\\text{IMEP}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_i = \\dfrac{W_{i,\\text{net}}}{m_f H_u}\">\\eta_i = \\dfrac{W_{i,\\text{net}}}{m_f H_u}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_b = \\dfrac{P_b}{\\dot m_f H_u}\">\\eta_b = \\dfrac{P_b}{\\dot m_f H_u}<\/span><\/span><\/td>\n<td>SPEC-14<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_v\">\\eta_v<\/span><\/span><\/td>\n<td>体積効率<\/td>\n<td>–<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_v = \\dfrac{m_{\\text{air}}}{\\rho_{\\text{atm}}V_d}\">\\eta_v = \\dfrac{m_{\\text{air}}}{\\rho_{\\text{atm}}V_d}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\rho_{\\text{atm}} = \\dfrac{p_{\\text{atm}}}{RT_{\\text{amb}}}\">\\rho_{\\text{atm}} = \\dfrac{p_{\\text{atm}}}{RT_{\\text{amb}}}<\/span><\/span><\/td>\n<td>SPEC-14<\/td>\n<\/tr>\n<tr>\n<td>bsfc<\/td>\n<td>正味燃料消費率<\/td>\n<td>g/kWh<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\text{bsfc} = \\dfrac{\\dot m_f}{P_b}\">\\text{bsfc} = \\dfrac{\\dot m_f}{P_b}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_f = \\dfrac{m_f}{t_c}\">\\dot m_f = \\dfrac{m_f}{t_c}<\/span><\/span><\/td>\n<td>SPEC-14<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\max}\">p_{\\max}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\max}\">T_{\\max}<\/span><\/span><\/td>\n<td>1 サイクルの最高筒内圧，最高ガス温度<\/td>\n<td>Pa，K<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\max}\">p_{\\max}<\/span><\/span> は 3 点の放物線の頂点，<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\max}\">T_{\\max}<\/span><\/span> はステップ点の最大<\/td>\n<td>SPEC-13，14<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_{\\text{Otto}}\">\\eta_{\\text{Otto}}<\/span><\/span><\/td>\n<td>理論サイクルの熱効率（上限の目安）<\/td>\n<td>–<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_{\\text{Otto}} = 1 - \\varepsilon^{1 - 1.40}\">\\eta_{\\text{Otto}} = 1 - \\varepsilon^{1 - 1.40}<\/span><\/span><\/td>\n<td>TEST-14<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","<h3 id=\"gloh17\">2.13 エンジン音<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>記号<\/th>\n<th>名称<\/th>\n<th>単位<\/th>\n<th>定義<\/th>\n<th>仕様<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"q\">q<\/span><\/span><\/td>\n<td>音源（排気弁の質量流量の時間微分）<\/td>\n<td>kg/s²<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"q = \\omega\\dfrac{d\\dot m_{\\text{ex}}}{d\\theta}\">q = \\omega\\dfrac{d\\dot m_{\\text{ex}}}{d\\theta}<\/span><\/span><\/td>\n<td>SPEC-21<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\psi\">\\psi<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_s\">f_s<\/span><\/span><\/td>\n<td>再生の位相（表の添字，<span class=\"im\"><span class=\"tx raw\" data-tex=\"[0, 1440)\">[0, 1440)<\/span><\/span>），サンプリング周波数<\/td>\n<td>–，Hz<\/td>\n<td>1 サンプルごとに <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta\\psi = \\dfrac{1440\\,\\bar N_a}{120\\,f_s}\">\\Delta\\psi = \\dfrac{1440\\,\\bar N_a}{120\\,f_s}<\/span><\/span><\/td>\n<td>SPEC-21<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"c\">c<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_n\">f_n<\/span><\/span><\/td>\n<td>排気中の音速，排気管の共鳴周波数<\/td>\n<td>m/s，Hz<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"c = \\sqrt{\\gamma_b(T_X)\\,R\\,T_X}\">c = \\sqrt{\\gamma_b(T_X)\\,R\\,T_X}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_n = \\dfrac{(2n - 1)\\,c}{4L}\">f_n = \\dfrac{(2n - 1)\\,c}{4L}<\/span><\/span><\/td>\n<td>SPEC-21<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\rho_m\">\\rho_m<\/span><\/span><\/td>\n<td>消音器の反射率<\/td>\n<td>–<\/td>\n<td>設定（既定 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.6\">0.6<\/span><\/span>）<\/td>\n<td>SPEC-21<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ell\">\\ell<\/span><\/span><\/td>\n<td>負荷の目安（演出の音）<\/td>\n<td>–<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\ell = \\text{clamp}\\left(\\dfrac{p_{\\text{in}}/p_{\\text{atm}} - 0.3}{0.6},\\ 0,\\ 1\\right)\">\\ell = \\text{clamp}\\left(\\dfrac{p_{\\text{in}}/p_{\\text{atm}} - 0.3}{0.6},\\ 0,\\ 1\\right)<\/span><\/span><\/td>\n<td>SPEC-21<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"q_{\\text{ref}}\">q_{\\text{ref}}<\/span><\/span><\/td>\n<td>演出の音の音量の基準<\/td>\n<td>kg/s²<\/td>\n<td>全開・<span class=\"im\"><span class=\"tx raw\" data-tex=\"3500\\ \\text{rpm}\">3500\\ \\text{rpm}<\/span><\/span> の単気筒の音源の実効値 <span class=\"im\"><span class=\"tx raw\" data-tex=\"14.59\">14.59<\/span><\/span><\/td>\n<td>SPEC-21<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n","<h2 id=\"gloh18\">3. 用語<\/h2>\n","<h3 id=\"gloh19\">3.1 機関<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>用語<\/th>\n<th>定義<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>単気筒4ストローク SI 機関<\/td>\n<td>1 つの気筒で，吸気・圧縮・膨張・排気の 4 行程（クランク 2 回転，<span class=\"im\"><span class=\"tx raw\" data-tex=\"4\\pi\\ \\text{rad}\">4\\pi\\ \\text{rad}<\/span><\/span>）を 1 サイクルとする火花点火（spark ignition）機関<\/td>\n<\/tr>\n<tr>\n<td>上死点，下死点<\/td>\n<td>ピストンが最もヘッドに近い位置（<span class=\"im\"><span class=\"tx raw\" data-tex=\"V = V_c\">V = V_c<\/span><\/span>），最も遠い位置（<span class=\"im\"><span class=\"tx raw\" data-tex=\"V = V_c + V_d\">V = V_c + V_d<\/span><\/span>）．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta = 0\">\\theta = 0<\/span><\/span> が吸気上死点，<span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\pi\">2\\pi<\/span><\/span> が圧縮上死点<\/td>\n<\/tr>\n<tr>\n<td>行程<\/td>\n<td>吸気 <span class=\"im\"><span class=\"tx raw\" data-tex=\"0 \\le \\theta &lt; \\pi\">0 \\le \\theta &lt; \\pi<\/span><\/span>，圧縮 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\pi \\le \\theta &lt; 2\\pi\">\\pi \\le \\theta &lt; 2\\pi<\/span><\/span>，膨張 <span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\pi \\le \\theta &lt; 3\\pi\">2\\pi \\le \\theta &lt; 3\\pi<\/span><\/span>，排気 <span class=\"im\"><span class=\"tx raw\" data-tex=\"3\\pi \\le \\theta &lt; 4\\pi\">3\\pi \\le \\theta &lt; 4\\pi<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>未燃ガス，既燃ガス<\/td>\n<td>未燃ガスは新気（空気と燃料蒸気の予混合気），既燃ガスは燃焼の生成物．筒内ガスは両者の混合で，未燃分率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"Y_u = m_u/m\">Y_u = m_u/m<\/span><\/span> で表す<\/td>\n<\/tr>\n<tr>\n<td>化学平衡，解離<\/td>\n<td>高温の既燃ガスで，CO<span class=\"im\"><span class=\"tx raw\" data-tex=\"_2\">_2<\/span><\/span> ⇌ CO + ½O<span class=\"im\"><span class=\"tx raw\" data-tex=\"_2\">_2<\/span><\/span> などの反応がつり合った組成．完全燃焼の生成物の一部が CO，H<span class=\"im\"><span class=\"tx raw\" data-tex=\"_2\">_2<\/span><\/span>，O<span class=\"im\"><span class=\"tx raw\" data-tex=\"_2\">_2<\/span><\/span>，OH などに分かれている（解離）ので，その分の発熱が出ない．第26版で 10 種の平衡として扱う（SPEC-29．未実装）<\/td>\n<\/tr>\n<tr>\n<td>凍結<\/td>\n<td>膨張で温度が下がると反応が遅くなり，組成が平衡に追いつかずに止まること．<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{fr}\">T_{fr}<\/span><\/span> 以下で組成を固定して表す（SPEC-29）<\/td>\n<\/tr>\n<tr>\n<td>ポート噴射，直噴<\/td>\n<td>燃料を吸気管で気化させて予混合気として吸う方式と，筒内へ液体のまま噴く方式．直噴では気化潜熱が筒内のガスを冷やす（SPEC-30．未実装）<\/td>\n<\/tr>\n<tr>\n<td>燃料空気サイクル<\/td>\n<td>作動流体を実際の燃料と空気，既燃ガスの物性で扱う理想サイクル（熱損失なし，瞬時の燃焼）．<code>tools/richburn<\/code> の試算に使った<\/td>\n<\/tr>\n<tr>\n<td>残留ガス，内部 EGR<\/td>\n<td>前のサイクルから筒内に残る既燃ガス．バルブオーバーラップ中に吸気側へ吹き返して次の吸気で戻る分を含む．その割合が残留ガス率 <span class=\"im\"><span class=\"tx raw\" data-tex=\"x_r\">x_r<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>バルブオーバーラップ<\/td>\n<td>排気弁と吸気弁が同時に開いている期間．角度は <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta_{\\text{OL}} = \\text{EVC} - (\\text{IVO} + 720^\\circ)\">\\theta_{\\text{OL}} = \\text{EVC} - (\\text{IVO} + 720^\\circ)<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>吹き返し<\/td>\n<td>吸気弁を筒内から吸気側へ流れる逆流（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dot m_{\\text{in}} &lt; 0\">\\dot m_{\\text{in}} &lt; 0<\/span><\/span>）<\/td>\n<\/tr>\n<tr>\n<td>吹き抜け<\/td>\n<td>新気が燃えずに排気側へ出ること．本モデルでは排気側へ出た新気は既燃ガスとして扱う<\/td>\n<\/tr>\n<tr>\n<td>完爆<\/td>\n<td>始動中に，燃料 ON で <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N &gt; 550\\ \\text{rpm}\">\\bar N &gt; 550\\ \\text{rpm}<\/span><\/span> かつ直前のサイクルの <span class=\"im\"><span class=\"tx raw\" data-tex=\"W_g &gt; 20\\ \\text{J}\">W_g &gt; 20\\ \\text{J}<\/span><\/span> になったこと．スターターを切る<\/td>\n<\/tr>\n<tr>\n<td>エンスト<\/td>\n<td>完爆後に <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N &lt; 150\\ \\text{rpm}\">\\bar N &lt; 150\\ \\text{rpm}<\/span><\/span> になったこと．完爆の状態と燃料を OFF にする<\/td>\n<\/tr>\n<tr>\n<td>MBT<\/td>\n<td>図示仕事が最大になる点火時期（minimum advance for best torque）．本モデルでは CA50 が上死点後 <span class=\"im\"><span class=\"tx raw\" data-tex=\"10^\\circ\">10^\\circ<\/span><\/span> になる点火時期で近似する<\/td>\n<\/tr>\n<tr>\n<td>CA50<\/td>\n<td>質量燃焼割合が <span class=\"im\"><span class=\"tx raw\" data-tex=\"50\\%\">50\\%<\/span><\/span> になるクランク角（圧縮上死点後の角度）<\/td>\n<\/tr>\n<tr>\n<td>火炎発達角<\/td>\n<td>点火から <span class=\"im\"><span class=\"tx raw\" data-tex=\"x_b = 0.1\">x_b = 0.1<\/span><\/span> までのクランク角<\/td>\n<\/tr>\n<tr>\n<td>慣性過給<\/td>\n<td>吸気ランナのガス柱の慣性で，吸気弁が閉じる直前のポート圧が上がり，充填が増えること<\/td>\n<\/tr>\n<tr>\n<td>背圧<\/td>\n<td>排気弁の下流（消音器）の圧力と大気圧の差<\/td>\n<\/tr>\n<tr>\n<td>チョーク<\/td>\n<td>オリフィスののど部の流速が音速に達し，流量が下流の圧力によらなくなること（<span class=\"im\"><span class=\"tx raw\" data-tex=\"r_p \\le r_{\\text{crit}}\">r_p \\le r_{\\text{crit}}<\/span><\/span>）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","<h3 id=\"gloh20\">3.2 モデルと数値計算<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>用語<\/th>\n<th>定義<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0 次元・単一ゾーン<\/td>\n<td>筒内ガスを空間的に一様（1 つの温度，1 つの圧力）とみなすモデル<\/td>\n<\/tr>\n<tr>\n<td>開いた系の第一法則<\/td>\n<td>質量の出入りを含むエネルギー保存．<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dfrac{dE}{dt} = -p\\dfrac{dV}{dt} - \\dot Q_{\\text{wall}} + \\sum_j\\dot m_j\\,(h_j + Y_j q_u)\">\\dfrac{dE}{dt} = -p\\dfrac{dV}{dt} - \\dot Q_{\\text{wall}} + \\sum_j\\dot m_j\\,(h_j + Y_j q_u)<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>顕熱の内部エネルギー<\/td>\n<td>基準温度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_0\">T_0<\/span><\/span> からの比熱の積分 <span class=\"im\"><span class=\"tx raw\" data-tex=\"e_k(T) = \\int_{T_0}^{T}c_{v,k}\\,dT&#x27;\">e_k(T) = \\int_{T_0}^{T}c_{v,k}\\,dT&#x27;<\/span><\/span>．発熱（化学エネルギー）を含まない<\/td>\n<\/tr>\n<tr>\n<td>余剰エンタルピー<\/td>\n<td>吸気側の容積にあるガスが，同じ組成のガスが <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{in}}\">T_{\\text{in}}<\/span><\/span> で持つ顕熱エンタルピーより余分に持つ熱．吹き返した高温ガスが持ち込み，流れに乗って運ばれる（<span class=\"im\"><span class=\"tx raw\" data-tex=\"E_{\\text{in}}\">E_{\\text{in}}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"E_p\">E_p<\/span><\/span>）<\/td>\n<\/tr>\n<tr>\n<td>第一法則の残差<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Delta U_s + \\Delta W + \\Delta Q_w - \\Delta Q_c - \\Delta H_i + \\Delta H_o\">\\Delta U_s + \\Delta W + \\Delta Q_w - \\Delta Q_c - \\Delta H_i + \\Delta H_o<\/span><\/span>．数値積分が正しければ <span class=\"im\"><span class=\"tx raw\" data-tex=\"0\">0<\/span><\/span> になる<\/td>\n<\/tr>\n<tr>\n<td>周期定常<\/td>\n<td>サイクルごとの状態が同じ値を繰り返す運転状態<\/td>\n<\/tr>\n<tr>\n<td>補助積分<\/td>\n<td>状態と同じ Runge–Kutta の重みで同時に積分する，集計と検査のための量（2.3 節）．右辺には現れない<\/td>\n<\/tr>\n<tr>\n<td>イベント<\/td>\n<td>右辺が折れるか，状態の記録や切替が起きるクランク角：サイクルの終端，弁の開閉（IVO，IVC，EVO，EVC），点火．積分のステップはちょうどその角度で終わる<\/td>\n<\/tr>\n<tr>\n<td>射影<\/td>\n<td>ステップの後で，丸めによる非物理的な値（負の質量など）を防ぐために下限・上限を適用する処理．通常の運転では一度も働かないことを要件とする<\/td>\n<\/tr>\n<tr>\n<td>強制受理<\/td>\n<td>DOPRI5 で，刻みを縮めても誤差が許容を超えたままのステップを受け入れること．通常の運転では起きないことを要件とする<\/td>\n<\/tr>\n<tr>\n<td>硬さ<\/td>\n<td>ヤコビアンの固有値の絶対値の最大 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\max\\lvert\\lambda\\rvert\">\\max\\lvert\\lambda\\rvert<\/span><\/span>．陽的解法の刻みの上限を決める<\/td>\n<\/tr>\n<tr>\n<td>正則化<\/td>\n<td>流量関数 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\Psi\">\\Psi<\/span><\/span> の傾きが <span class=\"im\"><span class=\"tx raw\" data-tex=\"r_p \\to 1\">r_p \\to 1<\/span><\/span> で無限大になるのを避けるため，<span class=\"im\"><span class=\"tx raw\" data-tex=\"1 - r_p &lt; \\delta_r\">1 - r_p &lt; \\delta_r<\/span><\/span> で直線に置き換えること<\/td>\n<\/tr>\n<tr>\n<td>参照解<\/td>\n<td>既定より細かい刻み（RK4，<span class=\"im\"><span class=\"tx raw\" data-tex=\"0.05^\\circ\">0.05^\\circ<\/span><\/span> または <span class=\"im\"><span class=\"tx raw\" data-tex=\"0.02^\\circ\">0.02^\\circ<\/span><\/span>）で積分した解．既定の刻みの精度の判定に使う<\/td>\n<\/tr>\n<tr>\n<td>コールドリセット<\/td>\n<td>状態を初期値（<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\theta = \\pi\">\\theta = \\pi<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\omega = 0\">\\omega = 0<\/span><\/span>，全ての圧力が <span class=\"im\"><span class=\"tx raw\" data-tex=\"p_{\\text{atm}}\">p_{\\text{atm}}<\/span><\/span>，筒内 <span class=\"im\"><span class=\"tx raw\" data-tex=\"320\\ \\text{K}\">320\\ \\text{K}<\/span><\/span>，壁温 <span class=\"im\"><span class=\"tx raw\" data-tex=\"298.15\\ \\text{K}\">298.15\\ \\text{K}<\/span><\/span>）に戻すこと<\/td>\n<\/tr>\n<tr>\n<td>冷間始動<\/td>\n<td>コールドリセットからの始動．「冷間」は壁温の初期値だけを指す（冷却水温は一定）<\/td>\n<\/tr>\n<tr>\n<td>サイクル変動<\/td>\n<td>点火のたびに，燃焼の開始角と燃焼期間を擬似乱数でばらつかせること<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","<h3 id=\"gloh21\">3.3 制御と動力計<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>用語<\/th>\n<th>定義<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>スロットル制御（モード A）<\/td>\n<td>ECU がスロットル開度 <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha\">\\alpha<\/span><\/span> を PI 制御して <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N\">\\bar N<\/span><\/span> を <span class=\"im\"><span class=\"tx raw\" data-tex=\"N_{\\text{target}}\">N_{\\text{target}}<\/span><\/span> に合わせる方式．動力計の充水率は一定<\/td>\n<\/tr>\n<tr>\n<td>動力計制御（モード B）<\/td>\n<td>スロットル開度を一定にし，動力計の充水率を PI 制御して <span class=\"im\"><span class=\"tx raw\" data-tex=\"\\bar N\">\\bar N<\/span><\/span> を <span class=\"im\"><span class=\"tx raw\" data-tex=\"N_{\\text{target}}\">N_{\\text{target}}<\/span><\/span> に保つ方式<\/td>\n<\/tr>\n<tr>\n<td>水ブレーキ式動力計<\/td>\n<td>回転数の 2 乗と充水率に比例するトルク <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{dyno}} = f_{\\text{eff}}k_w\\omega^2\">T_{\\text{dyno}} = f_{\\text{eff}}k_w\\omega^2<\/span><\/span> を吸収する負荷装置（吸収専用）<\/td>\n<\/tr>\n<tr>\n<td>feedforward<\/td>\n<td>補機の負荷 <span class=\"im\"><span class=\"tx raw\" data-tex=\"T_{\\text{aux}}\">T_{\\text{aux}}<\/span><\/span> に応じて基準の開度を上げること：<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\alpha_{\\text{ff}} = \\alpha_{\\text{base}} + k_T T_{\\text{aux}}\">\\alpha_{\\text{ff}} = \\alpha_{\\text{base}} + k_T T_{\\text{aux}}<\/span><\/span><\/td>\n<\/tr>\n<tr>\n<td>アンチワインドアップ<\/td>\n<td>操作量が上下限に張り付いていて，偏差がそれを深める向きのとき，積分を止めること<\/td>\n<\/tr>\n<tr>\n<td>張り付き<\/td>\n<td>操作量が上限または下限にあること（画面の <code>全開<\/code>，<code>全閉<\/code>，<code>下限<\/code>，<code>上限<\/code>）<\/td>\n<\/tr>\n<tr>\n<td><code>OVERLOAD<\/code>，<code>UNDERPOWER<\/code><\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{cmd}} = 1\">f_{\\text{cmd}} = 1<\/span><\/span> のまま回転が目標より <span class=\"im\"><span class=\"tx raw\" data-tex=\"100\\ \\text{rpm}\">100\\ \\text{rpm}<\/span><\/span> 以上高い状態，<span class=\"im\"><span class=\"tx raw\" data-tex=\"f_{\\text{cmd}} = 0\">f_{\\text{cmd}} = 0<\/span><\/span> のまま <span class=\"im\"><span class=\"tx raw\" data-tex=\"100\\ \\text{rpm}\">100\\ \\text{rpm}<\/span><\/span> 以上低い状態が <span class=\"im\"><span class=\"tx raw\" data-tex=\"2\\ \\text{s}\">2\\ \\text{s}<\/span><\/span> 続いたときの表示<\/td>\n<\/tr>\n<tr>\n<td>回転数の固定<\/td>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"\\dfrac{d\\omega}{dt} = 0\">\\dfrac{d\\omega}{dt} = 0<\/span><\/span> とするモード．性能曲線の計測と一部のテストで使う<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n","<h3 id=\"gloh22\">3.4 画面と検証<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>用語<\/th>\n<th>定義<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>即時項目，要リセット項目<\/td>\n<td>押した時点で反映される設定と，「適用」で確定してコールドリセットを伴う設定（<span class=\"im\"><span class=\"tx raw\" data-tex=\"B\">B<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"S\">S<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"l\">l<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\varepsilon\">\\varepsilon<\/span><\/span>）<\/td>\n<\/tr>\n<tr>\n<td>項目定義表<\/td>\n<td>設定項目の唯一の定義（キー，表示名，単位，単位係数，範囲，刻み，既定値）．表示値 × 単位係数 = 内部値<\/td>\n<\/tr>\n<tr>\n<td>MathJax，TeX の表示<\/td>\n<td>解説タブの数式の表示．数式は TeX のソースで持ち，ネットワークがあれば MathJax 3.2.2（Apache License 2.0，<code>tex-svg<\/code>）を cdnjs から読み込んで SVG に組む．読み込めなければ TeX のソースを等幅で示す（TeX の表示）．フォントは埋め込まない（C-1，C-8，SPEC-16 3）<\/td>\n<\/tr>\n<tr>\n<td>基準サイクル<\/td>\n<td>設定を変える直前に完了していた 1 サイクルの波形．現在のサイクルと重ねて描く<\/td>\n<\/tr>\n<tr>\n<td>段階型，帯域型（レンジ）<\/td>\n<td>グラフの表示範囲の決め方．段階型はフルスケール <span class=\"im\"><span class=\"tx raw\" data-tex=\"F \\in \\{1, 2, 5\\} \\times 10^k\">F \\in \\{1, 2, 5\\} \\times 10^k<\/span><\/span> をデータの最大に応じて切り替える．帯域型はデータの最小・最大のまわりの範囲を取る<\/td>\n<\/tr>\n<tr>\n<td>計測（性能曲線）<\/td>\n<td>回転数を固定して，回転数ごとの定常の特性（<span class=\"im\"><span class=\"tx raw\" data-tex=\"T_b\">T_b<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"P_b\">P_b<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"\\eta_v\">\\eta_v<\/span><\/span> など）を求めること<\/td>\n<\/tr>\n<tr>\n<td>整定<\/td>\n<td>計測の各点で，直近 3 サイクルの各量の幅が判定値以下になること<\/td>\n<\/tr>\n<tr>\n<td><span class=\"im\"><span class=\"tx raw\" data-tex=\"n_{\\min}\">n_{\\min}<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"n_{\\max}\">n_{\\max}<\/span><\/span>（計測のサイクル数の最少・最多）<\/td>\n<td>計測の各点で，判定を始めるまでに完了させる完爆後のサイクル数と，判定を満たさなくても打ち切るサイクル数．条件の画面で指定する（<span class=\"im\"><span class=\"tx raw\" data-tex=\"3 \\le n_{\\min} \\le 30\">3 \\le n_{\\min} \\le 30<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"10 \\le n_{\\max} \\le 200\">10 \\le n_{\\max} \\le 200<\/span><\/span>，<span class=\"im\"><span class=\"tx raw\" data-tex=\"n_{\\min} \\le n_{\\max}\">n_{\\min} \\le n_{\\max}<\/span><\/span>．SPEC-26 A.6）<\/td>\n<\/tr>\n<tr>\n<td>シナリオ<\/td>\n<td>テストで <code>EngineCore<\/code> を走らせる決まった運転の手順（S1，S2，…）<\/td>\n<\/tr>\n<tr>\n<td>実行区分<\/td>\n<td>テスト項目の種類：[A] 解析，[S] シナリオ，[U] 画面，[D] 開発時（ヘッドレスブラウザ），[M] 実機目視<\/td>\n<\/tr>\n<tr>\n<td>計算の音，演出の音<\/td>\n<td>計算の音は排気流量から物理的な式で作る音．演出の音は聞いて心地よいように作った 4 気筒風の音で，物理モデルではない<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n","<h2 id=\"gloh23\">4. 略語<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>略語<\/th>\n<th>意味<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>SI<\/td>\n<td>spark ignition（火花点火）．単位系の SI は文脈で区別する<\/td>\n<\/tr>\n<tr>\n<td>ECU<\/td>\n<td>engine control unit<\/td>\n<\/tr>\n<tr>\n<td>VVT<\/td>\n<td>variable valve timing（カムの位相を変える機構）<\/td>\n<\/tr>\n<tr>\n<td>EGR<\/td>\n<td>exhaust gas recirculation（ここでは内部 EGR だけを扱う）<\/td>\n<\/tr>\n<tr>\n<td>MBT<\/td>\n<td>minimum advance for best torque<\/td>\n<\/tr>\n<tr>\n<td>IVO，IVC，EVO，EVC<\/td>\n<td>intake valve opening／closing，exhaust valve opening／closing<\/td>\n<\/tr>\n<tr>\n<td>BTDC，ATDC<\/td>\n<td>before／after top dead center（圧縮上死点の前／後）<\/td>\n<\/tr>\n<tr>\n<td>IMEP，PMEP，FMEP，AMEP，BMEP<\/td>\n<td>indicated／pumping／friction／accessory／brake mean effective pressure<\/td>\n<\/tr>\n<tr>\n<td>bsfc<\/td>\n<td>brake specific fuel consumption<\/td>\n<\/tr>\n<tr>\n<td>RK4，DOPRI5<\/td>\n<td>4 次の古典的 Runge–Kutta 法，Dormand–Prince の 5(4) 次の埋め込み型 Runge–Kutta 法<\/td>\n<\/tr>\n<tr>\n<td>PI<\/td>\n<td>比例（proportional）と積分（integral）による制御<\/td>\n<\/tr>\n<tr>\n<td>WOT<\/td>\n<td>wide open throttle（全開）<\/td>\n<\/tr>\n<tr>\n<td>CA<\/td>\n<td>crank angle（クランク角）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n"],"toc":[[2,"gloh2","1. 表記の規則"],[2,"gloh3","2. 記号"],[3,"gloh4","2.1 独立変数とクランク角"],[3,"gloh5","2.2 状態ベクトル"],[3,"gloh6","2.3 補助積分"],[3,"gloh7","2.4 幾何（スライダ・クランク機構と弁）"],[3,"gloh8","2.5 熱力学と物性"],[3,"gloh9","2.5a 化学種の熱物性と噴射（第26版，未実装．SPEC-29，SPEC-30）"],[3,"gloh10","2.6 流れと吸排気系"],[3,"gloh11","2.7 燃焼"],[3,"gloh12","2.8 壁面熱伝達"],[3,"gloh13","2.9 回転運動，摩擦，動力計"],[3,"gloh14","2.10 制御"],[3,"gloh15","2.11 数値積分"],[3,"gloh16","2.12 性能の指標"],[3,"gloh17","2.13 エンジン音"],[2,"gloh18","3. 用語"],[3,"gloh19","3.1 機関"],[3,"gloh20","3.2 モデルと数値計算"],[3,"gloh21","3.3 制御と動力計"],[3,"gloh22","3.4 画面と検証"],[2,"gloh23","4. 略語"]],"nmath":589,"nchar":85591}}</script>

${H3(1,'状態方程式系','13')}<p>16 の状態量を時間積分する．スロットル開度 α などの入力は ECU と動力計が決め，積分の 1 ステップの間は一定とする（§14）．</p>${M('{d y|d t} = f(y; α)')}${M('y = (θ, ω, p, m, m_u, T_w, p_in, m_bi, ṁ_r, p_p, m_bp, ṁ_e, p_pe, p_m, E_in, E_p)')}<p><b>解いている連立常微分方程式（全 16 式）</b>．右の § は各式の導出と記号の詳細を述べる章．ṁ_in，ṁ_ex は弁の流量（§5），ṁ_th はスロットルの流量（§6），H_in，H_ex は弁の流れが運ぶエネルギーの項（§10），Y_r，Y_v，ε_R は流れの上流側の値（§6），X_o は吸気弁の逆流が持ち込む熱（§6）．弁の流れは順流の場合の式を示す．ランナ OFF では ṁ_r = ṁ_in，p_p = p_in，Y_bp = Y_bi，ε_p = ε_in とし，ṁ_r，p_p，m_bp，E_p の式の右辺は 0 になる．排気系 OFF では ṁ_e，p_pe，p_m の式の右辺は 0 になる．</p><div class="eqs" data-st="θ">${M('{d θ|d t} = ω')}<span class="sref">§11</span></div><div class="eqs" data-st="ω">${M('{d ω|d t} = {T_i + T_s − T_f − T_aux − T_d|I_t}')}<span class="sref">§11</span></div><div class="eqs" data-st="p">${M('{d p|d t} = −γ {p|V}{d V|d t} + {γ − 1|V}(Q_c + m_0 {d x_b|d t}(e_u − e_b) − Q_w + H_in − H_ex)')}<span class="sref">§10</span></div><div class="eqs" data-st="m">${M('{d m|d t} = ṁ_in − ṁ_ex')}<span class="sref">§7</span></div><div class="eqs" data-st="m_u">${M('{d m_u|d t} = (1 − Y_v) ṁ_in − Y_u ṁ_ex − m_0 {d x_b|d t}')}<span class="sref">§7</span></div><div class="eqs" data-st="T_w">${M('{d T_w|d t} = {Q_w − G_h (T_w − T_c)|C_h}')}<span class="sref">§9</span></div><div class="eqs" data-st="p_in">${M('{d p_in|d t} = {R T_in|V_in}(ṁ_th − ṁ_r)')}<span class="sref">§6</span></div><div class="eqs" data-st="m_bi">${M('{d m_bi|d t} = −ṁ_r Y_r + min(0, ṁ_th) Y_bi')}<span class="sref">§6</span></div><div class="eqs" data-st="ṁ_r">${M('{d ṁ_r|d t} = {A_r|L_r}(p_in − p_p) − {ζ ṁ_r |ṁ_r||2 ρ_r A_r L_r}')}<span class="sref">§6</span></div><div class="eqs" data-st="p_p">${M('{d p_p|d t} = {γ_p R T_in|V_p}(ṁ_r − ṁ_in)')}<span class="sref">§6</span></div><div class="eqs" data-st="m_bp">${M('{d m_bp|d t} = ṁ_r Y_r − ṁ_in Y_v')}<span class="sref">§6</span></div><div class="eqs" data-st="ṁ_e">${M('{d ṁ_e|d t} = {A_e|L_e}(p_pe − p_m) − {ζ_x ṁ_e |ṁ_e||2 ρ_e A_e L_e}')}<span class="sref">§17</span></div><div class="eqs" data-st="p_pe">${M('{d p_pe|d t} = {γ_p R T_X|V_pe}(ṁ_ex − ṁ_e)')}<span class="sref">§17</span></div><div class="eqs" data-st="p_m">${M('{d p_m|d t} = {R T_X|V_m}(ṁ_e − ṁ_t)')}<span class="sref">§17</span></div><div class="eqs" data-st="E_in">${M('{d E_in|d t} = −ṁ_r ε_R + min(0, ṁ_th) ε_in')}<span class="sref">§6</span></div><div class="eqs" data-st="E_p">${M('{d E_p|d t} = ṁ_r ε_R − max(0, ṁ_in) ε_p + X_o')}<span class="sref">§6</span></div>
${H3(2,'クランク運動学','01')}<p>スライダ・クランク機構の幾何から筒内容積を与える．</p>${M('V = V_c + A_p x')}${M('x = r(1 − cos θ + {1|λ}(1 − [1 − λ^2 sin^2 θ]))')}${M('{d V|d θ} = A_p r sin θ (1 + {λ cos θ|[1 − λ^2 sin^2 θ]})')}${M('V_c = {V_d|ε − 1},  h_c = {V_c|A_p}')}<p>仮定：剛体機構，ピストンピンのオフセットなし．</p>${src('hw')}
${H3(3,'作動流体の熱物性','02')}<p>筒内ガスは一様な理想気体とする．気体定数は未燃ガスと既燃ガスで共通の R とする．</p>${M('p V = m R T')}<p>比熱は，未燃ガス（新気の混合気）と既燃ガスで分ける．比熱比は，量論比の化学平衡計算への線形の当てはめ（Klein と Eriksson）で，有効範囲の上限（未燃 T_cu = ${dc('tu')} K，既燃 T_cb = ${dc('tb')} K）より上では一定とする．設定「燃焼」の比熱が「γ(T)」のとき（既定），</p><div class="opt" data-opt="gam" data-val="0">${M(`γ_u = ${THM.au} − ${(THM.bu*1e5).toFixed(1)} × 10^{−5}(min(T, T_cu) − 300)`)}${M(`γ_b = ${THM.ab} − ${(THM.bb*1e5).toFixed(1)} × 10^{−5}(min(T, T_cb) − 300)`)}</div><p>定積比熱は R/(γ − 1) で，未燃分率 Y_u（§7）で<b>比熱を</b>補間する（γ を補間するのではない）．</p>${M('c_v = Y_u {R|γ_u − 1} + (1 − Y_u){R|γ_b − 1},  γ = 1 + {R|c_v},  c_p = c_v + R')}<p>顕熱の内部エネルギーは，基準温度 T_ref = ${dc('t0')} K からの比熱の積分で定義する．γ_u − 1 は T の一次式（傾き −b_u，b_u = ${dc('bu')}×10⁻⁵ /K）なので，積分は対数になる．既燃ガスも同じ形である（b_b = ${dc('bb')}×10⁻⁵ /K）．</p><div class="opt" data-opt="gam" data-val="0">${M('{d e_u|d T} = {R|γ_u − 1},  {d e_b|d T} = {R|γ_b − 1}')}${M('e_u = {R|b_u} ln {γ_u(T_ref) − 1|γ_u(T) − 1},  T ≤ T_cu')}${M('e_b = {R|b_b} ln {γ_b(T_ref) − 1|γ_b(T) − 1},  T ≤ T_cb')}</div><p>上限より上では比熱が一定なので，e_u，e_b は T の一次式で延ばす．顕熱エンタルピーは次式で，筒内圧の式（§10）と吸気側の熱の式（§6）に使う．</p>${M('h_u = e_u + R T,  h_b = e_b + R T')}<p>比熱を「γ一定」にすると，次の定比熱比モデルになる（比較用）．</p><div class="opt" data-opt="gam" data-val="1">${M(`γ_u = γ_b = ${K.g0},  e_u = e_b = {R|γ − 1}(T − T_ref)`)}</div><p>γ の一定値は ${dc('g0')}．当量比と圧力による γ の変化は扱わない．既燃ガスの当てはめは，平衡組成の γ を 1% 弱の誤差で表す．</p>${src('ke','hw')}
${H3(4,'弁リフト・有効開口面積・VVT','03')}<p>カム位相オフセット φ_c は開閉時期を同量ずらす（作用角は不変）．正規化したカム位相 ξ に対し，リフトを次の 3 種から選ぶ（設定「VVT・カム」）．</p>${M('ξ = {θ − θ_o − φ_c|θ_c − θ_o}')}<div class="opt" data-opt="cam" data-val="0"><p>Std（開閉点で速度が連続）</p>${M('L_v = L_max sin^2(π ξ)')}</div><div class="opt" data-opt="cam" data-val="1"><p>Poly（開閉点で速度が連続）</p>${M('L_v = 16 L_max ξ^2 (1 − ξ)^2')}</div><div class="opt" data-opt="cam" data-val="2"><p>Aggr（開閉点で速度が無限大）</p>${M('L_v = L_max (sin(π ξ))^{0.6}')}</div>${M('A_eff = C_d min(π d_v L_v, {π|4} d_v^2)')}<p>流量係数は ${dc('cdv')}．弁径は，吸気が設定値と 0.45B の小さい方，排気がその 0.9375 倍．弁とピストンが干渉しない条件は次式で，破ると VALVE HIT を表示する．</p>${M('L_v < h_c + x')}${src('hw')}
${H3(5,'オリフィス流量','04')}<p>弁，スロットル，排気の出口の流量を，等エントロピー流れの式で与える．よどみ圧 p_0 は p_1 と p_2 の大きい方で，よどみ温度 T_0 と比熱比 γ は上流側（圧力の高い側）のガスの値を使う．</p>${M('ṁ = sgn(p_1 − p_2) {A p_0|[R T_0]} Ψ')}${M('Ψ = [{2γ|γ − 1}(r^{2|γ} − r^{γ + 1|γ})]')}${M('r_c = ({2|γ + 1})^{γ|γ − 1}')}<p>この節の r は下流圧／上流圧．r が臨界圧力比 r_c 以下ではチョークし，Ψ は r = r_c の値で一定になる．r が 1 に近づくと Ψ の傾きが無限大になるので，1 − r が δ_r = 10⁻³ より小さい範囲では，原点を通る直線に置き換える（値は連続，傾きは不連続）．</p>${M('Ψ(r) = {1 − r|δ_r} Ψ(1 − δ_r),  r > 1 − δ_r')}${src('hw')}
${H3(6,'スロットルと吸気マニホールド','05')}<p>スロットル上流は大気圧．マニホールドは，圧力の式では等温・一様の容積とする．吸気は当量比 φ の予混合気（空気と燃料蒸気の混合気）とする．</p>${M('A_th = C_t {π|4} D_t^2 (1 − cos α)')}${M('{d p_in|d t} = {R T_in|V_in}(ṁ_th − ṁ_in)')}<p>流量係数は ${dc('cdt')}．ṁ_th は p_a から p_in への §5 の流量．漏れの無い理想スロットルとし，開度 α = 0 で流量は 0 になる（α = 90° は板が流れと平行な全開）．</p><p><b>既燃ガスの追跡（内部 EGR）</b>：オーバーラップ中に吸気側へ吹き返した既燃ガスは，マニホールドにたまり，次の吸気行程で筒内へ戻る．マニホールド内の既燃ガス質量 m_bi を追跡する．スロットルからは新気だけが入る．吸気弁の流れに乗る既燃ガス分率 Y_v は，流れの上流側の組成で決まる（ランナ OFF の場合を示す）．</p>${M('{d m_bi|d t} = −ṁ_in Y_v + min(0, ṁ_th) Y_bi')}${M('Y_v = Y_bi  (ṁ_in ≥ 0),  Y_v = 1 − Y_u  (ṁ_in < 0)')}${M('Y_bi = {m_bi|m_in},  m_in = {p_in V_in|R T_in}')}<p><b>熱の追跡（余剰エンタルピー）</b>：筒内から吹き返した高温のガスが吸気側へ持ち込む熱も，既燃ガスと同じく「流れに乗って運ばれる量」として追跡する．吸気弁の逆流が持ち込む流束 X_o は，筒内ガスの顕熱エンタルピーと，同じ組成のガスが T_in で持つ顕熱エンタルピーの差である．</p>${M('X_o = max(0, −ṁ_in)(Y_u (h_u(T) − h_u(T_in)) + (1 − Y_u)(h_b(T) − h_b(T_in)))')}<p>マニホールドとポートにたまった余剰 E_in，E_p を，単位質量あたりの値 ε_in，ε_p として流れが運ぶ（ランナ ON の場合を示す．ランナの流れに乗る ε_R は，ṁ_r ≥ 0 なら ε_in，ṁ_r &lt; 0 なら ε_p）．</p>${M('{d E_in|d t} = −ṁ_r ε_R + min(0, ṁ_th) ε_in')}${M('{d E_p|d t} = ṁ_r ε_R − max(0, ṁ_in) ε_p + X_o')}${M('ε_in = {E_in|m_in},  ε_p = {E_p|m_p}')}<p>吸気弁の順流は，弁のすぐ上流の容積の余剰 ε_s（ランナ ON では ε_p，OFF では ε_in）を乗せて筒内へ入る．その顕熱エンタルピー h_s は筒内圧の式（§10）に，上流温度 T_up は弁の流量の式（§5）に使う．</p>${M('h_s = (1 − Y_v) h_u(T_in) + Y_v h_b(T_in) + ε_s')}${M('T_up = T_in + {ε_s|c_ps}')}<p>吸気側の壁との熱のやりとりは無い（断熱）とする．周期定常では，吹き返した熱は全量が筒内へ戻る．実機ではポート壁への放熱で一部が失われるので，吹き返しによる吸気の加熱の上限の見積もりである．吸気側の容積の密度は T_in で評価したままで，温度上昇による密度の低下は扱わない．</p><p><b>吸気ランナ（慣性過給）</b>：マニホールドと吸気弁の間の長さ L_r，内径 d_r の管の中のガス柱を，質量を持つ柱として扱う．柱の運動方程式（Newton の第2法則）から，</p>${M('{d ṁ_r|d t} = {A_r|L_r}(p_in − p_p) − {ζ ṁ_r |ṁ_r||2 ρ_r A_r L_r}')}<p>ζ = f_r L_r/d_r + ζ_e，f_r = ${dc('fr')}，ζ_e = ${dc('ze')}．弁側半分の容積 V_p = A_r L_r/2 をポートとし，その圧力は断熱の剛性で変わる．</p>${M('{d p_p|d t} = {γ_p R T_in|V_p}(ṁ_r − ṁ_in)')}<p>γ_p = ${dc('gp')}（集中定数の剛性の定数）．吸気弁の流量 ṁ_in は p_p を上流圧として §5 の式で求め，マニホールドの式の ṁ_in は ṁ_r に替える．既燃ガスはポートでも追跡する（m_bp．Y_r は ṁ_r ≥ 0 なら Y_bi，ṁ_r &lt; 0 なら Y_bp）．</p>${M('{d m_bi|d t} = −ṁ_r Y_r + min(0, ṁ_th) Y_bi,  {d m_bp|d t} = ṁ_r Y_r − ṁ_in Y_v')}<p>弁が閉じているとき，ランナは次の角振動数で共鳴する．</p>${M('ω_H = [{A_r|L_r}({γ_p R T_in|V_p} + {R T_in|V_in})]')}<p>弁が開くと筒内容積が加わって振動数が下がり，その周期が吸気行程と合う回転数で充填が増える．ランナを長くすると，この回転数が下がる．1次元の圧力波は解かない集中定数近似である．</p>${src('go')}
${H3(7,'筒内組成（未燃ガスと既燃ガス）','06')}<p>筒内の全質量 m と未燃ガス（新気）の質量 m_u を追跡し，残留ガス率を求める．吸気弁の順流は弁のすぐ上流の組成（既燃ガス分率 Y_v，§6）で入り，逆流は筒内の組成で出る．排気弁の逆流は既燃ガスだけとする．順流の場合を示す．</p>${M('{d m|d t} = ṁ_in − ṁ_ex')}${M('{d m_u|d t} = (1 − Y_v) ṁ_in − Y_u ṁ_ex − m_0 {d x_b|d t}')}${M('Y_u = {m_u|m},  x_r = 1 − Y_u')}<p>m_0 は吸気弁が閉じた時点の未燃ガスの質量で，Wiebe 関数の燃焼割合 x_b（§8）に従って既燃ガスに変わる．</p>${src('hw')}
${H3(8,'燃焼（Wiebe 関数）','07')}<p>質量燃焼割合を Wiebe 関数で与える．</p>${M('x_b = 1 − exp(−a z^{m_w + 1}),  z = {θ − θ_0|Δ θ_b}')}${M('Q_c = m_f H_u η_c ε_r {d x_b|d t}')}<p>a = ${dc('wa')}，H_u = ${dc('hu')} MJ/kg，η_c = ${dc('etac')}．燃焼割合は 99.3% で打ち切るので，η_c と合わせて，供給した燃料の発熱量のうち 96.3% が発熱する（φ ≤ 1 のとき）．</p><p>着火遅れと燃焼期間は，点火の時点の層流燃焼速度 S_L と乱れ強さ u から決める．S_L は Metghalchi と Keck の相関（定数は Turns の教科書の gasoline の組）で，当量比 φ，点火の時点の筒内の温度 T と圧力 p，残留ガス率 x_r の関数である．</p>${M(`S_L0 = max(0.05, ${SLC.Bm} − ${-SLC.B2} (φ − ${SLC.phm})^2)`)}${M(`S_L = S_L0 ({T|298})^{2.18 − 0.8(φ − 1)} ({p|101325})^{−0.16 + 0.22(φ − 1)} max(0.15, 1 − ${SLC.dil} x_r)`)}${M(`Δ θ_d = c_d {l_k ω|S_L + C_k u},  Δ θ_b = {f_ret l_c ω|c_b S_T},  S_T = S_L + ${K.Ct} u`)}<p>S_L0 と S_L の単位は m/s，この式の T は K，p は Pa．定数は ${dc('bm')}，${dc('b2')} m/s，${dc('phm')}，希釈の係数 ${dc('dil')}，乱流の係数 ${dc('ct')}．l_k = ${dc('lk')}B，C_k = ${dc('ck')}，l_c = 0.65B，u は平均ピストン速度の 1/2．c_d，c_b は設定「燃焼速度」の調整係数．形状係数 m_w が大きいほど，熱発生のピークが燃焼期間の後ろへ寄る．</p><p>当量比 φ > 1（リッチ）では酸素が足りず，燃料の一部が CO と H₂ のまま残る．燃料 1 mol（CH₁.₈₇）あたりの生成物を元素保存と水性ガスシフト平衡（K = 3.5）で決め，燃え残りの発熱量を差し引く係数 ε_r を掛ける．</p>${M('ε_r = 1 − {n_CO h_CO + n_H2 h_H2|M_f H_u}')}<p>空気量あたりの熱発生 φ ε_r は φ = 1 で最大になり，1.1 で 0.969，1.2 で 0.938 に下がる．生成物のモル数増加は扱わないので，実機（φ ≈ 1.1 で出力最大）より出力の最大がやや薄い側にある．</p>${src('hw','mk','tn')}
${H3(9,'壁面熱伝達と壁温','08')}<p>Woschni の式で熱伝達率を与え，壁温は集中熱容量で解く．</p>${M('h = C_w 3.26 B^{−0.2} p^{0.8} T^{−0.55} w^{0.8}')}${M('w = C_1 c_m + C_2 {V_d T_1|p_1 V_1} max(0, p − p_mot),  p_mot = p_1 ({V_1|V})^{1.33}')}${M('Q_w = h A_w (T − T_w)')}${M('C_h {d T_w|d t} = Q_w − G_h (T_w − T_c)')}<p>h の式の p は kPa．p_1，V_1，T_1 は吸気弁が閉じた時点の筒内の状態で，p_mot は燃焼が無いとしたときの圧力の見積もり（ポリトロープ指数 1.33）．C_1 はガス交換期間 ${dc('c1s')}，圧縮・膨張期間 ${dc('c1g')}．C_2 = ${dc('c2')}（燃焼項は圧縮・膨張期間のみ）．冷却水温 T_c は一定である．</p>${src('wo','hw')}
${H3(10,'筒内圧力方程式','09')}<p>開いた系の熱力学第一法則と状態方程式から導く．比熱が温度と組成で変わるので，顕熱の内部エネルギー e_u，e_b（§3）を使う．未燃ガスは，燃えて既燃ガスになるときに単位質量あたり q_u の熱を出すとすると，筒内の全エネルギーの収支は次のとおり（順流の場合．右辺は順に，膨張の仕事，壁への熱，吸気弁から入るエネルギー，排気弁から出るエネルギー）．</p>${M('{d|d t}(m_u (e_u + q_u) + (m − m_u) e_b) = −p {d V|d t} − Q_w + ṁ_in (h_s + (1 − Y_v) q_u) − ṁ_ex (Y_u (h_u + q_u) + (1 − Y_u) h_b)')}<p>左辺を m と m_u の式（§7）で展開すると，流れが運ぶ q_u の項は両辺で消え，燃えた分の ${Mi('m_0 {d x_b|d t}(q_u + e_u − e_b)')} が残る．${Mi('m_0 {d x_b|d t} q_u')} は熱発生率 Q_c（§8）である．h_u − e_u = h_b − e_b = RT を使うと</p>${M('m c_v {d T|d t} = Q_c + m_0 {d x_b|d t}(e_u − e_b) − Q_w − p {d V|d t} + ṁ_in (h_s − (1 − Y_v) e_u − Y_v e_b) − ṁ_ex R T')}<p>${Mi('m_0 {d x_b|d t}(e_u − e_b)')} は，未燃ガスと既燃ガスが同じ温度で持つ顕熱の差で，組成が変わることによる項である．T = pV/(mR) を時間微分して代入し，R/c_v = γ − 1 を使って整理すると次式を得る．</p>${M('{d p|d t} = −γ {p|V}{d V|d t} + {γ − 1|V}(Q_c + m_0 {d x_b|d t}(e_u − e_b) − Q_w + H_in − H_ex)')}${M('H_in = ṁ_in (h_s − (1 − Y_v) e_u − Y_v e_b + c_v T),  H_ex = ṁ_ex c_p T')}<p>逆流では，吸気弁は筒内のガスが出るので H_in = ṁ_in c_p T，排気弁は温度 T_X の既燃ガスが入るので H_ex = ṁ_ex (h_X − e_b + c_v T) とする（h_X は h_b の T_X での値）．定比熱比モデルでは，流入の項は c_p に上流温度を掛けた形に帰着する．</p><p><b>第一法則の検査</b>：顕熱エネルギー U_s について，上の式から「U_s の増分 = −（膨張の仕事）−（壁への熱）+（発熱）+（流入の顕熱エンタルピー）−（流出の顕熱エンタルピー）」が成り立つ．各項を補助積分（§14）で積分し，この残差が発熱の 10⁻⁴ 以下であることを検証タブの TEST-09 で確かめている．</p>${M('U_s = m_u e_u + (m − m_u) e_b')}${src('hw','ke')}
${H3(11,'回転運動・スターター・摩擦','10')}<p>クランク軸まわりの運動方程式．摩擦は Chen–Flynn 型で与える．</p>${M('I_t {d ω|d t} = T_i + T_s − T_f − T_aux − T_d')}<p>T_aux は補機（オルタネータ・ポンプ類）の負荷トルクで，回転中は一定値（設定）とする．</p>${M('T_i = (p − p_a){d V|d θ}')}${M('T_s = T_k (1 − {ω|ω_k})')}${M('FMEP = F_0 + F_1 p_max + F_2 c_m,  T_f = {FMEP V_d|4π}')}<p>T_k = ${dc('tst')} N·m，ω_k = ${dc('wnl')} rad/s．F_0 = ${dc('cfa')} kPa，F_1 = ${dc('cfb')}，F_2 = ${dc('cfc')} kPa·s/m．スターターは完爆判定後に切り離す．</p>${src('cf','hw')}
${H3(12,'水ブレーキ動力計と運転モード','11')}<p>吸収専用の負荷装置．充水率に比例し，回転数の2乗に比例するトルクを吸収する．</p>${M('T_d = f_e k_w ω^2,  k_w = {T_r|ω_r^2}')}${M('τ_d {d f_e|d t} = f_c − f_e')}<p>モードA：スロットル PI が回転数を制御し，f_c は手動値で一定．モードB：α は手動値で一定，次の PI が回転数を保持する．</p>${M('f_c = clamp(f_b + K_pd e_d + I_f, 0, 1)')}${M('{d I_f|d t} = K_id e_d,  e_d = N̄ − N_t')}<p>飽和を深める向きの偏差では積分を止める．f_c が 1 に張り付いて回転が下がらなければ OVERLOAD，0 に張り付いて上がらなければ UNDERPOWER を表示する．</p>${src('mp')}
${H3(13,'ECU（スロットル開度 PI 制御）','12')}<p>モードAで，平均回転数を目標に保つ．</p>${M('α = clamp(α_f + K_p e + I_α, α_min, α_max)')}${M('{d I_α|d t} = K_i e,  e = N_t − N̄')}${M('τ_N {d N̄|d t} = N − N̄')}<p>補機負荷 T_aux に応じて基準の開度を上げ（feedforward），開度に下限を設ける．完爆直後に回転が吹け上がっても全閉にならず，吸気管圧が枯渇しないので，負荷が大きくても始動できる．ECU は T_aux を正確に知っているとする．k_T = 0.26 °/(N·m)，δ_α = 1° は定数である．</p>${M('α_f = α_b + k_T T_aux')}${M('α_min = min(α_max, max(0, α_f − δ_α))')}<p>点火時期の自動最適化（ON のとき）：各サイクルの質量燃焼割合 50% の時期 θ_50 を上死点後 10° に合わせるよう，点火進角 s をサイクルごとに補正する．ノッキングは考慮しない．</p>${M('θ_50 = θ_0 + Δ θ_b ({ln 2|a})^{1|3}')}${M('s ← s + k_s (θ_50 − θ_t)')}<p>本モデルで点火時期を掃引すると，IMEP 最大の θ_50 は上死点後 8〜13° にあり，10° を目標にしたときの IMEP の低下は 0.5% 未満だった．</p>${src('go')}
${H3(14,'数値積分','13')}<p>RK4（固定刻み）と Dormand–Prince 5(4)（DOPRI5，刻みの自動調整．既定）を選べる．</p>${M('y_1 = y_0 + {Δ t|6}(k_1 + 2 k_2 + 2 k_3 + k_4)')}${M('Δ t = min({Δ θ_s|max(ω, ω_min)}, Δ t_max)')}<p>RK4 の刻みは，クランク角の刻み Δθ_s（設定，既定 0.25°）から決め，ω_min = ${dc('wmin')} rad/s，Δt_max = ${dc('dtr4')} μs で頭打ちにする．Δt_max は系の硬さで決まる．弁の前後の圧力がほぼ等しいとき，筒内とポートの間のやりとりが最も速く，ヤコビアンの固有値の絶対値は最大で約 7×10⁴ /s になる．RK4 の安定限界（固有値と刻みの積が 2.79 以下）の内側に収まるように選んだ．</p><p>DOPRI5 は，5 次の解と 4 次の解の差を許容誤差で割った値の最大 E が 1 以下なら採用し，次の刻みを次式で決める．刻みの上限は 0.5°CA と 1 ms の小さい方で，ほとんどのステップはこの上限で進む．</p>${M('Δ t_n = Δ t min(2.5, max(0.2, 0.9 E^{−1|5}))')}<p><b>イベント</b>：サイクルの終端（θ = 4π），吸気弁と排気弁の開閉，点火の角度では，右辺が折れるか，状態の記録や切替が起きる．ステップは，これらの角度をまたがず，ちょうどその角度で終わるように刻みを調整する．イベントでの処理（吸気弁が閉じた時点の状態の記録，着火遅れと燃焼期間の計算，サイクルの集計）は，その角度の状態で行う．サイクルの終端で θ から 4π を引く．</p><p><b>補助積分</b>：仕事，各断面を通った質量，熱と流れのエネルギーなど，サイクルの集計と保存則の検査に使う量は，状態と同じ Runge–Kutta の重みで同時に積分する．集計は状態と同じ次数になり，質量とエネルギーの収支はステップごとに丸め誤差の範囲で閉じる．</p><p>ECU と動力計の状態（平均回転数，積分項，充水率）はステップの終わりに更新し，ステップの間は一定とする．筒内の最高圧は，ステップ点の極大とその前後の 3 点を通る放物線の頂点で求める．</p>${src('dp')}
${H3(15,'評価指標','14')}<p>サイクルの終端ごとに，補助積分（§14）の 1 サイクルの増分から求める．圧力の表示は kPa．</p>${M('IMEP = {W_i|V_d},  FMEP = {W_f|V_d},  AMEP = {4π T_aux|V_d}')}${M('BMEP = IMEP − FMEP − AMEP')}${M('T_b = {BMEP V_d|4π},  P_b = {BMEP V_d|t_c}')}${M('η_m = {BMEP|IMEP},  bsfc = {ṁ_f|P_b},  η_b = {P_b|ṁ_f H_u},  η_i = {W_i|m_f H_u}')}${M(`η_v = {m_0|(1 + φ/${K.AFR}) ρ_a V_d},  ρ_a = {p_a|R T_a}`)}<p>W_i は 1 サイクルの p dV の積分（ポンプ損失を含む正味の図示仕事）．AMEP は補機の負荷．η_v の分子は吸気弁が閉じた時点の未燃ガスのうちの空気の質量（量論空燃比 ${dc('afr')}）．発熱の分母は供給した燃料の発熱量なので，燃え残りと燃焼効率の損失は効率に現れる．指標は，完爆後の直近 10 サイクルの平均を表示する．</p>${src('hw')}
${H3(16,'エンジン音','21')}<p>設定「音響」の「音の種類」で，計算（以下の式による音．既定）と演出を切り替える．演出は，聞いて心地よいように作った 4 気筒風の音で，物理モデルではない．計算から受け取るのは 1 気筒分の排気流量の波形，回転数，吸気管圧だけで，気筒数，歪み，共鳴，吸気音，アクセルオフの破裂音は演出である．演出は機関の計算に影響しない．以下は計算の音の説明である．</p><p>直前のサイクルの排気流量から1サイクル分の波形を作り，現在の回転数の実時間の速さで繰り返し鳴らす．再生速度によらず，800 rpm は 800 rpm の音になる．</p>${M('q = {d ṁ_ex|d θ} ω')}${M('Δ ψ = {1440 N̄|120 f_s}')}<p>1サンプルごとに位相 ψ を進めるので，音の周期は 120/N̄ 秒（爆発の周期）．約 20 Hz（2400 rpm）より遅い爆発は個々の「トトト」として，速い爆発は音の高さとして聞こえる．</p><p>排気管は，弁側を閉端・出口を開放端とする管として，往復遅延と反射で表す．反射には消音器の吸収 ρ_m と，周波数が高いほど大きい管内損失（管壁の粘性・熱伝導と開口端からの放射）を掛ける．</p>${M('v(k) = q(k) − ρ_m H(f) v(k − D),  D = {2 L f_s|c}')}${M('|H(f)| = exp(−2 α_w L − {(π f d_e)^2|2 c^2})')}${M('α_w = {[π f ν]|(d_e/2) c}(1 + {γ − 1|[P_r]})')}${M('f_n = {(2n − 1) c|4 L},  c = [γ_b R T_e]')}<p>音速の γ_b は既燃ガスの T_e での値（§3）．管壁の減衰の式の γ は 1.35（音響の損失の定数）．</p><p>|H(f)| は 1 kHz での値が一致する一次低域フィルタで近似する．</p><p>音量は，ピーク包絡に追従する圧縮器でそろえる．包絡は 0.2 s 保持するので，1 サイクルの中では利得が一定で，波形の衝撃性（波高率）を損なわない．</p>${M('e_p = max(|x_c|, e_p exp(−{1|f_s τ_r}))')}${M('G = min(1, ({l_t|e_p})^{3/4})')}${M('p_s = tanh(g G x_c)')}<p>実機の燃焼はサイクルごとにばらつく．サイクル変動を ON にすると，各サイクルの振幅と周期を次のようにずらす（擬似乱数の種は固定）．</p>${M('A_j = 1 + 0.03 z_1,  P_j = {120|N̄}(1 + 0.005 z_2)')}<p>既定の L = 1 m で第1共鳴は約 ${(cEx()/4).toFixed(0)} Hz．スマートフォンの内蔵スピーカーは低音が弱いので，ヘッドホンを推奨する．</p>${src('ki')}<p><b>演出音の処理</b>（音の種類を「演出」にしたとき．物理モデルではなく，定数はすべて試聴で決めた）．計算から受け取るのは，1 気筒分の音源 ${Mi('q')}（上の式），平均回転数 ${Mi('N̄')}，吸気管圧 ${Mi('p_in')} の 3 つだけである．吸気管圧から負荷の目安 ${Mi('l_d')}（アイドルと減速で 0，全開で 1）を作り，以下の段で使う．</p>${M('l_d = clamp({p_in/p_a − 0.3|0.6}, 0, 1)')}<p>1 気筒の波形を，クランク角 180° ずつずらして 4 本足す（4 気筒化）．爆発の周波数は単気筒の 4 倍の ${Mi('N̄')}/30 Hz になる．気筒ごとに利得 ${Mi('g_k')} と排気管の遅れ ${Mi('τ_k')} をわずかに変え，サイクル変動 ON では振幅 ${Mi('a_k')} を ±${FLV.jit*100}% ばらつかせる．</p>${M('x_4 = G_x λ_l λ_N Σ g_k a_k q(ψ(t − τ_k) + 360 k)')}<p>${Mi('λ_l')} はアクセルオフで音を小さくする係数（低回転では小さくしない），${Mi('λ_N')} は回転数による音量差を縮める係数である．</p>${M('λ_l = λ_0 + (1 − λ_0) clamp({1600 − N̄|700}, 0, 1),  λ_0 = 0.2 + 0.8 l_d^{0.8}')}${M('λ_N = min(6, ({3500|N̄})^{0.9})')}<p>これに雑音と破裂音を足し，歪ませる．歪みの深さ ${Mi('κ')} は負荷と回転数で増える（踏むほど，回すほど荒くなる）．2 乗の項は波形を非対称にして偶数次の倍音を足す．</p>${M('κ = 2.6 (0.25 + 0.75 l_d)(0.4 + 0.6 min(1, {N̄|6000}))')}${M('u_d ← {tanh(κ (u_d + 0.35 u_d^2))|max(0.2, tanh κ)}')}<p>破裂音は，負荷がほぼ 0（${Mi('l_d')} &lt; 0.08）で 2200 rpm を超えているとき，各気筒の爆発のたびに確率 ${Mi('P_o')} で起こす．実機の減速時の後燃えを模した演出で，モデルの中では何も燃えていない．</p>${M('P_o = 0.5 min(1, {N̄ − 2200|2000})')}<p>その後，短い集合管の共鳴（上の式と同じくし形フィルタ），帯域ごとの共鳴，負荷で開く低域通過（遮断周波数 ${Mi('f_L')}），吸気音，低域の持ち上げを順に通し，計算の音と同じ圧縮器で音量をそろえる．</p>${M('f_L = 1400 + 7600 l_d^{0.7} (0.5 + 0.5 min(1, {N̄|5000}))')}<div class="tw"><table><tr><th>段</th><th>処理</th><th>聞こえ方</th></tr><tr><td>1</td><td>吸気管圧 → 負荷の目安</td><td>踏んでいるか離しているかで以下を変える</td></tr><tr><td>2</td><td>4 気筒化と音量配分</td><td>音の高さが 4 倍．減速中は静かに，アイドルは聞こえる大きさに</td></tr><tr><td>3</td><td>雑音（1.5〜7 kHz）</td><td>排気の流れの「シャー」</td></tr><tr><td>4</td><td>破裂音</td><td>アクセルオフの「パラパラ」</td></tr><tr><td>5</td><td>歪み</td><td>踏むほど，回すほど荒くなる</td></tr><tr><td>6</td><td>集合管の共鳴</td><td>硬く張った音</td></tr><tr><td>7</td><td>帯域ごとの共鳴</td><td>95・190 Hz が低音，1150・2600 Hz が高回転の甲高さ</td></tr><tr><td>8</td><td>負荷で開く低域通過</td><td>離すとこもり，踏むと開ける</td></tr><tr><td>9</td><td>吸気音</td><td>全開の「クォー」</td></tr><tr><td>10</td><td>低域の持ち上げ，圧縮器</td><td>低音の底上げ，音量をそろえる</td></tr></table></div><div class="tw"><table><tr><th>定数</th><th>値</th></tr><tr><td>気筒数</td><td>4</td></tr><tr><td>気筒ごとの利得</td><td><span data-fl="hg">${FLV.hg.join('，')}</span></td></tr><tr><td>気筒ごとの遅れ [ms]</td><td><span data-fl="hd">${FLV.hd.map(v=>+(v*1e3).toFixed(3)).join('，')}</span></td></tr><tr><td>集合管の長さ [m]，反射率</td><td><span data-fl="L">${FLV.L}</span>，<span data-fl="r">${FLV.r}</span></td></tr><tr><td>歪みの深さの最大，非対称の係数</td><td><span data-fl="drive">${FLV.drive}</span>，<span data-fl="asym">${FLV.asym}</span></td></tr><tr><td>共鳴（中心周波数 Hz／Q／利得 dB）</td><td><span data-fl="form">${FLV.form.map(f=>f.join('／')).join('，')}</span></td></tr><tr><td>低域通過の遮断周波数の範囲 [Hz]</td><td><span data-fl="dark">${FLV.dark}</span>〜<span data-fl="bright">${FLV.bright}</span></td></tr><tr><td>雑音の量，吸気音の量</td><td><span data-fl="noise">${FLV.noise}</span>，<span data-fl="intake">${FLV.intake}</span></td></tr><tr><td>破裂音の確率の最大，大きさ</td><td><span data-fl="pop">${FLV.pop}</span>，<span data-fl="popG">${FLV.popG}</span></td></tr><tr><td>低域の持ち上げ（周波数 Hz／利得 dB）</td><td><span data-fl="shelf">${FLV.shelf.join('／')}</span></td></tr></table></div><p>4 気筒の爆発の周波数は 6500 rpm で 217 Hz なので，高回転ではそれより低い音はほとんど出ない．演出は機関の計算には影響しない．演出のときは，排気管長・内径・反射率・流れ雑音の設定は使わない．</p>${H3(17,'排気系（排気管の脈動と背圧）','27')}<p>排気弁の下流に，排気管（長さ L_e，内径 d_e．音響の設定と共用），消音器（容積 V_m），出口（有効面積 A_t）を置く．排気管のガス柱の運動方程式と，排気ポート（排気管の弁側半分の容積 V_pe）と消音器の圧力の式を解く．排気系のガス温度は T_X 一定．</p>${M('{d ṁ_e|d t} = {A_e|L_e}(p_pe − p_m) − {ζ_x ṁ_e |ṁ_e||2 ρ_e A_e L_e}')}${M('{d p_pe|d t} = {γ_p R T_X|V_pe}(ṁ_ex − ṁ_e),  {d p_m|d t} = {R T_X|V_m}(ṁ_e − ṁ_t)')}<p>ṁ_ex は p_pe を下流圧とする排気弁の流量（§5），ṁ_t は p_m から大気圧への出口の流量（§5 の式，流量係数 ${dc('cdx')}）．背圧はおおむね出口の流量の2乗に比例し，アイドルではほぼ 0，全開・高回転で大きくなる．弁が閉じているとき，排気管は次の角振動数で共鳴する．</p>${M('ω_E = [{A_e|L_e}({γ_p R T_X|V_pe} + {R T_X|V_m})]')}<p>ζ_x = f_r L_e/d_e + ζ_e，ρ_e = p_pe/(R T_X)．OFF のときは排気弁の下流圧を p_a + Δp_x（一定）とする．</p>${src('hw')}<p class="src lic">数式の組版：MathJax 3.2.2（Apache License 2.0，https://www.mathjax.org/）を，解説タブを初めて開いたときに cdnjs（https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js）から読み込む．フォントや MathJax は成果物に含めていない．読み込めないときは数式を TeX のソースで表示する．</p>`;inlineMath($('dv0'));docVals();DV.pend=[...$('dv0').children].slice(2);DV.pend.forEach(e=>e.style.display='none')}
